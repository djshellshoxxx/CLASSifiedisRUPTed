name: BlindMatch diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/blindmatch-diagnostic.yml'
      - 'tests/browser/blindmatch-ui.spec.ts'
      - 'apps/pwa/src/blindmatch*.ts'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  editor-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
      - run: corepack pnpm install --frozen-lockfile
      - name: Locate the browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"
      - name: Restore the pinned browser download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/pw-browsers
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browser
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Diagnose the existing editor journey
        run: corepack pnpm exec playwright test tests/browser/blindmatch-ui.spec.ts --project=chromium --grep 'private local editor preserves exact filters' --trace on --reporter=line
      - name: Keep diagnostic failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blindmatch-diagnostic-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
