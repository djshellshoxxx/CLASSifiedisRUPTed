name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '[0-9][0-9]_*/**', 'planning/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '[0-9][0-9]_*/**', 'planning/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.28.0

jobs:
  check:
    name: Typecheck, gates, unit/property tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:boundaries
      - run: node tools/traceability.mjs --check
      - run: pnpm test
      - name: Dependency audit (high and critical)
        run: pnpm audit --prod --audit-level high
      - name: Build relay and PWA
        run: pnpm --filter @classrup/relay build && pnpm --filter @classrup/pwa build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            apps/relay/dist
            apps/pwa/dist
          retention-days: 7

  e2e:
    name: Playwright mobile e2e + accessibility
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: apps
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @classrup/pwa exec playwright install --with-deps chromium
      - run: pnpm --filter @classrup/pwa e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/pwa/playwright-report
          retention-days: 7
