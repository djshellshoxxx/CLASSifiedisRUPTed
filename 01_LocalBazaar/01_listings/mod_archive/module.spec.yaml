  import_export_backup_rollback:
    requirements:
      - "The user export contains all ArchiveRecords of own listings."
      - "Import keeps restoreUntil and purgeAt as exported and immediately purges records already past purgeAt."
      - "Schema changes follow expand/contract and keep v1 readable for 180 days."
