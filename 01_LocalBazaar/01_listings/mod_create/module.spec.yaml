    acceptance:
      - All tests T01-T22 pass in CI.
      - No draft or listing payload leaves the device from this module (network spy test).
      - No stored Listing field can hold coordinates or an address, region cells never exceed 5 characters, and no relay notice changes Listing.status.
  import_export_backup_rollback:
    requirements:
      - The user export contains every own Listing in section bazaar.listings of classrup-export/v1.
      - Import validates schema version, id collisions and ownerId; foreign-owned records are never made editable.
      - Schema changes follow expand/contract and keep v1 readable for 180 days.
    export: "Section bazaar.listings in classrup-export/v1, one JSON line per Listing (schema classrup.bazaar.listing_record/v1); drafts are included because the export is P3 and goes only to the user."
    import: "Skip identical ids, reject conflicting ids with a dry-run report; listings whose ownerId differs from the importing principal are stored as read-only history."
    backup: "The vault export is the primary backup (IOX-6); the app warns when the last export is older than 30 days; no relay holds drafts."
    migration_rollback: "Additive optional fields only within v1; older app builds ignore unknown optional fields; rollback is by reinstalling the previous release and re-importing the last export. Records written under the earlier name classrup.bazaar.listing/v1 are read as classrup.bazaar.listing_record/v1 for 180 days, and their earlier mediaRefs string list is read as media entries with ref only (no alt, decorative absent) so the owner is asked for descriptions before publishing."
