id: F01.S01.M03
scope: MVP
summary: >-
  Turns a local draft into a public offer to the world. Publishing runs local checks before anything leaves the
  vault (prohibited-item rules and jurisdiction notices from F18, local spam heuristics, the in-process risk
  assessment of F12.S03.M01, the federation consent purpose of F10.S01.M01 and the public-cell assertion of
  F06.S02.M01), then signs a public projection of the listing as a classrup.bazaar.listing/v1 statement
  (CTR-FED-001 envelope, Ed25519 over JCS) with an exact allowlist of P0 keys, distinct from the private vault
  record classrup.bazaar.listing_record/v1, and queues it to the relays the user selected. Unpublishing signs a
  tombstone. Each destination relay applies its own hosting policy and may refuse or remove the projection; such a
  relay-signed notice changes only that relay's delivery state, never the owner's records. The owner sees
  per-relay sync state (prepared, transport_acknowledged, peer_accepted) and never more certainty than that.
  Optional promotion is a relay-local policy whose fee is claimed through a noncustodial Deal and is shown only after
  the relay signs it. Copies already fetched by other vaults cannot be recalled.
responsibilities:
  - Own PublicationRecord: one record per publish attempt with verdict, signed statement digest, expiry (default 30 days, range 1 to 90) and per-relay delivery states.
  - Evaluate prohibited-item rules (F18.S01.M02), jurisdiction notices (F18.S01.M01), local spam heuristics (moderation.spam.evaluate of F12.S02.M02, N19), the risk assessment (moderation.risk.assess of F12.S03.M01, N19), the federation consent purpose (F10.S01.M01, N6) and the public-cell assertion (F06.S02.M01, N8) before signing; block, hold for owner confirmation, or allow.
  - Build the projection from an exact P0 allowlist (maximum location L2, EXIF-free media, mailbox hints, barterAcceptable, in-stock flag, kind-specific public subsets) and sign and queue it and tombstones through the sync outbox.
  - Renew a publication (last 7 days of life, +30 days, maximum 3 renewals and 120 days in total), also on request of the F01.S01.M04 expiry deferral.
  - Record optional per-relay promotion whose fee is claimed through a Deal with the relay operator (F09), active only on that relay's signed promotion statement and revocable by it.
  - Verify inbound relay-signed hosting notices and promotion statements, quarantine anything not signed by the relay of that delivery, and react to policy pack changes without claiming any global takedown.
non_responsibilities:
  - Listing record and status field (F01.S01.M01); this module requests changes through apply_status and never because of a relay notice.
  - Expiry sweep, archive, restore and close (F01.S01.M04), which calls bazaar.publication.end here before closing or archiving.
  - Relay-side indexing, ranking and hosting decisions (F06 and F12 on the relay); this module only submits and records outcomes.
  - Payment handling (F09.S01.M01); promotion uses a Deal and payment claim between the user and the relay operator, never platform custody.
  - Variant data, which F01.S03.M02 contributes to the projection through the ProjectionContributorPort it registers here.
  - Federation transport between relays (F11).
  - "Future: scheduled publication at a chosen time; multi-author shop accounts."
depends_on: [F01.S01.M01, F01.S02.M01, F01.S02.M02, F01.S02.M03, F01.S03.M01, F18.S01.M01, F18.S01.M02, F18.S01.M03, F12.S02.M02, F12.S03.M01, F10.S01.M01, F06.S02.M01, F08.S01.M01, F09.S01.M01, F16.S02.M03, F11.S01.M01, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-PRV-001, CTR-FED-001, CTR-COM-001, CTR-SCH-001]
user_stories:
  - As a seller, I publish a listing to one or more relays I choose and see for each relay whether it was only sent, received by the relay, or accepted.
  - As a seller, if a rule blocks my listing I see which policy reason applies and what to change.
  - As a seller, I can unpublish and understand that people who already saw it may still have a copy.
  - As a seller, I can pay a relay operator for a promoted slot and see 'Promoted on R' only after that relay signs it.
  - As a seller, if one relay removes my listing under its policy, my listing stays published on my other relays and I can read that relay's signed reasons.
edge_cases:
  - Listing text matches a review-level rule; the owner sees the notice, must confirm explicitly, and the confirmation is recorded in the PublicationRecord.
  - Listing has no region cell or no sell terms for its kind; publish is refused with a specific code before any signing.
  - A relay rejects the projection under its own hosting policy; that delivery becomes relay_rejected with the relay's signed reason; other relays are unaffected and the local publication stays active.
  - The policy pack is updated while publications are active and a new block rule matches; the publication is ended locally with reason policy_changed and a tombstone is queued.
  - The same publish command is replayed after a crash; the original PublicationRecord is returned and exactly one statement exists in the outbox.
  - The device clock is more than 24 h off the median of the latest receipts of at least 2 relays; publish refuses with PRECONDITION_FAILED. With only one relay the UI warns instead, and a relay whose receipts run more than 24 h ahead of the median is flagged untrusted and ignored.
  - Federation opt-in is set but the federation_publish consent for a destination relay is missing; publish is refused with BAZAAR_PUBLISH_FEDERATION_CONSENT_REQUIRED and the UI links to the consent screen.
  - The risk assessment returns elevated for a new key posting many listings; the publication is held for confirmation instead of being signed.
  - A hosting notice for relay R2 arrives signed by relay R1 or by a random key; it is quarantined and no delivery changes.
  - A relay removed the listing; the next publish skips that relay and reports it in skippedRelays instead of failing for every relay.
  - Promotion claim is never acknowledged within 14 days; promotion becomes expired and the listing stays published unpromoted.
  - The owner unpublishes a listing that has an active deal hold; the command asks for confirmation and the hold stays valid.
ux:
  screens:
    - "Publish review sheet: summary of what becomes public (exactly the allowlisted fields, L2 area, mailbox hint), expiry selector 1 to 90 days, relay chooser with each relay's hosting policy link, federation opt-in toggle with consent status, required notices checklist."
    - "Policy result sheet: verdict (blocked, needs confirmation, allowed) with localized reason keys and a Fix action."
    - "Publication status card: per-relay state chips (prepared, relay received, accepted, rejected by relay, removed by relay with its signed reasons) and an honest note that copies already fetched cannot be recalled."
    - "Promotion sheet: tiers boost_7d and boost_14d, price from the chosen relay, Deal and payment claim steps, states requested, claimed, acknowledged, Promoted on R (only after the relay's signed statement), revoked."
  states: [loading, blocked, needs-confirmation, prepared, transport-acknowledged, peer-accepted, relay-rejected, relay-removed, unpublished, expired, frozen-fork, offline-pending, clock-warning]
  a11y:
    - State chips use text plus icon and are announced in an aria-live polite region when they change.
    - The review sheet is a dialog with focus trap and a visible heading; all actions are at least 44x44 px.
    - Policy reasons are plain-language sentences, not codes.
processes:
  domain_schema:
    requirements:
      - "A PublicationRecord captures one publish attempt: listing revision, policy verdict and ruleset version, expiry, federation opt-in, signed statement digest and per-relay delivery states."
      - "The signed projection contains only P0 fields, a region cell of at most L2 and the listing revision; it never contains drafts, exact address, contact data or offers."
      - "PublicationRecords are retained as evidence of what was published and when; delivery state is local knowledge and is labelled as such."
      - "The projection statement classrup.bazaar.listing/v1 has a closed key set equal to the allowlist in the note below, distinct from the vault record classrup.bazaar.listing_record/v1; maxBudget appears only when budgetVisible is true and no other key may be added without a schema version."
    entities:
      - name: PublicationRecord
        schema: classrup.bazaar.publication/v1
        storage: device
        privacy: P1
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — fixed local-vault tenant (ID-6)"
          - "listingId: uuidv7 — ref F01.S01.M01 Listing"
          - "ownerId: did:key — local principal; replaced by the deletion pseudonym in retained records on privacy.deletion.completed"
          - "listingRevision: int — Listing.revision signed in the projection"
          - "status: enum — submitted | held_for_confirmation | active | frozen | blocked | withdrawn | unpublished | ended"
          - "verdict: enum — allow | allow_with_notice | review | block"
          - "rulesetVersion: int — F18.S01.M02 ruleset version evaluated"
          - "matchedRuleKeys?: string[] — <= 10 rule keys"
          - "riskLevel?: enum — low | elevated | high (F12.S03.M01 result at publish)"
          - "acknowledgedNoticeIds?: string[] — <= 10 notice ids from the jurisdiction profile"
          - "ownerConfirmedAt?: timestamp — required when verdict is review or riskLevel is elevated or high"
          - "expiresAt: timestamp — publishedAt + 1..90 days, default 30"
          - "renewals: int — 0..3"
          - "federationOptIn: boolean — default false; true only with a granted federation_publish consent per relay"
          - "statementCid?: string — sha256- over JCS of the signed envelope"
          - "statementSeq?: int — per-author sequence (CTR-FED-001 FED-3)"
          - "deliveries: object[] — <= 10 items {relayId, syncState: prepared|transport_acknowledged|peer_accepted|relay_rejected|relay_removed, receiptAt?, reasonKey?, hostingRemoved?: {reasonKey, noticeCid, actionId}, clockTrust: trusted|untrusted}"
          - "promotion?: object — {relayId, operatorDid, tier: boost_7d|boost_14d, dealId, claimId?, state: requested|claimed|acknowledged|active|revoked|ended|expired, promotionCid?, activeUntil?, revokeReason?}"
          - "endReason?: enum — owner | policy_changed | expired | closed | archived | account_deleted"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - At most one PublicationRecord per listing has status active, frozen or held_for_confirmation.
          - status active implies statementCid, statementSeq and at least one delivery are set.
          - verdict review or riskLevel elevated or high implies ownerConfirmedAt is set before status active; verdict block implies status blocked.
          - receiptAt on a delivery is the relay clock and is never used to order events; a delivery with hostingRemoved has syncState relay_removed and never changes status.
          - promotion.state active implies promotionCid names a verified statement signed by the key of promotion.relayId; it never derives from a payment event alone.
    note: >-
      Projection allowlist (classrup.bazaar.listing/v1 payload, closed key set): listingId, kind, title, description,
      categoryId, condition?, mediaRefs, tags, locale, regionCell (length 4 or 5), subtypeRef? (service, rental, auction),
      listingRevision, publishedAt, expiresAt, inStock (boolean from F01.S03.M01 at signing), barterAcceptable (from
      SellTerms or WantSpec, false otherwise), mailboxHints [1..3 {relayId, mailboxId}] (F08.S01.M01 registrations of the
      author, for end-to-end delivery), federationOptIn, and one kind subset: sell {askingPrice, acceptedCurrencies,
      paymentMethods, cryptoAssets?, negotiable, pickup, delivery, deliveryNote?}; variants [{variantId, label,
      attributes, price?, inStock}] (contributed by F01.S03.M02 through the ProjectionContributorPort); want {categoryId,
      keywords, minCondition, quantityWanted, barterAcceptable, barterNote?, maxDistanceBucket?, neededBy?, maxBudget?
      only when budgetVisible}; giveaway {selectionMode, queueLimit, closesAt?}. Never included: minOffer, pickupNote,
      quantities, holds, status, closeReason, currentPublicationId, drafts, offers or any P1 to P4 field. Field classes
      are annotated per F10.S02.M02.
    sql: |
      CREATE TABLE bazaar_publication (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, listing_id TEXT NOT NULL, owner_id TEXT NOT NULL,
        status TEXT NOT NULL, expires_at TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX bazaar_publication_live ON bazaar_publication(tenant_id, listing_id)
        WHERE status IN ('active','frozen','held_for_confirmation');
  validation_rules:
    requirements:
      - "Publication is allowed only for a complete listing whose kind-specific terms exist and whose region is at least L1."
      - "Policy checks run in the vault before signing and cannot be skipped by the caller."
      - "Every violation maps to one stable error code with a localized message key."
      - "Before anything leaves the vault, publish runs the in-process spam evaluation moderation.spam.evaluate and risk assessment moderation.risk.assess (N19), the federation_publish consent check when federation is opted in (N6) and assertPublicCell on the region (N8); an elevated spam score or risk level holds the publication for owner confirmation."
      - "The clock sanity check trusts no single relay: it compares the device clock with the median of the latest receipts from at least 2 distinct relays in the last 7 days, discards receipts more than 24 h ahead of that median and flags their relay untrusted, and only warns when fewer than 2 relays are available (ADR-0016 §5)."
      - "Unpublishing a listing that has active local inventory holds requires explicit owner confirmation; the holds stay valid and are listed."
    rules:
      - "V01 | listing status is draft, unpublished or expired; relays whose delivery for this listing has hostingRemoved are dropped from relayIds and reported in skippedRelays, and only an empty remaining relay list is refused | BAZAAR_PUBLISH_NOT_ALLOWED"
      - "V02 | title >= 3 and description >= 10 code points; kind sell has SellTerms, wanted has WantSpec, giveaway has GiveawayTerms | BAZAAR_PUBLISH_INCOMPLETE"
      - "V03 | regionCell present with length 4 or 5 and mediaRefs have no GPS tag | BAZAAR_PUBLISH_INCOMPLETE"
      - "V04 | category is active and, if restricted for the chosen jurisdiction profile, notices are acknowledged | BAZAAR_PUBLISH_BLOCKED"
      - "V05 | prohibited-item verdict is not block | BAZAAR_PUBLISH_BLOCKED"
      - "V06 | verdict review or risk level elevated or high requires ownerConfirmedAt | BAZAAR_PUBLISH_CONFIRMATION_REQUIRED"
      - "V07 | expiresInDays between 1 and 90 | VALIDATION_FAILED"
      - "V08 | 1 to 10 destination relays, each a user-selected relay known to the vault with a pinned signing key | VALIDATION_FAILED"
      - "V09 | vault has fewer than 100 active publications | BAZAAR_PUBLISH_LIMIT"
      - "V10 | publish and renew: device clock within 24 h of the median of the latest receipts from at least 2 distinct relays in the last 7 days, after discarding receipts more than 24 h ahead of that median (their relay is flagged untrusted); with fewer than 2 relays the UI warns and the command proceeds | PRECONDITION_FAILED"
      - "V11 | renew only in the last 7 days of life (or at expiry when requested by the F01.S01.M04 deferral), renewals < 3 and total life <= 120 days | BAZAAR_PUBLISH_RENEW_NOT_ALLOWED"
      - "V12 | moderation.risk.assess (F12.S03.M01, N19) for subject listing_publication returns low; elevated or high moves the record to held_for_confirmation before any signing | BAZAAR_PUBLISH_CONFIRMATION_REQUIRED"
      - "V13 | federationOptIn true requires privacy.consent.check {purpose federation_publish, relayId} to return granted for every destination relay (N6) | BAZAAR_PUBLISH_FEDERATION_CONSENT_REQUIRED"
      - "V14 | assertPublicCell(regionCell) of F06.S02.M01 accepts the cell (N8) before the projection is built | DISCOVERY_PRECISION_FORBIDDEN"
      - "V15 | unpublish of a listing with active local holds (F01.S03.M01 list_holds) requires confirmHolds true | BAZAAR_PUBLISH_HOLDS_ACTIVE"
      - "V16 | relay notice or promotion statement: Ed25519 signature over JCS verifies with the pinned key of deliveries[].relayId (rotation only when signed by the previous key), its target statementCid or listingId belongs to this publication, and its cid is new | VALIDATION_FAILED"
      - "V17 | the built projection's key set equals the allowlist exactly and maxBudget is present only when budgetVisible is true | VALIDATION_FAILED"
  workflow_state_machine:
    requirements:
      - "A PublicationRecord follows the declared machine; every other transition is refused with CONFLICT_STATE."
      - "Becoming active is atomic with Listing.apply_status to published and with queuing the signed statement."
      - "Per-relay delivery state is tracked inside the record and never changes the record status; a relay rejection or a relay-signed removal does not unpublish locally."
      - "Promotion is tracked per publication as requested, claimed, acknowledged, active, revoked, ended or expired; it becomes active only on a verified relay-signed promotion statement and the relay can revoke it."
    machines:
      - entity: PublicationRecord
        initial: submitted
        terminal: [blocked, withdrawn, unpublished, ended]
        transitions:
          - "submitted -> active | verdict allow or allow_with_notice and risk level low | sign statement, queue to relays, Listing draft/unpublished/expired -> published; emits bazaar.listing.published"
          - "submitted -> held_for_confirmation | verdict review, local spam heuristic or risk assessment elevated | owner must read notice and confirm"
          - "submitted -> blocked | verdict block | no statement signed"
          - "held_for_confirmation -> active | bazaar.publication.confirm by owner | same effects as submitted -> active"
          - "held_for_confirmation -> withdrawn | owner withdraws or 7 days pass | no statement signed"
          - "active -> active | bazaar.publication.renew by owner or by the F01.S01.M04 expiry deferral | new projection seq n+1 with new expiresAt; emits bazaar.publication.renewed"
          - "active -> unpublished | bazaar.publication.unpublish (confirmHolds when holds exist), bazaar.publication.end, or local policy pack block | sign tombstone, queue to relays, Listing -> unpublished; emits bazaar.listing.unpublished"
          - "active -> ended | consumes bazaar.listing.expired | expiry already announced; tombstone queued"
          - "active -> frozen | a forked statement chain (same seq, different prev) from another device of the principal is detected on sync | no further statements until the owner chooses"
          - "frozen -> active | owner keeps one chain | the other chain is superseded by a new signed projection seq n+1"
          - "frozen -> unpublished | owner discards both chains | tombstone queued; Listing -> unpublished; emits bazaar.listing.unpublished"
      - entity: PublicationRecord.promotion
        initial: requested
        terminal: [revoked, ended, expired]
        transitions:
          - "requested -> claimed | commerce.payment.claimed for the promotion Deal (contextRef listing_fee, publicationId) | claimId recorded; UI shows claim sent, never paid"
          - "claimed -> acknowledged | commerce.payment.acknowledged signed by promotion.operatorDid, or commerce.payment.finalized for a crypto claim | UI shows payment acknowledged, waiting for the relay"
          - "acknowledged -> claimed | commerce.payment.reorged for the claim | waits again"
          - "acknowledged -> active | verified relay-signed classrup.bazaar.promotion/v1 {relayId, publicationId, statementCid, tier, activeUntil, state: active} through receive_relay_notice | emits bazaar.publication.promotion_activated; UI shows Promoted on R"
          - "active -> revoked | verified relay-signed classrup.bazaar.promotion/v1 with state withdrawn (claim reorged or failed, or relay policy) | label removed with the relay's reason"
          - "active -> ended | activeUntil reached on the vault clock, or the publication leaves active | label removed"
          - "requested -> expired | no claim within 14 days, or commerce.deal.cancelled for the promotion Deal | listing stays published unpromoted"
          - "claimed -> expired | no acknowledgement within 14 days, commerce.payment.expired or commerce.payment.failed | listing stays published unpromoted"
          - "acknowledged -> expired | no relay promotion statement within 14 days of acknowledgement | owner is told to contact the operator; nothing claims promotion"
    timeouts:
      - "held_for_confirmation expires to withdrawn after 7 days."
      - "Delivery in prepared for more than 24 h without transport acknowledgement is flagged stale in the UI; it keeps retrying under CTR-IDM-001 backoff."
      - "Promotion in requested, claimed or acknowledged state for 14 days becomes expired; active promotion ends at activeUntil."
  commands_queries_events:
    requirements:
      - "publish, confirm, unpublish, renew and attach_promotion are vault commands; publish, unpublish and renew produce signed statements, confirm and attach_promotion produce them only as a consequence of publish or the Deal they open."
      - "Statements produced: classrup.bazaar.listing/v1 (projection, seq n) and classrup.federation.tombstone/v1; both go to the sync outbox with per-destination states."
      - "No relay command is required: relays accept statements through their own index endpoints defined in F06 and F11."
      - "Relay notices (classrup.moderation.reasons/v1, classrup.moderation.reversal/v1 and classrup.bazaar.promotion/v1) are accepted only through bazaar.publication.receive_relay_notice when signed by the pinned key of the relay of that delivery and targeting this publication's statementCid; they are deduplicated by cid, anything else is quarantined, and they change only that relay's delivery or promotion state (N17)."
      - "attach_promotion opens a noncustodial Deal with commerce.deal.open {contextRef {type: listing_fee, id: publicationId}, contextCid: statementCid, payee: the relay operator DID} (N5, FLOW-01); the vault never shows paid or promoted on the strength of a payment event."
    commands:
      - name: bazaar.publication.publish
        capability: bazaar.publication.publish
        input: "[vault-local + statement classrup.bazaar.listing/v1] { listingId, expectedRevision, relayIds[], expiresInDays? (default 30), federationOptIn?, acknowledgedNoticeIds?, jurisdictionProfileId? }"
        output: "{ publicationId, status, verdict, riskLevel, matchedRuleKeys?, statementCid?, deliveries[], skippedRelays[], clockWarning? }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, VALIDATION_FAILED, BAZAAR_PUBLISH_NOT_ALLOWED, BAZAAR_PUBLISH_INCOMPLETE, BAZAAR_PUBLISH_BLOCKED, BAZAAR_PUBLISH_LIMIT, BAZAAR_PUBLISH_FEDERATION_CONSENT_REQUIRED, DISCOVERY_PRECISION_FORBIDDEN, PRECONDITION_FAILED, FEATURE_DISABLED]
        emits: [bazaar.listing.published]
        idempotent: true
      - name: bazaar.publication.confirm
        capability: bazaar.publication.confirm
        input: "[vault-local + statement classrup.bazaar.listing/v1] { publicationId, expectedRevision, confirmedRuleKeys[], confirmedRisk? }"
        output: "{ publicationId, status: active, statementCid }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, BAZAAR_PUBLISH_CONFIRMATION_REQUIRED, EXPIRED]
        emits: [bazaar.listing.published]
        idempotent: true
      - name: bazaar.publication.unpublish
        capability: bazaar.publication.unpublish
        input: "[vault-local + statement classrup.federation.tombstone/v1] { publicationId, expectedRevision, confirmHolds? }"
        output: "{ publicationId, status: unpublished, tombstoneCid, activeHolds }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, BAZAAR_PUBLISH_HOLDS_ACTIVE]
        emits: [bazaar.listing.unpublished]
        idempotent: true
      - name: bazaar.publication.end
        capability: bazaar.publication.end
        input: "[vault-local, internal port + tombstone statement] { listingId, reason: closed|archived|account_deleted|policy_changed }"
        output: "{ publicationId?, ended: boolean }"
        errors: [NOT_FOUND, CONFLICT_STATE]
        emits: [bazaar.listing.unpublished]
        idempotent: true
      - name: bazaar.publication.renew
        capability: bazaar.publication.renew
        input: "[vault-local + statement classrup.bazaar.listing/v1] { publicationId, expectedRevision, requestedBy?: owner|expiry_deferral }"
        output: "{ publicationId, expiresAt, renewals, statementCid }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, BAZAAR_PUBLISH_RENEW_NOT_ALLOWED, PRECONDITION_FAILED]
        emits: [bazaar.publication.renewed]
        idempotent: true
      - name: bazaar.publication.attach_promotion
        capability: bazaar.publication.promote
        input: "[vault-local; opens a Deal through commerce.deal.open, which produces classrup.commerce.deal/v1] { publicationId, relayId, tier: boost_7d|boost_14d, price: Money (from the relay's signed price list), operatorDid }"
        output: "{ publicationId, promotion: { state: requested, dealId } }"
        errors: [NOT_FOUND, CONFLICT_STATE, VALIDATION_FAILED, COMMERCE_DEAL_CONTEXT_CONFLICT]
        emits: []
        idempotent: true
      - name: bazaar.publication.receive_relay_notice
        capability: bazaar.publication.receive_relay_notice
        input: "[vault-local, inbound relay-signed statement] { envelope: classrup.moderation.reasons/v1 | classrup.moderation.reversal/v1 | classrup.bazaar.promotion/v1, provenance }"
        output: "{ publicationId?, accepted: boolean, effect?: hosting_removed|hosting_restored|promotion_active|promotion_withdrawn, quarantineReason?: signature_invalid|signer_not_relay|target_mismatch|unknown_relay|duplicate }"
        errors: [VALIDATION_FAILED, UNSUPPORTED_SCHEMA_VERSION]
        emits: [bazaar.publication.promotion_activated]
        idempotent: true
    note: >-
      Statement registry (N2, F11.S01.M01): classrup.bazaar.listing/v1, signer role listing author (a registered
      device key of ownerId); classrup.federation.tombstone/v1 (F11 schema), signer role listing author;
      classrup.bazaar.promotion/v1, signer role operator key of the relay named by relayId; inbound
      classrup.moderation.reasons/v1 and classrup.moderation.reversal/v1 (F12.S02.M01 schemas), signer role the relay
      of that delivery, ingested here only for the vault's own publications. The relay key is the one pinned when the
      user selected the relay (published by F15.S02.M01 at /.well-known/classrup-relay.json). Privacy ports (N6): the
      module registers ExportSectionPort (section bazaar.publications), DeletionPort (end every publication with reason
      account_deleted, pseudonymize ownerId in retained records) and RetentionPurgePort with F10.S01.M03, F10.S01.M04
      and F10.S01.M02. Variant subsets come from F01.S03.M02 through the ProjectionContributorPort that it registers here.
    queries:
      - name: bazaar.publication.get
        capability: bazaar.publication.read
        input: "{ publicationId }"
        output: "{ publication: PublicationRecord }"
        errors: [NOT_FOUND]
      - name: bazaar.publication.list_mine
        capability: bazaar.publication.read
        input: "{ status?, cursor?, limit <= 50 }"
        output: "{ items: PublicationRecord[], nextCursor? }"
        errors: [VALIDATION_FAILED]
      - name: bazaar.publication.preview_policy
        capability: bazaar.publication.read
        input: "{ listingId, jurisdictionProfileId? }"
        output: "{ verdict, riskLevel, matchedRuleKeys, requiredNoticeIds, rulesetVersion, projectionPreview }"
        errors: [NOT_FOUND]
    events_produced:
      - {type: bazaar.listing.published, privacy: P0, payload: "{ listingId, publicationId, ownerId, kind, categoryId, regionCell, listingRevision, publishedAt, expiresAt, federationOptIn, barterAcceptable, statementCid }"}
      - {type: bazaar.listing.unpublished, privacy: P0, payload: "{ listingId, publicationId, ownerId, reason: owner|policy_changed|closed|archived|account_deleted, tombstoneCid }"}
      - {type: bazaar.publication.renewed, privacy: P1, payload: "{ listingId, publicationId, listingRevision, expiresAt, renewals, statementCid, requestedBy }"}
      - {type: bazaar.publication.promotion_activated, privacy: P1, payload: "{ listingId, publicationId, relayId, tier, activeUntil, promotionCid }"}
    events_consumed:
      - {type: bazaar.listing.expired, effect: "end the active PublicationRecord with endReason expired and queue a tombstone"}
      - {type: governance.prohibited_rule.changed, effect: "re-evaluate active publications in batches of 200; a new block verdict ends the publication with reason policy_changed"}
      - {type: governance.category.changed, effect: "re-evaluate active publications in the changed category when the category became restricted or retired"}
      - {type: commerce.payment.claimed, effect: "when the claim belongs to a promotion Deal of this vault, move the promotion from requested to claimed"}
      - {type: commerce.payment.acknowledged, effect: "when the acknowledgement of a promotion claim is signed by promotion.operatorDid, move the promotion to acknowledged; never to active"}
      - {type: commerce.payment.finalized, effect: "for a crypto promotion claim, move the promotion to acknowledged"}
      - {type: commerce.payment.reorged, effect: "move an acknowledged promotion back to claimed; an active promotion stays until the relay's signed withdrawal arrives"}
      - {type: commerce.payment.expired, effect: "move a claimed promotion to expired"}
      - {type: commerce.payment.failed, effect: "move a claimed promotion to expired"}
      - {type: commerce.deal.cancelled, effect: "when the Deal is a promotion Deal (contextRef listing_fee), move a requested or claimed promotion to expired"}
      - {type: privacy.deletion.completed, effect: "replace ownerId with the payload pseudonym in PublicationRecords retained under RET-EVIDENCE"}
    errors:
      - "BAZAAR_PUBLISH_NOT_ALLOWED | 409 | no | listing status does not allow publication now, or every destination relay has removed it"
      - "BAZAAR_PUBLISH_INCOMPLETE | 422 | no | required fields, terms or region are missing; params.fields lists them"
      - "BAZAAR_PUBLISH_BLOCKED | 422 | no | policy pack blocks this listing; params.ruleKeys and reasonKeys"
      - "BAZAAR_PUBLISH_CONFIRMATION_REQUIRED | 409 | no | a review-level rule matched or the risk level is elevated and the owner has not confirmed"
      - "BAZAAR_PUBLISH_LIMIT | 409 | no | vault already has 100 active publications"
      - "BAZAAR_PUBLISH_RENEW_NOT_ALLOWED | 409 | no | renewal window, count or total life limit not met"
      - "BAZAAR_PUBLISH_FEDERATION_CONSENT_REQUIRED | 409 | no | federation opt-in without a granted federation_publish consent for a destination relay"
      - "BAZAAR_PUBLISH_HOLDS_ACTIVE | 409 | no | the listing has active inventory holds; confirm to unpublish while keeping them"
    example: |
      vault.dispatch("bazaar.publication.publish", { "listingId": "0192f3a4-5b6c-7d8e-9f01-23456789abcd", "expectedRevision": 5,
        "relayIds": ["relay:berlin.example", "relay:hamburg.example"], "expiresInDays": 30 }, idempotencyKey: "0192f3a4-0000-7000-8000-000000000031")
      => { "publicationId": "0192f3a6-...", "status": "active", "verdict": "allow", "riskLevel": "low", "statementCid": "sha256-Zm9v...",
           "deliveries": [ { "relayId": "relay:berlin.example", "syncState": "prepared" } ], "skippedRelays": ["relay:hamburg.example"] }
      later: delivery syncState transport_acknowledged (relay receipt), then peer_accepted (relay signed acceptance).
      vault.dispatch("bazaar.publication.receive_relay_notice", { "envelope": { "type": "classrup.moderation.reasons/v1", "author": "did:key:z6MkRelayR2...", ... }, "provenance": { "relayId": "relay:berlin.example" } })
      => { "accepted": false, "quarantineReason": "signer_not_relay" }
  authorization_capabilities:
    requirements:
      - "Vault policy: only the listing's author principal may publish, confirm, unpublish, renew or attach a promotion."
      - "The signing key is an authorized device key of the principal (CTR-CAP-001 CAP-8); statements signed by any other key are never produced by this module."
      - "Relay policy rows: each relay decides on its own index and promotion; a relay accepts index writes for requests signed by a registered device key, and a relay moderator or operator may remove from that relay only."
    capabilities:
      - "bazaar.publication.publish | owner | listing.ownerId = local principal; vault unlocked; signing key unrevoked"
      - "bazaar.publication.confirm | owner | publication.ownerId = local principal and status held_for_confirmation"
      - "bazaar.publication.unpublish | owner | publication.ownerId = local principal and status active; confirmHolds when holds exist"
      - "bazaar.publication.end | system | caller is F01.S01.M04 or the policy-change consumer in this module"
      - "bazaar.publication.renew | owner | publication.ownerId = local principal; renewal window met; or system caller F01.S01.M04 expiry deferral within the 120-day cap"
      - "bazaar.publication.promote | owner | publication.ownerId = local principal; Deal payer is the local principal and payee the operator DID of that relay"
      - "bazaar.publication.read | owner | publication.ownerId = local principal"
      - "bazaar.publication.receive_relay_notice | peer (relay) | vault policy: statement signed by the pinned key of the relay of that delivery and targeting this vault's own publication; otherwise quarantined (CAP-8)"
      - "bazaar.publication.relay_index_write | relay-member | relay policy: request signed by a registered device key, within the relay's published quota (default 100 projections per key)"
      - "bazaar.publication.relay_remove | relay-moderator | relay policy: removal from that relay's index only, with a signed statement of reasons delivered to the author"
      - "bazaar.publication.relay_promote | relay-operator | relay policy: signs classrup.bazaar.promotion/v1 for its own index after acknowledging the payment claim or seeing it final; may withdraw it with a signed statement"
  failure_recovery_idempotency:
    requirements:
      - "Publishing is idempotent per CTR-IDM-001; a replay returns the stored PublicationRecord and never signs a second statement."
      - "Signing, PublicationRecord, Listing status change and outbox entry commit in one IndexedDB transaction; transport is a separate retried step."
      - "Offline publish commits locally and shows prepared; the UI never reports relay receipt or acceptance before a signed receipt exists."
    idempotency: "Idempotency-Key required on every command; keys and request hashes kept 24 h in the vault. Statements are additionally deduplicated by cid at relays and peers (CTR-FED-001 FED-3); inbound relay notices are deduplicated by cid."
    concurrency: "expectedRevision on the listing and on the publication; one live publication per listing is enforced by a partial unique index. A forked statement chain (same seq, different prev from another device of the principal) is detected on sync, the publication is frozen and the owner chooses which chain to keep; no last-writer-wins."
    retries: "Transport retries follow IDM-4: exponential backoff with full jitter, base 500 ms, cap 30 s, 6 attempts per burst, then waits for the next app start or network event; a relay_rejected or relay_removed result is never retried to that relay."
    offline: "Everything except relay delivery works offline. The sync outbox entry stays prepared; entries older than 7 days prompt the user to resend or discard. Offline publish uses the last known receipt median for V10 and warns when it is older than 7 days."
    partial_failure: "Delivery to relay A may succeed while relay B fails; each destination has its own state. A local policy-change unpublish with some relays unreachable queues tombstones for them and shows tombstone pending. If commerce.deal.open fails, attach_promotion stores nothing."
  privacy_retention_abuse:
    requirements:
      - "Only P0 fields leave the device in the projection; the UI shows exactly what becomes public and warns that copies already fetched by others cannot be recalled (PRV-6)."
      - "Tombstones are honoured by relays that follow CTR-FED-001; retention of the PublicationRecord is RET-EVIDENCE."
      - "Pseudonymity is not anonymity: the author did:key and relay metadata link all of a principal's publications, and the publish sheet says so."
      - "The module registers ExportSectionPort (section bazaar.publications), DeletionPort and RetentionPurgePort with F10 (N6), annotates every PublicationRecord field and projection key with its F10.S02.M02 class, and calls privacy.consent.check for federation_publish before federating."
    data:
      - "Projection statement: P0, signed, closed key set per the allowlist, regionCell at most L2."
      - "PublicationRecord: P1 in the vault, with receipt times that are relay claims; field classes annotated per F10.S02.M02."
    retention:
      - "PublicationRecord: RET-EVIDENCE (2 years after last related activity); ownerId pseudonymized after principal deletion."
      - "Tombstones: kept 180 days by senders and receivers (CTR-PRV-001)."
      - "Quarantined relay notices: RET-SHORT 30 days."
    threats:
      - "T01 | Prohibited or illegal goods published | local rules and risk assessment before signing, relay hosting policy on receipt, relay-side removal with reasons; no claim of global enforcement"
      - "T02 | Location leak in the projection | assertPublicCell caps regionCell at 5 characters; media GPS check; projection builder test fails if the key set differs from the allowlist"
      - "T03 | Impersonation by republishing another author's listing | receivers accept only statements whose author did:key matches the listing owner; duplicates by cid are ignored"
      - "T04 | Spam flooding relays | local cap of 100 active publications, relay quotas, local spam heuristics from F12.S02.M02 and risk assessment before signing"
      - "T05 | Stale offer terms after unpublish | tombstone queued to every relay that received the projection; UI states copies may persist"
      - "T06 | Forged hosting notice to make the owner believe a listing was removed, or a notice of one relay applied to another | V16 accepts only the pinned key of the relay of that delivery and the publication's statementCid; quarantine otherwise; notices never change the Listing"
      - "T07 | A malicious or misconfigured relay blocks publishing with future receipt times | median of at least 2 relays; receipts more than 24 h ahead discarded and the relay flagged untrusted; one relay alone only warns"
      - "T08 | Promotion overclaim (paid or promoted shown without the relay) | promotion active only on the relay-signed statement; payment events move it at most to acknowledged; relay can revoke"
    abuse_controls:
      - "At most 20 publish commands per hour per vault."
      - "Relay hosting policies are shown before sending; the user can choose relays, and relays can refuse."
  observability_performance:
    requirements:
      - "The PWA sends no telemetry (OBS-7); publication counters and sync states are local diagnostics, exportable by the user."
      - "Local publish latency excludes network transport and is budgeted on Moto G-class hardware."
      - "Relay-side behaviour of accepting index writes is measured by the relay under OBS-1 to OBS-4."
    metrics:
      - "classrup_bazaar_publications_total{outcome=active|blocked|held|unpublished|ended} (local)"
      - "classrup_bazaar_publication_delivery_total{state} (local)"
      - "classrup_bazaar_publication_policy_duration_ms (local histogram)"
      - "classrup_bazaar_relay_notice_quarantined_total{reason} (local)"
      - "classrup_bazaar_relay_index_writes_total{outcome} (relay, OBS-2 labels only)"
    logs:
      - "info publication.active {publicationId, listingId, correlationId} in local diagnostics; no titles or text."
    budgets:
      - "publish p95 <= 150 ms locally including policy evaluation (2 000 rules, 8 000 code points), risk assessment and Ed25519 signing, excluding network."
      - "Relay index write p95 <= 300 ms at 50 req/s (OBS-4)."
      - "Policy re-evaluation sweep: 200 publications per batch in <= 2 s."
  contract_and_acceptance_tests:
    requirements:
      - "Every requirement is covered by at least one automated test."
      - "Contract tests validate the signed projection, tombstone and event payloads against the schema registry and verify signatures."
      - "Honesty tests assert that the UI and API never report relay receipt or peer acceptance without a signed receipt."
    fixtures: "Vault with principal P1 and key K1, complete sell listing L (EUR 50.00, region u33db, barterAcceptable true), wanted listing W with private budget, relays R1 (accepting), R2 (rejecting under its policy) and R3 (clock 3 days ahead), policy pack with block rule b1 and review rule r1, risk stub, consent store, clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R03,06.R03 | publish L offline | PublicationRecord active, delivery prepared, no receiptAt, no peer_accepted claim"
      - "T02 | contract | 01.R02,01.R04,04.R02,09.R02 | publish L and W, then unpublish | projection validates against classrup.bazaar.listing/v1 and its key set equals the allowlist exactly (barterAcceptable, inStock, expiresAt and mailboxHints present; no status, closeReason, currentPublicationId or minOffer; W has no maxBudget); region <= 5 chars; signature verifies; tombstone validates"
      - "T03 | unit | 02.R01,02.R02,02.R03 | violate each rule V01-V17 | documented error code returned, no statement signed"
      - "T04 | property | 03.R01,03.R02 | random command sequences | only declared transitions succeed; active implies Listing published in same transaction"
      - "T05 | integration | 03.R03,06.R02 | R1 accepts, R2 rejects | R1 peer_accepted after signed receipt, R2 relay_rejected, record stays active"
      - "T06 | integration | 04.R01,04.R03 | publish with review verdict then confirm | held_for_confirmation first, active after confirm with ownerConfirmedAt"
      - "T07 | contract | 04.R02 | each command runs | outputs and events validate against registry schemas"
      - "T08 | abuse | 05.R01,05.R02 | another principal's key or revoked key signs publish | FORBIDDEN; no statement produced"
      - "T09 | abuse | 05.R03,07.R03,04.R04 | R2 signs a statement of reasons for L, then a foreign-author statement reaches a receiving vault | delivery relay_removed with hostingRemoved only for R2; Listing status and R1 delivery unchanged; foreign statement quarantined; wording says pseudonymous not anonymous"
      - "T10 | integration | 06.R01,06.R02 | replay publish with same key; fork chain from second device | one statement; fork detected, publication frozen, user prompt shown"
      - "T11 | chaos | 06.R03 | R1 unreachable for 2 h then returns | backoff schedule honoured, state moves prepared to transport_acknowledged without duplicate statements"
      - "T12 | integration | 07.R01,07.R02 | unpublish after publish | tombstone queued to every relay with a received delivery; UI copy states fetched copies may persist"
      - "T13 | integration | 03.R01 | governance.prohibited_rule.changed adds a block rule matching L | publication ends with policy_changed and tombstone queued"
      - "T14 | abuse | 04.R04 | a notice for R2 signed by R1, one signed by a random key, a replay of an accepted notice, then a valid R2 reversal | first three quarantined (signer_not_relay, signature_invalid or signer_not_relay, duplicate); reversal clears hostingRemoved on R2 only"
      - "T15 | integration | 03.R04,04.R05 | attach_promotion, payment claimed and acknowledged by the operator, then a promotion statement signed by R1 vs by a random key, then a signed withdrawal | Deal opened with contextRef listing_fee and payee operatorDid; acknowledged without label; active only for R1's signature with promotion_activated; revoked after withdrawal"
      - "T16 | load | 08.R01,08.R02,08.R03 | 200 publications re-evaluated on Moto G profile; relay at 50 req/s | publish p95 <= 150 ms, batch <= 2 s, relay p95 <= 300 ms, no telemetry requests"
      - "T17 | unit | 09.R01,09.R03 | traceability and honesty test | every PS-004 requirement maps to a passing test; UI never shows accepted without receipt"
      - "T18 | integration | 10.R01,10.R02,10.R03 | export, import to fresh vault, import with wrong owner | records round-trip; active publications import as unpublished-pending-resign; foreign owner read-only"
      - "T19 | integration | 02.R04 | spam stub (moderation.spam.evaluate) scores high, then risk stub (moderation.risk.assess) returns elevated; federationOptIn without consent for R1; regionCell of 6 characters injected past the record check | held_for_confirmation and no signature in both first cases; BAZAAR_PUBLISH_FEDERATION_CONSENT_REQUIRED; DISCOVERY_PRECISION_FORBIDDEN; nothing queued in each case"
      - "T20 | abuse | 02.R05 | R3 returns receipts 3 days in the future while R1 and R2 agree with the device; then only R3 is configured | R3 flagged untrusted and publish succeeds; with R3 alone the command proceeds with clockWarning instead of PRECONDITION_FAILED"
      - "T21 | integration | 02.R06 | unpublish L with an active deal hold without and with confirmHolds | BAZAAR_PUBLISH_HOLDS_ACTIVE first; then unpublished with the hold still active and listed"
      - "T22 | integration | 07.R04 | export section, deletion plan and retention purge through the F10 ports | section bazaar.publications present with field classes; deletion ends publications with account_deleted and pseudonymizes retained records"
    acceptance:
      - All tests T01-T22 pass in CI.
      - No projection contains data beyond the P0 allowlist or a region finer than L2.
      - No UI or API reports transport_acknowledged, peer_accepted or Promoted without a verified signed receipt or relay statement, no relay notice changes the owner's Listing, and no text claims global removal.
  import_export_backup_rollback:
    requirements:
      - "The user export contains all PublicationRecords and the signed statements they reference."
      - "Import verifies statement signatures and owner; active publications are imported inactive and must be re-signed and re-sent explicitly."
      - "Schema changes follow expand/contract and keep v1 readable for 180 days."
    export: "Section bazaar.publications in classrup-export/v1, one line per PublicationRecord, followed by the referenced statements (classrup.bazaar.listing/v1 projections, tombstones, relay notices and promotion statements) as separate lines."
    import: "Signature and cid verified; records with invalid signatures are quarantined; imported active records become status ended with endReason owner and the UI offers Publish again, so stale promises are never revived silently; imported promotions are shown as ended."
    backup: "Vault export is the primary backup (IOX-6); relays hold only copies of public projections under their own policy (IOX-7)."
    migration_rollback: "Additive fields only in v1; rollback is by reinstalling the previous release; statements already sent remain valid because their schema is unchanged."
