id: F01.S04.M02
scope: MVP
summary: >-
  Counteroffer chains between a buyer and a seller, up to 10 rounds, each round an immutable signed statement
  (classrup.bazaar.negotiation_round/v1) sent end to end encrypted to the counterparty. Round zero is the buyer's
  Offer (F01.S04.M01). The chain closes on acceptance, rejection, withdrawal or expiry. Consent is always given
  on the exact round and the exact listing revision: an acceptance statement binds the round digest. Because
  there is no shared server, each party's vault keeps its own copy and agreement exists only when the seller's
  vault has taken the inventory hold and signed a confirmation. Forked or conflicting signed rounds freeze the
  negotiation for explicit renegotiation; the app never picks a winner by timestamp.
responsibilities:
  - Own Negotiation (the chain) and NegotiationRound (immutable signed round) records in each party's vault.
  - Create, verify and store counter, accept, reject, withdraw and close statements; quarantine statements with bad signatures, wrong roles or unknown negotiations.
  - Enforce 10 rounds, a convergence rule (each counter moves toward the other side), per-round expiry (default 48 h, range 1 h to 7 days) and an overall 14-day limit.
  - On acceptance, have the seller's vault take the inventory hold (bazaar.inventory.hold), open the Deal handoff to F09.S01.M01, and send the signed confirmation.
  - React to listing changes, depletion and blocks by closing or freezing the chain.
non_responsibilities:
  - The first offer, its expiry and its direct accept/reject path (F01.S04.M01).
  - Inventory quantities and holds (F01.S03.M01) and Deal, payment claims and receipts (F09).
  - Messaging threads (F08); rounds are referenced from threads as structured cards, not copied.
  - Multi-party barter revisions (F02.S01.M04).
  - "Future: automated counter rules such as auto-accept above a threshold, and bundle negotiations over several listings."
depends_on: [F01.S04.M01, F01.S03.M01, F01.S01.M01, F01.S02.M01, F09.S01.M01, F09.S03.M03, F07.S02.M02, F16.S02.M03, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-MNY-001, CTR-PRV-001, CTR-FED-001, CTR-COM-001, CTR-SCH-001]
user_stories:
  - As a seller, I answer a buyer's offer with a counter price and a note, and see whether the buyer has received and accepted it.
  - As a buyer, I accept a seller's counter and see clearly that the deal is agreed only after the seller's confirmation arrives.
  - As either party, I can walk away, and I can see the full list of rounds with who proposed what.
edge_cases:
  - Both parties counter at the same time (each on round n+1); the second statement to arrive fails the turn check, both vaults freeze the chain on detecting two signed rounds with the same number, and both are asked to restart from the last agreed round.
  - Buyer accepts a seller round after the round expiry according to the seller's clock; the seller's vault refuses with EXPIRED and sends a signed close; the buyer's clock is only a claim.
  - Seller edits the price materially after sending a counter; the buyer's accept is refused with BAZAAR_NEGOTIATION_LISTING_CHANGED and the buyer must review the new revision.
  - The last unit is held for another buyer while the first buyer's acceptance is in transit; the seller vault returns a signed close with outcome superseded and no hold is taken.
  - A counter moves away from the other side (seller raises above the buyer, or buyer lowers below their earlier amount); BAZAAR_NEGOTIATION_NOT_CONVERGING is returned.
  - The 11th round is attempted; BAZAAR_NEGOTIATION_ROUND_LIMIT is returned and only accept, reject or withdraw remain.
  - Statement arrives with a valid signature from a key that is not the stated buyer or seller; it is quarantined with reason role_mismatch.
  - Either vault is offline for days; the other side sees prepared or transport_acknowledged, never accepted, and the round expiry keeps running.
ux:
  screens:
    - "Negotiation thread card (also embedded in F08 conversation): round list with proposer, amount, note, expiry, listing revision, and sync state chips (prepared, relay received, peer accepted)."
    - "Counter sheet: amount input with currency, optional note (up to 280 characters), expiry selector, convergence hint, summary of the exact listing revision."
    - "Accept confirmation dialog: states exactly which round and amount is accepted and that the deal is agreed only after the seller's confirmation."
  states: [loading, awaiting-me, awaiting-them, pending-offline, accept-sent, accepted, rejected, withdrawn, expired, frozen-conflict]
  a11y:
    - Round list is an ordered list; each round has a text summary readable by screen readers.
    - Status and sync-state changes are announced in an aria-live polite region.
    - Accept and Reject buttons are at least 44x44 px and have names that include the amount and round number.
processes:
  domain_schema:
    requirements:
      - "A Negotiation links a buyer, a seller, a listing, an optional variant and the root Offer; each NegotiationRound is immutable and stores the signed statement digest."
      - "Negotiation data is P2 and visible only to the two parties; rounds travel only as end-to-end encrypted envelopes and are never federated or sent to notification channels in plain form."
      - "Timestamps in rounds are the signer's claims; ordering uses roundNo and the hash chain (prev), not clocks."
    entities:
      - name: Negotiation
        schema: classrup.bazaar.negotiation/v1
        storage: device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key, generated by the seller vault at the first counter"
          - "tenantId: uuidv7 — fixed local-vault tenant (ID-6)"
          - "listingId: uuidv7 — ref F01.S01.M01 Listing"
          - "variantId?: uuidv7 — ref F01.S03.M02 Variant"
          - "buyerId: did:key — offer maker"
          - "sellerId: did:key — listing owner"
          - "localRole: enum — buyer | seller (which side this vault holds)"
          - "rootOfferId: uuidv7 — ref F01.S04.M01 Offer, round zero"
          - "status: enum — open | frozen | accept_sent | accepted | rejected | withdrawn | expired"
          - "awaiting: did:key — principal whose turn it is"
          - "lastRoundNo: int — 0..10, 0 means only the root offer exists"
          - "listingRevision: int — listing revision bound in the latest round"
          - "closeOutcome?: enum — accepted | rejected | withdrawn | expired | superseded | listing_unavailable | blocked | frozen_discarded"
          - "dealId?: uuidv7 — ref F09.S01.M01 Deal, set on acceptance"
          - "holdId?: uuidv7 — ref F01.S03.M01 InventoryHold, set on acceptance (seller vault)"
          - "confirmationCid?: string — sha256- of the seller's signed confirmation"
          - "expiresAt: timestamp — expiry of the latest round, claim of the proposer"
          - "hardDeadline: timestamp — createdAt + 14 d"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - At most 10 rounds beyond the root offer and at most one non-terminal Negotiation per (buyerId, sellerId, listingId, variantId).
          - status accepted implies dealId, confirmationCid and a verified seller confirmation exist; in the seller vault it also implies holdId with an active hold.
          - buyerId differs from sellerId and awaiting is always the party that did not make the latest round.
      - name: NegotiationRound
        schema: classrup.bazaar.negotiation_round/v1
        storage: device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — fixed local-vault tenant (ID-6)"
          - "negotiationId: uuidv7 — ref Negotiation"
          - "roundNo: int — 1..10; round 0 is the root Offer"
          - "proposerId: did:key — signer, buyer or seller"
          - "amount: Money — CTR-MNY-001; > 0; currency in the listing's accepted currencies"
          - "quantity: int — 1..100, not above listing availability claim"
          - "note?: string — <= 280 code points, plain text"
          - "listingRevision: int — listing revision the proposer saw"
          - "claimedAt: timestamp — proposer clock, a claim"
          - "expiresAt: timestamp — claimedAt + 1 h..7 d, a claim"
          - "prev: string — sha256- of the previous round statement or of the root offer statement"
          - "statementCid: string — sha256- over JCS of the signed envelope"
          - "receiptAt?: timestamp — local arrival time in this vault"
          - "createdAt: timestamp — RFC 3339 UTC"
        invariants:
          - A round is never modified or deleted while its negotiation exists.
          - Unique (negotiationId, roundNo); a second different statement with the same number and signer marks the negotiation frozen.
          - Rounds alternate proposers starting with the seller at round 1 when the root offer is the buyer's.
    sql: |
      CREATE TABLE bazaar_negotiation (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, listing_id TEXT NOT NULL, buyer_id TEXT NOT NULL, seller_id TEXT NOT NULL,
        status TEXT NOT NULL, expires_at TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX bazaar_negotiation_live ON bazaar_negotiation(tenant_id, buyer_id, seller_id, listing_id, ifnull(json_extract(data,'$.variantId'),''))
        WHERE status IN ('open','frozen','accept_sent');
      CREATE TABLE bazaar_negotiation_round (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, negotiation_id TEXT NOT NULL, round_no INTEGER NOT NULL,
        statement_cid TEXT NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX bazaar_negotiation_round_no ON bazaar_negotiation_round(tenant_id, negotiation_id, round_no, statement_cid);
  validation_rules:
    requirements:
      - "Every outgoing command and every incoming statement is validated for roles, turn, convergence, currency, listing revision and expiry before it changes state."
      - "Statements that fail verification are quarantined with a reason and never change a negotiation."
      - "Every violation maps to one stable error code."
    rules:
      - "V01 | signature verifies over JCS bytes, author is the stated buyer or seller key, schema version supported | VALIDATION_FAILED"
      - "V02 | it is the actor's turn (awaiting equals the actor) and status is open | CONFLICT_STATE"
      - "V03 | roundNo = lastRoundNo + 1 and roundNo <= 10 | BAZAAR_NEGOTIATION_ROUND_LIMIT"
      - "V04 | seller counter amount >= buyer's previous amount and <= seller's previous amount (or asking price at round 1); buyer counter symmetric | BAZAAR_NEGOTIATION_NOT_CONVERGING"
      - "V05 | amount is a positive integer string in a currency the listing accepts (bazaar.sell_terms.accepts) | VALIDATION_FAILED"
      - "V06 | listing is negotiable, published, and the cited listingRevision equals the current revision for accept | BAZAAR_NEGOTIATION_LISTING_CHANGED"
      - "V07 | round expiry between 1 h and 7 days and not later than hardDeadline | VALIDATION_FAILED"
      - "V08 | accept is made before the round expiresAt according to the receiving vault clock | EXPIRED"
      - "V09 | neither party blocks the other (F07.S02.M02) | BLOCKED_PARTY"
      - "V10 | note <= 280 code points | VALIDATION_FAILED"
      - "V11 | seller inventory check (bazaar.inventory.check) succeeds before confirmation | BAZAAR_NEGOTIATION_HOLD_FAILED"
      - "V12 | expectedRevision matches | CONFLICT_REVISION"
  workflow_state_machine:
    requirements:
      - "Negotiation follows the declared machine; accepted, rejected, withdrawn and expired are terminal and any other transition is refused with CONFLICT_STATE."
      - "Agreement is reached only when the seller's vault has taken the hold, opened the Deal handoff and signed the confirmation; a buyer's acceptance alone leaves the chain in accept_sent."
      - "Two different signed statements for the same round number, or an acceptance and a counter for the same round, freeze the chain; frozen chains are never resolved automatically."
    machines:
      - entity: Negotiation
        initial: open
        terminal: [accepted, rejected, withdrawn, expired]
        transitions:
          - "open -> open | counter statement accepted from the party whose turn it is | new round stored, awaiting flips; emits bazaar.negotiation.countered"
          - "open -> accepted | seller vault accepts the buyer's latest round | inventory hold and Deal handoff in one transaction; confirmation signed; emits bazaar.negotiation.closed (accepted)"
          - "open -> accept_sent | buyer vault signs acceptance of the seller's latest round | acceptance statement queued; waits for the seller's confirmation"
          - "accept_sent -> accepted | seller confirmation statement verified | records holdId, dealId; emits bazaar.negotiation.closed (accepted)"
          - "accept_sent -> rejected | seller close statement (superseded, listing_unavailable, hold failed) | emits bazaar.negotiation.closed"
          - "accept_sent -> expired | round expiry or hard deadline without confirmation | emits bazaar.negotiation.closed (expired)"
          - "open -> rejected | reject by the party whose turn it is, or block, or listing unavailable, or depletion | signed close queued; emits bazaar.negotiation.closed"
          - "open -> withdrawn | either party withdraws | signed close queued; emits bazaar.negotiation.closed (withdrawn)"
          - "open -> expired | round expiresAt or hardDeadline passes | emits bazaar.negotiation.closed (expired)"
          - "open -> frozen | conflicting signed statements detected | no further commands except discard or restart"
          - "frozen -> rejected | either party discards the chain | emits bazaar.negotiation.closed (frozen_discarded); a new offer is needed"
    timeouts:
      - "Sweep every 60 s while the app is open and at app start: open or accept_sent chains with expiresAt <= now become expired."
      - "Hard deadline 14 days after creation closes any non-terminal chain."
      - "accept_sent waits at most until the accepted round's expiresAt for the seller confirmation."
  commands_queries_events:
    requirements:
      - "counter, accept, reject, withdraw and discard are vault commands; counter, accept, reject and withdraw produce signed statements (classrup.bazaar.negotiation_round/v1, classrup.bazaar.negotiation_accept/v1, classrup.bazaar.negotiation_close/v1); receive handles inbound statements; confirm is produced by the seller vault as classrup.bazaar.negotiation_confirm/v1."
      - "Sync state of every outbound statement is prepared, transport_acknowledged (relay receipt) or peer_accepted (peer's signed acknowledgement); the UI shows no more than the reached state."
      - "Events are emitted in each vault from local state changes after verification; the two vaults emit equivalent events independently."
    commands:
      - name: bazaar.negotiation.counter
        capability: bazaar.negotiation.counter
        input: "[vault-local + statement classrup.bazaar.negotiation_round/v1, encrypted to counterparty] { offerId | negotiationId, expectedRevision?, amount, quantity?, note?, expiresInMs? (default 172800000) }"
        output: "{ negotiationId, roundNo, revision, statementCid, syncState: prepared }"
        errors: [VALIDATION_FAILED, NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, BLOCKED_PARTY, BAZAAR_NEGOTIATION_ROUND_LIMIT, BAZAAR_NEGOTIATION_NOT_CONVERGING, BAZAAR_NEGOTIATION_LISTING_CHANGED, RATE_LIMITED]
        emits: [bazaar.negotiation.countered]
        idempotent: true
      - name: bazaar.negotiation.accept
        capability: bazaar.negotiation.decide
        input: "[vault-local + statement classrup.bazaar.negotiation_accept/v1; in the seller vault also classrup.bazaar.negotiation_confirm/v1] { negotiationId, expectedRevision, roundNo, roundCid, listingRevision }"
        output: "{ negotiationId, revision, status: accept_sent|accepted, dealId?, holdId? }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, EXPIRED, BLOCKED_PARTY, BAZAAR_NEGOTIATION_LISTING_CHANGED, BAZAAR_NEGOTIATION_HOLD_FAILED, DEPENDENCY_UNAVAILABLE]
        emits: [bazaar.negotiation.closed]
        idempotent: true
      - name: bazaar.negotiation.reject
        capability: bazaar.negotiation.decide
        input: "[vault-local + statement classrup.bazaar.negotiation_close/v1] { negotiationId, expectedRevision }"
        output: "{ negotiationId, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [bazaar.negotiation.closed]
        idempotent: true
      - name: bazaar.negotiation.withdraw
        capability: bazaar.negotiation.withdraw
        input: "[vault-local + statement classrup.bazaar.negotiation_close/v1] { negotiationId, expectedRevision }"
        output: "{ negotiationId, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [bazaar.negotiation.closed]
        idempotent: true
      - name: bazaar.negotiation.discard_frozen
        capability: bazaar.negotiation.decide
        input: "[vault-local + statement classrup.bazaar.negotiation_close/v1] { negotiationId, expectedRevision }"
        output: "{ negotiationId, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [bazaar.negotiation.closed]
        idempotent: true
      - name: bazaar.negotiation.receive
        capability: bazaar.negotiation.receive
        input: "[vault-local, inbound statement] { envelope, provenance }"
        output: "{ negotiationId?, accepted: boolean, quarantineReason?, replyStatementCid? }"
        errors: [VALIDATION_FAILED, UNSUPPORTED_SCHEMA_VERSION, CONFLICT_STATE]
        emits: [bazaar.negotiation.countered, bazaar.negotiation.closed]
        idempotent: true
    queries:
      - name: bazaar.negotiation.get
        capability: bazaar.negotiation.read
        input: "{ negotiationId }"
        output: "{ negotiation: Negotiation, rounds: NegotiationRound[] }"
        errors: [NOT_FOUND]
      - name: bazaar.negotiation.list_mine
        capability: bazaar.negotiation.read
        input: "{ status?, listingId?, cursor?, limit <= 50 }"
        output: "{ items: Negotiation[], nextCursor? }"
        errors: [VALIDATION_FAILED]
    events_produced:
      - {type: bazaar.negotiation.countered, privacy: P2, payload: "{ negotiationId, listingId, variantId?, roundNo, proposerId, recipientId, amount, listingRevision, expiresAt }"}
      - {type: bazaar.negotiation.closed, privacy: P2, payload: "{ negotiationId, listingId, variantId?, buyerId, sellerId, outcome: accepted|rejected|withdrawn|expired|superseded|listing_unavailable|blocked|frozen_discarded, finalAmount?, dealId?, holdId? }"}
    events_consumed:
      - {type: bazaar.listing.edited, effect: "when material, mark open chains listingChangedSinceRound; accept is then refused until the proposer sends a new round on the new revision"}
      - {type: bazaar.listing.unpublished, effect: "close open chains with outcome listing_unavailable"}
      - {type: bazaar.listing.expired, effect: "close open chains with outcome listing_unavailable"}
      - {type: bazaar.inventory.depleted, effect: "close open chains on that variant with outcome superseded unless this chain holds the stock"}
      - {type: identity.block.added, effect: "close chains between the two parties with outcome blocked and send no revealing notification"}
      - {type: bazaar.offer.rejected, effect: "link the root offer; a rejection with reason countered confirms the chain start"}
      - {type: bazaar.offer.expired, effect: "close a chain that never progressed beyond the root offer"}
    errors:
      - "BAZAAR_NEGOTIATION_ROUND_LIMIT | 409 | no | the chain already has 10 rounds"
      - "BAZAAR_NEGOTIATION_NOT_CONVERGING | 422 | no | the counter moves away from the other side's last amount"
      - "BAZAAR_NEGOTIATION_LISTING_CHANGED | 409 | no | the listing changed materially since the round; review and send a new round"
      - "BAZAAR_NEGOTIATION_HOLD_FAILED | 409 | no | seller could not reserve the item; chain closed as superseded"
    example: |
      seller vault: dispatch("bazaar.negotiation.counter", { "offerId": "0192f3a5-...", "amount": { "amount": "4800", "currency": "EUR" }, "note": "Includes helmet" })
      => { "negotiationId": "0192f3b0-...", "roundNo": 1, "revision": 1, "statementCid": "sha256-Zm9v...", "syncState": "prepared" }
      buyer vault: dispatch("bazaar.negotiation.accept", { "negotiationId": "0192f3b0-...", "expectedRevision": 2, "roundNo": 1, "roundCid": "sha256-Zm9v...", "listingRevision": 5 })
      => { "negotiationId": "0192f3b0-...", "revision": 3, "status": "accept_sent" }
      seller vault receives acceptance, holds inventory, opens Deal, signs confirmation => buyer vault shows accepted with dealId.
  authorization_capabilities:
    requirements:
      - "Vault policy: only the local principal acting as buyer or seller of the chain may counter, accept, reject or withdraw, and only on its own turn for counter and accept."
      - "Inbound statements are accepted only when signed by the stated buyer or seller key and consistent with the chain; otherwise quarantined (CAP-8)."
      - "Relay policy: relays authorize mailbox delivery of the encrypted envelopes by signed requests from the recipient device key; relays cannot read or alter rounds."
    capabilities:
      - "bazaar.negotiation.counter | owner | local principal is buyer or seller of the chain and awaiting = local principal; not blockedWith(counterparty)"
      - "bazaar.negotiation.decide | owner | local principal is a party of the chain; accept requires awaiting = local principal"
      - "bazaar.negotiation.withdraw | owner | local principal is a party of the chain"
      - "bazaar.negotiation.receive | peer | statement signed by the stated counterparty key; signature, role and chain consistency verified"
      - "bazaar.negotiation.read | owner | local principal is buyer or seller of the chain"
      - "bazaar.negotiation.relay_mailbox | relay-member | relay policy: request signed by the recipient device key; ciphertext only; mailbox quota default 10 MiB"
  failure_recovery_idempotency:
    requirements:
      - "Commands are idempotent per CTR-IDM-001; inbound statements are idempotent by statementCid."
      - "In the seller vault, the hold, the Deal handoff, the Negotiation update and the signed confirmation commit in one transaction; if the hold or the handoff fails, nothing is confirmed and a signed close is sent instead."
      - "Conflicting signed promises are detected and frozen; no last-writer-wins for consent, money or inventory."
    idempotency: "Idempotency-Key required on every command, kept 24 h in the vault; inbound statements deduplicated by cid; replayed accept returns the stored confirmation or accept_sent state."
    concurrency: "expectedRevision on every command; turn check by awaiting; unique live-chain index; the hold is serialized by the inventory module; simultaneous counters from both sides produce two signed rounds with the same number and freeze the chain in both vaults on exchange."
    retries: "Transport retries follow IDM-4: base 500 ms, cap 30 s, 6 attempts per burst; quarantined statements and signed closes are not retried against a closed chain."
    offline: "Counter and withdraw can be prepared offline; accept can be signed offline but the UI keeps it at accept_sent and states that the seller has not confirmed; expiry keeps running by each vault's own clock."
    partial_failure: "If the confirmation cannot be delivered after the seller committed, the seller vault retries and the buyer sees accept_sent until a verified confirmation or the round expiry; the seller's hold expires on its own lease if the buyer never completes the Deal."
  privacy_retention_abuse:
    requirements:
      - "Amounts and notes are P2 and never appear in public projections, relay indexes, federation or notification payloads; relays see ciphertext and routing metadata only."
      - "Negotiations are retained RET-EVIDENCE; on account deletion the counterparty keeps their copy with the deleting party replaced by a pseudonym."
      - "Notes are plain text; links are rendered as text and can be reported."
    data:
      - "Negotiation and NegotiationRound: P2 (buyer, seller)."
      - "Notes: P2 free text scanned locally by spam heuristics; never federated."
    retention:
      - "Terminal negotiations: RET-EVIDENCE (2 years after last related activity)."
      - "Quarantined statements: RET-SHORT 30 days."
    threats:
      - "T01 | Forged counter or acceptance to trick a party | signatures over JCS, role and chain checks, exact-round binding with roundCid and listingRevision"
      - "T02 | Replay of an old acceptance | roundNo, prev hash chain, expiry and idempotency by statementCid; accepted chain is terminal"
      - "T03 | Bait-and-switch: seller changes listing after buyer commits | accept binds listingRevision; stale revision refused; material edits flag the chain"
      - "T04 | Inventory double-sell via concurrent accepts | hold taken in the seller vault before confirmation; no confirmation without hold; honest limit: only this seller vault prevents double-sell"
      - "T05 | Fork and equivocation by a malicious party signing two rounds | detection by same roundNo, chain frozen, both signed statements kept as evidence"
      - "T06 | Harassment through endless counters | 10-round and 14-day limits, rate limit 20 counters per hour, block list"
    abuse_controls:
      - "At most 20 counter commands per hour per vault and 50 open chains per listing in the seller vault."
      - "Report action on any round stores the signed statements as evidence for the relay moderator or local block."
  observability_performance:
    requirements:
      - "No telemetry leaves the device (OBS-7); counters are local diagnostics."
      - "Local command latency and statement verification meet budgets on Moto G-class hardware."
      - "Sweep lag and frozen-chain counts are visible in diagnostics."
    metrics:
      - "classrup_bazaar_negotiations_total{outcome} (local)"
      - "classrup_bazaar_negotiation_quarantined_total{reason} (local)"
      - "classrup_bazaar_negotiation_frozen_total (local)"
      - "classrup_bazaar_negotiation_expiry_lag_ms (local gauge)"
    logs:
      - "info negotiation.closed {negotiationId, outcome, correlationId} in local diagnostics; no amounts or notes."
    budgets:
      - "counter and receive p95 <= 100 ms including Ed25519 verify or sign on Moto G-class hardware."
      - "accept in the seller vault (hold + deal handoff + sign) p95 <= 200 ms."
      - "list_mine of 50 chains p95 <= 100 ms."
  contract_and_acceptance_tests:
    requirements:
      - "Every requirement is covered by at least one automated test."
      - "Contract tests validate statements, commands and events against the registry and verify signatures."
      - "Race, fork and expiry scenarios are covered by deterministic two-vault tests with injected clocks and ids."
    fixtures: "Two vaults: seller S with published listing L (EUR 50.00, quantity 1, negotiable) and buyer B with Offer EUR 40.00; a third buyer B2; relay stub; clocks 2026-11-04T10:00:00Z; policy of 10 rounds."
    tests:
      - "T01 | unit | 01.R01,01.R03,02.R01 | S counters EUR 48.00 then B counters EUR 44.00 | rounds stored immutable with prev chain; ordering by roundNo not clock"
      - "T02 | unit | 01.R02,07.R01 | inspect projection, relay payload, logs and notifications | no amounts or notes outside encrypted statements"
      - "T03 | unit | 02.R02,02.R03 | violate each rule V01-V12 in turn | documented error code returned or statement quarantined with reason; state unchanged"
      - "T04 | property | 03.R01 | random statements in random order and duplicated | only declared transitions; terminal states never regress; same final state in both vaults when all delivered"
      - "T05 | integration | 03.R02,06.R02 | B accepts S's round 1; S vault holds and confirms | B shows accept_sent then accepted only after verified confirmation; S has hold and Deal handoff"
      - "T06 | integration | 03.R03,06.R03 | S and B counter simultaneously | both vaults freeze on exchange, no hold taken, discard needed to continue"
      - "T07 | integration | 03.R02,02.R03 | last unit held for B2 while B's acceptance is in transit | S sends signed close superseded; B shows rejected superseded; no double hold"
      - "T08 | contract | 04.R01,04.R03,09.R02 | each command and inbound statement | statements validate and verify; countered and closed payloads contain no notes"
      - "T09 | integration | 04.R02,06.R03 | statements sent with relay down then up | states move prepared to transport_acknowledged to peer_accepted only on receipts; UI never shows more"
      - "T10 | abuse | 05.R01,05.R02,05.R03 | non-party counters; statement signed by a third key; relay reads mailbox | FORBIDDEN or quarantined role_mismatch; relay sees ciphertext"
      - "T11 | integration | 04.R03 | listing edited materially, unpublished, depleted, blocked | chain flagged or closed with documented outcomes"
      - "T12 | chaos | 06.R01,06.R03 | replay accept with same key; crash after hold before confirmation | one confirmation; hold and Negotiation consistent after restart"
      - "T13 | integration | 03.R03 | round expiry according to receiver clock vs sender claim | accept after receiver-clock expiry gets EXPIRED"
      - "T14 | abuse | 07.R02,07.R03 | 21 counters in an hour; 11th round | RATE_LIMITED; BAZAAR_NEGOTIATION_ROUND_LIMIT"
      - "T15 | integration | 07.R01,07.R02 | account deletion of buyer | seller copy keeps amounts with pseudonym; retention evidence respected"
      - "T16 | load | 08.R01,08.R02,08.R03 | 50 chains, 500 statements on Moto G profile | counter and receive p95 <= 100 ms, accept p95 <= 200 ms, no telemetry"
      - "T17 | unit | 09.R01,09.R03 | traceability tool run, seed replay | every PS-010 requirement maps to a passing test; seeds printed on failure"
      - "T18 | integration | 10.R01,10.R02,10.R03 | export, import to fresh vault, import chain with invalid signature | chains round-trip; open chains import as expired; invalid signature quarantined"
      - "T19 | a11y | 01.R01 | axe run on negotiation card and accept dialog | zero serious or critical issues; keyboard-only counter works"
    acceptance:
      - All tests T01-T19 pass in CI.
      - An acceptance is never shown as agreed until the seller's signed confirmation with hold and Deal reference is verified.
      - Conflicting signed rounds freeze the chain and never resolve by timestamp or last writer; amounts and notes never leave the two parties' encrypted channel.
  import_export_backup_rollback:
    requirements:
      - "The user export contains all Negotiations and NegotiationRounds the user is a party to, with the signed statements."
      - "Import re-verifies every signature and the hash chain; open chains import as expired and accepted chains import read-only with their evidence."
      - "Schema changes follow expand/contract and keep v1 readable for 180 days."
    export: "Sections bazaar.negotiations and bazaar.negotiation_rounds in classrup-export/v1, one line per record (schemas classrup.bazaar.negotiation/v1 and classrup.bazaar.negotiation_round/v1) plus the signed statements."
    import: "Chains where the importing principal is not a party are rejected; broken hash chains or bad signatures are quarantined; open chains become expired so stale promises are never revived."
    backup: "Vault export is the primary backup (IOX-6); relays keep only encrypted mailbox envelopes under their retention policy."
    migration_rollback: "Additive optional fields only in v1; rollback is by reinstalling the previous release; sent statements remain valid because their schemas are unchanged."
