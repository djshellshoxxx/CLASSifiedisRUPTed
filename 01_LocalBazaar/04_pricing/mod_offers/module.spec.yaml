# Exemplar module specification (ADR-0015). Rows use "a | b | c" cells. Keep IDs stable once published.
id: F01.S04.M01
scope: MVP
summary: >-
  Buyers make money offers on published sell listings. Under ADR-0016 the buyer's vault records the offer and
  publishes it as a participant statement (classrup.bazaar.offer/v1) through the StatementPublisherPort
  (F11.S01.M02 federation.record.publish), sealed end to end to the mailbox named in the verified listing projection
  on the offer's own thread stream; F11.S01.M02 signs it and the receiving vault's F11.S01.M02 acknowledges it. Before
  acting on an offer each vault asks federation.conflict.is_frozen (F11.S02.M03) and fails closed. The seller's vault verifies it and can
  accept, reject or let it expire; the buyer can withdraw before a decision. Acceptance runs in the seller's vault
  in one IndexedDB transaction: it places a local inventory hold (F01.S03.M01) tied to the lifetime of a
  noncustodial Deal (F09.S01.M01) and signs the acceptance through the shared consent API (F08.S02.M02, N13).
  Every other seller-side close is sent to the buyer as a signed decision, so both copies converge. A hold only
  protects inside one vault: two forked devices of the seller that accept different offers are detected and frozen
  for the owner, never resolved by timestamp. Offers below the seller's private minimum look to the buyer exactly
  like unanswered offers. The platform never takes payment and no relay is authoritative or can read offers.
responsibilities:
  - Own the Offer record in the buyer's and in the seller's vault and its lifecycle from made to a terminal decision.
  - Verify inbound offer, decision and withdrawal statements (signer role, offer binding, cid dedup) and quarantine anything else.
  - Enforce one open offer per buyer per listing variant, a per-listing cap of 50 open offers and the seller's private minimum offer.
  - On acceptance in the seller's vault, place a Deal-linked inventory hold, open a Deal and sign the consent in one local transaction; roll back if any fails.
  - Send a signed decision for every seller-side close except timeout and below-minimum, and derive buyer-side listing changes from the verified mirror.
  - Expire offers after their deadline (default 48 h, range 1 h to 7 days), with a 24 h grace in the buyer vault for late acceptances.
  - Register the F10 privacy ports and pseudonymize retained offers after principal deletion (N6).
  - Register the ConsentSubjectPort {canonicalBytes, currentRevision, partyRole, isCommitted} of F08.S02.M02 for subjectType bazaar_offer and echo every received consent statement to the other participant before committing on it (N13).
  - Implement the F09.S01.M01 ContextTermsPort {verify, openerRole, ownerRole} for Deal context type offer, including Deals opened on an accepted negotiation round of the offer (N5).
  - Consume federation.conflict.detected and federation.conflict.resolved and call federation.conflict.is_frozen synchronously before acting on an offer subject (F11.S02.M03).
non_responsibilities:
  - Counteroffer rounds (F01.S04.M02 negotiation owns them and reuses Offer as round zero).
  - Payment, receipts, disputes and the Deal lifecycle after acceptance (F09).
  - Messaging between parties (F08); offers are referenced from threads, not copied.
  - Consent signing and verification primitives (F08.S02.M02) and mirror verification of listing projections (F11.S01.M02).
  - Signing, seq allocation, mailbox routing and transport acknowledgements of statements (F11.S01.M02 and F11.S02.M01) and conflict records (F11.S02.M03).
depends_on: [F01.S01.M01, F01.S01.M03, F01.S02.M01, F01.S03.M01, F09.S01.M01, F09.S03.M01, F09.S03.M03, F07.S02.M02, F08.S02.M02, F11.S01.M01, F11.S01.M02, F11.S02.M03, F16.S02.M03, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-MNY-001, CTR-IDM-001, CTR-PRV-001, CTR-FED-001, CTR-SCH-001]
user_stories:
  - As a buyer, I can offer a price below the asking price and see whether it is pending, accepted, rejected or expired.
  - As a seller, I can review all open offers on my listing sorted by amount and accept one, which reserves the item for that buyer.
  - As a buyer, I can withdraw my offer before the seller decides.
  - As a buyer, I can trust that an acceptance shown to me was signed by the listing author for exactly my offer.
edge_cases:
  - Two tabs of the seller's vault accept two different offers for the last unit at the same time; the IndexedDB transaction serializes them, so within one vault exactly one acceptance succeeds and the other gets CONFLICT_STATE.
  - Two devices of the seller accept different offers for the last unit while offline; both acceptances are kept, on sync F01.S03.M01 emits bazaar.inventory.conflict_detected and freezes both holds, both offers become frozen and neither Deal proceeds until the owner keeps one and sends a signed close to the other buyer.
  - Listing is edited materially (price or condition) while offers are open; offers stay open but are marked listingChangedSinceOffer in the seller vault, and in the buyer vault once the newer verified projection arrives.
  - Listing is unpublished, expired or closed in the seller vault; all open offers become expired with reason listing_unavailable and each buyer receives a signed decision. A relay removing the projection from its index changes no offer.
  - Buyer is blocked by the seller after making an offer; the offer is rejected locally with reason blocked, the buyer receives an ordinary signed rejection with reason seller_rejected that does not reveal the block, and later statements from the buyer are dropped silently (N7).
  - Offer currency differs from the listing currency; rejected unless the listing accepts that currency.
  - Buyer goes offline after submitting; the outbox replays with the same Idempotency-Key and gets the original response.
  - An offer below the seller's private minimum is stored rejected and hidden; the buyer sees the same peer acknowledgement as for any offer and the offer expires at expiresAt with reason timeout.
  - The seller accepts 5 minutes before expiry on the seller's clock and the acceptance reaches the buyer 3 hours after expiry; the buyer vault still applies it inside the 24 h grace. After the grace the buyer sends a signed timeout close, and the seller cancels the Deal and releases the hold.
  - The buyer withdraws while the seller's acceptance is in transit; the seller vault receives the withdrawal after accepting, cancels the Deal and releases the hold (withdrawn before accept); the buyer keeps the late acceptance only as evidence.
  - A decision signed by a key that is not the listing author, or an acceptance consent replayed from another offer, is quarantined and the offer stays made.
  - The seller answers with a counter; the offer is rejected with reason countered in the same transaction as the first negotiation round and the chain continues in F01.S04.M02.
  - F11.S02.M03 detects that the seller signed two acceptance consents with different subjectRevisionHash values for one offer and emits federation.conflict.detected; the offer freezes and accept, reject, withdraw and resolve_conflict return CONFLICT_STATE until the conflict is resolved; if the conflict store cannot be read they return DEPENDENCY_UNAVAILABLE.
ux:
  screens:
    - "Make offer sheet: amount input with currency, quantity, optional note (≤ 280 chars), expiry selector, summary showing asking price from the verified listing projection."
    - "Seller offers list: sortable by amount and time, accept/reject buttons with confirmation dialog; offers below the private minimum are not listed."
    - "Buyer offer status card inside the listing and the conversation thread (F08.S02.M01) with sync state chips (prepared, relay received, seller received)."
    - "Fork resolution sheet for the seller: frozen offers on the same unit, keep one, the others receive a signed close."
  states: [loading, empty, pending-offline, submitted, expiring-grace, accepted, rejected, expired, withdrawn, frozen-conflict, conflict]
  a11y:
    - Amount input has a visible label including currency and uses inputmode=decimal.
    - Status changes are announced through an aria-live polite region.
    - Accept and reject are buttons ≥ 44×44 px with distinct accessible names including the amount.
processes:
  domain_schema:
    requirements:
      - An Offer stores listing (with the cid of the verified projection the buyer saw), variant, quantity, buyer, seller, amount as integer minor units, currency, optional note, expiry, status and the cid of the signed offer statement, with tenant and revision per CTR-ID-001.
      - Offer records are P2 (visible to buyer and seller only), exist only in those two vaults, and are retained under RET-EVIDENCE because accepted offers form commerce evidence; they are purged when the evidence window ends.
      - The offer amount is immutable after creation; changing the price requires a new offer or a negotiation round.
      - "The vault record classrup.bazaar.offer_record/v1 is distinct from the statements classrup.bazaar.offer/v1 (signer buyer), classrup.bazaar.offer_decision/v1 (signer listing author) and classrup.bazaar.offer_withdrawal/v1 (signer buyer); the acceptance is a classrup.comms.consent/v1 statement signed by the listing author (N13)."
    entities:
      - name: Offer
        schema: classrup.bazaar.offer_record/v1
        storage: device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key, generated by the buyer vault"
          - "tenantId: uuidv7 — fixed local-vault tenant (ID-6)"
          - "localRole: enum — buyer | seller (which side this vault holds)"
          - "listingId: uuidv7 — ref F01.S01.M01 Listing (seller) or verified mirror (buyer); must be published"
          - "listingCid: string — cid of the verified listing projection the buyer saw"
          - "variantId?: uuidv7 — ref F01.S03.M02 Variant; required when listing has variants"
          - "buyerId: did:key — offer maker and signer of the offer statement"
          - "sellerId: did:key — author of the verified listing projection"
          - "quantity: int — 1..100, default 1"
          - "amount: Money — total for quantity; CTR-MNY-001; > 0; <= maxAmount(currency) (F09.S03.M03)"
          - "note?: string — ≤ 280 code points, plain text"
          - "expiresAt: timestamp — createdAt + 1 h..7 d; evaluated on each vault's own clock"
          - "status: enum — made | accepted | frozen | rejected | withdrawn | expired"
          - "decisionReason?: enum — seller_rejected | countered | below_minimum | listing_full | blocked | listing_unavailable | superseded | timeout | conflict_resolved | buyer_withdrew"
          - "hiddenFromSeller: boolean — true for below_minimum offers; never shown in the seller list"
          - "listingRevisionAtOffer: int — listing revision seen by buyer"
          - "listingChangedSinceOffer: boolean — seller vault: set by bazaar.listing.edited; buyer vault: set by a newer verified projection"
          - "listingUnavailable: boolean — buyer vault only: the projection was tombstoned or expired; informational"
          - "offerCid: string — cid returned by F11.S01.M02 federation.record.publish (FED-7); equals the subjectRevisionHash of the acceptance consent"
          - "streamId: string — thr:<base64url 16 random bytes> chosen by the buyer vault at make; every statement about this offer and its negotiation, and the seller's reservation for it, uses this ext.stream"
          - "consentCid?: string — acceptance consent statement (comms.consent.sign) signed by the listing author"
          - "decisionCid?: string — signed decision statement"
          - "withdrawalCid?: string — signed withdrawal or timeout statement"
          - "dealId?: uuidv7 — ref F09.S01.M01 Deal, deterministic from contextRef {offer, offerId}, set on accept"
          - "holdId?: uuidv7 — seller vault: ref F01.S03.M01 InventoryHold"
          - "reservationCid?: string — signed reservation statement sent to the buyer"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - At most one offer with status made per (buyerId, listingId, variantId) in each vault.
          - status accepted implies dealId and consentCid are set and, in the seller vault, an inventory hold was taken at acceptance; later state (completion, cancellation) is the Deal's (F09.S01.M01).
          - buyerId differs from sellerId.
          - amount, quantity and offerCid never change after creation.
          - Field classes are annotated per F10.S02.M02 (all P2; note scanned locally, never federated).
    sql: |
      CREATE TABLE bazaar_offer (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, listing_id TEXT NOT NULL, variant_id TEXT,
        buyer_id TEXT NOT NULL, seller_id TEXT NOT NULL, amount_minor TEXT NOT NULL, currency TEXT NOT NULL,
        status TEXT NOT NULL, expires_at TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX bazaar_offer_open ON bazaar_offer(tenant_id, buyer_id, listing_id, ifnull(variant_id,''))
        WHERE status = 'made';
      CREATE INDEX bazaar_offer_listing ON bazaar_offer(tenant_id, listing_id, status);
  validation_rules:
    requirements:
      - Offer input is validated strictly against the schema; unknown fields are rejected with VALIDATION_FAILED.
      - Business rules check listing state, currency acceptance, self-dealing, blocks and open-offer caps before persistence; each rule names the vault that runs it, the buyer vault evaluating against the verified listing projection (F11.S01.M02 mirror view) and the seller vault against its own records.
      - Every rule violation maps to exactly one stable error code with a localized message key.
      - "On receipt in the seller vault an offer below SellTerms.minOffer is stored as rejected with reason below_minimum and hidden from the seller list; the buyer sees exactly what an unanswered offer shows: the same classrup.federation.ack/v1 signed by the seller's F11.S01.M02, no rejection statement and expiry at expiresAt with reason timeout."
      - "Inbound statements are verified before they change state: Ed25519 over JCS, signer = buyerId for offer and withdrawal statements, signer = author of the verified listing projection for decisions, decisions and withdrawals bound to the offer statement cid, cid deduplication; failures are quarantined with signature_invalid, role_mismatch or binding_mismatch."
      - "Before accept, reject, withdraw and resolve_conflict, and before applying an inbound acceptance, decision or withdrawal, the vault calls federation.conflict.is_frozen (F11.S02.M03) synchronously for consent:bazaar_offer:<offerId> and, in the seller vault, for the reservation subject of the offered item; frozen refuses with CONFLICT_STATE (params.state frozen) and a store that cannot answer refuses with DEPENDENCY_UNAVAILABLE."
    rules:
      - "V01 | both vaults: amount.amount is a positive integer string <= maxAmount(amount.currency) and amount.currency is registered (F09.S03.M01) | VALIDATION_FAILED"
      - "V02 | buyer vault: the verified listing projection exists, is kind sell, is not tombstoned and is before its expiresAt; seller vault receive: own Listing (F01.S01.M01) is published, kind sell and not expired, and listingCid names a projection this vault signed | BAZAAR_LISTING_NOT_OFFERABLE"
      - "V03 | buyer vault: amount.currency is in the projection's acceptedCurrencies; seller vault: bazaar.sell_terms.accepts | BAZAAR_OFFER_CURRENCY_NOT_ACCEPTED"
      - "V04 | both vaults: buyerId != listing author | BAZAAR_OFFER_SELF"
      - "V05 | both vaults: neither party has blocked the other (F07.S02.M02 isBlockedEither); the seller vault drops statements from blocked DIDs silently (N7) | BLOCKED_PARTY"
      - "V06 | buyer vault: no other own open offer on the same listing variant; seller vault: unique open index | BAZAAR_OFFER_DUPLICATE"
      - "V07 | seller vault receive: listing has fewer than 50 open offers; the 51st receives a signed decision rejected with reason listing_full | BAZAAR_OFFER_LIMIT"
      - "V08 | buyer vault: expiresAt between now+1h and now+7d; seller vault: the claimed expiresAt is at most 7 d plus 10 min after receipt | VALIDATION_FAILED"
      - "V09 | variantId present iff the listing has variants (buyer: variants of the verified projection; seller: F01.S03.M01 items), the variant is in stock (buyer: inStock flag; seller: available >= quantity) | VALIDATION_FAILED"
      - "V10 | both vaults receive: signature verifies Ed25519 over JCS; offer and withdrawal signed by buyerId; decision signed by the author of the verified listing projection; decision and withdrawal carry the offerCid of a stored offer | VALIDATION_FAILED"
      - "V11 | both vaults: quantity is an integer 1..100 | VALIDATION_FAILED"
      - "V12 | seller vault receive: amount >= SellTerms.minOffer in the same currency, else stored rejected with reason below_minimum, hidden, no statement and no event | BAZAAR_OFFER_BELOW_MINIMUM"
      - "V13 | seller vault accept: now < expiresAt on the seller clock | EXPIRED"
      - "V14 | buyer vault: an acceptance is applied only when comms.consent.verify returns valid for signerDid = listing author over this offer's statement digest, no later than expiresAt + 24 h on the buyer clock; later acceptances are answered with a timeout withdrawal | EXPIRED"
      - "V15 | seller vault receive: at most 20 offers per listing per hour from keys this vault has never seen; excess statements are dropped without any decision or event (the F11.S01.M02 receipt acknowledgement proves delivery only) | RATE_LIMITED"
      - "V16 | both vaults: federation.conflict.is_frozen({subjectRef: consent:bazaar_offer:<offerId>}) and, for accept, the reservation subject of the item return frozen false | CONFLICT_STATE"
      - "V17 | both vaults: federation.conflict.is_frozen answers; a store that cannot be read refuses the action (fail closed) | DEPENDENCY_UNAVAILABLE"
  workflow_state_machine:
    requirements:
      - Offers follow the declared lifecycle; any transition not listed is refused with CONFLICT_STATE.
      - Acceptance in the seller vault is atomic with the inventory hold, the Deal creation and the consent signature; if any of them fails, the offer stays made.
      - Accepting one offer for the last available unit expires all other open offers on that variant with reason superseded, and each of those buyers receives a signed decision.
      - "The first counter by F01.S04.M02 moves the root offer from made to rejected with reason countered in the same transaction (N10); once countered the offer can no longer be accepted or withdrawn, and the buyer vault applies the same transition on the verified first round."
      - "Expiry is evaluated in each vault: the seller vault expires at expiresAt on its clock without a statement, and the buyer vault applies a verified acceptance until expiresAt + 24 h; after that grace the buyer vault sends a signed timeout close, and a seller vault that had accepted cancels the Deal (commerce.deal.cancel) and the hold is released."
      - "Within one vault two offers for the same unit are never both accepted; acceptances from forked devices of the seller are both kept, frozen through bazaar.inventory.conflict_detected and resolved only by the owner keeping one and sending a signed close to the other buyer."
      - "Every seller-side close except timeout and below_minimum is sent to the buyer as a signed decision; the buyer vault derives listing changes and unavailability from verified mirror updates (federation.record.accepted, federation.tombstone.applied), never from bazaar.listing.* events, which fire only in the seller vault (EVT-8)."
    machines:
      - entity: Offer
        initial: made
        terminal: [rejected, withdrawn, expired]
        transitions:
          - "made -> accepted | seller vault: bazaar.offer.accept by the listing author before expiresAt; buyer vault: comms.consent.received for subjectType bazaar_offer and this offerId, verified valid by comms.consent.verify for the listing author within expiresAt + 24 h | seller: hold (holder {offer, offerId}, ttl 7 d, maxExpiresAt = Deal expiry, linkedDealId), commerce.deal.open and comms.consent.sign in one IndexedDB transaction, reservation statement queued; emits bazaar.offer.accepted"
          - "made -> rejected | seller vault: bazaar.offer.reject (seller_rejected), the first counter of F01.S04.M02 (countered), receipt below minOffer (below_minimum), 51st open offer (listing_full) or identity.block.added (blocked); buyer vault: verified decision outcome rejected, or verified first negotiation round (countered) | decision statement queued except for countered and below_minimum; block decision says seller_rejected; emits bazaar.offer.rejected except for below_minimum"
          - "made -> withdrawn | buyer vault: bazaar.offer.withdraw by buyer, or identity.block.added for the seller; seller vault: verified withdrawal statement (buyer_withdrew) | withdrawal statement queued; emits bazaar.offer.withdrawn"
          - "made -> expired | seller vault: expiresAt on the seller clock (timeout, no statement), listing unpublished, expired or closed (listing_unavailable), last unit taken (superseded), or verified timeout close from the buyer; buyer vault: verified decision outcome expired, or expiresAt + 24 h grace on the buyer clock (timeout) | seller: decision statement queued for listing_unavailable and superseded; buyer: timeout close queued after the grace; emits bazaar.offer.expired"
          - "accepted -> withdrawn | seller vault: verified withdrawal statement from the buyer that crossed the acceptance | commerce.deal.cancel in the same transaction; the hold is released by F01.S03.M01 on commerce.deal.cancelled with a signed release; emits bazaar.offer.withdrawn (withdrawn before accept)"
          - "accepted -> expired | seller vault: verified timeout close from the buyer because the acceptance arrived after the buyer's grace | commerce.deal.cancel in the same transaction; hold released; emits bazaar.offer.expired (timeout)"
          - "accepted -> frozen | seller vault: bazaar.inventory.conflict_detected names this offer's hold (acceptance on a forked device); both vaults: federation.conflict.detected whose freezeScope names consent:bazaar_offer:<offerId>; buyer vault: comms.consent.verify returns conflicted | the Deal does not proceed; the owner must keep one offer"
          - "frozen -> accepted | seller vault: bazaar.offer.resolve_conflict keeps this offer; both vaults: federation.conflict.resolved superseded by a renegotiated consent signed by every required signer; buyer vault: comms.consent.verify returns valid again | competing offers are dropped in the same transaction; the hold returns to active"
          - "frozen -> rejected | seller vault: bazaar.offer.resolve_conflict drops this offer, or federation.conflict.resolved with decision drop_all; buyer vault: verified decision rejected with reason conflict_resolved, or federation.conflict.resolved drop_all | commerce.deal.cancel; decision statement queued to that buyer; emits bazaar.offer.rejected"
          - "accepted -> rejected | buyer vault: verified decision rejected with reason conflict_resolved bound to this offer | the mirrored Deal is cancelled by the seller's statement; emits bazaar.offer.rejected"
          - "frozen -> expired | commerce.deal.cancelled for the linked Deal, or the frozen hold reached maxExpiresAt | emits bazaar.offer.expired (timeout)"
    timeouts:
      - "Seller vault: expiry sweep every 60 s while the app is open and at app start transitions made offers with expiresAt ≤ now to expired (reason timeout) without a statement."
      - "Buyer vault: made offers move to expired (reason timeout) at expiresAt + 24 h and queue a signed timeout close; until then a verified acceptance is still applied."
  commands_queries_events:
    requirements:
      - The module exposes the vault commands make, receive, accept, reject, withdraw and resolve_conflict and two queries with the signatures below.
      - Every command emits exactly the listed events in the same transaction as the state change.
      - "In the seller vault the module consumes listing, inventory and block events to keep open offers consistent; in the buyer vault it consumes verified mirror updates (federation.record.accepted, federation.tombstone.applied) and consent events instead of bazaar.listing.* events."
      - "Statements and signer roles are registered with F11.S01.M01 (N2): classrup.bazaar.offer/v1 and classrup.bazaar.offer_withdrawal/v1 signed by the buyer, classrup.bazaar.offer_decision/v1 signed by the listing author; the vault acts only on statements this module or F08.S02.M02 accepted."
      - "Acceptance is signed with comms.consent.sign {subjectType bazaar_offer, subjectRef offerId, subjectRevision 1, subjectRevisionHash (ID-3 cid sha256-<base64url> of ConsentSubjectPort.canonicalBytes, which equals offerCid), statementKey consent.bazaar.offer.accept.v1, statementLocale (BCP 47 locale of the wording shown), statementTextHash} and verified with comms.consent.verify; the module registers the ConsentSubjectPort for bazaar_offer, a conflicted status (decline, revocation after commit or peer-reported invalidity) freezes the offer, and every received consent statement is echoed to the other participant before the vault commits on it (N13)."
      - "Offer, decision and withdrawal statements are published only through the StatementPublisherPort (F11.S01.M02 federation.record.publish, audience participants, recipients [{did, mailboxId}], ext.stream thr:<streamId>, sealed ciphertext of at most 12288 bytes) and acknowledged by the receiving vault's F11.S01.M02 with classrup.federation.ack/v1; the module implements the F09.S01.M01 ContextTermsPort for context type offer, including Deals on an accepted negotiation round read through the NegotiationTermsPort that F01.S04.M02 registers here."
    commands:
      - name: bazaar.offer.make
        capability: bazaar.offer.make
        input: "[vault-local in the buyer vault + statement classrup.bazaar.offer/v1 published with federation.record.publish {audience participants, recipients [{did: sellerId, mailboxId from the projection's mailboxHints}], stream streamId, ciphertext <= 12288 bytes}] { listingId, listingCid, variantId?, quantity? (1..100, default 1), amount: Money, note?, expiresInMs? (default 172800000) }"
        output: "{ offerId, revision: 1, expiresAt, offerCid, syncState: prepared }"
        errors: [VALIDATION_FAILED, NOT_FOUND, BAZAAR_LISTING_NOT_OFFERABLE, BAZAAR_OFFER_CURRENCY_NOT_ACCEPTED, BAZAAR_OFFER_SELF, BLOCKED_PARTY, BAZAAR_OFFER_DUPLICATE, RATE_LIMITED]
        emits: [bazaar.offer.made]
        idempotent: true
      - name: bazaar.offer.receive
        capability: bazaar.offer.receive
        input: "[vault-local, inbound statement] { envelope: classrup.bazaar.offer/v1 | classrup.bazaar.offer_withdrawal/v1 | classrup.bazaar.offer_decision/v1, provenance }"
        output: "{ offerId?, accepted: boolean, status?, quarantineReason?: signature_invalid|role_mismatch|binding_mismatch|unknown_offer|duplicate }"
        errors: [VALIDATION_FAILED, UNSUPPORTED_SCHEMA_VERSION, CONFLICT_STATE, RATE_LIMITED, DEPENDENCY_UNAVAILABLE]
        emits: [bazaar.offer.made, bazaar.offer.rejected, bazaar.offer.withdrawn, bazaar.offer.expired]
        idempotent: true
      - name: bazaar.offer.accept
        capability: bazaar.offer.accept
        input: "[vault-local in the seller vault; produces classrup.comms.consent/v1 (comms.consent.sign), classrup.commerce.deal/v1 (commerce.deal.open {contextRef {type: offer, id: offerId}, contextCid: offerCid, parties [buyer, seller], obligations [{payer buyer, payee seller, amount, purpose goods}]}) and classrup.bazaar.reservation/v1 (bazaar.inventory.issue_reservation to the buyer)] { offerId, expectedRevision }"
        output: "{ offerId, revision, dealId, holdId, consentCid, reservationCid }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, BAZAAR_OFFER_HOLD_FAILED, EXPIRED, DEPENDENCY_UNAVAILABLE, COMMERCE_DEAL_CONTEXT_CONFLICT, COMMS_CONSENT_SUBJECT_MISMATCH]
        emits: [bazaar.offer.accepted, bazaar.offer.expired]
        idempotent: true
      - name: bazaar.offer.reject
        capability: bazaar.offer.reject
        input: "[vault-local + statement classrup.bazaar.offer_decision/v1 except for countered] { offerId, expectedRevision, reason?: seller_rejected|countered (default seller_rejected; countered only from F01.S04.M02) }"
        output: "{ offerId, revision, decisionCid? }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, VALIDATION_FAILED, DEPENDENCY_UNAVAILABLE]
        emits: [bazaar.offer.rejected]
        idempotent: true
      - name: bazaar.offer.withdraw
        capability: bazaar.offer.withdraw
        input: "[vault-local in the buyer vault + statement classrup.bazaar.offer_withdrawal/v1] { offerId, expectedRevision }"
        output: "{ offerId, revision, withdrawalCid, syncState: prepared }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, DEPENDENCY_UNAVAILABLE]
        emits: [bazaar.offer.withdrawn]
        idempotent: true
      - name: bazaar.offer.resolve_conflict
        capability: bazaar.offer.resolve_conflict
        input: "[vault-local in the seller vault + statement classrup.bazaar.offer_decision/v1 to each dropped buyer] { keepOfferId, dropOfferIds[1..10] }"
        output: "{ keptOfferId, dropped: [{ offerId, decisionCid, cancelledDealId }] }"
        errors: [NOT_FOUND, CONFLICT_STATE, DEPENDENCY_UNAVAILABLE]
        emits: [bazaar.offer.rejected]
        idempotent: true
    note: >-
      Execution sites (ADR-0016): make and withdraw are vault commands in the buyer vault; accept, reject and
      resolve_conflict are vault commands in the seller vault; receive runs in both. Statements (N2, registered with
      F11.S01.M01): classrup.bazaar.offer/v1 {offerId, listingId, listingCid, listingRevision, variantId?, quantity,
      amount, expiresAt, note?, buyerMailboxHint}, signer role buyer (buyerId); classrup.bazaar.offer_withdrawal/v1
      {offerId, offerCid, reason: buyer_withdrew|timeout}, signer role buyer; classrup.bazaar.offer_decision/v1
      {offerId, offerCid, outcome: rejected|expired, reason: seller_rejected|listing_full|listing_unavailable|superseded|conflict_resolved},
      signer role listing author; acceptance classrup.comms.consent/v1 (F08.S02.M02, statementKey
      consent.bazaar.offer.accept.v1), signer role listing author, plus classrup.commerce.deal/v1 (F09.S01.M01) and
      classrup.bazaar.reservation/v1 (F01.S03.M01). Countered is implied by the first negotiation round whose prev is
      the offerCid; below_minimum and timeout produce no decision. Every statement of this module is published through
      the StatementPublisherPort (F11.S01.M02 federation.record.publish, audience participants, recipients [{did,
      mailboxId}], ext.stream = the offer's streamId, sealed ciphertext <= 12288 bytes) and acknowledged by the
      receiving vault's F11.S01.M02 with classrup.federation.ack/v1; this module signs no acknowledgement. Relays only
      carry the sealed envelopes. ConsentSubjectPort (F08.S02.M02) for bazaar_offer: canonicalBytes(offerId, 1) =
      JCS of the stored offer envelope without sig and cid (so its ID-3 cid equals offerCid), currentRevision = 1,
      partyRole = buyer or seller (listing author; consent.bazaar.offer.accept.v1 requires seller), isCommitted = status
      accepted. ContextTermsPort (F09.S01.M01) for context type offer: verify(contextRef {offer, offerId}, contextCid,
      parties, obligations) recomputes parties [buyer payer, seller payee] and one obligation {payer buyer, payee seller,
      amount, purpose goods} from the verified offer statement when contextCid = offerCid, or from the accepted
      negotiation round when contextCid is a round cid of a chain rooted in offerId, read through the
      NegotiationTermsPort that F01.S04.M02 registers here (inverted registration, F01.S04.M02 depends on this module);
      openerRole(offer) and ownerRole(offer) = listing author. Commitment conflicts on acceptances are the
      classrup.comms.consent/v1 entry of F08.S02.M02 (one signer, same subjectType, subjectRef and statementKey, different
      subjectRevisionHash), confirmed for bazaar_offer. Privacy
      ports (N6): the module registers ExportSectionPort (section bazaar.offers), DeletionPort (plan: pseudonymize the
      deleted party's DID in retained offers, purge notes of non-evidence offers) and RetentionPurgePort (purge after
      RET-EVIDENCE) with F10.S01.M03, F10.S01.M04 and F10.S01.M02.
    queries:
      - name: bazaar.offer.list_for_listing
        capability: bazaar.offer.read_as_seller
        input: "{ listingId, status?: made|all, sort?: amount_desc|created_desc, includeHidden? (internal callers only), cursor?, limit ≤ 50 }"
        output: "{ items: Offer[], nextCursor? }"
        errors: [NOT_FOUND]
      - name: bazaar.offer.list_mine
        capability: bazaar.offer.read_own
        input: "{ status?, cursor?, limit ≤ 50 }"
        output: "{ items: Offer[], nextCursor? }"
        errors: []
    events_produced:
      - {type: bazaar.offer.made, privacy: P2, payload: "{ offerId, listingId, variantId?, quantity, buyerId, sellerId, amount, expiresAt, localRole }"}
      - {type: bazaar.offer.accepted, privacy: P2, payload: "{ offerId, listingId, variantId?, quantity, buyerId, sellerId, amount, dealId, holdId?, localRole }"}
      - {type: bazaar.offer.rejected, privacy: P2, payload: "{ offerId, listingId, buyerId, sellerId, reason, localRole }"}
      - {type: bazaar.offer.withdrawn, privacy: P2, payload: "{ offerId, listingId, buyerId, sellerId, reason: buyer_withdrew|blocked, dealId?, localRole }"}
      - {type: bazaar.offer.expired, privacy: P2, payload: "{ offerId, listingId, buyerId, sellerId, reason, dealId?, localRole }"}
    events_consumed:
      - {type: bazaar.listing.edited, effect: "seller vault: set listingChangedSinceOffer=true on open offers when the edit is material"}
      - {type: bazaar.listing.unpublished, effect: "seller vault: expire open offers with reason listing_unavailable and queue a signed decision to each buyer, including hidden below-minimum offers still before expiresAt"}
      - {type: bazaar.listing.expired, effect: "seller vault: expire open offers with reason listing_unavailable and queue signed decisions as for unpublish"}
      - {type: bazaar.listing.closed, effect: "seller vault: expire open offers with reason listing_unavailable and queue signed decisions as for unpublish"}
      - {type: bazaar.inventory.depleted, effect: "seller vault: expire open offers on the variant with reason superseded and queue signed decisions, including hidden below-minimum offers still before expiresAt"}
      - {type: bazaar.inventory.conflict_detected, effect: "seller vault: accepted offers whose holdId is named move to frozen; the owner resolves with bazaar.offer.resolve_conflict"}
      - {type: identity.block.added, effect: "seller vault: reject open offers from the blocked buyer with local reason blocked and a decision statement with reason seller_rejected; buyer vault: withdraw open offers to the blocked seller with a withdrawal statement"}
      - {type: federation.record.accepted, effect: "buyer vault: a newer verified projection of an offered listing (author = sellerId) sets listingChangedSinceOffer when its listingRevision is higher with material changes, and listingUnavailable when the variant is no longer in stock or expiresAt passed"}
      - {type: federation.tombstone.applied, effect: "buyer vault: a tombstone of the offered listing's projection sets listingUnavailable; the offer stays made until the seller's decision or the grace ends"}
      - {type: comms.consent.received, effect: "buyer vault: for subjectType bazaar_offer and subjectRef offerId, echo the received consent statement to the seller, then call comms.consent.verify for signerDid = sellerId over offerCid; valid within expiresAt + 24 h moves made to accepted (later answers with a timeout close), conflicted moves accepted to frozen, stale or revoked is ignored"}
      - {type: federation.conflict.detected, effect: "both vaults: freezeScope naming consent:bazaar_offer:<offerId> moves an accepted offer to frozen; candidateCids, statementClass and freezeScope are kept for the resolution sheet"}
      - {type: federation.conflict.resolved, effect: "both vaults: drop_all moves the frozen offer to rejected (conflict_resolved) and cancels its Deal; superseded by a renegotiated consent returns it to accepted"}
      - {type: commerce.deal.cancelled, effect: "frozen offers whose dealId matches move to expired with reason timeout"}
      - {type: privacy.deletion.completed, effect: "replace the deleted principal's DID with the payload pseudonym in offers retained under RET-EVIDENCE and purge notes of non-evidence offers"}
    errors:
      - "BAZAAR_LISTING_NOT_OFFERABLE | 409 | no | listing is not published, not a sell listing, or expired"
      - "BAZAAR_OFFER_CURRENCY_NOT_ACCEPTED | 422 | no | listing does not accept the offer currency"
      - "BAZAAR_OFFER_SELF | 422 | no | a seller cannot offer on their own listing"
      - "BAZAAR_OFFER_DUPLICATE | 409 | no | buyer already has an open offer on this listing variant"
      - "BAZAAR_OFFER_LIMIT | 409 | no | listing reached 50 open offers"
      - "BAZAAR_OFFER_HOLD_FAILED | 409 | no | inventory could not be held; offer remains open"
      - "BAZAAR_OFFER_BELOW_MINIMUM | 422 | no | seller vault only: the offer is below the private minimum; stored rejected and hidden, never reported to the buyer"
    example: |
      buyer vault: vault.dispatch("bazaar.offer.make", { "listingId": "0192f3a4-5b6c-7d8e-9f01-23456789abcd", "listingCid": "sha256-Lst...",
        "amount": { "amount": "4500", "currency": "EUR" } }, idempotencyKey: "0192f3a4-0000-7000-8000-000000000001")
      => { "offerId": "0192f3a5-…", "revision": 1, "expiresAt": "2026-11-06T10:00:00.000Z", "offerCid": "sha256-Ofr...", "syncState": "prepared" }
         federation.record.publish { type: "classrup.bazaar.offer/v1", audience: "participants", recipients: [{ did: seller, mailboxId: hint }], stream: "thr:Hk2Qm..." } signs it (seq allocated by F11.S01.M02)
      seller vault: vault.dispatch("bazaar.offer.receive", { "envelope": { "type": "classrup.bazaar.offer/v1", "author": "did:key:z6MkBuyer...", ... } })
      => { "offerId": "0192f3a5-…", "accepted": true, "status": "made" }
      seller vault: vault.dispatch("bazaar.offer.accept", { "offerId": "0192f3a5-…", "expectedRevision": 1 }, idempotencyKey: "0192f3a4-0000-7000-8000-000000000002")
      => { "offerId": "0192f3a5-…", "revision": 2, "dealId": "0192f3a6-…", "holdId": "0192f3a6-…", "consentCid": "sha256-Cns...", "reservationCid": "sha256-Rsv..." }
         sync outbox: encrypted classrup.comms.consent/v1 (consent.bazaar.offer.accept.v1), classrup.commerce.deal/v1 and classrup.bazaar.reservation/v1 to the buyer
      buyer vault: comms.consent.received → echo to the seller → comms.consent.verify { subjectType: "bazaar_offer", subjectRef: "0192f3a5-…", subjectRevisionHash: "sha256-Ofr...", signerDid: seller, statementKey: "consent.bazaar.offer.accept.v1" } = valid → offer accepted
  authorization_capabilities:
    requirements:
      - "Vault policy (CAP-8): only the unlocked local principal acts: the buyer vault makes and withdraws, the listing author's vault accepts, rejects and resolves conflicts; inbound statements count only when signed by an authorized key of buyerId (offer, withdrawal) or of the listing author of the verified projection (decision, acceptance consent)."
      - "Offers exist only in the buyer's and the seller's vaults; any other local query returns NOT_FOUND and relays hold only ciphertext."
      - "No relay role can read offers; a party may voluntarily attach decrypted offer evidence to a report on one relay, and that relay's moderators see only what was attached (CAP-9, PRV-5)."
    capabilities:
      - "bazaar.offer.make | local principal (buyer) | buyer vault unlocked; not isBlockedEither(listing author); listing projection verified; the seller vault accepts the statement only if signed by a key of buyerId"
      - "bazaar.offer.receive | peer | vault policy: offer and withdrawal statements only when signed by a key of buyerId; decisions only when signed by the author key of the verified listing projection; otherwise quarantined"
      - "bazaar.offer.accept | local principal (seller) | seller vault: actor is the listing author (Listing.ownerId); the buyer vault accepts the acceptance only through comms.consent.verify for that author key"
      - "bazaar.offer.reject | local principal (seller), system (F01.S04.M02) | seller vault: actor is the listing author; reason countered only from F01.S04.M02 inside the counter transaction; buyer vault: only F01.S04.M02 after a verified first round"
      - "bazaar.offer.withdraw | local principal (buyer) | buyer vault: offer.buyerId = local principal and status made"
      - "bazaar.offer.resolve_conflict | local principal (seller) | seller vault: actor is the listing author; every named offer is frozen on the same unit"
      - "bazaar.offer.read_as_seller | local principal (seller) | seller vault only; hidden offers only for internal callers (F01.S01.M04 evidence check); no relay role can read offers"
      - "bazaar.offer.read_own | local principal (buyer) | buyer vault: offer.buyerId = local principal"
  failure_recovery_idempotency:
    requirements:
      - All commands are idempotent per CTR-IDM-001 and mutating commands require expectedRevision; inbound statements are idempotent by cid.
      - "Concurrent acceptances within one vault (two tabs) serialize on the inventory hold so exactly one wins; acceptances on two forked devices of the seller are both kept, detected by F01.S03.M01 and frozen for the owner, never resolved by timestamp."
      - A failure after the hold but before commit leaves neither hold, Deal nor consent (single IndexedDB transaction).
    idempotency: "Idempotency-Key required on every command and kept 24 h in the vault; replay returns the stored response. Inbound statements are deduplicated by cid; the Deal id is deterministic from contextRef {offer, offerId}."
    concurrency: "expectedRevision on accept, reject, withdraw and resolve_conflict; the open-offer unique index enforces V06 under races; accept runs hold + Deal + consent + offer update in one IndexedDB readwrite transaction in the seller vault, so two tabs serialize. There is no distributed lock: forked seller devices each commit locally, and on sync F01.S03.M01 freezes both holds and this module freezes both offers."
    retries: "Client retries only transport errors and RATE_LIMITED; BAZAAR_OFFER_HOLD_FAILED is not retried automatically; statement transport follows IDM-4."
    offline: "All commands commit locally offline; their statements wait in the sync outbox (prepared) and the UI shows 'not yet delivered'. An acceptance is binding for the seller vault immediately (local hold) but the buyer sees it only after delivery; if the buyer withdrew first, the later-delivered statements cross and the seller vault cancels the Deal (withdrawn before accept). The buyer's 24 h grace covers acceptances delayed across expiry."
    partial_failure: "Hold, Deal, consent and offer update share one IndexedDB transaction in the seller vault; failure aborts all of them. Delivery failure never rolls back local state; it leaves the statement in the sync outbox with retry (CTR-IDM-001 IDM-4/IDM-7)."
  privacy_retention_abuse:
    requirements:
      - Offer amounts and notes never appear in public listing views, search, federation or notification payloads.
      - Offer evidence is retained for RET-EVIDENCE and pseudonymized on principal deletion (privacy.deletion.completed) in the deleting party's vault; the counterparty keeps its own copy.
      - Offer spam and lowballing harassment are limited by caps, rate limits and seller-side filters, including the private minimum, which gives the buyer no observable signal.
      - "The module registers ExportSectionPort (section bazaar.offers), DeletionPort and RetentionPurgePort with F10 (N6), annotates every Offer field with its F10.S02.M02 class, and consumes privacy.deletion.completed to pseudonymize retained offers."
    data:
      - "Offer: P2 (buyer, seller), only in their two vaults; field classes annotated per F10.S02.M02."
      - "note: P2 free text; scanned locally by F12.S02.M02 spam heuristics; never federated."
    retention:
      - "Terminal offers: RET-EVIDENCE (2 years after last related activity), then purged."
      - "On principal deletion: buyerId/sellerId replaced with the per-deletion pseudonym in the deleting vault; amounts kept for the counterparty's records."
      - "Quarantined statements: RET-SHORT 30 days."
    threats:
      - "T01 | Lowball offer flooding to harass a seller | per-buyer rate limit 20 offers/hour, per-listing 50 open cap, at most 20 offers per listing per hour from unseen keys, private minimum below which offers are stored rejected and hidden with no buyer-visible difference"
      - "T02 | Offer note used for phishing links | link detection via F12.S02.M02; links rendered as plain text; report action on each offer"
      - "T03 | Relay learns offer contents or who offered | envelopes end-to-end encrypted to the seller's key; relay sees mailbox ID, size and time only (PRV-5)"
      - "T04 | Replay of an acceptance or decision onto another offer | the acceptance consent binds subjectRevisionHash = offerCid (ID-3 cid of ConsentSubjectPort.canonicalBytes) and decisions bind offerCid; cid dedup; idempotency key and expectedRevision for local commands"
      - "T05 | Forged acceptance or decision | signer must be the author of the verified listing projection (comms.consent.verify, V10); quarantine role_mismatch"
      - "T06 | Bisecting the seller's private minOffer with probe offers | below-minimum offers get the same acknowledgement, no statement and timeout expiry, and receive the same listing_unavailable and superseded decisions as open offers before expiresAt"
      - "T07 | Fresh did:keys to evade per-key limits | per-listing caps independent of keys, unseen-key cap per listing, and no information gained from probes"
      - "T08 | Double sale of the last unit from two seller devices | detected through conflicting reservations and frozen for the owner (ADR-0016 §5); the UI never claims the item is exclusively reserved across devices"
    abuse_controls:
      - "Signals bazaar.offer.made velocity and reject ratio to F12.S03.M02 fraud signals locally."
      - "Report offer action creates an F12.S01.M01 report on the relay the reporter chooses, attaching only the evidence the reporter selects."
  observability_performance:
    requirements:
      - "Vault command latency and outcomes are recorded as local diagnostics only (OBS-7); no telemetry leaves the device."
      - "Make, receive and accept meet local budgets on Moto G-class hardware, accept including hold, Deal and consent signature."
      - "Expiry sweep lag is visible in local diagnostics."
    metrics:
      - "classrup_bazaar_offers_total{outcome=made|accepted|rejected|withdrawn|expired|frozen} (local)"
      - "classrup_bazaar_offer_accept_conflicts_total (local)"
      - "classrup_bazaar_offer_quarantined_total{reason} (local)"
      - "classrup_bazaar_offer_expiry_lag_ms (local gauge: now - oldest overdue made offer)"
    logs:
      - "info offer.accepted {offerId, listingId, correlationId} in local diagnostics — no amounts or notes."
    budgets:
      - "make and receive p95 ≤ 100 ms including Ed25519 sign or verify; accept (hold + Deal + consent) p95 ≤ 200 ms; list queries p95 ≤ 100 ms for ≤ 50 items, on Moto G-class hardware."
      - "Expiry sweep processes 10 000 overdue offers in ≤ 5 s."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Contract tests check command input/output and event payloads against the schema registry.
      - The accept race within one vault and the two-device fork are covered by deterministic concurrency tests.
    fixtures: "Seller vault S (and its second device S2) with published sell listing L (EUR 50.00, qty 1, minOffer EUR 35.00), buyer vaults B1 and B2 holding the verified projection of L, a key K that is not the listing author, relay stub with a moderator, clocks 2026-11-04T10:00:00Z with injectable skew."
    tests:
      - "T01 | unit | 01.R01,01.R03,02.R01 | make offer with valid input | Offer stored with status made, revision 1, amount and quantity unchanged, offerCid set"
      - "T02 | unit | 02.R02,02.R03 | each rule V01–V17 violated in turn in the vault the rule names | the documented error code is returned or the statement is quarantined or dropped; nothing is stored"
      - "T03 | property | 03.R01 | random sequences of commands and inbound statements on one offer | only declared transitions succeed; others return CONFLICT_STATE"
      - "T04 | integration | 03.R02,06.R03 | Deal port or consent signing fails during accept | offer stays made, no hold, no Deal, no consent; DEPENDENCY_UNAVAILABLE returned"
      - "T05 | integration | 03.R03,06.R02,09.R03 | B1 and B2 offers accepted concurrently in two tabs of S's vault for qty 1 | within one vault one accepted, the other CONFLICT_STATE, then expired superseded with a signed decision to B2"
      - "T06 | contract | 04.R01,04.R02,09.R02 | each command executes | output and emitted event payloads validate against registry schemas"
      - "T07 | integration | 04.R03 | seller vault: listing unpublished and block added; buyer vault: newer verified projection and a tombstone | seller expires or rejects with documented reasons and signed decisions; buyer sets listingChangedSinceOffer and listingUnavailable from mirror events and consumes no bazaar.listing.* event"
      - "T08 | abuse | 05.R01,05.R02,07.R01 | non-owner accepts; third party queries offers; public listing view | FORBIDDEN or NOT_FOUND; no offer data in public payloads"
      - "T09 | abuse | 05.R03 | relay moderator of R inspects mailboxes and a report with and without voluntarily attached offer evidence | mailbox holds only ciphertext; the moderator sees only what the reporting party attached to the report on R"
      - "T10 | integration | 06.R01 | same Idempotency-Key replayed with same and different body; same statement cid delivered twice | original response replayed; IDEMPOTENCY_KEY_REUSED; duplicate statement ignored"
      - "T11 | integration | 07.R02 | buyer principal deleted (privacy.deletion.completed in B1) | B1's retained offers carry the pseudonym instead of buyerId; S's copy keeps the amount"
      - "T12 | abuse | 07.R03 | 21 offers in one hour by one buyer; 21 offers from fresh keys on L within an hour | 21st returns RATE_LIMITED; the 21st fresh-key statement is dropped without acknowledgement"
      - "T13 | load | 08.R01,08.R02 | 500 offers received and 50 accepts on Moto G profile | make and receive p95 ≤ 100 ms, accept p95 ≤ 200 ms, counters local only, no telemetry requests"
      - "T14 | integration | 08.R03 | 10 000 overdue offers | sweep completes ≤ 5 s and the local lag gauge returns to 0"
      - "T15 | unit | 09.R01 | traceability tool run | every PS-011 requirement maps to a passing test"
      - "T16 | integration | 10.R01,10.R02,10.R03 | export from S, import into a fresh vault of the same principal, import by a principal that is neither buyer nor seller, import with a bad signature | offers and statements round-trip identical with no relay lookup; open offers import as expired superseded; foreign principal rejected; bad signature quarantined"
      - "T17 | e2e | 04.R01 | mobile buyer makes an offer, seller accepts in its vault | both vaults show accepted with the same dealId; screen passes axe with zero serious issues"
      - "T18 | integration | 01.R02 | inspect field class annotations and run the retention purge before and after the evidence window | Offer classed P2 in two vaults only; terminal offers purged 2 years after last activity; non-terminal offers never purged"
      - "T19 | contract | 01.R04,04.R04 | make, decide and withdraw; inspect stored records and the F11.S01.M01 registry | statements validate as classrup.bazaar.offer/v1, offer_decision/v1 and offer_withdrawal/v1 with registered signer roles; records validate as classrup.bazaar.offer_record/v1 only"
      - "T20 | abuse | 02.R04 | two buyer keys bisect minOffer with amounts above and below EUR 35.00 | identical acknowledgement, no rejection statement and timeout expiry for every unanswered probe; below-minimum offers hidden from S's list; the probes learn nothing beyond not accepted"
      - "T21 | abuse | 02.R05 | decision signed by K; withdrawal signed by B2 for B1's offer; decision for offer A replayed onto offer B; acceptance consent for offer A replayed onto offer B | quarantined role_mismatch, role_mismatch, binding_mismatch; comms.consent.verify reports a subject mismatch; offer B stays made"
      - "T22 | integration | 03.R04 | S counters B1's offer through F01.S04.M02, then B1 tries to withdraw and S tries to accept the root offer | root offer rejected with reason countered in the counter transaction without a decision statement; B1's vault applies countered on the verified first round; withdraw and accept return CONFLICT_STATE"
      - "T23 | integration | 03.R05 | two vaults with clocks skewed +10 and -10 min; acceptance delivered 3 h after expiresAt, then another delivered 25 h after | first applied inside the grace and both vaults show accepted; second refused; B1 expires and sends a timeout close; S moves accepted to expired, cancels the Deal and the hold is released"
      - "T24 | integration | 03.R06,06.R02 | S and S2 accept B1's and B2's offers offline for the last unit, then sync | both acceptances kept; conflict_detected freezes both holds and both offers; neither Deal proceeds; S keeps B1 and B2 receives a signed decision rejected conflict_resolved with its Deal cancelled"
      - "T25 | integration | 03.R07 | seller-side reject, listing unpublished, superseded and block; then a seller-side timeout | a signed decision reaches the buyer for each close except the timeout; the block decision reads seller_rejected; both vaults converge on the same terminal status"
      - "T26 | integration | 04.R05 | accept, then a conflicted consent status in B1 | consent signed with subjectType bazaar_offer, statementKey consent.bazaar.offer.accept.v1, statementLocale and subjectRevisionHash equal to offerCid (ID-3 cid) through the registered ConsentSubjectPort, which passes the F08.S02.M02 conformance suite; B1 echoes the received consent to S before committing and verifies with comms.consent.verify; conflicted moves B1's offer to frozen"
      - "T27 | integration | 07.R04 | export section, deletion plan and retention purge through the F10 ports | section bazaar.offers present with field classes; deletion plan pseudonymizes retained offers and purges notes of non-evidence offers"
      - "T28 | integration | 03.R02,06.R03 | accept B1's offer, then deliver a crossing withdrawal from B1 | hold has holder {offer, offerId}, ttl 7 d, maxExpiresAt equal to the Deal expiry and linkedDealId; the withdrawal moves the offer to withdrawn and calls commerce.deal.cancel in the same transaction; the hold is released through commerce.deal.cancelled"
      - "T29 | contract | 04.R04,04.R06 | make, decide, withdraw and accept through the StatementPublisherPort test double; S's vault receives the offer | every statement is created by federation.record.publish with audience participants, recipients [{did, mailboxId}], ext.stream equal to streamId and a ciphertext of at most 12288 bytes; the module calls no signing primitive; S's F11.S01.M02 signs classrup.federation.ack/v1 and B1's entry reaches peer_accepted; the below-minimum probe receives the same ack"
      - "T30 | contract | 04.R06 | F09.S01.M01 conformance suite calls the offer ContextTermsPort with the Deal of an accepted offer, a Deal on an accepted negotiation round (through the NegotiationTermsPort stub of F01.S04.M02), and a Deal with a larger amount | first two confirmed with parties [buyer, seller] and the offer or round amount; the larger amount is rejected; openerRole and ownerRole return listing author"
      - "T31 | integration | 02.R06 | federation.conflict.detected freezes consent:bazaar_offer for B1's accepted offer, then accept, reject, withdraw and an inbound decision are attempted; then the conflict store fails; then federation.conflict.resolved drop_all | the offer is frozen and every action returns CONFLICT_STATE; with the failing store DEPENDENCY_UNAVAILABLE; drop_all moves the offer to rejected conflict_resolved and cancels the Deal"
    acceptance:
      - All tests T01–T31 pass in CI.
      - No offer data appears in public, search, relay index or federation payloads (privacy test suite).
      - Never two accepted offers for one unit within one vault; cross-device forks are detected and frozen, never resolved by timestamp; an offer below the private minimum is indistinguishable for the buyer from an unanswered one.
  import_export_backup_rollback:
    requirements:
      - A user's export contains offers they made and offers on their listings.
      - Import verifies statement signatures and that the importing principal is buyerId or sellerId, with no relay lookup; records that fail are quarantined and other principals' offers are never imported as editable.
      - Schema changes to Offer follow expand/contract and keep v1 readable for 180 days.
    export: "Section bazaar.offers in classrup-export/v1; one line per Offer (schema classrup.bazaar.offer_record/v1) followed by its signed statements (offer, decision, withdrawal and acceptance consent)."
    import: "Signatures are re-verified locally and the importing principal must be buyerId or sellerId; no relay is consulted. Terminal offers import as read-only history; open offers import as expired with reason superseded to avoid stale commitments; hidden below-minimum offers stay hidden."
    backup: "Vault export is the primary backup (IOX-6); relays hold only encrypted mailbox envelopes under their retention policy (IOX-7)."
    migration_rollback: "Additive fields only in v1; records written under the earlier record name classrup.bazaar.offer/v1 are read as classrup.bazaar.offer_record/v1 for 180 days; rollback to the previous release is safe because new optional fields are ignored by older readers."
