# F02.S01.M03 Barter offer items: trade legs (ADR-0016 local-first).
id: F02.S01.M03
scope: MVP
summary: >-
  A TradeLeg says that one giver hands a defined set of items to one receiver as part of a proposal or cycle. A direct two-party proposal has two legs
  of 1..5 items each; a cycle of N participants has N legs of exactly one item with quantity 1 in the MVP. A leg records item references, quantities,
  the listing revision the parties looked at and the declared value. Own items are verified against the local inventory; other parties' items are
  verified only against their signed listing projections and their signed reservation statements, and are labelled accordingly.
responsibilities:
  - Define legs from item references with ownership and availability verification through the InventoryPort for the principal's own items and through signed listing projections for others' items.
  - Keep each leg immutable once defined; replace it by defining a new leg, and mark legs referenced by a sealed revision so they cannot be voided.
  - Void unreferenced legs after 24 hours and enforce the limits of 8 legs per subject, 5 items per direct leg and quantity 1..99 per item.
non_responsibilities:
  - Reserving items (F02.S03.M02) and holding inventory (F01.S03.M01); a leg is a description, not a reservation.
  - Declared values and plausibility (F02.S04.M03) and normalization (F02.S04.M02).
  - Sealing legs into a revision and signing (F02.S01.M04).
  - "Future: legs with service or rental components, bundles in cycles, and items with serial numbers."
depends_on: [F01.S03.M01, F01.S01.M01, F02.S04.M03, F16.S02.M03, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-FED-001, CTR-IDM-001, CTR-MNY-001, CTR-PRV-001, CTR-SCH-001]
user_stories:
  - As a proposer, I choose which of my items go to the other person and which of theirs I ask for, and I see immediately which of my own items are available.
  - As a recipient, I see that the other person's items are listed by them and signed, and that availability is their claim until they sign a reservation.
  - As a proposer, I can swap an item in a draft leg without affecting other legs.
edge_cases:
  - The same inventory item is put into two legs of one subject; the second define is refused as a duplicate item.
  - The principal's own item has quantity 1 and is reserved for another cycle; define is refused as unavailable without naming the other cycle.
  - The other party's listing projection was tombstoned; define is refused because the item no longer exists as a signed public fact.
  - The listing was edited after the leg was drafted; the leg keeps the listing revision hash it was defined against and shows a notice that the listing changed.
  - A leg is defined with giver equal to receiver; refused.
  - A cycle leg tries to carry two items; refused in the MVP because cycle legs are single-item.
  - Item quantity requested exceeds the listing quantity; refused with the available quantity in the message.
ux:
  screens:
    - "Leg editor: two columns (I give, I receive) listing selectable items from my inventory and the other party's published items, with quantity steppers and declared value fields."
    - "Leg summary card per hand-over with item thumbnails, quantity, declared value, listing revision notice and a basis chip (verified here, signed listing, claimed)."
  states: [loading, empty, draft, defined, referenced, voided, listing-changed, error]
  a11y:
    - Quantity steppers have labels including the item name and are operable by keyboard.
    - Each leg card reads as a sentence, such as 'You give Lamp, quantity 1, declared 40.00 EUR, to Bob'.
    - Status and basis are text chips, not color alone.
processes:
  domain_schema:
    requirements:
      - A TradeLeg stores giver, receiver, 1..5 item lines (1 line in cycles), the listing cid and listing revision hash seen when defined, declared value from the owner's ItemValuation and the subject reference.
      - Legs are immutable after definition; their only mutable fields are status and the referenced marker.
      - Legs are P2 and are exchanged only inside signed ProposalRevision snapshots, where receivers materialize their own read-only copies with provenance.
    entities:
      - name: TradeLeg
        schema: classrup.mutiny.trade_leg/v1
        storage: device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key; generated by the defining author"
          - "tenantId: uuidv7 — vault tenant scope"
          - "subjectType: enum — trade_proposal | cycle"
          - "subjectId: uuidv7 — subject this leg belongs to"
          - "position: int — 0..7; order in the cycle ring, 0 or 1 for direct proposals"
          - "giverId: did — item owner"
          - "receiverId: did — receiving party; differs from giverId"
          - "items: array — 1..5 lines (1 in cycles) {inventoryItemId uuidv7, listingCid cid, listingRevisionHash cid, variantId? uuidv7, quantity int 1..99, declaredValue Money, valuationId? uuidv7}"
          - "legValue: Money — sum of declared values in the leg currency; single currency per leg"
          - "basis: enum — local_inventory | signed_listing — how availability was verified when defined"
          - "status: enum — defined | referenced | voided"
          - "origin: enum — local | peer"
          - "provenance?: object — {revisionId, receivedAt} for peer-materialized legs"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - giverId differs from receiverId and all inventoryItemIds within a subject are distinct across legs.
          - A leg in a cycle has exactly one item line with quantity 1; a leg in a direct proposal has at most 5 lines.
          - items, giverId, receiverId and declaredValue never change after definition; status moves only forward.
          - A leg referenced by a sealed revision cannot be voided.
    sql: |
      CREATE TABLE mutiny_trade_leg (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, subject_id TEXT NOT NULL, position INTEGER NOT NULL,
        giver_id TEXT NOT NULL, receiver_id TEXT NOT NULL, status TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE INDEX mutiny_leg_subject ON mutiny_trade_leg(tenant_id, subject_id, status);
  validation_rules:
    requirements:
      - Legs are validated against the schema strictly, with business rules for ownership, availability, duplicates and limits evaluated before persistence.
      - The basis of every availability fact is recorded so the UI never presents a signed claim as local verification.
      - Every violation maps to one stable error code.
    rules:
      - "V01 | items has 1..5 lines (exactly 1 with quantity 1 when subjectType is cycle) and each quantity is 1..99 | MUTINY_LEG_ITEMS_INVALID"
      - "V02 | giverId differs from receiverId and both are parties of the subject | MUTINY_LEG_PARTY_INVALID"
      - "V03 | own items exist in the local inventory, owned by the principal and quantity available ≥ requested | MUTINY_ITEM_UNAVAILABLE"
      - "V04 | other party's items have a verified, non-tombstoned listing projection authored by the giver and flagged barterAcceptable | MUTINY_ITEM_NOT_OWNED"
      - "V05 | no inventoryItemId occurs twice within the subject's legs | MUTINY_ITEM_DUPLICATE"
      - "V06 | subject has at most 8 legs | MUTINY_LEG_LIMIT"
      - "V07 | declaredValue is a positive Money of a registered currency, ≤ 1 000 000 000 000 minor units, and all lines of a leg share one currency | VALIDATION_FAILED"
      - "V08 | a leg can be voided only while status is defined | CONFLICT_STATE"
  workflow_state_machine:
    requirements:
      - A leg is defined, then referenced when a sealed revision includes it, and voided only if never referenced.
      - Defined legs that no revision references within 24 hours are voided automatically so abandoned drafts do not accumulate.
      - Legs materialized from a peer revision start as referenced because the revision that carries them is already sealed.
    machines:
      - entity: TradeLeg
        initial: defined
        terminal: [referenced, voided]
        transitions:
          - "defined -> referenced | mutiny.proposal.revised consumed with this legId | sealed by a ProposalRevision; leg becomes permanent evidence"
          - "defined -> voided | mutiny.leg.void by the author, or 24 h garbage collection | no revision references it; emits nothing further"
    timeouts:
      - "Garbage collection of unreferenced defined legs after 24 h, evaluated on vault open and every 60 s while open."
  commands_queries_events:
    requirements:
      - define and void are vault commands that produce no statement, because legs reach other parties only inside a signed revision.
      - materialize from a peer revision is performed by the intake of F02.S01.M04 through the same module port and emits leg.defined with actor.kind federated.
      - Queries are local and return only legs of subjects stored in the vault.
    commands:
      - name: mutiny.leg.define
        capability: mutiny.leg.define
        input: "{ subjectType, subjectId, position, giverId, receiverId, items: { inventoryItemId, listingCid, variantId?, quantity, valuationId? }[] } — vault command; no statement"
        output: "{ legId, legValue, basis, listingChanged: boolean }"
        errors: [VALIDATION_FAILED, MUTINY_LEG_ITEMS_INVALID, MUTINY_LEG_PARTY_INVALID, MUTINY_ITEM_UNAVAILABLE, MUTINY_ITEM_NOT_OWNED, MUTINY_ITEM_DUPLICATE, MUTINY_LEG_LIMIT, CONFLICT_STATE]
        emits: [mutiny.leg.defined]
        idempotent: true
      - name: mutiny.leg.void
        capability: mutiny.leg.void
        input: "{ legId, expectedRevision }"
        output: "{ legId, revision, status: voided }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: []
        idempotent: true
    queries:
      - name: mutiny.leg.get
        capability: mutiny.leg.read
        input: "{ legId }"
        output: "{ leg: TradeLeg, listingChanged: boolean }"
        errors: [NOT_FOUND]
      - name: mutiny.leg.list_for_subject
        capability: mutiny.leg.read
        input: "{ subjectType, subjectId, status? }"
        output: "{ items: TradeLeg[] }"
        errors: [NOT_FOUND]
    events_produced:
      - {type: mutiny.leg.defined, privacy: P2, payload: "{ legId, subjectType, subjectId, position, giverId, receiverId, itemCount, legValue, origin }"}
    events_consumed:
      - {type: mutiny.proposal.revised, effect: "mark legs listed in legIds as referenced and materialize peer legs from the revision snapshot when origin is peer"}
      - {type: bazaar.listing.edited, effect: "flag defined legs that reference the listing with listingChanged so the author must re-confirm before sealing"}
      - {type: bazaar.listing.unpublished, effect: "void defined (unreferenced) legs referencing the listing; referenced legs stay and are handled by feasibility"}
    errors:
      - "MUTINY_LEG_ITEMS_INVALID | 422 | no | item lines or quantities violate the leg limits"
      - "MUTINY_LEG_PARTY_INVALID | 422 | no | giver equals receiver or a party is not in the subject roster"
      - "MUTINY_LEG_LIMIT | 409 | no | a subject allows at most 8 legs"
      - "MUTINY_ITEM_UNAVAILABLE | 409 | no | own item quantity is not available"
      - "MUTINY_ITEM_NOT_OWNED | 422 | no | the other party's item is not backed by a verified listing projection authored by them"
      - "MUTINY_ITEM_DUPLICATE | 422 | no | the item already occurs in another leg of this subject"
    example: |
      # direct 2-party proposal: Alice gives lamp + shade (2 lines) to Bob, Bob gives bicycle bell (1 line) to Alice
      mutiny.leg.define { "subjectType":"trade_proposal", "subjectId":"0192f3f0-…", "position":0, "giverId":"did:key:z6MkAlice", "receiverId":"did:key:z6MkBob",
        "items":[ {"inventoryItemId":"0192f3f1-…","listingCid":"sha256-Ab1…","quantity":1}, {"inventoryItemId":"0192f3f2-…","listingCid":"sha256-Ab2…","quantity":1} ] }
      -> { "legId":"0192f3f3-…", "legValue": {"amount":"7500","currency":"EUR"}, "basis":"local_inventory", "listingChanged": false }
      # cycles: 3-party ring has 3 legs (position 0,1,2), 4-party 4 legs, N-party N legs (N ≤ 8); each leg exactly one item, quantity 1.
  authorization_capabilities:
    requirements:
      - Only the unlocked local principal defines or voids legs, and only for subjects stored in its vault.
      - The principal may define a leg whose giver is another party only to describe a request, never as a reservation or commitment of that party.
      - Legs of other parties are readable only as part of subjects the principal is a party of.
    capabilities:
      - "mutiny.leg.define | principal | vault unlocked; principal is a party of the subject and subject is draft or open"
      - "mutiny.leg.void | principal | leg defined by this vault and status defined"
      - "mutiny.leg.read | principal | leg belongs to a subject in this vault"
  failure_recovery_idempotency:
    requirements:
      - define is idempotent per Idempotency-Key and by (subjectId, position, items) so a retry cannot create a second leg.
      - Definition and the optional inventory read happen in one IndexedDB transaction.
      - A leg defined against a listing that later changes keeps its recorded listing revision hash and is flagged, never rewritten.
    idempotency: "Idempotency-Key replay 24 h; additionally an identical (subjectId, position, items) within 24 h returns the existing defined leg."
    concurrency: "IndexedDB transaction per define; duplicate-item and limit checks run inside the transaction; expectedRevision on void."
    retries: "No network; the sync outbox is not used because no statement is produced here."
    offline: "Fully available offline; peer item verification uses retained listing projections and shows their age."
    partial_failure: "If the listing projection of a peer item is missing, define fails with MUTINY_ITEM_NOT_OWNED rather than creating a leg that looks verified."
  privacy_retention_abuse:
    requirements:
      - Legs expose only what is already in public listings plus the declared values the owners chose to publish; nothing about addresses or exact location.
      - Legs of closed subjects are retained as evidence for 2 years and pseudonymized if a party erases their identity locally.
      - Abuse such as listing other people's items is limited because peer items require a signed listing authored by the giver.
    data:
      - "TradeLeg: P2; item references are public listing cids, declared values are owner-published."
    retention:
      - "RET-EVIDENCE 2 years after last related activity; voided unreferenced legs are purged after 7 days."
    threats:
      - "T01 | A proposer lists someone else's item to bait them | peer items need a listing projection signed by the giver, and the giver's own signed reservation is required before commit"
      - "T02 | Availability claim shown as fact | basis chip distinguishes local verification from signed listing claims"
      - "T03 | Draft legs leak intent | legs are not sent until sealed in a revision to the subject's parties only"
      - "T04 | Resource exhaustion by creating many legs | 8 legs per subject, 24 h garbage collection, 200 defined legs per vault"
    abuse_controls:
      - "At most 200 defined unreferenced legs per vault; define rate limit 60 per hour."
  observability_performance:
    requirements:
      - Define and void outcomes are counted in local diagnostics without identifiers (OBS-7).
      - define completes within 40 ms p95 including IndexedDB reads for 5 items.
      - Garbage collection of 200 legs completes within 100 ms.
    metrics:
      - "classrup_mutiny_legs_total{outcome=defined|referenced|voided|rejected} (local diagnostics)"
    logs:
      - "debug leg.defined {legId, itemCount, basis, correlationId} — no DIDs or values."
    budgets:
      - "define p95 ≤ 40 ms; list_for_subject p95 ≤ 20 ms; garbage collection ≤ 100 ms for 200 legs."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Contract tests verify leg shape inside revision snapshots and event payloads against the registry.
      - Fixtures include 2-, 3-, 4- and 6-party leg sets.
    fixtures: "Alice inventory items I1 (qty 1), I2 (qty 3), I3 reserved; Bob listing projection P1 signed; 3-party ring legs L0..L2; 6-party ring; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,02.R01 | define 2-party legs with 2 and 1 lines | legs stored with listing revision hash, legValue computed, immutable fields unchanged afterwards"
      - "T02 | unit | 02.R01,02.R02,02.R03 | each rule V01..V08 violated in turn | documented error code returned and nothing stored"
      - "T03 | property | 01.R02,03.R01 | random define and void sequences | status only moves defined to referenced or voided, never back; referenced never voided"
      - "T04 | unit | 02.R02 | peer item without projection, with tombstoned projection, with valid projection | MUTINY_ITEM_NOT_OWNED, MUTINY_ITEM_NOT_OWNED, accepted with basis signed_listing"
      - "T05 | integration | 03.R01,03.R02 | unreferenced leg after 24 h with injected clock | voided by garbage collection"
      - "T06 | integration | 03.R03,04.R02 | peer revision ingested | peer legs materialized as referenced with provenance and leg.defined emitted with actor.kind federated"
      - "T07 | contract | 04.R01,04.R03,09.R02 | define and queries | outputs and event payload validate against registry; no statement produced"
      - "T08 | integration | 04.R03,06.R03 | listing edited after drafting | leg flagged listingChanged, recorded listing revision hash unchanged"
      - "T09 | abuse | 05.R01,05.R02,05.R03,07.R01 | other principal defines or reads; leg for someone else's unlisted item | FORBIDDEN or NOT_FOUND; MUTINY_ITEM_NOT_OWNED"
      - "T10 | integration | 06.R01,06.R02 | replay define with same key and with identical body new key | single leg"
      - "T11 | abuse | 07.R03,07.R04 | 201st defined leg; 61st define in an hour | limit error and RATE_LIMITED"
      - "T12 | unit | 07.R02,07.R01 | account erased locally with closed subject | leg pseudonymized and retained, no address fields ever present"
      - "T13 | load | 08.R02,08.R03 | define 5-item legs and GC of 200 legs | within budgets on emulated Moto G"
      - "T14 | unit | 08.R01,09.R01 | traceability tool run and diagnostics | every PS-013 requirement maps to a passing test; no identifiers in diagnostics"
      - "T15 | integration | 10.R01,10.R02,10.R03 | export, import, rollback | referenced legs round-trip; voided legs not exported; conflicting IDs rejected"
      - "T16 | e2e | 01.R03,02.R03 | mobile user builds a 3-party ring leg set | each leg card readable, axe zero serious issues"
    acceptance:
      - All tests T01–T16 pass in CI.
      - A leg never presents a peer's availability claim as locally verified.
      - Items occur at most once per subject and cycle legs carry exactly one item with quantity 1.
  import_export_backup_rollback:
    requirements:
      - Export contains referenced legs of the user's subjects with provenance, since they are part of signed evidence.
      - Import verifies each leg against the revision that references it and rejects legs not referenced by any imported revision.
      - Schema changes follow expand and contract and keep v1 readable for 180 days.
    export: "Section mutiny.legs in classrup-export/v1; one line per referenced TradeLeg (schema classrup.mutiny.trade_leg/v1)."
    import: "Each leg is matched to its sealed revision; orphan legs are dropped with a report; identical IDs are skipped and conflicting IDs rejected."
    backup: "The vault export is the primary backup (IOX-6); relays never hold plaintext legs (IOX-7)."
    migration_rollback: "Additive fields only in v1; rollback ignores unknown fields; multi-item cycle legs are a future major and are not produced by v1."
