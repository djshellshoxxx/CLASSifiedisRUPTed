# F02.S02.M05 Cycle feasibility checks (ADR-0016 local-first). Pure checks, each vault runs them itself.
id: F02.S02.M05
scope: MVP
summary: >-
  A pure, deterministic set of checks that tells a vault whether a suggestion, a direct proposal or a cycle revision can be proposed or consented to
  right now, and explains every failure with a stable check code. Checks cover participant uniqueness, item uniqueness, ownership and availability,
  value tolerance (MNY-5), quote freshness, distance, blocks, eligibility and deadlines. Each check states its basis, either verified locally,
  derived from a signed projection or only claimed by a peer, so the UI never presents a peer's claim as verified fact.
responsibilities:
  - Provide checkFeasibility(input, ports) as a pure function and the command that stores a FeasibilityReport for a subject.
  - Return overall feasible, feasible_with_conditions or infeasible with ordered check results and machine-readable reason codes.
  - Re-run before proposing, before signing consent, and before the local commit verdict, and mark reports older than 10 minutes stale.
non_responsibilities:
  - Reserving items or signing anything (F02.S03.M02, F02.S03.M01).
  - Computing normalized values and pinning quotes (F02.S04.M02) and declared values (F02.S04.M03); this module only consumes them.
  - Guaranteeing that a peer's item exists; only the peer's signed reservation statement and the physical exchange evidence speak to that.
  - "Future: probabilistic dropout risk estimates per participant and travel-time based distance checks."
depends_on: [F02.S02.M04, F01.S03.M01, F01.S01.M01, F06.S02.M01, F07.S02.M02, F09.S03.M02, F09.S03.M03, F16.S02.M03, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-FED-001, CTR-IDM-001, CTR-MNY-001, CTR-PRV-001, CTR-SCH-001]
user_stories:
  - As a member about to consent, I see a checklist that says which facts my vault verified itself and which are only claimed by the other parties.
  - As a proposer, I am told exactly why a cycle cannot be proposed, for example that one item is no longer available or the value gap of one participant exceeds the tolerance.
  - As a member, I see the cheapest fix offered by the system, such as adding a compensation leg of a stated amount.
edge_cases:
  - Two legs name the same inventory item; the report fails check C02 and names both legs.
  - A pinned FX quote expires 20 minutes from now; the check warns because it has less than 30 minutes left, and fails when expired.
  - A participant's projection says they accept cycles of at most 3 but the subject has 4 participants; check C10 fails for that participant only.
  - Item quantity is 1 and a local reservation for another cycle holds it; the check fails with item_reserved_elsewhere without revealing the other cycle.
  - A peer's item cannot be verified because the listing projection is missing locally; basis is unverifiable and the overall result is feasible_with_conditions, never feasible.
  - The report was computed 11 minutes ago; consent is refused until a fresh report is stored.
ux:
  screens:
    - "Feasibility checklist inside the proposal and consent screens: one row per check with pass, warn or fail, a basis chip (verified here, from signed projection, claimed by peer) and a fix suggestion."
    - "Value gap table: for each participant, gives X, receives Y, gap, tolerance, and result."
  states: [loading, feasible, feasible-with-conditions, infeasible, stale, offline, error]
  a11y:
    - Check results use text labels and icons together, never color alone.
    - The checklist is a list with each row reachable by keyboard and described by its basis chip.
    - Result changes after refresh are announced through an aria-live polite region.
processes:
  domain_schema:
    requirements:
      - A FeasibilityReport stores the subject reference with its revision hash, evaluation time on the local clock, overall result, and one entry per executed check with status, basis, affected participant or leg and parameters.
      - Reports are deterministic functions of their input hash and the local clock, are local derived data, and become stale after 10 minutes.
      - The check set is fixed at C01..C13 and every code is stable; adding a check is additive and follows the schema compatibility rules.
    entities:
      - name: FeasibilityReport
        schema: classrup.mutiny.feasibility_report/v1
        storage: derived
        privacy: P2
        retention: RET-SHORT
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — vault tenant scope"
          - "subjectType: enum — suggestion | trade_proposal | cycle"
          - "subjectId: uuidv7 — id of the subject in this vault"
          - "subjectRevisionHash?: cid — digest of the proposal revision checked, required for trade_proposal and cycle"
          - "evaluatedAt: timestamp — local clock, RFC 3339 UTC"
          - "staleAt: timestamp — evaluatedAt + 10 min"
          - "overall: enum — feasible | feasible_with_conditions | infeasible"
          - "checks: array — 13 items {code C01..C13, status pass|warn|fail, basis local|signed_projection|peer_claim|unverifiable, participantId? did, legId?, params object ≤ 1 KiB}"
          - "valueGaps: array — items {participantId, givesMinor string, receivesMinor string, gapMinor string, toleranceMinor string, withinTolerance boolean}"
          - "suggestedFix?: object — {kind add_compensation | refresh_quote | remove_item, params}"
          - "inputHash: cid — sha256 of JCS(canonical inputs); equal inputHash and equal evaluatedAt bucket give equal checks"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - overall is infeasible iff at least one check has status fail, and feasible only if no check has status warn or basis unverifiable.
          - checks contains each of C01..C13 exactly once per participant or leg scope it applies to, in ascending code order.
          - staleAt equals evaluatedAt plus 10 minutes.
  validation_rules:
    requirements:
      - Each feasibility check is a rule with a stable code and maps to one module error code returned to callers.
      - The tolerance rule implements MNY-5 exactly, 5 percent of the larger side or the configured absolute minimum, whichever is greater, with the stricter length-profile values from F02.S02.M01 and F02.S02.M02.
      - Checks never read another party's private records; they use own vault data, signed projections and statement contents only.
    rules:
      - "V01 | C01 all participant DIDs distinct (participant uniqueness) | MUTINY_PARTICIPANT_DUPLICATE"
      - "V02 | C02 all inventory items distinct across legs | MUTINY_ITEM_DUPLICATE"
      - "V03 | C03 each own item is owned by the principal in the local inventory and each peer item's listing projection is authored by the giver DID | MUTINY_ITEM_NOT_OWNED"
      - "V04 | C04 each own item has available quantity ≥ leg quantity, not reserved elsewhere; each peer item is listed as published and unexpired | MUTINY_ITEM_UNAVAILABLE"
      - "V05 | C05 for each participant gap = absolute difference of given and received ≤ max(toleranceBps × larger side, absoluteMin) in settlement currency (MNY-5) unless compensation or a signed acceptedImbalance covers the excess | MUTINY_VALUE_OUT_OF_TOLERANCE"
      - "V06 | C06 every pinned FX quote is unexpired with ≥ 30 minutes left | MUTINY_QUOTE_STALE"
      - "V07 | C07 every adjacent pair distance bucket ≤ length-profile maximum and both participants' maxDistanceBucket | MUTINY_DISTANCE_EXCEEDED"
      - "V08 | C08 no participant is in another participant's local block list known to this vault | BLOCKED_PARTY"
      - "V09 | C09 each participant is opted in and not paused per projection | MUTINY_PARTICIPANT_INELIGIBLE"
      - "V10 | C10 cycle length ≤ every participant's maxCycleLength and ≤ tenant Lmax | MUTINY_CYCLE_TOO_LONG"
      - "V11 | C11 consentDeadline is between now + 1 h and now + 7 d and executionWindow between 1 d and 30 d | MUTINY_DEADLINE_INVALID"
      - "V12 | C12 no item has an open flag in a valuation dispute that the owner has not acknowledged | MUTINY_VALUATION_DISPUTED"
      - "V13 | C13 the report used for a commit decision has evaluatedAt within the last 10 minutes | MUTINY_FEASIBILITY_STALE"
  workflow_state_machine:
    machines: []
    note: "FeasibilityReport is immutable derived output with no lifecycle; staleness is computed from staleAt at read time. Subject state machines live in F02.S01.M01 and F02.S03.M01."
    requirements:
      - Reports have no state transitions; a new evaluation creates a new report and the previous report for the same subject revision remains for audit until retention.
      - Staleness is computed from the local clock at read time and a stale report is never accepted for consent or commit decisions.
      - The pure function has no side effects other than the optional storage of its report.
    timeouts:
      - "Reports expire for decisions after 10 minutes and are purged after 30 days."
  commands_queries_events:
    requirements:
      - check is a vault-local command that stores a report and emits one event; no statement is produced and nothing is sent to any peer.
      - The same pure function is exported as a library so F02.S01.M01, F02.S02.M03 and F02.S03.M01 can run it inside their own transactions.
      - get and list queries return only reports stored in this vault.
    commands:
      - name: mutiny.feasibility.check
        capability: mutiny.feasibility.check
        input: "{ subjectType: suggestion|trade_proposal|cycle, subjectId, revisionHash? } — vault command; no statement"
        output: "{ reportId, overall, checks, valueGaps, suggestedFix?, staleAt }"
        errors: [NOT_FOUND, VALIDATION_FAILED, MUTINY_FEASIBILITY_STALE]
        emits: [mutiny.cycle.feasibility_checked]
        idempotent: true
    queries:
      - name: mutiny.feasibility.get
        capability: mutiny.feasibility.read
        input: "{ reportId }"
        output: "{ report: FeasibilityReport, stale: boolean }"
        errors: [NOT_FOUND]
      - name: mutiny.feasibility.latest_for_subject
        capability: mutiny.feasibility.read
        input: "{ subjectType, subjectId, revisionHash? }"
        output: "{ report?: FeasibilityReport, stale: boolean }"
        errors: []
    events_produced:
      - {type: mutiny.cycle.feasibility_checked, privacy: P2, payload: "{ reportId, subjectType, subjectId, subjectRevisionHash?, overall, failedCodes[], warnedCodes[] }"}
    events_consumed:
      - {type: mutiny.proposal.revised, effect: "mark earlier reports of the subject as superseded for decisions; a new check is required for the new revision hash"}
      - {type: mutiny.values.normalized, effect: "invalidate reports of the same subject so quote and tolerance checks re-run"}
    errors:
      - "MUTINY_PARTICIPANT_DUPLICATE | 422 | no | the same participant appears twice"
      - "MUTINY_ITEM_DUPLICATE | 422 | no | the same inventory item appears in more than one leg"
      - "MUTINY_ITEM_NOT_OWNED | 422 | no | the giver is not the owner of the item according to the available evidence"
      - "MUTINY_ITEM_UNAVAILABLE | 409 | no | item quantity is reserved, sold, expired or unpublished"
      - "MUTINY_VALUE_OUT_OF_TOLERANCE | 422 | no | value gap exceeds MNY-5 tolerance without compensation or acceptance"
      - "MUTINY_QUOTE_STALE | 410 | no | a pinned FX quote is expired or about to expire"
      - "MUTINY_DISTANCE_EXCEEDED | 422 | no | a participant pair is farther apart than allowed"
      - "MUTINY_PARTICIPANT_INELIGIBLE | 422 | no | a participant is not opted in, is paused, or lacks a verified projection"
      - "MUTINY_CYCLE_TOO_LONG | 422 | no | cycle length exceeds a participant preference or tenant maximum"
      - "MUTINY_DEADLINE_INVALID | 422 | no | consent deadline or execution window out of range"
      - "MUTINY_VALUATION_DISPUTED | 409 | no | a valuation is disputed and not acknowledged by its owner"
      - "MUTINY_FEASIBILITY_STALE | 409 | yes | the report is older than 10 minutes"
    example: |
      mutiny.feasibility.check  { "subjectType": "cycle", "subjectId": "0192f3b0-…", "revisionHash": "sha256-Qm3…" }
      -> 200 { "reportId": "0192f3b1-…", "overall": "feasible_with_conditions",
               "checks": [ { "code": "C03", "status": "pass", "basis": "local", "participantId": "did:key:z6MkAlice" },
                           { "code": "C03", "status": "warn", "basis": "unverifiable", "participantId": "did:key:z6MkCarol" },
                           { "code": "C05", "status": "pass", "basis": "signed_projection" } ],
               "valueGaps": [ { "participantId": "did:key:z6MkAlice", "givesMinor": "12000", "receivesMinor": "11500", "gapMinor": "500", "toleranceMinor": "600", "withinTolerance": true } ],
               "staleAt": "2026-11-04T10:10:00.000Z" }
      # 2-party, 3-party, 4-party and N-party subjects use the same call; the value table has one row per participant (2, 3, 4 or N rows).
  authorization_capabilities:
    requirements:
      - Only the local principal can run and read feasibility checks in its vault.
      - Checks use only data the principal is already allowed to see, so a report never discloses a peer's private data.
      - Relays never run this module for private subjects; relay matching uses only the public edge admission rules of F02.S02.M03.
    capabilities:
      - "mutiny.feasibility.check | principal | vault unlocked; subject exists in this vault"
      - "mutiny.feasibility.read | principal | own vault"
  failure_recovery_idempotency:
    requirements:
      - Check is idempotent for the same subject, revision hash and inputHash within the same 10 minute window and returns the stored report.
      - A failing port, such as an unavailable quote service, yields a warn with basis unverifiable rather than a pass.
      - Checks never block the UI thread; evaluation of 8 participants completes in one pass.
    idempotency: "Idempotency-Key replay 24 h; additionally the same inputHash within the same minute returns the existing report."
    concurrency: "Pure function; concurrent evaluations are independent and the later report supersedes the earlier for decisions; no locks."
    retries: "No automatic retries; the user can re-run. Port timeouts of 2 s degrade the affected check to unverifiable."
    offline: "Runs fully offline; quote freshness and projection age are judged by the local clock and retained data and flagged with their age."
    partial_failure: "If a port fails the report is still stored with the affected checks marked warn and basis unverifiable, and overall can never be feasible."
  privacy_retention_abuse:
    requirements:
      - Reports contain pseudonym DIDs, item references and values already visible to the principal, and are never sent to relays or peers.
      - Failure explanations never reveal block lists, exclusion lists or other cycles that reserve an item.
      - Reports are purged after 30 days, except that the report hash cited in a signed proposal revision remains part of that revision's evidence.
    data:
      - "FeasibilityReport: P2, derived, device only."
      - "valueGaps: derived from public declared values and signed acceptedImbalance values."
    retention:
      - "RET-SHORT 30 days after createdAt."
    threats:
      - "T01 | Error messages leak that someone blocked or excluded a participant | block and exclusion failures return the generic BLOCKED_PARTY without naming the pair, and the UI says 'a participant is unavailable'"
      - "T02 | Item reservation elsewhere reveals the user's other trades | message says item_reserved_elsewhere without cycle identifiers"
      - "T03 | Peer claims accepted as verified | every check carries a basis, and feasible requires no peer_claim or unverifiable bases"
      - "T04 | Manipulated declared values to pass tolerance | implausible valuations are flagged by F02.S04.M03 and check C12 blocks consent until acknowledged"
    abuse_controls:
      - "Local rate limit of 60 checks per hour per subject to prevent loops from buggy clients."
      - "Check parameters are bounded to 1 KiB to prevent oversized reports."
  observability_performance:
    requirements:
      - Check duration and outcome counts are recorded in local diagnostics without participant identifiers and not sent anywhere (OBS-7).
      - A full 8-participant evaluation completes within 20 ms at p95 on a mid-range phone with warm caches.
      - Failure codes are countable locally so the UI can show the most common reasons to the user.
    metrics:
      - "classrup_mutiny_feasibility_checks_total{outcome=feasible|conditions|infeasible} (local diagnostics; relay exports only if it runs relay-side checks)"
    logs:
      - "debug feasibility.completed {reportId, overall, failedCodes, correlationId} — no DIDs."
    budgets:
      - "evaluation p95 ≤ 20 ms for ≤ 8 participants; stored report ≤ 16 KiB."
      - "Port reads for inventory and projections ≤ 50 ms total from IndexedDB."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Each check C01..C13 has a positive and a negative unit test with fixed clock and fixtures for 2-, 3-, 4- and 6-party subjects.
      - The MNY-5 tolerance arithmetic is tested at the exact boundary with bigint values.
    fixtures: "Cycle values EUR minor 12000, 11800, 11500 (3-party within tolerance); 2-party 5000 vs 5600 (outside); 4-party with one expired quote; 6-party ring; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R03,02.R01,09.R03 | each check C01..C13 failed in turn | corresponding error code returned and check marked fail"
      - "T02 | unit | 02.R02 | gap exactly at tolerance, one minor unit above, and absolute minimum case | pass at boundary, fail one unit above, absolute minimum 500 applies when 5 percent is smaller"
      - "T03 | property | 01.R02,06.R01 | random subjects, same inputs twice | identical checks and inputHash"
      - "T04 | unit | 01.R01,09.R02 | 3-party fixture 12000, 11800, 11500 | all three participants within tolerance, overall feasible only when all bases are local or signed_projection"
      - "T05 | unit | 02.R03,07.R03 | peer item without local projection | check warn basis unverifiable, overall feasible_with_conditions"
      - "T06 | unit | 03.R01,03.R02 | report older than 10 minutes used for consent | MUTINY_FEASIBILITY_STALE"
      - "T07 | contract | 04.R01,04.R02,09.R02 | check command and event | output and event validate against registry"
      - "T08 | integration | 04.R03,06.R01 | replay check with same key, then new key within same minute | stored report replayed, then same report returned by inputHash"
      - "T09 | abuse | 05.R01,05.R02,05.R03,07.R02 | other principal reads report; blocked pair and elsewhere-reserved item | NOT_FOUND; generic messages with no names or cycle ids"
      - "T10 | unit | 06.R02,06.R03 | quote service port times out | affected check warn unverifiable, overall not feasible"
      - "T11 | unit | 07.R01 | participant list with excluded and blocked DIDs | no DID of the blocker in report; C12 blocks on disputed valuation"
      - "T12 | integration | 03.R03,07.R03 | report cited by a signed revision, 30 days later | standalone report purged, cited hash retained in revision evidence"
      - "T13 | load | 08.R02,08.R03 | 8-participant evaluation on emulated Moto G | p95 ≤ 20 ms"
      - "T14 | unit | 08.R01,08.R02 | metric counters after runs | counters present locally, nothing transmitted"
      - "T15 | unit | 09.R01 | traceability tool run | every PS-016 requirement maps to a passing test"
      - "T16 | integration | 10.R01,10.R02,10.R03 | export and import | reports are not exported; imported subjects re-run checks on first open"
      - "T17 | a11y | 01.R01 | checklist screen | axe zero serious issues, basis chips announced"
    acceptance:
      - All tests T01–T17 pass in CI.
      - No peer claim is ever presented as verified and overall feasible is impossible with any unverifiable or peer_claim basis.
      - MNY-5 tolerance is exact at the boundary for bigint amounts.
  import_export_backup_rollback:
    requirements:
      - FeasibilityReports are derived data and are not exported; the hash of the report cited by a signed revision travels inside that revision.
      - After import every imported subject is re-checked before any consent or proposal action is allowed.
      - Check codes are never renamed or reused; new codes are additive in a minor release of the schema.
    export: "Not exported (derived). Section mutiny.proposals carries the cited report hash inside each ProposalRevision."
    import: "No report import; first open after import runs mutiny.feasibility.check for each open subject."
    backup: "Reports are regenerable; the vault export is the primary backup (IOX-6)."
    migration_rollback: "New checks are additive; an older release ignores unknown check codes and treats them as warn, so rollback cannot make a cycle look feasible."
