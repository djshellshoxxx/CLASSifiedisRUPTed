# F02.S02.M02 Four-party cycles: length-4 LengthProfile of the matcher (ADR-0005, ADR-0016).
id: F02.S02.M02
scope: MVP
summary: >-
  The length-4 profile of the cycle engine. Four-party cycles are riskier because a single dropout invalidates four trades, so this profile applies the
  FLOW-05 value tolerance (at most 5 percent of the larger side) to every leg, a stricter distance constraint than the 3-party profile (each adjacent pair
  within 10-25 km) and requires every participant to accept at least 4 participants. It registers its LengthProfile with the F02.S02.M05 registry, which the
  engine F02.S02.M03 reads, explains 4-party suggestions to each participant and owns no records.
  Suggestions stay advice; a proposal needs explicit signed consent from all four.
responsibilities:
  - Define and register with the F02.S02.M05 registry the length-4 profile: tolerance 500 basis points of the larger side per leg (FLOW-05), absolute minimum reference 5.00 EUR converted with the pinned quote, every adjacent pair within distance bucket ordinal 2 (10_25, the stricter part of this profile), imbalance quantum 10 permille, minimum want age 15 minutes, and maxOtherOpenCycles 2 read by the consent-time guard of F02.S03.M01.
  - Require that all four participants have maxCycleLength at least 4 and opted in as profile admission rules; the limit of 2 other open cycles is not an admission rule, because other participants' counts are private, and each participant's own vault enforces it at consent time (F02.S03.M01).
  - Produce the participant-facing explanation of a 4-party suggestion including the dropout risk notice that one withdrawal cancels all four trades before handover.
non_responsibilities:
  - Enumeration, scoring order and selection (F02.S02.M03).
  - Feasibility verdicts (F02.S02.M05) and proposals and consent (F02.S03.M01).
  - Profiles for other lengths (F02.S02.M01 and engine defaults).
  - "Future: partial-cycle fallbacks that split a failed 4-party cycle into two 2-party cycles; this would be a new suggestion needing fresh consent, never an automatic reroute."
depends_on: [F02.S02.M03, F02.S02.M04, F02.S02.M05, F02.S04.M02, F09.S03.M03, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-MNY-001, CTR-PRV-001, CTR-SCH-001]
user_stories:
  - As a member in a 4-party suggestion, I see a plain notice that all four of us must consent and reserve before anything is committed, and that nothing is automatic.
  - As a member, I can see that the 5 percent tolerance applies to every leg of a 4-party cycle and that each neighbour in the ring is within 10-25 km, stricter than for 3-party cycles.
edge_cases:
  - One participant is within 10 km of the previous participant but 30 km from the next; the pair constraint fails for that edge and the cycle is not suggested.
  - A participant already has 2 other open cycles; the suggestion is still shown, and that participant's own vault refuses consent with MUTINY_PARTICIPANT_OVERLOADED at consent time without revealing the count to anyone.
  - A 4-party suggestion has needsCompensation true; the explanation names who would pay whom as a plan to review, not a commitment.
  - A relay computed the suggestion with an older profile version (p4.1, 3 percent) while the vault uses p4.2 (5 percent per leg); the vault re-verifies with its own values and shows both.
  - Explanation requested for a 3-party suggestion; the query rejects it as a length mismatch.
ux:
  screens:
    - "Explanation panel for 4-party suggestions: four rows, a 'what could go wrong' notice about dropouts, and the distance bucket of each hand-over."
    - "Profile info sheet with the stricter numbers and the profile version."
  states: [loading, ready, override-applied, error]
  a11y:
    - The dropout notice is plain text in a region with an accessible heading, not only an icon.
    - Each of the four participant rows is a list item with a complete sentence; gap and tolerance are not conveyed by color alone.
processes:
  domain_schema:
    entities: []
    note: "Library module. The length-4 profile is a typed constant LengthProfile {length: 4, toleranceBps: 500 (per leg, FLOW-05), absoluteMinRef: {amount: '500', currency: 'EUR'}, maxPairBucket: 2 (10_25 per the F02.S02.M04 ordinal mapping), imbalanceQuantumPermille: 10, minWantAgeMinutes: 15, maxOtherOpenCycles: 2 (consent-time guard in F02.S03.M01), version: 'p4.2'} registered with the F02.S02.M05 LengthProfile registry; no records are owned."
    requirements:
      - The length-4 profile is a typed, versioned constant with the FLOW-05 per-leg tolerance and the stricter distance stated above and is registered at startup with the F02.S02.M05 registry, which the engine reads.
      - Overrides are accepted only inside bounds (tolerance 0..1000 bps, absolute minimum reference 0..100.00 EUR, pair bucket ordinal 0..4) and effective values are copied into each explanation.
      - The explanation model is derived and stores nothing of its own.
  validation_rules:
    requirements:
      - Admission rules specific to 4-party cycles are evaluated by the engine through this module's provider and reported with stable reason codes.
      - Overrides are validated against bounds before taking effect.
      - Amount arithmetic uses bigint and the settlement currency exponent.
    rules:
      - "V01 | toleranceBps override is an integer in 0..1000 | VALIDATION_FAILED"
      - "V02 | every participant has maxCycleLength ≥ 4 | MUTINY_FOUR_LENGTH_PREFERENCE"
      - "V03 | every adjacent pair distance bucket ordinal ≤ 2 (10_25), computed by F02.S02.M03 from the giver's listing cell and the receiver's want cell (≤ L2) | MUTINY_FOUR_DISTANCE"
      - "V04 | a maxOtherOpenCycles override is an integer in 0..5; the value is never an admission rule over other participants and is enforced only by the consent-time guard in each participant's own vault from local counts (F02.S03.M01 MUTINY_PARTICIPANT_OVERLOADED) | VALIDATION_FAILED"
      - "V05 | explanation subject exists in this vault and has length 4 | MUTINY_PROFILE_LENGTH_MISMATCH"
  workflow_state_machine:
    machines: []
    note: "No stateful entity. The profile is a constant per release and explanations are computed on demand."
    timeouts: []
    requirements:
      - There are no lifecycle states; a new profile version applies to later runs and earlier suggestions keep their recorded version.
      - Engine and explanation read the profile through the same F02.S02.M05 registry so they cannot disagree.
      - A missing provider falls back to the engine default profile with a diagnostic and never to the 3-party profile.
  commands_queries_events:
    requirements:
      - The module exposes two read-only queries and no commands because it holds no state and produces no statements.
      - The catalog lists mutiny.cycle.suggested for this module, but the single producer is the engine F02.S02.M03; this module emits nothing itself.
      - Queries run in the vault for the local principal.
    commands: []
    queries:
      - name: mutiny.cycle4.get_profile
        capability: mutiny.cycle4.read_profile
        input: "{ tenantId? default current }"
        output: "{ length: 4, toleranceBps, absoluteMinRef: Money, maxPairBucket, imbalanceQuantumPermille, minWantAgeMinutes, maxOtherOpenCycles, version, overridden }"
        errors: []
      - name: mutiny.cycle4.explain
        capability: mutiny.cycle4.read_explanation
        input: "{ suggestionId }"
        output: "{ suggestionId, profileVersion, absoluteMinConverted: Money, participants: { actorId, gives, receives, gap, tolerance, withinTolerance, distanceBucket 0..4 (label discovery.bucket.*), bases[] }[4], dropoutNoticeKey }"
        errors: [NOT_FOUND, MUTINY_PROFILE_LENGTH_MISMATCH]
    events_produced: []
    events_consumed:
      - {type: mutiny.cycle.suggested, effect: "pre-compute and cache the explanation for length-4 suggestions"}
      - {type: mutiny.matching_profile.updated, effect: "invalidate cached explanations for the affected participant"}
    errors:
      - "MUTINY_FOUR_LENGTH_PREFERENCE | 422 | no | a participant accepts fewer than 4 participants"
      - "MUTINY_FOUR_DISTANCE | 422 | no | an adjacent pair is farther than 10-25 km"
    example: |
      # 4-party ring b1->b2->b3->b4->b1 values EUR minor: 20000, 19800, 19500, 19900
      mutiny.cycle4.explain { "suggestionId": "0192f3d0-…" }
      -> participants: b1 gives 20000 receives 19900 gap 100 tolerance max(5% of 20000 = 1000, 500)=1000 within;
                       b2 gives 19800 receives 20000 gap 200 tolerance 1000 within;
                       b3 gives 19500 receives 19800 gap 300 tolerance max(990, 500)=990 within;
                       b4 gives 19900 receives 19500 gap 400 tolerance max(995, 500)=995 within
         (FLOW-05: 5 percent per leg; the stricter rule of this profile is the 10_25 pair distance)
         dropoutNoticeKey "mutiny.cycle4.dropout_notice" (one withdrawal before handover cancels all four trades; nothing is rerouted)
  authorization_capabilities:
    requirements:
      - Only the local principal reads explanations in its vault.
      - Explanations show only data the principal already has, labelled by basis.
      - No write capability exists in this module.
    capabilities:
      - "mutiny.cycle4.read_profile | principal, relay-client | public numbers"
      - "mutiny.cycle4.read_explanation | principal | suggestion belongs to the principal's vault"
  failure_recovery_idempotency:
    requirements:
      - Queries are pure reads, safe to repeat.
      - A missing registration at startup is reported as degraded and handled by engine defaults.
      - Cached explanations are rebuilt from suggestions after a crash.
    idempotency: "Queries are naturally idempotent."
    concurrency: "Read-only over a consistent IndexedDB snapshot."
    retries: "No network calls; nothing to retry."
    offline: "Fully available offline."
    partial_failure: "If a port for a basis label fails, the row shows basis unverifiable and the explanation is still returned."
  privacy_retention_abuse:
    requirements:
      - Explanations expose no block or exclusion information and no other trades of the principal.
      - Cached explanations are P2, device-only and deleted with their suggestion.
      - Participant load (other open cycles) is never evaluated by the proposer or the engine; each participant's own vault enforces the limit of 2 other open cycles at consent time from local counts (F02.S03.M01), so no counter is published or inferred.
    data:
      - "Explanation cache: P2 derived."
      - "Profile constants: P0."
    retention:
      - "Explanation cache follows CycleSuggestion RET-SHORT (30 days)."
    threats:
      - "T01 | Overload rule used to infer how many cycles a person has open | the rule runs only in each participant's own vault at consent time and its refusal is shown only to that participant; no counter is published"
      - "T02 | Tampered override loosens the tolerance or the stricter distance | bounds enforced and effective values shown in every explanation"
    abuse_controls:
      - "Query rate limit 120 per minute per vault."
  observability_performance:
    requirements:
      - Explanation latency is recorded locally; nothing leaves the device.
      - Explanation computation for 4 participants completes within 10 ms.
      - The active profile version is visible in engine run statistics.
    metrics:
      - "classrup_mutiny_cycle4_explain_duration_ms (histogram, local diagnostics and relay if served there)"
    logs:
      - "debug cycle4.explained {suggestionId, profileVersion, correlationId} — no DIDs or amounts."
    budgets:
      - "explain p95 ≤ 10 ms computing, ≤ 100 ms including IndexedDB reads."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - The 4-party worked example is a golden test with exact bigint outputs.
      - The module is tested for emitting no events and sending no statements.
    fixtures: "4-party values 20000, 19800, 19500, 19900 EUR minor; pair distance fixtures with one 30 km edge; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,03.R01 | read default profile | toleranceBps 500, absoluteMinRef 500 EUR minor, maxPairBucket 2, maxOtherOpenCycles 2, version p4.2"
      - "T02 | unit | 01.R02,02.R01 | overrides at and beyond bounds | out-of-bound rejected, in-bound recorded and shown"
      - "T03 | unit | 01.R03,02.R03,09.R02 | golden 4-party explanation (regenerated for FLOW-05) | gaps 100, 200, 300, 400 and tolerances 1000, 1000, 990, 995 exactly; same values as the FLOW-05 integration test"
      - "T04 | unit | 02.R02,04.R03 | a 3-party suggestion explained as 4-party | MUTINY_PROFILE_LENGTH_MISMATCH"
      - "T05 | unit | 02.R02 | ring with one 25_50 edge and one participant with maxCycleLength 3 | MUTINY_FOUR_DISTANCE and MUTINY_FOUR_LENGTH_PREFERENCE; no overload rule is evaluated at suggestion time"
      - "T06 | contract | 04.R01,04.R02,09.R03 | queries and engine events | outputs validate against registry; no events or statements from this module"
      - "T07 | integration | 03.R02,03.R03,06.R02 | engine started without provider | engine default profile used and degraded diagnostic logged; never the 3-party profile"
      - "T08 | abuse | 05.R01,05.R02,05.R03,07.R01 | other principal queries; explanation inspected | NOT_FOUND; no block or exclusion information"
      - "T09 | integration | 06.R01,06.R03,07.R02,08.R02 | crash and restart | explanations rebuilt within 10 ms and cache purged with suggestion"
      - "T10 | unit | 07.R03,08.R01,08.R03 | suggestion with a participant holding 3 other open cycles; run statistics | suggestion produced, no load input read; consent-time guard of F02.S03.M01 refuses only in that participant's vault; profile version p4.2 in stats; latency recorded locally"
      - "T11 | unit | 09.R01 | traceability tool run | every PS-017 requirement maps to a passing test"
      - "T12 | integration | 10.R01,10.R02,10.R03 | export, import, rollback | no module records exported; profile version retained on imported suggestions"
      - "T13 | a11y | 01.R01 | explanation panel with dropout notice | axe zero serious issues"
    acceptance:
      - All tests T01–T13 pass in CI.
      - The golden 4-party example reproduces gaps 100, 200, 300, 400 and tolerances 1000, 1000, 990, 995 exactly, matching FLOW-05.
      - The module emits no events and no statements and holds no records.
  import_export_backup_rollback:
    requirements:
      - The module owns no records, so export contains nothing of its own; profile version p4.2 is carried inside each exported CycleSuggestion.
      - Imported suggestions keep their recorded profile version and are re-verified with the importing vault's profile.
      - Profile changes are versioned and rollback restores previous constants without data migration.
    export: "Nothing of its own; profile version p4.2 is carried in exported CycleSuggestion records of F02.S02.M03."
    import: "No import; imported suggestions are re-verified with the local effective profile on first open."
    backup: "No data to back up; tenant overrides are part of tenant settings backups (F15.S04.M03)."
    migration_rollback: "Profile constants ship with the release; rollback restores previous constants and earlier suggestions keep their recorded version."
