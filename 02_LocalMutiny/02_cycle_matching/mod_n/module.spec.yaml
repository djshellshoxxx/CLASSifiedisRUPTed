      - "T15 | chaos | 06.R03,03.R03 | kill the vault mid-run | previous suggestion set intact after restart, no partial records"
      - "T16 | load | 08.R01,08.R02,08.R03 | gDense on reference relay, 100 runs | p95 ≤ 250 ms, truncation flagged when budget forced, metrics exported"
      - "T17 | property | 09.R02,02.R02 | budget 100000 expansions on adversarial dense graph | expansions never exceed 100000 and truncated is expansions or time"
      - "T18 | unit | 09.R01 | traceability tool run | every PS-018 requirement maps to a passing test"
      - "T19 | e2e | 01.R03,05.R03 | mobile user opens suggestion, dismisses it | ring diagram text alternative present, axe zero serious issues, no network call made"
      - "T20 | integration | 10.R01,10.R02,10.R03 | export, import into fresh vault, schema rollback | unexpired suggestions round-trip as unverified until re-verified; graph caches absent"
    acceptance:
      - All tests T01–T20 pass in CI with seeds recorded.
      - No suggestion is ever created as a proposal, reservation, consent or signed statement by the engine.
      - Same inputHash and parameters produce identical suggestions on two different devices.
  import_export_backup_rollback:
    requirements:
      - Export includes active and recent CycleSuggestion records of the user, flagged derived, and excludes CompatibilityGraph caches.
      - Imported suggestions are always re-verified before they can be proposed and expire at their original expiresAt.
      - Schema changes follow expand and contract and keep v1 readable for 180 days.
    export: "Section mutiny.suggestions in classrup-export/v1; one line per non-purged CycleSuggestion (schema classrup.mutiny.cycle_suggestion/v1)."
    import: "Suggestions import with verifiedLocally=false and status unchanged unless expiresAt is past, in which case expired; re-verification runs on first open."
    backup: "The user's vault export is the primary backup (IOX-6); relays hold only transient suggestion envelopes in mailboxes (IOX-7)."
    migration_rollback: "Additive optional fields only in v1; rollback to the previous release ignores unknown fields; the suggestion set is derived so a rollback can always regenerate it by running generate."
