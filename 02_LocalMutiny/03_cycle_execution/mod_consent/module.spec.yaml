# F02.S03.M01 Cycle consent and commit verdict (ADR-0007, ADR-0016 local-first).
id: F02.S03.M01
scope: MVP
summary: >-
  Turns a suggestion (or an accepted two-party proposal) into a Cycle that every participant holds in their own vault. Each participant consents through
  F08.S02.M02 comms.consent.sign (subjectType mutiny_cycle, statement key consent.mutiny.cycle.commit.v1) on the exact immutable revision digest, carried as
  subjectRevisionHash equal to the revision contentHash cid itself (CTR-ID-001 ID-3 form sha256-<base64url>, F02.S01.M04, N13), and each vault decides on its own whether the cycle is committed. A vault commits only
  when comms.consent.verify reports every participant's consent on the head digest and head revision number valid, every giver's classrup.bazaar.reservation/v1
  (F02.S03.M02) is valid and unexpired, feasibility is fresh, and the vault's own clock is before the consent deadline (default 72 h, range 1 h to 7 d, at most 24 h
  when more than one currency is involved). Any clock disagreement counts as expired. There is no distributed lock and no atomic cross-vault commit. A signature
  evidences an assertion, not delivery of goods, and nothing is ever silently rerouted. This module ingests no envelope itself: consents, declines and revocations
  are accepted by F08.S02.M02, reservations by F02.S03.M02, revisions by F02.S01.M04 and withdrawals by F02.S03.M03, and this module reacts to their events.
responsibilities:
  - Own the Cycle aggregate and CycleConsent records as seen by one vault, with states opening, proposed, committed, executing, completed, partially_executed, declined, cancelled and frozen.
  - Create a cycle from a verified suggestion (coordinator), from a peer revision 1 accepted by F02.S01.M04 (participant), or from an accepted TradeProposal, with participants, legs, revision and reservations built through the owning modules.
  - React to consents, declines and revocations accepted by F08.S02.M02, reservations accepted by F02.S03.M02 and revisions accepted by F02.S01.M04, and compute the local commit verdict whenever evidence or the clock changes, re-checking every consent with comms.consent.verify inside the committing transaction.
  - Freeze the cycle on forks, coordinator equivocation, conflicted consents or conflicting promises, and mirror terminal states reported by dropout and recovery modules.
  - Enforce the consent-time overload guard of the length profile from local counts only, show a trust panel per participant, and cap open cycle proposals from identities with no history across all senders.
  - Register the module's export section, deletion and retention purge handlers with F10 (N6) and pseudonymize erased participants in retained evidence.
  - "Register the F08.S02.M02 SubjectCanonicalizerPort for subjectType mutiny_cycle by inverted registration: canonicalBytes(ref, rev) from F02.S01.M04, currentRevision(ref), partyRole(ref, did) and isCommitted(ref)."
non_responsibilities:
  - Matching and suggestions (F02.S02.M03) and feasibility checks (F02.S02.M05).
  - Consent statement format, ingest, revocation and key verification primitives (F08.S02.M02, F16.S02.M03, F07.S01.M01).
  - Reservations (F02.S03.M02), timeouts, withdrawals and dropouts (F02.S03.M03), handover attestations and recovery (F02.S03.M04).
  - "Future: threshold consent for large cycles with designated alternates, which would require explicit pre-consented alternates and is excluded now to avoid silent rerouting."
depends_on: [F02.S03.M02, F02.S02.M03, F02.S02.M05, F02.S01.M02, F02.S01.M03, F02.S01.M04, F02.S04.M02, F08.S02.M02, F07.S01.M01, F07.S02.M02, F07.S03.M01, F12.S03.M04, F16.S02.M03, F15.S01.M01, F11.S01.M01, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-FED-001, CTR-IDM-001, CTR-MNY-001, CTR-PRV-001, CTR-SCH-001]
user_stories:
  - As a participant in a 3-party cycle, I read exactly what I give, what I receive, from whom and the value gaps, and I sign consent on that exact revision; nothing happens to my item until I sign.
  - As a coordinator, I see which participants have signed, whose reservation statement is missing, and the true delivery state of every statement I sent.
  - As a participant, if anyone changes the terms, revokes their consent or the deadline passes before all have signed, my consent becomes void or the cycle ends, and my reservation is released automatically.
  - As a participant invited by people I have never traded with, I see how long this device has known each of them, how many completed trades it knows of, and a warning when two of them share keys.
edge_cases:
  - Three of four participants signed and the fourth's consent arrives after the deadline on my clock; my vault does not commit and expires the cycle, even if the fourth's vault considers it in time.
  - The coordinator revises the cycle while I am reviewing; my signing is refused with a stale revision error and I must review the new revision.
  - A consent signed with a device key that was revoked yesterday arrives; F08 rejects it and the participant is shown as not consented.
  - Bob revokes his consent through F08 before Dan's last consent arrives at my vault; Bob's consent is void with reason consent_revoked and my vault does not commit.
  - Two participants propose the same cycleKey concurrently; the vault keeps the proposal it consented to first, and the other is stored as duplicate and cannot be consented because the item is already reserved in this vault.
  - A participant declines (F08 kind decline) after signing consent; vaults that have not yet committed move to declined, and vaults that already committed hand the case to dropout handling.
  - The coordinator sent revision 2 with one digest to Bob and another digest to Carol; Carol's correctly signed consent on revision 2 reaches Bob's vault with a different hash, which is equivocation evidence and freezes the cycle.
  - An accepted 2-party proposal is opened as a cycle but the imported consent of one party no longer verifies; the cycle moves from opening to frozen instead of staying in opening.
  - The device is offline when the last consent arrives; the verdict is computed when the vault next processes it, and the UI says 'waiting for sync' rather than committed.
  - I already have 2 other open cycles and am invited to a 4-party cycle; my own vault refuses my consent with MUTINY_PARTICIPANT_OVERLOADED and nobody else learns my count.
  - The cycle has 8 participants and one has maxCycleLength 6; feasibility fails and the cycle cannot be proposed.
ux:
  screens:
    - "Cycle review screen: ring diagram, per-participant give and receive with values, gap versus tolerance, compensation legs, accepted imbalances that name a participant, deadline in local time, feasibility checklist with basis chips, trust panel per participant (first seen here N days ago, completed trades known here, linked keys warning) and a simultaneous-handover recommendation next to new identities, the plain statement 'I agree to exchange exactly this and I understand nothing is guaranteed by ClassRup', buttons Sign and consent, Decline."
    - "Cycle status screen: consent chips per participant (signed, waiting, void, revoked, late), reservation chips per giver, per-statement sync state, countdown to consent deadline."
    - "Revision-changed banner explaining that all consents were voided and a diff of what changed."
  states: [loading, opening, reviewing, signing, awaiting-others, committed-here, declined, cancelled, expired, frozen, pending-offline, error]
  a11y:
    - The consent statement is real text immediately before the Sign button, and the button name is 'Sign and consent to revision N of M participants'.
    - Chips for consent and reservation state use text labels and icons; changes are announced in an aria-live polite region.
    - Countdown is available as absolute time text and the screen is fully keyboard operable with 44 by 44 px targets.
processes:
  domain_schema:
    requirements:
      - A Cycle is each vault's own view of one exchange ring of 2..8 participants, identified by a coordinator-generated UUIDv7 that equals the TradeProposal id when the cycle originates from an accepted two-party proposal.
      - A CycleConsent references one participant's ConsentStatement accepted by F08.S02.M02 (subjectType mutiny_cycle and statement key consent.mutiny.cycle.commit.v1, or mutiny_proposal and consent.mutiny.proposal.accept.v1 for consents imported from an accepted proposal), the revision number and digest it signed, the local receive time and a validity verdict; consents on any other number or hash, and revoked consents, are void evidence.
      - Cycle composition is P2 and is exchanged only as end-to-end encrypted signed envelopes to the participants; the commit verdict is a local derivation and is never itself a signed fact.
      - The deadline, execution window and every timestamp from other parties are claims; only the local clock decides expiry.
    entities:
      - name: Cycle
        schema: classrup.mutiny.cycle/v1
        storage: device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key; generated by the coordinator, equal in all vaults; equals proposal id for origin trade_proposal"
          - "tenantId: uuidv7 — vault tenant scope"
          - "origin: enum — suggestion | trade_proposal | peer_revision"
          - "sourceId?: uuidv7 — suggestionId or proposalId in this vault"
          - "coordinatorId: did — participant who created revision 1; only coordinator can revise"
          - "length: int — 2..8"
          - "participantIds: array — 2..8 DIDs in ring order, unique"
          - "settlementCurrency: string — registered currency code (F09.S03.M01)"
          - "headRevisionId: uuidv7 — current ProposalRevision (subjectType cycle, or trade_proposal for origin trade_proposal)"
          - "headRevisionNo: int — 1..20"
          - "headRevisionHash: cid — contentHash of the head revision (F02.S01.M04); F08 consents carry this same cid as subjectRevisionHash (CTR-ID-001 ID-3 form sha256-<base64url>, N13), never a hex form"
          - "consentDeadline: timestamp — claim from the head snapshot, evaluated on the local clock; default 72 h, range 1 h to 7 d; at most 24 h and not after the earliest pinned quote expiry when more than one currency is involved (N16)"
          - "executionWindowMs: int — 86400000..1987200000 (1 d..23 d), default 1209600000; (consentDeadline − revision time) + executionWindowMs ≤ 2592000000 (F02.S01.M04 V09)"
          - "status: enum — opening | proposed | committed | executing | completed | partially_executed | declined | cancelled | frozen"
          - "closeReason?: enum — declined | consent_timeout | participant_dropped | lock_lost | fork_detected | equivocation | consent_conflicted | conflicting_promise | clock_disagreement | execution_timeout | import_verification_failed | completed | recovery"
          - "committedLocallyAt?: timestamp — local clock when this vault's verdict became committed"
          - "lastFeasibilityReportId?: uuidv7 — report used for the verdict, must be ≤ 10 min old"
          - "peerSync: object — per participant {consent: none|received|void|revoked, reservation: none|received, lastStatementCid}"
          - "trust: array — one per participant {actorId, firstSeenDays int, completedTrades int (F07.S03.M01), keyLinkedWith did[] (N11), newIdentity boolean}, computed with the F02.S02.M03 trust function"
          - "equivocation?: array — 0..8 items {revisionNo, hashes[2], consentIds[], signerDid} evidence of differing digests for the head revision number"
          - "syncStates: object — per outgoing statement {cid: local_committed|prepared|transport_acknowledged|peer_accepted}"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC, local clock"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - participantIds are distinct, 2..8, and equal the roster of the head revision snapshot.
          - status committed implies a CycleConsent from every participant on headRevisionNo and headRevisionHash for which comms.consent.verify returned valid inside the committing transaction, a valid unexpired reservation from every giver, and a fresh non-infeasible report, all verified in this vault.
          - A new head revision sets every CycleConsent on the previous hash to void and returns committed-not-yet cycles to proposed.
          - Terminal states (completed, partially_executed, declined, cancelled, frozen) never change.
      - name: CycleConsent
        schema: classrup.mutiny.cycle_consent/v1
        storage: device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — vault tenant scope"
          - "cycleId: uuidv7 — Cycle (or TradeProposal) id the consent is about; equals the F08 subjectRef"
          - "participantId: did — signer; one of participantIds"
          - "subjectType: enum — mutiny_cycle | mutiny_proposal (only for consents imported from an accepted proposal)"
          - "statementKey: string — consent.mutiny.cycle.commit.v1, or consent.mutiny.proposal.accept.v1 for imported proposal consents"
          - "kind: enum — consent | decline"
          - "revisionNo: int — F08 subjectRevision; counts only when equal to headRevisionNo"
          - "revisionHash: cid — exact digest signed (contentHash); equals the F08 subjectRevisionHash (same ID-3 cid)"
          - "statementLocale: string — F08 statementLocale, BCP 47 locale of the wording the signer saw"
          - "consentId: uuidv7 — F08.S02.M02 ConsentStatement id"
          - "aliasIds: array — 0..8 cids of F08 duplicates whose aliasOf names consentId; attached as evidence, never counted"
          - "statement: object — embedded copy of the ConsentStatement accepted by F08.S02.M02 (≤ 4 KiB), kept for export as evidence"
          - "direction: enum — own | peer"
          - "signedAtClaim: timestamp — signer's clock, a claim"
          - "receivedAtLocal: timestamp — local clock when F08 accepted it"
          - "relayReceiptAt?: timestamp — relay-signed receipt time, evidence of that relay's clock only"
          - "status: enum — valid | void | late | invalid | conflicted"
          - "voidReason?: enum — revision_changed | declined | cycle_closed | key_revoked | deadline_missed | consent_revoked | conflicted | equivocation"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - At most one valid consent per (cycleId, participantId, revisionHash).
          - A consent with receivedAtLocal, signedAtClaim or relayReceiptAt after the consent deadline has status late and never counts toward commit; claims and relay times can only shorten the window.
          - The signer of statement equals participantId, the statement's subjectRevision equals revisionNo and its subjectRevisionHash equals revisionHash (the same ID-3 cid).
          - A consent revoked through F08.S02.M02 has status void with voidReason consent_revoked and never counts again.
    sql: |
      CREATE TABLE mutiny_cycle (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, origin TEXT NOT NULL, status TEXT NOT NULL, head_revision_hash TEXT NOT NULL,
        consent_deadline TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE INDEX mutiny_cycle_status ON mutiny_cycle(tenant_id, status, consent_deadline);
      CREATE TABLE mutiny_cycle_consent (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, cycle_id TEXT NOT NULL, participant_id TEXT NOT NULL, revision_hash TEXT NOT NULL,
        status TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX mutiny_cycle_consent_valid ON mutiny_cycle_consent(tenant_id, cycle_id, participant_id, revision_hash) WHERE status = 'valid';
  validation_rules:
    requirements:
      - Proposing a cycle requires a verified suggestion, a fresh feasibility report, no infeasible check, reachable participants and the coordinator's own reservation.
      - A consent is valid only if F08.S02.M02 accepted it with subjectType mutiny_cycle and statement key consent.mutiny.cycle.commit.v1 from a non-revoked registered device key of the signer, it names this cycle, the head revision number and the head digest cid as subjectRevisionHash, comms.consent.verify reports it valid, and it arrived before the deadline on the local clock.
      - Commit requires every condition simultaneously and is re-checked inside the same transaction that records the last piece of evidence.
      - Equivocation, overload and unknown-sender limits are evaluated only from data held in this vault and never disclose another vault's data or another participant's counts.
    rules:
      - "V01 | suggestion exists, status suggested, verifiedLocally true, not expired, the coordinator is a participant, and a keyLinked suggestion carries the principal's explicit confirmation | MUTINY_CYCLE_SUGGESTION_UNUSABLE"
      - "V02 | feasibility report for the head hash is ≤ 10 min old and overall is not infeasible | MUTINY_CYCLE_INFEASIBLE"
      - "V03 | length 2..8 and participants unique with mailbox hints and no party in the principal's own block list (F07.S02.M02, own list only) | MUTINY_CYCLE_INFEASIBLE"
      - "V04 | consentDeadline between now + 1 h and now + 7 d (default 72 h); when more than one currency is involved it is ≤ now + 24 h and ≤ the earliest pinned quote expiry (N16), otherwise re-quote and fresh consent; executionWindowMs between 86400000 and 1987200000 and (consentDeadline − now) + executionWindowMs ≤ 2592000000 (F02.S01.M04 V09, F02.S03.M02 V02) | MUTINY_CYCLE_DEADLINE_INVALID"
      - "V05 | principal has ≤ 5 non-terminal cycles and proposals combined and is within the F12.S03.M04 local limit | MUTINY_CYCLE_LIMIT"
      - "V06 | a counted consent has subjectRevision equal to headRevisionNo and subjectRevisionHash equal to headRevisionHash (the same ID-3 cid, never hex); the consent command presents revisionNo and revisionHash equal to the head | MUTINY_CONSENT_STALE_REVISION"
      - "V07 | the consent was accepted by F08.S02.M02 (own comms.consent.signed or peer comms.consent.received), the signer is a participant, subjectRef equals the cycle id, subjectType is mutiny_cycle and statementKey is consent.mutiny.cycle.commit.v1; exception: for origin trade_proposal the two consents with subjectType mutiny_proposal and statementKey consent.mutiny.proposal.accept.v1 on the same head contentHash, imported when the cycle is opened, count | MUTINY_CONSENT_STATEMENT_INVALID"
      - "V08 | local now < consentDeadline, and receivedAtLocal, signedAtClaim and every relayReceiptAt of a counted consent are ≤ consentDeadline; each can only shorten the window and none extends it | MUTINY_CONSENT_LATE"
      - "V09 | the principal's own items were reserved through F02.S03.M02 (classrup.bazaar.reservation/v1, holder {type: cycle, id: cycleId}) for this head hash before the consent was signed | MUTINY_CYCLE_RESERVATION_FAILED"
      - "V10 | an accepted imbalance counts only as an acceptedImbalances entry {actorId, maxAmount} of the head snapshot naming that participant, signed through that participant's consent on the head digest; the consent command takes no unsigned acceptance | VALIDATION_FAILED"
      - "V11 | acting on a terminal or frozen cycle | MUTINY_CYCLE_FROZEN"
      - "V12 | a decline counts only as an F08 ConsentStatement of kind decline accepted by F08.S02.M02 and signed by a participant of the cycle | FORBIDDEN"
      - "V13 | inside the committing transaction comms.consent.verify returns valid for every participant on the head digest; stale or revoked results void the consent, missing blocks the commit and conflicted freezes the cycle | MUTINY_CONSENT_STALE_REVISION"
      - "V14 | a correctly signed participant consent accepted by F08 whose subjectRevision equals headRevisionNo but whose subjectRevisionHash differs from headRevisionHash is equivocation evidence: both hashes are stored, mutiny.revision.report_fork is called (F02.S01.M04 emits mutiny.revision.forked), the cycle freezes and the conflicting revision may be requested from the signer | MUTINY_CONSENT_EQUIVOCATION"
      - "V15 | the principal's own count of other non-terminal cycles in this vault is ≤ the effective length profile's maxOtherOpenCycles (2 for length 4, F02.S02.M02) before the principal's consent is signed; the count is never sent or shown to others | MUTINY_PARTICIPANT_OVERLOADED"
      - "V16 | at most 3 non-terminal incoming cycles per vault, across all senders, have a coordinator with no history in this vault (projection first seen < 30 d and no completed trade known through F07.S03.M01); further ones are kept quarantined silently until the user opts in | MUTINY_CYCLE_LIMIT"
      - "V17 | opening from mutiny.proposal.accepted re-verifies both mutiny_proposal consents with comms.consent.verify on the same head contentHash and both reservations active in F02.S03.M02; any failure moves opening to frozen | MUTINY_CONSENT_STATEMENT_INVALID"
  workflow_state_machine:
    requirements:
      - The commit verdict is a pure function of verified evidence and the local clock; it is re-evaluated whenever evidence or the clock changes and never depends on a message from a coordinator saying committed.
      - Any decline, revocation of a counted consent by its author, expiry, fork, equivocation, conflicting promise or participant loss before commit ends or freezes the cycle for this vault or voids that consent, and no replacement participant is ever substituted.
      - Terminal states do not reopen; renegotiation after a freeze or cancellation is a brand-new cycle with new consents.
      - The consent deadline is evaluated on each vault's own clock, and if the clock disagrees with a relay receipt time about the deadline, the cycle is expired.
      - "The opening state always has an exit: imported evidence that fails verification freezes the cycle and a passed consent deadline cancels it."
    machines:
      - entity: Cycle
        initial: opening
        terminal: [completed, partially_executed, declined, cancelled, frozen]
        transitions:
          - "opening -> proposed | coordinator propose, or a peer revision 1 accepted by F02.S01.M04 (mutiny.proposal.revised revisionNo 1, subjectType cycle) | roster, legs, revision stored; trust panel computed; emits mutiny.cycle.proposed"
          - "opening -> committed | mutiny.proposal.accepted consumed (origin trade_proposal) and V17 passes | both mutiny_proposal consents re-verified with comms.consent.verify on the same contentHash and both reservations active; emits mutiny.cycle.proposed then mutiny.cycle.committed"
          - "opening -> frozen | imported evidence fails verification (V17) or the imported digest differs from the head contentHash | closeReason import_verification_failed; own reservation released through LockPort.releaseForSubject with reason fork_frozen; no signature produced"
          - "opening -> cancelled | consent deadline passed on the local clock before the cycle could be opened (mutiny.cycle.cancelled from the F02.S03.M03 sweep) | own reservation released; nothing signed"
          - "proposed -> proposed | mutiny.proposal.revised for this cycle, or comms.consent.revoked for a counted consent | on revision all consents void and reservations superseded after re-reserve; on revocation that consent is void with voidReason consent_revoked and the verdict is re-evaluated"
          - "proposed -> committed | evaluateCommit true on the local clock | every participant has a consent on the head number and hash verified valid by comms.consent.verify in this transaction, every giver has a valid unexpired reservation, fresh feasibility, no fork or equivocation; emits mutiny.cycle.committed"
          - "proposed -> declined | own decline (comms.consent.sign kind decline) or comms.consent.received kind decline from a participant | own reservation released through LockPort.releaseForSubject in the same transaction; emits mutiny.cycle.declined"
          - "proposed -> cancelled | mutiny.cycle.cancelled consumed | consent deadline passed, participant withdrew or dropped, or lock lost before commit"
          - "proposed -> frozen | mutiny.revision.forked, mutiny.lock.conflict_detected, comms.consent.verify conflicted, or equivocation evidence (V14) | no signature is produced; own reservation released by F02.S03.M02 with releaseReason fork_frozen"
          - "committed -> executing | mutiny.leg.handed_over or mutiny.leg.received consumed | first handover evidence verified"
          - "committed -> cancelled | mutiny.cycle.cancelled consumed | dropout before any handover evidence, including a revocation after commit handled by F02.S03.M03"
          - "committed -> frozen | mutiny.lock.conflict_detected consumed before any handover evidence | renegotiation as a new cycle"
          - "executing -> completed | mutiny.cycle.completed consumed | all legs received and compensation settled as verified by F02.S03.M04"
          - "executing -> partially_executed | mutiny.cycle.partially_executed consumed | recovery case opened by F02.S03.M04"
    timeouts:
      - "Consent deadline evaluated on vault open and every 60 s while open; at the deadline an opening or proposed cycle is cancelled with reason consent_timeout by F02.S03.M03."
      - "A feasibility report older than 10 minutes cannot be used for the verdict and is refreshed automatically before evaluation."
  commands_queries_events:
    requirements:
      - propose, consent and decline are vault commands that each name the signed statements they produce; this module ingests no envelope type and reacts only to the events of each statement type's single ingest owner (F08.S02.M02 consents, declines and revocations; F02.S03.M02 reservations; F02.S01.M04 revisions; F02.S03.M03 withdrawals).
      - Commit is never a command; it is the local verdict emitted as mutiny.cycle.committed in the transaction that records the final piece of evidence.
      - Statements go to the sync outbox with states prepared, transport_acknowledged and peer_accepted, and the UI shows no more certainty than the state reached.
      - Events produced here drive local consumers only; nothing leaves the device except the signed statements.
      - "Statement schemas and signer roles registered with the F11.S01.M01 registry (N2): consents and declines use classrup.comms.consent/v1 (subjectType mutiny_cycle, key consent.mutiny.cycle.commit.v1) signed by a cycle participant, ingest owner F08.S02.M02; reservations use classrup.bazaar.reservation/v1 signed by the item owner, ingest owner F02.S03.M02; revisions use classrup.mutiny.proposal_revision/v1 signed by the coordinator, ingest owner F02.S01.M04; classrup.mutiny.cycle/v1 and classrup.mutiny.cycle_consent/v1 are local records and are never sent. Statements from DIDs the principal blocked are dropped silently by their owners (N7)."
      - Every event payload carries the participant DIDs (participantIds or parties) that notification routing needs to resolve recipients (N4).
      - "mutiny.cycle.committed carries legs [{legId, giverId, receiverId}] in ring order, giverId and receiverId being DIDs as in mutiny.cycle.completed, together with parties [{did, role}] and revisionHash, which consumers use as contextCid, so F07.S03.M01 issues review tickets only to leg-connected counterparties."
      - "The module registers the F08.S02.M02 SubjectCanonicalizerPort for subjectType mutiny_cycle (inverted registration; F08.S02.M02 never depends on F02): canonicalBytes(cycleId, rev) returns F02.S01.M04 canonicalBytes of the cycle's revision chain (subjectType cycle, or trade_proposal for origin trade_proposal); currentRevision(cycleId) returns {revisionNo: headRevisionNo, revisionHash: headRevisionHash}; partyRole(cycleId, did) returns participant for a DID in participantIds and none otherwise; isCommitted(cycleId) is true once this vault's verdict reached committed (committedLocallyAt set). It reads comms.consent.signed and comms.consent.received with the N13 field names subjectType, subjectRef, subjectRevision, subjectRevisionHash (ID-3 cid), statementKey, statementLocale, kind and aliasOf, and a received record with aliasOf is attached to the kept consent it names and never counted twice."
    commands:
      - name: mutiny.cycle.propose
        capability: mutiny.cycle.propose
        input: "{ suggestionId, consentDeadlineMs? (default 259200000), executionWindowMs? (default 1209600000), settlementCurrency?, confirmKeyLinked? } — vault command; produces statements classrup.mutiny.proposal_revision/v1 (revision 1, via F02.S01.M04), classrup.bazaar.reservation/v1 (coordinator reservation, holder {type: cycle, id: cycleId}, via F02.S03.M02) and classrup.comms.consent/v1 (comms.consent.sign kind consent, subjectType mutiny_cycle, statementKey consent.mutiny.cycle.commit.v1, subjectRevision 1, subjectRevisionHash = the revision contentHash cid, statementLocale of the shown wording)"
        output: "{ cycleId, revisionNo: 1, revisionHash, participantIds, consentDeadline, syncState: local_committed | prepared }"
        errors: [VALIDATION_FAILED, MUTINY_CYCLE_SUGGESTION_UNUSABLE, MUTINY_CYCLE_INFEASIBLE, MUTINY_CYCLE_DEADLINE_INVALID, MUTINY_CYCLE_LIMIT, MUTINY_CYCLE_RESERVATION_FAILED, MUTINY_RING_KEY_LINKED, MUTINY_PARTICIPANT_OVERLOADED, BLOCKED_PARTY, RATE_LIMITED]
        emits: [mutiny.cycle.proposed]
        idempotent: true
      - name: mutiny.cycle.consent
        capability: mutiny.cycle.consent
        input: "{ cycleId, revisionNo, revisionHash, expectedRevision } — vault command; produces classrup.bazaar.reservation/v1 (own reservation through F02.S03.M02, if the principal is a giver) and classrup.comms.consent/v1 (comms.consent.sign kind consent, subjectType mutiny_cycle, statementKey consent.mutiny.cycle.commit.v1, subjectRevision headRevisionNo, subjectRevisionHash = headRevisionHash, statementLocale of the shown wording) signed by the principal; an imbalance is accepted only through an acceptedImbalances entry of the head snapshot"
        output: "{ cycleId, consentId, localVerdict: awaiting_others | committed, syncState }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, EXPIRED, MUTINY_CONSENT_STALE_REVISION, MUTINY_CONSENT_LATE, MUTINY_CYCLE_INFEASIBLE, MUTINY_CYCLE_RESERVATION_FAILED, MUTINY_CYCLE_FROZEN, MUTINY_PARTICIPANT_OVERLOADED, COMMS_CONSENT_STALE]
        emits: [mutiny.cycle.consent_recorded, mutiny.cycle.committed]
        idempotent: true
      - name: mutiny.cycle.decline
        capability: mutiny.cycle.decline
        input: "{ cycleId, expectedRevision, reasonCode? } — vault command; produces statement classrup.comms.consent/v1 kind decline (comms.consent.sign, subjectType mutiny_cycle, statementKey consent.mutiny.cycle.commit.v1 with its decline wording) signed by the principal, and releases the principal's reservation through LockPort.releaseForSubject in the same transaction"
        output: "{ cycleId, revision, status: declined, syncState }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, FORBIDDEN, COMMS_CONSENT_STALE]
        emits: [mutiny.cycle.declined]
        idempotent: true
      - name: mutiny.cycle.evaluate
        capability: mutiny.cycle.evaluate
        input: "{ cycleId, trigger: revision|consent|decline|revocation|reservation|clock|import } — internal vault command run inside the transaction of each consumed owner event; reads the records accepted by F08.S02.M02, F02.S03.M02 and F02.S01.M04, calls comms.consent.verify, ingests no envelope and produces no statement"
        output: "{ cycleId, status, localVerdict: awaiting_others | committed | frozen | declined, missing: { code, actorId? }[] }"
        errors: [NOT_FOUND, MUTINY_CONSENT_STATEMENT_INVALID, MUTINY_CONSENT_LATE, MUTINY_CONSENT_STALE_REVISION, MUTINY_CONSENT_EQUIVOCATION]
        emits: [mutiny.cycle.proposed, mutiny.cycle.consent_recorded, mutiny.cycle.committed, mutiny.cycle.declined]
        idempotent: true
    queries:
      - name: mutiny.cycle.get
        capability: mutiny.cycle.read
        input: "{ cycleId }"
        output: "{ cycle: Cycle, consents: CycleConsent[], locks: CycleLock[], feasibility?: FeasibilityReport, trust: Cycle.trust, awaiting: { actorId, kind: consent|reservation }[] }"
        errors: [NOT_FOUND]
      - name: mutiny.cycle.list_mine
        capability: mutiny.cycle.read
        input: "{ status?, cursor?, limit ≤ 50 }"
        output: "{ items: Cycle[], nextCursor? }"
        errors: []
      - name: mutiny.cycle.explain_verdict
        capability: mutiny.cycle.read
        input: "{ cycleId }"
        output: "{ committable: boolean, missing: { code, actorId? }[], evaluatedAt, clockBasis: local }"
        errors: [NOT_FOUND]
    events_produced:
      - {type: mutiny.cycle.proposed, privacy: P2, payload: "{ cycleId, origin, suggestionId?, coordinatorId, participantIds, parties [{did, role: coordinator|participant}], length, revisionNo, revisionHash, consentDeadline }"}
      - {type: mutiny.cycle.consent_recorded, privacy: P2, payload: "{ cycleId, participantId, participantIds, consentId, kind, revisionNo, revisionHash, direction, status, voidReason? }"}
      - {type: mutiny.cycle.committed, privacy: P2, payload: "{ cycleId, revisionNo, revisionHash (contextCid for consumers), participantIds, parties [{did, role}], legs [{legId, giverId, receiverId}] (DIDs, ring order), executionDeadline, sourceType, sourceId? }"}
      - {type: mutiny.cycle.declined, privacy: P2, payload: "{ cycleId, participantId (decliner), participantIds, afterOwnConsent, consentId, cycleKey? }"}
    events_consumed:
      - {type: mutiny.proposal.accepted, effect: "open a Cycle with origin trade_proposal and id equal to the proposal id; import both mutiny_proposal consents and reservations by reference, re-verify them (V17) and commit, or freeze when verification fails"}
      - {type: mutiny.proposal.revised, effect: "for cycle subjects accepted by F02.S01.M04: revision 1 from a peer creates the Cycle in opening and moves it to proposed; later revisions set the new head, void every CycleConsent on older hashes and require the coordinator reservation to be superseded"}
      - {type: mutiny.cycle.locked, effect: "record that a giver's reservation (lockId, reservationCid) accepted by F02.S03.M02 is present and re-evaluate the commit verdict"}
      - {type: mutiny.cycle.unlocked, effect: "re-evaluate the verdict; a reservation that expired or was released before commit blocks the commit; ignore reason superseded when a newer active lock of the same giver exists"}
      - {type: comms.consent.signed, effect: "own statements only: record the principal's consent or decline for subjectType mutiny_cycle and this cycleId; a decline moves the cycle to declined"}
      - {type: comms.consent.received, effect: "peer consent or decline accepted by F08 for subjectType mutiny_cycle and subjectRef this cycleId: read consentId, signerDid, subjectRevision, subjectRevisionHash (ID-3 cid), statementKey, statementLocale, kind and aliasOf; check V06, V07, V08 and V14, store a CycleConsent (a record with aliasOf is attached to the kept consent as aliasIds and not counted again) and re-evaluate the verdict; a decline moves a proposed cycle to declined"}
      - {type: comms.consent.revoked, effect: "before commit mark the consent void with voidReason consent_revoked and re-evaluate the verdict; after local commit the revocation is handled by F02.S03.M03 as a dropout"}
      - {type: mutiny.revision.forked, effect: "freeze the cycle"}
      - {type: mutiny.lock.conflict_detected, effect: "freeze the cycles named in subjectIds"}
      - {type: mutiny.cycle.cancelled, effect: "move opening, proposed or committed cycles to cancelled with the dropout's close reason"}
      - {type: mutiny.leg.handed_over, effect: "move committed to executing"}
      - {type: mutiny.leg.received, effect: "move committed to executing"}
      - {type: mutiny.cycle.completed, effect: "move executing to completed"}
      - {type: mutiny.cycle.partially_executed, effect: "move executing to partially_executed"}
      - {type: identity.reputation.recomputed, effect: "refresh completedTrades in the trust panel of non-terminal cycles containing that DID"}
      - {type: privacy.deletion.completed, effect: "pseudonymize the erased principal's DID in retained terminal cycles and consents with the deletion pseudonym and purge non-evidence fields (trust panel, syncStates); signed statements stay verifiable"}
    errors:
      - "MUTINY_CYCLE_SUGGESTION_UNUSABLE | 409 | no | the suggestion is missing, expired, already used, not verified locally or key-linked without confirmation"
      - "MUTINY_CYCLE_INFEASIBLE | 422 | no | feasibility is missing, stale or has a failing check"
      - "MUTINY_CYCLE_DEADLINE_INVALID | 422 | no | consent deadline or execution window out of range"
      - "MUTINY_CYCLE_LIMIT | 409 | no | the principal has the maximum number of open cycles and proposals, or too many open cycles from identities with no history"
      - "MUTINY_CYCLE_RESERVATION_FAILED | 409 | no | the principal's own items could not be reserved"
      - "MUTINY_CONSENT_STALE_REVISION | 409 | no | the consent names a revision number or hash that is not the head, or comms.consent.verify did not return valid"
      - "MUTINY_CONSENT_STATEMENT_INVALID | 422 | no | the consent was not accepted by F08 or failed signer, subject, subject type or statement-key checks"
      - "MUTINY_CONSENT_LATE | 410 | no | the consent or the local clock is past the consent deadline"
      - "MUTINY_CONSENT_EQUIVOCATION | 409 | no | a participant signed a different digest for the head revision number; the cycle is frozen"
      - "MUTINY_PARTICIPANT_OVERLOADED | 409 | no | the principal already has the maximum number of other open cycles allowed by the length profile"
      - "MUTINY_CYCLE_FROZEN | 409 | no | the cycle is frozen or terminal and accepts no further action"
    example: |
      # Local verdict evaluation (identical rule for every cycle length):
      #   commit iff status = proposed AND localNow < consentDeadline
      #     AND for every participant p: CycleConsent(p) with revisionNo = headRevisionNo, revisionHash = headRevisionHash,
      #         receivedAtLocal, signedAtClaim, relayReceiptAt <= consentDeadline AND comms.consent.verify(...) = valid in this transaction
      #     AND for every giver g: active unexpired CycleLock(g, headHash) with expiresAt >= consentDeadline + executionWindowMs
      #     AND FeasibilityReport fresh (<= 10 min) and not infeasible AND no fork, equivocation or conflicting promise flag.
      #
      # 2-party (origin trade_proposal): Alice and Bob consented on mutiny_proposal digest H1; the cycle opens and commits in each vault that re-verifies both consents + 2 reservations.
      # 3-party: Alice (coordinator) proposes at T0; Bob signs T0+2h; Carol signs T0+30h; deadline T0+72h => each vault commits when the last of 3 consents and 3 reservations is verified there.
      # 4-party: Alice, Bob, Carol signed; Dan's consent received at Alice's vault T0+72h05m => late at Alice's vault: no commit, cycle expires there;
      #          Dan's own vault may show 'waiting', which is truthful: nobody is bound, and Alice's reservation is released at the deadline.
      # N-party (8): all 8 consents and 8 reservations are required; 7 of 8 never commits.
      mutiny.cycle.propose  Idempotency-Key: 0192f430-0000-7000-8000-000000000001
      { "suggestionId": "0192f431-…", "consentDeadlineMs": 259200000 }
      -> 201 { "cycleId": "0192f432-…", "revisionNo": 1, "revisionHash": "sha256-Zk8…", "participantIds": ["did:key:z6MkAlice","did:key:z6MkBob","did:key:z6MkCarol"], "syncState": "prepared" }
      mutiny.cycle.consent { "cycleId": "0192f432-…", "revisionNo": 1, "revisionHash": "sha256-Zk8…", "expectedRevision": 2 }   # on Bob's device
      -> 200 { "consentId": "0192f433-…", "localVerdict": "awaiting_others", "syncState": "prepared" }
      consent via comms.consent.sign (F08.S02.M02) on Bob's device:
      { "subjectType":"mutiny_cycle", "subjectRef":"0192f432-…", "subjectRevision":1, "subjectRevisionHash":"sha256-Zk8…", "statementLocale":"en",
        "statementKey":"consent.mutiny.cycle.commit.v1", "kind":"consent", "readConfirmed":true }
  authorization_capabilities:
    requirements:
      - Vault policy lets only the unlocked local principal propose, consent or decline, and only as a participant of the cycle; a consent signed by anyone else is never created locally.
      - Statements count only after their single ingest owner accepted them as signed by a registered, non-revoked device key of a participant DID with the signer role registered in F11.S01.M01; statements from DIDs the principal blocked are dropped silently (N7).
      - Relays and moderators have no capability over cycles; relay roles govern only what that relay hosts.
    capabilities:
      - "mutiny.cycle.propose | principal | vault unlocked; principal is in the verified suggestion; participation limit not exceeded"
      - "mutiny.cycle.consent | principal | principal is a participant; cycle proposed; principal has not consented to the head hash"
      - "mutiny.cycle.decline | principal | principal is a participant; cycle proposed (after commit a withdrawal is handled by F02.S03.M03)"
      - "mutiny.cycle.evaluate | system | internal; runs only in the transaction of a consumed event of F08.S02.M02, F02.S03.M02, F02.S01.M04 or F02.S03.M03 in this vault"
      - "mutiny.cycle.read | principal | cycle stored in this vault"
  failure_recovery_idempotency:
    requirements:
      - All commands are idempotent per CTR-IDM-001 and mutating commands carry expectedRevision for the local aggregate.
      - Each command and each evaluation is one IndexedDB transaction covering the cycle, consents, reservation release, events and outbox entries, and the commit verdict is evaluated inside that same transaction.
      - Forked or conflicting signed promises are detected, frozen and renegotiated explicitly; consent, money and inventory commitments are never resolved by last-writer-wins.
      - Delivery is at-least-once and out of order; duplicates are skipped by their owners by cid and the verdict converges once the same evidence is present.
    idempotency: "Idempotency-Key required on propose, consent and decline, replay 24 h; evaluate is idempotent per (cycleId, trigger evidence id); consent is bound to (cycleId, participantId, revisionHash) and cannot be created twice."
    concurrency: "expectedRevision on the aggregate; a Web Locks mutex per cycleId inside the vault; cross-vault races surface as forks, equivocation or late consents, never as merges."
    retries: "Outbox retries with IDM-4 backoff (base 500 ms, cap 30 s, max 6 attempts per destination); the same signed envelope is re-sent, a consent is never re-signed."
    offline: "Propose, consent and decline commit locally while offline and show pending; the deadline continues on the local clock, and a consent signed offline that is delivered after the deadline is late at peers."
    partial_failure: "If a consent was delivered but the reservation statement was not, peers do not count the consent toward commit; if a participant's statements reach only some vaults, vaults may disagree on the verdict, and the UI states that each device decides for itself."
  privacy_retention_abuse:
    requirements:
      - Cycle composition, values and consents are P2, travel only in end-to-end encrypted envelopes to the participants and are never published, federated or sent to push in plaintext; relays see recipient mailbox id, size and time only (PRV-5).
      - Evidence is retained for RET-EVIDENCE and pseudonymized, not deleted, if a participant erases their identity locally.
      - Coercion and spam through unwanted cycle proposals are limited by recipient-side muting, per-sender quarantine, the per-vault cap on open cycles from identities with no history, and the proposer's cap of 5 open cycles and proposals.
      - The UI states that pseudonymity is not anonymity and that counterparties can see the public items, pseudonyms and the distance bucket.
      - "The module registers ExportSectionPort (section mutiny.cycles), DeletionPort and RetentionPurgePort with F10 (N6), annotates every Cycle and CycleConsent field with its F10.S02.M02 class, reports every committed or executing cycle of the principal as a DeletionPort.plan() blocker {kind: cycle, ref: cycleId, counterparties: the other participantIds}, and on privacy.deletion.completed pseudonymizes the erased participant in retained cycles."
      - "Sybil rings are made visible rather than claimed impossible: each participant has a trust panel, key-linked rings need explicit confirmation, and the review screen recommends a simultaneous handover for legs adjacent to new identities."
    data:
      - "Cycle and CycleConsent: P2, device only; field classes annotated per F10.S02.M02 (DIDs P2, trust panel P2 derived, syncStates P2)."
      - "Embedded ConsentStatement copies: P2; the signature evidences the signer's assertion on the exact digest, not delivery of any item."
    retention:
      - "Terminal cycles: RET-EVIDENCE (2 years after last related activity)."
      - "Quarantined incoming cycles from identities with no history: RET-SHORT 30 days."
    threats:
      - "T01 | Participant is led to sign terms other than the ones displayed | consent signs the revision digest; the UI recomputes the hash of the displayed snapshot and disables Sign on mismatch"
      - "T02 | Coordinator swaps a participant after consent | cycle revisions cannot change participants; any change is a new cycle needing new consent"
      - "T03 | Replay of an old consent on a new revision | consent binds the exact head number and digest, which also binds revisionNo and prev; other digests are void evidence"
      - "T04 | One vault commits while others do not and the cycle proceeds one-sidedly | execution requires each giver's own action; every handover is attested by the giver and the receiver, and dropout handling cancels before any handover"
      - "T05 | Deadline games using forged claimed times | claims never extend; the local clock decides and a relay-signed receipt time can only shorten the window; disagreement counts as expired"
      - "T06 | Sybil participants (free did:key) in a ring to extract real items | trust panel per participant (first-seen age, completed trades from F07.S03.M01, key linkage per N11), key-linked rings need confirmation, at most 3 open incoming cycles from identities with no history per vault across all senders, simultaneous handover recommended next to new identities; every real participant still signs consent and reserves their own item"
      - "T07 | Coordinator equivocation: different revision N sent to different participants | V14: a correctly signed consent on the head revision number with a different digest stores both hashes, calls mutiny.revision.report_fork, freezes the cycle and may request the conflicting revision from the signer"
      - "T08 | A revoked consent keeps binding its signer | comms.consent.revoked voids the consent (consent_revoked) and comms.consent.verify is re-checked inside the committing transaction; after commit the revocation is a dropout"
    abuse_controls:
      - "Proposer cap of 5 open cycles and proposals and 10 propose commands per day per vault."
      - "Recipients quarantine DIDs that send more than 10 cycle proposals in 24 h and silently ignore blocked or muted DIDs."
      - "At most 3 non-terminal incoming cycles per vault whose coordinator has no history, across all senders; the user can review and release quarantined ones."
  observability_performance:
    requirements:
      - Local diagnostics record transitions, verdict inputs and error codes without DIDs, values or statements; the PWA sends no telemetry (OBS-7).
      - propose for 8 participants completes locally within 500 ms at p95; consent within 300 ms; evaluation of one owner event within 80 ms.
      - Verdict evaluation for 8 participants completes within 20 ms.
    metrics:
      - "classrup_mutiny_cycles_total{outcome=proposed|committed|declined|cancelled|frozen|completed|partial} (local diagnostics)"
      - "classrup_mutiny_consent_to_commit_ms (histogram, local diagnostics)"
      - "classrup_mutiny_consents_void_total{reason} (local diagnostics)"
    logs:
      - "info cycle.committed_locally {cycleId, length, correlationId} — no DIDs or values."
      - "warn cycle.consent_late {cycleId, correlationId}"
      - "warn cycle.equivocation_detected {cycleId, revisionNo, correlationId}"
    budgets:
      - "propose p95 ≤ 500 ms for 8 participants; consent p95 ≤ 300 ms; evaluate p95 ≤ 80 ms; verdict ≤ 20 ms."
      - "Envelope size per statement ≤ 96 KiB; per-cycle stored evidence ≤ 1 MiB."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Multi-vault tests use in-memory vaults with a fake relay that drops, delays, duplicates and reorders, and an injected clock per vault.
      - Property tests show commit is impossible without every consent and reservation on the head hash, and that revisions void consents.
      - Fixtures cover explicit 2-, 3-, 4- and 8-party cycles.
    fixtures: "Vaults Alice, Bob, Carol, Dan and Erin..Hal; cycles C2 (proposal origin), C3, C4, C8; keys and a revoked key for Dan; F08 statement key registry with consent.mutiny.cycle.commit.v1 and consent.mutiny.proposal.accept.v1; fake relay with controllable delay that records every mailbox put; per-vault clocks starting 2026-11-04T10:00:00Z."
    tests:
      - "T01 | integration | 01.R01,03.R01,04.R03 | 3-party happy path across three vaults | each vault commits after verifying 3 consents and 3 reservations; committed event carries executionDeadline and parties"
      - "T02 | integration | 01.R01,03.R01,03.R05 | 2-party accepted proposal opens cycle | Cycle id equals proposal id; both mutiny_proposal consents re-verified on the same contentHash (V07 exception, V17) and both vaults commit"
      - "T03 | unit | 02.R01,02.R03 | each rule V01..V17 violated in turn | documented error code returned, nothing signed"
      - "T04 | property | 03.R01,03.R02,09.R03 | random interleavings, drops and duplicates of consents, revocations, locks and revisions | committed only with all valid consents on the head number and hash and all reservations; terminal states immutable"
      - "T05 | integration | 03.R02,04.R02,01.R03 | coordinator revises after two consents | all consents void, reservations superseded, only the coordinator can revise, participant change refused"
      - "T06 | integration | 01.R04,03.R04 | 4-party with Dan's consent arriving after deadline on Alice's clock | no commit at Alice's vault, cycle expires, reservations released, disagreement counted expired"
      - "T07 | integration | 02.R02,05.R02 | consent signed by revoked key, wrong subject, wrong subjectType, wrong statement key, wrong number, wrong hash, wrong signer | not accepted by F08 or not counted here with MUTINY_CONSENT_STATEMENT_INVALID or STALE"
      - "T08 | integration | 03.R03,06.R03,07.R06 | equivocation: coordinator sends revision 2 with digest H2a to Bob and H2b to Carol; Carol's correctly signed consent on revision 2 with H2b reaches Bob's vault whose head is H2a | V14: both hashes stored, mutiny.revision.report_fork called, mutiny.revision.forked emitted, cycle frozen, no consent counted"
      - "T09 | integration | 03.R03,06.R03 | conflicting reservation for one item in two cycles seen by one vault | mutiny.lock.conflict_detected, both cycles frozen, renegotiation requires new cycle"
      - "T10 | contract | 04.R01,04.R04,09.R02,09.R04 | all commands and evaluate | outputs and events validate against classrup.mutiny.cycle/v1, cycle_consent/v1 and the registry; no cycle envelope is ingested or sent; sync states advance only when acknowledged"
      - "T11 | abuse | 05.R01,05.R02,05.R03 | other principal consents; forged statements; relay tries to inject committed; decline from a non-participant | FORBIDDEN or not accepted by the owners; verdict unaffected"
      - "T12 | integration | 06.R01,06.R02,06.R04 | replay commands; crash mid-transaction; out-of-order and duplicate delivery | one consent per participant; no partial record; verdict converges"
      - "T13 | chaos | 06.R04,06.R03 | relay down 30 min during consent window | statements delivered afterwards, UI never shows peer_accepted before acknowledgement"
      - "T14 | abuse | 07.R03 | 11 proposals from one DID in 24 h; 6th open cycle at one proposer; 4 incoming cycles from coordinators with no history from different senders | quarantine, MUTINY_CYCLE_LIMIT, fourth quarantined silently"
      - "T15 | integration | 07.R02,07.R05 | participant erases identity; others export evidence; F10 export and retention sweep | section mutiny.cycles exported; records retained and pseudonymized; signatures still verify; quarantined incoming cycles purged after 30 days"
      - "T16 | e2e | 07.R04,01.R04 | mobile 3-party consent flow | disclosure that pseudonymity is not anonymity shown; consent statement text before Sign; trust panel shown; axe zero serious issues"
      - "T17 | load | 08.R02,08.R03 | 8-participant propose, consent, evaluate on emulated Moto G | within p95 budgets"
      - "T18 | unit | 08.R01,09.R01 | diagnostics and traceability tool | no identifiers in diagnostics; every PS-021 requirement maps to a passing test"
      - "T19 | integration | 03.R02,01.R02 | participant declines (F08 kind decline) after consent; others not yet committed and already committed | declined at uncommitted vaults with own reservation released; committed vaults hand over to dropout handling"
      - "T20 | integration | 10.R01,10.R02,10.R03 | export, import into fresh vault, schema rollback | cycles and consents round-trip with signatures verified; open cycles import as frozen"
      - "T21 | integration | 03.R02,02.R03,01.R02 | 4-party: Bob revokes his consent through F08 before Dan's last consent arrives at Alice's vault | Bob's consent void with consent_revoked; comms.consent.verify inside the evaluating transaction returns revoked; Alice's vault never commits"
      - "T22 | integration | 07.R01,01.R03 | relay fixture records every mailbox put during propose, consent and decline | mailbox contents are ciphertext only and metadata is limited to recipient mailbox id, size and time"
      - "T23 | contract | 04.R05,02.R02 | F11.S01.M01 registry lookup and comms.consent.sign payload | registered signer roles match; consent uses subjectType mutiny_cycle, key consent.mutiny.cycle.commit.v1, subjectRevision equal to the head number and subjectRevisionHash equal to the head contentHash cid (a hex-encoded digest is not counted); declines are kind decline"
      - "T24 | integration | 03.R05,03.R02 | opening from an accepted proposal whose imported consent no longer verifies; opening whose consent deadline passes on the local clock | opening -> frozen with import_verification_failed and own reservation released; opening -> cancelled"
      - "T25 | unit | 02.R04,04.R06 | principal with 2 other open cycles consents to a 4-party cycle; with 1 other open cycle | MUTINY_PARTICIPANT_OVERLOADED only in the principal's own vault and no count in any statement or event; second consent allowed; declined event carries participantIds"
      - "T26 | abuse | 07.R06,02.R04 | 2-Sybil ring: two fresh did:key identities sharing a device key invite a real member into a 3-party cycle | trust panel shows first seen 0 days and 0 completed trades, key-linked warning, consent requires confirmation, simultaneous handover recommended; quarantined when the unknown-coordinator cap is reached"
      - "T27 | integration | 02.R03,02.R02 | Carol's consent sits above tolerance without an acceptedImbalances entry, then the coordinator revises with acceptedImbalances naming Carol and Carol consents | first not committable (C05 fails); after the revision every vault verifies Carol's consent on the new digest as her signed acceptance and commits"
      - "T28 | contract | 04.R08,02.R02 | F08 shared SubjectCanonicalizerPort conformance suite against the mutiny_cycle registration for C3 and C2 (origin trade_proposal); comms.consent.received for Bob's consent then a duplicate whose aliasOf names it | canonicalBytes equals F02.S01.M04 canonicalBytes and its ID-3 cid equals headRevisionHash for both; currentRevision returns the head; partyRole returns participant for Alice, Bob and Carol and none for Dan; isCommitted false while proposed and true after the local commit; statementLocale stored; the alias is attached as aliasIds and Bob counts once"
      - "T29 | contract | 04.R07,04.R06 | C4 commits at Alice's vault | mutiny.cycle.committed carries legs [{legId, giverId, receiverId}] A to B, B to C, C to D, D to A in ring order with DIDs, parties and revisionHash, and validates against the F07.S03.M01 consumer expectation"
      - "T30 | integration | 07.R05,06.R02 | F10 deletion plan while C3 is executing, C4 proposed and C2 completed | plan() lists exactly one blocker {kind: cycle, ref: C3, counterparties: the two other participants}; C4 and C2 are not blockers; after C3 completes the plan has no blocker"
    acceptance:
      - All tests T01–T30 pass in CI.
      - A cycle is committed in a vault only when every participant's valid signed consent on the head number and hash and every giver's valid unexpired reservation statement were verified in that vault before the deadline on its own clock.
      - No code path adds, removes or replaces a participant of an existing cycle, and forks, equivocation or conflicting promises always freeze rather than merge.
  import_export_backup_rollback:
    requirements:
      - Export contains the user's cycles with all consents and the statements they depend on, because they are signed evidence of what was agreed.
      - Import verifies every consent signature and hash, skips identical records, rejects conflicting IDs, and imports non-terminal cycles as frozen so no stale consent or deadline is acted upon.
      - Schema changes follow expand and contract and keep v1 readable for 180 days.
    export: "Section mutiny.cycles in classrup-export/v1; one line per Cycle (schema classrup.mutiny.cycle/v1) and per CycleConsent (schema classrup.mutiny.cycle_consent/v1) with embedded statements and provenance."
    import: "Terminal cycles import as read-only history; opening, proposed and committed cycles import as frozen with closeReason recovery; reservations never revive."
    backup: "The vault export is the primary backup (IOX-6); relays hold only ciphertext in mailboxes (IOX-7)."
    migration_rollback: "Additive optional fields only in v1; rollback to the previous release ignores unknown fields; the status enum only grows and unknown states read as frozen."
