# F02.S04.M02 Barter currency normalization (CTR-MNY-001, ADR-0016 local-first).
id: F02.S04.M02
scope: MVP
summary: >-
  Converts the declared values of all items in a proposal or cycle into one settlement currency with pinned FX quotes (F09.S03.M02), using bigint arithmetic and a single HALF_EVEN rounding
  per conversion (MNY-3, MNY-4). The resulting NormalizationRecord lists every quote id, rate, source and expiry and is embedded in the signed revision snapshot, so every participant signs the same numbers.
  Receivers independently recompute the arithmetic. Quotes are requested with purpose barter_normalization and a lifetime of at most 24 h (N16) and are shown as 'pinned rate agreed by all parties' with their source
  label from F09.S03.M02 ('signed by relay <name>', 'manual rate by <pseudonym>' or 'source asserted by <pseudonym>, not verifiable'); a receiving vault takes that label and sourceSigned from commerce.fx_quote.verify_embedded, never from the sender. A cross-currency subject therefore has a consent deadline of at most 24 h and never after the earliest quote expiry; otherwise the coordinator re-quotes and issues
  a quote_refresh revision, which voids earlier consents. When a pinned quote expires before commit, the record expires with the same consequence.
responsibilities:
  - Compute normalization records for a subject from valuations and quotes, with settlement currency default from the vault's configuration (default EUR for a EUR tenant), at most 5 distinct currencies and 8 quotes per record.
  - Request quotes from F09.S03.M02 with purpose barter_normalization and validForMs = min(consentDeadline − now + 30 min, 24 h) (N16), label each pinned rate 'pinned rate agreed by all parties' with its source, and require consentDeadline ≤ now + 24 h and ≤ earliestQuoteExpiry; otherwise re-quote and require fresh consent through a quote_refresh revision.
  - Verify and store peers' normalization data from signed revisions by recomputing every conversion and checking every embedded quote with F09.S03.M02 commerce.fx_quote.verify_embedded, taking sourceSigned, issuerSigned and the origin label from its result, and flag mismatches.
  - Expire records at the earliest quote expiry before commit, emit the expiry for re-consent, freeze records after commit and close them when the subject ends, forks or freezes.
  - When the settlement currency is not EUR, provide the tolerance reference quote EUR to settlement currency (purpose barter_normalization) that the revision pins as toleranceRef, used only to convert the profile's absolute minimum reference (F02.S02.M05 C05); its rate is part of the signed terms and its later expiry has no effect.
  - Register the module's export section, deletion and retention purge handlers with F10 (N6).
non_responsibilities:
  - Declared values and plausibility (F02.S04.M03) and tolerance comparison (F02.S02.M05).
  - Quote issuance, rate sources and manual operator rates (F09.S03.M02), currency registry (F09.S03.M01) and Money arithmetic (F09.S03.M03).
  - Compensation amounts (F02.S04.M01) and payments (F09.S01.M01).
  - "Future: multi-currency settlement per leg, rate-source quorum, and conversion of crypto assets with on-chain price oracles."
depends_on: [F02.S04.M03, F09.S03.M01, F09.S03.M02, F09.S03.M03, F16.S02.M03, F15.S01.M01, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-FED-001, CTR-IDM-001, CTR-MNY-001, CTR-PRV-001, CTR-SCH-001]
user_stories:
  - As a coordinator of a cycle with items valued in EUR, GBP and CHF, I see all values in EUR with the rates used, their source and when they expire.
  - As a participant, I can verify that the numbers I sign were converted correctly from the declared amounts and that the rate source is named.
  - As a coordinator, when a quote expires before everyone consented, I get a clear prompt to refresh it and I know that everyone must consent again.
edge_cases:
  - All items are already in the settlement currency; no NormalizationRecord is referenced (normalizationId absent), the 24 h cross-currency deadline cap does not apply, and when the settlement currency is not EUR only the tolerance reference quote is pinned.
  - The coordinator asks for a 72 h consent deadline on a cycle with EUR and GBP items; compute refuses with MUTINY_QUOTE_TOO_SHORT and offers 24 h, because barter quotes live at most 24 h.
  - A currency pair has no available quote; the record is refused and the user is told which pair is missing.
  - The only available rate is a manual operator rate; it is accepted but labelled manual and flagged as not independently sourced.
  - A quote expires before everyone consented; the record expires, the effective consent window ended early, and the coordinator must re-quote and create a quote_refresh revision with fresh consent.
  - A participant's recomputation gives a different converted amount by one minor unit; the revision is flagged normalization_mismatch and cannot be consented.
  - A declared value is in a currency that is not in the registry; refused with the registry's currency error.
  - The settlement currency has zero decimals (JPY) while items are in EUR; the exponent difference is applied exactly as in MNY-4.
ux:
  screens:
    - "Values summary: each item with declared amount, the rate labelled 'pinned rate agreed by all parties', converted amount and source label, plus a footer line 'Rates expire at 14:20; after that the proposal needs a refresh and new consent'."
    - "Rate source details sheet naming source, as-of time and whether the rate was signed by its source or stated by the proposer."
  states: [loading, current, expiring, expired, mismatch, frozen, error]
  a11y:
    - Rates are shown as text such as '1 GBP = 1.1700 EUR' with the source named, readable by screen readers.
    - The expiring and expired banners use text, not only color, and are announced in an aria-live polite region.
    - All actions are buttons of at least 44 by 44 px.
processes:
  domain_schema:
    requirements:
      - A NormalizationRecord pins, for one subject and revision, the settlement currency, each item's declared and converted Money, and every FX quote used with id, rational rate, asOf, expiresAt and source label.
      - Conversions use CTR-MNY-001 MNY-4 with HALF_EVEN rounding applied once per conversion, bigint arithmetic and no floating point anywhere.
      - The record is P2, embedded in the signed revision snapshot, and its hash covers the quotes so changing a rate changes the digest participants sign.
    entities:
      - name: NormalizationRecord
        schema: classrup.mutiny.normalization_record/v1
        storage: device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — vault tenant scope"
          - "subjectType: enum — trade_proposal | cycle | suggestion"
          - "subjectId: uuidv7 — subject the record normalizes"
          - "origin: enum — local | peer_verified"
          - "settlementCurrency: string — registered currency code"
          - "items: array — 2..16 items {inventoryItemId uuidv7, valuationId uuidv7, declared Money, quoteId? uuidv7, converted Money, rounding HALF_EVEN}"
          - "quotes: array — 0..8 items {quoteId, base, quote, rate {num, den} positive integer strings, asOf, expiresAt ≤ issuedAt + 24 h, purpose barter_normalization, source label, sourceSigned boolean}"
          - "earliestQuoteExpiry?: timestamp — min of quotes[].expiresAt; absent when no quotes; the revision consentDeadline is ≤ this and ≤ creation + 24 h"
          - "toleranceRef?: object — {quoteId, rate {num, den}, source} EUR to settlement currency, present when the settlement currency is not EUR; converts the absolute minimum reference only"
          - "quoteChecks: array — 0..8 local results {quoteId, sourceSigned, issuerSigned, verificationLabel, label, expired, reDerivedDeviationBps?}; for peer_verified records the output of commerce.fx_quote.verify_embedded, for local records the issued FxQuote's flags; not covered by normalizationHash and the only source of the labels shown"
          - "normalizationHash: cid — sha256 of JCS(settlementCurrency, items, quotes)"
          - "status: enum — current | superseded | expired | frozen | closed"
          - "mismatch: boolean — true when a peer's recomputation differs"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC, local clock"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - items, quotes, settlementCurrency and normalizationHash never change after creation.
          - Every converted amount equals round_half_even(declared × num × 10^dq ÷ (den × 10^db)) for its quote, or declared when currencies are equal.
          - At most one record with status current exists per (subjectId, headRevision).
          - A record with a quote expiring at or before the local clock cannot be current.
  validation_rules:
    requirements:
      - Normalization refuses unregistered currencies, missing quotes, expired or soon-to-expire quotes, and more than 5 currencies or 8 quotes.
      - Recomputation by receivers uses exactly the same integer arithmetic so any difference is a mismatch and not a tolerance issue.
      - The effective consent deadline can never be later than the earliest quote expiry.
    rules:
      - "V01 | every currency is registered in F09.S03.M01 | COMMERCE_CURRENCY_UNKNOWN"
      - "V02 | at most 5 distinct currencies and 8 quotes per record and at most 16 items | MUTINY_NORMALIZATION_LIMIT"
      - "V03 | each required pair has a quote of purpose barter_normalization from F09.S03.M02 whose expiresAt is at least 30 minutes after the local clock and not more than 24 h after issue | MUTINY_QUOTE_UNAVAILABLE"
      - "V04 | when more than one currency is involved the revision consentDeadline is ≤ now + 24 h and ≤ earliestQuoteExpiry (N16), otherwise re-quote and fresh consent through a quote_refresh revision | MUTINY_QUOTE_TOO_SHORT"
      - "V05 | rate num and den are positive integers and the conversion formula is applied with a single HALF_EVEN rounding | VALIDATION_FAILED"
      - "V06 | peer record recomputes to identical converted amounts and normalizationHash | MUTINY_NORMALIZATION_MISMATCH"
      - "V07 | quote source label is present, and the quoteChecks entry of each quote agrees with the presented quote: a relay-signed quote is sourceSigned true only when commerce.fx_quote.verify_embedded says so, a manual quote is issuerSigned true and sourceSigned false, and a direct-provider quote is sourceSigned false with the label 'source asserted by <issuer pseudonym>, not verifiable'; a presented sourceSigned true that the check does not confirm is refused | MUTINY_QUOTE_SOURCE_UNLABELLED"
      - "V08 | no declared value is non-positive or above 1 000 000 000 000 minor units | VALIDATION_FAILED"
      - "V09 | every pinned quote is displayed with the label 'pinned rate agreed by all parties' and its source before any consent can be signed | MUTINY_QUOTE_SOURCE_UNLABELLED"
      - "V10 | every quote in a received revision passes commerce.fx_quote.verify_embedded {quote, embeddingSignerId: the revision author, embeddingReceivedAt: the local receive time, embeddingSignedAt: the revision's claimed time, reDerive: true}; a failed relay or issuer signature, or a quote expired on the local clock before commit, blocks consent | COMMERCE_RATE_SIGNATURE_INVALID"
  workflow_state_machine:
    requirements:
      - A record is current until a newer record supersedes it, its earliest quote expires, or its subject commits or closes.
      - Expiry before commit emits an event that tells the coordinator a quote_refresh revision is needed; expiry after commit has no effect because the consented numbers are fixed.
      - Records are immutable, and refreshing creates a new record and a new revision with fresh consent from everyone.
    machines:
      - entity: NormalizationRecord
        initial: current
        terminal: [superseded, expired, frozen, closed]
        transitions:
          - "current -> superseded | mutiny.proposal.revised for the subject referencing a different record | newer record is the one in the head revision"
          - "current -> expired | local clock reaches earliestQuoteExpiry before the subject commits | emits mutiny.normalization.expired"
          - "current -> frozen | mutiny.cycle.committed or mutiny.proposal.accepted for the subject | numbers are consented; later quote expiry is ignored"
          - "current -> closed | mutiny.cycle.declined, mutiny.cycle.cancelled, mutiny.proposal.rejected, mutiny.proposal.expired, mutiny.proposal.withdrawn, mutiny.revision.forked or mutiny.lock.conflict_detected | subject ended or froze without commit"
    timeouts:
      - "Quote expiry is evaluated on vault open and every 60 s while open; a notice is raised 30 minutes before earliestQuoteExpiry."
  commands_queries_events:
    requirements:
      - compute and verify are vault commands that produce no signed statement, because the record travels inside the signed revision snapshot of F02.S01.M04.
      - Quotes are requested through F09.S03.M02 and pinned by id; the module never invents rates.
      - Events are written in the same IndexedDB transaction as the records.
      - Every quote request names purpose barter_normalization and a lifetime of at most 24 h, and the module closes records of subjects that ended, forked or froze.
      - "verify calls F09.S03.M02 commerce.fx_quote.verify_embedded once per quote of a received revision and stores sourceSigned, issuerSigned, verificationLabel, label, expired and the ECB re-derivation deviation in quoteChecks; manual quotes are issuerSigned true but sourceSigned false, direct-provider quotes read 'source asserted by <issuer pseudonym>, not verifiable', and the UI shows only these results."
    commands:
      - name: mutiny.normalization.compute
        capability: mutiny.normalization.compute
        input: "{ subjectType, subjectId, items: { inventoryItemId, valuationId }[2..16], settlementCurrency?, consentDeadline } — vault command; requests F09.S03.M02 quotes {base, quote, purpose: barter_normalization, validForMs ≤ 86400000}; produces no statement"
        output: "{ normalizationId?, normalizationHash?, settlementCurrency, earliestQuoteExpiry?, effectiveConsentDeadline (≤ now + 24 h when more than one currency), toleranceRef?, rateLabel: 'pinned rate agreed by all parties', totals: { actorId, givesMinor, receivesMinor }[] }"
        errors: [VALIDATION_FAILED, COMMERCE_CURRENCY_UNKNOWN, MUTINY_NORMALIZATION_LIMIT, MUTINY_QUOTE_UNAVAILABLE, MUTINY_QUOTE_TOO_SHORT, MUTINY_QUOTE_SOURCE_UNLABELLED, DEPENDENCY_UNAVAILABLE]
        emits: [mutiny.values.normalized]
        idempotent: true
      - name: mutiny.normalization.verify
        capability: mutiny.normalization.verify
        input: "{ revisionId } — vault command that recomputes a peer revision's normalization snapshot and calls commerce.fx_quote.verify_embedded {quote, embeddingSignerId, embeddingReceivedAt, embeddingSignedAt, reDerive: true} for each embedded quote; produces no statement"
        output: "{ normalizationId, matches: boolean, differences: { inventoryItemId, expectedMinor, presentedMinor }[], quoteChecks: { quoteId, sourceSigned, issuerSigned, verificationLabel, label, expired, reDerivedDeviationBps? }[] }"
        errors: [NOT_FOUND, MUTINY_NORMALIZATION_MISMATCH, MUTINY_QUOTE_SOURCE_UNLABELLED, COMMERCE_RATE_SIGNATURE_INVALID, VALIDATION_FAILED, DEPENDENCY_UNAVAILABLE]
        emits: [mutiny.values.normalized]
        idempotent: true
    queries:
      - name: mutiny.normalization.get
        capability: mutiny.normalization.read
        input: "{ normalizationId }"
        output: "{ record: NormalizationRecord, expiresInMs?: int }"
        errors: [NOT_FOUND]
      - name: mutiny.normalization.current_for_subject
        capability: mutiny.normalization.read
        input: "{ subjectType, subjectId }"
        output: "{ record?: NormalizationRecord, expiresInMs?: int }"
        errors: []
    events_produced:
      - {type: mutiny.values.normalized, privacy: P2, payload: "{ normalizationId, subjectType, subjectId, settlementCurrency, normalizationHash, quoteIds, earliestQuoteExpiry?, origin }"}
      - {type: mutiny.normalization.expired, privacy: P2, payload: "{ normalizationId, subjectType, subjectId, earliestQuoteExpiry }"}
    events_consumed:
      - {type: mutiny.valuation.declared, effect: "mark current records of non-committed subjects that include the item as superseded so they are recomputed before the next revision"}
      - {type: mutiny.proposal.revised, effect: "supersede records of the subject that are not referenced by the new head revision"}
      - {type: mutiny.cycle.committed, effect: "freeze the subject's current record"}
      - {type: mutiny.proposal.accepted, effect: "freeze the subject's current record"}
      - {type: mutiny.cycle.declined, effect: "close the subject's current record"}
      - {type: mutiny.cycle.cancelled, effect: "close the subject's current record"}
      - {type: mutiny.proposal.rejected, effect: "close the subject's current record"}
      - {type: mutiny.proposal.expired, effect: "close the subject's current record"}
      - {type: mutiny.proposal.withdrawn, effect: "close the subject's current record"}
      - {type: mutiny.revision.forked, effect: "close the subject's current record; renegotiation is a new subject with a new record"}
      - {type: mutiny.lock.conflict_detected, effect: "close the current records of the subjects named in subjectIds"}
      - {type: privacy.deletion.completed, effect: "pseudonymize the erased DID in retained records' local metadata; pinned numbers stay unchanged so revision digests verify"}
      - {type: commerce.fx_quote.issued, effect: "index a new barter_normalization quote so compute can reuse a quote with at least 30 minutes of life instead of requesting another"}
    errors:
      - "MUTINY_NORMALIZATION_LIMIT | 422 | no | more than 5 currencies, 8 quotes or 16 items"
      - "MUTINY_QUOTE_UNAVAILABLE | 409 | yes | no quote with enough remaining life exists for a required pair"
      - "MUTINY_QUOTE_TOO_SHORT | 422 | no | the consent deadline would be later than the earliest quote expiry or more than 24 h away for a cross-currency subject"
      - "MUTINY_QUOTE_SOURCE_UNLABELLED | 422 | no | a quote lacks a source label or a manual rate is not labelled"
      - "MUTINY_NORMALIZATION_MISMATCH | 409 | no | recomputed amounts differ from those presented in a revision"
    example: |
      # 3-party cycle in EUR, GBP, CHF; settlement EUR; local now 2026-11-04T10:00Z; cross-currency consent deadline 23 h 30 min; quotes purpose barter_normalization pinned for 24 h
      mutiny.normalization.compute { "subjectType":"cycle", "subjectId":"0192f432-…", "consentDeadline":"2026-11-05T09:30:00.000Z",
        "items":[ {"inventoryItemId":"i1","valuationId":"v1"}, {"inventoryItemId":"i2","valuationId":"v2"}, {"inventoryItemId":"i3","valuationId":"v3"} ] }
      -> item i1: 12000 EUR stays 12000; item i2: 10000 GBP with quote GBP->EUR num 117 den 100 => 10000 x 117 x 10^2 / (100 x 10^2) = 11700 EUR (HALF_EVEN, exact);
         item i3: 10990 CHF with quote CHF->EUR num 1043 den 1000 => 11462.57 -> 11463 EUR minor units rounded once (HALF_EVEN)
         earliestQuoteExpiry 2026-11-05T10:00:00.000Z (24 h after issue), effectiveConsentDeadline 2026-11-05T09:30:00.000Z, normalizationHash sha256-Nn4…,
         every rate shown as 'pinned rate agreed by all parties' with its source; a 72 h deadline would be refused with MUTINY_QUOTE_TOO_SHORT
      The same call with 2, 4 or N items (N ≤ 16 item lines across at most 8 legs) uses one quote per currency pair and the same rounding rule.
  authorization_capabilities:
    requirements:
      - Vault policy lets only the unlocked local principal compute or verify normalization in its vault.
      - Records of other parties are accepted only as part of a signed revision whose author is a party of the subject.
      - Quote sources are external adapters with their own policy; this module never grants a source any right over records.
    capabilities:
      - "mutiny.normalization.compute | principal | vault unlocked; principal is the coordinator or a party who is allowed to author the next revision"
      - "mutiny.normalization.verify | principal | revision belongs to a subject in this vault"
      - "mutiny.normalization.read | principal | record belongs to a subject in this vault"
  failure_recovery_idempotency:
    requirements:
      - compute is idempotent by (subjectId, inputs hash) and returns the same record while its quotes remain valid.
      - Rate source failures degrade to MUTINY_QUOTE_UNAVAILABLE and never to a guessed rate.
      - A crash during compute leaves no partial record because the record and event are written in one IndexedDB transaction.
    idempotency: "Idempotency-Key replay 24 h; compute is also idempotent by (subjectId, normalizationHash inputs) while the existing record is current."
    concurrency: "Web Locks mutex per subjectId; the record is immutable so concurrent computes either return the existing current record or supersede it in order."
    retries: "Quote retrieval retries 3 times with IDM-4 backoff (base 500 ms, cap 30 s); after that the error is surfaced and the user can choose a different settlement currency."
    offline: "Compute works offline only with already retained unexpired quotes (at least 30 minutes of life); otherwise it reports MUTINY_QUOTE_UNAVAILABLE; verify of peer records works offline."
    partial_failure: "If one of several pairs has no quote the whole compute fails and no partial record is stored; if a quote expires between compute and revision creation the revision creation fails with MUTINY_QUOTE_TOO_SHORT."
  privacy_retention_abuse:
    requirements:
      - Records are P2 and travel only inside signed end-to-end encrypted revision envelopes to the subject's parties.
      - Quote requests to rate sources carry only the currency pair and requested lifetime, never DIDs, items or amounts.
      - Rate manipulation by a proposer is limited by labelling sources, recomputation by every participant and each participant's own consent on displayed numbers.
      - The module registers ExportSectionPort (section mutiny.normalizations), DeletionPort and RetentionPurgePort with F10 (N6), annotates every NormalizationRecord field with its F10.S02.M02 class, and on privacy.deletion.completed pseudonymizes local metadata while the pinned numbers stay verifiable.
    data:
      - "NormalizationRecord: P2; includes declared amounts of items already public in valuations; field classes annotated per F10.S02.M02."
      - "Quote requests: P0 pair, purpose barter_normalization and lifetime only."
    retention:
      - "RET-EVIDENCE 2 years after the last related activity of the subject."
    threats:
      - "T01 | Proposer uses a favorable rate that nobody can verify | each quote shows source and sourceSigned; manual and proposer-stated rates are labelled and participants must consent knowing that"
      - "T02 | Presented converted amounts differ from the formula | every receiver recomputes with the same integer formula and refuses mismatches"
      - "T03 | Quote expires after consent but before commit | effective consent deadline is capped at the earliest quote expiry, and expiry before commit voids consent via a new revision"
      - "T04 | Floating point or double rounding changes outcomes | bigint only, one HALF_EVEN rounding per conversion, property tests against a reference implementation"
      - "T05 | Rate request reveals trades | requests contain only the pair and lifetime"
    abuse_controls:
      - "Local rate limit of 60 compute commands per hour per vault."
      - "At most 8 quotes and 16 items per record bound work per request."
  observability_performance:
    requirements:
      - Local diagnostics record compute and verify outcomes without amounts or DIDs and send nothing off the device (OBS-7).
      - compute for 16 items with 4 quotes completes within 60 ms at p95 excluding network quote retrieval.
      - Verify of a peer record completes within 20 ms.
    metrics:
      - "classrup_mutiny_normalizations_total{outcome=computed|verified|mismatch|expired|unavailable} (local diagnostics)"
    logs:
      - "info normalization.computed {normalizationId, currencies, quotes, correlationId} — no amounts or DIDs."
      - "warn normalization.mismatch {revisionId, correlationId}"
    budgets:
      - "compute p95 ≤ 60 ms without network; verify p95 ≤ 20 ms; quote retrieval timeout 2 s per pair."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Conversion arithmetic is tested against a reference implementation for 10 000 random cases including negative exponents and zero-decimal currencies.
      - Expiry, refresh and mismatch behavior is tested with injected clocks.
    fixtures: "Valuations v1 12000 EUR, v2 10000 GBP, v3 10990 CHF; quotes GBP->EUR 117/100, CHF->EUR 1043/1000, purpose barter_normalization, issued 2026-11-04T10:00:00Z and expiring 2026-11-05T10:00:00Z; EUR->JPY 163/1 reference quote; JPY settlement variant; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,02.R02,09.R03 | compute the 3-currency example | converted amounts 12000, 11700, 11463 EUR minor; normalizationHash stable"
      - "T02 | property | 01.R02,02.R02 | 10 000 random conversions vs reference | identical results with single HALF_EVEN rounding; no floating point"
      - "T03 | unit | 02.R01,02.R03 | each rule V01..V09 violated in turn | documented error code and nothing stored"
      - "T04 | unit | 01.R03,02.R03 | JPY settlement with EUR items | exponent difference applied exactly as in MNY-4"
      - "T05 | integration | 03.R01,03.R02 | quote expires before commit with injected clock | record expired, mutiny.normalization.expired emitted, coordinator must create quote_refresh revision"
      - "T06 | integration | 03.R02,03.R03 | subject commits then quote expires | record frozen and expiry ignored"
      - "T07 | contract | 04.R01,04.R02,09.R02 | commands and events | outputs and events validate against classrup.mutiny.normalization_record/v1 and registry; no statement produced"
      - "T08 | integration | 04.R02,06.R02 | rate source down | MUTINY_QUOTE_UNAVAILABLE, no guessed rate, no partial record"
      - "T09 | abuse | 05.R01,05.R02,07.R02 | peer revision with altered converted amount by one minor unit | MUTINY_NORMALIZATION_MISMATCH and consent blocked"
      - "T10 | abuse | 05.R03,07.R01,07.R03 | manual rate presented as signed; request payload inspected | MUTINY_QUOTE_SOURCE_UNLABELLED; request contains only pair and lifetime"
      - "T11 | integration | 06.R01,06.R03 | replay compute; crash mid-transaction | one current record; no partial state"
      - "T12 | integration | 04.R03,06.R02 | valuation.declared after compute | record superseded and recomputed before the next revision"
      - "T13 | load | 08.R02 | 16 items 4 quotes on emulated Moto G | p95 ≤ 60 ms"
      - "T14 | unit | 08.R01,08.R03,09.R01 | diagnostics and traceability tool | no amounts or DIDs in diagnostics; every PS-025 requirement maps to a passing test"
      - "T15 | integration | 10.R01,10.R02,10.R03 | export, import, rollback | records round-trip and keep hash; imported current records are marked expired when quotes lapsed"
      - "T16 | contract | 04.R04,02.R03 | compute for the 3-currency example with consent deadlines of 23 h 30 min and 72 h | quote requests carry purpose barter_normalization and validForMs ≤ 86400000; 23 h 30 min accepted with every rate labelled 'pinned rate agreed by all parties'; 72 h refused with MUTINY_QUOTE_TOO_SHORT"
      - "T17 | integration | 03.R01,04.R04 | mutiny.proposal.withdrawn, mutiny.revision.forked and mutiny.lock.conflict_detected for subjects with current records | each record closed; later compute for a new subject creates a new record"
      - "T18 | unit | 01.R01,02.R01 | single-currency JPY subject | no NormalizationRecord referenced, no 24 h cap, toleranceRef EUR->JPY 163/1 returned"
      - "T19 | integration | 07.R04 | F10 export, deletion and retention sweep | section mutiny.normalizations exported; erased DID pseudonymized in local metadata; normalizationHash unchanged"
      - "T20 | contract | 04.R05,02.R02,05.R02 | received revision embedding a relay-signed quote, a manual quote presented as sourceSigned true, a direct-provider ecb-daily quote with an invented rate and a quote with a broken relay signature | verify_embedded called once per quote with the revision author and local receive time; quoteChecks give sourceSigned true, then issuerSigned true with sourceSigned false and MUTINY_QUOTE_SOURCE_UNLABELLED for the false claim, then 'source asserted by <issuer pseudonym>, not verifiable' with the ECB deviation, then COMMERCE_RATE_SIGNATURE_INVALID; normalizationHash still recomputes; consent is blocked for the false sourceSigned claim and the broken signature, while the direct-provider quote stays consentable with its label and deviation shown"
    acceptance:
      - All tests T01–T20 pass in CI.
      - Every converted amount matches the MNY-4 formula with one HALF_EVEN rounding, and every record names its quote sources.
      - No cycle can be consented with an expired quote and expiry before commit always requires a new revision and fresh consent from everyone.
  import_export_backup_rollback:
    requirements:
      - Export contains normalization records of the user's subjects because they document the numbers that were signed.
