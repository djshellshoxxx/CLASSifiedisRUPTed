id: F03.S01.M01
scope: MVP
summary: >-
  Providers keep service offerings in their local vault (skills from the shared taxonomy, an hourly or fixed rate,
  a coarse service area, self-attested credentials) attached to a service-type listing. Publishing signs a public
  projection (statement classrup.services.offering/v1) that the provider hands to any user-selected relay for
  indexing; withdrawing signs a tombstone. Credentials are claims by the provider and are always labelled
  self-attested; nobody verifies licences. Scheduling is F03.S01.M02, quotes and bookings F03.S02.M01.
  Per ADR-0016 the vault is authoritative; a relay only hosts the signed projection and may refuse it by policy.
responsibilities:
  - Own the ServiceOffering record in the provider vault and its lifecycle draft, published, withdrawn; sign the public projection and the tombstone with the provider device key.
  - Validate skill codes against the taxonomy (F18.S01.M03), rate Money against the currency registry (F09.S03.M01) and the service area against coarse regions (maximum L2, geohash 5).
  - Store credentials as self-attested claims with an optional evidence attachment reference; never mark them verified.
  - Enforce local limits - 10 skills, 10 credentials, 20 published offerings per provider vault.
  - Track per-relay delivery of the projection through the sync states local committed, prepared, transport_acknowledged, peer_accepted and never claim more than the state reached.
non_responsibilities:
  - Listing text, photos and category (F01.S01.M01); the offering references one service-type Listing.
  - Weekly slots, exceptions and holds (F03.S01.M02 availability).
  - Quotes, bookings and milestones (F03.S02.M01, F03.S02.M02).
  - Search ranking and indexing (F06.S01.M01 consumes services.offering.published).
  - "Future: third-party credential verification and licence registry lookups."
depends_on: [F01.S01.M01, F01.S01.M03, F18.S01.M03, F09.S03.M01, F06.S02.M01, F07.S01.M01, F11.S01.M03, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-MNY-001, CTR-PRV-001, CTR-FED-001]
user_stories:
  - As a provider, I can describe my service, choose up to 10 skills, set an hourly or fixed rate and a service area, and publish it.
  - As a client, I can read an offering and see which credentials are self-attested rather than verified.
  - As a provider, I can withdraw an offering and open quotes on it are closed cleanly.
edge_cases:
  - Provider publishes an offering whose rate currency is not in the registry; rejected with VALIDATION_FAILED and a field path.
  - Provider changes the rate of a published offering while quote requests are open; existing quotes keep their own amount, only new requests use the new rate.
  - Service area is submitted at geohash 6 or finer; rejected with SERVICES_AREA_TOO_PRECISE, never silently truncated.
  - The linked service listing is unpublished or expired by F01; the offering is withdrawn with reason listing_unavailable.
  - Two devices of one provider edit the same offering; the second write fails with CONFLICT_REVISION.
  - A relay refuses or removes the projection by hosting policy; the local offering stays published locally, the sync state shows relay refused, and the provider may choose another relay.
  - Provider revokes the device key that signed the projection; the projection is re-signed with a current key and the old signature is no longer shown as valid.
  - Credential text contains an HTML tag or a link; it is stored as plain text and never rendered as markup.
ux:
  screens:
    - "Offering editor: skills multi-select (max 10) with taxonomy search, rate type toggle hourly or fixed, amount with currency, minimum billable minutes, service area picker limited to L2 cells, remote-capable switch."
    - "Credentials editor: label, issuer, year, optional evidence photo; every row shows a self-attested badge."
    - "Public offering page: skills chips, rate, region name, credential list with self-attested labels, provider pseudonym and reputation summary link."
  states: [loading, empty, draft, published, withdrawn, validation-error, conflict, pending-offline]
  a11y:
    - Rate input has a visible label that includes the currency and uses inputmode=decimal.
    - Skills multi-select is a listbox operable by keyboard with a live count announcement (for example 3 of 10 selected).
    - The self-attested badge is text, not colour alone, and is part of the credential row accessible name.
processes:
  domain_schema:
    requirements:
      - A ServiceOffering stores provider, linked service listing, skill codes, rate type, rate Money, service area cell, remote flag, credentials and status with tenant and revision per CTR-ID-001.
      - Offerings are P3 drafts in the vault and become a P0 signed projection once published; they are retained under RET-STANDARD, and credential evidence attachments are P2 and sent only inside an end-to-end encrypted quote thread.
      - Rate type and currency are immutable after first publication; changing either requires a new offering so historical quotes stay interpretable.
    entities:
      - name: ServiceOffering
        schema: classrup.services.offering/v1
        storage: device
        privacy: P0
        retention: RET-STANDARD
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope"
          - "providerId: actorId — owner of the offering"
          - "listingId: uuidv7 — ref F01.S01.M01 Listing of subtype service; unique per offering"
          - "skillCodes: string[] — 1..10 codes from F18.S01.M03 taxonomy subtree services"
          - "rateType: enum — hourly | fixed"
          - "rate: Money — CTR-MNY-001; > 0; ≤ 1 000 000 000 000 minor units; for fixed it is the starting price"
          - "minBillableMinutes?: int — 15..480; hourly only; default 60"
          - "serviceAreaCell: string — geohash of length 4 or 5 (L1 or L2); never longer"
          - "remoteCapable: boolean — true if work needs no on-site visit"
          - "providerTimeZone: string — IANA zone, copied from the F03.S01.M02 calendar at publish"
          - "credentials: Credential[] — 0..10 items {label ≤ 80, issuer ≤ 80, year? 1950..2100, evidenceAttachmentId?, attestation fixed 'self'}"
          - "status: enum — draft | published | withdrawn"
          - "projectionCid?: string — sha256- cid of the signed public projection (CTR-ID-001 ID-3)"
          - "syncState: map — per destination relay {state: prepared | transport_acknowledged | peer_accepted | refused, at: timestamp}; claims by the relay are evidence of its clock only"
          - "withdrawReason?: enum — provider | listing_unavailable | provider_suspended | policy"
          - "publishedAt?: timestamp — RFC 3339 UTC"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - credentials[].attestation is always 'self'; no code path sets a verified value.
          - A published offering has at least one skill, a registered currency and a service area of precision L1 or L2.
          - A listingId is linked to at most one non-withdrawn offering.
    sql: |
      -- IndexedDB object store services_offering mirrors this shape; the SQLite form is used by the optional relay mirror and tests.
      CREATE TABLE services_offering (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, provider_id TEXT NOT NULL, listing_id TEXT NOT NULL,
        rate_type TEXT NOT NULL, rate_minor TEXT NOT NULL, currency TEXT NOT NULL, area_cell TEXT NOT NULL,
        status TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX services_offering_listing ON services_offering(tenant_id, listing_id) WHERE status <> 'withdrawn';
      CREATE INDEX services_offering_provider ON services_offering(tenant_id, provider_id, status);
  validation_rules:
    requirements:
      - Offering input is validated strictly; unknown fields are rejected and every violation maps to one stable error code.
      - Taxonomy, currency, region precision and credential limits are checked before persistence and again at publish.
      - Free text is plain text only and is length-limited by code points.
    rules:
      - "V01 | skillCodes has 1..10 distinct codes that exist in the taxonomy | SERVICES_SKILL_INVALID"
      - "V02 | rate.amount is a positive integer string within limits and currency is registered | VALIDATION_FAILED"
      - "V03 | serviceAreaCell length is 4 or 5 and is a valid geohash | SERVICES_AREA_TOO_PRECISE"
      - "V04 | linked listing exists, has subtype service, belongs to the provider and is not archived | SERVICES_LISTING_NOT_SERVICE"
      - "V05 | credentials has at most 10 items, label and issuer ≤ 80 code points, year within 1950..2100 | VALIDATION_FAILED"
      - "V06 | provider has fewer than 20 published offerings | SERVICES_OFFERING_LIMIT"
      - "V07 | minBillableMinutes is present only for hourly and within 15..480 | VALIDATION_FAILED"
      - "V08 | rateType and currency equal the stored values on a published offering | SERVICES_RATE_IMMUTABLE"
  workflow_state_machine:
    requirements:
      - Offerings follow draft, published, withdrawn; withdrawn is terminal and a new offering is created to return to market.
      - Publish re-runs all validation, requires a published service listing and a calendar from F03.S01.M02, signs the projection and writes the local event in the same IndexedDB transaction.
      - Withdrawal is automatic when the linked listing is unpublished or expired; relay-side removal never changes the local status.
    machines:
      - entity: ServiceOffering
        initial: draft
        terminal: [withdrawn]
        transitions:
          - "draft -> published | services.offering.publish by provider | full validation passes and listing is published; emits services.offering.published"
          - "draft -> withdrawn | services.offering.withdraw by provider | discards draft; emits services.offering.withdrawn"
          - "published -> withdrawn | services.offering.withdraw or listing unpublished or expired | records withdrawReason; emits services.offering.withdrawn"
    timeouts:
      - "Draft offerings untouched for 90 days are withdrawn by a local sweep that runs at app start and every 60 minutes while the PWA is open; without the app open nothing runs and the sweep catches up at next start."
  commands_queries_events:
    requirements:
      - The module exposes create, revise, publish and withdraw as vault commands (publish and withdraw additionally produce signed statements) and two local queries.
      - Each command writes its local events to the vault outbox in the same IndexedDB transaction as the state change per EVT-8; only the explicit publish and withdraw commands create a signed statement (EVT-9).
      - The module consumes listing events so that offerings never stay published locally without a published listing; relay moderation never arrives as an event because it changes nothing locally.
    commands:
      - name: services.offering.create
        capability: services.offering.create
        input: "[vault-local] { listingId, skillCodes[], rateType, rate: Money, minBillableMinutes?, serviceAreaCell, remoteCapable, credentials? }"
        output: "{ offeringId, revision: 1 }"
        errors: [VALIDATION_FAILED, SERVICES_SKILL_INVALID, SERVICES_AREA_TOO_PRECISE, SERVICES_LISTING_NOT_SERVICE, RATE_LIMITED]
        emits: []
        idempotent: true
      - name: services.offering.revise
        capability: services.offering.revise
        input: "[vault-local] { offeringId, expectedRevision, patch: partial of create fields }"
        output: "{ offeringId, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, VALIDATION_FAILED, SERVICES_SKILL_INVALID, SERVICES_AREA_TOO_PRECISE, SERVICES_RATE_IMMUTABLE]
        emits: [services.offering.revised]
        idempotent: true
      - name: services.offering.publish
        capability: services.offering.publish
        input: "[vault-local plus statement classrup.services.offering/v1 signed by the provider device key] { offeringId, expectedRevision, relayIds? (user-selected relays, max 5) }"
        output: "{ offeringId, revision, publishedAt, projectionCid, syncState }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, VALIDATION_FAILED, SERVICES_OFFERING_LIMIT, SERVICES_LISTING_NOT_SERVICE, PRECONDITION_FAILED]
        emits: [services.offering.published]
        idempotent: true
      - name: services.offering.withdraw
        capability: services.offering.withdraw
        input: "[vault-local plus tombstone statement classrup.federation.tombstone/v1 per CTR-FED-001 FED-4] { offeringId, expectedRevision }"
        output: "{ offeringId, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [services.offering.withdrawn]
        idempotent: true
    queries:
      - name: services.offering.get
        capability: services.offering.read_public
        input: "[vault-local] { offeringId }"
        output: "{ offering: ServiceOffering (published only unless caller is the provider) }"
        errors: [NOT_FOUND]
      - name: services.offering.list_mine
        capability: services.offering.read_own
        input: "[vault-local] { status?, cursor?, limit ≤ 50 }"
        output: "{ items: ServiceOffering[], nextCursor? }"
        errors: []
    events_produced:
      - {type: services.offering.published, privacy: P0, payload: "{ offeringId, providerId, listingId, skillCodes, rateType, rate, serviceAreaCell }"}
      - {type: services.offering.withdrawn, privacy: P0, payload: "{ offeringId, providerId, listingId, reason }"}
      - {type: services.offering.revised, privacy: P0, payload: "{ offeringId, providerId, changedFields[] }"}
    events_consumed:
      - {type: bazaar.listing.unpublished, effect: "withdraw the linked published offering with reason listing_unavailable"}
      - {type: bazaar.listing.expired, effect: "withdraw the linked published offering with reason listing_unavailable"}
    errors:
      - "SERVICES_SKILL_INVALID | 422 | no | a skill code is unknown or the count is outside 1..10"
      - "SERVICES_AREA_TOO_PRECISE | 422 | no | service area is finer than geohash 5 (L2)"
      - "SERVICES_LISTING_NOT_SERVICE | 409 | no | linked listing is missing, not of subtype service, or not owned by the provider"
      - "SERVICES_OFFERING_LIMIT | 409 | no | provider already has 20 published offerings"
      - "SERVICES_RATE_IMMUTABLE | 409 | no | rate type and currency cannot change after publication"
    example: |
      POST /api/v1/cmd/services.offering.create
      Idempotency-Key: 0192f3a4-0000-7000-8000-0000000000a1
      { "listingId": "0192f3a4-5b6c-7d8e-9f01-23456789abcd", "skillCodes": ["svc.plumbing.repair"], "rateType": "hourly",
        "rate": { "amount": "4500", "currency": "EUR" }, "serviceAreaCell": "u0yj1", "remoteCapable": false }
      201 { "offeringId": "0192f3a5-1111-7000-8000-000000000001", "revision": 1 }
  authorization_capabilities:
    requirements:
      - Vault policy - only the unlocked local principal who authored an offering may create, revise, publish or withdraw it; there is no server role.
      - The signed projection is readable by anyone who fetches it from a relay; drafts never leave the vault. Relay policy decides whether a relay indexes or serves it.
      - Foreign projections received from other authors are stored read-only with provenance only when the signature verifies against the listed author key; otherwise they are quarantined with a reason.
    capabilities:
      - "services.offering.create | principal | local principal owns the linked listing; local limit of 20 published offerings"
      - "services.offering.revise | principal | offering.providerId = local principal"
      - "services.offering.publish | principal | offering.providerId = local principal; relay access token or signed request only for the chosen relay upload"
      - "services.offering.withdraw | principal | offering.providerId = local principal"
      - "services.offering.read_public | principal, anonymous | any stored projection whose signature verified; unverified items are quarantined and not returned"
      - "services.offering.read_own | principal | offering.providerId = local principal"
  failure_recovery_idempotency:
    requirements:
      - All commands are idempotent per CTR-IDM-001 using a local command id, and revise, publish and withdraw require expectedRevision.
      - Publish and withdraw are atomic with their local outbox event and sync outbox entry; a crash between them leaves neither.
      - Listing events are consumed idempotently using the inbox table.
    idempotency: "Each command carries a client-generated command id stored in the vault for 24 h (IDM-1); replay returns the stored result; statement delivery to a relay is idempotent by cid."
    concurrency: "expectedRevision on revise/publish/withdraw; one vault is single-writer per IndexedDB transaction; two tabs are serialized by a Web Locks lock named services-offering-<id>; two devices of the same principal that fork are detected through the seq/prev chain and frozen for explicit merge (ADR-0016 section 5)."
    retries: "The sync outbox retries relay upload with backoff 1 s, 2 s, 4 s, 8 s up to 8 attempts, then shows needs attention; local consumers retry per EVT-6."
    offline: "All commands work offline and commit locally; publish shows prepared until a relay acknowledges (transport_acknowledged) and never shows peer_accepted unless a relay returns a signed acknowledgement."
    partial_failure: "If the taxonomy or currency registry cannot be read from the vault cache, publish returns DEPENDENCY_UNAVAILABLE and the offering stays draft; if relay upload fails the offering is published locally and the sync state shows the failure."
  privacy_retention_abuse:
    requirements:
      - Offerings never contain exact addresses; the service area is at most L2, and publishing warns that copies already fetched by other vaults cannot be recalled (PRV-6).
      - Credential evidence attachments are P2, travel only inside end-to-end encrypted envelopes to a client with an open QuoteRequest, and relays see ciphertext only.
      - Fake credentials and keyword stuffing are limited by self-attestation labels, local caps, receiver-side filtering and each relay's hosting policy.
    data:
      - "ServiceOffering: P3 draft in the vault; the signed projection is P0 and carries no evidence attachments."
      - "Credential evidence attachment: P2, shared by reference only."
    retention:
      - "Withdrawn offerings: RET-STANDARD, purged 30 days after provider deletion."
      - "On local deletion of the vault the provider can publish tombstones first; relays honour signed tombstones and keep them 180 days (FED-4)."
    threats:
      - "T01 | Provider claims a licence they do not hold | credentials are rendered with a self-attested badge, the the reader can report or locally hide the offering, and no verified state exists"
      - "T02 | Keyword stuffing and 100 near-duplicate offerings to dominate search | local cap of 20 published offerings, 10 skills each, receiver-side spam filtering and relay hosting policy"
      - "T03 | Service area narrowed to expose a home address | area precision capped at geohash 5, finer values rejected, no address field exists"
      - "T04 | Scraping of provider contact data | projection carries no contact fields; contact happens in end-to-end encrypted F08 threads after a quote request"
    abuse_controls:
      - "Local rate limit of 30 offering writes per hour per vault to protect storage and relay quota."
      - "Relays apply their own upload quotas and hosting policy; receivers may hide a provider locally and subscribe to signed advisory feeds."
  observability_performance:
    requirements:
      - The PWA sends no telemetry (OBS-7); counters and the error log stay in the vault and can be exported by the user.
      - Create, revise and publish meet a local write budget of p95 ≤ 100 ms on a mid-range phone with 1 000 offerings in the vault.
      - Local reads meet p95 ≤ 50 ms.
    metrics:
      - "classrup_services_offerings_total{outcome=created|published|withdrawn}"
      - "classrup_services_offering_validation_failures_total{code}"
    logs:
      - "info offering.published {offeringId, correlationId} in the local diagnostics log only — no credential text."
    budgets:
      - "vault write commands p95 ≤ 100 ms; services.offering.get p95 ≤ 50 ms; list_mine p95 ≤ 80 ms for 50 items."
      - "Draft sweep over 5 000 drafts completes in ≤ 2 s without blocking the UI thread longer than 50 ms per slice."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Contract tests validate command inputs, outputs and event payloads against the schema registry.
      - Privacy tests prove that no credential evidence or area finer than L2 appears in the signed projection and that unverified inbound projections are quarantined.
    fixtures: "Seeded tenant, provider P with published service listing L, taxonomy codes svc.plumbing.repair and svc.tutoring.math, fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R03,02.R01 | create offering with valid input then revise the currency after publish | stored with revision 1; currency change returns SERVICES_RATE_IMMUTABLE"
      - "T02 | unit | 02.R02,02.R03 | each rule V01–V08 violated in turn | the documented code is returned and nothing is stored"
      - "T03 | property | 03.R01 | random command sequences on one offering | only declared transitions succeed; withdrawn never leaves terminal state"
      - "T04 | integration | 03.R02 | publish with listing unpublished and with missing calendar | PRECONDITION_FAILED or SERVICES_LISTING_NOT_SERVICE and no event"
      - "T05 | integration | 03.R03,04.R03 | bazaar.listing.unpublished event delivered twice and a relay refusal received | offering withdrawn once with reason listing_unavailable; relay refusal changes only sync state"
      - "T06 | contract | 04.R01,04.R02,09.R02 | execute each command and read both queries | outputs and event payloads validate against registry schemas"
      - "T07 | abuse | 05.R01,05.R02,05.R03 | foreign principal revises; inbound projection with bad signature and with wrong author key | FORBIDDEN; both inbound items quarantined and not returned by read_public"
      - "T08 | integration | 06.R01,06.R02,06.R03 | replay same key with same and different body; crash between state change and outbox | original response replayed; IDEMPOTENCY_KEY_REUSED; atomic outcome"
      - "T09 | abuse | 07.R01,07.R02 | public read of published offering with credential evidence | no evidence reference and no cell finer than L2 in payload"
      - "T10 | abuse | 07.R03 | 31 offering writes in one hour in one vault | 31st returns RATE_LIMITED"
      - "T11 | load | 08.R01,08.R02,08.R03 | 1 000 offerings in vault, 100 mixed writes and reads on a throttled mobile profile | write p95 ≤ 100 ms, read p95 ≤ 50 ms, no network request made"
      - "T12 | unit | 09.R01 | traceability tool run | every PS-029 requirement maps to a passing test"
      - "T13 | integration | 10.R01,10.R02,10.R03 | export, import to a fresh relay, restore from backup | offerings round-trip identical; conflicting IDs rejected"
      - "T14 | e2e | 01.R02,03.R02,09.R03 | mobile provider creates and publishes an offering and a client views it | credentials show self-attested; screen passes axe with zero serious issues"
    acceptance:
      - All tests T01–T14 pass in CI.
      - No credential is ever displayed without the self-attested label and no verified flag exists in any payload.
      - No public payload carries a service area finer than geohash 5.
  import_export_backup_rollback:
    requirements:
      - The vault export (IOX-1, primary backup) contains all the provider's offerings including drafts, withdrawn ones and sync states.
      - Import validates IDs, schema version, taxonomy codes and currency before accepting a record.
      - Schema changes follow expand and contract and keep v1 readable for 180 days.
    export: "Section services.offerings in classrup-export/v1; one line per ServiceOffering (schema classrup.services.offering/v1)."
    import: "Published offerings import as draft so the provider re-signs and re-publishes after review; unknown skill codes are kept as read-only history with a warning."
    backup: "The vault export is the primary backup (IOX-6); the PWA warns after 30 days without export. Relays hold only the public projection (IOX-7)."
    migration_rollback: "Additive optional fields only in v1; rollback is safe because older readers ignore new fields."
