    acceptance:
      - All tests T01–T22 pass in CI.
      - No dispute outcome is ever decided by this module; only F09 resolution and withdrawal events close a linked link, and no effect changes an obligation.
      - Every opened dispute freezes approvals and fee claims exactly once, produces exactly one non-withdrawn case and is unfrozen exactly once when the case closes.
  import_export_backup_rollback:
    requirements:
      - The vault export contains links, notices and evidence packs so a dispute can be reconstructed without the relay.
      - Import verifies notice signatures and cids; unverifiable notices are kept as read-only history.
      - Schema changes follow expand and contract and keep v1 readable for 180 days.
    export: "ExportSectionPort section services.disputes in classrup-export/v1; one line per ServiceDisputeLink with the signed notice and withdrawal envelopes."
    import: "Resolved, withdrawn and failed links import as history; pending_link imports as pending_link and resumes case creation with the same link id; linked imports as linked and re-links when the case is imported."
    backup: "The vault export is the primary backup (IOX-6); relays hold only ciphertext (IOX-7)."
    migration_rollback: "Additive optional fields only in v1; rollback is safe because notices are immutable and older readers ignore unknown fields."
