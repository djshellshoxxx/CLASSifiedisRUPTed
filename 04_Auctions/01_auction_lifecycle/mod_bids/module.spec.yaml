id: F04.S01.M02
scope: MVP
summary: >-
  Bidders place bids on an open auction through the auction's host relay. A bid is signed by the bidder (including an
  explicit acceptance of that host for that auction) and carries a visible amount and an optional proxy maximum encrypted to
  the host. The host serializes all bids of an auction under a per-auction lease, assigns a strictly increasing sequence number
  and its own time, applies English ascending and proxy rules against the bid increment table, and returns a host-signed bid
  receipt that links to the previous entry by hash. Bidders keep their receipts as evidence. The host is trusted for order and
  time and is named in the UI; the module never claims the order is verifiable beyond the receipt chain the bidders hold.
responsibilities:
  - Own the Bid record - on the host as the authoritative ledger entry, in the bidder vault as the bidder's copy of the signed bid and receipt.
  - Validate each bid in a fixed order - host acceptance, signature, auction state and host time, minimum bid, eligibility from F04.S02.M01, rate limits - and apply proxy resolution deterministically.
  - Maintain a hash-chained bid ledger per auction (hash of seq, alias, amount, kind, host time and previous hash) and return host-signed receipts so bidders can detect omission or reordering.
  - Apply retraction rules - more than 12 h before the current end, at most 1 retraction per bidder per auction, only of the bidder's current leading bid - and recompute the leader and price.
non_responsibilities:
  - Auction terms, hosting acceptance and opening (F04.S01.M01) and closing and winner determination (F04.S01.M03).
  - Soft-close extension decisions (F04.S02.M02) and shill scoring (F04.S02.M01); this module only calls them inside the bid transaction.
  - Payment, delivery and disputes (F09).
  - Distributed bidding across multiple hosts; one auction has exactly one host.
  - "Future: sealed maxima using threshold encryption so the host cannot read proxy maxima, and bid bots disclosure."
depends_on: [F04.S01.M01, F04.S02.M01, F04.S02.M02, F07.S01.M01, F11.S01.M03, F09.S03.M01, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-MNY-001, CTR-PRV-001, CTR-FED-001]
user_stories:
  - As a bidder, I see the host and its trust panel, accept the host for this auction, and place a bid at or above the next minimum.
  - As a bidder, I set a maximum and the host bids for me in increments only as far as needed, and I see my receipt for every bid.
  - As a bidder, I retract my leading bid more than 12 hours before the end, once per auction, and see the price fall to the next bidder's level.
  - As any viewer, I see the bid history by auction-specific alias with host times, not by account keys.
edge_cases:
  - Two bidders submit the same amount within the same millisecond; the host lease orders them by arrival at the lease, the first gets the lead and the second is recorded outbid at the tied amount.
  - A bid arrives at host time exactly equal to currentEndsAt; it is refused (the end is exclusive) with AUCTIONS_NOT_OPEN.
  - Bidder's network drops after sending; the receipt is lost; on reconnect the bidder fetches the receipt by bid cid and the UI shows submitted until the receipt is held.
  - Bidder raises their max while leading; allowed, price unchanged; lowering a max is refused with AUCTIONS_MAX_DECREASE.
  - Bid amount is below the minimum because a faster bid arrived; refused with AUCTIONS_BID_TOO_LOW and params.minNextBid so the UI offers the new minimum.
  - Seller or a linked key tries to bid; the answer is the generic AUCTIONS_BIDDER_NOT_ELIGIBLE with no linkage detail.
  - Retraction is requested 11 h 59 min before the end by host time; refused with AUCTIONS_RETRACT_NOT_ALLOWED.
  - Host relay becomes unreachable; bidding is disabled with a clear message (no offline queue, because order and time are decided by the host).
  - Proxy resolution reaches a currency exponent boundary (JPY); increments are whole yen and proxy prices never fall between minor units.
ux:
  screens:
    - "Bid sheet: next minimum bid, bid amount field, optional maximum, host acceptance checkbox naming the host and its power, Place bid button with the exact amount."
    - "Bid history: alias, amount, host time, kind (bid, proxy raise, retraction), and the user's own receipts with verify chain action."
    - "My bids: status per auction (leading, outbid, retracted, won, lost) and receipt fingerprints."
  states: [loading, host-unreachable, not-open, eligible, submitting, leading, outbid, rejected, retracted, won, lost]
  a11y:
    - Bid amount and maximum fields have visible labels with currency and inputmode=decimal; the next minimum is in the label text.
    - Bid outcome (leading, outbid, rejected with reason) is announced through an aria-live assertive region once per submission.
    - Place bid and Retract buttons are at least 44x44 px with accessible names including the amount and the auction title.
processes:
  domain_schema:
    requirements:
      - A Bid stores auction, terms cid, bidder, alias, kind, visible amount, optional proxy maximum, host sequence and time, ledger hashes, receipt and status, with revision per CTR-ID-001.
      - Bid records are P3 because the proxy maximum is secret; public projections show only alias, amount, kind and host time, and the maximum exists in plaintext only on the bidder vault and the host.
      - The visible amount and sequence are immutable once the host has assigned them; a change is a new bid or a retraction entry.
    entities:
      - name: Bid
        schema: classrup.auctions.bid/v1
        storage: relay+device
        privacy: P3
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key, generated by the bidder vault (auto entries by the host)"
          - "tenantId: uuidv7 — host relay tenant scope"
          - "auctionId: uuidv7 — ref F04.S01.M01 Auction"
          - "termsCid: string — sha256- cid of the auction terms the bid was made against"
          - "bidderId: actorId — did:key of the bidder; host and bidder vault only"
          - "alias: string — 6 characters base32, HMAC of bidderId under a per-auction host secret; stable within one auction"
          - "kind: enum — manual | proxy | auto | retraction"
          - "amount: Money — visible amount; CTR-MNY-001; > 0; ≤ 1 000 000 000 000 minor units"
          - "maxAmount?: Money — P3 proxy maximum, >= amount, same currency; encrypted to the host key in transit"
          - "hostAck: object — {auctionTermsCid, hostKeyId, acceptedAtClaim}; signed inside the bid by the bidder"
          - "clientNonce: string — 16 random bytes base64url; unique per bidder and auction"
          - "seq?: int — host sequence >= 1, strictly increasing per auction"
          - "hostTime?: timestamp — host clock, non-decreasing, RFC 3339 UTC"
          - "prevHash?: string — hash of the previous ledger entry"
          - "hash?: string — sha256- over JCS of {seq, auctionId, alias, kind, amount, hostTime, prevHash}"
          - "receiptCid?: string — cid of the host-signed bid receipt"
          - "status: enum — submitted | winning | outbid | retracted | rejected | won | lost | void"
          - "rejectCode?: string — module error code when rejected"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - seq values of one auction are consecutive starting at 1 with no gaps, and hashes form an unbroken chain.
          - At most one Bid per auction has status winning.
          - maxAmount is never present in any event, public projection, export of another user, log or error.
          - A bid with status winning has amount equal to the auction currentPrice.
    sql: |
      CREATE TABLE auctions_bid (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, auction_id TEXT NOT NULL, bidder_id TEXT NOT NULL, kind TEXT NOT NULL,
        amount_minor TEXT NOT NULL, seq INTEGER NOT NULL, host_time TEXT NOT NULL, status TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX auctions_bid_seq ON auctions_bid(tenant_id, auction_id, seq);
      CREATE UNIQUE INDEX auctions_bid_nonce ON auctions_bid(tenant_id, auction_id, bidder_id, json_extract(data,'$.clientNonce'));
      CREATE TABLE auctions_lease (auction_id TEXT PRIMARY KEY, holder TEXT NOT NULL, fence INTEGER NOT NULL, expires_at TEXT NOT NULL);
  validation_rules:
    requirements:
      - Bids are validated by the host in a fixed order - schema, signature, host acceptance, replay nonce, auction state and host time, minimum, eligibility, rate limits - and the first failure decides the error.
      - The bidder vault performs the same checks it can (schema, host acceptance, minimum from the last known state) before sending, but only the host decision counts.
      - Every violation maps to one stable error code; eligibility failures never reveal the linkage that caused them.
    rules:
      - "V01 | bid contains hostAck naming this auction termsCid and the host key | AUCTIONS_HOST_NOT_ACCEPTED"
      - "V02 | bid signature verifies against bidderId and clientNonce was not seen for this bidder and auction | VALIDATION_FAILED"
      - "V03 | auction status is open and host time is before currentEndsAt | AUCTIONS_NOT_OPEN"
      - "V04 | amount is at least startPrice when no bid exists, otherwise currentPrice plus the increment of the tier containing currentPrice | AUCTIONS_BID_TOO_LOW"
      - "V05 | maxAmount, when present, is at least amount, in the auction currency and within limits | VALIDATION_FAILED"
      - "V06 | a new maxAmount for a bidder who already has a maximum is not lower than it | AUCTIONS_MAX_DECREASE"
      - "V07 | F04.S02.M01 check returns allow for the bidder | AUCTIONS_BIDDER_NOT_ELIGIBLE"
      - "V08 | bidder has at most 10 bids per minute and 200 bids on this auction, and the auction has at most 5 000 entries | AUCTIONS_BID_LIMIT"
      - "V09 | retraction is requested more than 12 hours before currentEndsAt, is the bidder's first retraction on this auction, and targets the bidder's winning bid | AUCTIONS_RETRACT_NOT_ALLOWED"
  workflow_state_machine:
    requirements:
      - Bids follow submitted, then winning or outbid or rejected, with retraction only from winning and final states won, lost, retracted, rejected and void.
      - Leader changes are decided only inside the per-auction lease by the deterministic proxy algorithm, so replaying the ledger always reproduces the same prices.
      - A retraction of the leader promotes the highest remaining maximum to leader at a recomputed price, using the same algorithm.
    machines:
      - entity: Bid
        initial: submitted
        terminal: [won, lost, retracted, rejected, void]
        transitions:
          - "submitted -> winning | host places the bid as leader | proxy algorithm leaves this bidder leading; emits auctions.bid.placed"
          - "submitted -> outbid | host places the bid but a higher maximum leads | emits auctions.bid.placed and auctions.bid.outbid"
          - "submitted -> rejected | host validation failure | rejectCode stored; no ledger entry"
          - "winning -> outbid | later bid or proxy raise overtakes | emits auctions.bid.outbid"
          - "winning -> retracted | auctions.bid.retract accepted | retraction rules satisfied; emits auctions.bid.retracted"
          - "outbid -> winning | leader retracted and this bidder holds the highest remaining maximum | recomputed price"
          - "winning -> won | auctions.auction.closed consumed and result names this bid | host-signed result"
          - "outbid -> lost | auctions.auction.closed consumed | auction closed without this bid winning"
          - "submitted -> void | auctions.auction.cancelled consumed | auction cancelled"
          - "winning -> void | auctions.auction.cancelled consumed | auction cancelled"
          - "outbid -> void | auctions.auction.cancelled consumed | auction cancelled"
    timeouts:
      - "A bid in submitted state with no host receipt for 60 s shows needs attention and the vault fetches the receipt by bid cid at 5 s, 15 s and 45 s; the host keeps a 24 h idempotency record per clientNonce."
  commands_queries_events:
    requirements:
      - The bidder vault command auctions.bid.submit signs the bid and sends it to the host; the host relay command auctions.bid.place validates, orders and receipts it; retraction mirrors this pair.
      - Bid events are host-local events and are derived in participant vaults when the host-signed receipt or result arrives (actor.kind federated); max amounts are never in any event.
      - Bidding has no offline queue; time and order are decided by the host.
    commands:
      - name: auctions.bid.submit
        capability: auctions.bid.submit
        input: "[vault command plus statement classrup.auctions.bid/v1 signed by bidder, maxAmount encrypted to host key, sent to host] { auctionId, amount, maxAmount?, acceptHostKeyId }"
        output: "{ bidId, status: submitted, receipt?: host-signed bid_receipt, minNextBid }"
        errors: [NOT_FOUND, VALIDATION_FAILED, AUCTIONS_HOST_NOT_ACCEPTED, AUCTIONS_NOT_OPEN, AUCTIONS_BID_TOO_LOW, AUCTIONS_MAX_DECREASE, AUCTIONS_BIDDER_NOT_ELIGIBLE, AUCTIONS_BID_LIMIT, DEPENDENCY_UNAVAILABLE, RATE_LIMITED]
        emits: []
        idempotent: true
      - name: auctions.bid.place
        capability: auctions.bid.place
        input: "[relay command at the host, authorized by the bidder-signed bid] { bidEnvelope }"
        output: "{ receipt: statement classrup.auctions.bid_receipt/v1 signed by host key {bidCid, seq, hostTime, currentPrice, leaderAlias, reserveMet, currentEndsAt, prevHash, hash}, minNextBid }"
        errors: [VALIDATION_FAILED, AUCTIONS_HOST_NOT_ACCEPTED, AUCTIONS_NOT_OPEN, AUCTIONS_BID_TOO_LOW, AUCTIONS_MAX_DECREASE, AUCTIONS_BIDDER_NOT_ELIGIBLE, AUCTIONS_BID_LIMIT, RATE_LIMITED, DEPENDENCY_UNAVAILABLE]
        emits: [auctions.bid.placed, auctions.bid.outbid]
        idempotent: true
      - name: auctions.bid.retract
        capability: auctions.bid.retract
        input: "[vault command plus statement classrup.auctions.bid_retraction/v1 signed by bidder, sent to host; host executes under the lease] { auctionId, bidId, reason }"
        output: "{ receipt: host-signed retraction receipt, newPrice, newLeaderAlias? }"
        errors: [NOT_FOUND, CONFLICT_STATE, AUCTIONS_RETRACT_NOT_ALLOWED, AUCTIONS_NOT_OPEN, DEPENDENCY_UNAVAILABLE]
        emits: [auctions.bid.retracted]
        idempotent: true
    queries:
      - name: auctions.bid.list_for_auction
        capability: auctions.bid.read_public
        input: "{ auctionId, cursor?, limit ≤ 100 } (relay query or vault cache of host-signed ledger)"
        output: "{ items: [{ seq, alias, amount, kind, hostTime, hash }], head: { seq, hash }, nextCursor? } — no bidder keys and no maxima"
        errors: [NOT_FOUND]
      - name: auctions.bid.list_mine
        capability: auctions.bid.read_own
        input: "[vault-local] { status?, cursor?, limit ≤ 50 }"
        output: "{ items: Bid[] with receipts and own maxima, nextCursor? }"
        errors: []
      - name: auctions.bid.verify_ledger
        capability: auctions.bid.read_own
        input: "[vault-local] { auctionId }"
        output: "{ ok: boolean, firstBrokenSeq?, receiptsChecked }"
        errors: [NOT_FOUND]
    events_produced:
      - {type: auctions.bid.placed, privacy: P2, payload: "{ auctionId, bidId, alias, bidderId, amount, newPrice, seq, leaderChanged, reserveMet, hostTime }"}
      - {type: auctions.bid.outbid, privacy: P2, payload: "{ auctionId, outbidBidId, outbidderId, newPrice, seq }"}
      - {type: auctions.bid.retracted, privacy: P2, payload: "{ auctionId, bidId, alias, newPrice, newLeaderAlias?, seq, hostTime }"}
    events_consumed:
      - {type: auctions.auction.opened, effect: "enable bidding for the auction in the vault view and on the host"}
      - {type: auctions.auction.closed, effect: "mark winning bid won and remaining non-retracted bids lost"}
      - {type: auctions.auction.cancelled, effect: "mark live bids void"}
      - {type: auctions.auction.extended, effect: "update currentEndsAt shown in the bid sheet and in my bids"}
    errors:
      - "AUCTIONS_HOST_NOT_ACCEPTED | 409 | no | the bid does not carry the bidder's acceptance of this auction's host"
      - "AUCTIONS_NOT_OPEN | 409 | no | auction is not open at host time (not started, closed or past its end)"
      - "AUCTIONS_BID_TOO_LOW | 409 | no | amount is below the next minimum bid; params.minNextBid gives it"
      - "AUCTIONS_MAX_DECREASE | 409 | no | a proxy maximum cannot be lowered"
      - "AUCTIONS_BIDDER_NOT_ELIGIBLE | 403 | no | bidder cannot bid on this auction; no reason is disclosed"
      - "AUCTIONS_BID_LIMIT | 409 | no | per-bidder or per-auction bid limit reached"
      - "AUCTIONS_RETRACT_NOT_ALLOWED | 409 | no | retraction window, count or target rule not satisfied"
    example: |
      bidder vault: auctions.bid.submit { "auctionId": "0192f400-0002-…", "amount": { "amount": "1050", "currency": "EUR" },
        "maxAmount": { "amount": "3000", "currency": "EUR" }, "acceptHostKeyId": "ed25519:hostkey1" }
      host: -> receipt { "bidCid": "sha256-Bc…", "seq": 3, "hostTime": "2026-11-05T12:00:01.204Z", "currentPrice": { "amount": "1050", "currency": "EUR" },
        "leaderAlias": "K3QZ7A", "reserveMet": false, "currentEndsAt": "2026-11-12T10:00:00.000Z", "prevHash": "sha256-Pa…", "hash": "sha256-Hh…" }
      later another bidder bids 1100 with max 1500 -> proxy raises this bidder to 1150 (1100 + 50 increment) and the other is outbid at 1100
  authorization_capabilities:
    requirements:
      - Vault policy - only the unlocked local principal can sign bids and retractions for its own key; no one can bid on behalf of another key.
      - Relay policy - the host accepts a bid only when the bid signature verifies against the bidder key inside it, the host acceptance names this host, and hosting policy and quotas allow it; no relay access token substitutes for the bidder signature.
      - Public ledger reads expose aliases only; the seller learns the bidder key of the winner only through the host-signed result.
    capabilities:
      - "auctions.bid.submit | principal | local principal is not the seller; host accepted for this auction by explicit user action; online"
      - "auctions.bid.place | host-operator, system | bid signature verifies; host acceptance matches; relay quotas satisfied"
      - "auctions.bid.retract | principal | bid.bidderId = local principal; retraction rules satisfied"
      - "auctions.bid.read_public | anonymous, principal | ledger projection with aliases only"
      - "auctions.bid.read_own | principal | bid.bidderId = local principal"
  failure_recovery_idempotency:
    requirements:
      - Bids are idempotent by (bidder, auction, clientNonce) for 24 h on the host; replays return the original receipt.
      - All bids of one auction are serialized by the per-auction lease (IDM-8) with a fencing token; ledger append, price projection and soft-close decision commit in one SQLite transaction.
      - A crash before commit leaves no ledger entry and no receipt; a crash after commit and before reply is repaired by receipt fetch.
    idempotency: "Host stores (bidderId, auctionId, clientNonce) -> receiptCid for 24 h; replay with the same body returns the same receipt; a different body with the same nonce returns IDEMPOTENCY_KEY_REUSED."
    concurrency: "Lease row auctions_lease with fencing token, TTL 5 s, taken with BEGIN IMMEDIATE; a holder that exceeds TTL loses the lease and its fence token is refused by later writes; the unique index on (auction, seq) prevents duplicate sequence numbers even under a bug."
    retries: "Bidder vault retries only network errors and RATE_LIMITED with the same nonce at 1 s, 2 s, 4 s up to 3 attempts; business rejections are never retried; the receipt-fetch fallback runs at 5 s, 15 s and 45 s."
    offline: "Bidding and retraction are disabled offline with a visible reason because order and time are decided by the host; viewing history and verifying held receipts works offline."
    partial_failure: "If the soft-close port (F04.S02.M02) or the eligibility port (F04.S02.M01) fails, the bid is rejected with DEPENDENCY_UNAVAILABLE and nothing is stored; the bid transaction is atomic."
  privacy_retention_abuse:
    requirements:
      - Proxy maxima and bidder keys never appear in events, public projections, logs, errors or other users' exports; the host holds them in plaintext and the UI says so.
      - Aliases are stable only within one auction and derived under a per-auction host secret, so they cannot be linked across auctions; this is pseudonymity, not anonymity, because the host sees keys.
      - Bid spam, probing of proxy maxima and rapid retract abuse are limited by increments, rate limits, a single retraction and host quotas.
    data:
      - "Bid: P3 (maxAmount, bidderId, nonce); public projection P0 (alias, amount, kind, host time, hash)."
      - "Bid receipt: P2 signed statement held by the bidder."
    retention:
      - "Bids and receipts: RET-EVIDENCE (2 years) in the bidder vault; the host keeps the ledger for its published retention, default 90 days after close."
    threats:
      - "T01 | Host reorders, omits or inserts bids | hash-chained ledger and host-signed receipts; bidders verify their own receipts against the public chain and publish evidence; trust in the host remains and is disclosed"
      - "T02 | Probing for a proxy maximum by incremental bids | each probe is a real bid at a real increment, per-minute and per-auction bid limits, shill heuristics flag probe patterns"
      - "T03 | Replay of a captured bid | clientNonce uniqueness per bidder and auction, host acceptance bound to terms cid, 24 h idempotency record"
      - "T04 | Retract-and-rebid to manipulate price | one retraction per bidder per auction, 12 h cutoff, retraction only of the leading bid, recorded in the ledger"
      - "T05 | Alias deanonymization across auctions | per-auction HMAC secret held by the host; documented that the host can link keys"
    abuse_controls:
      - "10 bids per minute per bidder per auction and 200 per auction; host-wide relay quota per key."
      - "Probe and retract patterns are passed to F04.S02.M01 scoring via the bid.placed event on the host."
  observability_performance:
    requirements:
      - The PWA sends no telemetry (OBS-7); the host relay exports metrics and logs per OBS-1 to OBS-6, without maxima or keys.
      - Bid placement meets p95 ≤ 150 ms on the host at 50 bids per second across 500 auctions, and p99 ≤ 400 ms for one hot auction at 20 bids per second.
      - Ledger verification of 5 000 entries in the vault completes in ≤ 500 ms.
    metrics:
      - "classrup_auctions_bids_total{outcome=placed|rejected|retracted,code} (host)"
      - "classrup_auctions_bid_lease_wait_ms (host histogram)"
      - "classrup_auctions_bid_lease_expired_total (host)"
      - "classrup_auctions_ledger_verify_failures_total (vault local counter)"
    logs:
      - "info bid.placed {auctionId, seq, correlationId} on the host - no bidder key, no amount, no maximum."
    budgets:
      - "host bid placement p95 ≤ 150 ms at 50 req/s; hot auction p99 ≤ 400 ms at 20 req/s; lease wait p95 ≤ 50 ms."
      - "public ledger page of 100 entries p95 ≤ 100 ms; vault verification of 5 000 entries ≤ 500 ms."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - The proxy algorithm is covered by property tests on random bid sequences with a reference model, and the ledger by replay tests.
      - Concurrency is covered by deterministic tests with an injected clock and lease, including expiry and fencing.
    fixtures: "Host H with injectable clock and default-v1 increments; auction A (EUR, start 10.00, reserve 50.00, ends 2026-11-12T10:00:00Z); bidders B1, B2, B3 and seller S with separate keys; fixed clock 2026-11-05T12:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R03,02.R01,02.R03 | place valid bid and read ledger entry | seq 1, hash chain starts with genesis, amount immutable, receipt signature verifies"
      - "T02 | unit | 02.R02,02.R03 | each rule V01–V09 violated in turn | documented code returned, no ledger entry, no maximum echoed"
      - "T03 | property | 03.R02 | random bid and retraction sequences compared with the reference proxy model | price, leader and aliases equal the model; replaying the ledger reproduces the same result"
      - "T04 | unit | 03.R03 | leader with max 100 retracts, second bidder has max 60, third max 40 | second becomes winning at 40 plus increment capped at 60; hashes stay chained"
      - "T05 | property | 03.R01 | random command sequences on one bid | only declared transitions succeed; terminal states never change"
      - "T06 | integration | 06.R02,04.R02 | 20 bids submitted concurrently from 20 vaults to one auction | seq 1..20 without gaps or duplicates, one winning, lease wait metric recorded"
      - "T07 | chaos | 06.R02,06.R03,09.R03 | lease expires mid-transaction; process killed before reply | stale fence refused; no half-written entry; receipt fetch by bid cid succeeds"
      - "T08 | contract | 04.R01,04.R03,09.R02 | submit, place, retract and queries | statements, events and projections validate against registry schemas; projection has no key and no maximum"
      - "T09 | integration | 04.R03,06.R01 | replay same bid body and replay same nonce with different body | original receipt; IDEMPOTENCY_KEY_REUSED"
      - "T10 | abuse | 05.R01,05.R02,05.R03 | bid signed by another key; bid without host acceptance; public query | VALIDATION_FAILED or AUCTIONS_HOST_NOT_ACCEPTED; public data contains aliases only"
      - "T11 | abuse | 07.R01,07.R02,07.R03 | 11 bids in a minute; probing pattern of 5 minimum raises against one leader; seller bids | 11th AUCTIONS_BID_LIMIT; probing passed to scoring; seller AUCTIONS_BIDDER_NOT_ELIGIBLE with no detail"
      - "T12 | integration | 01.R02,07.R01 | inspect events, logs, errors, exports of other users | no maximum and no bidder key anywhere outside bidder vault and host"
      - "T13 | load | 08.R01,08.R02,08.R03 | 500 auctions at 50 bids per second and one hot auction at 20 per second for 5 minutes | p95 ≤ 150 ms, hot p99 ≤ 400 ms, ledger verify 5 000 entries ≤ 500 ms"
      - "T14 | unit | 09.R01 | traceability tool run | every PS-033 requirement maps to a passing test"
      - "T15 | integration | 10.R01,10.R02,10.R03 | export bidder vault, import into fresh vault, verify ledger against held receipts | receipts round-trip; verify_ledger ok; tampered receipt detected at its seq"
      - "T16 | e2e | 01.R02 | mobile bidder accepts host, bids with max, is outbid by proxy, retracts a leading bid on another auction | UI statuses correct; axe zero serious issues; offline shows bidding disabled"
    acceptance:
      - All tests T01–T16 pass in CI.
      - The proxy algorithm matches the reference model on 100 000 random sequences and ledger replay reproduces every price.
      - No proxy maximum or bidder key is visible to any party other than the bidder and the host.
  import_export_backup_rollback:
    requirements:
      - The bidder's vault export contains their bids, receipts and own maxima; it does not contain other bidders' data.
      - Import verifies receipt signatures and chain hashes against the stored host key; failures are kept as read-only history with a warning.
      - Schema changes follow expand and contract and keep v1 readable for 180 days.
    export: "Section auctions.bids in classrup-export/v1; one line per own Bid with receipt envelopes; the host's ledger export for sellers contains aliases and amounts only."
    import: "Closed-auction bids import as history; bids on auctions still open import read-only until the host confirms its state; no bid is ever re-sent on import."
    backup: "The vault export is the primary backup (IOX-6); the host uses relay SQLite backup (IOX-3, IOX-7) and restoring it must keep the hash chain intact, verified by a post-restore chain check."
    migration_rollback: "Additive optional fields only in v1; the ledger hash input is frozen for v1 so rollback never breaks chain verification."
