id: F04.S01.M01
scope: MVP
summary: >-
  English ascending auctions on a listing, run only on a host relay that the seller chooses and that every bidder explicitly
  accepts at bid time (ADR-0016 section 6). The seller drafts the auction in the local vault (start price, hidden reserve,
  bid increment table, start and end 1 h to 14 d) and signs the terms; the chosen host relay countersigns a hosting acceptance
  and becomes the authority for bid order, time, soft close and close. The hidden reserve is committed by hash in the public
  terms and known only to the seller and the host. With no host selected, or a host that refuses or is unreachable, the
  auction feature is disabled for that auction and fails closed. The host is trusted for ordering and time and the UI says so.
responsibilities:
  - Own the Auction record in the seller vault (draft) and on the host relay (authoritative once scheduled), and the statements auction_terms (classrup.auctions.auction/v1), host_acceptance and auction_cancel.
  - Validate terms - currency, start price, reserve commitment, increment table, duration 1 h to 14 d, start within 30 days - and refuse to schedule without a selected host (AUCTIONS_HOST_REQUIRED).
  - Open scheduled auctions at the host-clock start time, keep currentEndsAt and price projections used by bids, and publish a public P0 projection that never contains the reserve, bidder identities or max bids.
  - Allow cancellation by the seller only while the auction has zero bids, and by the host operator under hosting policy with a stated reason.
non_responsibilities:
  - Placing and ordering bids and proxy logic (F04.S01.M02) and closing and result (F04.S01.M03).
  - Soft-close extensions (F04.S02.M02), shill controls (F04.S02.M01) and fraud review (F04.S02.M03).
  - Listing content and media (F01.S01.M01); the auction references one auction-subtype listing.
  - Payment and receipts (F09); winners and sellers settle through a local Deal in each vault.
  - "Future: Dutch and sealed-bid auctions, federated hosts that share one auction, and buy-it-now."
depends_on: [F01.S01.M01, F01.S01.M03, F09.S03.M01, F11.S01.M03, F07.S01.M01, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-MNY-001, CTR-PRV-001, CTR-FED-001, CTR-FLG-001]
user_stories:
  - As a seller, I choose a host relay, see its name, operator policy and what it can and cannot do, set start price, hidden reserve and duration, and schedule the auction once the host countersigns.
  - As a bidder, I see the host named on the auction, whether the reserve has been met (not its value), the next minimum bid and the end time with soft-close rules.
  - As a seller with no bids, I can cancel; once a bid exists I cannot.
edge_cases:
  - No host relay selected; schedule is refused with AUCTIONS_HOST_REQUIRED and the screen explains that auctions need a host the seller and bidders choose.
  - Host relay refuses or does not answer within 60 s; the auction stays proposed, expires after 24 h as cancelled with reason host_unreachable, and the seller may choose another host.
  - Seller edits the listing price or description after the first bid; the signed terms cid no longer matches, bids stay valid on the original terms, and the public page shows a notice that the listing changed after bidding.
  - Reserve equals start price; allowed, and the reserve is shown as met after the first bid.
  - Start time is in the past by the host clock; refused with VALIDATION_FAILED, never silently moved.
  - Seller device clock is hours off; terms times are claims, the host stores its own receipt time and rejects terms whose start is more than 5 minutes before the host clock.
  - Currency exponent is 0 (JPY) or 3 (BHD); the default increment table is converted by ceiling to at least one minor unit.
  - Host operator removes the auction by hosting policy while it has bids; the auction stays visible to bidders as removed by host with a reason, and the case goes to F04.S02.M03 review.
ux:
  screens:
    - "Auction setup: listing picker, host relay picker with trust panel (operator name, region, policy link, retention, what the host can see), start price, hidden reserve (optional), duration chips (1 h, 24 h, 3 d, 7 d, 14 d), start now or schedule, increment table preview."
    - "Auction page: current price, next minimum bid, time left from host-signed time, reserve status (no reserve, reserve not met, reserve met), host panel, bid count, soft-close note."
    - "Seller dashboard: auctions by state with host sync line (prepared, delivered to host, accepted by host)."
  states: [loading, empty, draft, proposed, scheduled, open, closed, cancelled, host-required, host-unreachable, pending-offline]
  a11y:
    - Money fields have visible labels including currency and use inputmode=decimal.
    - Time left is text in an aria-live polite region updated at most once per 10 s, and the final minute announces once per 15 s.
    - Host trust panel is reachable by keyboard before the first bid and its text states host power in plain words.
processes:
  domain_schema:
    requirements:
      - An Auction stores listing, seller, host relay identity and key, currency, start price, reserve commitment, increment table, schedule, extension counters, price projection and status, with revision per CTR-ID-001.
      - The reserve value is P3, stored only in the seller vault and, encrypted to the host key, on the host relay; public terms and events carry only the salted hash commitment and a reserveMet flag.
      - Money is integer minor units per CTR-MNY-001; increments are computed from a tiered table in major-unit templates converted with ceiling to the currency exponent.
    entities:
      - name: Auction
        schema: classrup.auctions.auction/v1
        storage: relay+device
        privacy: P3
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key, generated by the seller vault"
          - "tenantId: uuidv7 — host relay tenant scope"
          - "listingId: uuidv7 — ref F01.S01.M01 Listing of subtype auction; published"
          - "sellerId: actorId — did:key of the seller; signs terms"
          - "hostRelayId: string — identifier of the selected host relay; required"
          - "hostKeyId: string — Ed25519 key of the host used to verify receipts and results"
          - "currency: string — registered ISO 4217 code (F09.S03.M01)"
          - "startPrice: Money — CTR-MNY-001; > 0; ≤ 1 000 000 000 000 minor units"
          - "reserveCommitment?: string — sha256- hash over reserve minor units and a 16-byte salt"
          - "reservePrice?: Money — P3; seller vault and host only; ≥ startPrice"
          - "incrementTable: Tier[] — 1..8 tiers {fromMinor, incrementMinor}; default-v1 when omitted; strictly increasing fromMinor, non-decreasing increments, each increment ≥ 1 minor unit and ≤ 20 percent of fromMinor (first tier ≤ startPrice)"
          - "startsAt: timestamp — host clock, RFC 3339 UTC, between now and now plus 30 days"
          - "scheduledEndsAt: timestamp — startsAt plus 1 h..14 d"
          - "currentEndsAt: timestamp — scheduledEndsAt plus extensions, at most scheduledEndsAt plus 60 minutes"
          - "extensionCount: int — 0..30, owned by F04.S02.M02"
          - "currentPrice?: Money — projection of the leading amount; absent before the first bid"
          - "bidCount: int — projection >= 0"
          - "reserveMet: boolean — projection; true when currentPrice >= reservePrice or no reserve"
          - "termsCid: string — sha256- cid of the signed auction terms"
          - "hostAcceptanceCid?: string — cid of the host_acceptance statement"
          - "status: enum — draft | proposed | scheduled | open | closed | cancelled"
          - "cancelReason?: enum — seller | host_unreachable | host_refused | host_policy | listing_unavailable"
          - "syncState: map — {host: prepared | transport_acknowledged | peer_accepted}"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
        invariants:
          - status scheduled or later implies hostRelayId, hostKeyId, termsCid and hostAcceptanceCid are set and verified.
          - reservePrice never appears in any event payload, public projection, log or export other than the seller's own.
          - currentEndsAt is at least scheduledEndsAt and at most scheduledEndsAt plus 60 minutes.
          - A cancelled auction has bidCount 0 unless cancelReason is host_policy or listing_unavailable.
    sql: |
      CREATE TABLE auctions_auction (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, listing_id TEXT NOT NULL, seller_id TEXT NOT NULL, host_relay_id TEXT NOT NULL,
        currency TEXT NOT NULL, start_price_minor TEXT NOT NULL, starts_at TEXT NOT NULL, current_ends_at TEXT NOT NULL,
        status TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE INDEX auctions_auction_due ON auctions_auction(status, starts_at, current_ends_at);
      CREATE UNIQUE INDEX auctions_auction_listing ON auctions_auction(tenant_id, listing_id) WHERE status IN ('proposed','scheduled','open');
  validation_rules:
    requirements:
      - Terms are validated strictly in the seller vault before signing and again by the host relay before countersigning.
      - The host never accepts terms that fail the same rules, whatever the seller vault claims.
      - Every violation maps to one stable error code with a localized message key; the reserve value is never echoed in an error.
    rules:
      - "V01 | hostRelayId and hostKeyId are present and the host is in the seller's selected relay list | AUCTIONS_HOST_REQUIRED"
      - "V02 | currency is registered and startPrice is a positive integer string within limits | VALIDATION_FAILED"
      - "V03 | reservePrice, when present, is at least startPrice, in the same currency, and its salted hash equals reserveCommitment | AUCTIONS_RESERVE_INVALID"
      - "V04 | duration is between 1 hour and 14 days and startsAt is within 30 days and not earlier than host now minus 5 minutes | AUCTIONS_SCHEDULE_INVALID"
      - "V05 | incrementTable satisfies the tier rules in the Auction field definition | AUCTIONS_INCREMENT_INVALID"
      - "V06 | listing is published, of subtype auction, owned by the seller, and has no live auction | AUCTIONS_LISTING_NOT_ELIGIBLE"
      - "V07 | seller has fewer than 20 live auctions on this host and the host hosting policy accepts the seller | AUCTIONS_SELLER_LIMIT"
      - "V08 | cancel is requested only while bidCount is 0 (seller) | AUCTIONS_HAS_BIDS"
  workflow_state_machine:
    requirements:
      - Auctions follow draft, proposed, scheduled, open, closed with cancelled as an exit before close; closed and cancelled are terminal.
      - Scheduled requires the host's verified countersignature; no host acceptance means no auction.
      - Opening, end adjustment and closing are host-clock decisions; the seller vault shows them only after receiving the host-signed statements.
    machines:
      - entity: Auction
        initial: draft
        terminal: [closed, cancelled]
        transitions:
          - "draft -> proposed | auctions.auction.schedule by seller | terms signed and sent to the chosen host; host required"
          - "draft -> cancelled | auctions.auction.cancel by seller | local discard"
          - "proposed -> scheduled | host_acceptance received and verified | host rules passed; emits auctions.auction.scheduled"
          - "proposed -> cancelled | host refusal or no answer for 24 h | cancelReason host_refused or host_unreachable; emits auctions.auction.cancelled"
          - "scheduled -> open | host timer at startsAt | emits auctions.auction.opened"
          - "scheduled -> cancelled | seller cancel or listing unavailable | emits auctions.auction.cancelled"
          - "open -> closed | auctions.auction.mark_closed called by F04.S01.M03 under the close lease | currentEndsAt reached"
          - "open -> cancelled | seller cancel with zero bids, or host policy removal | emits auctions.auction.cancelled"
    timeouts:
      - "Host timer checks scheduled auctions every 5 s and opens those with startsAt <= host now; proposed auctions with no host answer for 24 h are cancelled by the seller vault sweep that runs at app start and every 60 s while open."
  commands_queries_events:
    requirements:
      - Vault commands create, schedule and cancel the seller's auction; schedule and cancel produce signed statements to the host; the host relay offers accept_hosting, open, adjust_end and mark_closed as relay commands.
      - Auction events exist on the host as relay-local events and are derived again in each participant vault when the host-signed statement arrives (actor.kind federated); they never leave a device otherwise.
      - The module consumes listing events to cancel auctions whose listing becomes unavailable.
    commands:
      - name: auctions.auction.create
        capability: auctions.auction.create
        input: "[vault-local] { listingId, hostRelayId, currency, startPrice, reservePrice?, incrementTable?, startsAt, durationMs }"
        output: "{ auctionId, revision: 1, status: draft, reserveCommitment? }"
        errors: [VALIDATION_FAILED, AUCTIONS_HOST_REQUIRED, AUCTIONS_RESERVE_INVALID, AUCTIONS_SCHEDULE_INVALID, AUCTIONS_INCREMENT_INVALID, AUCTIONS_LISTING_NOT_ELIGIBLE, FEATURE_DISABLED]
        emits: []
        idempotent: true
      - name: auctions.auction.schedule
        capability: auctions.auction.schedule
        input: "[vault-local plus statement classrup.auctions.auction/v1 terms signed by seller, sent to the host; reserve encrypted to the host key] { auctionId, expectedRevision }"
        output: "{ auctionId, revision, termsCid, syncState }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, AUCTIONS_HOST_REQUIRED, DEPENDENCY_UNAVAILABLE, FEATURE_DISABLED]
        emits: []
        idempotent: true
      - name: auctions.auction.accept_hosting
        capability: auctions.auction.host_accept
        input: "[relay command, authorized by the seller's signed terms] { termsEnvelope }"
        output: "{ hostAcceptance: statement classrup.auctions.host_acceptance/v1 signed by host key, hostTime }"
        errors: [VALIDATION_FAILED, AUCTIONS_RESERVE_INVALID, AUCTIONS_SCHEDULE_INVALID, AUCTIONS_INCREMENT_INVALID, AUCTIONS_LISTING_NOT_ELIGIBLE, AUCTIONS_SELLER_LIMIT, FORBIDDEN, RATE_LIMITED]
        emits: [auctions.auction.scheduled]
        idempotent: true
      - name: auctions.auction.open
        capability: auctions.auction.run
        input: "[relay command, host timer] { auctionId }"
        output: "{ auctionId, revision, hostTime }"
        errors: [NOT_FOUND, CONFLICT_STATE]
        emits: [auctions.auction.opened]
        idempotent: true
      - name: auctions.auction.cancel
        capability: auctions.auction.cancel
        input: "[statement classrup.auctions.auction_cancel/v1 signed by seller, or relay command by host moderator with reason] { auctionId, expectedRevision, reason }"
        output: "{ auctionId, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, AUCTIONS_HAS_BIDS, FORBIDDEN]
        emits: [auctions.auction.cancelled]
        idempotent: true
      - name: auctions.auction.adjust_end
        capability: auctions.auction.run
        input: "[relay internal, called by F04.S02.M02 inside the bid transaction] { auctionId, newEndsAt, expectedExtensionCount }"
        output: "{ auctionId, currentEndsAt, extensionCount }"
        errors: [NOT_FOUND, CONFLICT_STATE, CONFLICT_REVISION]
        emits: []
        idempotent: true
      - name: auctions.auction.mark_closed
        capability: auctions.auction.run
        input: "[relay internal, called by F04.S01.M03 holding the close lease] { auctionId, leaseToken }"
        output: "{ auctionId, revision }"
        errors: [NOT_FOUND, CONFLICT_STATE, PRECONDITION_FAILED]
        emits: []
        idempotent: true
    queries:
      - name: auctions.auction.get_public
        capability: auctions.auction.read_public
        input: "[vault-local from cached host-signed projection, or relay query] { auctionId }"
        output: "{ auction: public projection without reserve value or bidder identities, host: {relayId, name, policyUrl}, hostTime }"
        errors: [NOT_FOUND]
      - name: auctions.auction.list_mine
        capability: auctions.auction.read_own
        input: "[vault-local] { status?, cursor?, limit ≤ 50 }"
        output: "{ items: Auction[] including reservePrice for the seller, nextCursor? }"
        errors: []
    events_produced:
      - {type: auctions.auction.scheduled, privacy: P0, payload: "{ auctionId, listingId, sellerId, hostRelayId, startsAt, scheduledEndsAt, currency, startPrice, reserveCommitment?, termsCid }"}
      - {type: auctions.auction.opened, privacy: P0, payload: "{ auctionId, hostRelayId, openedAt, currentEndsAt }"}
      - {type: auctions.auction.cancelled, privacy: P0, payload: "{ auctionId, reason, bidCount }"}
    events_consumed:
      - {type: bazaar.listing.unpublished, effect: "cancel a scheduled auction, or an open auction with zero bids, with reason listing_unavailable; an auction with bids stays open"}
      - {type: bazaar.listing.expired, effect: "same as unpublished"}
      - {type: auctions.auction.closed, effect: "set status closed and store final projection after the close lease releases"}
    errors:
      - "AUCTIONS_HOST_REQUIRED | 409 | no | no host relay selected, or the host is not accepted; auctions are disabled without a host"
      - "AUCTIONS_RESERVE_INVALID | 422 | no | reserve is below the start price or does not match its commitment"
      - "AUCTIONS_SCHEDULE_INVALID | 422 | no | duration outside 1 h to 14 d or start outside the allowed window"
      - "AUCTIONS_INCREMENT_INVALID | 422 | no | increment table breaks the tier rules"
      - "AUCTIONS_LISTING_NOT_ELIGIBLE | 409 | no | listing is not published, not an auction listing, not owned by the seller, or already has a live auction"
      - "AUCTIONS_SELLER_LIMIT | 409 | no | seller reached 20 live auctions on this host or the host policy refuses the seller"
      - "AUCTIONS_HAS_BIDS | 409 | no | cancellation is not allowed once a bid exists"
    example: |
      seller vault: auctions.auction.create { "listingId": "0192f400-0001-…", "hostRelayId": "relay.example.org", "currency": "EUR",
        "startPrice": { "amount": "1000", "currency": "EUR" }, "reservePrice": { "amount": "5000", "currency": "EUR" },
        "startsAt": "2026-11-05T10:00:00.000Z", "durationMs": 604800000 } -> { "auctionId": "0192f400-0002-…", "status": "draft" }
      auctions.auction.schedule -> terms statement signed and sent; host replies host_acceptance (cid sha256-Ha…) -> status scheduled
      host timer at 2026-11-05T10:00:00Z -> auctions.auction.opened
  authorization_capabilities:
    requirements:
      - Vault policy - only the unlocked local principal who is the seller creates, schedules or cancels the auction; the seller also reads the reserve.
      - Relay policy - the host accepts terms only when signed by the seller key named in the terms and within its hosting policy; open, adjust_end and mark_closed are host-internal and callable only by the host's own scheduler and sibling modules.
      - Host moderators may cancel an auction on that host with a stated reason; this affects only that host. Bidders and viewers read the public projection with no capability beyond a signed or anonymous request.
    capabilities:
      - "auctions.auction.create | principal | local principal owns the listing; host selected in local relay list"
      - "auctions.auction.schedule | principal | auction.sellerId = local principal; state draft"
      - "auctions.auction.cancel | principal, moderator | seller with zero bids, or host moderator under hosting policy with reason"
      - "auctions.auction.host_accept | host-operator | terms signed by seller key; host hosting policy and quotas satisfied"
      - "auctions.auction.run | system | host scheduler or sibling module inside a host transaction holding the auction lease"
      - "auctions.auction.read_public | anonymous, principal | published projection only"
      - "auctions.auction.read_own | principal | auction.sellerId = local principal"
  failure_recovery_idempotency:
    requirements:
      - Vault commands are idempotent through local command ids; host commands are idempotent by terms cid and auction id.
      - Host open, adjust_end and mark_closed run inside the per-auction lease (IDM-8) and are safe to repeat; a stale lease token is refused.
      - A seller vault crash after signing terms but before recording them is repaired by re-sending the same terms cid, which the host deduplicates.
    idempotency: "Local command id stored 24 h; host accept_hosting dedupes on termsCid and returns the same host_acceptance; open, adjust_end and mark_closed ignore repeats once their effect is stored."
    concurrency: "Per-auction lease row on the host with a fencing token, TTL 5 s for bid-path commands and 30 s for the close path, always taken with BEGIN IMMEDIATE so adjust_end and mark_closed cannot interleave with bids; the seller vault uses a Web Locks lock auctions-auction-<id>."
    retries: "Terms upload retries 1 s, 2 s, 4 s, 8 s up to 8 attempts, then shows needs attention; the host timer retries open every 5 s until success or cancellation."
    offline: "Create and cancel (of a draft) work offline; schedule needs the host and shows prepared until the host acknowledges; the UI never says scheduled until the host countersignature is verified."
    partial_failure: "If the host acknowledges transport but the acceptance is lost, the seller sees proposed and can fetch the acceptance by termsCid; if the host is down at start time the auction opens late by the host clock and the delay is recorded, never backdated."
  privacy_retention_abuse:
    requirements:
      - The reserve is committed by salted hash publicly and known only to the seller and the host; bidders learn only whether it has been met, and the seller can verify the host's commitment at close.
      - Public projections carry listing reference, start price, increments, times, host identity and reserveMet, but not bidder identities, aliases tied to keys, or max bids.
      - The host sees the reserve and bids in plaintext and can misbehave; this trust is stated before the seller schedules and before each bidder's first bid.
    data:
      - "Auction: P3 in the seller vault and on the host (reserve); public projection P0."
      - "Host acceptance and terms statements: P0 signed envelopes."
    retention:
      - "Closed or cancelled auctions: RET-EVIDENCE (2 years after last related activity) in the seller vault; the host keeps records for its published retention, default 90 days."
    threats:
      - "T01 | Host manipulates reserve or start price | terms are signed by the seller and countersigned by the host; the reserve commitment hash is checked against the revealed value by the seller at close"
      - "T02 | Seller changes listing after bids | bids reference the termsCid; listing edits after the first bid are flagged on the page and recorded as signals to F04.S02.M03"
      - "T03 | Seller picks a colluding host | the host is named on the page and each bidder must accept that host at bid time; hosts publish policy; this does not remove the trust requirement and the UI says so"
      - "T04 | Seller floods a host with auctions | host quota of 20 live auctions per seller and relay hosting policy"
      - "T05 | Reserve leak through error messages or events | errors never echo the reserve and events carry only the commitment and reserveMet"
    abuse_controls:
      - "Host hosting policy may refuse sellers; refusal appears as host_refused with the host's stated reason."
      - "Host emits listing-edit-after-bid signals to its fraud review queue (F04.S02.M03)."
  observability_performance:
    requirements:
      - The PWA sends no telemetry (OBS-7); the host relay exports metrics and logs per OBS-1 to OBS-6.
      - Open runs within 5 s of startsAt at the 95th percentile on the host.
      - Vault commands meet p95 ≤ 150 ms; host accept_hosting meets p95 ≤ 300 ms at 20 req/s.
    metrics:
      - "classrup_auctions_auctions_total{outcome=scheduled|opened|closed|cancelled} (host)"
      - "classrup_auctions_open_lag_ms (host histogram: open time minus startsAt)"
      - "classrup_auctions_host_required_refusals_total (vault local counter)"
    logs:
      - "info auction.opened {auctionId, correlationId} on the host - no reserve and no bidder data."
    budgets:
      - "vault create/schedule p95 ≤ 150 ms; host accept_hosting p95 ≤ 300 ms at 20 req/s; get_public p95 ≤ 100 ms."
      - "Host opens 1 000 due auctions within 10 s."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Contract tests validate terms, host acceptance, events and the public projection against the schema registry, including that the reserve never appears.
      - Two-party integration tests run a seller vault and an in-memory host relay with an injectable clock.
    fixtures: "Seller vault S, host relay H with injectable clock, bidder vault B, auction listing L (EUR), default increment table default-v1; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R03,02.R01 | create auctions in EUR, JPY (exponent 0) and BHD (exponent 3) | increments are ceiling-converted to at least 1 minor unit; tiers strictly increasing"
      - "T02 | unit | 02.R01,02.R02,02.R03 | each rule V01–V08 violated in turn on vault and on host | documented code returned and nothing stored; reserve never echoed"
      - "T03 | property | 03.R01 | random command and timer sequences | only declared transitions succeed; closed and cancelled never change"
      - "T04 | integration | 03.R02,02.R02 | schedule with no host, with host refusing, and with host silent for 24 h | AUCTIONS_HOST_REQUIRED; cancelled host_refused; cancelled host_unreachable; never scheduled"
      - "T05 | integration | 03.R03,06.R02 | advance host clock past startsAt; run open twice and adjust_end with stale lease token | opened once; stale token refused"
      - "T06 | contract | 04.R01,04.R02,09.R02 | each command, statement, event and public projection | payloads and signatures validate; projection and events contain no reserve value"
      - "T07 | integration | 04.R03 | listing unpublished with and without bids | scheduled or zero-bid auction cancelled; auction with bids stays open"
      - "T08 | abuse | 05.R01,05.R02,05.R03 | non-seller cancels; terms signed by wrong key; non-moderator cancels on host | FORBIDDEN or rejected; no state change"
      - "T09 | integration | 06.R01,06.R03 | replay schedule; crash after signing terms before recording | same termsCid and acceptance; host dedupes"
      - "T10 | integration | 07.R01,07.R02,07.R03 | inspect host log, public projection, events, errors, bidder view | reserve absent everywhere except seller view and host; host trust panel shown before first bid"
      - "T11 | abuse | 07.R03 | seller schedules a 21st live auction on one host | AUCTIONS_SELLER_LIMIT"
      - "T12 | load | 08.R01,08.R02,08.R03 | 1 000 due auctions and 20 accept_hosting req/s for 5 minutes | opens within 10 s, p95 ≤ 300 ms, metrics exported"
      - "T13 | unit | 09.R01 | traceability tool run | every PS-035 requirement maps to a passing test"
      - "T14 | integration | 10.R01,10.R02,10.R03 | export, import into fresh vault, restore host from backup | auctions round-trip; reserve stays out of other exports; host restore keeps scheduled auctions"
      - "T15 | e2e | 01.R02,03.R02,09.R03 | mobile seller schedules with a host, bidder views host panel and auction page | host named, reserve status shown, no host means feature disabled; axe zero serious issues"
    acceptance:
      - All tests T01–T15 pass in CI.
      - An auction cannot be scheduled or opened without a verified host countersignature and the UI always names the host.
      - The reserve value never appears in any payload visible to bidders, in logs, or in errors.
  import_export_backup_rollback:
    requirements:
      - The seller's vault export contains their auctions, signed terms, host acceptances and the encrypted reserve; the reserve appears in no other user's export.
      - Import verifies signatures and cids; auctions that were open on import are marked needs host check and re-verified with the host before being shown as open.
      - Schema changes follow expand and contract and keep v1 readable for 180 days.
    export: "Section auctions.auctions in classrup-export/v1 with Auction lines and the original terms and host_acceptance envelopes; reservePrice included only in the seller's own export."
    import: "Closed and cancelled auctions import as history; scheduled and open auctions import as proposed with needs host check until the host confirms its state; unknown host keys are kept as read-only history."
    backup: "The vault export is the primary backup (IOX-6); the host relay uses relay SQLite backup (IOX-3, IOX-7) and holds only auction operational data."
    migration_rollback: "Additive optional fields only in v1; rollback is safe because signed statements are immutable and older readers ignore unknown fields."
