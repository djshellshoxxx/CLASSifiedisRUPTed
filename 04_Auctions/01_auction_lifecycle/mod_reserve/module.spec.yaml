id: F04.S01.M01
scope: MVP
summary: >-
  English ascending auctions on a listing, run only on a host relay that the seller chooses and that every bidder explicitly
  accepts at bid time (ADR-0016 section 6). The seller first creates a draft Auction in the local vault (start price, hidden
  reserve, bid increment table, start and end 1 h to 14 d), uses its id as the subtypeRef of an auction listing, publishes the
  listing, and then signs the terms, which pin the listing projection cid, an acceptBy deadline and the soft-close rules version.
  The chosen host relay countersigns a hosting acceptance before acceptBy and becomes the authority for bid order, time, soft close
  and close; every host decision reaches the vault as a host-signed statement. The hidden reserve is committed by hash in the public
  terms and travels to the host only end-to-end encrypted to its key. With no host selected, or a host that refuses or is
  unreachable, the auction feature is disabled for that auction and fails closed; a vault never cancels silently, and a host that
  stops answering leaves the auction in host_silent. The host is trusted for ordering and time and the UI says so.
responsibilities:
  - Own the Auction record in the seller vault (draft) and on the host relay (authoritative once scheduled), and the statements auction terms (classrup.auctions.auction/v1), host_acceptance, auction_cancel, auction_opened and host_cancel.
  - Validate terms - currency, start price, reserve commitment, increment table, duration 1 h to 14 d, start within 30 days, acceptBy, softCloseRulesVersion softclose-v1 and the pinned listing cid - and refuse to schedule without a selected host (AUCTIONS_HOST_REQUIRED).
  - Open scheduled auctions at the host-clock start time, keep currentEndsAt and price projections used by bids, and publish a public P0 projection that never contains the reserve, bidder identities or max bids.
  - Allow cancellation by the seller only while the auction has zero bids, and by the host operator under hosting policy with a stated reason, always confirmed by a host-signed host_cancel statement.
  - Answer the listing edit-lock query that F01.S01.M02 uses to refuse material listing edits while the auction has bids (N11).
non_responsibilities:
  - Placing and ordering bids and proxy logic (F04.S01.M02) and closing and result (F04.S01.M03).
  - Soft-close extensions (F04.S02.M02), shill controls (F04.S02.M01) and fraud review (F04.S02.M03).
  - Listing content and media (F01.S01.M01) and the refusal of material listing edits (F01.S01.M02); the auction references one auction-kind listing whose subtypeRef is the auction.
  - Payment and receipts (F09); winners and sellers settle through a local Deal in each vault.
  - "Future: Dutch and sealed-bid auctions, federated hosts that share one auction, and buy-it-now."
depends_on: [F01.S01.M01, F01.S01.M03, F09.S03.M01, F11.S01.M01, F11.S01.M03, F07.S01.M01, F10.S01.M01, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, F12.S03.M03, F12.S03.M04, F13.S02.M01, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-MNY-001, CTR-PRV-001, CTR-FED-001, CTR-FLG-001]
user_stories:
  - As a seller, I choose a host relay, see its name, operator policy and what it can and cannot do, set start price, hidden reserve and duration, and schedule the auction once the host countersigns.
  - As a bidder, I see the host named on the auction, whether the reserve has been met (not its value), the next minimum bid and the end time with soft-close rules.
  - As a seller with no bids, I can cancel; once a bid exists I cannot.
  - As a seller whose host stopped answering, I see that the host did not report a result and my listing is released, and a later valid host statement still counts.
edge_cases:
  - No host relay selected; schedule is refused with AUCTIONS_HOST_REQUIRED and the screen explains that auctions need a host the seller and bidders choose.
  - Host relay refuses or does not answer within 60 s; the auction stays proposed; the signed terms carry acceptBy = min(signing time + 24 h, startsAt + 5 min) and the host refuses acceptance after it; a refusal arrives as host_cancel with reason host_refused; at acceptBy without acceptance the vault sends a signed auction_cancel and waits in cancel_pending until the host answers, and the seller may then choose another host.
  - Seller tries to edit the listing after the first bid; F01.S01.M02 asks auctions.auction.edit_lock and refuses material edits (price, condition, category) while bidCount > 0 (N11); non-material edits are allowed, the host records each new projection cid in listingCidHistory, and the auction page shows that the listing text was edited after bidding.
  - Reserve equals start price; allowed, and the reserve is shown as met after the first bid.
  - Start time is in the past by the host clock; refused with VALIDATION_FAILED, never silently moved.
  - Seller device clock is hours off; terms times are claims, the host stores its own receipt time and rejects terms whose start is more than 5 minutes before the host clock.
  - Currency exponent is 0 (JPY) or 3 (BHD); the default increment table is converted by ceiling to at least one minor unit.
  - Host operator removes the auction by hosting policy while it has bids; the host signs host_cancel with reason host_policy, vaults show removed by host with the reason, live bids become void, and the case goes to F04.S02.M03 review.
  - The host accepted but the acceptance was lost and acceptBy passes; the vault sends auction_cancel; with zero bids the host cancels and returns host_cancel; with bids it refuses with AUCTIONS_HAS_BIDS and returns its acceptance and auction_opened statements, and the vault shows the auction open.
  - The host disappears after scheduling; with no auction_opened, result or host_cancel by scheduledEndsAt plus 60 minutes plus 72 h the vault moves the auction to host_silent, releases the listing lock and shows host did not report a result; a later valid host statement still applies.
  - Draft-first creation; the seller creates the draft Auction without a listing, creates the auction listing with subtypeRef {slug auctions, entity Auction, id}, publishes it and then schedules; schedule refuses an unpublished listing with AUCTIONS_LISTING_NOT_ELIGIBLE, create does not.
  - Terms name an unknown softCloseRulesVersion; refused with VALIDATION_FAILED by the vault and by the host.
ux:
  screens:
    - "Auction setup: listing picker or create auction listing, host relay picker with trust panel (operator name, region, policy link, retention, what the host can see including the reserve and every bid in plaintext), start price, hidden reserve (optional, with the note that a proxy maximum lifting the price exactly to the reserve reveals it), duration chips (1 h, 24 h, 3 d, 7 d, 14 d), start now or schedule, increment table preview."
    - "Auction page: current price, next minimum bid, time left from host-signed time, reserve status (no reserve, reserve not met, reserve met), host panel, bid count, soft-close note naming rules version softclose-v1, listing-edited notice when applicable."
    - "Seller dashboard: auctions by state with host sync line (prepared, delivered to host, accepted by host), cancel requested, host did not answer (with Release anyway after a warning) and host did not report a result."
  states: [loading, empty, draft, proposed, cancel-pending, scheduled, open, closed, cancelled, host-silent, needs-host-check, host-required, host-unreachable, pending-offline]
  a11y:
    - Money fields have visible labels including currency and use inputmode=decimal.
    - Time left is text in an aria-live polite region updated at most once per 10 s, and the final minute announces once per 15 s.
    - Host trust panel is reachable by keyboard before the first bid and its text states host power in plain words.
processes:
  domain_schema:
    requirements:
      - An Auction stores listing and pinned listing cid, seller, host relay identity and key, currency, start price, reserve commitment, increment table, schedule with acceptBy, soft-close rules version, extension counters, price projection and status, with revision per CTR-ID-001.
      - The reserve value and its salt are P3 in the seller vault and P2 to the host, the only listed participant - they travel only inside an envelope end-to-end encrypted to hostKeyId (PRV-5) and the host holds them under its published retention - while public terms and events carry only the salted hash commitment and a reserveMet flag.
      - Money is integer minor units per CTR-MNY-001; increments are computed from a tiered table in major-unit templates converted with ceiling to the currency exponent.
      - The signed terms pin listingCid (the cid of the published listing projection), acceptBy and softCloseRulesVersion softclose-v1, so the host cannot accept late, the listing text that bids rest on is identifiable, and the soft-close constants cannot change during the auction.
    entities:
      - name: Auction
        schema: classrup.auctions.auction/v1
        storage: relay+device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key, generated by the seller vault; used as the listing subtypeRef {slug: auctions, entity: Auction, id}"
          - "tenantId: uuidv7 — host relay tenant scope"
          - "listingId?: uuidv7 — ref F01.S01.M01 Listing of kind auction whose subtypeRef is this auction; optional in draft, required from schedule on, published at schedule and accept_hosting"
          - "listingCid?: string — sha256- cid of the published listing projection pinned in the signed terms; required from schedule on"
          - "listingCidHistory: string[] — projection cids the host received after scheduling; non-material edits only (N11)"
          - "sellerId: actorId — did:key of the seller; signs terms and auction_cancel"
          - "hostRelayId: string — identifier of the selected host relay; required"
          - "hostKeyId: string — Ed25519 key of the host used to verify every host statement of this auction"
          - "currency: string — registered ISO 4217 code (F09.S03.M01)"
          - "startPrice: Money — CTR-MNY-001; > 0; ≤ 1 000 000 000 000 minor units"
          - "reserveCommitment?: string — sha256- hash over reserve minor units and reserveSalt"
          - "reservePrice?: Money — P3 in the seller vault; P2 to the host only, inside an envelope E2E-encrypted to hostKeyId; ≥ startPrice"
          - "reserveSalt?: string — 16 random bytes base64url; same classification and transport as reservePrice"
          - "incrementTable: Tier[] — 1..8 tiers {fromMinor, incrementMinor}; default-v1 when omitted; strictly increasing fromMinor, non-decreasing increments, each increment ≥ 1 minor unit and ≤ 20 percent of fromMinor (first tier ≤ startPrice)"
          - "softCloseRulesVersion: string — softclose-v1 in v1; signed in the terms and echoed in host_acceptance; unknown versions are refused"
          - "startsAt: timestamp — host clock, RFC 3339 UTC, between now and now plus 30 days"
          - "scheduledEndsAt: timestamp — startsAt plus 1 h..14 d"
          - "acceptBy: timestamp — min(terms signing time + 24 h, startsAt + 5 min); signed in the terms; the host refuses acceptance after it by host clock"
          - "currentEndsAt: timestamp — scheduledEndsAt plus extensions, at most scheduledEndsAt plus 60 minutes"
          - "extensionCount: int — 0..30, owned by F04.S02.M02"
          - "currentPrice?: Money — projection of the leading amount; absent before the first bid"
          - "bidCount: int — projection >= 0"
          - "reserveMet: boolean — projection; true when currentPrice >= reservePrice or no reserve"
          - "termsCid: string — sha256- cid of the signed auction terms"
          - "hostAcceptanceCid?: string — cid of the host_acceptance statement"
          - "openedCid?: string — cid of the host-signed auction_opened statement"
          - "hostCancelCid?: string — cid of the host-signed host_cancel statement"
          - "pushOptIn: boolean — seller allows content-free host pushes; true only when privacy.consent.check(notify_push) for the host is granted"
          - "status: enum — draft | proposed | cancel_pending | scheduled | open | closed | cancelled | host_silent | needs_host_check"
          - "cancelReason?: enum — seller | host_unreachable | host_refused | host_policy | listing_unavailable | accept_window_passed"
          - "syncState: map — {host: prepared | transport_acknowledged | peer_accepted}"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
        invariants:
          - status scheduled, open or closed implies listingId, listingCid, hostRelayId, hostKeyId, termsCid and hostAcceptanceCid are set and verified, and the acceptance host time is at or before acceptBy.
          - reservePrice and reserveSalt never appear in any event payload, public projection, log or export other than the seller's own; on the host they exist only decrypted inside the host process for this auction.
          - currentEndsAt is at least scheduledEndsAt and at most scheduledEndsAt plus 60 minutes.
          - A cancelled auction has bidCount 0 unless cancelReason is host_policy.
          - At most one Auction per listing is in proposed, cancel_pending, scheduled, open or needs_host_check; host_silent, closed and cancelled release the listing.
    sql: |
      CREATE TABLE auctions_auction (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, listing_id TEXT, seller_id TEXT NOT NULL, host_relay_id TEXT NOT NULL,
        currency TEXT NOT NULL, start_price_minor TEXT NOT NULL, starts_at TEXT NOT NULL, accept_by TEXT, scheduled_ends_at TEXT NOT NULL,
        current_ends_at TEXT NOT NULL, status TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE INDEX auctions_auction_due ON auctions_auction(status, starts_at, current_ends_at);
      CREATE UNIQUE INDEX auctions_auction_listing ON auctions_auction(tenant_id, listing_id)
        WHERE listing_id IS NOT NULL AND status IN ('proposed','cancel_pending','scheduled','open','needs_host_check');
  validation_rules:
    requirements:
      - Terms are validated strictly in the seller vault before signing and again by the host relay before countersigning.
      - The host never accepts terms that fail the same rules, whatever the seller vault claims.
      - Every violation maps to one stable error code with a localized message key; the reserve value is never echoed in an error.
      - Schedule and accept_hosting check the listing (published, kind auction, subtypeRef equal to this auction, listingCid current) because create allows a draft without a listing; the published check is never made at create.
    rules:
      - "V01 | hostRelayId and hostKeyId are present and the host is in the seller's selected relay list | AUCTIONS_HOST_REQUIRED"
      - "V02 | currency is registered and startPrice is a positive integer string within limits | VALIDATION_FAILED"
      - "V03 | reservePrice, when present, is at least startPrice, in the same currency, and its salted hash equals reserveCommitment | AUCTIONS_RESERVE_INVALID"
      - "V04 | duration is between 1 hour and 14 days and startsAt is within 30 days and not earlier than host now minus 5 minutes | AUCTIONS_SCHEDULE_INVALID"
      - "V05 | incrementTable satisfies the tier rules in the Auction field definition | AUCTIONS_INCREMENT_INVALID"
      - "V06 | at schedule and accept_hosting only - listing is published, of kind auction with subtypeRef equal to this auction id, owned by the seller, its published projection cid equals listingCid, and no other live auction references it; at create a supplied listingId only has to be owned by the seller | AUCTIONS_LISTING_NOT_ELIGIBLE"
      - "V07 | seller has fewer than 20 live auctions on this host, the host hosting policy accepts the seller and the F12.S03.M04 limits check passes | AUCTIONS_SELLER_LIMIT"
      - "V08 | a seller cancel is applied by the host only while bidCount is 0 | AUCTIONS_HAS_BIDS"
      - "V09 | softCloseRulesVersion is a version known to vault and host (softclose-v1 in v1) and host_acceptance echoes the same version | VALIDATION_FAILED"
      - "V10 | accept_hosting runs at host time at or before acceptBy, and acceptBy equals min(terms signing time + 24 h, startsAt + 5 min) | EXPIRED"
      - "V11 | privacy.consent.check(federation_publish) for the chosen host relay is granted before schedule sends terms whose public projection the host will publish | PRECONDITION_FAILED"
      - "V12 | inbound host statements (host_acceptance, auction_opened, host_cancel) verify against hostKeyId in the seller's own terms and bind termsCid | AUCTIONS_HOST_STATEMENT_INVALID"
  workflow_state_machine:
    requirements:
      - Auctions follow draft, proposed, scheduled, open, closed, with cancelled as an exit before close and cancel_pending, host_silent and needs_host_check as vault states for an unanswered cancel, a silent host and an unconfirmed import; closed and cancelled are terminal.
      - Scheduled requires the host's verified countersignature; no host acceptance means no auction.
      - Opening, end adjustment, host cancellation and closing are host-clock decisions; the seller vault shows them only after receiving the host-signed statements (auction_opened, extension, host_cancel, result).
      - A vault never cancels a proposed auction silently - at acceptBy it sends a signed auction_cancel and waits in cancel_pending - and an auction whose host stops answering moves to host_silent, which releases the listing lock but still yields to a later valid host statement.
    machines:
      - entity: Auction
        initial: draft
        terminal: [closed, cancelled]
        transitions:
          - "draft -> proposed | auctions.auction.schedule by seller | listing linked and published (V06), consent granted (V11), terms with listingCid, acceptBy and softCloseRulesVersion signed and sent to the chosen host; host required"
          - "draft -> cancelled | auctions.auction.cancel by seller | local discard; nothing was sent; emits auctions.auction.cancelled"
          - "proposed -> scheduled | host_acceptance received and verified | acceptance host time at or before acceptBy; emits auctions.auction.scheduled"
          - "proposed -> cancelled | host_cancel with reason host_refused received and verified | cancelReason host_refused; emits auctions.auction.cancelled"
          - "proposed -> cancel_pending | acceptBy passed in the vault without a verified acceptance, or auctions.auction.cancel by seller | signed auction_cancel sent to the host; listing lock kept"
          - "cancel_pending -> cancelled | host_cancel received and verified, or the seller confirms Release anyway after the warning that a host which accepted could still run the auction | cancelReason seller, accept_window_passed or host_unreachable; later host statements are shown as conflicting host evidence; emits auctions.auction.cancelled"
          - "cancel_pending -> open | host refuses the cancel because bids exist and returns its acceptance and auction_opened statements | AUCTIONS_HAS_BIDS shown; emits auctions.auction.scheduled and auctions.auction.opened"
          - "cancel_pending -> host_silent | no host answer by scheduledEndsAt plus 60 minutes plus 72 h | listing lock released; shows host did not answer the cancel"
          - "scheduled -> open | auction_opened statement (host timer at startsAt on the host, verified statement in vaults) | emits auctions.auction.opened"
          - "scheduled -> cancelled | host_cancel for a seller cancel, an unavailable listing, or host policy | emits auctions.auction.cancelled"
          - "scheduled -> host_silent | vault sweep finds no auction_opened, result or host_cancel by scheduledEndsAt plus 60 minutes plus 72 h | listing lock released; shows host did not report a result"
          - "open -> closed | auctions.auction.mark_closed by F04.S01.M03 under the close lease (host), or auctions.auction.closed derived from the verified result (vault) | currentEndsAt reached"
          - "open -> cancelled | host_cancel for a seller cancel with zero bids, or host policy removal | emits auctions.auction.cancelled"
          - "open -> host_silent | vault sweep finds no verified result or host_cancel by scheduledEndsAt plus 60 minutes plus 72 h | listing lock released; shows host did not report a result"
          - "host_silent -> closed | a later verified result (auctions.auction.closed) | the late host result overrides the silence"
          - "host_silent -> cancelled | a later verified host_cancel | emits auctions.auction.cancelled"
          - "needs_host_check -> scheduled | the host returns its acceptance and the auction has not opened | state entered only by import"
          - "needs_host_check -> open | the host returns its auction_opened statement | emits auctions.auction.opened"
          - "needs_host_check -> closed | a verified result arrives | final projection stored"
          - "needs_host_check -> cancelled | a verified host_cancel arrives | emits auctions.auction.cancelled"
          - "needs_host_check -> host_silent | no host answer by scheduledEndsAt plus 60 minutes plus 72 h | listing lock released"
    timeouts:
      - "Host timer checks scheduled auctions every 5 s, opens those with startsAt <= host now and signs auction_opened."
      - "Seller vault sweep at app start and every 60 s while open - proposed auctions past acceptBy move to cancel_pending and send auction_cancel; scheduled, open, cancel_pending and needs_host_check auctions past scheduledEndsAt plus 60 minutes plus 72 h without a verified result or host_cancel move to host_silent. The sweep never cancels an auction."
  commands_queries_events:
    requirements:
      - Vault commands create, schedule and cancel the seller's auction; schedule and cancel produce signed statements to the host; the host relay offers accept_hosting, open, apply_cancel, adjust_end and mark_closed as relay commands and answers with host-signed statements that the vault ingests with auctions.auction.receive.
      - Auction events exist on the host as relay-local events and are derived again in each participant vault when the host-signed statement arrives (actor.kind federated); they never leave a device otherwise.
      - The module consumes listing events to cancel auctions whose listing becomes unavailable.
      - Every statement this module sends or accepts is registered with the F11.S01.M01 statement registry with its signer role - classrup.auctions.auction/v1 and classrup.auctions.auction_cancel/v1 by the seller key (sellerId), classrup.auctions.host_acceptance/v1, classrup.auctions.auction_opened/v1 and classrup.auctions.host_cancel/v1 by the host key named in the terms - and vaults act only on records they accepted (N2).
      - The vault query auctions.auction.edit_lock answers F01.S01.M02 before a material listing edit from the cached host projection, so material edits are refused while the auction has bids (N11).
      - Host-produced auction events call the relay hook notify.notification.dispatch for a content-free push - opening to the seller, a host cancellation to the seller and bidders - for recipients who set pushOptIn (N17); the hook is provided by the relay runtime.
    note: "Statements: classrup.auctions.auction/v1 (terms, signer seller key; payload {auctionId, listingId, listingCid, sellerId, hostRelayId, hostKeyId, currency, startPrice, reserveCommitment?, incrementTable, softCloseRulesVersion, startsAt, scheduledEndsAt, acceptBy, pushOptIn}); a separate reserve envelope {auctionId, reservePrice, reserveSalt} E2E-encrypted to hostKeyId; classrup.auctions.auction_cancel/v1 (seller key) {auctionId, termsCid, reason}; classrup.auctions.host_acceptance/v1 (host key) {termsCid, softCloseRulesVersion, hostTime}; classrup.auctions.auction_opened/v1 (host key) {auctionId, termsCid, openedAt, currentEndsAt}; classrup.auctions.host_cancel/v1 (host key) {auctionId, termsCid, reason: host_refused | host_policy | seller | listing_unavailable | accept_window_passed, bidCount, hostTime}. Execution sites: create, schedule, cancel, receive and the queries run in the seller vault; accept_hosting, open, apply_cancel, adjust_end and mark_closed run on the host relay."
    commands:
      - name: auctions.auction.create
        capability: auctions.auction.create
        input: "[vault-local] { listingId?, hostRelayId, currency, startPrice, reservePrice?, incrementTable?, startsAt, durationMs }"
        output: "{ auctionId, revision: 1, status: draft, reserveCommitment?, subtypeRef: { slug: auctions, entity: Auction, id: auctionId } }"
        errors: [VALIDATION_FAILED, AUCTIONS_HOST_REQUIRED, AUCTIONS_RESERVE_INVALID, AUCTIONS_SCHEDULE_INVALID, AUCTIONS_INCREMENT_INVALID, AUCTIONS_LISTING_NOT_ELIGIBLE, FEATURE_DISABLED]
        emits: []
        idempotent: true
      - name: auctions.auction.schedule
        capability: auctions.auction.schedule
        input: "[vault-local plus statement classrup.auctions.auction/v1 terms signed by seller, sent to the host; reserve and salt in an envelope E2E-encrypted to hostKeyId] { auctionId, expectedRevision, listingId? }"
        output: "{ auctionId, revision, termsCid, listingCid, acceptBy, syncState }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, AUCTIONS_HOST_REQUIRED, AUCTIONS_LISTING_NOT_ELIGIBLE, VALIDATION_FAILED, PRECONDITION_FAILED, DEPENDENCY_UNAVAILABLE, FEATURE_DISABLED]
        emits: []
        idempotent: true
      - name: auctions.auction.accept_hosting
        capability: auctions.auction.host_accept
        input: "[relay command, authorized by the seller's signed terms; passes RateLimitPort.consume and the F12.S03.M04 limits check] { termsEnvelope, reserveEnvelope? }"
        output: "{ hostAcceptance: statement classrup.auctions.host_acceptance/v1 signed by host key, hostTime } or { hostCancel: statement classrup.auctions.host_cancel/v1 with reason host_refused }"
        errors: [VALIDATION_FAILED, EXPIRED, AUCTIONS_RESERVE_INVALID, AUCTIONS_SCHEDULE_INVALID, AUCTIONS_INCREMENT_INVALID, AUCTIONS_LISTING_NOT_ELIGIBLE, AUCTIONS_SELLER_LIMIT, FORBIDDEN, RATE_LIMITED]
        emits: [auctions.auction.scheduled, auctions.auction.cancelled]
        idempotent: true
      - name: auctions.auction.open
        capability: auctions.auction.run
        input: "[relay command, host timer] { auctionId }"
        output: "{ auctionId, revision, hostTime, opened: statement classrup.auctions.auction_opened/v1 signed by host key }"
        errors: [NOT_FOUND, CONFLICT_STATE]
        emits: [auctions.auction.opened]
        idempotent: true
      - name: auctions.auction.cancel
        capability: auctions.auction.cancel
        input: "[vault command; draft - local discard; proposed, scheduled or open - statement classrup.auctions.auction_cancel/v1 signed by seller, sent to the host] { auctionId, expectedRevision, reason }"
        output: "{ auctionId, revision, status: cancelled | cancel_pending, syncState }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, AUCTIONS_HAS_BIDS]
        emits: [auctions.auction.cancelled]
        idempotent: true
      - name: auctions.auction.apply_cancel
        capability: auctions.auction.host_cancel
        input: "[relay command, authorized by a seller-signed auction_cancel or by a host moderator signed request with a reason; produces statement classrup.auctions.host_cancel/v1 signed by host key] { auctionId, cancelEnvelope?, moderatorReason? }"
        output: "{ auctionId, revision, hostCancel } or, when bids exist for a seller cancel, AUCTIONS_HAS_BIDS with the host acceptance and auction_opened statements in params"
        errors: [NOT_FOUND, CONFLICT_STATE, AUCTIONS_HAS_BIDS, AUCTIONS_HOST_STATEMENT_INVALID, FORBIDDEN]
        emits: [auctions.auction.cancelled]
        idempotent: true
      - name: auctions.auction.receive
        capability: auctions.auction.receive
        input: "[vault-local ingestion of host_acceptance, auction_opened and host_cancel envelopes per CTR-FED-001, or of the reply to an acceptance fetch by termsCid] { envelope, via? }"
        output: "{ auctionId, accepted: boolean, quarantined?: boolean, code?, status }"
        errors: [AUCTIONS_HOST_STATEMENT_INVALID, UNSUPPORTED_SCHEMA_VERSION, NOT_FOUND]
        emits: [auctions.auction.scheduled, auctions.auction.opened, auctions.auction.cancelled]
        idempotent: true
      - name: auctions.auction.adjust_end
        capability: auctions.auction.run
        input: "[relay internal, called by F04.S02.M02 inside the bid transaction] { auctionId, newEndsAt, expectedExtensionCount, fenceToken }"
        output: "{ auctionId, currentEndsAt, extensionCount }"
        errors: [NOT_FOUND, CONFLICT_STATE, CONFLICT_REVISION, PRECONDITION_FAILED]
        emits: []
        idempotent: true
      - name: auctions.auction.mark_closed
        capability: auctions.auction.run
        input: "[relay internal, called by F04.S01.M03 holding the close lease] { auctionId, fenceToken }"
        output: "{ auctionId, revision }"
        errors: [NOT_FOUND, CONFLICT_STATE, PRECONDITION_FAILED]
        emits: []
        idempotent: true
    queries:
      - name: auctions.auction.get_public
        capability: auctions.auction.read_public
        input: "[vault-local from cached host-signed projection, or relay query] { auctionId }"
        output: "{ auction: public projection without reserve value or bidder identities, softCloseRulesVersion, listingCid, listingEditedAfterBids: boolean, host: {relayId, name, policyUrl}, hostTime }"
        errors: [NOT_FOUND]
      - name: auctions.auction.list_mine
        capability: auctions.auction.read_own
        input: "[vault-local] { status?, cursor?, limit ≤ 50 }"
        output: "{ items: Auction[] including reservePrice for the seller, nextCursor? }"
        errors: []
      - name: auctions.auction.edit_lock
        capability: auctions.auction.read_own
        input: "[vault query in the seller vault; also registered as the listing edit-lock port that F01.S01.M02 calls before a material edit] { listingId }"
        output: "{ locked: boolean, bidCount, lastKnownAt, auctionId? } — locked when an auction on the listing is open, cancel_pending or needs_host_check with last known bidCount > 0, or open with a host projection older than 5 minutes"
        errors: []
    events_produced:
      - {type: auctions.auction.scheduled, privacy: P0, payload: "{ auctionId, listingId, listingCid, sellerId, hostRelayId, startsAt, scheduledEndsAt, currency, startPrice, reserveCommitment?, softCloseRulesVersion, termsCid }"}
      - {type: auctions.auction.opened, privacy: P0, payload: "{ auctionId, sellerId, hostRelayId, openedAt, currentEndsAt, openedCid }"}
      - {type: auctions.auction.cancelled, privacy: P0, payload: "{ auctionId, sellerId, reason, bidCount, hostCancelCid? }"}
    events_consumed:
      - {type: bazaar.listing.unpublished, effect: "seller vault - send auction_cancel with reason listing_unavailable for a scheduled auction, or an open auction with zero bids; an auction with bids stays open"}
      - {type: bazaar.listing.expired, effect: "same as unpublished"}
      - {type: auctions.auction.closed, effect: "move an open, host_silent or needs_host_check auction to closed and store the final projection"}
      - {type: privacy.deletion.completed, effect: "replace the erased principal's did in retained Auction evidence with the per-deletion pseudonym, delete drafts and the reserve with its salt, and keep signed envelopes marked unverifiable-after-pseudonymization"}
    errors:
      - "AUCTIONS_HOST_REQUIRED | 409 | no | no host relay selected, or the host is not accepted; auctions are disabled without a host"
      - "AUCTIONS_RESERVE_INVALID | 422 | no | reserve is below the start price or does not match its commitment"
      - "AUCTIONS_SCHEDULE_INVALID | 422 | no | duration outside 1 h to 14 d or start outside the allowed window"
      - "AUCTIONS_INCREMENT_INVALID | 422 | no | increment table breaks the tier rules"
      - "AUCTIONS_LISTING_NOT_ELIGIBLE | 409 | no | listing is not published, not an auction listing for this auction, not owned by the seller, changed since listingCid, or already has a live auction"
      - "AUCTIONS_SELLER_LIMIT | 409 | no | seller reached 20 live auctions on this host, a limit applies, or the host policy refuses the seller"
      - "AUCTIONS_HAS_BIDS | 409 | no | cancellation is not allowed once a bid exists"
      - "AUCTIONS_HOST_STATEMENT_INVALID | 422 | no | a host statement's signature, host key or terms binding failed; quarantined"
    example: |
      seller vault: auctions.auction.create { "hostRelayId": "relay.example.org", "currency": "EUR",
        "startPrice": { "amount": "1000", "currency": "EUR" }, "reservePrice": { "amount": "5000", "currency": "EUR" },
        "startsAt": "2026-11-05T10:00:00.000Z", "durationMs": 604800000 } -> { "auctionId": "0192f400-0002-…", "status": "draft", "subtypeRef": { "slug": "auctions", "entity": "Auction", "id": "0192f400-0002-…" } }
      F01: bazaar.listing.create { "kind": "auction", "subtypeRef": { … } } then bazaar.listing.publish -> listing 0192f400-0001-… published
      auctions.auction.schedule { "auctionId": "0192f400-0002-…", "expectedRevision": 1, "listingId": "0192f400-0001-…" }
        -> terms signed with listingCid sha256-Lc…, acceptBy 2026-11-05T10:05:00.000Z, softCloseRulesVersion softclose-v1; reserve envelope encrypted to ed25519:hostkey1
      host replies host_acceptance (cid sha256-Ha…) -> auctions.auction.receive -> status scheduled
      host timer at 2026-11-05T10:00:00Z -> auction_opened (cid sha256-Op…) -> vault derives auctions.auction.opened
  authorization_capabilities:
    requirements:
      - Vault policy - only the unlocked local principal who is the seller creates, schedules or cancels the auction; the seller also reads the reserve.
      - Relay policy - the host accepts terms only when signed by the seller key named in the terms, at or before acceptBy and within its hosting policy; open, adjust_end and mark_closed are host-internal and callable only by the host's own scheduler and sibling modules holding a current fence token.
      - Host moderators may cancel an auction on that host with a stated reason; this affects only that host. Bidders and viewers read the public projection with no capability beyond a signed or anonymous request.
      - Vaults accept host_acceptance, auction_opened and host_cancel only when signed by the host key named in the seller's own terms and bound to termsCid; anything else is quarantined.
    capabilities:
      - "auctions.auction.create | principal | local principal; a supplied listing is owned by the principal; host selected in local relay list"
      - "auctions.auction.schedule | principal | auction.sellerId = local principal; state draft"
      - "auctions.auction.cancel | principal | auction.sellerId = local principal; state draft, proposed, scheduled or open"
      - "auctions.auction.host_cancel | moderator, system | system for a seller-signed auction_cancel with bidCount 0 or a host refusal; host moderator under hosting policy with a stated reason; affects only this host"
      - "auctions.auction.host_accept | host-operator, system | terms signed by seller key; host time at or before acceptBy; host hosting policy and quotas satisfied"
      - "auctions.auction.run | system | host scheduler or sibling module inside a host transaction holding the auction lease with a current fence token"
      - "auctions.auction.receive | principal | any envelope; acceptance depends on the host key in the local terms"
      - "auctions.auction.read_public | anonymous, principal | published projection only"
      - "auctions.auction.read_own | principal, system | auction.sellerId = local principal; edit_lock also callable in-process by F01.S01.M02 in the same vault"
  failure_recovery_idempotency:
    requirements:
      - Vault commands are idempotent through local command ids; host commands are idempotent by terms cid and auction id.
      - Host open, adjust_end and mark_closed run inside the per-auction lease (IDM-8) and are safe to repeat; a stale lease token is refused.
      - A seller vault crash after signing terms but before recording them is repaired by re-sending the same terms cid, which the host deduplicates.
      - A lost acceptance is never resolved by a silent local cancel - the vault sends auction_cancel at acceptBy and keeps the listing locked until the host answers, the seller explicitly releases it, or the host_silent deadline passes.
    idempotency: "Local command id stored 24 h; host accept_hosting dedupes on termsCid and returns the same host_acceptance; apply_cancel returns the same host_cancel per auction; receive dedupes on statement cid; open, adjust_end and mark_closed ignore repeats once their effect is stored."
    concurrency: "Per-auction lease row on the host with a fencing token, TTL 5 s for bid-path commands and 30 s for the close path, always taken with BEGIN IMMEDIATE; adjust_end and mark_closed carry the fence token and a stale token is refused with PRECONDITION_FAILED. The lease is local to the host relay (IDM-8); the seller vault uses a Web Locks lock auctions-auction-<id>; no lock spans vaults."
    retries: "Terms upload retries 1 s, 2 s, 4 s, 8 s up to 8 attempts, then shows needs attention; the vault fetches the acceptance by termsCid at each retry; auction_cancel is re-sent with the same cid every 60 s while in cancel_pending; the host timer retries open every 5 s until success or cancellation."
    offline: "Create and cancel of a draft work offline; schedule needs the host and shows prepared until transport acknowledged; the UI never says scheduled until the host countersignature is verified; a cancel of a proposed or live auction waits in the sync outbox and the UI shows cancel requested, not cancelled, until host_cancel is verified."
    partial_failure: "If the host acknowledges transport but the acceptance is lost, the seller sees proposed and fetches the acceptance by termsCid; at acceptBy it sends auction_cancel and waits in cancel_pending; if the host opened the auction and has bids, the cancel is refused and the vault shows it open. If the host is down at start time the auction opens late by the host clock and the delay is recorded, never backdated."
  privacy_retention_abuse:
    requirements:
      - The reserve is committed by salted hash publicly and known only to the seller and the host; bidders learn whether it has been met, and when a proxy maximum lifts the visible price exactly to the reserve (F04.S01.M02 reserve rule PX4) the price reveals the reserve value, which the setup screen states; the seller can verify the host's commitment at close.
      - Public projections carry listing reference, start price, increments, times, host identity and reserveMet, but not bidder identities, aliases tied to keys, or max bids.
      - The host sees the reserve and bids in plaintext and can misbehave; this trust is stated before the seller schedules and before each bidder's first bid.
      - The module registers ExportSectionPort (section auctions.auctions), DeletionPort and RetentionPurgePort with F10 (N6), annotates every Auction field with its F10.S02.M02 class (reservePrice and reserveSalt P3 in the vault and P2 with the host as the only listed participant), consumes privacy.deletion.completed to pseudonymize retained evidence, and calls privacy.consent.check for federation_publish before the public projection is sent and for notify_push before setting pushOptIn.
    data:
      - "Auction (seller vault): reservePrice and reserveSalt P3; the rest of the seller copy P2; public projection P0."
      - "Auction (host copy): reservePrice and reserveSalt P2 with the host as the only listed participant, received only inside an envelope E2E-encrypted to hostKeyId (PRV-5) and kept under the host's published retention; everything else is the P0 projection plus operational fields."
      - "Terms, host_acceptance, auction_opened, auction_cancel and host_cancel statements: P0 signed envelopes without the reserve."
    retention:
      - "Closed or cancelled auctions: RET-EVIDENCE (2 years after last related activity) in the seller vault; the host keeps records for its published retention, default 90 days; discarded drafts are deleted at once."
      - "On account deletion: sellerId in retained evidence is replaced with a per-deletion pseudonym; the reserve, its salt and drafts are deleted."
    threats:
      - "T01 | Host manipulates reserve or start price | terms are signed by the seller and countersigned by the host; the reserve commitment hash is checked against the revealed value by the seller at close"
      - "T02 | Seller changes listing after bids | terms pin listingCid; F01.S01.M02 refuses material edits while the auction has bids through auctions.auction.edit_lock (N11); non-material edits are recorded in listingCidHistory, shown on the auction page, and reach F04.S02.M03 through the bazaar.listing.edited event, never through a direct call"
      - "T03 | Seller picks a colluding host | the host is named on the page and each bidder must accept that host at bid time; hosts publish policy; this does not remove the trust requirement and the UI says so"
      - "T04 | Seller floods a host with auctions | host quota of 20 live auctions per seller, F12.S03.M04 limits and relay hosting policy"
      - "T05 | Reserve leak through error messages or events | errors never echo the reserve and events carry only the commitment and reserveMet"
      - "T06 | Host accepts late or runs an auction the seller believes cancelled | acceptBy is signed in the terms and the host must refuse after it; the vault sends auction_cancel at acceptBy and stays cancel_pending until the host answers; host_silent after the latest possible end plus 72 h"
      - "T07 | Host changes the soft-close constants mid-auction | softCloseRulesVersion is signed in the terms and echoed in host_acceptance; vaults reject extensions under any other version (F04.S02.M02)"
    abuse_controls:
      - "Host hosting policy may refuse sellers; refusal arrives as a host_cancel with reason host_refused and the host's stated reason."
      - "Listing edits after bids reach the host's fraud review (F04.S02.M03) as the bazaar.listing.edited event when the edited projection reaches the host; material edits are already refused in the seller vault."
      - "accept_hosting passes the kernel bus RateLimitPort.consume (F12.S03.M03) and the F12.S03.M04 limits check in-process (N18)."
  observability_performance:
    requirements:
      - The PWA sends no telemetry (OBS-7); the host relay exports metrics and logs per OBS-1 to OBS-6.
      - Open runs within 5 s of startsAt at the 95th percentile on the host.
      - Vault commands meet p95 ≤ 150 ms; host accept_hosting meets p95 ≤ 300 ms at 20 req/s.
    metrics:
      - "classrup_auctions_auctions_total{outcome=scheduled|opened|closed|cancelled} (host)"
      - "classrup_auctions_open_lag_ms (host histogram: open time minus startsAt)"
      - "classrup_auctions_host_required_refusals_total (vault local counter)"
      - "classrup_auctions_accept_window_refusals_total (host)"
      - "classrup_auctions_host_silent_total and classrup_auctions_cancel_pending_total (vault local counters)"
    logs:
      - "info auction.opened {auctionId, correlationId} on the host - no reserve and no bidder data."
    budgets:
      - "vault create/schedule p95 ≤ 150 ms; host accept_hosting p95 ≤ 300 ms at 20 req/s; get_public p95 ≤ 100 ms; edit_lock p95 ≤ 5 ms."
      - "Host opens 1 000 due auctions within 10 s."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Contract tests validate terms, host acceptance, events and the public projection against the schema registry, including that the reserve never appears.
      - Two-party integration tests run a seller vault and an in-memory host relay with an injectable clock.
    fixtures: "Seller vault S, host relay H with injectable clock, bidder vault B, auction listing L (EUR), default increment table default-v1; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R03,02.R01 | create auctions in EUR, JPY (exponent 0) and BHD (exponent 3) | increments are ceiling-converted to at least 1 minor unit; tiers strictly increasing"
      - "T02 | unit | 02.R01,02.R02,02.R03 | each rule V01–V12 violated in turn on vault and on host | documented code returned and nothing stored; reserve never echoed"
      - "T03 | property | 03.R01 | random command, statement and timer sequences | only declared transitions succeed; closed and cancelled never change"
      - "T04 | integration | 03.R02,02.R02,03.R04 | schedule with no host, with host refusing, and with host silent past acceptBy | AUCTIONS_HOST_REQUIRED; cancelled host_refused after a verified host_cancel; cancel_pending with auction_cancel sent; never scheduled"
      - "T05 | integration | 03.R03,06.R02 | advance host clock past startsAt; run open twice; call adjust_end and mark_closed with a stale fence token | opened once with one signed auction_opened; both stale calls refused with PRECONDITION_FAILED"
      - "T06 | contract | 04.R01,04.R02,09.R02,01.R04 | each command, statement, event and public projection | payloads and signatures validate; terms carry listingCid, acceptBy and softCloseRulesVersion softclose-v1 and host_acceptance echoes the version; the reserve travels only in the envelope encrypted to hostKeyId; projection and events contain no reserve value"
      - "T07 | integration | 04.R03 | listing unpublished with and without bids | scheduled or zero-bid auction cancelled through a verified host_cancel; auction with bids stays open"
      - "T08 | abuse | 05.R01,05.R02,05.R03 | non-seller cancels; terms signed by wrong key; non-moderator cancels on host | FORBIDDEN or rejected; no state change"
      - "T09 | integration | 06.R01,06.R03 | replay schedule; crash after signing terms before recording | same termsCid and acceptance; host dedupes"
      - "T10 | integration | 07.R01,07.R02,01.R02 | inspect host log, public projection, events, errors, bidder view and the F10.S02.M02 classification map | reserve absent everywhere except seller view and host; reservePrice and reserveSalt annotated P3 in the vault and P2 with the host as only participant; the reserve envelope is encrypted to hostKeyId"
      - "T11 | abuse | 02.R02 | seller schedules a 21st live auction on one host | host refuses with AUCTIONS_SELLER_LIMIT"
      - "T12 | load | 08.R02,08.R03 | 1 000 due auctions and 20 accept_hosting req/s for 5 minutes | opens within 10 s, p95 ≤ 300 ms, metrics exported"
      - "T13 | unit | 09.R01 | traceability tool run | every PS-035 requirement maps to a passing test"
      - "T14 | integration | 10.R01,10.R02,10.R03 | export, import into fresh vault with a proposed, a scheduled and an open auction, restore host from backup | auctions round-trip; scheduled and open import as needs_host_check and the sweep never cancels them; reserve stays out of other exports; host restore keeps scheduled auctions"
      - "T15 | e2e | 01.R02,03.R02,09.R03 | mobile seller schedules with a host, bidder views host panel and auction page | host named, reserve status shown, no host means feature disabled; axe zero serious issues"
      - "T16 | e2e | 07.R03 | seller opens the host picker and schedule screen; bidder opens the bid sheet for the first time | trust panel states that the host sees the reserve and bids in plaintext and decides order and time, shown before schedule and before the first bid"
      - "T17 | e2e | 08.R01 | network capture of the PWA through create, schedule, cancel and auction page views | requests go only to the chosen host relay for statements and projections; zero telemetry or analytics requests"
      - "T18 | integration | 06.R04,03.R04,02.R04 | host accepts but the acceptance is lost; 24 h pass; host opened and a bidder bid; second run without bids; host tries to accept after acceptBy | vault sends auction_cancel at acceptBy and waits in cancel_pending; with a bid the host refuses AUCTIONS_HAS_BIDS and the vault shows open; without bids host_cancel and cancelled; late acceptance refused with EXPIRED"
      - "T19 | integration | 03.R04 | host stops answering after scheduling | after scheduledEndsAt plus 60 minutes plus 72 h the auction is host_silent and the listing lock is released; a later valid result moves it to closed"
      - "T20 | integration | 04.R05 | F01.S01.M02 asks edit_lock for a listing whose auction has 0 and then 1 bid; material and non-material edits | unlocked at 0 bids; locked at 1 bid so F01 refuses the material edit; the non-material edit is recorded in listingCidHistory and shown on the page"
      - "T21 | contract | 04.R04,05.R04 | F11.S01.M01 registry entries for the five statements; host statement signed by another key | roleFor returns seller key or host key as declared; wrong key quarantined with AUCTIONS_HOST_STATEMENT_INVALID"
      - "T22 | integration | 07.R04 | export, account deletion, consents withdrawn | section auctions.auctions present; evidence pseudonymized; schedule refused with PRECONDITION_FAILED without federation_publish consent; pushOptIn false without notify_push consent"
      - "T23 | integration | 04.R06 | host opens and later cancels an auction by host policy | notify.notification.dispatch called once per opted-in recipient with a template key and reference only"
      - "T24 | unit | 01.R04,02.R04 | create a draft without listing, create the listing with its subtypeRef, publish, schedule; schedule with an unpublished listing | draft id accepted as subtypeRef; schedule pins listingCid; unpublished listing refused AUCTIONS_LISTING_NOT_ELIGIBLE at schedule but not at create"
    acceptance:
      - All tests T01–T24 pass in CI.
      - An auction cannot be scheduled or opened without a verified host countersignature and the UI always names the host.
      - The reserve value never appears in any payload visible to bidders, in logs, or in errors.
      - No vault cancels a proposed auction without telling the host, and every live auction ends in closed, cancelled or host_silent.
  import_export_backup_rollback:
    requirements:
      - The seller's vault export contains their auctions, signed terms, host statements and the reserve with its salt; the reserve appears in no other user's export.
      - Import verifies signatures and cids; auctions that were scheduled or open on import enter needs_host_check and are re-verified with the host before being shown as scheduled or open, and the sweep never cancels them.
      - Schema changes follow expand and contract and keep v1 readable for 180 days.
    export: "Section auctions.auctions in classrup-export/v1 with Auction lines and the original terms, host_acceptance, auction_opened, auction_cancel and host_cancel envelopes; reservePrice and reserveSalt included only in the seller's own export."
    import: "Closed and cancelled auctions import as history; proposed auctions import as proposed before acceptBy and as cancel_pending after it (auction_cancel re-sent); scheduled and open auctions import as needs_host_check until the host confirms its state; unknown host keys are kept as read-only history."
    backup: "The vault export is the primary backup (IOX-6); the host relay uses relay SQLite backup (IOX-3, IOX-7) and holds only auction operational data."
    migration_rollback: "Additive optional fields only in v1; rollback is safe because signed statements are immutable and older readers ignore unknown fields."
