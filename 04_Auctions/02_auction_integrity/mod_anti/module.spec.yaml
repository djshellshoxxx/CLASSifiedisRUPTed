    acceptance:
      - All tests T01–T20 pass in CI.
      - Deterministic linkage and revoked keys always deny and heuristics never deny.
      - Denials are generic and indistinguishable in body and timing from other ineligibility.
      - No IP address, network range, timing or device fingerprint is ever used as linkage evidence.
  import_export_backup_rollback:
    requirements:
      - ShillChecks are host operator data; they are exported only in the host operator's audit export and never in a user's vault export.
      - Import of a host audit export validates ids and schema version and restores checks as read-only history.
      - Schema changes follow expand and contract and keep v1 readable for 180 days.
    export: "Section auctions.shill_checks in the host operator export (classrup-export/v1, operator scope); excluded from every user export."
    import: "Checks import as read-only history with status preserved; open checks import as flagged and are re-linked to reviews by review id."
    backup: "Host relay SQLite backup (IOX-3, IOX-7); no vault backup exists for this module."
    migration_rollback: "Additive optional fields only in v1; the scoring table is a versioned constant (shill-v1) so rollback restores the earlier table with the earlier code."
