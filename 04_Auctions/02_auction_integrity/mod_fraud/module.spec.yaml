id: F04.S02.M03
scope: MVP
summary: >-
  Moderators of the host relay review auctions flagged for fraud - shill suspicion from F04.S02.M01, user reports this relay
  received (moderation.report.received) on the auction, its listing or its bids, repeated winner non-payment, listing edits after bids, or a manual decision. A review gathers a frozen
  evidence snapshot (listing and bids through F12.S01.M02, and the ledger head, extensions and result by their host-signed cids), lets
  a moderator dismiss it, cancel a still-open auction, or void a result. Voiding needs two different moderators (propose and
  confirm) and produces a host-signed void statement - the host's finding under its own hosting policy, not a global ruling - sent to
  the seller and all bidders. The host checks only facts it holds (a won result, not already voided, closed at most 60 days ago);
  each vault applies the void by its own payment state (F04.S01.M03), so no vault voids over an acknowledged or final payment, and a
  void never cancels a Deal. Each void is recorded as a host-policy EnforcementAction in F12.S02.M01 so it can be appealed; a
  successful appeal yields a host-signed rescission that vaults show as advisory, without reopening the sale.
responsibilities:
  - Own AuctionReview on the host - its queue, priority, triggers with per-check outcomes, evidence snapshot references, findings and decision.
  - Open reviews from consumed triggers (shill score 85 or more, received reports about the auction, its listing or its bids, 2 or more winner non-payments in 30 days, listing edits after bids) or by a moderator, with at most one open review per auction into which later triggers are merged.
  - Execute decisions - dismiss, cancel an open auction through F04.S01.M01 apply_cancel with reason host_policy, or void a result with a reason from shill_bidding, seller_fraud, bidder_collusion, listing_prohibited, technical_error.
  - Distribute the host-signed void statement to participant vaults, record the void as a host-policy EnforcementAction through F12.S02.M01 moderation.action.record_host_policy, and issue an advisory rescission statement after an overturned appeal.
non_responsibilities:
  - Detection and scoring (F04.S02.M01), result creation and settlement states (F04.S01.M03 decides in each vault how a void applies).
  - Account-wide or network-wide sanctions; none exist, a host can only restrict its own hosting (ADR-0016 section 8).
  - Refunding, recovering money or cancelling Deals; the platform holds none, parties settle directly, cancel Deals by mutual signed cancel and may open F09.S02.M02 disputes.
  - Appeals handling (F12.S01.M03); this module only consumes the appeal outcome and issues an advisory rescission.
  - "Future: community juries and cross-host sharing of signed findings between peers."
depends_on: [F04.S01.M01, F04.S01.M02, F04.S01.M03, F04.S02.M01, F04.S02.M02, F12.S01.M01, F12.S01.M02, F12.S01.M03, F12.S02.M01, F11.S01.M01, F11.S01.M03, F07.S01.M01, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, F13.S02.M01, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-PRV-001, CTR-FED-001]
user_stories:
  - As a host moderator, I open a review from a flagged bidder, see a frozen evidence snapshot and decide within the review window.
  - As a second moderator, I confirm or reject a proposed void so no single moderator can void a sale alone.
  - As a bidder, I am told when a result I took part in was voided, with the reason category and no accusation of a named person.
  - As a seller, I can appeal a void through the host's appeal process; a successful appeal gives a host-signed withdrawal of the finding that vaults show as advisory, and it does not reopen the auction.
edge_cases:
  - The winner's vault already holds an acknowledged payment when the void arrives; the host cannot know this and issues the void anyway; that vault records it as void after payment, changes nothing, and points the parties to F09.S02.M02 disputes.
  - The moderator who proposed a void tries to confirm it; refused with FORBIDDEN, a second moderator is required.
  - Two triggers (a report and a shill flag) arrive for the same auction at once; the review is opened once, both triggers are attached, and auctions.review.opened is emitted again with merged true and the full triggers list.
  - The auction is still open; the moderator may cancel it with reason host_policy, which voids live bids; the seller and bidders get the cancelled notice from the host-signed host_cancel.
  - A void is confirmed while a second-chance offer is outstanding; the offer is withdrawn when the void statement is received.
  - Void statement is lost in transit; mailboxes retry for 30 days and the public result projection shows voided so bidders see it on next fetch.
  - A void is appealed through F12.S01.M03 against its EnforcementAction; an overturned outcome makes the host issue classrup.auctions.void_rescission/v1, which vaults show next to the voided result as advisory; it reopens nothing, the review stays voided, and a Deal both parties kept can still complete.
  - A host moderator is a bidder in the auction, or holds a key F04.S02.M01 links to a bidder or the seller; assignment is refused (FORBIDDEN) and the review goes to another moderator.
  - A void is attempted on an unsold result, an already voided result, or a result closed more than 60 days ago; refused with AUCTIONS_RESULT_NOT_VOIDABLE.
  - Two flagged bidders in one auction, only one confirmed by the findings; confirmedCheckIds lists only that bidder's check, and F04.S02.M01 dismisses the other.
  - A received report (moderation.report.received) targets the auction (targetType auction), its listing (targetType listing) or one of its bids (targetType bid); the host maps it to the auction through the auction id, Auction.listingId or Bid.auctionId, merges it into the auction's review with ref receiptId and adds its snapshotId to the evidence; moderation.report.filed stays in the reporter's vault (EVT-8) and never reaches the host.
  - An appeal against the void's EnforcementAction is decided reduced; F12.S02.M01 replaces the host-policy action as reducedTo describes, the review records the outcome and reducedTo, the void stays issued and no rescission is signed; a copy of moderation.appeal.decided derived in the appellant's vault (origin vault) is ignored.
ux:
  screens:
    - "Review queue for moderators: priority, triggers, age, auction link, score; filters by status; keyboard-sortable table."
    - "Review detail: frozen evidence (listing and bid snapshots, ledger summary at the frozen head, extension history, check reasons, result), per-check confirm toggles, findings editor (up to 2000 characters), decision buttons with confirmation dialog naming the consequence."
    - "Participant notice: This result was voided by the host (reason category). No funds were held by the platform. Your Deal, if any, stays between you and the other party until both of you cancel it; payments you already acknowledged are handled by opening a dispute. Appeal link. When rescinded: The host withdrew this finding on appeal; the auction is not reopened."
  states: [loading, empty, opened, in-review, void-proposed, voided, rescinded, dismissed, forbidden, pending-offline]
  a11y:
    - Queue and detail are fully keyboard operable; decision buttons are at least 44x44 px with accessible names that include the consequence.
    - Void confirmation dialog traps focus, names the auction and the reason, and announces the result through a polite live region.
    - Priority is a text label plus icon, never colour alone.
processes:
  domain_schema:
    requirements:
      - An AuctionReview stores auction, optional result, triggers with per-check outcomes, priority, assignee, evidence snapshot references, findings, decision, the EnforcementAction id, and void and rescission statement references, with revision per CTR-ID-001.
      - Reviews are P3 host records visible only to host moderators and operators; participants receive only the void statement with a reason category and never the evidence or other parties' keys.
      - The evidence is frozen at assignment - the listing and bids through F12.S01.M02 snapshots of target types listing and bid, and the ledger head, extension history and result by their host-signed cids - so later bids or edits cannot change what the decision rested on.
    entities:
      - name: AuctionReview
        schema: classrup.auctions.review/v1
        storage: relay
        privacy: P3
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — host relay tenant scope"
          - "auctionId: uuidv7 — ref F04.S01.M01 Auction"
          - "resultId?: uuidv7 — ref F04.S01.M03 AuctionResult once closed"
          - "triggers: Trigger[] — 1..10 items {kind: shill_suspected | report | winner_defaults | listing_changed | manual, ref, at}; ref is the checkId for shill_suspected and the receiptId of moderation.report.received for report"
          - "confirmedCheckIds: uuidv7[] — ShillChecks the findings confirm; a subset of the shill_suspected trigger refs"
          - "priority: enum — normal | high; high for shill score ≥ 85, a sold result, or a material listing change"
          - "status: enum — opened | in_review | void_proposed | voided | dismissed"
          - "assigneeId?: actorId — host moderator; must not be a party or bidder of the auction nor linked to one"
          - "evidenceSnapshotIds: uuidv7[] — F12.S01.M02 snapshots of the listing (targetType listing) and of bids (targetType bid), and the snapshotIds of received reports"
          - "frozenRefs?: object — {termsCid, ledgerHeadSeq, ledgerHeadHash, extensionCids[], resultCid?}"
          - "findings?: string — ≤ 2000 code points, plain text"
          - "ruleRefs?: string[] — 1..5 policy rule versions in force (F12.S02.M03), passed to moderation.action.record_host_policy"
          - "factsSummary?: string — 50..2000 code points for the statement of reasons shown to the subject, passed to moderation.action.record_host_policy; never the findings text, reporter identity or other parties' keys"
          - "decision?: enum — dismiss | cancel_auction | void_result"
          - "voidReason?: enum — shill_bidding | seller_fraud | bidder_collusion | listing_prohibited | technical_error"
          - "subjectKeys?: actorId[] — host-only; parties the finding concerns (seller for seller_fraud and listing_prohibited, confirmed bidders for shill_bidding and bidder_collusion, none for technical_error)"
          - "proposedBy?: actorId — moderator who proposed the void"
          - "confirmedBy?: actorId — second moderator, different from proposedBy"
          - "voidCid?: string — cid of the host-signed void statement"
          - "enforcementActionId?: uuidv7 — ref F12.S02.M01 EnforcementAction recorded for the void under host policy"
          - "appealOutcome?: enum — upheld | overturned | reduced"
          - "appealReducedTo?: object — {kind, expiresAt?, restrictedCapabilities?} copied from moderation.appeal.decided with outcome reduced; the void stays issued"
          - "rescissionCid?: string — cid of the host-signed void_rescission statement after an overturned appeal"
          - "moderationCaseId?: uuidv7 — ref F12.S02.M01 ModerationCase returned by moderation.action.record_host_policy"
          - "openedAt: timestamp — host clock, RFC 3339 UTC"
          - "decidedAt?: timestamp — host clock, RFC 3339 UTC"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - status voided implies voidReason, proposedBy, confirmedBy, voidCid and enforcementActionId are set and proposedBy differs from confirmedBy.
          - At most one review per auction is in status opened, in_review or void_proposed; later triggers are merged into it.
          - assigneeId, proposedBy and confirmedBy are never a seller or bidder key of the auction, nor a key F04.S02.M01 links to one.
          - A void is recorded only for a won, not yet voided result closed at most 60 days before; whether it applies over a payment is decided in each vault, and no vault applies a void over an acknowledged or final payment (F04.S01.M03).
          - confirmedCheckIds is a subset of the refs of the review's shill_suspected triggers.
          - rescissionCid is set only when appealOutcome is overturned, and never changes the review status.
          - appealReducedTo is set only when appealOutcome is reduced, and never changes the review status or the issued void.
    sql: |
      CREATE TABLE auctions_review (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, auction_id TEXT NOT NULL, result_id TEXT, priority TEXT NOT NULL,
        status TEXT NOT NULL, opened_at TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX auctions_review_open ON auctions_review(tenant_id, auction_id) WHERE status IN ('opened','in_review','void_proposed');
      CREATE INDEX auctions_review_queue ON auctions_review(tenant_id, status, priority, opened_at);
  validation_rules:
    requirements:
      - Review commands check the actor's host role, conflict of interest including keys F04.S02.M01 links to a party, and the review state before any effect.
      - Void decisions check the facts the host holds - a won result that is not voided and closed at most 60 days ago - the two-moderator rule and the reason enum before signing; payment state is never checked on the host because it lives only in the parties' vaults.
      - Every violation maps to one stable error code with a localized message key.
    rules:
      - "V01 | actor holds the moderator role on this host, is not the seller or a bidder of the auction, and F04.S02.M01 linkage finds no link between the actor's key and the seller or any bidder | FORBIDDEN"
      - "V02 | review exists in the status required by the command | CONFLICT_STATE"
      - "V03 | void reason is one of the five enum values, findings has 20..2000 code points, and ruleRefs (1..5 rule versions in force) and factsSummary (50..2000 code points, no reporter identity or internal note) satisfy the F12.S02.M01 record_host_policy input | VALIDATION_FAILED"
      - "V04 | confirming moderator differs from the proposing moderator | FORBIDDEN"
      - "V05 | the result exists with outcome won, is not already voided, and closedAtHost is at most 60 days before host now | AUCTIONS_RESULT_NOT_VOIDABLE"
      - "V06 | cancel_auction applies only when the auction status is scheduled or open | CONFLICT_STATE"
      - "V07 | the trigger (kind, ref) is not already attached to the auction's open review; other triggers are merged into it | AUCTIONS_REVIEW_DUPLICATE"
      - "V08 | confirmedCheckIds lists only ShillChecks referenced by this review's shill_suspected triggers | VALIDATION_FAILED"
      - "V09 | rescind_void runs only after moderation.appeal.decided with outcome overturned for this review's enforcementActionId | CONFLICT_STATE"
  workflow_state_machine:
    requirements:
      - Reviews move opened, in_review, optionally void_proposed, and end voided or dismissed; both are terminal.
      - Voiding requires propose and confirm by two different moderators within 72 hours of the proposal, otherwise the proposal lapses back to in_review.
      - Every terminal transition emits auctions.review.closed, and a void additionally emits auctions.result.voided, in the same host transaction.
      - A successful appeal never changes the terminal review status; it adds an advisory host-signed rescission, and vaults show that statement without reopening the sale.
    machines:
      - entity: AuctionReview
        initial: opened
        terminal: [voided, dismissed]
        transitions:
          - "opened -> in_review | auctions.review.assign by moderator | conflict check passed (V01); evidence snapshots captured and refs frozen"
          - "opened -> dismissed | auctions.review.dismiss or 30 days without assignment | emits auctions.review.closed with empty confirmedCheckIds"
          - "in_review -> dismissed | auctions.review.dismiss by moderator | findings stored; emits auctions.review.closed with empty confirmedCheckIds"
          - "in_review -> in_review | auctions.review.cancel_auction by moderator | open auction cancelled through apply_cancel with reason host_policy; review continues for the enforcement recommendation"
          - "in_review -> void_proposed | auctions.review.propose_void by moderator | result eligible (V05), reason, findings and confirmedCheckIds stored"
          - "void_proposed -> voided | auctions.review.confirm_void by a second moderator | signs the void statement, records the EnforcementAction, moves the host's result row to voided; emits auctions.result.voided and auctions.review.closed"
          - "void_proposed -> in_review | second moderator rejects or 72 h lapse | proposal cleared"
    timeouts:
      - "Unassigned reviews are dismissed with reason expired after 30 days; void proposals lapse after 72 hours; a high-priority review with no assignment after 24 hours raises an operator alert. The host sweep runs every 5 minutes."
  commands_queries_events:
    requirements:
      - Reviews are host relay commands authorized by host moderator roles; vaults only ingest the signed void and rescission statements.
      - Decisions are atomic on the host with their events, statements, the host's own result row and the calls into F04.S01.M01 or F12.S02.M01; vault-side effects follow only from the host-signed statements.
      - Reviews are opened by consumed events - shill suspicion, relay-local moderation.report.received about the auction, its listing or its bids (never the reporter's vault-local moderation.report.filed, EVT-8), non-payment counts and listing edits after bids - or manually; no participant can open or read a review.
      - Statements are registered with F11.S01.M01 - classrup.auctions.void/v1 and classrup.auctions.void_rescission/v1 by the host key named in the terms (N2) - and the host calls notify.notification.dispatch for a content-free push to the seller and the auction's participants with pushOptIn when a void or rescission is issued (N17).
      - Each void records a host-policy EnforcementAction through the in-process F12.S02.M01 moderation.action.record_host_policy (source auction_review, hostRef reviewId, kind remove_from_index, targetRef the auction, subject the seller, proposerKey and deciderKey the two moderators) whose actionId and caseId are stored on the review; moderation.appeal.decided is matched on that actionId only with origin relay - overturned yields the rescission, reduced records reducedTo while the void stays, and upheld changes nothing.
    note: "Statements: classrup.auctions.void/v1 (host key) {auctionId, termsCid, resultCid, reason, decidedAt} names no individual; classrup.auctions.void_rescission/v1 (host key) {voidCid, auctionId, appealDecisionCid, decidedAt}. Both are E2E-delivered to the seller and every bidder through their mailbox hints and shown on the public result projection by reason category only."
    commands:
      - name: auctions.review.open
        capability: auctions.review.open
        input: "[relay command, moderator signed request or system trigger] { auctionId, trigger: { kind, ref }, priority? }"
        output: "{ reviewId, revision, status, merged: boolean }"
        errors: [NOT_FOUND, FORBIDDEN, AUCTIONS_REVIEW_DUPLICATE, VALIDATION_FAILED]
        emits: [auctions.review.opened]
        idempotent: true
      - name: auctions.review.assign
        capability: auctions.review.decide
        input: "[relay command; captures F12.S01.M02 snapshots of the listing and bids and freezes the ledger head, extension cids and result cid] { reviewId, expectedRevision }"
        output: "{ reviewId, revision, evidenceSnapshotIds, frozenRefs }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, FORBIDDEN, DEPENDENCY_UNAVAILABLE]
        emits: []
        idempotent: true
      - name: auctions.review.dismiss
        capability: auctions.review.decide
        input: "[relay command] { reviewId, expectedRevision, findings }"
        output: "{ reviewId, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, FORBIDDEN, VALIDATION_FAILED]
        emits: [auctions.review.closed]
        idempotent: true
      - name: auctions.review.cancel_auction
        capability: auctions.review.decide
        input: "[relay command, calls F04.S01.M01 apply_cancel with reason host_policy] { reviewId, expectedRevision, findings }"
        output: "{ reviewId, revision, auctionStatus }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, FORBIDDEN, VALIDATION_FAILED]
        emits: []
        idempotent: true
      - name: auctions.review.propose_void
        capability: auctions.review.decide
        input: "[relay command] { reviewId, expectedRevision, voidReason, findings, ruleRefs, factsSummary, confirmedCheckIds?, subjectKeys? }"
        output: "{ reviewId, revision, expiresAt }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, FORBIDDEN, VALIDATION_FAILED, AUCTIONS_RESULT_NOT_VOIDABLE]
        emits: []
        idempotent: true
      - name: auctions.review.confirm_void
        capability: auctions.review.confirm
        input: "[relay command by a second moderator; produces statement classrup.auctions.void/v1 signed by the host key; records the EnforcementAction through F12.S02.M01 moderation.action.record_host_policy in the same host transaction] { reviewId, expectedRevision, confirm: boolean }"
        output: "{ reviewId, revision, voidCid, enforcementActionId, moderationCaseId }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, FORBIDDEN, AUCTIONS_RESULT_NOT_VOIDABLE, DEPENDENCY_UNAVAILABLE]
        emits: [auctions.result.voided, auctions.review.closed]
        idempotent: true
      - name: auctions.review.rescind_void
        capability: auctions.review.rescind
        input: "[relay command, system on moderation.appeal.decided with outcome overturned; produces statement classrup.auctions.void_rescission/v1 signed by the host key] { reviewId, appealId, appealDecisionCid }"
        output: "{ reviewId, rescissionCid }"
        errors: [NOT_FOUND, CONFLICT_STATE]
        emits: []
        idempotent: true
      - name: auctions.review.receive_void
        capability: auctions.review.receive
        input: "[vault-local ingestion of host-signed void and void_rescission envelopes per CTR-FED-001] { envelope, via? }"
        output: "{ accepted: boolean, quarantined?: boolean, code?, kind: void | rescission }"
        errors: [AUCTIONS_RESULT_INVALID, UNSUPPORTED_SCHEMA_VERSION]
        emits: [auctions.result.voided]
        idempotent: true
    queries:
      - name: auctions.review.list
        capability: auctions.review.read
        input: "[relay query] { status?, priority?, cursor?, limit ≤ 50 }"
        output: "{ items: AuctionReview[], nextCursor? }"
        errors: []
      - name: auctions.review.get
        capability: auctions.review.read
        input: "[relay query] { reviewId }"
        output: "{ review: AuctionReview, evidenceSummary }"
        errors: [NOT_FOUND]
    events_produced:
      - {type: auctions.review.opened, privacy: P3, payload: "{ reviewId, auctionId, triggers: [{kind, ref}], priority, merged } — host-local; emitted on open and again on each merge with the full triggers list"}
      - {type: auctions.result.voided, privacy: P2, payload: "{ auctionId, resultId, sellerId, winnerId?, parties: [{did, role: seller | winner | bidder}], reason, voidCid, decidedAt, subjectKeys? } — the host-local event lists parties from the host's participant list and carries the host-only P3 field subjectKeys for F12 signals; the vault-derived event from receive_void carries the local principal as its only party, sellerId and winnerId when the vault knows them, and never subjectKeys"}
      - {type: auctions.review.closed, privacy: P3, payload: "{ reviewId, auctionId, decision, voided: boolean, voidReason?, confirmedCheckIds[] } — host-local"}
    events_consumed:
      - {type: auctions.shill.suspected, effect: "open or merge into the auction's review at high priority when score is 85 or more, with trigger {kind shill_suspected, ref checkId}; scores 60 to 84 stay in the anti-shill queue for a manual open"}
      - {type: moderation.report.received, effect: "relay-local P2 { reportId, receiptId, relayId, targetType, targetId, targetCid, subjectKey, reasonCode, snapshotId, snapshotHash, disclosure, relayReceivedAt } of this host - when targetType is auction and targetId is a hosted auction, targetType is listing and a hosted auction has that listingId, or targetType is bid and the Bid's auctionId is hosted here, open or merge a report trigger {kind report, ref receiptId} at normal priority and add snapshotId to evidenceSnapshotIds; dedupe on receiptId; the reporter's vault-local moderation.report.filed is never consumed"}
      - {type: auctions.result.non_payment, effect: "host-local event from record_non_payment - open or merge a winner_defaults trigger when the winner key has 2 or more reports in 30 days"}
      - {type: auctions.auction.closed, effect: "attach the result id to an open review of the auction"}
      - {type: bazaar.listing.edited, effect: "host side, when the edited projection of a listing whose auction has bids reaches the host - open or merge a listing_changed trigger at normal priority, high when the change is material (material edits are refused in the seller vault per N11)"}
      - {type: moderation.appeal.decided, effect: "origin relay only (a copy derived in the appellant's vault with origin vault is ignored) - when actionId equals a review's enforcementActionId, record appealOutcome; overturned runs auctions.review.rescind_void; reduced stores reducedTo { kind, expiresAt?, restrictedCapabilities? } as appealReducedTo while F12.S02.M01 replaces the action, and no rescission is signed; upheld changes nothing; a void already issued stays issued"}
      - {type: privacy.deletion.completed, effect: "host relay - replace the erased principal's did in retained reviews (assignee, proposer, confirmer, subjectKeys) with the per-deletion pseudonym; vault - received void statements are kept as counterparty evidence and the erased principal's own copies are deleted"}
    errors:
      - "AUCTIONS_RESULT_NOT_VOIDABLE | 409 | no | result is unsold, already voided, not closed, or closed more than 60 days ago"
      - "AUCTIONS_REVIEW_DUPLICATE | 409 | no | this trigger is already attached to the auction's open review"
    example: |
      shill flag score 90 -> auctions.review.open { "auctionId": "0192f400-0002-…", "trigger": { "kind": "shill_suspected", "ref": "0192f420-0001-…" } }
      -> { "reviewId": "0192f430-0001-…", "status": "opened", "merged": false }
      report on the auction's listing -> merged into the same review (auctions.review.opened with merged true)
      moderator A: assign, then propose_void { "voidReason": "shill_bidding", "findings": "Alternating bids from keys registered together ...", "confirmedCheckIds": ["0192f420-0001-…"] }
      moderator B: confirm_void -> { "voidCid": "sha256-Vd…", "enforcementActionId": "0192f3b8-…" } and event auctions.result.voided;
        participants' vaults ingest the host-signed statement with receive_void and F04.S01.M03 applies it by local payment state
  authorization_capabilities:
    requirements:
      - Relay policy - only host moderators (and operators) of the hosting relay can read, assign, dismiss, cancel, propose or confirm; roles are per host (CAP-9) and every allow or deny is audited (CAP-7).
      - Conflict of interest is enforced - a seller, a bidder, or a key F04.S02.M01 links to either cannot be assigned, propose or confirm.
      - Vault policy - vaults only ingest void and rescission statements signed by the host key named in the auction terms; no vault role can change a review.
    capabilities:
      - "auctions.review.open | moderator, operator, system | host role or trigger event on this host"
      - "auctions.review.decide | moderator | moderator of the hosting relay; no conflict of interest including linked keys; for propose_void the proposer differs from the confirmer"
      - "auctions.review.confirm | moderator | moderator of the hosting relay different from the proposer and without conflict of interest; proposal not older than 72 hours"
      - "auctions.review.rescind | system | only after moderation.appeal.decided with outcome overturned for the review's enforcementActionId"
      - "auctions.review.read | moderator, operator | moderator or operator of the hosting relay"
      - "auctions.review.receive | principal | any envelope; acceptance depends on host signature and key from the auction terms"
  failure_recovery_idempotency:
    requirements:
      - Review commands are idempotent per review and expectedRevision; a repeated confirm returns the stored void statement.
      - Confirm, the void statement, the EnforcementAction, the events and the move of the host's own result row to voided commit in one host transaction; a failure leaves the review in void_proposed.
      - Delivery of the void statement to participants is at least once through mailboxes and idempotent by cid in vaults.
      - No lock spans vaults - the host never serializes a void against payments it cannot see; each vault applies the void against its own Deal state in one local transaction (F04.S01.M03).
    idempotency: "One open review per auction; trigger dedupe on (kind, ref); command ids stored 24 h on the host; confirm repeated with the same expectedRevision returns the same voidCid; rescind runs once per review; vault dedup by void and rescission cid."
    concurrency: "expectedRevision on every command; each decision runs in one host SQLite transaction (BEGIN IMMEDIATE); two moderators confirming at once are serialized and the second gets CONFLICT_REVISION; no auction lease and no cross-vault lock are involved."
    retries: "Void and rescission delivery retries 1 s, 2 s, 4 s, 8 s up to 8 attempts then hourly for 30 days; host triggers are consumed with EVT-6 retries."
    offline: "Moderator commands need the host and are not queued; participant vaults show the last known state and the void arrives when the vault next connects."
    partial_failure: "If F12.S02.M01 cannot record the EnforcementAction, confirm fails with DEPENDENCY_UNAVAILABLE and the review stays void_proposed; no partial void exists. A void issued over a payment acknowledged in some vault is not a failure - that vault records void after payment (F04.S01.M03). Delivery failures never roll back the host decision; they retry from the mailbox outbox."
  privacy_retention_abuse:
    requirements:
      - Evidence, findings and keys of suspected parties remain P3 on the host; participants receive only the reason category and the signed void statement.
      - The void statement is the host's finding under its policy; it names no individual, and the UI says it is not a court ruling.
      - Abuse of the review process by moderators is limited by the two-moderator rule, conflict checks, audit entries and the participants' ability to choose another host.
      - The module registers ExportSectionPort (operator section auctions.reviews; user section auctions.voids with received void and rescission statements), DeletionPort and RetentionPurgePort with F10 (N6), annotates fields with their F10.S02.M02 class, and pseudonymizes moderator and subject keys on deletion.
    data:
      - "AuctionReview: P3 host-only; evidence snapshots per F12.S01.M02."
      - "Void and rescission statements: P2 to participants, signed by the host; reason category only."
    retention:
      - "Reviews and evidence snapshots: RET-EVIDENCE per host policy (default 2 years); void and rescission statements kept 2 years in participant vaults."
    threats:
      - "T01 | Rogue moderator voids a competitor's sale | two different moderators required, conflict-of-interest block including linked keys, audit entry for every allow and deny, and no vault applies a void over an acknowledged or final payment"
      - "T02 | Mass false reports to trigger reviews | reports alone open at normal priority only, reviewers see reporter reputation, one open review per auction with merged triggers, report abuse limits in F12"
      - "T03 | Void statement forged to cancel a legitimate sale | signature check against the host key in the auction terms, wrong key is quarantined, cid binds auction and result"
      - "T04 | Disclosure of suspected party's linked keys | evidence stays on the host, participants get only a reason category; subjectKeys exist only in the host-local event"
      - "T05 | Retaliatory voiding after a bad review of the host | host operator is not a party; participants can leave the host; voiding needs evidence snapshot and findings visible to a second moderator; the void is appealable through its EnforcementAction"
      - "T06 | Void used as a relay command over a user's Deal | the void is a finding; it never cancels a Deal, which needs every party's signed cancel (F09), and vaults decide how it applies"
    abuse_controls:
      - "Host operator alert when a moderator proposes more than 5 voids in 24 hours."
      - "Appeals via F12.S01.M03 are linked to the review through enforcementActionId and the outcome is recorded."
  observability_performance:
    requirements:
      - The host exports metrics and logs per OBS-1 to OBS-6 without evidence content or keys; the PWA sends no telemetry (OBS-7).
      - Review open and decision commands meet p95 ≤ 300 ms excluding the evidence snapshot, which completes within 5 s for ledgers of 5 000 entries.
      - The queue query meets p95 ≤ 150 ms for 50 items.
    metrics:
      - "classrup_auctions_reviews_total{status,trigger}"
      - "classrup_auctions_review_age_seconds (gauge: oldest unassigned review)"
      - "classrup_auctions_voids_total{reason} and classrup_auctions_void_rescissions_total"
    logs:
      - "info review.closed {reviewId, auctionId, decision, correlationId} - no findings text and no keys."
    budgets:
      - "decision commands p95 ≤ 300 ms; evidence snapshot ≤ 5 s for 5 000 ledger entries; queue p95 ≤ 150 ms."
      - "Void statement fan-out to 500 participants queued within 2 s."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - The two-moderator rule, conflict checks and voidability are covered by deterministic unit and integration tests.
      - Contract tests validate review events, the void statement and its signature checks in vaults.
    fixtures: "Host H; auction A sold to B1 with Deal awaiting payment; moderators M1, M2, M3 on H and M4 whose identity document lists a key of B2; seller S; bidders B1, B2; shill flags for B1 (score 90) and B2 (score 88); fixed clock 2026-11-13T10:00:00Z."
    tests:
      - "T01 | integration | 01.R01,04.R01,04.R03 | shill score 90 event and a report on the auction's listing | one review opened with both triggers merged at high priority; auctions.review.opened emitted twice with the full triggers list"
      - "T02 | unit | 02.R01,02.R02,02.R03 | each rule V01–V09 violated; void on an unsold result, a voided result and a result closed 61 days ago | documented code returned and nothing stored; assignee conflict refused"
      - "T03 | unit | 03.R01,03.R02,02.R02 | propose by M1, confirm by M1, confirm by M2 after 73 hours, confirm by M2 within 72 hours | second and third refused or lapsed; fourth voids and signs"
      - "T04 | integration | 06.R04,04.R02 | vault-side race - in the winner vault a payment acknowledgement and the void statement arrive concurrently; in the seller vault the void arrives first | the local transaction that commits first decides; acknowledgement first gives void_after_payment with no state change; void first gives voided with the Deal kept; the host issued the same void in both cases and took no lock"
      - "T05 | property | 03.R01 | random command sequences on one review | only declared transitions succeed; voided and dismissed never change"
      - "T06 | contract | 04.R01,09.R02 | each command, event and the void and rescission statements | payloads and signatures validate against registry schemas; vault rejects a wrong host key with AUCTIONS_RESULT_INVALID"
      - "T07 | integration | 04.R02,06.R01 | open auction cancel_auction then dismiss | auction cancelled through apply_cancel with host_policy, bids void, review closed once"
      - "T08 | abuse | 05.R01,05.R02,05.R03 | seller, bidder and non-moderator call decisions; moderator who is a bidder is assigned | FORBIDDEN or NOT_FOUND; no state change"
      - "T09 | integration | 06.R03,09.R03 | void delivery dropped, duplicated and reordered by hostile relay | vaults converge on the void; duplicates skipped; second-chance offer withdrawn"
      - "T10 | abuse | 07.R01,07.R02,07.R03,01.R02 | inspect participant notices, logs, public projection, user exports | only reason category in notices; no evidence, findings or keys elsewhere; statement says host finding, not a ruling"
      - "T11 | abuse | 07.R03 | moderator proposes 6 voids in 24 hours | operator alert fired on the 6th"
      - "T12 | load | 08.R02,08.R03 | 5 000 entry ledger snapshot and fan-out to 500 participants | snapshot ≤ 5 s, decision p95 ≤ 300 ms, fan-out ≤ 2 s"
      - "T13 | unit | 09.R01 | traceability tool run | every PS-037 requirement maps to a passing test"
      - "T14 | integration | 10.R01,10.R02,10.R03 | operator export, restore host backup | reviews round-trip; unique open-review index preserved; user exports contain no review data"
      - "T15 | e2e | 03.R03 | two moderators in two browsers void a sale; bidder and seller vaults open the notice | statuses correct on all four; auctions.review.closed and auctions.result.voided in one host transaction; notice has no names and says the Deal stays until both cancel; axe zero serious issues"
      - "T16 | chaos | 06.R02 | F12.S02.M01 fails during confirm; crash after statement signing before commit | review stays void_proposed; no void statement delivered, no EnforcementAction, host result row unchanged"
      - "T17 | abuse | 05.R02,02.R01 | M4, whose key F04.S02.M01 links to bidder B2, tries to assign, propose and confirm | FORBIDDEN each time"
      - "T18 | integration | 01.R03 | review assigned, then new bids, a listing edit and an extension arrive | snapshots of target types listing and bid and the frozen ledger head, extension cids and result cid are unchanged"
      - "T19 | integration | 04.R05,03.R04 | void confirmed; seller appeals; appeal overturned; on a second auction an appeal decided reduced; a vault-origin copy of moderation.appeal.decided | record_host_policy called with source auction_review, hostRef reviewId and both moderators, actionId and caseId stored; overturned matched on actionId with origin relay, rescission statement issued, shown as advisory, review stays voided; reduced stores appealReducedTo and signs no rescission; the vault-origin copy is ignored"
      - "T20 | integration | 04.R04 | void issued in an auction where the seller and two bidders set pushOptIn; registry lookup | dispatch called once per opted-in recipient with template key and reference only; void and rescission roles resolve to the host key"
      - "T21 | integration | 04.R03 | moderation.report.received with targetType auction, listing and bid for a hosted auction, the same receiptId twice, and one for an unrelated listing; a moderation.report.filed event | the three open or merge report triggers with ref receiptId and add their snapshotIds to the auction's review; the duplicate receipt is skipped; the unrelated report and the vault-local filed event are ignored"
      - "T22 | integration | 07.R04 | operator export, user export, deletion of a moderator and a subject | reviews only in the operator export; the user export carries auctions.voids; keys pseudonymized"
      - "T23 | e2e | 08.R01 | network capture of a participant PWA receiving the void notice | zero telemetry or analytics requests"
      - "T24 | integration | 01.R01 | flagged bidders B1 and B2; findings confirm only B1 | auctions.review.closed lists only B1's checkId in confirmedCheckIds; the host-local voided event carries subjectKeys [B1] and the void statement names nobody"
    acceptance:
      - All tests T01–T24 pass in CI.
      - No result is voided without two different moderators, and no vault applies a void over an acknowledged or final payment.
      - Participants only ever see a reason category and a host-signed statement, never evidence or other parties' keys.
      - Every void is appealable through its EnforcementAction, and a successful appeal is shown as an advisory host-signed rescission.
  import_export_backup_rollback:
    requirements:
      - Reviews and evidence are host operator data exported only in the operator audit export; user vault exports contain only the void and rescission statements they received.
      - Import of an operator audit export validates ids, schema version and statement signatures and restores reviews as read-only history.
      - Schema changes follow expand and contract and keep v1 readable for 180 days.
    export: "Section auctions.reviews in the host operator export (classrup-export/v1, operator scope); user exports carry only received void and rescission statements under auctions.voids."
    import: "Reviews import as read-only history; reviews that were open import as opened and must be re-assigned; void and rescission statements import after signature verification."
    backup: "Host relay SQLite backup (IOX-3, IOX-7); vault export covers the received void and rescission statements."
    migration_rollback: "Additive optional fields only in v1; void reason and trigger kind enum values are append-only so rollback never loses a recorded reason."
