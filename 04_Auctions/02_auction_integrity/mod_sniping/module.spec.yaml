id: F04.S02.M02
scope: MVP
summary: >-
  Soft close on the host relay. Every accepted bid with a visible amount placed by a bidder in the final 2 minutes (120 000 ms,
  inclusive) of an auction moves the end 2 minutes later, up to 30 extensions, so the end can move by at most 60 minutes in total.
  This removes the last-second advantage of a hard close; field evidence on eBay (hard close) and Amazon (soft close) auctions found
  far more last-minute bidding under a hard close (Roth and Ockenfels, 2002, American Economic Review 92(4)). Soft close reduces but
  does not eliminate strategic late bidding, so the cap guarantees that every auction ends. The constants are rules version
  softclose-v1, which the seller signs in the auction terms and the host echoes in its acceptance. The extension decision runs inside
  the bid transaction under the per-auction lease on the host, and every extension is a host-signed statement that bidders receive
  in their bid receipts and verify against the terms they hold.
responsibilities:
  - Own the Extension record - one immutable row per extension - and the statement classrup.auctions.extension/v1 signed by the host key.
  - Decide in the bid transaction whether an accepted bid qualifies - host time within 120 000 ms before currentEndsAt, strictly before the end, kind manual or proxy with a visible amount submitted by a bidder, extensionCount below 30.
  - Update currentEndsAt through F04.S01.M01 adjust_end with compare-and-set on extensionCount and the fence token, and emit auctions.auction.extended.
  - Expose the rule constants and the extension history publicly so that bidders can predict and audit the end time, and verify received extensions in vaults against the softCloseRulesVersion of the terms.
non_responsibilities:
  - Bid acceptance and ordering (F04.S01.M02) and closing (F04.S01.M03); this module only decides and records extensions.
  - Per-auction tuning of the window; the constants are fixed in rules version softclose-v1.
  - Client countdown rendering beyond using host time offsets (shared UX in F14).
  - "Future: per-seller configurable windows and extensions proportional to bid activity."
depends_on: [F04.S01.M01, F11.S01.M01, F11.S01.M03, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, F13.S02.M01, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-PRV-001, CTR-FED-001]
user_stories:
  - As a bidder, I see that the auction can extend, how many extensions are left and the end time from the host's clock.
  - As a bidder who was outbid in the last two minutes, I get time to respond because the end moved.
  - As a seller, I know the auction can end up to 60 minutes after the scheduled end but never later.
edge_cases:
  - A bid lands when exactly 120 000 ms remain; it qualifies. At 120 001 ms remaining it does not.
  - A bid lands with 30 ms remaining and a second one 50 ms later; the first moves the end by 120 000 ms, so the second arrives with 119 980 ms remaining and extends again from the moved end; had the first bid landed with 60 000 ms remaining, the second would arrive with 179 950 ms remaining and not extend.
  - The 30th extension has been used; later bids in the window are still accepted but do not extend, and the UI shows final extension used.
  - A proxy auto-raise generated by the host after a bid, or a max-only update that changes no visible amount, does not extend by itself; only the triggering bidder-submitted bid with a visible amount counts.
  - A bid is rejected for a low amount inside the window; no extension is created.
  - A retraction inside the window is refused by the bid module anyway (more than 12 h rule), and a retraction never extends.
  - Host clock moves backward by an NTP step; the host keeps hostTime non-decreasing and uses the max of its clock and the last ledger time, so remaining time never grows because of a clock step.
  - Bidder's phone shows the old end time; the bid receipt carries the host-signed extension and the new currentEndsAt, and the UI updates from the receipt and the public history.
  - A host signs an extension with other constants or another rulesVersion than the terms' softCloseRulesVersion; vaults quarantine it with AUCTIONS_EXTENSION_INVALID and keep the last verified end time.
ux:
  screens:
    - "Countdown on the auction page: host-time based, text such as ends at 10:02 (may extend by 2 minutes per late bid, 28 of 30 extensions left, rules softclose-v1)."
    - "Extension notice toast and history list: each extension with time, new end and triggering sequence number."
    - "Bid receipt view: shows the end time after the bid and whether this bid extended the auction."
  states: [loading, running, in-final-window, extended, final-extension-used, closed]
  a11y:
    - Extension notices are announced once through an aria-live polite region with the new end time as text.
    - The countdown is exposed as text updated at most every 10 s, and every 15 s inside the last minute.
    - Remaining extensions are a text count, not only a progress graphic.
processes:
  domain_schema:
    requirements:
      - An Extension stores auction, sequence number 1 to 30, the triggering bid sequence, previous and new end, host time and the host signature, with revision per CTR-ID-001.
      - Extensions are public P0 because bidders must be able to audit the end time; they contain no bidder identity or key.
      - The rule constants (window 120 000 ms, extension 120 000 ms, maximum 30) are rules version softclose-v1, which the seller signs as softCloseRulesVersion in the auction terms and the host echoes in host_acceptance (F04.S01.M01), so they cannot change during a running auction.
    entities:
      - name: Extension
        schema: classrup.auctions.extension/v1
        storage: relay+device
        privacy: P0
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — host relay tenant scope"
          - "auctionId: uuidv7 — ref F04.S01.M01 Auction"
          - "termsCid: string — cid of the auction terms whose softCloseRulesVersion applies"
          - "seq: int — 1..30; unique per auction; consecutive"
          - "triggerBidSeq: int — ledger sequence of the qualifying bid"
          - "previousEndsAt: timestamp — RFC 3339 UTC"
          - "newEndsAt: timestamp — equals previousEndsAt plus 120000 ms"
          - "hostTime: timestamp — host clock at decision; non-decreasing"
          - "rulesVersion: string — fixed value softclose-v1; must equal the terms' softCloseRulesVersion"
          - "hostSignature: string — Ed25519 host signature over JCS of the payload"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - seq values of one auction are consecutive from 1 and never exceed 30.
          - newEndsAt minus previousEndsAt is exactly 120000 ms and previousEndsAt minus hostTime is between 0 exclusive and 120000 ms inclusive.
          - The sum of extensions of one auction never exceeds 3 600 000 ms.
          - rulesVersion equals the softCloseRulesVersion signed in the auction terms and echoed in host_acceptance.
    sql: |
      CREATE TABLE auctions_extension (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, auction_id TEXT NOT NULL, seq INTEGER NOT NULL, trigger_bid_seq INTEGER NOT NULL,
        previous_ends_at TEXT NOT NULL, new_ends_at TEXT NOT NULL, host_time TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX auctions_extension_seq ON auctions_extension(tenant_id, auction_id, seq);
  validation_rules:
    requirements:
      - The qualification test uses only host-side data - host time, currentEndsAt, extensionCount and the kind of the triggering entry - never client-claimed times.
      - Extension application is a compare-and-set against extensionCount so concurrent paths cannot exceed the cap.
      - Every violation maps to one stable error code; non-qualifying bids are not errors for the bidder.
      - Vaults verify each extension's rulesVersion against the softCloseRulesVersion of the auction terms they hold, and its signature, sequence and previous end, and quarantine any extension that fails.
    rules:
      - "V01 | triggering entry is a bidder-submitted manual or proxy bid with a visible amount that the host accepted; auto entries, max-only updates and retractions never qualify | AUCTIONS_EXTENSION_NOT_QUALIFIED"
      - "V02 | host time is strictly before currentEndsAt and at most 120000 ms before it | AUCTIONS_EXTENSION_NOT_QUALIFIED"
      - "V03 | extensionCount is below 30 | AUCTIONS_EXTENSION_LIMIT"
      - "V04 | expectedExtensionCount equals the stored extensionCount at write time | CONFLICT_REVISION"
      - "V05 | auction status is open | CONFLICT_STATE"
      - "V06 | vault - the extension's rulesVersion equals the terms' softCloseRulesVersion, its signature verifies against hostKeyId, seq is the next expected, previousEndsAt equals the last verified end and newEndsAt is previousEndsAt plus 120000 ms | AUCTIONS_EXTENSION_INVALID"
  workflow_state_machine:
    requirements:
      - Extensions are immutable facts; there is no lifecycle beyond creation, so no state machine applies.
      - The only effect of an extension is a new currentEndsAt on the auction, applied in the same transaction.
      - Closing re-reads currentEndsAt under the lease, so an extension committed before the lease is always honoured.
    machines: []
    note: "Extension rows are append-only facts created once and never changed; the auction lifecycle is owned by F04.S01.M01."
    timeouts: []
  commands_queries_events:
    requirements:
      - The host relay exposes auctions.extension.apply as an internal command called from the bid transaction; it is not callable by vaults.
      - Anyone can read the extension history through a public query; vaults derive auctions.auction.extended locally when the host-signed extension arrives, embedded in the bid receipt (F04.S01.M02 extension field) or fetched from the history, and ingested with auctions.extension.receive.
      - The module consumes the auction closed event to stop applying extensions and nothing else on the host.
      - classrup.auctions.extension/v1 is registered with F11.S01.M01 with signer role host key named in the terms (N2), and the host calls notify.notification.dispatch for a content-free push to the seller and to bidders with pushOptIn on each extension, collapsed per auction (N17).
    note: "Statement classrup.auctions.extension/v1 (host key) {auctionId, termsCid, seq, triggerBidSeq, previousEndsAt, newEndsAt, hostTime, rulesVersion}. Execution sites: apply runs inside the host bid transaction; receive, list (from cache) and preview run in vaults."
    commands:
      - name: auctions.extension.apply
        capability: auctions.extension.apply
        input: "[relay internal, called inside the bid transaction under the auction lease] { auctionId, triggerBidSeq, triggerKind, hasVisibleAmount, hostTime, fenceToken }"
        output: "{ extended: boolean, seq?, newEndsAt?, extensionsLeft, extension?: statement classrup.auctions.extension/v1 }"
        errors: [NOT_FOUND, CONFLICT_STATE, CONFLICT_REVISION, PRECONDITION_FAILED]
        emits: [auctions.auction.extended]
        idempotent: true
      - name: auctions.extension.receive
        capability: auctions.extension.receive
        input: "[vault-local ingestion of a host-signed extension envelope from a bid receipt or the history] { envelope, via? }"
        output: "{ accepted: boolean, quarantined?: boolean, code?, currentEndsAt }"
        errors: [AUCTIONS_EXTENSION_INVALID, UNSUPPORTED_SCHEMA_VERSION, NOT_FOUND]
        emits: [auctions.auction.extended]
        idempotent: true
    queries:
      - name: auctions.extension.list
        capability: auctions.extension.read_public
        input: "{ auctionId } (relay query or vault cache of host-signed extensions)"
        output: "{ items: Extension[] ordered by seq, extensionsLeft, rulesVersion }"
        errors: [NOT_FOUND]
      - name: auctions.extension.preview
        capability: auctions.extension.read_public
        input: "{ auctionId, hostTime? }"
        output: "{ inFinalWindow: boolean, remainingMs, wouldExtendTo?: timestamp, extensionsLeft }"
        errors: [NOT_FOUND]
    events_produced:
      - {type: auctions.auction.extended, privacy: P0, payload: "{ auctionId, seq, triggerBidSeq, previousEndsAt, newEndsAt, extensionsLeft, hostTime }"}
    events_consumed:
      - {type: auctions.auction.closed, effect: "stop applying extensions and mark the history final in the vault cache"}
      - {type: privacy.deletion.completed, effect: "delete the cached extension histories held for the erased principal's auctions; extensions carry no DIDs, so nothing is pseudonymized"}
    errors:
      - "AUCTIONS_EXTENSION_NOT_QUALIFIED | 409 | no | the entry does not qualify for an extension; internal, not shown to bidders"
      - "AUCTIONS_EXTENSION_LIMIT | 409 | no | 30 extensions have been used; internal, not shown to bidders"
      - "AUCTIONS_EXTENSION_INVALID | 422 | no | an extension failed the signature, rules version, sequence or previous-end check in a vault; quarantined"
    example: |
      host bid transaction at hostTime 2026-11-12T09:58:30.100Z, currentEndsAt 2026-11-12T10:00:00.000Z, extensionCount 0
      auctions.extension.apply { "auctionId": "0192f400-0002-…", "triggerBidSeq": 42, "triggerKind": "manual", "hasVisibleAmount": true, "hostTime": "2026-11-12T09:58:30.100Z", "fenceToken": 812 }
      -> { "extended": true, "seq": 1, "newEndsAt": "2026-11-12T10:02:00.000Z", "extensionsLeft": 29 }
      bid receipt carries the extension; bidder vault: auctions.extension.receive -> rulesVersion softclose-v1 equals the terms -> auctions.auction.extended
  authorization_capabilities:
    requirements:
      - Relay policy - apply is system-only inside the bid transaction on the host that owns the auction; no principal and no relay access token can call it.
      - Reading extensions and previews needs no capability beyond a public read; they contain no personal data.
      - Vaults never create extensions; a vault that receives an extension verifies the host signature against the host key in the auction terms and the rules version against the terms, and quarantines mismatches.
    capabilities:
      - "auctions.extension.apply | system | called inside a bid transaction holding the auction lease with fencing token"
      - "auctions.extension.receive | principal | any envelope; acceptance depends on the host key and softCloseRulesVersion in the terms held by the vault"
      - "auctions.extension.read_public | anonymous, principal | any auction"
  failure_recovery_idempotency:
    requirements:
      - Apply is idempotent per auction and triggering bid sequence, so a repeated call returns the existing extension and never adds a second.
      - Extension row, adjust_end and the bid ledger entry commit in the same SQLite transaction; a crash leaves none of them.
      - Concurrent apply attempts are impossible inside the lease and are additionally prevented by the unique (auction, seq) index and the compare-and-set on extensionCount.
    idempotency: "Unique (tenant, auction, triggerBidSeq) via the unique seq index plus a stored triggerBidSeq lookup; repeated apply returns the stored result; vault receive dedupes on statement cid."
    concurrency: "Runs only under the per-auction lease with BEGIN IMMEDIATE on the host (IDM-8); adjust_end uses compare-and-set on extensionCount and the fence token; a stale fencing token is refused by the bid path before apply is reached."
    retries: "No retries inside the transaction; if the bid transaction fails, the bid is retried by the bidder with the same nonce before its notAfter and the extension is decided again from scratch."
    offline: "Not applicable on the host; vaults show the last verified end time and mark it as last known when the host is unreachable."
    partial_failure: "If apply fails the whole bid transaction fails with DEPENDENCY_UNAVAILABLE, so a bid is never accepted without its extension decision."
  privacy_retention_abuse:
    requirements:
      - Extensions are public and contain no identities, so there is no privacy cost beyond the bid timing already public in the ledger.
      - Manipulation by repeated late bids to keep an auction open is bounded by the cap of 30 extensions and the increment rules.
      - The rule constants are public and versioned, the version is signed in the terms and echoed in the host acceptance, and vaults reject extensions under any other version, so hosts cannot change them mid-auction.
      - The module registers ExportSectionPort (section auctions.extensions), DeletionPort and RetentionPurgePort with F10 (N6) and annotates every Extension field P0 in F10.S02.M02; extensions hold no DIDs, so deletion removes cached histories and pseudonymizes nothing.
    data:
      - "Extension: P0 public, signed by the host."
    retention:
      - "Extensions: RET-EVIDENCE (2 years) in participant vault caches; host keeps them for its published retention, default 90 days after close."
    threats:
      - "T01 | Bidders or a seller's accomplice keep the auction open with minimum bids | hard cap of 30 extensions (60 minutes), each bid must beat the increment, shill scoring watches alternation"
      - "T02 | Host extends or refuses to extend selectively | rules are deterministic and public, each extension is signed and numbered, bidders can compare the end time in receipts with the rule; a deviation is exportable evidence"
      - "T03 | Client clock manipulation to appear to bid in the window | only host time counts; client times are ignored by the qualification test"
      - "T04 | Replay of an extension statement for another auction | statement binds auction id, terms cid, sequence and previous end; verification rejects mismatches"
      - "T05 | Host changes the constants mid-auction | the version is signed in the terms and echoed in host_acceptance; vaults quarantine extensions with another rulesVersion or other constants (V06)"
    abuse_controls:
      - "Bid rate limits from F04.S01.M02 apply (10 per minute per bidder per auction)."
      - "A host alert fires when an auction uses 25 or more extensions."
  observability_performance:
    requirements:
      - The host exports metrics and logs per OBS-1 to OBS-6; the PWA sends no telemetry (OBS-7).
      - Apply adds at most 5 ms to the p95 of the bid transaction.
      - The extension history is cacheable and meets p95 ≤ 50 ms.
    metrics:
      - "classrup_auctions_extensions_total"
      - "classrup_auctions_extensions_per_auction (histogram at close)"
      - "classrup_auctions_extension_cap_reached_total"
      - "classrup_auctions_extension_quarantined_total (vault local counter)"
    logs:
      - "info auction.extended {auctionId, seq, correlationId} on the host - no bidder data."
    budgets:
      - "apply p95 ≤ 5 ms inside the bid transaction; extension list p95 ≤ 50 ms for 30 rows."
      - "Property test of 100 000 bid sequences completes in ≤ 60 s in CI."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Boundary and cap behaviour is covered by deterministic unit tests and by a property test against a reference model.
      - Contract tests validate the extension statement and event, and the host-signature check in vaults.
    fixtures: "Host H with injectable clock; auction A ending 2026-11-12T10:00:00Z with terms softCloseRulesVersion softclose-v1; bidders B1, B2; fixed clock 2026-11-12T09:50:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,02.R01,02.R02 | bids with 120001, 120000, 1 and 0 ms remaining | 120001 no; 120000 yes; 1 yes; 0 refused by bid path with AUCTIONS_NOT_OPEN, no extension"
      - "T02 | unit | 02.R03,01.R03 | extensionCount 29 then 30 and a bid in window | 30th extension created; next qualifying bid accepted without extension; constants equal softclose-v1"
      - "T03 | property | 01.R02,03.R02 | random bid times and kinds against reference model for 100 000 sequences | end time equals model; total extension ≤ 3 600 000 ms; seq consecutive"
      - "T04 | unit | 02.R01,03.R01 | proxy auto entry, max-only update, retraction, rejected bid and manual bid in window | only the manual bid extends"
      - "T05 | integration | 03.R03,06.R01 | extension commits before close lease; close worker started earlier | close re-reads end under lease and releases without closing"
      - "T06 | chaos | 06.R02,06.R03 | crash between extension insert and adjust_end; fail adjust_end | whole bid transaction rolls back; no extension row; bid not accepted"
      - "T07 | integration | 02.R03,06.R03,04.R01 | first bid with 30 ms remaining and a second 50 ms later; first bid with 60 000 ms remaining and a second 50 ms later | two extensions, the second at 119 980 ms remaining counted from the moved end; one extension, the second bid at 179 950 ms remaining does not extend; unique seq holds"
      - "T08 | contract | 04.R02,04.R03,09.R02,09.R03,02.R04 | apply, receive, list, preview, event and statement; auction terms and host acceptance; receipt of an extending bid | payloads and signatures validate; terms carry softCloseRulesVersion softclose-v1 and host_acceptance echoes it; the receipt carries the extension; the vault rejects a wrong host key, a wrong previous end or another rulesVersion with AUCTIONS_EXTENSION_INVALID"
      - "T09 | abuse | 05.R01,05.R02,05.R03 | vault or principal calls apply; forged extension statement | FORBIDDEN or quarantine; end time unchanged"
      - "T10 | integration | 02.R01 | clock step backwards and forged client times | hostTime stays non-decreasing; client time ignored"
      - "T11 | abuse | 07.R02,01.R01 | adversary bids minimum increments every 100 ms in each window | auction ends at scheduledEnd plus at most 60 minutes; alert at 25 extensions"
      - "T12 | load | 08.R02,08.R03 | 20 bids per second on one hot auction for 5 minutes | apply adds ≤ 5 ms p95; list p95 ≤ 50 ms"
      - "T13 | unit | 09.R01 | traceability tool run | every PS-038 requirement maps to a passing test"
      - "T14 | integration | 10.R01,10.R02,10.R03 | export history, import into fresh vault, restore host backup | extensions round-trip; signature chain verifies; unique seq preserved"
      - "T15 | e2e | 01.R03,03.R01 | mobile bidder watches countdown through two extensions | countdown follows host time, extension toasts announced, axe zero serious issues"
      - "T16 | contract | 07.R01,01.R02 | schema check of Extension, its statement and its event | no field holds a DID, key, alias or bidder reference"
      - "T17 | integration | 07.R03 | host signs an extension with a 180 000 ms window, and one with rulesVersion softclose-v2, in a softclose-v1 auction | vaults quarantine both with AUCTIONS_EXTENSION_INVALID and keep the last verified end"
      - "T18 | e2e | 08.R01 | network capture of the PWA watching the countdown through extensions | zero telemetry or analytics requests"
      - "T19 | integration | 04.R04 | extension of an auction where B1 and the seller set pushOptIn; registry lookup | dispatch called once per recipient with template key and reference only, collapsed per auction; registry role is the host key"
      - "T20 | integration | 07.R04 | export and account deletion | section auctions.extensions present; cached histories deleted; nothing to pseudonymize"
    acceptance:
      - All tests T01–T20 pass in CI.
      - No auction ever ends later than its scheduled end plus 60 minutes.
      - Every end-time change is a host-signed numbered extension that bidders can verify against the rules version in the terms.
  import_export_backup_rollback:
    requirements:
      - Vault exports carry the extension history for auctions the user took part in, with host signatures.
      - Import verifies each signature against the host key, the rules version against the terms and the contiguity of seq; broken histories are kept as read-only history with a warning.
      - Schema changes follow expand and contract and keep v1 readable for 180 days.
    export: "Section auctions.extensions in classrup-export/v1; one line per Extension with the signed envelope."
    import: "Verified extensions import as history; extensions of auctions still open import read-only until the host confirms current state."
    backup: "The vault export is the primary backup (IOX-6); the host uses relay SQLite backup (IOX-3, IOX-7) and verifies seq contiguity after restore."
    migration_rollback: "Additive optional fields only in v1; rules version softclose-v1 is frozen so rollback never changes end-time semantics."
