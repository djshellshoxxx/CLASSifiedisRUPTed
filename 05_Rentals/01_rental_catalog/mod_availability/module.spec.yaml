  import_export_backup_rollback:
    requirements:
      - The vault export contains offerings, reservations and all signed statements with their cids so evidence survives vault loss.
      - Import verifies every signature and cid before restoring; unverifiable items stay read-only history; overlap is re-validated for confirmed reservations and violations are frozen.
      - Schema changes follow expand and contract and keep v1 readable for 180 days.
    export: "Section rentals.reservations in classrup-export/v1 with offering, reservation lines and the original statement envelopes."
    import: "Verified terminal records import as history; requested reservations import as expired so no stale claim is restored; confirmed, in_use and overdue reservations import as is after the overlap re-check."
    backup: "The vault export is the primary backup (IOX-6); relays hold only ciphertext mailboxes and signed public projections (IOX-7)."
    migration_rollback: "Additive optional fields only in v1; rollback is safe because statements are immutable and older readers ignore unknown fields."
