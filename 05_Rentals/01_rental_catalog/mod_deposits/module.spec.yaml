  import_export_backup_rollback:
    requirements:
      - The vault export contains deposit terms, payment context references and all signed statements with their cids so evidence survives vault loss.
      - Import verifies every signature and cid before restoring; unverifiable items stay read-only history.
      - Schema changes follow expand and contract and keep v1 readable for 180 days.
    export: "Section rentals.deposits in classrup-export/v1; one line per DepositTerms with the original statement envelopes."
    import: "Terminal deposits import as history; proposed terms import as expired; funded, release_pending, forfeit_claimed and disputed deposits import as is and resume their clocks from the stored times."
    backup: "The vault export is the primary backup (IOX-6); relays hold only ciphertext (IOX-7)."
    migration_rollback: "Additive optional fields only in v1; rollback is safe because statements are immutable and older readers ignore unknown fields."
