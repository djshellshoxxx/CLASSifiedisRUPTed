id: F06.S01.M03
scope: MVP
summary: >-
  Pure, isomorphic library that defines the typed search filter object (category, listing kind, price range per
  currency, condition, distance bucket, barter-acceptable, in-stock, condition accepted by a wanted listing,
  posted-within), validates it, and compiles it into a
  parameterized SQL fragment over the SearchDocument columns. The same code runs in the vault and on a relay, so
  filters mean the same thing everywhere. It owns no data and sends nothing.
responsibilities:
  - Define the Filter schema with exact ranges and limits and reject unknown keys.
  - Compile a validated filter to a WHERE fragment with bound parameters only; no value is ever concatenated into SQL.
  - Map distance filters to cell sets through F06.S02.M01 and never to numeric distances, compiling mixed precision correctly - precision-5 cells against geo_cell, precision-4 cells against the stored geo_cell4 column - so 50 and 100 km filters and L1 (4-character) documents match.
  - Provide a canonical form (sorted keys, normalized values) used for cache keys and saved search equality.
  - Filter on the barterAcceptable, inStock and want.minCondition values that F06.S01.M01 copies from the signed listing projection into the barter, in_stock and want_min_condition columns.
non_responsibilities:
  - Running queries, ranking and pagination (F06.S01.M02, F06.S03.M01).
  - Owning the category taxonomy (F18 governance catalog) and currency registry (F09.S03.M01); the library receives them as read ports.
  - "Future: attribute filters per category (size, brand), multi-currency price range with FX conversion."
depends_on: [F06.S02.M01, CTR-ID-001, CTR-ERR-001, CTR-SCH-001, CTR-PRV-001, CTR-MNY-001, CTR-TST-001]
user_stories:
  - As a buyer, I filter to a category, a maximum price in EUR and items posted in the last 7 days.
  - As a buyer, I filter to results within 10 km and see only distance buckets, never exact distances.
  - As a developer, I use one filter definition for both the vault index and the relay index.
edge_cases:
  - priceMin is greater than priceMax; the filter is rejected with DISCOVERY_FILTER_INVALID.
  - A price filter has no currency; rejected with DISCOVERY_FILTER_CURRENCY_REQUIRED because amounts in different currencies are never compared.
  - A distance filter is given without a search center; rejected with DISCOVERY_FILTER_CENTER_REQUIRED.
  - A filter lists 11 categories or contains an unknown key; rejected, never silently truncated.
  - Category has descendants in the taxonomy; the filter expands to at most 200 category ids and rejects larger expansions.
  - A string value contains SQL metacharacters; it is only ever a bound parameter.
  - A 50 or 100 km distance filter yields precision-4 cells; they compile to d.geo_cell4 IN (...) so L1 and L2 documents in those cells match instead of nothing.
  - A listing published at L1 (4-character cell) is filtered with 10 km around an L2 center; it is not matched because its position is coarser than the radius, and it is matched from 25 km upward.
  - distanceKm is 7 or 200; rejected with DISCOVERY_RADIUS_NOT_ALLOWED, while 3 is rejected with DISCOVERY_RADIUS_TOO_SMALL.
  - wantAcceptsCondition good is combined with listingKinds sell; nothing matches, because only wanted listings carry want_min_condition, and the filter is still valid.
  - inStock is given as the string "yes" or wantAcceptsCondition as "mint"; rejected with DISCOVERY_FILTER_INVALID.
ux:
  notes: Library module with no screens. Filter chips in the search screen (F06.S01.M02) render the canonical filter and show the localized label for each active filter with a remove button.
processes:
  domain_schema:
    requirements:
      - The Filter value object has a closed set of keys with typed ranges, and any unknown key is a validation failure.
      - Compilation output is a pair of SQL text and an ordered parameter array, with SQL text drawn only from a fixed set of fragments.
      - The canonical form of a filter is deterministic so equal filters produce equal cache keys and saved search comparisons.
      - Distance filters compile by cell precision - precision-5 cells match geo_cell exactly, precision-4 cells match the stored and indexed geo_cell4 column, and documents with a 4-character (L1) cell match only radii of 25 km or more.
      - The keys inStock (boolean, compiled to d.in_stock = ?) and wantAcceptsCondition (one condition value, compiled to d.want_min_condition IN (...) over the minimum conditions that accept an item of that condition) filter the columns F06.S01.M01 copies from the projection's inStock and want.minCondition, next to barterAcceptable (d.barter = ?).
    entities: []
    note: >-
      Library module. It defines the Filter value object (schema classrup.discovery.filter/v1, embedded in queries and
      SavedSearch) but owns no persisted entity. Keys - categoryIds (1..10), listingKinds (1..6 of sell, wanted, giveaway,
      service, rental, auction), price {currency, min?, max?} in integer minor units 0..1 000 000 000 000, conditions
      (1..6 of new, like_new, good, fair, poor, for_parts, matching F01.S01.M01 and the F06.S01.M01 index), distanceKm
      (one of 5, 10, 25, 50, 100) with a center cell of 4 or 5 characters, barterAcceptable (boolean, d.barter = ?),
      inStock (boolean, d.in_stock = ?), wantAcceptsCondition (one condition value; the condition order from best to
      worst is new, like_new, good, fair, poor, for_parts, and a want accepts an item at its minCondition or better, so
      the value compiles to d.want_min_condition IN (the value and every worse value), for example good gives good, fair,
      poor and for_parts; only wanted listings carry want_min_condition), postedWithin (one of 24h, 7d, 30d). Distance
      compile rule over cellsForRadius(center, distanceKm) from F06.S02.M01 - 5 and 10 km give
      precision-5 cells C5 compiled to d.geo_cell IN (C5); 25 km gives precision-5 cells C5 compiled to (d.geo_cell IN
      (C5) OR (length(d.geo_cell) = 4 AND d.geo_cell IN (P4))) where P4 are the distinct 4-character prefixes of C5;
      50 and 100 km give precision-4 cells C4 compiled to d.geo_cell4 IN (C4), served by index discovery_doc_cell4.
  validation_rules:
    requirements:
      - Validation is strict and total - every key, range and combination is checked before compilation.
      - Combination rules prevent meaningless filters, such as prices without a currency and distances without a center.
      - Each violation maps to one stable error code with the offending path in fields.
    rules:
      - "V01 | filter has only known keys and every list is non-empty and within its maximum length | DISCOVERY_FILTER_INVALID"
      - "V02 | price.min and price.max are integers within 0..1 000 000 000 000 and min is not greater than max | DISCOVERY_FILTER_INVALID"
      - "V03 | price filter carries a registered currency code | DISCOVERY_FILTER_CURRENCY_REQUIRED"
      - "V04 | distanceKm is at least 5 km (F06.S02.M01 V04) | DISCOVERY_RADIUS_TOO_SMALL"
      - "V05 | distanceKm is accompanied by a center cell of 4 or 5 characters or a stored home cell | DISCOVERY_FILTER_CENTER_REQUIRED"
      - "V06 | category expansion yields at most 200 category ids | DISCOVERY_FILTER_INVALID"
      - "V07 | postedWithin is one of 24h, 7d, 30d and condition values are in the enum (new, like_new, good, fair, poor, for_parts) | DISCOVERY_FILTER_INVALID"
      - "V08 | distanceKm is one of the allowed radii 5, 10, 25, 50, 100 (F06.S02.M01 V06) | DISCOVERY_RADIUS_NOT_ALLOWED"
      - "V09 | the center cell passes F06.S02.M01 assertPublicCell (at most 5 characters) | DISCOVERY_PRECISION_FORBIDDEN"
      - "V10 | barterAcceptable and inStock are booleans and wantAcceptsCondition is one of new, like_new, good, fair, poor, for_parts | DISCOVERY_FILTER_INVALID"
  workflow_state_machine:
    requirements:
      - The library is stateless; validate and compile are pure functions with no lifecycle.
      - Identical input always yields identical output and identical parameter order.
      - Compilation never reads the clock; the caller passes now explicitly for postedWithin.
    machines: []
    note: Stateless library; there is no entity lifecycle. Functions - validateFilter(input, ports) returns Result, canonicalize(filter), compileFilter(filter, now) returns { sql, params }.
    timeouts: []
  commands_queries_events:
    requirements:
      - The module exposes functions only; it has no commands, queries or events.
      - Callers (F06.S01.M02, relay query handler) are responsible for capability checks and idempotency.
      - Error codes defined here are returned inside Result values and mapped by callers to HTTP problems; geo codes (DISCOVERY_RADIUS_TOO_SMALL, DISCOVERY_RADIUS_NOT_ALLOWED, DISCOVERY_PRECISION_FORBIDDEN) are defined once in F06.S02.M01 and only referenced here (N1).
    commands: []
    queries: []
    events_produced: []
    events_consumed: []
    note: >-
      Library module - no commands or queries; callers expose them. This module is the single owner of the filter
      codes (DISCOVERY_FILTER_INVALID, DISCOVERY_FILTER_CURRENCY_REQUIRED, DISCOVERY_FILTER_CENTER_REQUIRED);
      DISCOVERY_FILTER_CENTER_REQUIRED is specific to a distanceKm filter without a center, while a proximity query
      without a center uses DISCOVERY_CENTER_REQUIRED from F06.S02.M03, because the caller fixes them differently
      (add a center to the filter versus choose a browse area).
    errors:
      - "DISCOVERY_FILTER_INVALID | 422 | no | a filter value is out of range, of the wrong type or unknown"
      - "DISCOVERY_FILTER_CURRENCY_REQUIRED | 422 | no | price filter without a currency"
      - "DISCOVERY_FILTER_CENTER_REQUIRED | 422 | no | distance filter without a search center"
    example: |
      compileFilter({ listingKinds: ["sell"], price: { currency: "EUR", max: 30000 }, distanceKm: 10, center: "u4pru", postedWithin: "7d" }, now)
      -> { sql: "d.listing_kind IN (?) AND d.currency = ? AND d.price_minor <= ? AND d.geo_cell IN (?,?,?) AND d.first_seen_at >= ?",
           params: ["sell", "EUR", 30000, "u4pru", "u4prv", "u4prs", "2026-10-28T10:00:00.000Z"] }
      compileFilter({ distanceKm: 25, center: "u4pru" }, now)
      -> { sql: "(d.geo_cell IN (?,…) OR (length(d.geo_cell) = 4 AND d.geo_cell IN (?,…)))", params: [C5…, "u4pr", "u4px", …] }
      compileFilter({ distanceKm: 100, center: "u4pru" }, now)
      -> { sql: "d.geo_cell4 IN (?,…)", params: ["u4nz", "u4pr", "u4px", …] }
      compileFilter({ listingKinds: ["sell"], inStock: true, barterAcceptable: true }, now)
      -> { sql: "d.listing_kind IN (?) AND d.in_stock = ? AND d.barter = ?", params: ["sell", 1, 1] }
      compileFilter({ listingKinds: ["wanted"], wantAcceptsCondition: "good" }, now)
      -> { sql: "d.listing_kind IN (?) AND d.want_min_condition IN (?,?,?,?)", params: ["wanted", "good", "fair", "poor", "for_parts"] }
  authorization_capabilities:
    requirements:
      - The library performs no authorization; it is pure and may be called by any caller that is itself authorized.
      - Filters can only constrain public SearchDocument columns, so no filter can reach P1-P4 data.
      - No capability is defined by this module.
    capabilities: []
  failure_recovery_idempotency:
    requirements:
      - Functions are pure and deterministic, so retries and replays are inherently safe.
      - Invalid input never produces partial output; the result is either a full compiled fragment or an error.
      - Port failures (category or currency lookup) surface as DEPENDENCY_UNAVAILABLE without partial state.
    idempotency: "Pure functions; the same input always returns the same output."
    concurrency: "No shared state; safe to call concurrently from workers and tabs."
    retries: "Callers may retry port lookups with the client backoff of CTR-IDM-001 IDM-4; compilation itself is never retried."
    offline: "Works offline with the bundled category taxonomy and currency registry snapshot; stale snapshots only restrict which ids validate."
    partial_failure: "If the taxonomy snapshot is older than 30 days the filter still validates against it and the caller shows a 'categories may be out of date' hint."
  privacy_retention_abuse:
    requirements:
      - Filters touch only public columns and carry no personal data; they are stored only inside saved searches (P3) by the caller.
      - Compilation output is never logged with parameter values.
      - Hostile filter input cannot inject SQL or trigger unbounded work.
    data:
      - "Filter values: not personal data on their own; combined with a saved search they are P3 and handled by F06.S01.M02."
    retention:
      - "No retention; the library keeps no state."
    threats:
      - "T01 | SQL injection through filter values | only bound parameters, SQL from a fixed fragment table, fuzz test of 10 000 values"
      - "T02 | Resource exhaustion through huge category or id lists | list maxima 10, 200 expanded ids, 256 KiB body limit from CTR-SCH-001"
      - "T03 | Exact-distance oracle through distance filters | distanceKm only from the fixed set and compiled to cell sets, never to numeric distance comparisons"
    abuse_controls:
      - "Callers apply rate limits; the library caps work per call at 200 category ids, 512 cells and 10 list items."
  observability_performance:
    requirements:
      - Validation and compilation are fast enough to be negligible in the query budget.
      - Failures are counted by error code without recording values.
      - The compiled SQL is covered by an explain-plan test showing index use.
    metrics:
      - "classrup_discovery_filter_validation_total{code}"
    logs:
      - "debug filter.rejected {code, path} - never the value."
    budgets:
      - "validateFilter plus compileFilter <= 1 ms p95 for a filter with all keys and 200 categories; compiled queries use discovery_doc_cell (precision 5), discovery_doc_cell4 (precision 4) or the category index (explain-plan test)."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement is covered by at least one automated test, including property tests on canonicalization.
      - A golden test fixes the SQL fragment text and parameter order for each filter key.
      - Injection and limit tests run against a real SQLite database.
    fixtures: "Seed index of 1 000 SearchDocuments across 3 currencies, 6 kinds, 20 categories and 6 conditions, 10 percent with 4-character (L1) cells, 15 percent with inStock false, 30 percent barterAcceptable, and 120 wanted documents spread over the 6 want_min_condition values; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,02.R01 | validate a filter with every key valid | Result ok and canonical form equals golden"
      - "T02 | unit | 02.R02,02.R03 | price without currency, min above max, distance without center, distance 3 km, distance 7 km and 200 km, 6-character center | DISCOVERY_FILTER_CURRENCY_REQUIRED, DISCOVERY_FILTER_INVALID, DISCOVERY_FILTER_CENTER_REQUIRED, DISCOVERY_RADIUS_TOO_SMALL, DISCOVERY_RADIUS_NOT_ALLOWED, DISCOVERY_PRECISION_FORBIDDEN, each with the field path"
      - "T03 | property | 01.R03 | random key order and equivalent values | canonicalize returns identical bytes and cache keys"
      - "T04 | unit | 01.R02,03.R01,01.R04 | compile each key alone and all together, including distanceKm 5, 10, 25, 50 and 100 around u4pru and condition poor | SQL text and params equal golden fixtures; 25 km has the L1 prefix branch, 50 and 100 km use d.geo_cell4 IN (...)"
      - "T05 | property | 03.R02,03.R03 | 200 runs of the same filter with the same clock | identical SQL and params; compile never reads the system clock"
      - "T06 | integration | 01.R02,07.R01,01.R04 | compiled filters, including distanceKm 50 and 100 km and L1 documents, run against SQLite with 1 000 documents | returned set equals a brute-force JavaScript filter of the same data and is non-empty for 50 and 100 km"
      - "T07 | abuse | 07.R02,07.R03,08.R01 | 10 000 fuzz strings with SQL metacharacters and 5 000-item lists | no SQL injection, errors for oversize lists, validation under 1 ms p95"
      - "T08 | unit | 04.R01,04.R02,04.R03 | inspect module exports and error mapping | no commands, queries or events exist and errors map to documented codes"
      - "T09 | unit | 05.R01,05.R02,05.R03 | attempt to filter on a private column name | rejected as unknown key; no capability is defined"
      - "T10 | integration | 06.R01,06.R02,06.R03 | taxonomy port unavailable and stale snapshot | DEPENDENCY_UNAVAILABLE without partial output; stale snapshot validates with a hint"
      - "T11 | integration | 08.R02,08.R03 | explain query plan for distance filters of 10 and 100 km and category filters | discovery_doc_cell and discovery_doc_cell4 used, metrics counted by code without values"
      - "T12 | unit | 09.R01,09.R02,09.R03 | traceability run over PS-044 | every requirement maps to a passing test; golden files unchanged"
      - "T13 | unit | 10.R01,10.R02,10.R03 | load a v1 filter stored inside a saved search export | parsed unchanged; unknown key rejected on import"
      - "T14 | integration | 01.R05,02.R01 | compile and run inStock true, barterAcceptable true, wantAcceptsCondition for each of the 6 conditions, and inStock \"yes\" and wantAcceptsCondition \"mint\" against the seed index | SQL text and params equal golden fixtures; returned sets equal a brute-force JavaScript filter (good returns wants with minCondition good, fair, poor or for_parts); the two bad values are DISCOVERY_FILTER_INVALID with their field paths"
    acceptance:
      - All tests T01-T14 pass in CI.
      - Compiled queries return exactly the brute-force result on the 1 000 document fixture.
      - No filter value can alter SQL structure (fuzz suite green).
  import_export_backup_rollback:
    requirements:
      - The library owns no data, so it has no export section; filters travel inside saved searches exported by F06.S01.M02.
      - Imported filters are revalidated with the current library and rejected if they use unknown keys.
      - Filter schema changes are additive within v1 and breaking changes use a new major version with a migration function.
    export: "Not applicable; filters are exported as part of discovery.saved_searches by F06.S01.M02."
    import: "Filters inside imported saved searches are revalidated by validateFilter; invalid ones cause that saved search to be reported and skipped."
    backup: "No data; covered by vault export and relay backups of the owning modules."
    migration_rollback: "Additive optional keys only; a new major adds a registered migration vN to vN+1 per CTR-SCH-001 SCH-4 and rollback keeps the previous major readable for 180 days."
