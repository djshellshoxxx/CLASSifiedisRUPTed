id: F07.S01.M03
scope: MVP
summary: >-
  Account recovery without any server holding a secret. The recovery kit is a one-time artifact the user downloads or
  prints - a 24-word secret (256 bits of entropy) and an encrypted blob that wraps the account signing key. A key derived
  with scrypt (N=2^17, r=8, p=1) from the secret encrypts the blob with XChaCha20-Poly1305. The vault keeps only kit
  metadata and a public verifier; the kit is never uploaded by default and may go to a user-selected encrypted backup
  location. Recovery on a new device adds a new device key; revoking the other devices is announced and takes effect only
  after a 72 hour notice window during which an existing device can dispute it. Whoever holds the words and the blob can act
  as the account, and the product states this.
responsibilities:
  - Create the kit on the client - generate the 24-word secret, derive keys with scrypt (N=2^17, r=8, p=1, 16-byte salt), encrypt the account signing seed with XChaCha20-Poly1305 (24-byte nonce), and make the file and printable sheet.
  - Own RecoveryKit metadata in the vault - verifier public key, KDF parameters, blob checksum, status, last verification time and optional backup location label; never the 24 words.
  - Run recovery on a new device - decrypt locally, register a new device key through F07.S01.M01, publish a signed recovery notice, and complete or cancel.
  - Enforce the 72 hour notice window before other device keys are revoked, and support a signed dispute from an existing device.
non_responsibilities:
  - Key generation and device management (F07.S01.M01) and sessions (F07.S01.M02).
  - Storing or escrowing any recovery secret on a relay or with the operator; there is no operator recovery, and a lost kit with no remaining device means the account cannot be recovered.
  - Social recovery or guardians, hardware tokens (FUTURE).
  - "Future: Shamir-split kit, passkey-based second factor, guardian contacts, recovery notification channels beyond the identity document and mailbox."
depends_on: [F07.S01.M01, F07.S02.M01, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-FED-001, CTR-SCH-001, CTR-PRV-001, CTR-IOX-001, CTR-UX-001, CTR-FLG-001]
user_stories:
  - As a new user, I am asked to download or print my recovery kit and to prove I saved it by re-entering 3 randomly chosen words.
  - As a user who lost my phone, I install the app on a new device, enter my words and kit file, and regain my identity.
  - As a user with a second device, I get a notice that a recovery was started and I can dispute it within 72 hours.
  - As a security-minded user, I can check that my kit still works without performing a recovery.
edge_cases:
  - The user loses both the words and all devices; the account cannot be recovered and the creation flow said so; the user starts a new identity and can publish a signed statement from nothing, which is not a continuation.
  - The user types one wrong word; the checksum words (BIP-39 style 8-bit checksum) detect it before running scrypt, with an error that does not reveal which word.
  - The kit file is intact but words are wrong; XChaCha20-Poly1305 authentication fails and the vault applies a backoff of 60 s doubling up to 15 minutes after 5 failures.
  - A thief has the printed kit and file; they can recover and the notice window is the only brake, so the product advises storing words and file in separate places.
  - Recovery is started and the user does nothing for 7 days; the pending state expires back to active and the new device key remains registered.
  - The old device is offline for the whole 72 hours; it learns of the notice on next sync, can still dispute until the revocation has been applied by the recoverer, after which the user sees a contested identity document.
  - Two recoveries start at once from two new devices; the second is refused with CONFLICT_STATE while the first is pending.
  - The user creates a new kit while recovery is pending; refused with CONFLICT_STATE.
  - Kit file is corrupted (checksum mismatch); verify_kit reports IDENTITY_KIT_CORRUPT and the vault offers to create a replacement.
ux:
  screens:
    - "Create kit: words shown once in a 4 by 6 grid with copy disabled, print and download buttons, a confirmation step asking for 3 random words, a warning that anyone with the words and file can act as the account, and a checkbox 'I stored the words and the file separately'."
    - "Recover account: words entry with per-word autocomplete from the 2048-word list, kit file chooser, progress for key derivation, explanation of the 72 hour window."
    - "Pending recovery banner on existing devices: 'A recovery was started on <date> for <new device label>. Dispute now' with a Dispute button."
  states: [no-kit, kit-active, verifying, recovery-pending, recovery-complete, disputed, expired, error]
  a11y:
    - Word entry supports keyboard and screen readers, each word field has a label 'Word 1 of 24', and errors are announced via aria-live polite.
    - The confirmation step does not require a memory puzzle beyond retyping the displayed words (no cognitive function test, WCAG 3.3.8) and allows paste of the whole phrase.
    - All buttons are at least 44 by 44 px and the printable sheet is high-contrast text.
processes:
  domain_schema:
    requirements:
      - A RecoveryKit record stores the KDF parameters, salt, nonce, encrypted account key blob, public verifier and lifecycle fields, and never the 24 words or the derived keys.
      - KDF parameters are fixed to scrypt N=131072, r=8, p=1 with a 16-byte salt and the cipher is XChaCha20-Poly1305 with a 24-byte nonce; weaker parameters are rejected.
      - Only one kit is active per account; creating a new one supersedes the old one.
    entities:
      - name: RecoveryKit
        schema: classrup.identity.recovery_kit/v1
        storage: device
        privacy: P4
        retention: RET-STANDARD
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope"
          - "accountId: uuidv7 — ref Account"
          - "kdf: object — { name: scrypt, N: 131072, r: 8, p: 1, saltB64: 16 bytes base64url }"
          - "cipher: object — { name: xchacha20poly1305, nonceB64: 24 bytes base64url }"
          - "encryptedAccountKey: string — ciphertext plus 16-byte tag of the 32-byte account signing seed, base64url (64 characters)"
          - "verifierPublicKey: string — Ed25519 public key derived from the second 32 bytes of the KDF output, base64url (43 characters)"
          - "blobChecksum: string — SHA-256 of the kit file bytes, hex 64 characters"
          - "status: enum — active | recovery_pending | used | superseded"
          - "createdAt: timestamp — local clock"
          - "lastVerifiedAt?: timestamp — local clock of the last successful verification"
          - "backupLabel?: string — 1..60 code points naming a user-chosen backup place, no path or secret"
          - "pendingDeviceKeyId?: uuidv7 — new device key registered by an in-progress recovery"
          - "requestedAt?: timestamp — local clock when recovery began"
          - "revokeOthersRequested?: boolean — whether other device keys are to be revoked"
          - "revokeOthersNotBefore?: timestamp — requestedAt plus 259 200 000 ms (72 h)"
          - "noticeStatementCid?: string — cid of the signed classrup.identity.recovery_notice/v1"
          - "usedAt?: timestamp — local clock"
          - "revision: int — CTR-ID-001 ID-4"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - kdf equals scrypt N=131072, r=8, p=1 with a 16-byte salt; any other parameter set is rejected.
          - The 24 words, the derived encryption key and the derived verifier private key are never stored.
          - At most one RecoveryKit per account has status active or recovery_pending.
          - revokeOthersNotBefore equals requestedAt plus 72 hours when revokeOthersRequested is true.
  validation_rules:
    requirements:
      - Kit creation validates parameters and confirms the user saved the words; recovery validates words with a checksum before spending scrypt time.
      - Only one recovery may be pending; revocation of other devices before the notice window ends is refused.
      - Every failure maps to one stable error code without revealing which word was wrong.
    rules:
      - "V01 | kdf is scrypt with N=131072, r=8, p=1, salt 16 bytes, cipher xchacha20poly1305 with a 24-byte nonce | IDENTITY_KIT_PARAMS_INVALID"
      - "V02 | the user confirmed 3 randomly chosen words and the stored-separately acknowledgement before the kit is activated | VALIDATION_FAILED"
      - "V03 | entered words are 24 words of the 2048-word list and the 8-bit checksum matches | IDENTITY_KIT_WORDS_INVALID"
      - "V04 | the kit file checksum equals blobChecksum and decryption authenticates with the derived key | IDENTITY_KIT_CORRUPT"
      - "V05 | no other recovery is pending and no kit replacement is attempted while pending | CONFLICT_STATE"
      - "V06 | revoking other device keys is requested only at or after revokeOthersNotBefore | IDENTITY_RECOVERY_WINDOW_OPEN"
      - "V07 | failed recovery attempts are fewer than 5 before the backoff of 60 s doubling to 900 s applies | RATE_LIMITED"
  workflow_state_machine:
    requirements:
      - A kit is active until recovery starts, is superseded, or is used; used and superseded are final.
      - A pending recovery either completes into used, or returns to active by cancel, dispute or expiry after 7 days.
      - Completing with revocation of other devices requires the 72 hour window to have passed.
    machines:
      - entity: RecoveryKit
        initial: active
        terminal: [used, superseded]
        transitions:
          - "active -> recovery_pending | identity.recovery.begin with valid words and blob | register new device key via F07.S01.M01, sign and queue the recovery notice, emit identity.recovery.requested"
          - "active -> superseded | identity.recovery.create_kit creates a newer kit | mark old kit superseded in the same transaction, emit identity.recovery.kit_created"
          - "recovery_pending -> used | identity.recovery.complete | if revokeOthersRequested require now at or after revokeOthersNotBefore, revoke others via F07.S01.M01, emit identity.recovery.completed"
          - "recovery_pending -> active | identity.recovery.cancel, a verified dispute statement from an existing device, or 7 days without completion | revoke the pending new device key unless the user keeps it, emit identity.recovery.cancelled"
    timeouts:
      - "Revocation of other devices is allowed 72 h (259 200 000 ms) after begin."
      - "A pending recovery expires 7 days after begin and returns the kit to active."
      - "Kit verification reminder shown 365 days after the last verification."
  commands_queries_events:
    requirements:
      - All commands are vault commands; begin, complete and cancel produce signed statements (classrup.identity.recovery_notice/v1 signed by the account key, classrup.identity.recovery_dispute/v1 signed by an existing device key) delivered through the sync outbox.
      - No command contacts a relay with a secret; statements go to relays and mailboxes only as signed public or end-to-end encrypted items.
      - Recovery registers and revokes device keys by calling F07.S01.M01, which emits the device key events.
    commands:
      - name: identity.recovery.create_kit
        capability: identity.recovery_kit.create
        input: "{ kdf, cipher, encryptedAccountKey, verifierPublicKey, blobChecksum, confirmedWordIndexes: [3 numbers], storedSeparately: true, backupLabel? }"
        output: "{ kitId, revision, supersededKitId? }"
        errors: [VALIDATION_FAILED, IDENTITY_KIT_PARAMS_INVALID, CONFLICT_STATE]
        emits: [identity.recovery.kit_created]
        idempotent: true
      - name: identity.recovery.verify_kit
        capability: identity.recovery_kit.verify
        input: "{ kitId, words (24), kitFileChecksum }"
        output: "{ kitId, verifiedAt }"
        errors: [NOT_FOUND, IDENTITY_KIT_WORDS_INVALID, IDENTITY_KIT_CORRUPT, RATE_LIMITED]
        emits: []
        idempotent: true
      - name: identity.recovery.begin
        capability: identity.recovery_kit.begin
        input: "{ kitFile, words (24), newDeviceLabel, revokeOthers: boolean }"
        output: "{ kitId, newDeviceKeyId, revokeOthersNotBefore?, noticeStatementCid }"
        errors: [IDENTITY_KIT_WORDS_INVALID, IDENTITY_KIT_CORRUPT, IDENTITY_KIT_PARAMS_INVALID, CONFLICT_STATE, RATE_LIMITED]
        emits: [identity.recovery.requested]
        idempotent: true
      - name: identity.recovery.complete
        capability: identity.recovery_kit.complete
        input: "{ kitId, expectedRevision }"
        output: "{ kitId, revision, revokedDeviceKeyIds: array, statementCids: array }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, IDENTITY_RECOVERY_WINDOW_OPEN]
        emits: [identity.recovery.completed]
        idempotent: true
      - name: identity.recovery.cancel
        capability: identity.recovery_kit.cancel
        input: "{ kitId, expectedRevision, reason: user_cancelled|disputed }"
        output: "{ kitId, revision, disputeStatementCid? }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [identity.recovery.cancelled]
        idempotent: true
    queries:
      - name: identity.recovery.get_status
        capability: identity.recovery_kit.read_own
        input: "{ includeHistory?: boolean }"
        output: "{ kit?: RecoveryKit (without blob), pending?: { requestedAt, revokeOthersNotBefore, newDeviceLabel }, lastVerifiedAt?, verifyDue: boolean }"
        errors: [NOT_FOUND]
    events_produced:
      - {type: identity.recovery.kit_created, privacy: P3, payload: "{ accountId, kitId, supersededKitId?, createdAt }"}
      - {type: identity.recovery.completed, privacy: P3, payload: "{ accountId, kitId, newDeviceKeyId, revokedDeviceKeyIds, completedAt }"}
      - {type: identity.recovery.requested, privacy: P3, payload: "{ accountId, kitId, newDeviceKeyId, revokeOthersNotBefore?, requestedAt }"}
      - {type: identity.recovery.cancelled, privacy: P3, payload: "{ accountId, kitId, reason: user_cancelled|disputed|expired }"}
    events_consumed:
      - {type: privacy.deletion.completed, effect: "vault erase - delete all RecoveryKit records; the user's printed kit remains valid and the UI says so"}
    errors:
      - "IDENTITY_KIT_PARAMS_INVALID | 422 | no | KDF or cipher parameters differ from the required fixed set"
      - "IDENTITY_KIT_WORDS_INVALID | 422 | no | words are not 24 valid list words or the checksum fails"
      - "IDENTITY_KIT_CORRUPT | 422 | no | kit file checksum mismatch or authenticated decryption failed"
      - "IDENTITY_RECOVERY_WINDOW_OPEN | 409 | no | revocation of other devices requested before the 72 hour window ended"
    example: |
      vault command: identity.recovery.begin { "kitFile": "<bytes>", "words": ["abandon", "…24 words…"], "newDeviceLabel": "New phone", "revokeOthers": true }
      -> { "kitId": "0192f420-…", "newDeviceKeyId": "0192f421-…", "revokeOthersNotBefore": "2026-11-07T10:00:00.000Z", "noticeStatementCid": "sha256-Qm…" }
      (72 hours later) vault command: identity.recovery.complete { "kitId": "0192f420-…", "expectedRevision": 2 }
      -> { "kitId": "0192f420-…", "revision": 3, "revokedDeviceKeyIds": ["0192f401-…"], "statementCids": ["sha256-Zx…"] }
  authorization_capabilities:
    requirements:
      - Vault policy - creating and verifying a kit require an unlocked vault; begin runs in a new or empty vault where possession of the words and blob is the authorization.
      - Disputes are authorized by a signature from an active device key listed in the account's identity document; the dispute proves only that such a key signed it.
      - Relays have no capability here; they only carry signed notices and end-to-end encrypted mailbox items.
    capabilities:
      - "identity.recovery_kit.create | principal | unlocked vault; no pending recovery"
      - "identity.recovery_kit.verify | principal | unlocked vault and possession of words and blob"
      - "identity.recovery_kit.begin | anonymous | possession of the 24 words and kit file; local backoff after 5 failures"
      - "identity.recovery_kit.complete | principal | unlocked vault on the recovering device; window passed when revoking others"
      - "identity.recovery_kit.cancel | principal | unlocked vault holding an active device key, or the recovering device"
      - "identity.recovery_kit.read_own | principal | unlocked local principal"
  failure_recovery_idempotency:
    requirements:
      - Kit creation and each recovery step are single local transactions, so a crash leaves either the old state or the new state.
      - Statements go through the sync outbox with states local_committed, prepared, transport_acknowledged and peer_accepted, and the UI never claims more than the reached state.
      - A failed recovery never deletes the old kit and never revokes any key on its own.
    idempotency: "Idempotency-Key per command in the local command log for 24 h; begin is keyed by (kitId, newDevicePublicKey) so a repeated begin returns the same pending record."
    concurrency: "Partial unique index allows one active or pending kit per account; revision check on complete and cancel; Web Locks serialize tabs."
    retries: "Outbox retries follow base 500 ms, cap 30 s, full jitter, max 6 attempts per window; derivation errors are never retried automatically."
    offline: "Create, verify, begin and complete all work offline because they need only the kit and local keys; notices are queued and the UI shows that existing devices have not yet been told."
    partial_failure: "If registering the new device key succeeds but the notice statement fails to queue, the transaction rolls back; if the notice is queued but not delivered, the revocation window still counts from begin and the UI shows 'not yet delivered'."
  privacy_retention_abuse:
    requirements:
      - The 24 words and all derived keys exist only in memory during derivation and in the user's own hands; the vault stores no copy and no relay ever receives them.
      - The kit file is encrypted and may be stored anywhere the user chooses; the app never uploads it by default and states that the file alone is useless without the words.
      - The product states plainly that anyone with both the words and the file can control the account, so they should be stored separately.
    data:
      - "RecoveryKit: P4 (encrypted blob and verifier); metadata P3; words never stored."
      - "Recovery notice: signed public statement containing the DID, the new device public key and the planned revocation time, P0."
    retention:
      - "RecoveryKit until superseded, used or vault erase (RET-STANDARD); used and superseded records are kept 90 days then deleted."
      - "Notices follow the identity document retention (F07.S02.M01)."
    threats:
      - "T01 | Stolen words and file used by an attacker to take over | notice statement and 72 hour window give existing devices a chance to dispute; honest limit - an attacker with both can still act as the account, so advice is to store them separately and rotate by creating a new identity if compromised"
      - "T02 | Offline guessing of a weak secret | the secret is 256 bits random, so guessing is infeasible; scrypt N=2^17 adds cost for partial leaks"
      - "T03 | Parameter downgrade in a forged kit file | fixed parameter check V01 before derivation and checksum comparison against the stored metadata"
      - "T04 | Phishing site asks for the 24 words | the words are entered only in the app's recovery screen; the UI warns that no operator or relay will ever ask for them"
      - "T05 | Quiet takeover while the user is offline | revocation of other devices cannot happen before 72 hours, notice is delivered through identity documents and mailbox, and a dispute creates a visible contested state (fork detection in F07.S02.M01)"
      - "T06 | Relay or backup location reads the kit | file is encrypted with a key from 256-bit secret; backups hold ciphertext only"
    abuse_controls:
      - "Local backoff after 5 failed attempts: 60 s doubling to 900 s; at most 3 begin attempts per hour."
      - "Notice statements are limited to one per account per 24 hours by receiving vaults; extra ones are quarantined."
  observability_performance:
    requirements:
      - The PWA sends no telemetry; local diagnostics hold counters of kit creation, verification and recovery attempts without secrets.
      - Key derivation with scrypt N=2^17 completes within 1.5 seconds on a Moto G-class device and 600 ms on a laptop.
      - Kit creation completes within 3 seconds including printing layout.
    metrics:
      - "local counter recovery_kit_total{event=created|verified|begin|completed|cancelled}"
      - "local histogram recovery_kdf_duration_ms"
    logs:
      - "info recovery.event {event, correlationId} in the local diagnostics log - never words, keys or blobs."
    budgets:
      - "scrypt derivation p95 <= 1.5 s on a Moto G-class device; create_kit p95 <= 3 s; verify_kit p95 <= 2 s; complete p95 <= 300 ms."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement is covered by at least one automated test with injected clock, fixed salts and fixed key pairs.
      - Cryptographic tests use known-answer vectors for scrypt, XChaCha20-Poly1305 and Ed25519 and fail on any parameter change.
      - Privacy tests prove that words and derived keys never reach storage, logs, events, exports or the network.
    fixtures: "Fixed 24-word phrase (valid checksum), fixed salt and nonce, account A with devices D1 and D2, new device N, fixed clock 2026-11-04T10:00:00Z, scrypt known-answer vector."
    tests:
      - "T01 | unit | 01.R01,01.R02,02.R01 | create kit with fixed salt and nonce | blob decrypts with the derived key; record stores no words or keys; kdf equals scrypt N=131072 r=8 p=1"
      - "T02 | unit | 01.R02,02.R01 | create kit with N=16384 or a 12-byte nonce | IDENTITY_KIT_PARAMS_INVALID; nothing stored"
      - "T03 | unit | 02.R02,02.R03 | words with wrong checksum, 23 words, unknown word, wrong file checksum, bit-flipped blob | IDENTITY_KIT_WORDS_INVALID or IDENTITY_KIT_CORRUPT without revealing which word"
      - "T04 | property | 01.R03,03.R01,03.R02,03.R03 | random sequences of create, begin, complete, cancel, expire | only declared transitions succeed; one active or pending kit; used and superseded are final"
      - "T05 | integration | 03.R03,02.R03 | begin with revokeOthers then complete at 71 h and at 72 h | IDENTITY_RECOVERY_WINDOW_OPEN at 71 h; success at 72 h with D1 and D2 revoked and statements queued"
      - "T06 | integration | 03.R02,04.R03 | begin then dispute statement from D2 | kit returns to active, contested identity flagged, cancelled event emitted"
      - "T07 | contract | 04.R01,04.R02,09.R02 | every command, query and event run | outputs, statements and payloads validate against registry schemas; statement signatures verify"
      - "T08 | integration | 04.R03,06.R02 | begin registers a new device key through F07.S01.M01 | identity.device_key.added emitted by M01 once; revocations emitted on complete"
      - "T09 | abuse | 05.R01,05.R02,05.R03 | locked vault creates a kit; dispute signed by a revoked key; relay tries to call begin | FORBIDDEN or rejected; relay has no capability"
      - "T10 | chaos | 06.R01,06.R02,06.R03 | crash during begin, queue failure, replay of begin | no partial state; old kit intact; one pending record"
      - "T11 | abuse | 07.R01,07.R02,07.R03 | inspect storage, events, logs, exports and network traces during create and begin | words and derived keys appear nowhere; no kit upload without the user's choice; 6th failed attempt triggers backoff"
      - "T12 | load | 08.R01,08.R02,08.R03 | scrypt derivation on emulated Moto G and laptop | <= 1.5 s and <= 600 ms; create_kit <= 3 s"
      - "T13 | a11y | 01.R01,03.R01 | create and recover screens with axe-core and keyboard only | zero serious or critical issues; paste of full phrase works"
      - "T14 | unit | 09.R01,09.R03 | traceability run over PS-053 | every requirement maps to a passing test and crypto vectors are green"
      - "T15 | integration | 10.R01,10.R02,10.R03 | export, import to a fresh vault, vault erase | kit metadata and blob round-trip; words never in export; erase leaves the printed kit valid"
    acceptance:
      - All tests T01-T15 pass in CI.
      - The 24 words and derived keys never appear in storage, logs, events, exports or network traffic (privacy suite).
      - A recovery with revocation of other devices is impossible before 72 hours and a dispute from an existing device returns the kit to active.
  import_export_backup_rollback:
    requirements:
      - The vault export contains kit metadata and the encrypted blob so a user can re-download the file, but never the words.
      - Import validates KDF parameters, blob checksum and the verifier, and sets the kit to active only if verification of the checksum passes.
      - Parameter changes (a stronger scrypt) are new kit versions; v1 kits remain valid and readable for 180 days after a new major.
    export: "Section identity.recovery_kit in classrup-export/v1 (schema classrup.identity.recovery_kit/v1) with metadata and encrypted blob; the words are never included."
    import: "A kit with unsupported parameters or checksum mismatch is imported as superseded and reported; at most one imported kit becomes active."
    backup: "The vault export is the primary backup (IOX-6); the user-selected encrypted backup location receives only the kit file; relays never receive kits."
    migration_rollback: "A stronger KDF is a new kit schema major with a registered migration that requires the user to create a new kit; rollback keeps v1 kits recoverable with the original parameters."
