id: F07.S02.M01
scope: MVP
summary: >-
  The portable identity document is a signed statement (classrup.identity.portable_doc/v1) that binds a did:key to its
  current pseudonym, its active and recently revoked device public keys, and up to 5 relays where the owner can be
  reached. The account signing key signs it over RFC 8785 JCS bytes, each version carries a sequence number and the
  hash of the previous one, and any vault can verify it offline. Relays store and serve it; vaults store the documents of
  people they interact with and detect forks. It evidences that the holder of the key asserted these facts - not who the
  person is, and not delivery of anything.
responsibilities:
  - Encode and decode did:key for Ed25519 (multicodec 0xed01, multibase base58btc) and verify that a document's DID matches its signing key.
  - Issue a new signed document version from the current Account and DeviceKey state (vault command) with seq increased by 1 and prev set to the previous cid.
  - Receive and store documents of other principals, verify signature, seq and chain, keep provenance, and flag forks (same DID and seq with different cid, or two documents claiming the same prev) as contested.
  - Serve and accept documents on a relay (public read, signed publish with quotas, at most 20 versions per DID).
  - Mark the owner's own current document stale when device keys or the pseudonym change, prompting reissue.
non_responsibilities:
  - Device key and pseudonym management (F07.S01.M01) and recovery (F07.S01.M03).
  - Federation transport and peer policy (F11); this module supplies the signed document that F11 and account migration use.
  - Trust in the person behind a key; that comes from attestations and reputation (F07.S03).
  - "Future: DID methods other than did:key, key rotation of the account signing key with a signed move statement, witness co-signatures."
depends_on: [F07.S01.M01, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-FED-001, CTR-SCH-001, CTR-PRV-001, CTR-OBS-001, CTR-IOX-001, CTR-FLG-001]
user_stories:
  - As a user, my devices and pseudonym are published in a signed document that anyone can verify without trusting a server.
  - As a counterparty, I can check that a statement was signed by a key that the author's document lists as active.
  - As a user who moves to another relay, I publish a new document version listing the new relay, and my history stays intact.
  - As a contact, I am warned if two conflicting versions of someone's identity document appear.
edge_cases:
  - A document has a valid signature but seq lower than the stored one; it is kept as history and never replaces the current document.
  - Two documents have the same DID and seq but different content; both are stored, marked contested, and the UI shows a warning with both device key lists until a higher seq signed document resolves it.
  - A document is older than its expiresAt (180 days); it remains evidence but is marked expired for trust decisions and the UI prompts a refresh.
  - A revoked device key signed a statement before the verifier saw the revocation; the verifier accepts it and the UI shows the revocation date as a claim.
  - The document exceeds 8 KiB or lists more than 20 device keys; rejected.
  - A relay receives 50 documents per hour for one DID; it refuses beyond 10 per hour.
  - Clock skew - issuedAt is 2 hours in the future; verifiers accept up to 10 minutes of skew and quarantine the rest.
  - The document's pseudonym differs from the pseudonym in a profile statement from the same DID; the document is authoritative for DID to key binding only, and the UI shows the newest profile's label.
  - The relay list contains a non-HTTPS URL or credentials in the URL; rejected.
ux:
  screens:
    - "Identity settings > My identity document: DID with copy and QR, current seq, listed devices, relays, 'Publish to relay' per relay with sync state (prepared, relay received, peer accepted)."
    - "Contact details > Identity: document version, 'verified signature', 'contested' warning, key fingerprint."
  states: [loading, current, stale, publishing, contested, expired, offline-pending, error]
  a11y:
    - The DID and fingerprint are shown as text with a copy button and group separators for screen reader pacing.
    - Contested and expired warnings are text with an icon, announced via aria-live polite.
    - The QR code has a text equivalent, and all buttons are at least 44 by 44 px.
processes:
  domain_schema:
    requirements:
      - A PortableIdentityDoc stores the signed document bytes' fields, its cid, sequence, previous cid, status and provenance, for the owner's own versions and for received versions of others.
      - The signed payload lists the DID, seq, prev, pseudonym, device keys with statuses, relays and issuedAt/expiresAt, and is at most 8 KiB.
      - Statuses express verification outcomes - current, stale (own, needs reissue), superseded and contested - and never imply real-world identity.
    entities:
      - name: PortableIdentityDoc
        schema: classrup.identity.portable_doc/v1
        storage: relay+device
        privacy: P0
        retention: RET-STANDARD
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope"
          - "did: did — did:key subject, derived from the account signing key"
          - "seq: int — starts at 1, increases by exactly 1 per version of one DID"
          - "prev?: string — cid of the previous version; absent for seq 1"
          - "cid: string — sha256-base64url of JCS(document without sig) per CTR-ID-001 ID-3"
          - "pseudonym: string — display label claimed by the owner, 3..32 code points"
          - "deviceKeys: array — at most 20 entries { publicKey (43 chars), status: active|revoked, addedAt, revokedAt?, revokesEffectiveAt? }"
          - "relays: array — at most 5 HTTPS URLs without credentials or query, each at most 255 characters"
          - "issuedAt: timestamp — the owner's claim"
          - "expiresAt: timestamp — issuedAt plus 180 days"
          - "sig: string — Ed25519 signature by the account signing key over JCS bytes, base64url"
          - "origin: enum — own | received | relay_stored"
          - "provenance: object — { originRelay?, via: array, receivedAt (local clock), verifiedAt (local clock) } per CTR-FED-001 FED-6"
          - "status: enum — current | stale | superseded | contested"
          - "statementSyncState?: enum — local_committed | prepared | transport_acknowledged | peer_accepted (own documents only)"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - sig verifies against the public key encoded in did over JCS bytes of the document without sig.
          - For one DID, seq values are unique among non-contested documents and prev equals the cid of the version seq minus 1.
          - Serialized signed document is at most 8 192 bytes.
          - Exactly one document per DID has status current unless the DID is contested.
    sql: |
      CREATE TABLE identity_portable_doc (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, did TEXT NOT NULL, seq INTEGER NOT NULL, cid TEXT NOT NULL,
        status TEXT NOT NULL, origin TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX identity_portable_doc_cid ON identity_portable_doc(tenant_id, cid);
      CREATE INDEX identity_portable_doc_did ON identity_portable_doc(tenant_id, did, seq);
  validation_rules:
    requirements:
      - Every document is verified for DID derivation, signature, size, chain and field limits before it is stored as anything other than quarantine.
      - Clock claims are checked with explicit tolerance and never trusted for ordering; seq orders versions.
      - Relay publication adds quotas and URL checks.
    rules:
      - "V01 | did is a did:key with multicodec 0xed01 and the signature verifies against that key over JCS bytes of the document without sig | IDENTITY_DOC_SIGNATURE_INVALID"
      - "V02 | document size is at most 8 192 bytes, deviceKeys at most 20 entries, relays at most 5 HTTPS URLs without credentials | VALIDATION_FAILED"
      - "V03 | seq is exactly stored seq plus 1 and prev equals the cid of the stored current version, otherwise the document is stored as history or contested | IDENTITY_DOC_CHAIN_INVALID"
      - "V04 | issuedAt is not more than 10 minutes ahead of the verifier's clock and expiresAt equals issuedAt plus 180 days | VALIDATION_FAILED"
      - "V05 | for an own document, deviceKeys equals the active keys in F07.S01.M01 plus keys revoked within the last 180 days, and pseudonym equals the Account pseudonym | CONFLICT_STATE"
      - "V06 | relay only - at most 10 publications per hour per DID and 100 per hour per IP /24 | RATE_LIMITED"
  workflow_state_machine:
    requirements:
      - A document moves from current to superseded when a valid higher seq arrives, to stale when the owner's state changes, and to contested when a fork is detected.
      - A contested identity is resolved only by a signed document with a higher seq that chains from one of the competing versions and that the user accepts.
      - Superseded documents are kept for verification of old statements.
    machines:
      - entity: PortableIdentityDoc
        initial: current
        terminal: [superseded]
        transitions:
          - "current -> stale | own device key added or revoked, or pseudonym changed | mark stale and show reissue prompt, document stays valid for verification"
          - "current -> superseded | valid document with seq plus 1 chained from this cid is accepted | keep as history, emit nothing further"
          - "stale -> superseded | identity.portable_doc.issue creates seq plus 1 | new document becomes current and is queued for publication"
          - "current -> contested | another valid document with the same DID and seq but a different cid, or the same prev, is received | freeze trust upgrades for this DID, warn user, keep both"
          - "stale -> contested | fork detected as above | same handling"
          - "contested -> superseded | a valid higher-seq document chained from one competing version is accepted by the user | the chosen branch becomes current, the other branch stays superseded as evidence"
    timeouts:
      - "A current own document is marked stale-by-age at 150 days (30 days before expiry) to prompt a refresh."
      - "Relay keeps the latest 20 versions per DID; older ones are purged when version 21 arrives."
  commands_queries_events:
    requirements:
      - Issue is a vault command that produces the signed statement classrup.identity.portable_doc/v1; receive is the vault intake of someone else's document; publish and the public read are relay endpoints.
      - The event identity.portable_doc.published is emitted when a document is issued locally and when a relay stores a verified document, in the same transaction as the state change.
      - Documents are public P0 statements and are only sent to relays the owner selected or directly to peers.
    commands:
      - name: identity.portable_doc.issue
        capability: identity.portable_doc.issue
        input: "{ relays?: array of at most 5 URLs, expectedSeq }"
        output: "{ docId, seq, cid, statement: classrup.identity.portable_doc/v1 (signed), syncState: local_committed }"
        errors: [CONFLICT_STATE, CONFLICT_REVISION, VALIDATION_FAILED]
        emits: [identity.portable_doc.published]
        idempotent: true
      - name: identity.portable_doc.receive
        capability: identity.portable_doc.receive
        input: "{ document: classrup.identity.portable_doc/v1, provenance }"
        output: "{ docId, status: current|superseded|contested|history, did, seq }"
        errors: [IDENTITY_DOC_SIGNATURE_INVALID, IDENTITY_DOC_CHAIN_INVALID, VALIDATION_FAILED, BLOCKED_PARTY]
        emits: []
        idempotent: true
      - name: identity.portable_doc.publish
        capability: identity.portable_doc.publish
        input: "{ document: classrup.identity.portable_doc/v1 }"
        output: "{ docId, seq, cid, storedAt }"
        errors: [IDENTITY_DOC_SIGNATURE_INVALID, IDENTITY_DOC_CHAIN_INVALID, VALIDATION_FAILED, RATE_LIMITED]
        emits: [identity.portable_doc.published]
        idempotent: true
    queries:
      - name: identity.portable_doc.get
        capability: identity.portable_doc.read_public
        input: "{ did, seq?, includeHistory?: boolean }"
        output: "{ document: classrup.identity.portable_doc/v1, status, provenance, history?: array of at most 20 }"
        errors: [NOT_FOUND]
      - name: identity.portable_doc.list_contested
        capability: identity.portable_doc.read_own
        input: "{ limit? (1..50) }"
        output: "{ items: [{ did, versions: array, detectedAt }] }"
        errors: []
    events_produced:
      - {type: identity.portable_doc.published, privacy: P0, payload: "{ did, seq, cid, origin: own|relay_stored, issuedAt }"}
    events_consumed:
      - {type: identity.device_key.added, effect: "own document becomes stale and the reissue prompt is shown"}
      - {type: identity.device_key.revoked, effect: "own document becomes stale; reissue lists the key as revoked with revokesEffectiveAt"}
      - {type: identity.pseudonym.changed, effect: "own document becomes stale until reissued"}
      - {type: privacy.deletion.completed, effect: "vault erase - delete all documents; relays keep documents until a signed tombstone arrives (PRV-6)"}
    errors:
      - "IDENTITY_DOC_SIGNATURE_INVALID | 422 | no | DID derivation or Ed25519 signature check failed"
      - "IDENTITY_DOC_CHAIN_INVALID | 409 | no | seq or prev does not extend the stored chain"
    example: |
      vault command: identity.portable_doc.issue { "expectedSeq": 3, "relays": ["https://relay.example.org"] }
      -> { "docId": "0192f430-…", "seq": 4, "cid": "sha256-Qm…", "syncState": "local_committed", "statement": { "v": 1, "type": "classrup.identity.portable_doc/v1", "author": "did:key:z6Mk…", "seq": 4, "prev": "sha256-Zx…", "payload": { "pseudonym": "Riverstone", "deviceKeys": [ … ], "relays": [ … ] }, "sig": "…" } }
      relay query: POST /api/v1/query/identity.portable_doc.get { "did": "did:key:z6Mk…" } -> 200 { "document": { … }, "status": "current" }
  authorization_capabilities:
    requirements:
      - Vault policy - only the unlocked principal issues documents for its own DID; any signed document is accepted into the store only after cryptographic verification, so authority comes from the signature, not from the sender.
      - Relay policy - publication is open to anyone presenting a valid signed document within quota (no account needed), and reads are public; a relay operator may refuse a DID by hosting policy but cannot alter a document.
      - A blocked DID's documents are not stored by the blocking vault.
    capabilities:
      - "identity.portable_doc.issue | principal | unlocked local principal; expectedSeq matches the stored seq"
      - "identity.portable_doc.receive | principal | signature verifies; signer DID not blocked"
      - "identity.portable_doc.publish | anonymous, principal | valid signed document within relay quota; relay hosting policy allows the DID"
      - "identity.portable_doc.read_public | principal, anonymous | public read; relay quota applies"
      - "identity.portable_doc.read_own | principal | unlocked local principal"
  failure_recovery_idempotency:
    requirements:
      - Issue and receive are idempotent by cid, so duplicate delivery never creates a duplicate version.
      - Documents are published to relays through the sync outbox with states local_committed, prepared, transport_acknowledged and peer_accepted, and the UI never shows more than the reached state.
      - Fork detection never discards either version; it records both.
    idempotency: "Idempotency-Key per command in the vault log for 24 h; receive and publish are keyed by cid (unique index), so replays return the stored result."
    concurrency: "expectedSeq compare-and-set for issue; two devices issuing seq n plus 1 concurrently create a fork that both vaults detect and show as contested; Web Locks serialize tabs on one device."
    retries: "Outbox retries use base 500 ms, cap 30 s, full jitter, max 6 attempts per window and continue until transport_acknowledged or the user cancels."
    offline: "Issue works offline and the new version waits in the outbox; receiving works from any transport including a scanned QR; verification needs no network."
    partial_failure: "If publication to one of several relays fails, the others continue and the UI shows the per-relay state; the local document is already current."
  privacy_retention_abuse:
    requirements:
      - The document is a deliberate public P0 statement containing only public keys, the pseudonym and relay URLs, and it never contains P3 data, private keys or recovery material.
      - The product states before first publication that a published document and copies other vaults fetched cannot be recalled, only superseded or tombstoned.
      - Relays honor signed tombstones within 24 hours (FED-4, PRV-6) and may not rewrite documents.
    data:
      - "PortableIdentityDoc: P0 public; provenance fields are local metadata (P3 on device)."
    retention:
      - "Own and received documents until vault erase or contact removal (RET-STANDARD); superseded versions kept for 2 years (RET-EVIDENCE) to verify old statements; relay keeps the latest 20 versions per DID."
    threats:
      - "T01 | Forged document for someone else's DID | signature must verify against the key encoded in the DID; a forger would need the private key"
      - "T02 | Fork attack - attacker with a stolen device key publishes a conflicting document | device keys cannot sign documents (only the account key can), forks are detected and shown as contested, and the owner reissues with a higher seq"
      - "T03 | Replay of an old document to resurrect a revoked device | seq and prev chain; verifiers prefer the highest valid seq seen and warn on rollback"
      - "T04 | Document used to deanonymize the owner | the document contains only what the owner chose; the UI explains that a DID is a stable pseudonymous identifier that links all of the owner's public activity, not anonymity"
      - "T05 | Relay flood with many fake DIDs | 10 publications per hour per DID, 100 per hour per IP /24, 8 KiB size limit, relay hosting policy"
      - "T06 | Backdated issuedAt to claim earlier revocation | issuedAt is a claim; verifiers use seq and their own receipt time for trust decisions, the relay-signed receipt time is evidence of that relay's clock only"
    abuse_controls:
      - "Relay quotas as above; vault intake accepts at most 50 documents per hour from one transport source and quarantines the rest."
      - "Documents from blocked DIDs are dropped silently; the sender cannot tell."
  observability_performance:
    requirements:
      - Relays export publication and read metrics per CTR-OBS-001; vaults keep local diagnostics only.
      - Signature verification and storage of a document take at most 10 ms p95 on a Moto G-class device and 5 ms on the relay.
      - Relay reads meet the read budget of p95 at most 150 ms.
    metrics:
      - "classrup_identity_doc_publications_total{outcome=ok|invalid|chain|rate_limited} (relay)"
      - "classrup_identity_doc_contested_total (relay)"
      - "local counter portable_doc_total{event=issued|received|contested}"
    logs:
      - "info portable_doc.stored {outcome, correlationId} - no DID, keys or relay URLs."
    budgets:
      - "verify and store p95 <= 10 ms on device and <= 5 ms on relay; relay read p95 <= 150 ms; issue p95 <= 100 ms."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement is covered by at least one automated test with fixed key pairs, JCS test vectors and an injected clock.
      - did:key encoding is verified against the W3C did:key Ed25519 test behaviour (prefix z6Mk, round trip).
      - Fork, rollback and quota behaviour are tested with deterministic fixtures.
    fixtures: "Account key pairs K1 and K2, device keys D1..D3, documents seq 1..4 for K1, a forked seq 3, a stolen device key, fixed clock 2026-11-04T10:00:00Z, relay harness with quotas."
    tests:
      - "T01 | unit | 01.R01,01.R02,02.R01 | issue seq 1 then seq 2 for a fixed account | statement signature verifies over JCS bytes, did starts with did:key:z6Mk, cid computed per ID-3, size under 8 KiB"
      - "T02 | property | 01.R02,02.R01 | 1 000 random Ed25519 keys | did:key encode and decode round trip; every did starts with z6Mk"
      - "T03 | unit | 02.R01,02.R02,02.R03 | tampered field, wrong signing key, 8.5 KiB document, 21 device keys, http relay URL, issuedAt +20 min | IDENTITY_DOC_SIGNATURE_INVALID or VALIDATION_FAILED each time; nothing stored as current"
      - "T04 | integration | 03.R01,03.R02 | receive seq 2, then seq 3, then a replay of seq 1, then a forked seq 3 | current moves forward; replay stays history; fork marks contested; nothing is deleted"
      - "T05 | integration | 03.R03,02.R03 | resolve contested by receiving seq 4 chained from one branch and accepting | chosen branch current, other superseded as evidence"
      - "T06 | property | 03.R01,03.R02,03.R03 | random sequences of issue, receive, device events | only declared transitions succeed; exactly one current per uncontested DID"
      - "T07 | contract | 04.R01,04.R02,04.R03,09.R02 | commands, queries and the event run | outputs, statement and payload validate against registry schemas"
      - "T08 | integration | 04.R03,05.R01 | device key added and pseudonym changed events | own current document becomes stale; reissue creates seq plus 1 and supersedes"
      - "T09 | abuse | 05.R01,05.R02,05.R03 | locked vault issues; blocked DID's document received; operator edits a stored document | FORBIDDEN; silently dropped; edit impossible because signature would fail"
      - "T10 | chaos | 06.R01,06.R02,06.R03 | duplicate delivery, crash after sign but before commit, one of three relays down | one document per cid; no half-committed seq; per-relay states shown"
      - "T11 | abuse | 07.R01,07.R02,07.R03 | inspect document for P3 fields and private keys; stolen device key tries to sign a document; relay receives 11 documents per hour for one DID | no private data; device-key signature rejected; 11th RATE_LIMITED"
      - "T12 | load | 08.R01,08.R02,08.R03 | 1 000 verifications on emulated Moto G and 50 reads per second on relay | <= 10 ms device, <= 5 ms relay, read p95 <= 150 ms"
      - "T13 | a11y | 04.R03,01.R04 | identity document and contact screens with axe-core | zero serious or critical issues; contested warning announced"
      - "T14 | unit | 09.R01,09.R03 | traceability run over PS-055 | every requirement maps to a passing test"
      - "T15 | integration | 10.R01,10.R02,10.R03 | export, import in a fresh vault, relay backup restore | documents round-trip with provenance; invalid signatures rejected on import"
    acceptance:
      - All tests T01-T15 pass in CI.
      - A forked or rolled-back identity document is never silently accepted (fork and rollback tests).
      - No document contains private keys or P3 data and no UI text claims real-world identity verification.
  import_export_backup_rollback:
    requirements:
      - The vault export contains the owner's document history and the documents of contacts, each with provenance, so the identity can move between relays and devices.
      - Import re-verifies every signature, chain and size, keeps valid documents with their original provenance and rejects invalid ones with a report.
      - Schema changes follow expand/contract with v1 readable for 180 days, and a new major carries a signed migration statement.
    export: "Section identity.portable_docs in classrup-export/v1 (schema classrup.identity.portable_doc/v1), own history and received documents."
    import: "Each document is verified; valid ones are stored with origin received or own (when the DID matches the vault principal); a chain gap stores the document as history and reports it."
    backup: "The vault export is the primary backup (IOX-6); relay backups (IOX-3, IOX-7) hold public documents only, so losing a relay loses nothing the owner cannot republish."
    migration_rollback: "Additive optional fields in v1 under ext only; rollback is safe because verifiers ignore unknown ext keys and the signature covers them."
