id: F07.S02.M02
scope: MVP
summary: >-
  The user's own public profile (pseudonym, avatar, bio, languages and an L1 or L2 region) with per-field visibility
  (public, contacts, private), published as the signed statement classrup.identity.profile/v1 by a device key that the
  identity document lists as active, plus cached profiles of other people received as signed statements. The owner can
  withdraw a published profile with a signed tombstone. It also owns the block list, a private P3 vault list of DIDs the
  user refuses to interact with. Blocks are enforced inside the user's vault - blocked DIDs' statements are dropped
  silently, and every module checks the block port before acting - and are never sent to relays or to the blocked
  person. Relays may stop serving their own copy of a profile under hosting policy, which never changes a vault record.
responsibilities:
  - Own Profile records for the local principal and for received profiles (read-only mirrors with provenance), applying per-field visibility when composing statements, with field-level privacy classes registered with F10.S02.M02.
  - Compose and sign the profile statement with only fields marked public (published to selected relays after federation_publish consent) or contacts (sent end-to-end encrypted to conversation participants), and withdraw it with a signed tombstone on unpublish.
  - Own BlockEntry records and expose the block port isBlockedEither(a, b) and filterBlocked(list of up to 500 DIDs) used by every module before acting and by search for result filtering, and implement BlockFilterPort for F07.S02.M01.
  - Drop statements from blocked DIDs silently at intake so the sender cannot learn of the block from this vault.
  - Keep avatar and bio within strict size and content limits (avatar WebP at most 128 by 128 px and 24 KiB, metadata stripped by F10.S02.M03 and stored as a MediaBlob of F15.S02.M03) and check the region with F06.S02.M01 assertPublicCell.
non_responsibilities:
  - Reputation and reviews (F07.S03.M01) and attestations (F07.S03.M02).
  - The signed identity document and device keys (F07.S02.M01, F07.S01.M01).
  - Global bans or relay-wide takedown; relay operators may stop serving a profile copy on their relay under hosting policy (F12 and F11 relay storage), and users may subscribe to advisory feeds (Future).
  - Media storage itself (F15.S02.M03) and location settings (F06.S02.M02, which this module hears only through discovery.location.updated).
  - "Future: shared block lists via signed advisory feeds, verified-link fields, profile themes."
depends_on: [F07.S01.M01, F07.S02.M01, F06.S02.M01, F10.S01.M01, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, F10.S02.M03, F15.S02.M03, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-FED-001, CTR-SCH-001, CTR-PRV-001, CTR-OBS-001, CTR-IOX-001, CTR-UX-001, CTR-FLG-001]
user_stories:
  - As a user, I write a short bio, add an avatar and choose which fields are public, shared with my conversation partners only, or private.
  - As a user, I block someone and they can no longer message me, make offers or appear in my search results, and they are not told.
  - As a buyer, I view a seller's public profile as a signed statement with its provenance.
  - As a user, I can export my blocks to move to a new device.
  - As a user, I can withdraw my public profile from my relays and see per relay whether the withdrawal arrived.
edge_cases:
  - Avatar upload is a 3 MB JPEG with GPS EXIF; it is re-encoded to WebP 128 by 128 under 24 KiB and metadata is stripped; if the result is still too large it is rejected.
  - Bio contains links; allowed as plain text but rendered without auto-linking, and the UI shows a warning on tap-out.
  - Profile statement from a blocked DID arrives; dropped silently with no quarantine entry visible to the sender.
  - A user blocks someone mid-conversation; open drafts and pending outbox statements to that DID are cancelled with reason blocked, and active shares end (events consumed elsewhere).
  - The user blocks 1 001 DIDs; the 1 001st is refused with IDENTITY_BLOCK_LIMIT.
  - A received profile claims a pseudonym that is confusable with a known contact; shown with the confusable warning from F07.S01.M01.
  - Two devices edit the profile concurrently; revision conflict surfaces CONFLICT_REVISION and the user chooses; no last-writer-wins.
  - A relay stops serving a profile copy under its hosting policy; the copy is unavailable via that relay, the owner's other relays and direct peers still serve it, and a vault that learns of it only records 'not served by relay X' in provenance.
  - The user blocks themselves or a DID that is not a valid did:key; rejected.
  - A relay signs a tombstone for someone's profile; receiving vaults keep the profile and only drop that relay from its provenance, because only the profile's own DID can withdraw it.
  - A profile is signed by a device key that the DID's document had revoked before this vault first saw the profile; rejected with IDENTITY_PROFILE_INVALID.
  - The owner unpublishes while one relay is offline; the tombstone waits in the outbox for that relay and the UI shows it as not yet delivered.
ux:
  screens:
    - "Edit profile: pseudonym (read-only, change in Identity), avatar picker with crop, bio (500 chars with counter), languages, region level selector linked to location settings, per-field visibility segmented control (Public, Contacts, Private) with a preview 'what a stranger sees' and 'what a contact sees', and Unpublish with per-relay delivery state."
    - "Blocked people: list with pseudonym, DID fingerprint, date, optional private note, Unblock."
    - "Other person's profile: pseudonym with DID fingerprint, avatar, bio, region badge, provenance line ('from relay X, received <time>', 'not served by relay Y'), Hide for me, Block and Report-to-relay actions."
  states: [loading, empty, saved, pending-offline, conflict, withdrawn, not-served-by-relay, hidden, blocked, error]
  a11y:
    - Avatar has alt text field and fallback initials; bio counter announces remaining characters politely at 450, 490 and 500.
    - Visibility controls are radio groups with 44 by 44 px targets and a text description of each level.
    - Block and Unblock require an accessible confirmation dialog naming the person.
processes:
  domain_schema:
    requirements:
      - A Profile stores the display data and per-field visibility; the record is classed P3 as a whole with field-level classes registered with F10.S02.M02 (public fields P0 once published, contacts fields P2, private fields P3), own profiles are editable and received profiles are read-only mirrors with provenance and the original signature.
      - A BlockEntry is a P3 vault-only record of blockerDid and blockedDid with an optional private note and is excluded from every statement, relay payload, log and event with class below P3.
      - Avatar and bio have hard size limits so signed statements stay under 32 KiB.
    entities:
      - name: Profile
        schema: classrup.identity.profile/v1
        storage: relay+device
        privacy: P3
        retention: RET-STANDARD
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope"
          - "did: did — profile subject (P0)"
          - "origin: enum — own | received"
          - "seq: int — profile statement sequence, increments by 1 per published version"
          - "displayPseudonym: string — copy of the Account pseudonym, 3..32 code points (P0)"
          - "bio?: string — 0..500 code points, plain text; class follows its visibility"
          - "avatar?: object — { ref: blob:sha256-<base64url> MediaBlob of F15.S02.M03, mime: image/webp, widthPx: 128, heightPx: 128, bytes at most 24 576, sha256 }; class follows its visibility"
          - "languages?: array — at most 5 BCP 47 tags; class follows its visibility"
          - "regionCell?: string — geohash of 4 or 5 characters, never longer (CTR-PRV-001 L1 or L2), equal to the last publicCell from discovery.location.updated"
          - "visibility: object — per field bio, avatar, languages, region: public | contacts | private; default private for region and public for others"
          - "fieldClasses: object — F10.S02.M02 class per field derived from visibility - public P0, contacts P2, private P3"
          - "publishState?: enum — never | published | withdrawn (own profile)"
          - "cid?: string — cid of the signed statement for published or received versions"
          - "signerKey?: string — device public key that signed the statement, active in the DID's document at first-seen time"
          - "sig?: string — Ed25519 signature by signerKey over JCS bytes"
          - "provenance?: object — { originRelay?, via, receivedAt, verifiedAt, notServedBy?: relay ids } for received profiles"
          - "syncState?: enum — local_committed | prepared | transport_acknowledged | peer_accepted"
          - "status: enum — active | hidden | deleted"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - regionCell has 4 or 5 characters or is absent, and is present in a statement only when its visibility is public or contacts.
          - A signed statement never includes fields whose visibility is private, and contacts fields appear only in end-to-end encrypted statements.
          - A received profile is never edited locally; only status can change (hidden, deleted), and only the local user or a tombstone authored by the profile's own DID changes it.
          - No field with visibility private appears in logs, events below P3 or relay payloads.
      - name: BlockEntry
        schema: classrup.identity.block_entry/v1
        storage: device
        privacy: P3
        retention: RET-STANDARD
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope"
          - "blockerDid: did — the local principal"
          - "blockedDid: did — valid did:key different from blockerDid"
          - "note?: string — 0..140 code points, private to the user"
          - "status: enum — active | removed"
          - "removedAt?: timestamp — local clock"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - At most one active BlockEntry exists per (blockerDid, blockedDid).
          - blockerDid differs from blockedDid.
          - A vault holds at most 1 000 active block entries.
    sql: |
      CREATE TABLE identity_block_entry (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, blocker_did TEXT NOT NULL, blocked_did TEXT NOT NULL,
        status TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX identity_block_active ON identity_block_entry(tenant_id, blocker_did, blocked_did) WHERE status = 'active';
      CREATE TABLE identity_profile (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, did TEXT NOT NULL, origin TEXT NOT NULL, seq INTEGER NOT NULL,
        status TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX identity_profile_did ON identity_profile(tenant_id, did, origin);
  validation_rules:
    requirements:
      - Profile input is validated strictly with exact limits, and avatars are re-encoded, stripped of metadata and size-checked on the device.
      - Visibility and region rules guarantee that no private field and no location finer than L2 enter a statement, and the region passes F06.S02.M01 assertPublicCell (N8).
      - Block input validates DIDs and the cap, and intake of received profiles verifies signatures before storage.
    rules:
      - "V01 | bio is at most 500 code points of plain text after NFC and control character removal | VALIDATION_FAILED"
      - "V02 | avatar is WebP, exactly 128 by 128 px, at most 24 576 bytes, with EXIF, XMP and GPS metadata stripped by F10.S02.M03 before it is stored as a MediaBlob (F15.S02.M03, N9) | IDENTITY_AVATAR_INVALID"
      - "V03 | F06.S02.M01 assertPublicCell(regionCell) passes and regionCell equals the last publicCell received via discovery.location.updated | IDENTITY_REGION_INVALID"
      - "V04 | languages has at most 5 valid BCP 47 tags | VALIDATION_FAILED"
      - "V05 | blockedDid is a valid did:key, differs from the principal, and fewer than 1 000 active blocks exist | IDENTITY_BLOCK_LIMIT"
      - "V06 | received profile statement is at most 32 KiB, its signature verifies with a device key that the DID's document listed as active at this vault's first-seen time (F07.S02.M01 key_status), and seq is greater than the stored seq | IDENTITY_PROFILE_INVALID"
      - "V07 | expectedRevision equals the current revision on profile update | CONFLICT_REVISION"
      - "V08 | unpublish targets an own profile with publishState published | CONFLICT_STATE"
      - "V09 | privacy.consent.check(federation_publish, relayId) is granted for each target relay before a public statement is queued; relays without consent are skipped and a publish with no remaining relay is refused; tombstones are always sent | PRECONDITION_FAILED"
  workflow_state_machine:
    requirements:
      - A profile record in the vault is active, hidden by the local user, or deleted by a tombstone authored by its own DID, the owner's erase or contact removal; a relay's hosting action changes only that relay's copy.
      - A block is active until removed; removal is permanent for that entry and a re-block creates a new entry.
      - Hidden profiles return to active only by an explicit local unhide; relay hosting actions and their reversal never change vault records.
    machines:
      - entity: Profile
        initial: active
        terminal: [deleted]
        transitions:
          - "active -> hidden | local hide by the user | stop showing the profile, keep data"
          - "hidden -> active | local unhide by the user | show again"
          - "active -> deleted | tombstone whose author equals did, erase cleanup, or contact removal | delete content, keep tombstone id"
          - "hidden -> deleted | tombstone whose author equals did, erase cleanup, or contact removal | delete content, keep tombstone id"
          - "active -> active | identity.profile.unpublish on the own profile | publishState withdrawn, tombstone queued per relay, emit identity.profile.updated with changedFields [withdrawn]"
      - entity: BlockEntry
        initial: active
        terminal: [removed]
        transitions:
          - "active -> removed | identity.block.remove | emit identity.block.removed; statements from the DID are accepted again from now on"
    timeouts:
      - "Removed BlockEntry rows are purged 30 days after removal."
      - "Received profiles not viewed for 180 days are evicted from the cache (RET-STANDARD, least recently viewed first)."
  commands_queries_events:
    requirements:
      - update, publish, unpublish, block add and block remove are vault commands; publish produces the signed statement classrup.identity.profile/v1 and unpublish produces classrup.federation.tombstone/v1, both signed by a device key active in the owner's document; receive is the vault intake of someone else's profile statement.
      - Block commands emit local P3 events that other modules consume to cancel work; block data is never placed in a statement.
      - Reads of profiles apply the viewer's perspective - strangers see public fields, conversation participants see contacts fields, the owner sees all.
      - A tombstone withdraws a received profile only when its author equals the profile's DID and its signer key is active in that DID's document; a tombstone signed by an origin relay only removes that relay from the profile's provenance.
      - Relay hosting actions (moderation.action.applied and moderation.action.reverted) are consumed only by the relay runtime for the relay's own copy and never change vault records.
    commands:
      - name: identity.profile.update
        capability: identity.profile.write_own
        input: "{ bio?, avatar?, languages?, visibility?, expectedRevision }"
        output: "{ profileId, revision }"
        errors: [VALIDATION_FAILED, IDENTITY_AVATAR_INVALID, IDENTITY_REGION_INVALID, CONFLICT_REVISION]
        emits: [identity.profile.updated]
        idempotent: true
      - name: identity.profile.publish
        capability: identity.profile.publish_own
        input: "{ audience: public|contacts, targetRelays?: array, threadIds?: array, expectedRevision }"
        output: "{ profileId, seq, cid, statement: classrup.identity.profile/v1, syncState: local_committed, skippedRelays: array }"
        errors: [CONFLICT_REVISION, VALIDATION_FAILED, IDENTITY_REGION_INVALID, PRECONDITION_FAILED]
        emits: [identity.profile.updated]
        idempotent: true
      - name: identity.profile.unpublish
        capability: identity.profile.unpublish_own
        input: "{ targetRelays?: array (default every relay that received it), expectedRevision }"
        output: "{ profileId, revision, tombstone: classrup.federation.tombstone/v1, syncStates: [{ relayId, syncState }] }"
        errors: [CONFLICT_REVISION, CONFLICT_STATE, VALIDATION_FAILED]
        emits: [identity.profile.updated]
        idempotent: true
      - name: identity.profile.receive
        capability: identity.profile.receive
        input: "{ statement: classrup.identity.profile/v1, provenance }"
        output: "{ profileId, seq, status }"
        errors: [IDENTITY_PROFILE_INVALID, VALIDATION_FAILED, RATE_LIMITED]
        emits: [identity.profile.updated]
        idempotent: true
      - name: identity.block.add
        capability: identity.block_entry.write_own
        input: "{ blockedDid, note? }"
        output: "{ blockId, revision: 1 }"
        errors: [VALIDATION_FAILED, IDENTITY_BLOCK_LIMIT, CONFLICT_STATE]
        emits: [identity.block.added]
        idempotent: true
      - name: identity.block.remove
        capability: identity.block_entry.write_own
        input: "{ blockId, expectedRevision }"
        output: "{ blockId, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [identity.block.removed]
        idempotent: true
    note: "Statements and signer roles (N2): classrup.identity.profile/v1 - a device key active in the owner's portable document (key id in the envelope); classrup.federation.tombstone/v1 for unpublish (CTR-FED-001 FED-4, the format owned by F11.S01.M02) - a device key of the profile's DID. F11.S01.M02 is not listed in depends_on because it already depends on this module through F11.S03.M02; the tombstone is built per CTR-FED-001 and delivered by the sync outbox, and F11.S01.M02 applies it on relays and in receiving vaults. A received statement from a blocked DID is dropped silently - receive returns no error the sender could observe. Ports provided: isBlockedEither(a, b), filterBlocked(dids up to 500), and BlockFilterPort.isBlocked(did) for F07.S02.M01 (N7)."
    queries:
      - name: identity.profile.get
        capability: identity.profile.read_view
        input: "{ did, viewerContext?: stranger|contact }"
        output: "{ profile: Profile with fields filtered by visibility, provenance?, blockedByMe: boolean }"
        errors: [NOT_FOUND]
      - name: identity.block.list
        capability: identity.block_entry.read_own
        input: "{ cursor?, limit? (1..100) }"
        output: "{ items: BlockEntry[], nextCursor? }"
        errors: []
    events_produced:
      - {type: identity.profile.updated, privacy: P0, payload: "{ did, origin: own|received, seq, changedFields: array (field names only, for example withdrawn) }"}
      - {type: identity.block.added, privacy: P3, payload: "{ blockId, blockerDid, blockedDid }"}
      - {type: identity.block.removed, privacy: P3, payload: "{ blockId, blockerDid, blockedDid }"}
    events_consumed:
      - {type: identity.account.created, effect: "create the default own Profile with the pseudonym, visibility region private, no bio"}
      - {type: identity.pseudonym.changed, effect: "refresh displayPseudonym on the own profile and mark it unpublished-changes"}
      - {type: discovery.location.updated, effect: "set regionCell to publicCell after F06.S02.M01 assertPublicCell, or clear it at L0, still subject to the region visibility"}
      - {type: identity.portable_doc.published, effect: "origin received - re-verify quarantined profile statements of that DID whose signer key was unknown; profiles first seen before a revocation stay valid"}
      - {type: moderation.action.applied, effect: "relay runtime only - the relay stops serving its own copy of the targeted profile statement under its hosting policy; vault records are never changed"}
      - {type: moderation.action.reverted, effect: "relay runtime only - the relay serves its copy of the profile statement again; vault records are never changed"}
      - {type: federation.tombstone.applied, effect: "delete the received profile only when the tombstone author equals Profile.did and its signer key was active in that DID's document; a tombstone signed by an origin relay only drops that relay from provenance and the profile stays"}
      - {type: privacy.deletion.completed, effect: "final cleanup only - the DeletionPort steps already sent the own profile tombstone and deleted profiles and blocks"}
    errors:
      - "IDENTITY_AVATAR_INVALID | 422 | no | avatar is not a 128 by 128 WebP under 24 KiB without metadata"
      - "IDENTITY_REGION_INVALID | 422 | no | region cell fails assertPublicCell or differs from the public cell of the location settings"
      - "IDENTITY_BLOCK_LIMIT | 409 | no | 1 000 active blocks already exist"
      - "IDENTITY_PROFILE_INVALID | 422 | no | received profile signature, signer key status, size or sequence check failed"
    example: |
      vault command: identity.profile.update { "bio": "Fixes bikes on weekends.", "visibility": { "bio": "public", "region": "contacts" }, "expectedRevision": 2 }
      -> { "profileId": "0192f440-…", "revision": 3 }
      vault command: identity.profile.unpublish { "expectedRevision": 3 }
      -> { "profileId": "0192f440-…", "revision": 4, "tombstone": { "type": "classrup.federation.tombstone/v1", "author": "did:key:z6Mk…", "payload": { "target": "sha256-…", "reason": "withdrawn" }, "sig": "…" }, "syncStates": [ { "relayId": "relay.example.org", "syncState": "prepared" } ] }
      vault command: identity.block.add { "blockedDid": "did:key:z6Mk…", "note": "spam offers" }
      -> { "blockId": "0192f441-…", "revision": 1 }
      port: isBlockedEither("did:key:z6MkA…", "did:key:z6MkB…") -> true
  authorization_capabilities:
    requirements:
      - Vault policy - only the unlocked principal edits, publishes or unpublishes its profile and edits its block list; received profiles are accepted only with a valid signature by a device key active in the profile DID's document at first-seen time.
      - Visibility is enforced at composition and at read; a stranger can never read contacts or private fields because those never leave the vault in a public statement.
      - Relay policy - a relay may host profile statements and stop serving its copy under its policy; it has no access to blocks and cannot change a vault's records.
    capabilities:
      - "identity.profile.write_own | principal | unlocked local principal"
      - "identity.profile.publish_own | principal | unlocked local principal; audience contacts requires an existing thread; federation_publish consent per relay"
      - "identity.profile.unpublish_own | principal | unlocked local principal; own profile is published"
      - "identity.profile.receive | principal | signature verifies with an active signer key; signer DID not blocked (otherwise dropped silently)"
      - "identity.profile.read_view | principal, anonymous | vault - unlocked principal; relay copies - public read of public fields only"
      - "identity.block_entry.write_own | principal | unlocked local principal"
      - "identity.block_entry.read_own | principal | unlocked local principal"
  failure_recovery_idempotency:
    requirements:
      - Vault commands are idempotent through the local command log and use expectedRevision; a profile publish or unpublish is queued through the sync outbox with states local_committed, prepared, transport_acknowledged and peer_accepted.
      - Blocking is effective locally the moment it commits, independent of any network.
      - Receiving the same profile statement twice is a no-op keyed by cid.
    idempotency: "Idempotency-Key per command in the vault log for 24 h; receive keyed by cid; block add for an existing active pair returns the existing blockId; unpublish twice returns the same tombstone."
    concurrency: "expectedRevision on profile and block mutations; the partial unique index prevents duplicate active blocks; Web Locks serialize tabs; two devices of the same principal reconcile profile edits as CONFLICT_REVISION with a resolve-or-discard prompt (IDM-5)."
    retries: "Outbox retries follow base 500 ms, cap 30 s, full jitter, max 6 attempts per window; local commands are not retried."
    offline: "Profile editing, publishing and unpublishing to the outbox and blocking all work offline; the UI shows 'not yet delivered' until transport_acknowledged and 'accepted by peer' only after a signed acknowledgement."
    partial_failure: "If avatar re-encoding or metadata stripping fails the update is rejected as a whole; if a relay rejects the published statement or the tombstone, the local profile remains and the per-relay state shows the error."
  privacy_retention_abuse:
    requirements:
      - The block list is P3 and never leaves the vault, never appears in statements, logs, relay requests or events below P3, and the blocked person receives no notification.
      - Public profile fields are exactly what the user marked public; a published profile and copies other vaults fetched cannot be recalled, only superseded or tombstoned, and the UI says so before first publication.
      - Region never exceeds L2 and is off by default.
      - The module meets the N6 privacy duties - it registers ExportSectionPort (sections identity.profiles and identity.blocks), DeletionPort (tombstone the own published profile, delete profiles and blocks) and RetentionPurgePort, registers field classes with F10.S02.M02, calls privacy.consent.check(federation_publish, relayId) before every public relay publication, and treats privacy.deletion.completed only as final cleanup.
    data:
      - "Profile: P3 record with field classes - public fields P0 once published; contacts fields P2 end-to-end encrypted to participants; private fields stay P3 in the vault."
      - "BlockEntry: P3, device only; note is a private free text."
    retention:
      - "Own profile and blocks until the user deletes them or vault erase (RET-STANDARD); removed blocks purged after 30 days; received profiles evicted after 180 days unviewed; tombstones kept 180 days (FED-4)."
    threats:
      - "T01 | Blocked person learns of the block | statements from the blocked DID are dropped silently, no error identifies the block, the outbox of the sender shows at most transport_acknowledged and never peer_accepted; honest limit - repeated failure of acknowledgement can hint at it"
      - "T02 | Bio or avatar used for phishing or doxxing | plain text only, links not auto-linked, avatar re-encoded without metadata, report goes to the relay's hosting policy and local hide is available"
      - "T03 | Fake profile impersonating a known contact | profile signature by an active device key binds content to the DID, DID fingerprint always shown next to the pseudonym, confusable warning from F07.S01.M01"
      - "T04 | Region leak through visibility mistakes | region defaults to private, preview of 'what a stranger sees', statement composer drops private fields, assertPublicCell and a contract test for L2 maximum"
      - "T05 | Mass profile spam from throwaway DIDs | vault intake limit of 50 profiles per hour per transport source, unknown DIDs shown as strangers, relay quotas apply"
      - "T06 | Relay deletes or hides a user's profile in other people's vaults | relay hosting actions affect only the relay copy, and relay-signed tombstones only drop that relay from provenance"
      - "T07 | Private field values leak through the record class | the record is P3 with per-field classes; logs, events below P3 and relay payloads carry only public fields"
    abuse_controls:
      - "Intake limits - 50 received profiles per hour per source, 32 KiB per statement, quarantine beyond."
      - "Block cap 1 000; block and unblock actions limited to 60 per hour to avoid accidental loops; limits run through the bus RateLimitPort (F12.S03.M03, N18)."
  observability_performance:
    requirements:
      - The PWA sends no telemetry; local diagnostics keep counters without DIDs or content.
      - Block checks used by other modules cost at most 1 ms p95 for a single lookup and 5 ms for a list of 500 DIDs on a Moto G-class device.
      - Profile view renders within the PWA budget (LCP at most 2.5 s on the 4G profile).
    metrics:
      - "local counter block_check_total{result=allowed|blocked}"
      - "local counter profile_statements_total{event=published|withdrawn|received|rejected}"
    logs:
      - "info profile.event {event, correlationId} in the local diagnostics log - no DIDs, bios or notes."
    budgets:
      - "isBlockedEither p95 <= 1 ms; filterBlocked(500) p95 <= 5 ms; profile update p95 <= 100 ms excluding avatar encoding (<= 400 ms)."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement is covered by at least one automated test with fixed key pairs and an injected clock.
      - Privacy tests prove that private fields and blocks never appear in statements, logs or events below P3.
      - Block enforcement is tested end to end across a consumer module fake.
      - Accessibility and UI copy tests check the profile, blocked people and other-profile screens, including the no-recall notice before first publication.
