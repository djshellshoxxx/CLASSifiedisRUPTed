      - No relay action or relay-signed tombstone changes or deletes a profile record inside a vault.
  import_export_backup_rollback:
    requirements:
      - The vault export contains the own profile, received profile cache entries the user kept (contacts), and the block list.
      - Import revalidates avatar and statement limits and signatures of received profiles, and restores blocks as active entries up to the 1 000 cap.
      - Schema changes follow expand/contract and keep v1 readable for 180 days.
    export: "Sections identity.profiles and identity.blocks in classrup-export/v1 (schemas classrup.identity.profile/v1 and classrup.identity.block_entry/v1); blocks are included only in the owner's own export; avatar MediaBlobs are included by reference and bytes."
    import: "Received profiles are re-verified and skipped if invalid; blocks beyond the cap are reported and skipped; own profile replaces the default only when seq is higher; publishState and tombstones are restored."
    backup: "The vault export is the primary backup (IOX-6); relays hold public profile statements and P0 avatar blobs only (IOX-7) and never blocks."
    migration_rollback: "Additive optional fields only in v1 (under ext for signed statements); rollback is safe because older readers ignore unknown fields."
