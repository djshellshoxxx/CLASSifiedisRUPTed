id: F07.S02.M02
scope: MVP
summary: >-
  The user's own public profile (pseudonym, avatar, bio, languages and an L1 or L2 region) with per-field visibility
  (public, contacts, private), published as the signed statement classrup.identity.profile/v1, plus cached profiles
  of other people received as signed statements. It also owns the block list, a private P3 vault list of DIDs the user
  refuses to interact with. Blocks are enforced inside the user's vault - blocked DIDs' statements are dropped, and every
  module checks the block port before acting - and are never sent to relays or to the blocked person.
responsibilities:
  - Own Profile records for the local principal and for received profiles (read-only mirrors with provenance), applying per-field visibility when composing statements.
  - Compose and sign the profile statement with only fields marked public (published to selected relays) or contacts (sent end-to-end encrypted to conversation participants).
  - Own BlockEntry records and expose the block port isBlockedEither(a, b) and filterBlocked(list of up to 500 DIDs) used by every module before acting and by search for result filtering.
  - Drop statements from blocked DIDs silently at intake so the sender cannot learn of the block from this vault.
  - Keep avatar and bio within strict size and content limits (avatar WebP at most 128 by 128 px and 24 KiB, metadata stripped).
non_responsibilities:
  - Reputation and reviews (F07.S03.M01) and attestations (F07.S03.M02).
  - The signed identity document and device keys (F07.S02.M01, F07.S01.M01).
  - Global bans or relay-wide takedown; relay operators may hide a profile on their relay under hosting policy, and users may subscribe to advisory feeds (Future).
  - "Future: shared block lists via signed advisory feeds, verified-link fields, profile themes."
depends_on: [F07.S01.M01, F07.S02.M01, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-FED-001, CTR-SCH-001, CTR-PRV-001, CTR-OBS-001, CTR-IOX-001, CTR-UX-001, CTR-FLG-001]
user_stories:
  - As a user, I write a short bio, add an avatar and choose which fields are public, shared with my conversation partners only, or private.
  - As a user, I block someone and they can no longer message me, make offers or appear in my search results, and they are not told.
  - As a buyer, I view a seller's public profile as a signed statement with its provenance.
  - As a user, I can export my blocks to move to a new device.
edge_cases:
  - Avatar upload is a 3 MB JPEG with GPS EXIF; it is re-encoded to WebP 128 by 128 under 24 KiB and metadata is stripped; if the result is still too large it is rejected.
  - Bio contains links; allowed as plain text but rendered without auto-linking, and the UI shows a warning on tap-out.
  - Profile statement from a blocked DID arrives; dropped silently with no quarantine entry visible to the sender.
  - A user blocks someone mid-conversation; open drafts and pending outbox statements to that DID are cancelled with reason blocked, and active shares end (events consumed elsewhere).
  - The user blocks 1 001 DIDs; the 1 001st is refused with IDENTITY_BLOCK_LIMIT.
  - A received profile claims a pseudonym that is confusable with a known contact; shown with the confusable warning from F07.S01.M01.
  - Two devices edit the profile concurrently; revision conflict surfaces CONFLICT_REVISION and the user chooses; no last-writer-wins.
  - A relay hides a profile under its hosting policy; the profile is unavailable via that relay but the owner's other relays and direct peers still serve it.
  - The user blocks themselves or a DID that is not a valid did:key; rejected.
ux:
  screens:
    - "Edit profile: pseudonym (read-only, change in Identity), avatar picker with crop, bio (500 chars with counter), languages, region level selector linked to location settings, per-field visibility segmented control (Public, Contacts, Private) with a preview 'what a stranger sees' and 'what a contact sees'."
    - "Blocked people: list with pseudonym, DID fingerprint, date, optional private note, Unblock."
    - "Other person's profile: pseudonym with DID fingerprint, avatar, bio, region badge, provenance line ('from relay X, received <time>'), Block and Report-to-relay actions."
  states: [loading, empty, saved, pending-offline, conflict, hidden-by-relay, blocked, error]
  a11y:
    - Avatar has alt text field and fallback initials; bio counter announces remaining characters politely at 450, 490 and 500.
    - Visibility controls are radio groups with 44 by 44 px targets and a text description of each level.
    - Block and Unblock require an accessible confirmation dialog naming the person.
processes:
  domain_schema:
    requirements:
      - A Profile stores the display data and per-field visibility; own profiles are editable and received profiles are read-only mirrors with provenance and the original signature.
      - A BlockEntry is a P3 vault-only record of blockerDid and blockedDid with an optional private note and is excluded from every statement, relay payload, log and event with class below P3.
      - Avatar and bio have hard size limits so signed statements stay under 32 KiB.
    entities:
      - name: Profile
        schema: classrup.identity.profile/v1
        storage: relay+device
        privacy: P0
        retention: RET-STANDARD
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope"
          - "did: did — profile subject"
          - "origin: enum — own | received"
          - "seq: int — profile statement sequence, increments by 1 per published version"
          - "displayPseudonym: string — copy of the Account pseudonym, 3..32 code points"
          - "bio?: string — 0..500 code points, plain text"
          - "avatar?: object — { mime: image/webp, widthPx: 128, heightPx: 128, bytesB64 at most 24 KiB, sha256 }"
          - "languages?: array — at most 5 BCP 47 tags"
          - "regionCell?: string — geohash of 4 or 5 characters, never longer (CTR-PRV-001 L1 or L2)"
          - "visibility: object — per field bio, avatar, languages, region: public | contacts | private; default private for region and public for others"
          - "cid?: string — cid of the signed statement for published or received versions"
          - "sig?: string — Ed25519 signature by the account signing key"
          - "provenance?: object — { originRelay?, via, receivedAt, verifiedAt } for received profiles"
          - "syncState?: enum — local_committed | prepared | transport_acknowledged | peer_accepted"
          - "status: enum — active | hidden | deleted"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - regionCell has 4 or 5 characters or is absent, and is present in a statement only when its visibility is public or contacts.
          - A signed statement never includes fields whose visibility is private.
          - A received profile is never edited locally; only status can change (hidden, deleted).
      - name: BlockEntry
        schema: classrup.identity.block_entry/v1
        storage: device
        privacy: P3
        retention: RET-STANDARD
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope"
          - "blockerDid: did — the local principal"
          - "blockedDid: did — valid did:key different from blockerDid"
          - "note?: string — 0..140 code points, private to the user"
          - "status: enum — active | removed"
          - "removedAt?: timestamp — local clock"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - At most one active BlockEntry exists per (blockerDid, blockedDid).
          - blockerDid differs from blockedDid.
          - A vault holds at most 1 000 active block entries.
    sql: |
      CREATE TABLE identity_block_entry (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, blocker_did TEXT NOT NULL, blocked_did TEXT NOT NULL,
        status TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX identity_block_active ON identity_block_entry(tenant_id, blocker_did, blocked_did) WHERE status = 'active';
      CREATE TABLE identity_profile (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, did TEXT NOT NULL, origin TEXT NOT NULL, seq INTEGER NOT NULL,
        status TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX identity_profile_did ON identity_profile(tenant_id, did, origin);
  validation_rules:
    requirements:
      - Profile input is validated strictly with exact limits, and avatars are re-encoded and size-checked on the device.
      - Visibility and region rules guarantee that no private field and no location finer than L2 enter a statement.
      - Block input validates DIDs and the cap, and intake of received profiles verifies signatures before storage.
    rules:
      - "V01 | bio is at most 500 code points of plain text after NFC and control character removal | VALIDATION_FAILED"
      - "V02 | avatar is WebP, exactly 128 by 128 px, at most 24 576 bytes, with no EXIF, XMP or GPS metadata after re-encoding | IDENTITY_AVATAR_INVALID"
      - "V03 | regionCell has 4 or 5 geohash characters and matches the public cell published by F06.S02.M02 | IDENTITY_REGION_INVALID"
      - "V04 | languages has at most 5 valid BCP 47 tags | VALIDATION_FAILED"
      - "V05 | blockedDid is a valid did:key, differs from the principal, and fewer than 1 000 active blocks exist | IDENTITY_BLOCK_LIMIT"
      - "V06 | received profile statement is at most 32 KiB, its signature verifies against did, and seq is greater than the stored seq | IDENTITY_PROFILE_INVALID"
      - "V07 | expectedRevision equals the current revision on profile update | CONFLICT_REVISION"
  workflow_state_machine:
    requirements:
      - A profile is active, hidden by the local user or by a relay's hosting policy, or deleted by tombstone or erase.
      - A block is active until removed; removal is permanent for that entry and a re-block creates a new entry.
      - Hidden profiles return to active only by an explicit unhide or the end of the relay action.
    machines:
      - entity: Profile
        initial: active
        terminal: [deleted]
        transitions:
          - "active -> hidden | local hide, or moderation.action.applied from a relay's hosting policy for relay-served copies | stop showing the profile, keep data"
          - "hidden -> active | local unhide or moderation.action.reverted | show again"
          - "active -> deleted | signed tombstone, erase, or contact removal | delete content, keep tombstone id"
          - "hidden -> deleted | signed tombstone, erase, or contact removal | delete content, keep tombstone id"
      - entity: BlockEntry
        initial: active
        terminal: [removed]
        transitions:
          - "active -> removed | identity.block.remove | emit identity.block.removed; statements from the DID are accepted again from now on"
    timeouts:
      - "Removed BlockEntry rows are purged 30 days after removal."
      - "Received profiles not viewed for 180 days are evicted from the cache (RET-STANDARD, least recently viewed first)."
  commands_queries_events:
    requirements:
      - update, publish, block add and block remove are vault commands; publish produces the signed statement classrup.identity.profile/v1; receive is the vault intake of someone else's profile statement.
      - Block commands emit local P3 events that other modules consume to cancel work; block data is never placed in a statement.
      - Reads of profiles apply the viewer's perspective - strangers see public fields, conversation participants see contacts fields, the owner sees all.
    commands:
      - name: identity.profile.update
        capability: identity.profile.write_own
        input: "{ bio?, avatar?, languages?, visibility?, expectedRevision }"
        output: "{ profileId, revision }"
        errors: [VALIDATION_FAILED, IDENTITY_AVATAR_INVALID, IDENTITY_REGION_INVALID, CONFLICT_REVISION]
        emits: [identity.profile.updated]
        idempotent: true
      - name: identity.profile.publish
        capability: identity.profile.publish_own
        input: "{ audience: public|contacts, targetRelays?: array, threadIds?: array, expectedRevision }"
        output: "{ profileId, seq, cid, statement: classrup.identity.profile/v1, syncState: local_committed }"
        errors: [CONFLICT_REVISION, VALIDATION_FAILED]
        emits: [identity.profile.updated]
        idempotent: true
      - name: identity.profile.receive
        capability: identity.profile.receive
        input: "{ statement: classrup.identity.profile/v1, provenance }"
        output: "{ profileId, seq, status }"
        errors: [IDENTITY_PROFILE_INVALID, BLOCKED_PARTY, VALIDATION_FAILED]
        emits: [identity.profile.updated]
        idempotent: true
      - name: identity.block.add
        capability: identity.block_entry.write_own
        input: "{ blockedDid, note? }"
        output: "{ blockId, revision: 1 }"
        errors: [VALIDATION_FAILED, IDENTITY_BLOCK_LIMIT, CONFLICT_STATE]
        emits: [identity.block.added]
        idempotent: true
      - name: identity.block.remove
        capability: identity.block_entry.write_own
        input: "{ blockId, expectedRevision }"
        output: "{ blockId, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [identity.block.removed]
        idempotent: true
    queries:
      - name: identity.profile.get
        capability: identity.profile.read_view
        input: "{ did, viewerContext?: stranger|contact }"
        output: "{ profile: Profile with fields filtered by visibility, provenance?, blockedByMe: boolean }"
        errors: [NOT_FOUND]
      - name: identity.block.list
        capability: identity.block_entry.read_own
        input: "{ cursor?, limit? (1..100) }"
        output: "{ items: BlockEntry[], nextCursor? }"
        errors: []
    events_produced:
      - {type: identity.profile.updated, privacy: P0, payload: "{ did, origin: own|received, seq, changedFields: array }"}
      - {type: identity.block.added, privacy: P3, payload: "{ blockId, blockerDid, blockedDid }"}
      - {type: identity.block.removed, privacy: P3, payload: "{ blockId, blockerDid, blockedDid }"}
    events_consumed:
      - {type: identity.account.created, effect: "create the default own Profile with the pseudonym, visibility region private, no bio"}
      - {type: identity.pseudonym.changed, effect: "refresh displayPseudonym on the own profile and mark it unpublished-changes"}
      - {type: discovery.location.updated, effect: "set regionCell to the public cell (L1 or L2) or clear it at L0, still subject to the region visibility"}
      - {type: moderation.action.applied, effect: "relay: hide the targeted profile on that relay under its hosting policy; vault: apply the user's local hide"}
      - {type: federation.tombstone.applied, effect: "delete the received profile the signed tombstone targets"}
      - {type: privacy.deletion.completed, effect: "vault erase - delete all profiles and blocks"}
    errors:
      - "IDENTITY_AVATAR_INVALID | 422 | no | avatar is not a 128 by 128 WebP under 24 KiB without metadata"
      - "IDENTITY_REGION_INVALID | 422 | no | region cell is longer than 5 characters or differs from the public cell of the location settings"
      - "IDENTITY_BLOCK_LIMIT | 409 | no | 1 000 active blocks already exist"
      - "IDENTITY_PROFILE_INVALID | 422 | no | received profile signature, size or sequence check failed"
    example: |
      vault command: identity.profile.update { "bio": "Fixes bikes on weekends.", "visibility": { "bio": "public", "region": "contacts" }, "expectedRevision": 2 }
      -> { "profileId": "0192f440-…", "revision": 3 }
      vault command: identity.block.add { "blockedDid": "did:key:z6Mk…", "note": "spam offers" }
      -> { "blockId": "0192f441-…", "revision": 1 }
      port: isBlockedEither("did:key:z6MkA…", "did:key:z6MkB…") -> true
  authorization_capabilities:
    requirements:
      - Vault policy - only the unlocked principal edits its profile and block list; received profiles are accepted only with a valid signature from the profile's DID.
      - Visibility is enforced at composition and at read; a stranger can never read contacts or private fields because those never leave the vault in a public statement.
      - Relay policy - a relay may host profile statements and hide them under its policy; it has no access to blocks.
    capabilities:
      - "identity.profile.write_own | principal | unlocked local principal"
      - "identity.profile.publish_own | principal | unlocked local principal; audience contacts requires an existing thread"
      - "identity.profile.receive | principal | signature verifies; signer DID not blocked"
      - "identity.profile.read_view | principal, anonymous | vault - unlocked principal; relay copies - public read of public fields only"
      - "identity.block_entry.write_own | principal | unlocked local principal"
      - "identity.block_entry.read_own | principal | unlocked local principal"
  failure_recovery_idempotency:
    requirements:
      - Vault commands are idempotent through the local command log and use expectedRevision; a profile publish is queued through the sync outbox with states local_committed, prepared, transport_acknowledged and peer_accepted.
      - Blocking is effective locally the moment it commits, independent of any network.
      - Receiving the same profile statement twice is a no-op keyed by cid.
    idempotency: "Idempotency-Key per command in the vault log for 24 h; receive keyed by cid; block add for an existing active pair returns the existing blockId."
    concurrency: "expectedRevision on profile and block mutations; the partial unique index prevents duplicate active blocks; Web Locks serialize tabs; two devices of the same principal reconcile profile edits as CONFLICT_REVISION with a resolve-or-discard prompt (IDM-5)."
    retries: "Outbox retries follow base 500 ms, cap 30 s, full jitter, max 6 attempts per window; local commands are not retried."
    offline: "Profile editing, publishing to the outbox and blocking all work offline; the UI shows 'not yet delivered' until transport_acknowledged and 'accepted by peer' only after a signed acknowledgement."
    partial_failure: "If avatar re-encoding fails the update is rejected as a whole; if a relay rejects the published statement the local profile remains and the per-relay state shows the error."
  privacy_retention_abuse:
    requirements:
      - The block list is P3 and never leaves the vault, never appears in statements, logs, relay requests or events below P3, and the blocked person receives no notification.
      - Public profile fields are exactly what the user marked public; a published profile and copies other vaults fetched cannot be recalled, only superseded or tombstoned, and the UI says so before first publication.
      - Region never exceeds L2 and is off by default.
    data:
      - "Profile public fields: P0 once published; contacts fields: P2 end-to-end encrypted to participants; private fields stay P3 in the vault."
      - "BlockEntry: P3, device only; note is a private free text."
    retention:
      - "Own profile and blocks until the user deletes them or vault erase (RET-STANDARD); removed blocks purged after 30 days; received profiles evicted after 180 days unviewed."
    threats:
      - "T01 | Blocked person learns of the block | statements from the blocked DID are dropped silently, no error identifies the block, the outbox of the sender shows at most transport_acknowledged and never peer_accepted; honest limit - repeated failure of acknowledgement can hint at it"
      - "T02 | Bio or avatar used for phishing or doxxing | plain text only, links not auto-linked, avatar re-encoded without metadata, report goes to the relay's hosting policy and local hide is available"
      - "T03 | Fake profile impersonating a known contact | profile signature binds content to the DID, DID fingerprint always shown next to the pseudonym, confusable warning from F07.S01.M01"
      - "T04 | Region leak through visibility mistakes | region defaults to private, preview of 'what a stranger sees', statement composer drops private fields, contract test for L2 maximum"
      - "T05 | Mass profile spam from throwaway DIDs | vault intake limit of 50 profiles per hour per transport source, unknown DIDs shown as strangers, relay quotas apply"
    abuse_controls:
      - "Intake limits - 50 received profiles per hour per source, 32 KiB per statement, quarantine beyond."
      - "Block cap 1 000; block and unblock actions limited to 60 per hour to avoid accidental loops."
  observability_performance:
    requirements:
      - The PWA sends no telemetry; local diagnostics keep counters without DIDs or content.
      - Block checks used by other modules cost at most 1 ms p95 for a single lookup and 5 ms for a list of 500 DIDs on a Moto G-class device.
      - Profile view renders within the PWA budget (LCP at most 2.5 s on the 4G profile).
    metrics:
      - "local counter block_check_total{result=allowed|blocked}"
      - "local counter profile_statements_total{event=published|received|rejected}"
    logs:
      - "info profile.event {event, correlationId} in the local diagnostics log - no DIDs, bios or notes."
    budgets:
      - "isBlockedEither p95 <= 1 ms; filterBlocked(500) p95 <= 5 ms; profile update p95 <= 100 ms excluding avatar encoding (<= 400 ms)."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement is covered by at least one automated test with fixed key pairs and an injected clock.
      - Privacy tests prove that private fields and blocks never appear in statements, logs or events below P3.
      - Block enforcement is tested end to end across a consumer module fake.
    fixtures: "Principal P with DID, strangers S1, S2 (S2 blocked), contact C, avatar fixtures (3 MB JPEG with GPS EXIF, valid WebP), fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R03,02.R01 | update bio and visibility then compose the public statement | statement contains only public fields; private fields absent; size under 32 KiB"
      - "T02 | unit | 02.R02,01.R03 | upload 3 MB JPEG with GPS EXIF and an oversized WebP | re-encoded WebP 128 by 128 under 24 KiB without metadata, or IDENTITY_AVATAR_INVALID"
      - "T03 | unit | 02.R01,02.R03 | bio 501 code points, 6 languages, region cell with 6 characters, stale expectedRevision | VALIDATION_FAILED, IDENTITY_REGION_INVALID or CONFLICT_REVISION each time"
      - "T04 | property | 03.R01,03.R02,03.R03 | random sequences of hide, unhide, tombstone, block, unblock | only declared transitions succeed; deleted and removed are final"
      - "T05 | integration | 01.R02,04.R02 | block S2 then deliver a profile, an offer card and a message from S2 | all dropped silently; S2 gets no error; isBlockedEither is true both ways"
      - "T06 | contract | 04.R01,04.R03,09.R02 | every command, query and event run | outputs, statements and payloads validate against registry schemas; signatures verify"
      - "T07 | integration | 04.R02,06.R01 | consumer fakes subscribe to identity.block.added | open offers, drafts, shares and outbox items to the blocked DID are cancelled with reason blocked"
      - "T08 | abuse | 05.R01,05.R02,05.R03 | stranger requests contacts fields; forged profile for a known DID; locked vault edits | only public fields served; signature fails; FORBIDDEN"
      - "T09 | chaos | 06.R01,06.R02,06.R03 | replay of same key and same statement; offline publish; avatar encoder failure | one result; outbox states shown honestly; whole update rejected on failure"
      - "T10 | abuse | 07.R01,07.R02,07.R03 | inspect statements, relay requests, logs and events for blocks and private fields; 51 profiles per hour from one source | none present; excess quarantined"
      - "T11 | load | 08.R01,08.R02,08.R03 | 10 000 block lookups and filterBlocked(500) on emulated Moto G | p95 <= 1 ms and <= 5 ms"
      - "T12 | a11y | 01.R01,03.R01 | edit profile, blocked people and other-profile screens with axe-core | zero serious or critical issues; counter and dialogs announced"
      - "T13 | unit | 09.R01,09.R03 | traceability run over PS-056 | every requirement maps to a passing test"
      - "T14 | integration | 10.R01,10.R02,10.R03 | export, import in a fresh vault, vault erase | profile and blocks round-trip; received profiles re-verified; erase removes all"
    acceptance:
      - All tests T01-T14 pass in CI.
      - The block list never appears in any statement, relay payload, log or event class below P3 (privacy suite).
      - A blocked DID's statements are dropped on intake in every module that consumes the block port.
  import_export_backup_rollback:
    requirements:
      - The vault export contains the own profile, received profile cache entries the user kept (contacts), and the block list.
      - Import revalidates avatar and statement limits and signatures of received profiles, and restores blocks as active entries up to the 1 000 cap.
      - Schema changes follow expand/contract and keep v1 readable for 180 days.
    export: "Sections identity.profiles and identity.blocks in classrup-export/v1 (schemas classrup.identity.profile/v1 and classrup.identity.block_entry/v1); blocks are included only in the owner's own export."
    import: "Received profiles are re-verified and skipped if invalid; blocks beyond the cap are reported and skipped; own profile replaces the default only when seq is higher."
    backup: "The vault export is the primary backup (IOX-6); relays hold public profile statements only (IOX-7) and never blocks."
    migration_rollback: "Additive optional fields only in v1 (under ext for signed statements); rollback is safe because older readers ignore unknown fields."
