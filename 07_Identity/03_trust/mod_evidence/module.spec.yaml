id: F07.S03.M02
scope: MVP
summary: >-
  Trust attestations are small signed claims about a DID - self-declared labels, 'met in person' statements by a peer,
  'email check claimed' statements signed by a relay operator, same-owner links signed by both DIDs, and generic claims
  signed by any third-party DID. Each is a signed statement (classrup.identity.attestation/v1) that evidences that the
  signer asserted the claim, not that it is true, and the interface always shows who signed it and the words 'this
  shows they said so'. The module stores no identity documents, no email addresses and no phone numbers (no KYC data).
  Subjects decide whether claims about them are shown publicly - every claim about another person is issued only to
  the subject, end-to-end encrypted, and becomes public only when the subject republishes it with an endorsement
  countersignature. A relay key is recognised only from the relay's own signed descriptor and the viewer's chosen
  relays and peers. The module also answers the same-owner linkage read used for anti-shill checks (N11).
responsibilities:
  - Define the attestation kinds and their default validity - self_claim 365 days, peer_met_in_person 180 days, relay_email_check 365 days, third_party 365 days, same_owner 365 days.
  - Issue attestations as the local principal (self, peer, third party, same owner), receive and verify attestations from others, and revoke them with a signed revocation statement by the issuer.
  - Let a relay operator issue a relay_email_check attestation signed with the relay's key after an out-of-band check, naming the relay origin and delivered only to the subject, storing only the fact and the date, never the email.
  - Keep the relay key set - keys from the signed descriptors of the viewer's chosen relays and peers (F15.S02.M01, F11.S03.M01, F16.S02.M02) - and re-check relay_email_check attestations whenever it changes.
  - Let the subject endorse a claim about itself so it can be shown publicly, co-sign same_owner links, and set local visibility; show attestations with issuer provenance.
  - Answer identity.attestation.list_linkage with the same_owner links of a DID, which both the issuer's and the subject's device keys signed, for in-process host relay anti-shill checks (F04.S02.M01 V03, N11, PT-15), and implement SameOwnerLinkPort for the F07.S02.M01 KeyLinkagePort.
  - Sign and store attestations, revocations and endorsements only through the F11.S01.M01 StatementPublisherPort (implemented by F11.S01.M02).
non_responsibilities:
  - Reputation from reviews (F07.S03.M01) and account recovery (F07.S01.M03).
  - Performing email or phone verification flows; MVP relies on an operator's out-of-band check, and automated email proof through notification channels is Future.
  - Collecting, storing or evaluating identity documents (KYC); explicitly out of scope.
  - Relay identity keys and their rotation (F15.S02.M01, F11.S03.M01); this module only reads them.
  - "Future: automated email proof flow through F13, web-of-trust path display, attestation revocation lists distributed by relays."
depends_on: [F07.S01.M01, F07.S02.M01, F07.S02.M02, F11.S01.M01, F11.S03.M01, F15.S02.M01, F16.S02.M02, F10.S01.M01, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-FED-001, CTR-SCH-001, CTR-PRV-001, CTR-OBS-001, CTR-IOX-001, CTR-FLG-001]
user_stories:
  - As a user, I add a self-declared label such as 'Member of the Elm Street repair cafe' and it is shown as self-declared.
  - As a buyer who just met a seller, I can sign 'met in person' about them and send it to them, and they can endorse it to show it on their profile.
  - As a relay operator, I can state that I checked control of an email for a member without storing the email, and the member decides whether to show it.
  - As a viewer, I can see exactly who signed each claim and whether I know or trust the signer.
  - As a user with two identities, I can link them with a same-owner attestation that both identities sign, so a host relay can treat them as one bidder.
edge_cases:
  - An attestation's signature is valid but the issuer is a brand-new DID; it is shown with the issuer's pseudonym and 'new signer' and carries no extra weight.
  - The issuer revokes after the subject republished it; viewers who receive the revocation mark it revoked, viewers who do not stay unaware, and the UI shows 'last checked' time.
  - A relay key is later compromised; the operator rotates it with classrup.federation.key_rotation/v1 and the descriptor lists the old key as retired; attestations from the old key show 'signer key retired' once viewers re-check the relay key set.
  - A peer tries to attest 'met in person' for someone they never completed a meetup with; the issuing vault warns when no local meetup evidence exists and the statement then says 'no local evidence' in a field.
  - A subject receives an unwanted claim about them (for example an insulting label); it arrives subject-only, the subject simply does not endorse it, can report it to the relay, and cannot delete the issuer's statement.
  - 21 attestations exist for one subject; only the 20 newest valid ones are displayed and the rest are kept in history.
  - The claimed expiry is 10 years ahead; it is clamped to the kind's maximum validity from local receipt time.
  - An attestation label contains links, or looks like an official claim ('Verified by government'); free text is plain text, linkless, and labels with reserved official words are refused for self_claim.
  - A user DID signs a relay_email_check naming relay R; R's descriptor is fetched and does not list the key, so the statement is rejected with IDENTITY_ATTESTATION_KIND_INVALID.
  - R's descriptor cannot be fetched; the relay_email_check is shown only as a 'Signed claim' without the relay badge and re-checked when the relay key set changes.
  - An issuer publishes a 'met in person' claim about someone straight to a public relay without the subject's endorsement; viewers store it but do not display it.
  - A same_owner attestation carries only the issuer's signature; rejected with IDENTITY_ATTESTATION_KIND_INVALID.
  - A relay signs a tombstone for someone's attestation; the attestation stays active and only that relay is dropped from provenance.
ux:
  screens:
    - "Profile > Trust: list of attestations with signer pseudonym, DID fingerprint, kind badge (Self-declared, Met in person - claimed by signer, Email check claimed by relay <host>, Same owner - both signed, Signed claim), 'this shows they said so', date, validity, endorsement state, and a 'Signed by' detail sheet."
    - "Issue attestation sheet: kind selector, claim label (80 chars), optional context, explanation of what the signature means and that the claim goes only to its subject, Sign button."
    - "Claims about me: received claims with Endorse and show publicly, Keep private, Report-to-relay; same-owner requests with Co-sign."
    - "Operator console: issue a relay email check for a DID after an out-of-band check, with a checklist and a note that the email is not stored and that the member decides whether to show it."
  states: [loading, empty, active, endorsed, not-endorsed, relay-key-unverifiable, expired, revoked, pending-offline, error]
  a11y:
    - Kind badges have text labels and the signer detail is reachable by keyboard with a modal dialog that traps focus correctly.
    - Revoked and expired states are text and announced via aria-live polite.
    - All actions are buttons at least 44 by 44 px with accessible names including the claim label.
processes:
  domain_schema:
    requirements:
      - A TrustAttestation stores kind, subject, issuer, claim label, validity, the signed statement fields, endorsement and provenance; it stores no email, phone, document or biometric data.
      - Every attestation carries the issuer's Ed25519 envelope signature (F11.S01.M03) by a device key in ext.signerKey that the issuer's latest verified portable document does not mark revoked at this vault's receipt (a relay key from the relay key set for relay_email_check), is quarantined when a revocation learned later took effect before this vault first saw it, and is verifiable offline.
      - Visibility is a local setting of the subject and never alters the signed statement; public display of a claim about another person requires the subject's endorsement countersignature, and a same_owner link requires signatures by both DIDs.
    entities:
      - name: TrustAttestation
        schema: classrup.identity.attestation/v1
        storage: relay+device
        privacy: P1
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope"
          - "kind: enum — self_claim | peer_met_in_person | relay_email_check | third_party | same_owner"
          - "subjectDid: did — the DID the claim is about"
          - "issuerDid: did — signer; equals subjectDid for self_claim; the relay key did:key for relay_email_check"
          - "issuerRelayOrigin?: string — HTTPS origin of the issuing relay, relay_email_check only, bound into the signed payload"
          - "signerKey: string — ext.signerKey, a device key of issuerDid not revoked in its latest verified document at receipt, or the relay key"
          - "claimKey: string — 1..40 characters from a fixed vocabulary or custom:<slug> for self_claim and third_party"
          - "label: string — 1..80 code points, plain text, no links, no reserved official words for self_claim"
          - "contextRef?: object — { type: meetup|deal, blindedRef (base64url SHA-256 of JCS({ id, issuerDid, subjectDid })), localEvidence: boolean }; the raw id appears only in the subject-only delivery"
          - "cosignature?: object — same_owner only; { did: subjectDid, keyId, sig } by an active device key of the subject over the attestation cid with prefix classrup-attestation-cosign:v1, delivered inside the subject's classrup.identity.attestation_endorsement/v1, so the issuer's and the subject's keys both sign"
          - "endorsement?: object — { statementCid, keyId } of the subject's classrup.identity.attestation_endorsement/v1 countersignature"
          - "audience: enum — subject_only | public; every kind except self_claim is issued subject_only"
          - "claimedIssuedAt: timestamp — issuer's claim"
          - "claimedExpiresAt: timestamp — issuer's claim"
          - "effectiveExpiresAt: timestamp — min(claimedExpiresAt, firstSeenAt plus the kind's maximum validity)"
          - "firstSeenAt: timestamp — local clock when this vault first saw the statement"
          - "origin: enum — issued | received"
          - "provenance?: object — { originRelay?, via, receivedAt, verifiedAt }"
          - "relayKeyCheck?: object — relay_email_check only; { result: listed|retired|not_listed|unverifiable, checkedAt }"
          - "cid: string — per F11.S01.M03, sha256- plus base64url(SHA-256(JCS(envelope minus sig and cid))), computed by the StatementPublisherPort for issued statements"
          - "sig: string — Ed25519 signature by signerKey over JCS(envelope minus sig) per F11.S01.M03; the envelope type classrup.identity.attestation/v1 separates it from other statement types"
          - "visibility: enum — public | contacts | private; local to the subject, default private for received, public for issued self_claim"
          - "syncState?: enum — local_committed | prepared | transport_acknowledged | peer_accepted (issued statements)"
          - "status: enum — active | revoked | expired"
          - "revocation?: object — { statementCid, reason: issuer_revoked|key_retired|tombstoned, receivedAt }"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - The envelope signature verifies with signerKey per F11.S01.M03, signerKey was not revoked for issuerDid (or was listed for issuerRelayOrigin) at receipt, and no revocation learned later took effect at or before firstSeenAt.
          - issuerDid equals subjectDid exactly when kind is self_claim; a same_owner attestation has issuer different from subject and a valid cosignature by the subject.
          - A non-self claim is displayed publicly only with a valid endorsement by the subject (same_owner counts its cosignature).
          - effectiveExpiresAt is at most 365 days after firstSeenAt (180 days for peer_met_in_person).
          - No field holds an email, phone number, address or identity document data, and public statements carry only the blinded contextRef.
    sql: |
      CREATE TABLE identity_attestation (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, kind TEXT NOT NULL, subject_did TEXT NOT NULL, issuer_did TEXT NOT NULL,
        cid TEXT NOT NULL, status TEXT NOT NULL, effective_expires_at TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX identity_attestation_cid ON identity_attestation(tenant_id, cid);
      CREATE INDEX identity_attestation_subject ON identity_attestation(tenant_id, subject_did, status);
      CREATE INDEX identity_attestation_linkage ON identity_attestation(tenant_id, kind, issuer_did, subject_did) WHERE kind = 'same_owner';
  validation_rules:
    requirements:
      - Every attestation is verified for signature, signer key status, kind rules and field limits before it is displayed.
      - Free-text labels are restricted to plain text with a reserved-word filter so a label cannot pose as an official verification.
      - Expiry is anchored on the verifier's own clock and capped per kind.
      - The relay key set used to check relay_email_check is built from the signed descriptors of the viewer's chosen relays and peers (F15.S02.M01 descriptor, F11.S03.M01 peer records, F16.S02.M02 key records) and every affected attestation is re-checked when the set changes.
      - same_owner attestations require valid signatures by both DIDs, and endorsements must be signed by the subject.
    rules:
      - "V01 | the envelope signature verifies per F11.S01.M03 with ext.signerKey a device key that the issuer's latest verified document does not mark revoked at receipt, whatever createdAt claims (F07.S02.M01 key_status at receiver time), or for relay_email_check the relay key, and the statement is at most 4 KiB | IDENTITY_ATTESTATION_SIGNATURE_INVALID"
      - "V02 | kind rules hold - self_claim has issuer equal to subject; peer_met_in_person, third_party and same_owner have issuer different from subject; same_owner carries a valid cosignature by the subject; relay_email_check names issuerRelayOrigin and its key is listed active for that origin in the relay key set, a key absent from a fetched descriptor being rejected | IDENTITY_ATTESTATION_KIND_INVALID"
      - "V03 | label is 1..80 code points of plain text without links, and for self_claim contains none of the reserved words verified, official, certified, government, police | VALIDATION_FAILED"
      - "V04 | claimedExpiresAt is after claimedIssuedAt, and effectiveExpiresAt is capped at 365 days (180 days for peer_met_in_person) after firstSeenAt | VALIDATION_FAILED"
      - "V05 | the issuer has issued fewer than 10 attestations in the last 24 hours and the subject has at most 20 active displayed attestations | RATE_LIMITED"
      - "V06 | one active peer_met_in_person and one active same_owner per (issuerDid, subjectDid) pair | CONFLICT_STATE"
      - "V07 | revocation is signed by a device key of the original issuerDid not revoked at receipt (or the relay key) and refers to the attestation cid | IDENTITY_ATTESTATION_SIGNATURE_INVALID"
      - "V08 | issued non-self attestations use audience subject_only; a received public non-self claim without a valid subject endorsement is stored but never displayed | VALIDATION_FAILED"
      - "V09 | an endorsement or cosignature is signed by an active device key of subjectDid over the attestation cid with prefix classrup-attestation-endorsement:v1 or classrup-attestation-cosign:v1 | IDENTITY_ATTESTATION_SIGNATURE_INVALID"
      - "V10 | public statements and endorsements carry only the blinded contextRef; the raw context id appears only in the subject-only delivery | VALIDATION_FAILED"
      - "V11 | a public attestation or endorsement is queued to a relay only after privacy.consent.check(federation_publish, relayId) is granted; revocations are always sent | PRECONDITION_FAILED"
      - "V12 | relay_email_check whose relay descriptor cannot be fetched is shown only as a Signed claim (third_party display) until the relay key set can verify it | DEPENDENCY_UNAVAILABLE"
  workflow_state_machine:
    requirements:
      - An attestation is active until the issuer revokes it or it expires; both ends are final for that statement.
      - Revocation takes effect for a viewer only when the viewer receives the signed revocation, and the viewer's UI shows the last-checked time.
      - Re-issuing creates a new statement and a new attestation record.
      - A tombstone revokes an attestation only when its author equals the issuer; a tombstone signed by an origin relay only drops that relay's provenance entry, and the subject's endorsement changes display, not the statement.
    machines:
      - entity: TrustAttestation
        initial: active
        terminal: [revoked, expired]
        transitions:
          - "active -> active | identity.attestation.endorse by the subject, or a received endorsement or cosignature | attach the endorsement; the claim becomes publishable and displayable"
          - "active -> revoked | identity.attestation.revoke by the issuer, a signed revocation from the issuer, a retired relay key in the relay key set, or a tombstone whose author equals issuerDid | set revocation details, emit identity.attestation.revoked"
          - "active -> expired | expiry sweep at effectiveExpiresAt | hide from default lists, keep as history, emit identity.attestation.revoked with reason expired"
    timeouts:
      - "Expiry sweep every 60 s while the app is open and at every unlock."
      - "Relay descriptors of the relay key set are re-fetched when older than 24 hours before a relay_email_check is displayed."
      - "Expired and revoked attestations are kept 2 years (RET-EVIDENCE) for verifying past statements, then deleted or pseudonymized."
  commands_queries_events:
    requirements:
      - issue, revoke, endorse and set_visibility are vault commands; issue, revoke and endorse produce the signed statements classrup.identity.attestation/v1, classrup.identity.attestation_revocation/v1 and classrup.identity.attestation_endorsement/v1 signed by a device key and signed and stored only through the F11.S01.M01 StatementPublisherPort (implemented by F11.S01.M02); receive is the vault intake of someone else's statement.
      - issue_relay is a relay command signed with the relay key that names the relay origin, is delivered only to the subject end-to-end encrypted, and stores no personal data beyond the subject DID and date.
      - Every command emits its events in the same transaction as the state change.
      - identity.attestation.list_linkage returns the same_owner links of a DID, signed by both the issuer's and the subject's device keys, with their status for key-linkage checks (N11); on a host relay it runs in-process only over cosigned same_owner attestations published to that relay, for anti-shill checks of auctions whose seller chose it (F04.S02.M01 V03, PT-15), and SameOwnerLinkPort.linked(didA, didB) serves the same data to F07.S02.M01 KeyLinkagePort.
    commands:
      - name: identity.attestation.issue
        capability: identity.attestation.issue
        input: "{ kind: self_claim|peer_met_in_person|third_party|same_owner, subjectDid, claimKey, label, contextRef?, validityDays?, audience: public (self_claim only)|subject_only, targetRelays? }"
        output: "{ attestationId, cid, statement: classrup.identity.attestation/v1, syncState: local_committed }"
        errors: [VALIDATION_FAILED, IDENTITY_ATTESTATION_KIND_INVALID, CONFLICT_STATE, BLOCKED_PARTY, PRECONDITION_FAILED, RATE_LIMITED]
        emits: [identity.attestation.added]
        idempotent: true
      - name: identity.attestation.receive
        capability: identity.attestation.receive
        input: "{ statement: classrup.identity.attestation/v1 or classrup.identity.attestation_endorsement/v1, provenance }"
        output: "{ attestationId, status, displayable: boolean, effectiveExpiresAt }"
        errors: [IDENTITY_ATTESTATION_SIGNATURE_INVALID, IDENTITY_ATTESTATION_KIND_INVALID, VALIDATION_FAILED, DEPENDENCY_UNAVAILABLE, RATE_LIMITED]
        emits: [identity.attestation.added]
        idempotent: true
      - name: identity.attestation.endorse
        capability: identity.attestation.endorse
        input: "{ attestationId, publish: boolean, targetRelays?, expectedRevision }"
        output: "{ attestationId, revision, endorsement: classrup.identity.attestation_endorsement/v1, syncState: local_committed }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, PRECONDITION_FAILED]
        emits: []
        idempotent: true
      - name: identity.attestation.revoke
        capability: identity.attestation.revoke
        input: "{ attestationId, expectedRevision }"
        output: "{ attestationId, revision, revocation: classrup.identity.attestation_revocation/v1 }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [identity.attestation.revoked]
        idempotent: true
      - name: identity.attestation.set_visibility
        capability: identity.attestation.set_visibility
        input: "{ attestationId, visibility: public|contacts|private, expectedRevision }"
        output: "{ attestationId, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: []
        idempotent: true
      - name: identity.attestation.issue_relay
        capability: identity.attestation.issue_relay
        input: "{ subjectDid, kind: relay_email_check, validityDays? (1..365, default 365), checkNote? (0..140 code points, no email) }"
        output: "{ attestationId, cid, statement: classrup.identity.attestation/v1 (issuerRelayOrigin set, audience subject_only) }"
        errors: [VALIDATION_FAILED, CONFLICT_STATE, FORBIDDEN, RATE_LIMITED]
        emits: [identity.attestation.added]
        idempotent: true
    note: "Statements and signer roles (N2), all signed and stored through the F11.S01.M01 StatementPublisherPort (envelope per F11.S01.M03, author the principal did:key, ext.signerKey the device key): classrup.identity.attestation/v1 - a device key of issuerDid active in its document, or for relay_email_check the relay key listed for issuerRelayOrigin; classrup.identity.attestation_revocation/v1 - the original issuer; classrup.identity.attestation_endorsement/v1 and the same_owner cosignature - a device key of subjectDid. Relay key set - descriptors from /.well-known/classrup-relay.json of F15.S02.M01 fetched over HTTPS from issuerRelayOrigin, peer records of F11.S03.M01, key records of F16.S02.M02, and rotations via classrup.federation.key_rotation/v1 (F11.S03.M01); retired keys keep verifying old statements with 'signer key retired'. Display rule - the badge for relay_email_check reads 'Email check claimed by relay <host>' followed by 'this shows they said so', and no UI string for any kind says 'verified'. Statements from blocked DIDs are dropped silently (N7). Port provided: SameOwnerLinkPort.linked(didA, didB) for F07.S02.M01 KeyLinkagePort, wired by the composition root because this module depends on F07.S02.M01; a cosigned same_owner attestation may be published, after federation_publish consent, to a host relay, which stores it for in-process list_linkage."
    queries:
      - name: identity.attestation.list_for_subject
        capability: identity.attestation.read_view
        input: "{ subjectDid, includeInactive?: boolean, cursor?, limit? (1..50) }"
        output: "{ items: [TrustAttestation with signer pseudonym, fingerprint, endorsement state and lastCheckedAt], nextCursor? }"
        errors: [NOT_FOUND]
      - name: identity.attestation.list_issued
        capability: identity.attestation.read_issued
        input: "{ status?: active|all, cursor?, limit? (1..50) }"
        output: "{ items: TrustAttestation[], nextCursor? }"
        errors: []
      - name: identity.attestation.list_linkage
        capability: identity.attestation.read_linkage
        input: "{ did, includeInactive?: boolean }"
        output: "{ items: [{ otherDid, attestationCid, status: active|revoked|expired }] }"
        errors: []
    events_produced:
      - {type: identity.attestation.added, privacy: P1, payload: "{ attestationId, kind, subjectDid, issuerDid, effectiveExpiresAt, displayable, origin }"}
      - {type: identity.attestation.revoked, privacy: P1, payload: "{ attestationId, kind, subjectDid, issuerDid, reason: issuer_revoked|key_retired|tombstoned|expired }"}
    events_consumed:
      - {type: federation.tombstone.applied, effect: "mark the targeted attestation revoked with reason tombstoned only when the tombstone author equals issuerDid and its signer key was active; a tombstone signed by an origin relay only drops that relay from provenance and the attestation stays active"}
      - {type: identity.portable_doc.published, effect: "origin received - re-verify attestations, endorsements and cosignatures signed by keys of that DID; for each newly revoked key those first seen at or after its clamped revokesEffectiveAt are quarantined, earlier ones stay valid with a revoked-signer marker, quarantined ones re-verify"}
      - {type: identity.device_key.revoked, effect: "own principal only - statements this vault issued stay valid for viewers who first saw them before the revocation; refresh the displayed signer device and warn that the revoked key cannot sign new ones"}
      - {type: federation.peer.added, effect: "add the peer relay key to the relay key set and re-check relay_email_check attestations naming that relay"}
      - {type: federation.peer.removed, effect: "remove the peer relay key from the relay key set unless the viewer selected that relay, and re-check affected relay_email_check attestations"}
      - {type: privacy.deletion.completed, effect: "final cleanup only - the DeletionPort steps already revoked own public attestations where chosen, deleted the rest and pseudonymized attestations kept as evidence"}
    errors:
      - "IDENTITY_ATTESTATION_SIGNATURE_INVALID | 422 | no | attestation, revocation, endorsement or cosignature signature does not verify with an active key of the stated signer"
      - "IDENTITY_ATTESTATION_KIND_INVALID | 422 | no | issuer, subject, cosignature or relay key do not satisfy the rules of the attestation kind"
    example: |
      vault command: identity.attestation.issue { "kind": "peer_met_in_person", "subjectDid": "did:key:z6Mk…", "claimKey": "met_in_person", "label": "Met at the Saturday swap meet", "contextRef": { "type": "meetup", "id": "0192f460-…" }, "audience": "subject_only" }
      -> { "attestationId": "0192f461-…", "cid": "sha256-Qm…", "syncState": "local_committed", "statement": { "type": "classrup.identity.attestation/v1", "author": "did:key:z6MkIssuer…", "ext": { "signerKey": "did:key:z6Mk…device…" }, "payload": { "subject": "did:key:z6Mk…", "claimKey": "met_in_person", "contextRef": { "type": "meetup", "blindedRef": "…" } }, "sig": "…" } }
      subject vault: identity.attestation.endorse { "attestationId": "0192f462-…", "publish": true, "expectedRevision": 1 } -> endorsement queued to the subject's relays
      meaning shown to viewers: "Signed by Riverstone (fingerprint 7Qx2 9mKp R4tW 8vNe) on 2026-11-04. This shows they said so; it does not prove it is true."
  authorization_capabilities:
    requirements:
      - Vault policy - only the unlocked principal issues or revokes attestations under its own DID and endorses, co-signs or sets visibility of claims about itself; received attestations are accepted only on a valid signature by an active key of the stated issuer.
      - Relay policy - only the operator role of a relay can issue relay_email_check attestations, signed with that relay's key and naming the relay origin; the attestation means only that this relay's operator says it checked an email, and viewers choose which relays they trust.
      - Viewing follows the subject's visibility and endorsement; non-self claims are issued subject-only and are shown publicly only when the subject republished them with an endorsement countersignature, and private attestations are never included in published or shared profile statements.
    capabilities:
      - "identity.attestation.issue | principal | unlocked principal; issuer DID equals the principal DID; subject not blocked; non-self kinds subject_only"
      - "identity.attestation.receive | principal | signature verifies against an active key of the issuer or the relay key set; issuer not blocked (otherwise dropped silently)"
      - "identity.attestation.endorse | principal | unlocked principal and attestation.subjectDid equals the principal DID"
      - "identity.attestation.revoke | principal | unlocked principal and attestation.issuerDid equals the principal DID"
      - "identity.attestation.set_visibility | principal | unlocked principal and attestation.subjectDid equals the principal DID"
      - "identity.attestation.issue_relay | operator | operator role on this relay and relay signing key available; delivered only to the subject"
      - "identity.attestation.read_view | principal, anonymous | vault - unlocked principal; relay copies - public endorsed attestations only"
      - "identity.attestation.read_issued | principal | unlocked local principal"
      - "identity.attestation.read_linkage | principal, operator | vault - unlocked principal or in-process modules; relay - in-process only, the host relay's anti-shill checks for auctions whose seller chose it and F10.S01.M02 legal-hold approval, over cosigned same_owner attestations it stores (N11, PT-15); never served over HTTP"
  failure_recovery_idempotency:
    requirements:
      - Issue, receive, endorse and revoke are idempotent by statement cid, and duplicate delivery never creates a duplicate attestation.
      - Statements go through the sync outbox with states local_committed, prepared, transport_acknowledged and peer_accepted, and the UI never shows more than the reached state.
      - A revocation that cannot be delivered still takes effect locally, and the UI says other people may not have seen it yet.
    idempotency: "Idempotency-Key per command in the vault log for 24 h; receive, endorsement and revocation keyed by cid; issue_relay keyed by (subjectDid, kind, validity window)."
    concurrency: "expectedRevision on revoke, endorse and visibility; unique cid index; one active peer and one active same_owner attestation per pair enforced in the transaction; Web Locks serialize tabs."
    retries: "Outbox retries follow base 500 ms, cap 30 s, full jitter, max 6 attempts per window until transport_acknowledged or the user cancels; descriptor fetches retry at most hourly."
    offline: "Issue, endorse, revoke and visibility changes work offline and wait in the outbox; verification of received statements needs no network except relay descriptors, whose last fetched copy is used until 24 hours old and then the claim shows as a Signed claim."
    partial_failure: "If statement signing fails nothing is stored; if delivery to one relay fails, local state stays and the per-relay sync state shows the error; if a descriptor fetch fails the relay_email_check keeps its last check result with its checkedAt time."
  privacy_retention_abuse:
    requirements:
      - No KYC or contact data is stored; the relay_email_check attestation records only that the operator said it checked an email on a date, never the address.
      - Attestations are evidence that a signer asserted a claim; the UI never states that a claim is true or verified, and a signer can be a stranger or a throwaway DID.
      - Subjects decide whether claims about them are shown publicly by endorsing them, but cannot erase another person's signed statement from other vaults.
      - The module meets the N6 privacy duties - it registers ExportSectionPort (section identity.attestations), DeletionPort (pseudonymize attestations kept as RET-EVIDENCE, delete the rest) and RetentionPurgePort, classifies fields with F10.S02.M02, calls privacy.consent.check(federation_publish, relayId) before queuing a public attestation or endorsement, and treats privacy.deletion.completed only as final cleanup.
      - Public statements carry only a blinded contextRef, so deal and meetup ids never leak through attestations.
    data:
      - "TrustAttestation: P1 when public (self_claim or endorsed); subject-only deliveries are end-to-end encrypted (P2); claim labels are free text with a 80 code point limit."
      - "Operator check notes: at most 140 code points, kept on the relay in audit logs for RET-AUDIT (1 year), never containing the email."
    retention:
      - "RET-EVIDENCE (2 years after last related activity) for attestations; revoked and expired kept as history for the same period and pseudonymized on account deletion; local quarantined items 30 days."
      - "On vault erase all local attestations are deleted or pseudonymized; copies in other vaults and relays remain until signed tombstones or revocations by their issuers arrive."
    threats:
      - "T01 | Attestation mistaken for proof of truth or identity | wording 'Signed by X; this shows they said so', issuer always shown with pseudonym and DID fingerprint, no checkmark icon and no 'verified' string anywhere"
      - "T02 | Sybil attestation rings (Douceur 2002) where throwaway DIDs vouch for each other | attestations have no numeric reputation effect in MVP, new signers are labelled, per-issuer limit of 10 per 24 h, pairs limited to one active peer attestation"
      - "T03 | Operator misuse or key compromise of relay_email_check | claims only say this relay's operator says it checked, the signature binds the relay key and origin, key rotation and retired status in the descriptor mark attestations 'signer key retired', viewers can choose to hide a relay's attestations"
      - "T04 | Harassing or defamatory labels about a person | claims about others arrive subject-only and are shown publicly only with the subject's endorsement; viewers ignore unendorsed public copies; report to relay hosting policy; honest limit - the statement can remain elsewhere"
      - "T05 | Label impersonates an official verification | reserved-word filter for self-claims and a fixed visual style for self-declared items"
      - "T06 | Stale or expired claims relied upon | expiry capped per kind and anchored on local first-seen time, last-checked time shown for revocations"
      - "T07 | Anyone mints a relay badge by signing relay_email_check with a user key | the key must be listed for the named relay origin in the relay key set built from the relay's signed descriptor and the viewer's peers; otherwise the claim is rejected or shown only as a Signed claim"
      - "T08 | Linking deal or meetup ids through attestations | public statements carry only a blinded contextRef"
      - "T09 | Relay revokes a user's attestation in other vaults | only the issuer's revocation or an issuer-authored tombstone revokes it; relay tombstones drop only that relay's provenance"
      - "T10 | False same-owner linkage to frame someone as a shill | same_owner needs signatures by both DIDs"
    abuse_controls:
      - "Issuer limit 10 attestations per 24 hours; vault intake 100 attestations per hour per transport source; 20 displayed active attestations per subject; limits run through the bus RateLimitPort (F12.S03.M03, N18)."
      - "Operator issue_relay limited to 100 per day per relay and every issuance logged with operator role and subject DID only."
  observability_performance:
    requirements:
      - Relays export operator-issued attestation counts per CTR-OBS-001; vaults keep local counters only.
      - Verification of one attestation takes at most 8 ms p95 on a Moto G-class device.
      - Listing 50 attestations for a subject completes within 50 ms p95 locally.
    metrics:
      - "classrup_identity_relay_attestations_total{outcome=issued|rejected} (relay)"
      - "local counter attestation_total{event=issued|received|endorsed|revoked|expired|rejected|not_displayed}"
    logs:
      - "info attestation.event {event, kind, correlationId} - no DIDs, labels or check notes."
    budgets:
      - "verify p95 <= 8 ms on device; list 50 p95 <= 50 ms; issue p95 <= 100 ms; issue_relay p95 <= 300 ms; list_linkage p95 <= 20 ms."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement is covered by at least one automated test with fixed key pairs and an injected clock.
      - Signature tests include tampering, wrong issuer and wrong kind negative cases.
      - Privacy tests prove that no email, phone or document data is stored anywhere in the module.
      - Accessibility and UI copy tests check the trust list, issue sheet and claims-about-me screens, including that no UI string says 'verified'.
    fixtures: "Principal P, peers Q and R, relay R1 with operator key O listed in its descriptor and a retired key O0, relay R2 whose descriptor is unreachable, new throwaway DID Z, identities A and B of one owner, fixed clock 2026-11-04T10:00:00Z, label corpus (valid, with links, with reserved words)."
    tests:
      - "T01 | unit | 01.R01,01.R02 | issue a self_claim and a peer_met_in_person | statements signed by an active device key and verify; fields match; no personal data fields exist; the peer claim is subject_only"
      - "T02 | unit | 02.R01,02.R02,09.R02 | tampered label, issuer equals subject for a peer claim, label with a link, label 'Verified by police', wrong kind | IDENTITY_ATTESTATION_SIGNATURE_INVALID, IDENTITY_ATTESTATION_KIND_INVALID or VALIDATION_FAILED"
      - "T03 | unit | 02.R03 | claimedExpiresAt 10 years ahead | effectiveExpiresAt clamped to 365 days (180 for peer) after first seen"
      - "T04 | property | 03.R01,03.R02,03.R03 | random sequences of receive, endorse, revoke, expire, re-issue and relay tombstones | only declared transitions succeed; revoked and expired are final; re-issue creates a new record"
      - "T05 | integration | 03.R02,06.R03 | revocation received after the subject endorsed and republished the claim | viewer marks revoked with lastChecked time; subject's copy shows revoked on next sync"
      - "T06 | contract | 04.R01,04.R02,04.R03 | all commands, queries and events run | outputs, statements, endorsements and payloads validate against registry schemas; signatures verify; events in the same transaction"
      - "T07 | abuse | 05.R01,05.R02,05.R03 | non-operator issues a relay attestation; non-issuer revokes; stranger reads a private attestation; issuer publishes a public peer claim without endorsement | FORBIDDEN or NOT_FOUND; private claim never exposed; viewers store the unendorsed claim but do not display it"
      - "T08 | chaos | 06.R01,06.R02,06.R03 | duplicate delivery, offline revoke, signing failure | one record; revoked locally with honest outbox state; nothing stored on failed signing"
      - "T09 | abuse | 07.R01,09.R03 | inspect all storage, logs and events for emails, phones and documents; relay issue note containing an email address | none stored; note with an email-like string rejected"
      - "T10 | abuse | 07.R02 | throwaway DID issues 11 attestations in 24 hours and a ring of 5 DIDs vouch for each other | RATE_LIMITED on the 11th; no numeric trust effect and new-signer labels shown"
      - "T11 | load | 08.R01,08.R02,08.R03 | verify 1 000 attestations and list 50 on emulated Moto G | verify p95 <= 8 ms, list p95 <= 50 ms; relay counters exported"
      - "T12 | a11y | 09.R04 | trust list, issue sheet and claims-about-me screens with axe-core and keyboard only | zero serious or critical issues; signer dialog focus trap works"
      - "T13 | unit | 09.R01 | traceability run over PS-057 | every requirement maps to a passing test"
      - "T14 | integration | 10.R01,10.R02,10.R03 | export, import in a fresh vault, tombstone after import, statement with an unknown ext key | statements re-verified and round-trip; tombstoned attestation becomes revoked; unknown ext ignored"
      - "T15 | abuse | 02.R02,02.R04 | user DID Z signs relay_email_check naming R1; O signs one naming R1; O signs one naming R2 whose descriptor is unreachable | Z rejected with IDENTITY_ATTESTATION_KIND_INVALID; O accepted with the relay badge; R2 shown only as a Signed claim until its descriptor can be fetched"
      - "T16 | e2e | 07.R02,09.R04 | UI strings for every kind in every locale bundle | relay_email_check badge reads 'Email check claimed by relay <host>' with 'this shows they said so'; no UI string contains 'verified'"
      - "T17 | integration | 02.R05,04.R04 | A issues same_owner about B, B co-signs; list_linkage for A and B; a same_owner with only A's signature | linkage returned for both with status active; the single-signature one rejected with IDENTITY_ATTESTATION_KIND_INVALID"
      - "T18 | integration | 01.R03,07.R03 | Q sends P a peer claim; P endorses with publish true; P later sets visibility private | endorsement signed by P's device key and queued; viewers display the endorsed claim; the signed statement is unchanged by visibility"
      - "T19 | abuse | 03.R04 | a tombstone for Q's attestation signed by origin relay R1, then one signed by Q | after R1's tombstone the attestation stays active and only R1 leaves provenance; Q's tombstone revokes it"
      - "T20 | abuse | 07.R05 | endorsed public peer claim with a meetup context | the public statement and endorsement carry only blindedRef; the raw meetup id is absent"
      - "T21 | integration | 02.R04 | federation.peer.removed for a peer relay, and R1's descriptor lists O0 as retired after classrup.federation.key_rotation/v1 | relay key set rebuilt; attestations by the removed relay re-checked; O0 attestations show 'signer key retired'"
      - "T22 | integration | 07.R04 | F10 export, deletion and retention sweep with stub registries; endorsement publish to a relay without federation_publish consent | section exported; attestations pseudonymized, not deleted; PRECONDITION_FAILED or relay skipped"
      - "T23 | unit | 01.R02 | an attestation signed by an issuer device key that the latest verified document already marks revoked, with a backdated createdAt; the revocation learned later for one attestation first seen after its effective time and one first seen before it | the first rejected with IDENTITY_ATTESTATION_SIGNATURE_INVALID; on learning, the later-seen one quarantined and the earlier-seen one stays active with a revoked-signer marker"
      - "T24 | contract | 04.R01 | issue, revoke and endorse with a StatementPublisherPort spy | each call goes through StatementPublisherPort.publish; cid and signature follow F11.S01.M03; no other signing path"
      - "T25 | integration | 04.R04,05.R03 | A and B co-sign a same_owner attestation and publish it to host relay H with consent; list_linkage on H in-process and over HTTP; SameOwnerLinkPort.linked(A, B) and (A, C) | in-process result lists the link with both signatures; HTTP refused; the port returns true for A and B and false for A and C"
    acceptance:
      - All tests T01-T25 pass in CI.
      - No KYC, email, phone or document data is stored or logged by this module (privacy suite).
      - Every displayed attestation shows its signer and the wording that it evidences an assertion, not truth, and no UI string calls a claim verified.
      - A claim about another person is never displayed publicly without the subject's endorsement, and a relay badge appears only for keys listed in the named relay's descriptor.
  import_export_backup_rollback:
    requirements:
      - The vault export contains attestations issued by the principal and about the principal and those the user kept, with signatures and endorsements.
      - Import re-verifies every signature, endorsement and kind rule, recomputes effective expiry from the import time capped by the original claim, and skips invalid statements with a report.
      - Schema changes follow expand/contract and keep v1 readable for 180 days.
    export: "Section identity.attestations in classrup-export/v1 (schema classrup.identity.attestation/v1) including statements, endorsements, cosignatures and revocations; visibility settings are included."
    import: "Each statement is re-verified; invalid ones are reported and skipped; effectiveExpiresAt is recomputed from the import time; revoked statements import as revoked; relay_email_check claims are re-checked against the relay key set."
    backup: "The vault export is the primary backup (IOX-6); relays store public statements only and operator audit logs follow RET-AUDIT (IOX-7)."
    migration_rollback: "Additive optional fields in v1 under ext for signed statements; the kind value relay_email_check is new in v1 and an older reader shows it as a Signed claim; rollback is safe because older readers ignore unknown ext keys and the signature covers them."
