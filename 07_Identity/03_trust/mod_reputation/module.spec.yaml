id: F07.S03.M01
scope: MVP
summary: >-
  Reviews and reputation computed locally from signed statements. When a transaction context the principal takes part
  in opens (deal, cycle, booking or rental), each party's vault signs a per-pair review ticket
  (classrup.identity.review_ticket/v1) for each eligible counterparty, so eligibility rests on bilateral opening
  evidence and not on the subject's later cooperation. When the context completes, is disputed and closed unresolved,
  or is cancelled, a 30 day ReviewWindow opens and the parties may post a review (classrup.identity.review/v1) signed
  by a device key, labelled with that outcome and carrying the subject's ticket as proof. Public reviews carry only a
  per-pair blinded reference, never the context id, so reviews from one cycle cannot be joined into a transaction graph.
  Each vault verifies reviews it receives, then computes a ReputationSummary for any DID from the reviews it has seen -
  count, Bayesian average, outcome and per-type counts, and displayed no-show claims - with explicit Sybil dampening by
  author age, repetition, reciprocity and closed review islands. There is no central reputation store; the summary says
  how many sources it was built from and that reviews can be missing. Dampening slows manipulation; it cannot prevent
  it where creating identities is free (Douceur 2002).
responsibilities:
  - Sign and send per-pair review tickets when a local opening event arrives for a context the principal takes part in, and receive and store the counterparties' tickets in a pending ReviewWindow.
  - Open the ReviewWindow (30 days) when an outcome event carrying the N3 fields arrives and the completion statements behind its completionCid verify in this vault, label it completed, disputed or cancelled, and quarantine it when a required field or statement is missing rather than guessing.
  - Create, sign, withdraw and receive reviews; accept a received review only if its signer key is not revoked in the author's latest verified document at receipt (and quarantine it when a revocation learned later took effect before first sight) and its proof carries the subject's ticket naming the author and the pair.
  - Sign and store reviews, review tickets and withdrawal tombstones only through the F11.S01.M01 StatementPublisherPort (publish and issueTombstone, implemented by F11.S01.M02).
  - Own ReputationSummary per subject DID and recompute it deterministically with the documented weights and input selection; emit identity.reputation.recomputed and identity.review.posted.
  - Keep dampening honest and visible - show raw counts, outcome labels, displayed no-show claims and the number of sources next to the Bayesian average.
non_responsibilities:
  - Producing opening and completion evidence and its events; the owning transaction modules emit them with the N3 fields (F09, F02, F03, F05).
  - Attestations such as 'met in person' (F07.S03.M02) and relay-side hosting of review copies (relay hosting policy only).
  - Identity proofing or deduplication of persons; no module can prove two DIDs are the same or different people.
  - "Future: commit-reveal double-blind reviews, vouching graphs, portable reputation proofs across relays, reputation-aware ranking."
depends_on: [F07.S01.M01, F07.S02.M01, F07.S02.M02, F11.S01.M01, F11.S01.M02, F09.S01.M01, F09.S02.M02, F10.S01.M01, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-FED-001, CTR-SCH-001, CTR-PRV-001, CTR-COM-001, CTR-OBS-001, CTR-IOX-001, CTR-FLG-001]
user_stories:
  - As a buyer, after a completed deal I can rate the seller from 1 to 5, choose up to 3 tags and add a short comment; it is signed and sent to them and, if I choose, to my relays.
  - As a seller, I see the reviews I received and my summary, with an honest note about how many sources it comes from.
  - As a stranger evaluating a seller, I see the seller's rating with raw counts, outcome labels, completed-transaction counts and a note when most reviews come from new or tightly linked accounts.
  - As a reviewer, I can withdraw my review with a signed tombstone.
  - As a buyer whose seller never handed over the item, I can still review the cancelled deal, because the seller's ticket from the opening already proves we transacted.
edge_cases:
  - A review's proof lacks the subject's ticket, or the ticket names another holder; it is quarantined with reason proof_incomplete and not counted.
  - The same author reviews the same subject for the same pair reference twice; the second is refused with IDENTITY_REVIEW_DUPLICATE.
  - In a 4-party cycle only pairs connected by a leg receive tickets and may review each other; a review between non-adjacent parties is refused with IDENTITY_REVIEW_NOT_ELIGIBLE.
  - A review is posted 40 days after the outcome; the author's vault refuses it, and a received review with a claimed time beyond the window plus 2 days of skew is quarantined.
  - Two new accounts review each other five times; repeat and reciprocity factors reduce their weight to near the floor and the UI notes 'many reviews from linked accounts'.
  - A burst of 30 positive reviews from accounts first seen locally in the last 3 days; they count in raw totals but contribute small effective weight.
  - A relay stops serving a review copy under its hosting policy; the review stays posted in every vault that has it, a vault may record 'not served by relay X' in provenance, and the summary shows the reduced source count.
  - The subject deletes their vault; reviews they received exist in other vaults and relays; the product says reviews are statements by others and cannot be deleted by the subject.
  - A review's comment contains a link or personal data; shown as plain text, reportable to the relay, and hideable locally.
  - A completion event arrives without completionCid or without parties with roles; the window is quarantined with the missing fields listed and no pair is guessed.
  - A relay signs a tombstone targeting a user's review; the review stays posted and only that relay is dropped from provenance and the source count.
  - A dispute closes unresolved after 30 days; the window opens with outcome disputed and every review of that pair shows the dispute flag.
  - A subject pushes genuine reviews out with 500 self-made reviews; input selection keeps every review with weight at least 0.5 and limits authors to 3 selected reviews each, so recency cannot bury them.
  - A meetup no-show claim arrives; it is shown with the reporter and counts with weight 0 in rep-1.
ux:
  screens:
    - "Review sheet after an outcome: outcome label (completed, disputed, cancelled), 1 to 5 star radio group, up to 3 tags, comment (500 chars), audience choice (subject only or public) with the note that public reviews never show the transaction id, preview of what will be signed and where it will be sent, Send."
    - "Reputation card on a profile: Bayesian average to one decimal, raw review count, positive and negative counts, counts by outcome, completed counts by type, no-show claims shown as claims, 'based on N reviews from M sources seen by this device', dampening notice when applicable."
    - "Reviews list: author pseudonym with DID fingerprint, rating, tags, comment, context type, outcome label and dispute flag, 'Hide for me' and 'Withdraw' (own)."
  states: [loading, empty, pending-opening, eligible, posting, pending-offline, quarantined, withdrawn, disputed, error]
  a11y:
    - Star rating is a native radio group with text labels such as '4 of 5', not colour or shape only, and targets of 44 by 44 px.
    - Reputation figures are real text with units, and dampening notices are announced via aria-live polite.
    - The comment counter announces remaining characters politely at 450, 490 and 500.
processes:
  domain_schema:
    requirements:
      - A Review stores the signed statement fields, an outcome label, the proof (the subject's review ticket for the pair, plus for subject-only reviews the full opening and outcome evidence), provenance and a verification status, and is immutable after posting except for local hide and withdrawal.
      - A ReviewWindow is created when a context the principal takes part in opens, holds the per-pair tickets exchanged then, opens for 30 days when an outcome event with the N3 fields arrives, and limits the number of pairs to 66.
      - A ReputationSummary is derived, versioned by algorithm, and fully recomputable from stored reviews and recorded no-show claims, so it can be thrown away and rebuilt.
      - Public reviews carry only a per-pair blinded reference and the per-pair ticket, never contextId, completionCid or a dispute case cid, so two public reviews from one cycle share no identifier.
    entities:
      - name: Review
        schema: classrup.identity.review/v1
        storage: relay+device
        privacy: P1
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope"
          - "contextType: enum — deal | cycle | booking | rental"
          - "pairRef: string — base64url SHA-256 of JCS({ contextCid, authorDid, subjectDid }); the only context reference in a public review"
          - "contextId?: uuidv7 — own records and subject_only reviews only"
          - "completionCid?: string — own records and subject_only reviews only; cid of the producer's completion statement"
          - "authorDid: did — reviewer"
          - "subjectDid: did — reviewed party; differs from authorDid"
          - "authorRole: string — role in the context, 1..24 characters, for example buyer or giver"
          - "outcome: enum — completed | disputed | cancelled; shown as a label"
          - "disputeFlag: boolean — true when outcome is disputed (dispute closed unresolved, FLOW-08)"
          - "disputeCaseCid?: string — own records and subject_only reviews only; cid of the F09.S02.M02 dispute case, or for a cycle recovery the first of the F02.S03.M04 reviewUnlock evidenceCids"
          - "audience: enum — subject_only | public"
          - "rating: int — 1..5"
          - "tags?: array — at most 3 of as_described, on_time, communicative, safe_meetup, fair_price, careless"
          - "comment?: string — 0..500 code points, plain text"
          - "proof: object — { ticket: classrup.identity.review_ticket/v1 signed by subjectDid naming authorDid as holder for pairRef, completionTicket?: the same schema with phase completion, openingEvidence?: { statementCid, subjectSig } in subject_only reviews only }"
          - "claimedPostedAt: timestamp — author's claim"
          - "firstSeenAt: timestamp — local clock when this vault first saw the review"
          - "origin: enum — own | received"
          - "provenance?: object — { originRelay?, via, receivedAt, verifiedAt, notServedBy?: relay ids }"
          - "cid: string — per F11.S01.M03, sha256- plus base64url(SHA-256(JCS(envelope minus sig and cid))), computed by the StatementPublisherPort for own reviews"
          - "signerKey: string — ext.signerKey, a device key of the author not revoked in the author's latest verified document at receipt"
          - "sig: string — Ed25519 signature by signerKey over JCS(envelope minus sig) per F11.S01.M03; the envelope type classrup.identity.review/v1 separates it from other statement types"
          - "syncState?: enum — local_committed | prepared | transport_acknowledged | peer_accepted (own reviews)"
          - "status: enum — pending_verification | posted | hidden | quarantined | withdrawn"
          - "quarantineReason?: enum — signature_invalid | signer_revoked | proof_incomplete | not_eligible | outside_window | schema_invalid | duplicate"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - At most one review per (authorDid, pairRef).
          - A posted review has a valid signature by a device key not revoked in the author's latest verified document at receipt, with no later-learned revocation effective at or before firstSeenAt, and a ticket signed by subjectDid that names authorDid as holder for pairRef.
          - A public review contains no contextId, completionCid, disputeCaseCid or openingEvidence.
          - Rating, tags, comment and outcome are immutable after creation.
      - name: ReputationSummary
        schema: classrup.identity.reputation_summary/v1
        storage: derived
        privacy: P1
        retention: RET-STANDARD
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope"
          - "subjectDid: did — subject of the summary, unique per vault"
          - "reviewCount: int — posted reviews seen, raw"
          - "selectedReviewCount: int — reviews used for the average after input selection, at most 500"
          - "authorDiversity: int — distinct authors among the selected reviews"
          - "positiveCount: int — rating 4 or 5"
          - "negativeCount: int — rating 1 or 2"
          - "outcomeCounts: object — { completed, disputed, cancelled } among posted reviews"
          - "effectiveWeight: number — sum of dampening weights of the selected reviews"
          - "bayesianAvg: number — (5 times priorMean + weighted rating sum) divided by (5 + effectiveWeight), shown with one decimal"
          - "priorMean: number — 4.0 unless the vault has at least 50 reviews, then their mean limited to 3.5..4.5"
          - "completedByType: object — { deal, cycle, booking, rental } counts of distinct verified completed pair references"
          - "noShowClaims: int — comms.meetup.no_show claims recorded for the subject, displayed, weight 0 in rep-1"
          - "contradictedNoShowClaims: int — claims among noShowClaims contradicted by the accused's check-in, displayed together with that check-in"
          - "noShowClaimRefs: array — at most 100 { meetupRefHash, reportedByDid, reportStatementCid, firstSeenAt, contradicted: boolean, checkinStatementCid? } kept as recompute input"
          - "sourceCount: int — distinct transports or relays the reviews came from, lowered by notServedBy entries"
          - "dampeningNotice: enum — none | many_new_authors | linked_authors | island"
          - "algorithmVersion: string — for example rep-1"
          - "computedAt: timestamp — local clock"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - The summary is fully reproducible from the posted reviews, the recorded no-show claims and algorithmVersion.
          - reviewCount counts raw posted reviews and is never reduced by dampening or selection.
          - bayesianAvg is between 1.0 and 5.0, and no-show claims never change it in rep-1.
      - name: ReviewWindow
        schema: classrup.identity.review_window/v1
        storage: device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope"
          - "contextType: enum — deal | cycle | booking | rental"
          - "contextId: uuidv7 — the transaction context"
          - "contextCid: string — cid of the bilateral opening statement (deal opening, cycle revision hash, booking or reservation confirmation)"
          - "completionCid?: string — set from the outcome event (N3)"
          - "outcome?: enum — completed | disputed | cancelled"
          - "disputeCaseCid?: string — set from the caseCid of commerce.dispute.resolved"
          - "recoveryEvidence?: object — { recoveryCaseId, evidenceCids } from mutiny.recovery.resolved reviewUnlock"
          - "parties: array — [{ did, role }] from the event payload (N3)"
          - "legs?: array — [{ legId, giverId, receiverId }] for cycles, giverId and receiverId being DIDs as in mutiny.cycle.completed and mutiny.recovery.resolved"
          - "completionProof?: object — { kind: deal_completion|cycle_receipts|booking_completion|rental_completion|return_attestation|dispute_case|recovery_evidence, statementCids: array, verifiedAt? } the statements this vault verified before opening"
          - "closeReason?: enum — completed | deposit_unsettled; rentals only, from rentals.rental.closed"
          - "pairs: array — at most 66 eligible [authorDid, subjectDid] pairs where the local principal is the author"
          - "issuedTicketCids: array — tickets this principal signed for its counterparties"
          - "receivedTickets: array — { subjectDid, ticketCid, phase: opening|completion } tickets naming the principal as holder"
          - "missingFields?: array — N3 fields absent from the outcome event, or completion statements and receipts not yet verified in this vault"
          - "opensAt?: timestamp — local receipt time of the outcome event"
          - "closesAt?: timestamp — opensAt plus 30 days"
          - "status: enum — pending | open | quarantined | closed"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - closesAt equals opensAt plus 2 592 000 000 ms whenever the window has opened.
          - One window exists per (contextType, contextId).
          - For cycles, pairs and issued tickets cover only leg-connected counterparties.
    sql: |
      CREATE TABLE identity_review (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, context_type TEXT NOT NULL, pair_ref TEXT NOT NULL,
        author_did TEXT NOT NULL, subject_did TEXT NOT NULL, cid TEXT NOT NULL, status TEXT NOT NULL,
        revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX identity_review_unique ON identity_review(tenant_id, author_did, pair_ref);
      CREATE UNIQUE INDEX identity_review_cid ON identity_review(tenant_id, cid);
      CREATE INDEX identity_review_subject ON identity_review(tenant_id, subject_did, status);
      CREATE TABLE identity_review_window (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, context_type TEXT NOT NULL, context_id TEXT NOT NULL,
        status TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX identity_review_window_ctx ON identity_review_window(tenant_id, context_type, context_id);
  validation_rules:
    requirements:
      - Reviews are validated for schema, signature, eligibility and proof before they count; failures are quarantined with a reason, not silently dropped.
      - Eligibility derives only from bilateral opening evidence - the subject's signed review ticket for the pair - and the pair list, never from the review text or the subject's later cooperation.
      - Limits on volume and size bound the work a hostile sender can cause.
      - Signer keys of reviews, tickets and tombstones must not be revoked in the signer's latest verified portable document at receipt (F07.S02.M01 key_status at receiver time), a revocation learned later quarantines those first seen at or after its clamped revokesEffectiveAt, and outcome events must carry the N3 fields and verifiable completion statements or the window is quarantined.
    rules:
      - "V01 | rating is an integer 1..5, tags at most 3 from the fixed list, comment at most 500 code points of plain text | VALIDATION_FAILED"
      - "V02 | the review envelope signature verifies per F11.S01.M03 with ext.signerKey a device key that the author's latest verified document does not mark revoked at receipt, whatever createdAt claims (F07.S02.M01 key_status at receiver time) | IDENTITY_REVIEW_SIGNATURE_INVALID"
      - "V03 | proof carries a classrup.identity.review_ticket/v1 envelope authored by subjectDid and signed with a device key not revoked at receipt, whose payload { contextType, pairRef, issuer: subjectDid, holder: authorDid, phase, claimedAt } names authorDid as holder; a subject_only review may instead carry the subject's signed opening statement | IDENTITY_REVIEW_PROOF_INCOMPLETE"
      - "V04 | authorDid and subjectDid form an eligible pair - for own posts the pair is in the author's open window (all pairs for two-party contexts, leg-connected pairs for cycles); for received reviews the subject's ticket names this pair and pairRef | IDENTITY_REVIEW_NOT_ELIGIBLE"
      - "V05 | no review exists yet for (authorDid, pairRef) | IDENTITY_REVIEW_DUPLICATE"
      - "V06 | claimedPostedAt is within 30 days plus 2 days of skew after the ticket's claimed outcome time, and for own posts the local window is open | IDENTITY_REVIEW_WINDOW_CLOSED"
      - "V07 | the author has posted fewer than 30 reviews in the last 24 hours and the vault accepts fewer than 200 received reviews per hour from one source | RATE_LIMITED"
      - "V08 | authorDid differs from subjectDid | VALIDATION_FAILED"
      - "V09 | a public review contains no contextId, completionCid, disputeCaseCid or openingEvidence; those appear only in subject_only reviews | VALIDATION_FAILED"
      - "V10 | outcome disputed sets disputeFlag and, in own and subject_only records, names the dispute case cid or, for a cycle recovery, the reviewUnlock evidence cids; outcome completed is shown as 'confirmed by both' only with a subject-signed completion ticket | VALIDATION_FAILED"
      - "V11 | a public review is queued to a relay only after privacy.consent.check(federation_publish, relayId) is granted; tombstones are always sent | PRECONDITION_FAILED"
      - "V12 | an outcome event carries contextId, completionCid (caseCid for disputes, reviewUnlock.evidenceCids for cycle recoveries), parties with roles, and legs for cycles; rentals.rental.closed also has reason completed or deposit_unsettled, completionKind and oneSided false; otherwise the window is quarantined with missingFields, and a one-sided rental closure opens no window | VALIDATION_FAILED"
      - "V13 | the completion statements behind completionCid verify in this vault's record store (F11.S01.M02) - deal: a classrup.commerce.deal_completion/v1 by every party; booking: classrup.services.booking_completion/v1 by the client and by the provider; rental completionKind rental_completion: classrup.rentals.rental_completion/v1 by the owner and by the renter; completionKind return_attestation: completionCid is the renter's classrup.rentals.return_report/v1 and the owner's classrup.rentals.return_attestation/v1 is over it; cycle: each receiptCid is a verified classrup.mutiny.handover_attestation/v1 of kind received for one leg; otherwise the window is quarantined with the missing statements listed | VALIDATION_FAILED"
  workflow_state_machine:
    requirements:
      - A received review starts pending verification and ends posted or quarantined; a quarantined review may be re-verified when missing evidence arrives.
      - A posted review can be hidden or restored only by the local user, and withdrawn only by a tombstone whose author is the review's author; relay hosting actions and relay-signed tombstones never change a vault's review records.
      - A ReviewWindow is pending from the opening of a context, opens for 30 days when an outcome event with the N3 fields arrives, is quarantined when a required field is missing, and then closes.
    machines:
      - entity: Review
        initial: pending_verification
        terminal: [withdrawn]
        transitions:
          - "pending_verification -> posted | all validation rules pass | store, emit identity.review.posted, schedule recompute of the subject summary"
          - "pending_verification -> quarantined | any rule fails with a reason | keep the statement for 30 days, excluded from summaries"
          - "quarantined -> pending_verification | the missing ticket, outcome evidence or the author's document arrives | re-run validation"
          - "posted -> hidden | identity.review.hide by the local user | excluded from this vault's summaries and lists"
          - "hidden -> posted | identity.review.hide with hidden false by the local user | included again and summary recomputed"
          - "posted -> withdrawn | tombstone whose payload author equals authorDid and whose signer key is active in the author's document, or identity.review.withdraw by the author | delete comment and tags, keep tombstone, recompute"
          - "hidden -> withdrawn | tombstone whose payload author equals authorDid | delete comment and tags, keep tombstone"
      - entity: ReviewWindow
        initial: pending
        terminal: [closed]
        transitions:
          - "pending -> open | outcome event with the N3 fields and a verified proof (V12, V13) - commerce.deal.completed, mutiny.cycle.completed, services.booking.completed, rentals.rental.closed with reason completed or deposit_unsettled and oneSided false, commerce.dispute.resolved with resolution lapsed, mutiny.recovery.resolved with reviewUnlock.unlocked, or commerce.deal.cancelled | set outcome (disputed with disputeFlag for lapsed disputes and for recovery outcomes unresolved or dispute_outcome, cancelled for recovery outcome agreed), compute pairs, opensAt = receipt time, closesAt = opensAt + 30 days; sign completion tickets after a completion"
          - "pending -> quarantined | outcome event lacks a required N3 field | record missingFields; no pair guessed"
          - "quarantined -> open | the missing fields arrive in a re-delivered or corrected event, or federation.record.accepted delivers the missing completion statement or receipt | re-run V12 and V13, compute pairs and open as above"
          - "quarantined -> closed | 30 days in quarantine | nothing can be posted"
          - "pending -> closed | 180 days without an outcome event | tickets kept as evidence"
          - "open -> open | commerce.dispute.resolved with resolution lapsed, or mutiny.recovery.resolved with outcome unresolved or dispute_outcome, after the window opened | outcome becomes disputed and disputeFlag is set; closesAt unchanged"
          - "open -> closed | 30 days after opensAt | no further own reviews for this context"
    timeouts:
      - "ReviewWindow closes 30 days after the local outcome event (2 592 000 000 ms); a pending window without an outcome closes after 180 days; a quarantined window after 30 days."
      - "Quarantined reviews are deleted 30 days after quarantine."
      - "Recompute is coalesced per subject with a 5 s delay and a full recompute of all subjects runs daily at 03:00 local time while the app is open."
  commands_queries_events:
    requirements:
      - post, withdraw and hide are vault commands; post produces the signed statement classrup.identity.review/v1, the opening and outcome handlers produce classrup.identity.review_ticket/v1, and withdraw produces classrup.federation.tombstone/v1, all signed by a device key and signed and stored only through the F11.S01.M01 StatementPublisherPort (publish for reviews and tickets, issueTombstone for withdrawals, implemented by F11.S01.M02); receive and review_ticket.receive are the vault intakes of someone else's statements.
      - Opening, completion, dispute, cycle recovery and cancellation events open or update review windows using their N3 fields (contextId, completionCid, parties with roles, legs for cycles, reviewUnlock for cycle recoveries), and a completion opens a window only after the completion statements behind completionCid verify in this vault (V13); they never create reviews by themselves, and a missing field or statement quarantines the window rather than guessing.
      - Every command emits its events in the same local transaction as the state change.
      - No-show claims from comms.meetup.no_show are recorded and displayed as claims with zero weight in rep-1, a claim contradicted by the accused's check-in (comms.meetup.no_show_contradicted, or contradicted true on arrival) is displayed together with that check-in statement, and neither creates reviews.
    commands:
      - name: identity.review.post
        capability: identity.review.post
        input: "{ contextType, contextId, subjectDid, rating, tags?, comment?, audience: subject_only|public, targetRelays? }"
        output: "{ reviewId, cid, pairRef, statement: classrup.identity.review/v1, syncState: local_committed, skippedRelays: array }"
        errors: [VALIDATION_FAILED, IDENTITY_REVIEW_NOT_ELIGIBLE, IDENTITY_REVIEW_DUPLICATE, IDENTITY_REVIEW_WINDOW_CLOSED, IDENTITY_REVIEW_PROOF_INCOMPLETE, BLOCKED_PARTY, PRECONDITION_FAILED, RATE_LIMITED]
        emits: [identity.review.posted]
        idempotent: true
      - name: identity.review.receive
        capability: identity.review.receive
        input: "{ statement: classrup.identity.review/v1, provenance }"
        output: "{ reviewId, status: posted|quarantined, quarantineReason? }"
        errors: [IDENTITY_REVIEW_SIGNATURE_INVALID, IDENTITY_REVIEW_PROOF_INCOMPLETE, IDENTITY_REVIEW_NOT_ELIGIBLE, IDENTITY_REVIEW_DUPLICATE, IDENTITY_REVIEW_WINDOW_CLOSED, VALIDATION_FAILED, RATE_LIMITED]
        emits: [identity.review.posted]
        idempotent: true
      - name: identity.review_ticket.receive
        capability: identity.review_ticket.receive
        input: "{ ticket: classrup.identity.review_ticket/v1, provenance }"
        output: "{ windowId, phase: opening|completion, status: stored|quarantined }"
        errors: [IDENTITY_REVIEW_SIGNATURE_INVALID, IDENTITY_REVIEW_NOT_ELIGIBLE, VALIDATION_FAILED, RATE_LIMITED]
        emits: []
        idempotent: true
      - name: identity.review.withdraw
        capability: identity.review.withdraw
        input: "{ reviewId, expectedRevision }"
        output: "{ reviewId, revision, tombstone: classrup.federation.tombstone/v1 }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [identity.reputation.recomputed]
        idempotent: true
      - name: identity.review.hide
        capability: identity.review.hide_local
        input: "{ reviewId, hidden: boolean, expectedRevision }"
        output: "{ reviewId, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [identity.reputation.recomputed]
        idempotent: true
    note: "Statements and signer roles (N2), all signed and stored through the F11.S01.M01 StatementPublisherPort (envelope per F11.S01.M03, author the principal did:key, ext.signerKey the device key): classrup.identity.review/v1 - a device key of authorDid active in the author's document; classrup.identity.review_ticket/v1 { contextType, pairRef, issuer (the subject), holder (the author), phase: opening|completion, claimedAt } - a device key of the issuing party, audience participants, sent end-to-end encrypted to the holder only; classrup.federation.tombstone/v1 (CTR-FED-001 FED-4) - a device key of authorDid. Tickets are signed automatically by the opening handlers for every eligible counterparty; honest limit - a modified client can withhold its ticket, in which case the counterparty can post only a subject_only review backed by the subject's signed opening statement, until the producers make the counterparty ticket part of their opening statements (requested from F09.S01.M01, F02.S03.M01, F03.S02.M01 and F05.S01.M01). Producers F02.S03.M04, F03.S02.M02 and F05.S02.M02 are not listed in depends_on because they already depend on this module through F02 and F08; their events are consumed and checked against their published fixtures. Completion proofs are read by cid and author from the vault record store of F11.S01.M02 (federation.record.get and list_by_author) - deal_completion/v1 (F09.S01.M01), booking_completion/v1 (F03.S02.M02), rental_completion/v1, return_report/v1 and return_attestation/v1 (F05.S02.M02) and handover_attestation/v1 (F02.S03.M04) - and verified with key status at receiver time. A received review or ticket from a blocked DID is dropped silently (N7, F07.S02.M02 filterBlocked)."
    queries:
      - name: identity.reputation.get
        capability: identity.reputation_summary.read
        input: "{ subjectDid }"
        output: "{ summary: ReputationSummary, note: 'based on reviews seen by this device' }"
        errors: [NOT_FOUND]
      - name: identity.review.list_for_subject
        capability: identity.review.read
        input: "{ subjectDid, status?: posted|hidden, outcome?: completed|disputed|cancelled, cursor?, limit? (1..50) }"
        output: "{ items: Review[], nextCursor? }"
        errors: [NOT_FOUND]
      - name: identity.review.list_eligible
        capability: identity.review_window.read_own
        input: "{ cursor?, limit? (1..50) }"
        output: "{ items: [{ windowId, contextType, contextId, subjectDid, outcome, publicAllowed: boolean (subject ticket held), closesAt }], nextCursor? }"
        errors: []
    events_produced:
      - {type: identity.review.posted, privacy: P1, payload: "{ reviewId, contextType, pairRef, authorDid, subjectDid, rating, outcome, origin }"}
      - {type: identity.reputation.recomputed, privacy: P1, payload: "{ subjectDid, reviewCount, selectedReviewCount, bayesianAvg, effectiveWeight, outcomeCounts, noShowClaims, algorithmVersion }"}
    events_consumed:
      - {type: commerce.deal.opened, effect: "create a pending ReviewWindow when the principal is in parties[]; sign an opening ticket for the counterparty and send it end-to-end encrypted through the sync outbox; relies on contextCid and parties [{did, role}], and without them no ticket is signed and the window waits"}
      - {type: mutiny.cycle.committed, effect: "create a pending window; sign opening tickets only for leg-connected counterparties; relies on revisionHash as contextCid, parties [{did, role}] and legs"}
      - {type: services.booking.confirmed, effect: "create a pending window for the client and provider pair; relies on contextCid and parties [{did, role}]"}
      - {type: rentals.reservation.confirmed, effect: "create a pending window for the owner and renter pair; relies on confirmationCid as contextCid and parties [{did, role}]"}
      - {type: commerce.deal.completed, effect: "open the window with outcome completed and sign completion tickets once a classrup.commerce.deal_completion/v1 by every party over completionCid (the cid of the completion body { dealId, dealCid, outcome completed }) verifies; relies on contextId, completionCid and parties [{did, role}] (N3); a missing field or statement quarantines the window"}
      - {type: mutiny.cycle.completed, effect: "open the window with leg-connected pairs and outcome completed; relies on contextId, completionCid, receiptCids, parties [{did, role}] and legs [{legId, giverId, receiverId}] (N3); the proof is completionCid with receiptCids, each a verified received handover attestation of one leg"}
      - {type: services.booking.completed, effect: "open the window for the client and provider pair with outcome completed once both classrup.services.booking_completion/v1 statements, the client's and the provider's, over completionCid verify; relies on contextId (bookingId), contextType booking, completionCid and parties [{did, role: client|provider}] (N3)"}
      - {type: rentals.rental.closed, effect: "open the window for the owner and renter pair with outcome completed only when reason is completed or deposit_unsettled, completionCid is present and oneSided is false, after the proof verifies - completionKind rental_completion: classrup.rentals.rental_completion/v1 by the owner and by the renter over completionCid; completionKind return_attestation: completionCid is the renter's classrup.rentals.return_report/v1 and the owner's classrup.rentals.return_attestation/v1 is over it; relies on contextId, completionCid, completionKind, oneSided and parties [{did, role: owner|renter}] (N3); one-sided closures and other reasons open no window"}
      - {type: commerce.dispute.resolved, effect: "resolution lapsed (the FLOW-08 closed-unresolved outcome) - open or update the window with outcome disputed and disputeFlag true; the proof is the subject's opening ticket plus the dispute caseCid; relies on contextRef, caseCid and parties [{did, role}], which commerce.dispute.withdrawn also carries"}
      - {type: mutiny.recovery.resolved, effect: "cycle recovery (FLOW-08) with reviewUnlock.unlocked - outcome unresolved or dispute_outcome opens or updates the cycle window with outcome disputed and disputeFlag true, outcome agreed opens it with outcome cancelled; pairs are leg-connected; relies on contextId (cycleId), parties [{did, role}], legs [{legId, giverId, receiverId}] and reviewUnlock { unlocked, disputeFlag, evidenceCids }, whose evidenceCids are the proof"}
      - {type: commerce.deal.cancelled, effect: "open the window with outcome cancelled when opening tickets were exchanged for the deal; relies on contextRef and parties [{did, role}]"}
      - {type: comms.meetup.no_show, effect: "record a displayed no-show claim against targetDid (reportedByDid, meetup reference hash, reportStatementCid) with weight 0 in rep-1, marked contradicted when the event says so; never creates a review"}
      - {type: comms.meetup.no_show_contradicted, effect: "mark the recorded claim with the same meetup reference hash, reportedByDid and reportStatementCid contradicted and keep checkinStatementCid, so the claim is displayed together with the contradicting check-in; weight stays 0 and no review is created"}
      - {type: federation.record.accepted, effect: "when cid names a completion statement or receipt listed in missingFields of a quarantined window, re-run V12 and V13 and open the window if the proof now verifies"}
      - {type: federation.tombstone.applied, effect: "withdraw the targeted review only when the tombstone author equals Review.authorDid and its signer key was active; a tombstone signed by an origin relay only drops that relay from provenance and sourceCount, and the review stays valid"}
      - {type: identity.portable_doc.published, effect: "origin received - re-verify quarantined reviews and tickets of that DID whose signer key was unknown; for each newly revoked key, reviews and tickets first seen at or after its clamped revokesEffectiveAt are quarantined with signer_revoked and earlier ones stay valid with a revoked-signer marker"}
      - {type: privacy.deletion.completed, effect: "final cleanup only - the DeletionPort steps already pseudonymized reviews and windows kept as evidence and deleted the rest"}
    errors:
      - "IDENTITY_REVIEW_SIGNATURE_INVALID | 422 | no | review or review ticket signature does not verify with a device key active in the signer's document"
      - "IDENTITY_REVIEW_PROOF_INCOMPLETE | 422 | no | the proof lacks the subject's ticket for this author and pair"
      - "IDENTITY_REVIEW_NOT_ELIGIBLE | 422 | no | author and subject are not an eligible pair of the context"
      - "IDENTITY_REVIEW_DUPLICATE | 409 | no | a review already exists for this author and pair reference"
      - "IDENTITY_REVIEW_WINDOW_CLOSED | 410 | no | the 30 day review window has closed"
    example: |
      event commerce.deal.opened (local, parties A and B) -> pending ReviewWindow; A signs a ticket for B and B signs one for A (end-to-end encrypted)
      event commerce.deal.completed (local, with contextId, completionCid, parties) -> ReviewWindow { contextType: "deal", outcome: "completed", closesAt: "2026-12-04T10:00:00.000Z" }
      vault command: identity.review.post { "contextType": "deal", "contextId": "0192f450-…", "subjectDid": "did:key:z6Mk…", "rating": 5, "tags": ["on_time", "as_described"], "comment": "Smooth handover.", "audience": "public" }
      -> { "reviewId": "0192f451-…", "cid": "sha256-Qm…", "pairRef": "Hk3…", "syncState": "local_committed", "skippedRelays": [] }
      weight(review) = w_age * w_exp * w_repeat * w_recip * w_island * w_outcome, each in 0.1..1.0 except w_island in 0.25..1.0 and w_outcome 1.0 completed, 0.75 disputed, 0.5 cancelled; bayesianAvg = (5 * 4.0 + sum(w * rating)) / (5 + sum(w)) over the selected reviews
  authorization_capabilities:
    requirements:
      - Vault policy - only the unlocked principal posts, withdraws or hides; reviews and tickets are accepted from others only on verified signatures by active device keys and on the subject's ticket, and authority comes from the signed bilateral evidence, not from the sender or relay.
      - Reviews are readable to anyone who holds the statement; public reviews are P1 community data shared through relays the author chose, and subject-only reviews are end-to-end encrypted to the subject.
      - Relays may stop serving a review copy under their hosting policy, which a vault may record only as provenance; they cannot create, edit, hide, withdraw or delete the author's statement in any vault.
    capabilities:
      - "identity.review.post | principal | unlocked principal; open ReviewWindow containing the pair; not blockedWith subject; public audience needs the subject's ticket"
      - "identity.review.receive | principal | signature by an active author key and the subject's ticket verify; author not blocked (otherwise dropped silently)"
      - "identity.review_ticket.receive | principal | ticket signed by an active key of a party of a pending or open window naming the principal as holder"
      - "identity.review.withdraw | principal | unlocked principal and review.authorDid equals the principal DID"
      - "identity.review.hide_local | principal | unlocked local principal"
      - "identity.reputation_summary.read | principal | unlocked local principal"
      - "identity.review.read | principal | unlocked local principal; hidden reviews only with explicit request"
      - "identity.review_window.read_own | principal | unlocked local principal"
  failure_recovery_idempotency:
    requirements:
      - Posting, receiving, ticket intake and recomputing are idempotent because cids and the unique (author, pairRef) key make duplicates harmless, and a summary can always be rebuilt from stored reviews and no-show claims.
      - Review statements and tickets reach others through the sync outbox with states local_committed, prepared, transport_acknowledged and peer_accepted, and the UI never claims more than the reached state.
      - Quarantine keeps unverified material out of every score until it verifies.
    idempotency: "Idempotency-Key per command in the vault log for 24 h; receive and ticket intake keyed by cid; opening handlers sign at most one ticket per (window, counterparty, phase); recompute is a pure function of stored reviews, no-show claims and algorithmVersion."
    concurrency: "Unique key on (author, pairRef) prevents duplicates under races; one window per context; expectedRevision on withdraw and hide; summary recompute is a single transaction per subject; Web Locks serialize tabs."
    retries: "Outbox retries use base 500 ms, cap 30 s, full jitter, max 6 attempts per window until transport_acknowledged or the user cancels; validation failures are never retried."
    offline: "Posting, ticket signing, receiving from stored data and recomputing work offline; the review shows 'not yet delivered' until transport_acknowledged and 'accepted by peer' only after a signed peer acknowledgement."
    partial_failure: "If recompute fails the old summary stays with a stale marker and a retry runs in 60 s; if a review verifies but the summary write fails, the review is posted and the summary is rebuilt on the daily run; if a ticket cannot be delivered the window shows 'counterparty has not received your ticket yet'."
  privacy_retention_abuse:
    requirements:
      - Reviews are statements by individuals about transactions and are P1; subject-only reviews travel end-to-end encrypted, and comments never contain exact addresses or contact data by rule and by warning.
      - Reputation is shown with its provenance - the number of reviews and sources seen by this device - because no party holds the complete set.
      - The product states that dampening reduces but does not remove the effect of fake identities and colluding parties.
      - The module meets the N6 privacy duties - it registers ExportSectionPort (sections identity.reviews and identity.review_windows), DeletionPort (pseudonymize reviews and windows kept as RET-EVIDENCE, delete the rest, tombstone own public reviews if the user chooses) and RetentionPurgePort, classifies fields with F10.S02.M02, calls privacy.consent.check(federation_publish, relayId) before queuing any public review to a relay, and treats privacy.deletion.completed only as final cleanup.
      - Summary inputs are chosen by weight and author diversity, not by recency - every review with weight at least 0.5 is kept, the rest are taken by descending weight with at most 3 per author, up to 500 per subject - so a subject cannot bury genuine reviews with self-made ones.
    data:
      - "Review: P1 when public (only pairRef, no context ids), P2 when subject-only; comments are free text and may be reported to a relay; ReviewWindow and tickets P2; ReputationSummary P1 derived; no-show claims P2 inputs."
    retention:
      - "Reviews and windows RET-EVIDENCE (2 years after last related activity), pseudonymized on account deletion; withdrawn reviews keep only a tombstone for 180 days; quarantined reviews 30 days."
      - "On vault erase everything local is deleted or pseudonymized as above; copies in other vaults and relays remain and are removed only by signed tombstones of their authors."
    threats:
      - "T01 | Fake positive reviews from sybil identities (Douceur 2002) | weights by observed author age, author's own completion count, repetition, reciprocity and island detection; raw counts and sources always shown; honest limit - free identity creation cannot be fully defended without a central authority"
      - "T02 | Fabricated contexts between two colluding identities | the ticket needs the subject's signature, so collusion requires two keys the attacker controls; the cost is low, so such pairs are dampened by repetition and island rules and the UI notes the limit"
      - "T03 | Retaliatory negative reviews | reviews need a ticket from a real opening, one review per pair, 30 day window, outcome label, withdraw option; double-blind commit-reveal is Future"
      - "T04 | Subject suppresses bad reviews | tickets are exchanged at opening, so withholding a completion signature or never completing does not block a review (outcome cancelled or disputed); input selection keeps reviews with weight at least 0.5 against burial; honest limit - a modified client can withhold its opening ticket, which limits the counterparty to a subject_only review until producers require tickets at opening, and a viewer who sees only the subject's relay may miss reviews"
      - "T05 | Review bombing by many real counterparties | each review needs a distinct pair ticket; ranking does not use reputation in MVP; viewers see raw distribution"
      - "T06 | Comment used for harassment or doxxing | plain text, 500 code points, local hide, report to the relay hosting policy, withdraw by author"
      - "T07 | Transaction graph reconstruction from public reviews (CTR-PRV-001 P2 cycle data) | per-pair blinded pairRef and per-pair tickets only; contextId, completionCid and dispute case cids only in subject_only reviews"
      - "T08 | Relay withdraws or hides a user's review in other vaults | only a tombstone authored by the review author withdraws it; relay tombstones and hosting actions affect only that relay's copy and provenance"
      - "T09 | A modified local producer emits a completion event without real completion statements to unlock 'confirmed' reviews | the window opens only after the completion statements behind completionCid verify in the vault record store (V13); otherwise it stays quarantined"
      - "T10 | A false no-show claim harms the accused | the claim has weight 0, is labelled a claim with its reporter, and a contradicting check-in is shown next to it"
    abuse_controls:
      - "Author limit 30 reviews per 24 hours; vault intake 200 reviews and 200 tickets per hour per transport source; per subject at most 500 reviews are selected by weight and author diversity (every review with weight at least 0.5 kept, at most 3 per author); limits run through the bus RateLimitPort (F12.S03.M03, N18)."
      - "Sybil dampening weights - w_age = clamp(authorAgeDays/30, 0.1, 1) from the earliest local sighting of the author's DID; w_exp = min(1, 0.25 + 0.25 times author's completed contexts known, at least 0.5); w_repeat = 1/n for the n-th review by one author about one subject in 180 days; w_recip = 0.5 when author and subject reviewed each other 2 or more times in 180 days; w_island = 0.25 for a review graph component of at most 6 DIDs with at least 6 edges and no edge to a DID outside the component, otherwise 1; w_outcome = 1.0 completed, 0.75 disputed, 0.5 cancelled; reviewers the viewer has a completed context with get a floor of 0.8; no-show claims weight 0."
  observability_performance:
    requirements:
      - The PWA sends no telemetry; local diagnostics keep counters without DIDs or content.
      - Recompute for a subject with 500 reviews completes within 20 ms on a Moto G-class device, and reputation card render fits the PWA budget (LCP at most 2.5 s on the 4G profile).
      - Verification of a review (author signature plus ticket signature) takes at most 15 ms p95.
    metrics:
      - "local counter review_total{event=posted|received|quarantined|withdrawn,reason}"
      - "local counter review_ticket_total{event=signed|received|quarantined}"
      - "local histogram reputation_recompute_duration_ms"
    logs:
      - "info review.event {event, correlationId} in the local diagnostics log - no DIDs, ratings or comments."
    budgets:
      - "verify review p95 <= 15 ms; recompute 500 reviews with selection p95 <= 20 ms; list 50 reviews p95 <= 50 ms on a Moto G-class device."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement is covered by at least one automated test with fixed key pairs and an injected clock.
      - Golden vectors pin the dampening formula, the input selection and the Bayesian average.
      - Privacy and abuse tests simulate sybil rings and fabricated completions.
      - Abuse tests cover a withheld completion signature, burial by 500 sybil reviews, relay-signed tombstones and review unlinkability within one cycle.
      - Accessibility and UI copy tests check the review sheet and reputation card, including the dampening honesty text, outcome labels and the source note.
    fixtures: "Principal P, counterparties Q and R, cycle of four DIDs A,B,C,D with legs A to B, B to C, C to D, D to A, opening, completion and recovery event fixtures published by F09.S01.M01, F02.S03.M04, F03.S02.M02, F05.S02.M02 and F09.S02.M02 with their completion statements (deal_completion, booking_completion, rental_completion, return_report, return_attestation, handover attestations) in a record store stub, signed tickets, sybil ring of 5 new DIDs, golden review set of 100 reviews with known weights, relay R1 tombstone signer, fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | integration | 01.R02,04.R02 | opening events then completion events for a deal, a cycle, a booking and a rental | pending windows with tickets exchanged for eligible pairs, then open windows with the documented pairs and closesAt = opensAt plus 30 days"
      - "T02 | unit | 01.R01,02.R01 | post a valid review | statement signed by an active device key, stored posted, immutable fields unchanged, outcome label set, cid computed"
      - "T03 | unit | 02.R01,02.R02 | bad signature, missing ticket, ticket naming another holder, non-adjacent cycle pair, duplicate for the pair, 40 days late, rating 6 | the documented error or quarantine reason each time"
      - "T04 | property | 03.R01,03.R02,03.R03 | random sequences of receive, hide, unhide, withdraw, relay tombstones, window outcomes and expiry | only declared transitions succeed; withdrawn is final; quarantined can re-verify; relay actions change no review"
      - "T05 | unit | 01.R03,09.R02 | golden review set with no-show claims | reviewCount raw, selection, effectiveWeight and bayesianAvg equal golden values within 1e-9; no-show claims leave the average unchanged; recompute twice gives identical results"
      - "T06 | abuse | 07.R02,09.R03 | ring of 5 new DIDs posting 30 five-star reviews about one subject | effective weight is under 15 percent of raw, dampeningNotice is island or many_new_authors, raw count and source count still displayed"
      - "T07 | abuse | 09.R03,02.R02 | collusion pair posts 6 reviews on fabricated contexts with tickets from their own keys | repeat and reciprocity weights reduce them; a second review for the same pairRef is refused as a duplicate"
      - "T08 | contract | 04.R01,04.R03 | commands, queries and events run | outputs, statements, tickets and payloads validate against registry schemas; tombstone verifies; events in the same transaction"
      - "T09 | abuse | 05.R01,05.R03 | locked vault posts; non-author withdraws; relay edits a stored review | FORBIDDEN; NOT_FOUND or FORBIDDEN; edit breaks the signature and is rejected"
      - "T10 | chaos | 06.R01,06.R02,06.R03 | duplicate delivery of reviews and tickets, crash during recompute, offline post then reconnect | one review and one ticket, summary rebuilt, outbox states honest, unverified reviews never counted"
      - "T11 | abuse | 02.R03,05.R02,07.R01 | 31 reviews in 24 hours by one author; 201 received per hour from one source; a subject_only review read without the subject key; a comment containing a phone number | RATE_LIMITED for the 31st and excess quarantined; the subject_only review is unreadable; the composer warns about the contact data before signing"
      - "T12 | load | 08.R01,08.R02,08.R03 | verify 1 000 reviews and recompute a 500 review subject on emulated Moto G | verify p95 <= 15 ms, recompute p95 <= 20 ms; counters carry no DIDs"
      - "T13 | a11y | 09.R05 | review sheet and reputation card with axe-core and keyboard only | zero serious or critical issues; star group labelled; notices announced"
      - "T14 | unit | 09.R01 | traceability run over PS-058 | every requirement maps to a passing test"
      - "T15 | integration | 10.R01,10.R02,10.R03 | export, import to a fresh vault, tombstone after import, and recompute with the previous algorithmVersion | reviews and windows re-verified and round-trip; summary rebuilt; withdrawn review removed from the summary; previous version reproduces the old results"
      - "T16 | abuse | 03.R02,09.R04 | a tombstone targeting Q's public review signed by origin relay R1, then one signed by Q's device key | after the relay tombstone the review stays posted and only R1 leaves provenance and sourceCount; Q's tombstone withdraws it"
      - "T17 | integration | 03.R02,05.R03 | relay R1 stops serving a review copy and answers with a signed not-served statement | vault review stays posted, notServedBy records R1, sourceCount drops by one, the review is never excluded"
      - "T18 | abuse | 01.R04,09.R04 | two public reviews from one 4-party cycle (A about B, C about D) and one subject_only review | the public ones share no identifier (different pairRef, no contextId or completionCid); the subject_only one carries the full ids encrypted to its subject"
      - "T19 | abuse | 09.R04,02.R02 | the subject withholds its completion ticket and the deal is cancelled | the author still posts with the opening ticket, outcome cancelled shown as a label, weight factor 0.5; without the opening ticket only subject_only is offered"
      - "T20 | abuse | 07.R05,09.R04 | 40 genuine reviews, then 500 sybil reviews about the same subject from new DIDs | every genuine review with weight at least 0.5 stays selected; at most 3 per sybil author; the average moves by less than 0.3"
      - "T21 | integration | 04.R02,02.R04 | commerce.deal.completed without completionCid, mutiny.cycle.completed without legs, later corrected events | windows quarantined with missingFields and no pairs; after the corrected events they open"
      - "T22 | integration | 04.R02 | commerce.dispute.resolved with resolution lapsed for a completed deal, carrying caseCid and parties | outcome becomes disputed, disputeFlag set and shown; a subject_only review names the dispute caseCid"
      - "T23 | integration | 04.R04 | comms.meetup.no_show about Q delivered twice, then comms.meetup.no_show_contradicted for it, and a second no_show arriving with contradicted true | one claim recorded per report, noShowClaims 2, contradictedNoShowClaims 2, bayesianAvg unchanged; each claim is shown with the reporter and the contradicting check-in statement"
      - "T24 | unit | 02.R04 | a review with a backdated createdAt signed by a device key the latest verified document already marks revoked; the revocation learned later for one review first seen after its clamped effective time and one first seen before it | the first quarantined with signer_revoked at receipt; on learning, the later-seen one quarantined and the earlier-seen one stays posted with a revoked-signer marker"
      - "T25 | integration | 07.R04 | F10 export, deletion and retention sweep with stub registries; public review to a relay without federation_publish consent | sections exported; reviews and windows pseudonymized, not deleted; the relay is skipped and shown"
      - "T26 | contract | 04.R02 | outcome and opening event fixtures of F09.S01.M01, F02.S03.M04, F03.S02.M02, F05.S02.M02 and F09.S02.M02 | each fixture parses and opens the documented window; a fixture missing an N3 field quarantines"
      - "T27 | e2e | 07.R03,09.R05 | UI copy check of the reputation card and review sheet in every locale bundle | dampening honesty text, 'based on N reviews from M sources seen by this device', outcome labels and the public-review privacy note are present"
      - "T28 | integration | 04.R02,02.R04 | rentals.rental.closed with reason completed and completionKind rental_completion, with reason deposit_unsettled and completionKind return_attestation, with oneSided true, with reason not_returned, and with only the owner's rental_completion stored | windows open with outcome completed for the first two after both statements verify; no window for one-sided or not_returned closures; the last quarantined until federation.record.accepted delivers the renter's statement, then opens"
      - "T29 | integration | 04.R02,02.R04 | commerce.deal.completed with deal_completion statements by both parties, services.booking.completed with only the provider's booking_completion stored, and a completion event whose completionCid matches no stored statement | the deal window opens; the booking window is quarantined listing the client's statement and opens when it arrives; the unmatched one stays quarantined and no 'confirmed by both' label is shown"
      - "T30 | integration | 04.R02,01.R02 | mutiny.cycle.completed with receiptCids for all legs; mutiny.recovery.resolved with outcome unresolved, with dispute_outcome and with agreed for another cycle | the completed cycle opens leg-connected windows with the receipts as proof; unresolved and dispute_outcome give outcome disputed with disputeFlag and the evidenceCids recorded; agreed gives outcome cancelled; non-adjacent pairs get no window"
      - "T31 | contract | 04.R01 | post, ticket signing and withdraw with a StatementPublisherPort spy | reviews and tickets go through StatementPublisherPort.publish and withdrawals through issueTombstone; cid and signatures follow F11.S01.M03; no other signing path"
    acceptance:
      - All tests T01-T31 pass in CI.
      - Golden dampening and selection vectors are stable, a sybil ring cannot raise the effective weight of its reviews above 15 percent of raw, and 500 sybil reviews cannot push genuine reviews out of the summary.
      - The UI always shows raw counts, outcome labels, source count and the dampening notice, and never claims verified identity of persons.
      - No relay action or relay-signed tombstone withdraws or hides a review in a vault, and two public reviews from one cycle share no identifier.
  import_export_backup_rollback:
    requirements:
      - The vault export contains the principal's own reviews, received reviews it chose to keep, review windows with their tickets, and not the derived summary, which is rebuilt.
      - Import re-verifies signatures and tickets and quarantines failures; open windows are restored with their original closesAt.
      - Algorithm changes bump algorithmVersion, recompute from stored reviews, and keep the previous version's results available for 30 days.
    export: "Sections identity.reviews and identity.review_windows in classrup-export/v1 (schemas classrup.identity.review/v1 and classrup.identity.review_window/v1, tickets classrup.identity.review_ticket/v1); ReputationSummary is excluded because it is derived, no-show claims are included as inputs."
    import: "Each review and ticket is re-verified; invalid ones are reported and skipped; windows already past closesAt import as closed; summaries are recomputed after import."
    backup: "The vault export is the primary backup (IOX-6); relays store public review statements only and losing a relay loses no private data (IOX-7)."
    migration_rollback: "Algorithm and schema changes are additive; rollback is recompute with the previous algorithmVersion from the stored reviews."
