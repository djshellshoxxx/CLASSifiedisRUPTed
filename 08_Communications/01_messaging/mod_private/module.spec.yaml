id: F08.S01.M01
scope: MVP
summary: >-
  Private end-to-end encrypted messages between members, authored and stored in the users' local vaults and
  carried as signed encrypted envelopes through user-selected relay mailboxes (ADR-0016). The sender's vault
  encrypts text with a random per-message key (XChaCha20-Poly1305), wraps that key for each recipient device with
  x25519, signs the envelope with its Ed25519 device key and queues one copy per recipient mailbox. A relay
  mailbox stores only ciphertext and routing metadata until the recipient fetches and acknowledges it. Text is
  limited to 8 KiB. The MVP has no forward secrecy and no metadata protection from the relay; both are documented
  to users. Sync status shown to the sender never claims more than local committed, prepared, transport
  acknowledged or peer accepted.
responsibilities:
  - Own the Message record in the vault (plaintext, envelope, sync state) and its delete lifecycle.
  - Compose, encrypt, sign and queue envelopes per recipient mailbox through the vault sync outbox, with the sync states local committed, prepared, transport acknowledged, peer accepted.
  - Verify, decrypt and store inbound envelopes; quarantine envelopes with invalid signatures, unknown threads, blocked senders or undecryptable bodies.
  - Provide the relay mailbox commands put, fetch and acknowledge that store ciphertext envelopes for a recipient and delete them on acknowledgement or after 30 days.
  - Offer optional signed delivery and read acknowledgements that the recipient can switch off.
  - Delete a message locally and publish a signed delete request that recipient vaults honour on a best-effort basis.
non_responsibilities:
  - Thread membership, context binding, mute and archive (F08.S01.M02 threads).
  - Encrypted image attachments (F08.S01.M03); a message only carries an attachment reference inside its encrypted body.
  - Device key generation, storage and revocation (F07.S01.M01 identity, F16.S02.M01 key lifecycle).
  - Alerts about new messages (F13 notifications consume comms.message.received locally; push through a relay is content-free).
  - Relay selection, relay registration and mailbox ID publication (F07 profile statements and F15 relay adapters).
  - "Future: forward secrecy via double ratchet, sealed sender, mailbox ID rotation per conversation, post-quantum hybrid key wrap, relay-to-relay mailbox forwarding."
depends_on: [F08.S01.M02, F07.S01.M01, F07.S02.M02, F16.S02.M02, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-PRV-001, CTR-IDM-001, CTR-OBS-001, CTR-FED-001, CTR-IOX-001]
user_stories:
  - As a member, I can send a text message to the other party of a listing thread and know that only our devices can read it and which delivery stage it reached.
  - As a member, I can delete a message I sent so it disappears from my vault and a delete request is sent, understanding that a copy already on the other device cannot be forced away.
  - As a member who reopens the app after two days offline, I receive every missed message from my relay mailbox in sender order.
  - As a member, I can turn delivery receipts off so the other party cannot see when I read messages.
  - As a member, I can see that a relay outage leaves my messages queued as prepared instead of falsely marked as sent.
edge_cases:
  - Recipient adds a new device after the message was sent; the new device cannot read old messages because wrapped keys exist only for devices known at send time.
  - Sender's cached device list for the recipient is stale and omits a new device; that device cannot decrypt, the recipient's other device shows a notice, and the sender is asked to resend after refreshing the device list.
  - Recipient device key is revoked before delivery; its wrapped key is ignored and remaining devices still decrypt.
  - Plaintext of exactly 8192 bytes is accepted; 8193 bytes is refused in the vault and a relay refuses mailbox put bodies over 16 384 bytes with PAYLOAD_TOO_LARGE.
  - Same envelope fetched twice because an acknowledgement was lost; the vault deduplicates on messageId and acknowledges again.
  - Sender is blocked by one recipient of a three-party thread; the blocker's vault drops the envelope silently, the others receive it, and the sender is never told.
  - Sender's clock is 3 hours wrong; the claimed createdAt is shown as a claim, local receivedAt and relay receipt time are stored separately, and per-sender seq orders messages.
  - Relay is unreachable for 4 days; messages stay prepared in the outbox, are retried with backoff, and expire after 14 days with a visible failed state and a resend button.
ux:
  screens:
    - "Conversation view: message bubbles grouped by day, composer with 8 192-byte counter, send button, per-message sync state icon (saved on this device, queued, accepted by relay, acknowledged by recipient)."
    - "Message actions sheet: copy, delete, report (attaches decrypted text to the report only with the user's confirmation)."
    - "Encryption info sheet: states what is protected (message text, attachment content) and what the relay can see (sender and recipient mailbox identifiers, timestamps, sizes), that history is not protected if a device key is stolen, and that deletion cannot recall copies."
    - "Receipts setting: two toggles, delivery receipts and read receipts, both off by default."
  states: [loading, empty, sending, local-committed, prepared-queued, transport-acknowledged, peer-accepted, failed-retry, deleted-tombstone, offline, decrypt-failed, quarantined]
  a11y:
    - New incoming messages are announced through an aria-live polite region with sender pseudonym and no message text unless the user enabled it.
    - Sync state is conveyed by text and icon together, never by color alone.
    - Composer has a visible label and a character counter exposed to screen readers when within 500 bytes of the limit.
    - Message actions are reachable by keyboard and by long press; all targets are at least 44 by 44 px.
processes:
  domain_schema:
    requirements:
      - A Message is a vault record holding plaintext, the signed envelope (nonce, ciphertext, signature), the per-recipient wrapped keys, the per-sender sequence number and the sync state, with tenant and revision per CTR-ID-001; plaintext never leaves the vault except inside the encrypted envelope.
      - Cryptographic construction is fixed for v1 as a random 32-byte message key encrypting padded plaintext with XChaCha20-Poly1305 (additional data thread ID, message ID, sender device ID) and wrapped per recipient device by x25519 ECDH with a fresh ephemeral key, HKDF-SHA256 and XChaCha20-Poly1305, using @noble/curves and @noble/ciphers 2.4.0.
      - Messages are P2; the relay stores only a MailboxEnvelope (ciphertext plus routing metadata) under RET-SHORT for at most 30 days, while vault Messages follow RET-STANDARD under the user's control.
      - Timestamps from other parties are claims; the vault stores the sender's createdAt as a claim, its own receivedAt, and the relay-signed receipt time as evidence of that relay's clock only.
    entities:
      - name: Message
        schema: classrup.comms.message/v1
        storage: device
        privacy: P2
        retention: RET-STANDARD
        fields:
          - "id: uuidv7 — primary key, generated by the sender vault"
          - "tenantId: uuidv7 — relay or community scope the thread belongs to, per CTR-ID-001"
          - "threadId: uuidv7 — ref F08.S01.M02 Thread; must be active"
          - "direction: enum — outbound | inbound"
          - "senderDid: did:key — author principal"
          - "senderDeviceId: uuidv7 — device whose Ed25519 key signed the envelope"
          - "seq: int — per-sender, per-thread counter starting at 1; with prev forms the author chain of CTR-FED-001 FED-3"
          - "prev?: string — sha256 cid of the sender's previous message in the thread"
          - "alg: enum — xchacha20poly1305-x25519-v1 (only value in v1)"
          - "nonce: bytes — 24 bytes base64url"
          - "ciphertext: bytes — base64url, 17..12 288 bytes (padded plaintext 1..8 192 plus 16-byte tag, padded to 256-byte buckets)"
          - "wrappedKeys: array — 1..64 items { recipientDeviceId, ephemeralPub (32 bytes), nonce (24 bytes), wrappedKey (48 bytes) }; not covered by the sender signature because each wrap is authenticated by its own AEAD"
          - "senderSignature: bytes — Ed25519 64 bytes over JCS of the signed statement classrup.comms.message/v1 (envelope minus wrappedKeys and sig)"
          - "body?: string — plaintext, 1..8 192 bytes UTF-8; present in the vault only"
          - "replyToId?: uuidv7 — message in the same thread"
          - "receiptsRequested: boolean — sender asks for receipts; recipients may ignore"
          - "syncState: enum — local_committed | prepared | transport_acknowledged | peer_accepted | failed (outbound only)"
          - "status: enum — active | quarantined | deleted"
          - "createdAtClaim: timestamp — sender clock, a claim"
          - "receivedAt?: timestamp — local clock at inbound verification"
          - "relayReceipt?: object — { relayId, receivedAt, sig } relay-signed evidence of the relay clock only"
          - "deletedAt?: timestamp — set when status is deleted"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - An inbound Message is stored active only after its signature verified against a device key listed for senderDid and its sender is a current participant of the thread; otherwise it is quarantined with a reason.
          - (threadId, senderDid, seq) is unique; a second envelope with the same triple and a different cid is a fork and freezes the thread for review instead of overwriting.
          - status deleted implies body, ciphertext and wrappedKeys are erased and only id, threadId, senderDid, seq and deletedAt remain.
          - syncState never moves backwards and peer_accepted requires a signed acknowledgement statement from the recipient.
      - name: MailboxEnvelope
        schema: classrup.comms.mailbox_envelope/v1
        storage: relay
        privacy: P2
        retention: RET-SHORT
        fields:
          - "id: uuidv7 — relay-assigned"
          - "mailboxId: string — 128-bit random identifier owned by one recipient at this relay, base64url"
          - "messageId: uuidv7 — copied from the signed envelope for deduplication"
          - "senderDid: did:key — visible routing metadata, honestly disclosed"
          - "size: int — 1..16 384 bytes"
          - "blob: bytes — the per-recipient envelope, opaque ciphertext"
          - "receivedAt: timestamp — relay clock"
          - "relayReceiptSig: bytes — relay Ed25519 signature over (mailboxId, messageId, receivedAt)"
          - "expiresAt: timestamp — receivedAt + 30 days"
        invariants:
          - At most one MailboxEnvelope per (mailboxId, messageId).
          - A mailbox holds at most 1 000 envelopes and 20 MiB; further puts return COMMS_MAILBOX_FULL.
          - The relay never stores a decryption key or plaintext and never modifies blob.
      - name: MessageReceipt
        schema: classrup.comms.message_receipt/v1
        storage: device
        privacy: P2
        retention: RET-SHORT
        fields:
          - "messageId: uuidv7 — ref Message"
          - "recipientDid: did:key — who acknowledged"
          - "kind: enum — delivered | read"
          - "signedAt: timestamp — recipient clock, a claim"
          - "sig: bytes — Ed25519 over JCS of statement classrup.comms.message_receipt/v1"
        invariants:
          - At most one receipt per (messageId, recipientDid, kind) and a receipt is only stored when its signature verifies.
    sql: |
      CREATE TABLE comms_mailbox_envelope (
        id TEXT PRIMARY KEY, mailbox_id TEXT NOT NULL, message_id TEXT NOT NULL, sender_did TEXT NOT NULL,
        size INTEGER NOT NULL, blob BLOB NOT NULL, received_at TEXT NOT NULL, expires_at TEXT NOT NULL);
      CREATE UNIQUE INDEX comms_mailbox_dedupe ON comms_mailbox_envelope(mailbox_id, message_id);
      CREATE INDEX comms_mailbox_expiry ON comms_mailbox_envelope(expires_at);
  validation_rules:
    requirements:
      - Envelope input is validated strictly against the schema in the vault before signing and again by the receiving vault; sizes, lengths and encodings are checked before any decryption.
      - Relay mailbox commands validate size, quota and request signatures without reading ciphertext.
      - Every violation maps to one stable error code with a localized message key.
    rules:
      - "V01 | envelope fields have the exact encodings and lengths of the schema (nonce 24 B, ephemeralPub 32 B, wrappedKey 48 B, signature 64 B) | VALIDATION_FAILED"
      - "V02 | ciphertext length between 17 and 12 288 bytes (plaintext at most 8 192 bytes) and mailbox put body at most 16 384 bytes | PAYLOAD_TOO_LARGE"
      - "V03 | thread exists in the vault, is active, and the sender is a current participant | NOT_FOUND"
      - "V04 | in a one-to-one thread the sender is not blocked by the recipient in the local block list (F07.S02.M02) | BLOCKED_PARTY"
      - "V05 | senderSignature verifies against a non-revoked Ed25519 device key of senderDid known to the receiving vault | COMMS_MESSAGE_SIGNATURE_INVALID"
      - "V06 | wrappedKeys contains an entry for at least one device the recipient vault owns; otherwise the message is stored quarantined as undecryptable | COMMS_MESSAGE_NOT_FOR_DEVICE"
      - "V07 | replyToId, when set, refers to a message of the same thread | VALIDATION_FAILED"
      - "V08 | delete is requested by the author of the message and the message is not already deleted | FORBIDDEN"
      - "V09 | a vault sends at most 60 messages per minute and 1 000 per day; a relay accepts at most 120 puts per hour per mailbox from one sender DID | RATE_LIMITED"
      - "V10 | mailbox fetch and acknowledge requests are signed by a device key registered for the mailbox with a timestamp within 120 s of relay time | UNAUTHENTICATED"
  workflow_state_machine:
    requirements:
      - An outbound Message advances only forward through local committed, prepared, transport acknowledged and peer accepted, may fail while not yet transport acknowledged, and the UI shows exactly the reached state.
      - An inbound Message is created active or quarantined and can only be deleted afterwards; deleted is terminal and irreversible.
      - Receipts never change message state other than peer accepted; they are separate append-only rows.
    machines:
      - entity: Message
        initial: local_committed
        terminal: [deleted]
        transitions:
          - "local_committed -> prepared | sync outbox builds per-recipient envelopes | one envelope per recipient mailbox written to outbox"
          - "prepared -> transport_acknowledged | relay returns signed receipt for comms.mailbox.put | relayReceipt stored; emits comms.message.sent"
          - "prepared -> failed | 14 days without relay receipt or non-retryable relay refusal | outbox entry marked failed, resend allowed as a new attempt"
          - "failed -> prepared | user taps resend | new envelope built with same messageId"
          - "transport_acknowledged -> peer_accepted | signed delivered receipt from a recipient | receipt stored"
          - "local_committed -> deleted | comms.message.delete by author | body erased, delete statement queued"
          - "prepared -> deleted | comms.message.delete by author | queued envelope cancelled, body erased"
          - "transport_acknowledged -> deleted | comms.message.delete by author | body erased, signed delete request queued; emits comms.message.deleted"
          - "peer_accepted -> deleted | comms.message.delete by author | body erased, signed delete request queued; emits comms.message.deleted"
          - "failed -> deleted | comms.message.delete by author | body erased"
      - entity: Message (inbound)
        initial: received
        terminal: [deleted]
        transitions:
          - "received -> deleted | author delete statement verified, local delete by recipient, thread purge, or vault wipe | body erased; emits comms.message.deleted"
          - "quarantined -> received | user approves a message request from an unknown sender | verification re-run"
          - "quarantined -> deleted | user rejects or 30 days pass | envelope erased"
    timeouts:
      - "Outbox retries prepared envelopes with backoff 1 s, 2 s, 4 s ... capped at 15 min, until 14 days after creation."
      - "Relay deletes mailbox envelopes 30 days after receivedAt (hourly sweep)."
      - "Quarantined inbound messages are erased 30 days after arrival."
  commands_queries_events:
    requirements:
      - The vault exposes send, delete and acknowledge commands that produce signed statements and a local read query; the relay exposes put, fetch and acknowledge mailbox commands.
      - Each state-changing vault command emits its event in the same IndexedDB transaction as the state change (CTR-EVT-001 EVT-8) and each relay command is atomic in the relay SQLite store.
      - The module consumes thread, device-key, block and deletion events to keep recipient sets and inbound filtering correct.
    commands:
      - name: comms.message.send
        capability: comms.message.send
        input: "[vault command; produces signed statement classrup.comms.message/v1] { messageId, threadId, body, replyToId?, receiptsRequested? }"
        output: "{ messageId, seq, syncState: local_committed, revision: 1 }"
        errors: [VALIDATION_FAILED, PAYLOAD_TOO_LARGE, NOT_FOUND, BLOCKED_PARTY, RATE_LIMITED]
        emits: []
        idempotent: true
      - name: comms.message.delete
        capability: comms.message.delete
        input: "[vault command; produces signed statement classrup.comms.message_delete/v1] { messageId, expectedRevision }"
        output: "{ messageId, revision, deletedAt }"
        errors: [NOT_FOUND, FORBIDDEN, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [comms.message.deleted]
        idempotent: true
      - name: comms.message.acknowledge
        capability: comms.message.acknowledge
        input: "[vault command; produces signed statement classrup.comms.message_receipt/v1] { messageId, kind: delivered|read }"
        output: "{ messageId, kind, signedAt }"
        errors: [NOT_FOUND, RATE_LIMITED]
        emits: []
        idempotent: true
      - name: comms.mailbox.put
        capability: comms.mailbox.put
        input: "[relay command] { mailboxId, messageId, senderDid, blob (≤ 16 384 bytes) }"
        output: "{ envelopeId, relayReceipt: { relayId, receivedAt, sig } }"
        errors: [VALIDATION_FAILED, PAYLOAD_TOO_LARGE, NOT_FOUND, RATE_LIMITED, COMMS_MAILBOX_FULL]
        emits: []
        idempotent: true
      - name: comms.mailbox.fetch
        capability: comms.mailbox.fetch
        input: "[relay command, signed request] { mailboxId, afterEnvelopeId?, limit ≤ 100 }"
        output: "{ items: [{ envelopeId, blob, receivedAt, relayReceipt }], next? }"
        errors: [UNAUTHENTICATED, NOT_FOUND, RATE_LIMITED]
        emits: []
        idempotent: true
      - name: comms.mailbox.ack
        capability: comms.mailbox.ack
        input: "[relay command, signed request] { mailboxId, envelopeIds[] (≤ 100) }"
        output: "{ deleted }"
        errors: [UNAUTHENTICATED, NOT_FOUND]
        emits: []
        idempotent: true
    queries:
      - name: comms.message.list_thread
        capability: comms.message.read_thread
        input: "[vault query] { threadId, afterSeqBySender?, limit ≤ 100 }"
        output: "{ items: Message[] (plaintext, sync state, receipts), next? }"
        errors: [NOT_FOUND]
    events_produced:
      - {type: comms.message.sent, privacy: P2, payload: "{ messageId, threadId, seq, recipientDids[], relayId, relayReceivedAt }"}
      - {type: comms.message.deleted, privacy: P2, payload: "{ messageId, threadId, seq, senderDid, reason: author|recipient|purge|vault_wipe }"}
      - {type: comms.message.received, privacy: P2, payload: "{ messageId, threadId, senderDid, seq, receivedAt }"}
    events_consumed:
      - {type: comms.thread.archived, effect: "stop accepting inbound envelopes for the thread and schedule local purge 30 days after archive unless the user keeps it"}
      - {type: identity.device_key.revoked, effect: "mark the device as revoked in the local device list; envelopes signed by it after the revocation statement time are quarantined"}
      - {type: identity.device_key.added, effect: "add the device to the recipient or self device list so later sends wrap for it"}
      - {type: identity.block.added, effect: "silently drop future inbound envelopes from the blocked DID and hide existing messages in group threads"}
      - {type: privacy.deletion.completed, effect: "erase all messages in the vault and queue a mailbox ack for pending envelopes"}
    errors:
      - "COMMS_MESSAGE_SIGNATURE_INVALID | 422 | no | sender signature does not verify or the signing device is revoked"
      - "COMMS_MESSAGE_NOT_FOR_DEVICE | 422 | no | no wrapped key addressed to a device of this vault"
      - "COMMS_MAILBOX_FULL | 429 | yes | mailbox holds 1 000 envelopes or 20 MiB; retryAfterMs set"
    example: |
      vault command comms.message.send
      { "messageId": "0192f3a4-1111-7000-8000-000000000001", "threadId": "0192f3a4-0000-7000-8000-0000000000aa", "body": "Is it still available?" }
      -> { "messageId": "0192f3a4-1111-7000-8000-000000000001", "seq": 42, "syncState": "local_committed", "revision": 1 }
      relay command POST /api/v1/relay/comms.mailbox.put
      Idempotency-Key: 0192f3a4-0000-7000-8000-000000000101
      { "mailboxId": "q3F…", "messageId": "0192f3a4-1111-7000-8000-000000000001", "senderDid": "did:key:z6Mk…", "blob": "…" }
      201 { "envelopeId": "0192f3a4-3333-7000-8000-000000000001", "relayReceipt": { "relayId": "relay.example", "receivedAt": "2026-11-04T10:00:01.000Z", "sig": "…" } }
  authorization_capabilities:
    requirements:
      - Vault policy lets only the unlocked local principal send, delete or acknowledge in threads where it is a participant; inbound statements are accepted only when signed by a key authorized for the sender role in the thread.
      - Relay policy lets anyone holding a mailbox ID put an envelope within rate limits, but only a device key registered for the mailbox can fetch or acknowledge; moderators of a relay cannot read ciphertext and may only remove envelopes under that relay's hosting policy.
      - Non-participants and relay operators learn nothing beyond routing metadata; unknown mailbox IDs return NOT_FOUND to prevent enumeration.
    capabilities:
      - "comms.message.send | local principal | vault policy; participant(thread); not blocked by recipient in one-to-one threads"
      - "comms.message.delete | local principal | message.senderDid is the local principal"
      - "comms.message.acknowledge | local principal | participant(thread); message authored by another participant"
      - "comms.message.read_thread | local principal | participant(thread)"
      - "comms.mailbox.put | anonymous | relay policy; mailbox exists; body at most 16 384 bytes; 120 puts per hour per mailbox and sender DID"
      - "comms.mailbox.fetch | mailbox owner | relay policy; request signed by a device key registered for the mailbox"
      - "comms.mailbox.ack | mailbox owner | relay policy; request signed by a device key registered for the mailbox"
  failure_recovery_idempotency:
    requirements:
      - Vault commands commit locally first and relay delivery is a retried outbox step; mailbox put is idempotent on (mailboxId, messageId) so replays return the original receipt.
      - Inbound processing is idempotent on messageId and fetch followed by acknowledge is at-least-once; a lost acknowledgement only causes a duplicate fetch.
      - Offline vaults queue sends and replay them in creation order; no distributed lock is used and forked sender chains are detected and frozen rather than merged.
    idempotency: "Vault commands are idempotent on messageId; relay commands require Idempotency-Key with a 24 h replay window and put is also naturally idempotent on (mailboxId, messageId)."
    concurrency: "Within a vault each command runs in one IndexedDB transaction; the per-sender seq is allocated in that transaction; on the relay put uses INSERT with the unique index; fetch is read-only; two devices of one principal choose seq from a shared counter synchronized through the sender's own self-mailbox, and a collision on (threadId, senderDid, seq) is treated as a fork and surfaced."
    retries: "Outbox retries network errors and RATE_LIMITED with CTR-IDM-001 backoff (base 1 s, factor 2, jitter, cap 15 min) for 14 days; non-retryable relay refusals mark the message failed."
    offline: "Compose and queue offline; the message shows saved on this device; fetch resumes from the last stored envelope ID; decrypted history exists only in the vault."
    partial_failure: "If some recipient mailboxes accept and others do not, per-recipient outbox entries retry independently and the message stays prepared until all are acknowledged; if the relay stops entirely, delivery status becomes unknown and local records are unaffected."
  privacy_retention_abuse:
    requirements:
      - The relay stores ciphertext and routing metadata only; plaintext, message keys and private keys never leave vaults, and relay logs never contain blobs or plaintext.
      - Honest limits are shown to users and documented, namely no forward secrecy in the MVP, the relay sees sender DID, recipient mailbox, times and padded sizes, and a stolen unlocked device exposes its history.
      - Abuse handling works without relay decryption through local blocking, message requests for unknown senders, relay rate limits and user-initiated reports that carry plaintext from the reporter's vault.
    data:
      - "Message plaintext and keys: P2, vault only."
      - "MailboxEnvelope ciphertext: P2, opaque to the relay; routing metadata (senderDid, mailboxId, size, receivedAt) visible to the relay operator."
      - "MessageReceipt: P2, visible to sender and recipient."
    retention:
      - "Relay mailbox envelopes: deleted on acknowledgement or 30 days after receipt (RET-SHORT)."
      - "Vault messages: RET-STANDARD, local purge 30 days after thread archive unless kept; deletion tombstone retains id and seq."
      - "Receipts: RET-SHORT (30 days)."
    threats:
      - "T01 | Relay operator or intruder reads message content | content is ciphertext with per-message keys wrapped to recipient devices; relay holds no private keys"
      - "T02 | Relay operator maps social graph from metadata | not prevented in MVP and disclosed in the encryption info sheet; padding to 256-byte buckets hides exact lengths; users may choose a relay they self-host"
      - "T03 | Compromised device key reveals past messages | no forward secrecy in MVP and disclosed; users can revoke a device and delete messages; Future double ratchet"
      - "T04 | Attacker injects messages impersonating a participant | inbound requires a valid Ed25519 envelope signature by a device key of the participant and AEAD additional data binds thread, message and sender device"
      - "T05 | Message flooding or harassment | vault block list drops envelopes, unknown senders land in message requests, relay limits 120 puts per hour per mailbox and sender DID, vault limits 60 per minute"
      - "T06 | Replay of an old envelope into another thread | additional data includes threadId and messageId so decryption fails elsewhere, and deduplication on messageId drops replays"
      - "T07 | Mailbox ID harvested and used to fill the mailbox | per-sender put limit, 1 000 envelope and 20 MiB cap, mailbox owner can rotate the mailbox ID and publish a new one in a signed profile statement"
    abuse_controls:
      - "Report message action attaches the decrypted text and the signed envelope to a report for the relay operator or local advisory feed only after the reporter confirms; the signature proves the sender key signed it, not that the content is true."
      - "Relay-local hosting policy can refuse puts from a sender DID or remove envelopes; no global takedown is claimed."
  observability_performance:
    requirements:
      - Relay mailbox commands are measured per CTR-OBS-001 without logging beyond correlationId and sizes; the PWA records only local diagnostics (OBS-7).
      - Mailbox put meets the write budget p95 ≤ 300 ms at 100 puts per second and fetch of 100 envelopes meets p95 ≤ 150 ms.
      - Vault encrypt-and-sign meets a device budget and the relay expiry sweep lag is bounded.
    metrics:
      - "classrup_comms_mailbox_puts_total{outcome=ok|full|rate_limited|rejected} (relay)"
      - "classrup_comms_mailbox_depth (gauge, relay, per bucket of mailbox size)"
      - "classrup_comms_mailbox_envelope_bytes (histogram, relay)"
      - "classrup_comms_mailbox_expiry_lag_ms (gauge, relay)"
      - "vault diagnostics counters: outbound_by_sync_state, inbound_quarantined, decrypt_failures (local only)"
    logs:
      - "relay info mailbox.put {mailboxIdHash, size, correlationId} — no sender, blob or plaintext."
      - "vault warn message.quarantined {messageId, reason} — local diagnostics only."
    budgets:
      - "Relay put p95 ≤ 300 ms at 100 req/s; fetch 100 envelopes p95 ≤ 150 ms; sweep deletes 50 000 expired envelopes in ≤ 30 s."
      - "Vault compose, encrypt, wrap for 12 devices and sign ≤ 150 ms on a mid-range phone (Moto G class)."
      - "Each per-recipient blob ≤ 16 384 bytes including at most 5 wrapped keys for that recipient's devices."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Contract tests verify that vault and relay command inputs, outputs, statements and event payloads validate against schema registry entries.
      - Cryptographic round trips use fixed known-answer vectors plus property tests.
    fixtures: "Two vaults A (devices A1, A2) and B (device B1), one in-memory relay R with mailboxes for A and B, active thread TH between A and B, fixed clock 2026-11-04T10:00:00Z, deterministic noble RNG seeded for vectors."
    tests:
      - "T01 | unit | 01.R01,01.R02,01.R04,02.R01 | encrypt 8 192-byte plaintext on A1, wrap for A2 and B1, sign, decrypt on B1 | plaintext recovered; envelope fields have exact lengths; relay row contains no plaintext; createdAtClaim stored as claim"
      - "T02 | property | 01.R02,09.R03 | random plaintexts 1..8 192 bytes and random single-bit corruption of ciphertext, nonce or additional data | decryption succeeds unmodified and always fails when corrupted"
      - "T03 | unit | 01.R03,03.R02 | inbound envelope accepted, then author delete statement applied | body erased, tombstone kept, seq not reused"
      - "T04 | unit | 02.R02,02.R03 | each rule V02 to V10 violated in turn | documented error code returned and nothing stored"
      - "T05 | property | 03.R01,03.R03 | random sequences of send, relay outcomes, receipts and delete | syncState only moves forward as declared; deleted never returns; UI state equals highest reached state"
      - "T06 | contract | 04.R01,04.R02,09.R02 | each vault command, relay command and query executes | outputs, statements and event payloads validate against registry schemas"
      - "T07 | integration | 04.R03 | device key revoked and added events delivered, then send | revoked device excluded and new device wrapped for later sends only"
      - "T08 | abuse | 05.R01,05.R02,05.R03 | fetch with unregistered key; put to unknown mailbox; statement signed by non-participant; relay operator tries to read blobs | UNAUTHENTICATED, NOT_FOUND or quarantine; operator sees only ciphertext"
      - "T09 | integration | 06.R01,06.R02 | 50 concurrent sends plus 10 replays of mailbox put and duplicate fetches | one envelope per messageId, contiguous seq, duplicates deduplicated"
      - "T10 | e2e | 06.R03,03.R01 | relay down for 4 days, then restored | messages stay prepared, then become transport acknowledged; recipient receives 30 messages in sender order; UI never shows delivered early"
      - "T11 | abuse | 07.R01,07.R03 | inspect relay database, logs and metrics after 1 000 messages; report a message | no plaintext or keys present; report contains plaintext only after confirmation"
      - "T12 | abuse | 07.R02 | 61st send in a minute; 121st put in an hour; blocked recipient | RATE_LIMITED; blocker's vault drops silently and sender sees no error"
      - "T13 | chaos | 06.R03 | one of two recipient mailboxes rejects with 503 while the other accepts | message stays prepared, accepted copy not re-sent, retry completes the other"
      - "T14 | load | 08.R01,08.R02,08.R03 | 100 puts per second for 5 minutes then fetch of 100 envelopes then sweep of 50 000 | p95 within budgets, metrics exported"
      - "T15 | unit | 09.R01 | traceability tool run | every PS-060 requirement maps to a passing test"
      - "T16 | integration | 10.R01,10.R02,10.R03 | export, re-import into fresh vault, restore from backup | messages round trip identical; import quarantines envelopes with invalid signatures"
      - "T17 | a11y | 04.R01 | conversation screen on mobile with screen reader | new message announced in polite region, sync state has text, zero serious axe issues"
    acceptance:
      - All tests T01 to T17 pass in CI.
      - A relay database and log dump after test traffic contains no plaintext, message keys or private keys.
      - The sender UI never shows delivered or accepted before the matching relay receipt or signed peer acknowledgement exists.
      - Documentation shown in the encryption info sheet states no forward secrecy, relay-visible metadata and that deletion cannot recall copies.
  import_export_backup_rollback:
    requirements:
      - A user's vault export contains their messages with plaintext inside the export file protected by the user's chosen export encryption, and the matching signed envelopes.
      - Import validates envelope structure and signatures; messages whose signature fails are kept quarantined and messages not addressed to the importer's devices are kept as undecryptable history.
      - Schema changes follow expand and contract; the alg field allows adding algorithms without breaking v1 readers, and relays only ever hold 30 days of ciphertext so relay loss loses no user-owned records.
    export: "Section comms.messages in classrup-export/v1; one line per Message (schema classrup.comms.message/v1) with body and signed envelope; export is the primary backup (IOX-6) and is encrypted with a user-chosen passphrase or the recovery kit key."
    import: "Envelopes are verified for schema and signature; existing IDs are skipped; failed signatures are kept quarantined; messages are never re-wrapped or re-sent on import."
    backup: "The vault export is the backup; relay mailboxes are covered by the relay SQLite backup (CTR-IOX-001 IOX-3, IOX-7) and contain only ciphertext expiring in 30 days."
    migration_rollback: "Additive optional fields only in v1; a new alg value is introduced behind a tenant flag and older clients ignore messages with unknown alg and show an unsupported-message notice; rollback is safe because unknown algs remain stored."
