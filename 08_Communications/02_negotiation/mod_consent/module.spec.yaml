id: F08.S02.M02
scope: MVP
summary: >-
  The shared signed consent record used by bazaar offers and negotiations, mutiny proposals and cycles, service
  bookings, rental reservations and deposits, and meetups. A ConsentStatement binds a signer (did:key) and signer
  key, a subject reference, the CTR-ID-001 ID-3 cid of the exact subject revision, a statement key and locale naming
  the displayed wording, and a signing time claim. It is signed through the F16.S02.M03 envelope with context
  classrup/consent/v1, which binds the context and the signer key-ID digest into the signed bytes, produced in the
  signer's vault, sent as a signed statement through any transport, verified by every receiving vault and kept as
  evidence. Each owning module registers a ConsentSubjectPort for its subject type, so this module can check the
  current revision, the signer's role and whether the subject is committed. Duplicates resolve to the same record
  in every vault, a revocation that arrives after an owning module committed makes verify return conflicted so the
  parties freeze instead of diverging, and validity after a device-key revocation is judged by first-seen time. A
  consent evidences that a key holder asserted agreement with that exact revision; it is not evidence of delivery,
  payment or that the other party will perform. Revocation is a second signed statement and never rewrites history.
responsibilities:
  - Own the ConsentStatement record and its canonical signing bytes, produced through the F16.S02.M03 envelope with context classrup/consent/v1 over the exact signed field list.
  - Provide the reusable vault command comms.consent.sign that other modules call after showing the user the exact revision and wording, and the pure verify query comms.consent.verify.
  - Accept inbound consent statements through comms.consent.accept, verify signer key status, signature, subject hash and role, and store them with provenance and first-seen time or quarantine them with a reason.
  - Provide comms.consent.revoke which signs a revocation statement targeting a consent or its dedupe tuple, and report conflicts (consent and decline, or a revocation that arrived after the owning module committed, for one subject hash) so owning modules freeze instead of resolving by timestamp.
  - Maintain the registry of statement keys with versions, locales and text hashes so the wording the signer saw can be proven later.
  - Define the ConsentSubjectPort {canonicalBytes(ref, rev), currentRevision(ref), partyRole(ref, did), isCommitted(ref)} that each owning module registers for its subjectType.
  - Resolve duplicates deterministically (lowest cid kept in every vault, others stored as aliases) and register the F10 privacy ports, pseudonymizing signerDid in kept consents on principal deletion (N6).
non_responsibilities:
  - Deciding what a consent means for a trade, cycle, booking or meetup; the owning modules (F01, F02, F03, F05, F08.S03.M03) decide and call this module.
  - Computing the canonical subject bytes, current revision, party roles and commit state; each owning module registers a ConsentSubjectPort for its subjectType (F08.S03.M03 registers it for comms_meetup).
  - Key generation and storage (F07.S01.M01, F16.S02.M01), key status, revocation and freshness (F16.S02.M02) and the signature envelope and context registry (F16.S02.M03).
  - Message transport (F08.S01.M01), delivery and outbox states (F11.S02.M01 on F15.S01.M01) and relay forwarding (F11 federation).
  - "Future: threshold and multi-device co-signing, time-stamping authority anchoring, hardware-key attestation of the signing device."
depends_on: [F07.S01.M01, F07.S02.M02, F16.S02.M02, F16.S02.M03, F11.S01.M01, F11.S02.M01, F15.S01.M01, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, CTR-FED-001, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-PRV-001, CTR-IDM-001, CTR-OBS-001, CTR-COM-001, CTR-IOX-001, CTR-UX-001]
user_stories:
  - As a cycle participant, I confirm one exact revision of a proposal and my signature is bound to that revision so a later edit cannot reuse it.
  - As a buyer, I can look at a stored consent and see who signed what wording on which revision, and whether the signature verifies.
  - As a signer, I can withdraw a consent before the owning module commits, and the withdrawal is itself signed and visible.
  - As a counterparty, my device rejects a consent statement signed by someone who is not a party to the subject.
  - As a participant, if the other side tells me and a third party different things, both of our devices see the contradiction and the coordination freezes.
edge_cases:
  - Subject is revised after the consent was signed; the stored hash no longer equals the current revision hash, so verify returns stale and the owning module asks again.
  - Signer signs consent on device A, then device A is revoked; validity is decided by first-seen time, which is provenance.verifiedAt recorded at the first successful verification in this vault and kept through export and import, never signedAtClaim; statements first seen before revocationEffectiveFrom stay valid, statements first seen after it are rejected, vaults may disagree, and owning modules treat a peer-reported invalidity as conflicted.
  - Two devices of one signer sign the same consent; both verify, every vault keeps the lexicographically lowest cid as the record and stores the other as an alias, so a revocation or reference resolves the same way everywhere.
  - Consent statement arrives before the subject revision it refers to; it waits in quarantine for up to 7 days for the subject and then is erased as unverifiable.
  - Signer's clock is wrong by a day; signedAtClaim outside the plus or minus 24 hour window from the receiver clock is accepted but flagged clockSuspect and never used to order consent against revocation.
  - A consent and a decline from the same signer exist for one subject hash; verify returns conflicted and owning modules freeze instead of picking the later one.
  - Statement key unknown or retired; signing is refused, stored consents with retired keys remain verifiable with the stored text hash, and an inbound statement with a wording version this app does not know yet is quarantined until the registry updates instead of being rejected.
  - A revocation arrives after vault A committed and before vault B committed; both store it, A's verify returns conflicted and A's owning module freezes for renegotiation, B's verify returns revoked.
  - A signer sends a consent to A and a decline to B; owning modules echo every received consent statement to all participants before commit, so both vaults hold both and verify returns conflicted in each.
  - A signer revokes a consent and later consents again to the same revision; the revoked record leaves the dedupe key, so the new consent is a new valid record.
ux:
  screens:
    - "Confirm sheet: shows the subject summary, revision number and short hash, the full statement wording for the statement key in the signer's locale, a checkbox I have read this, and a Sign button."
    - "Consent detail: signer pseudonym, key fingerprint, subject revision hash, statement wording version and locale, signed time claim, first seen time, verification result with key freshness, provenance, aliases."
    - "Revoke sheet: explains that revocation is signed and visible, that it does not undo a commitment already made, and that after the other party committed it freezes the coordination instead."
  states: [loading, ready-to-sign, signing, signed, verified, stale, revoked, conflicted, quarantined, offline-queued]
  a11y:
    - The statement wording is real text in the accessibility tree and the Sign button is disabled until the I have read this checkbox is checked.
    - Verification result is announced as text such as Signature valid for revision 3, not only by icon.
    - Sign and Revoke are buttons of at least 44 by 44 px with accessible names that include the subject kind.
processes:
  domain_schema:
    requirements:
      - A ConsentStatement stores exactly the signed fields v, type, tenantId, signerDid, signerKeyId, subjectType, subjectRef, subjectRevision, subjectRevisionHash (CTR-ID-001 ID-3 cid form sha256-<base64url>), statementKey, statementLocale, statementTextHash, kind, revokes? and signedAtClaim, plus the signature envelope, provenance with first-seen time and the derived status, with revision per CTR-ID-001.
      - The signed bytes are produced by the F16.S02.M03 envelope with context classrup/consent/v1 - UTF-8 context, a zero byte, the 32-byte signer key-ID digest, a zero byte, then the RFC 8785 JCS bytes of the signed field set - so a consent signature can never validate as another statement type, and the known-answer vectors publish these exact input bytes.
      - ConsentStatements are P2 evidence kept under RET-EVIDENCE, are immutable after storage apart from the derived status, and carry provenance for statements received from other vaults.
      - id is the CTR-ID-001 ID-3 cid of the JCS bytes of the signed fields and signature; among non-revoked records with the same dedupe tuple (signerDid, subjectRef, subjectRevisionHash, statementKey, kind) every vault keeps the lexicographically lowest cid as the record and stores the others as aliases.
    entities:
      - name: ConsentStatement
        schema: classrup.comms.consent/v1
        storage: device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: string — sha256-<base64url> cid (ID-3) of the signed statement, content addressed"
          - "v: int — 1, signed"
          - "type: string — classrup.comms.consent/v1, signed"
          - "tenantId: uuidv7 — tenant scope, signed"
          - "signerDid: did:key — principal that signed; replaced by the deletion pseudonym in the deleting user's own kept evidence"
          - "signerKeyId: string — device Ed25519 key that produced the signature; its digest is bound into the signed bytes"
          - "subjectType: enum — bazaar_offer | bazaar_negotiation | mutiny_proposal | mutiny_cycle | services_booking | rentals_reservation | rentals_deposit | comms_meetup"
          - "subjectRef: uuidv7 — record ID in the owning module"
          - "subjectRevision: int — revision of the subject at signing"
          - "subjectRevisionHash: string — sha256-<base64url> cid (ID-3) of ConsentSubjectPort.canonicalBytes of the subject at that revision"
          - "statementKey: string — registry key consent.<slug>.<subject>.<action>.v1 such as consent.mutiny.cycle.commit.v1; lowercase dotted, ≤ 80 chars"
          - "statementLocale: string — BCP 47 locale of the wording shown to the signer, signed"
          - "statementTextHash: string — SHA-256 lowercase hex (64 chars) of the exact wording shown in statementLocale"
          - "signedAtClaim: timestamp — signer clock, RFC 3339 UTC, a claim"
          - "kind: enum — consent | decline | revocation"
          - "revokes?: object — revocation only: { consentId } or the dedupe tuple { subjectRef, subjectRevisionHash, statementKey }"
          - "envelope: object — classrup.security.envelope/v1 { context: classrup/consent/v1, signerKeyId, alg: ed25519, signedAt, payloadHash, sig (64 bytes base64url) }"
          - "status: enum — quarantined | valid | revoked | erased; decline and revocation records are valid once verified and are never revoked themselves"
          - "aliasOf?: string — set on a duplicate: cid of the kept record of the same dedupe tuple"
          - "quarantineReason?: enum — subject_missing | key_missing | wording_unknown | signature_invalid | role_mismatch"
          - "clockSuspect: boolean — signedAtClaim differs from firstSeenAt by more than 24 h"
          - "provenance: object — { originRelay?, via[], receivedAt, verifiedAt } stored for statements received from others"
          - "firstSeenAt: timestamp — provenance.verifiedAt of the first successful verification in this vault (own signing time for local statements); exported in the signed manifest and kept on import"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - id equals the ID-3 cid, so two statements with equal content are the same record; among non-revoked duplicates of one dedupe tuple the lowest cid is the record and the others have aliasOf set.
          - status valid implies the envelope verified under context classrup/consent/v1 for signerKeyId, F16.S02.M02 reported the key active for signerDid at firstSeenAt, and subjectRevisionHash matched the owning module's ConsentSubjectPort.canonicalBytes.
          - A revocation is stored as its own record with revokes set; the revoked consent rows only have their status changed to revoked, never deleted.
          - At most 20 records per (signerDid, subjectRef) are stored to bound abuse.
          - firstSeenAt is never derived from signedAtClaim and survives export and import unchanged.
          - Field classes are annotated per F10.S02.M02 (DIDs, hashes and keys P2; no subject content is ever stored here).
  validation_rules:
    requirements:
      - Signing validates the subject through its ConsentSubjectPort (current revision, the signer's role, commit state), the wording and the hash before any signature is made.
      - Inbound statements are validated for structure, signature, key status, role and hash before storage as valid.
      - Every violation maps to one stable error code.
      - The commit guard V07 applies only to the local comms.consent.revoke command; inbound revocations are always stored, and verify returns conflicted when the owning module has already committed, so the parties freeze for renegotiation instead of diverging silently.
      - "Validity after a device-key revocation follows one rule: first-seen time is provenance.verifiedAt recorded at the first successful verification, kept through export and import in the signed manifest and never taken from signedAtClaim; a statement first seen after the key's revocationEffectiveFrom is rejected."
      - Each owning module registers a ConsentSubjectPort for its subjectType; signing and verification for a subjectType without a registered port are refused, and the shared conformance suite checks every registered port.
    rules:
      - "V01 | payload has exactly the signed field set, subjectRevisionHash is an ID-3 cid (sha256- plus 43 base64url characters), statementTextHash is 64-char lowercase hex, signature decodes to 64 bytes, statementKey matches the key grammar | VALIDATION_FAILED"
      - "V02 | sign: statementKey exists in the registry, is active for the subjectType, and statementTextHash equals the hash of the registered wording for statementLocale; receive: an unknown key or wording version is quarantined with reason wording_unknown until the registry updates, never rejected | COMMS_CONSENT_STATEMENT_UNKNOWN"
      - "V03 | subject exists in the local vault and subjectRevisionHash equals the ID-3 cid of ConsentSubjectPort.canonicalBytes(subjectRef, subjectRevision) of the owning module | COMMS_CONSENT_SUBJECT_MISMATCH"
      - "V04 | sign: subjectRevision equals ConsentSubjectPort.currentRevision(subjectRef) | COMMS_CONSENT_STALE"
      - "V05 | ConsentSubjectPort.partyRole(subjectRef, signerDid) returns the role the statement key requires (for example participant of the cycle) | FORBIDDEN"
      - "V06 | the envelope verifies through F16.S02.M03 with expected context classrup/consent/v1 and signerKeyId, and F16.S02.M02 security.keyrecord.get_status(signerKeyId, asOfReceiptTime = firstSeenAt) is active for signerDid; freshness unknown is stored valid with a stale-key flag that owning modules can require to be refreshed | COMMS_CONSENT_SIGNATURE_INVALID"
      - "V07 | local comms.consent.revoke only: the target is a valid consent of the local signer (by consentId or dedupe tuple) and ConsentSubjectPort.isCommitted(subjectRef) is false; inbound revocations are never refused by this rule | COMMS_CONSENT_NOT_REVOCABLE"
      - "V08 | receiving vault cap: at most 20 records per (signerDid, subjectRef) and 200 quarantined statements per vault are kept; UX guard in the signer vault: at most 60 signatures per hour | RATE_LIMITED"
      - "V09 | the confirmation flag read is true in the sign request | VALIDATION_FAILED"
      - "V10 | statements from DIDs the local principal blocked are dropped silently (F07.S02.M02 isBlockedEither over local data); a signer blocked by someone else sees no difference | BLOCKED_PARTY"
  workflow_state_machine:
    requirements:
      - Each ConsentStatement follows one machine - quarantined until verified, then valid; a valid consent becomes revoked by a verified revocation of the same signer; revoked and erased are terminal; decline and revocation records take status valid when verified and are never revoked themselves; a re-consent after revocation is a new record.
      - Quarantined statements become valid when the missing subject, key or wording arrives and verification succeeds, or are erased after 7 days.
      - Conflicts between consent and decline, or between a consent and a revocation that arrived after the owning module committed, for one subject hash are reported by verify as conflicted and are never resolved by comparing claimed times.
    machines:
      - entity: ConsentStatement
        initial: quarantined
        terminal: [revoked, erased]
        transitions:
          - "quarantined -> valid | verification passes - local signing self-verifies in the same transaction, inbound statements once subject, key and wording are present | firstSeenAt set; emits comms.consent.signed for local statements or comms.consent.received for inbound ones"
          - "quarantined -> erased | 7 days without successful verification, or a definitive signature or role failure | raw statement deleted, counter incremented"
          - "valid -> revoked | verified revocation of the same signer targeting this consentId or its dedupe tuple | revocation record linked; emits comms.consent.revoked (afterCommit true when the owning module had committed)"
    timeouts:
      - "Quarantined inbound statements are retried on every new statement, key or registry arrival and erased 7 days after first receipt."
  commands_queries_events:
    requirements:
      - The vault commands sign and revoke produce signed statements and are called by owning modules or the UI; accept is a vault command invoked by the transport layer for inbound statements.
      - Each command emits its event in the same IndexedDB transaction as the stored record (CTR-EVT-001 EVT-8).
      - "Verify and list are pure vault queries with no side effects; verify resolves by the dedupe tuple and its result for consent plus revocation is defined in one table - valid (verified consent, no stored decline or revocation), stale (subjectRevisionHash differs from the current revision), revoked (revocation stored while the subject is not committed), conflicted (consent and decline, a revocation stored after the owning module committed, or a peer-reported invalidity), missing (no record)."
      - "Statements are registered with F11.S01.M01 (N2): classrup.comms.consent/v1 with kind consent, decline or revocation, signer role = the role the statement key requires per ConsentSubjectPort.partyRole, signed through F16.S02.M03 with context classrup/consent/v1; owning modules echo every received consent statement to all participants before they commit."
      - The module registers ExportSectionPort (section comms.consents, including firstSeenAt in the signed manifest), DeletionPort (plan, execute, pseudonymize - kept consents get signerDid replaced by the deletion pseudonym when keepEvidence is true and are purged otherwise) and RetentionPurgePort (RET-EVIDENCE) with F10 (N6).
    commands:
      - name: comms.consent.sign
        capability: comms.consent.sign
        input: "[vault command; produces signed statement classrup.comms.consent/v1 through F16.S02.M03] { subjectType, subjectRef, subjectRevision, subjectRevisionHash (ID-3 cid), statementKey, statementLocale, statementTextHash, kind: consent|decline, readConfirmed: true }"
        output: "{ consentId, signedAtClaim, firstSeenAt, revision: 1, statement }"
        errors: [VALIDATION_FAILED, NOT_FOUND, FORBIDDEN, COMMS_CONSENT_STATEMENT_UNKNOWN, COMMS_CONSENT_SUBJECT_MISMATCH, COMMS_CONSENT_STALE, RATE_LIMITED]
        emits: [comms.consent.signed]
        idempotent: true
      - name: comms.consent.revoke
        capability: comms.consent.revoke
        input: "[vault command; produces signed statement classrup.comms.consent/v1 with kind revocation] { target: { consentId } | { subjectRef, subjectRevisionHash, statementKey }, expectedRevision }"
        output: "{ revocationId, revokedIds[], revision }"
        errors: [NOT_FOUND, FORBIDDEN, CONFLICT_REVISION, CONFLICT_STATE, COMMS_CONSENT_NOT_REVOCABLE]
        emits: [comms.consent.revoked]
        idempotent: true
      - name: comms.consent.accept
        capability: comms.consent.accept
        input: "[vault command, internal; verifies a signed statement received from another party] { statement, provenance }"
        output: "{ consentId, status: valid|quarantined, aliasOf?, quarantineReason? }"
        errors: [VALIDATION_FAILED, COMMS_CONSENT_SIGNATURE_INVALID, COMMS_CONSENT_SUBJECT_MISMATCH, FORBIDDEN, RATE_LIMITED, BLOCKED_PARTY]
        emits: [comms.consent.received, comms.consent.revoked]
        idempotent: true
    queries:
      - name: comms.consent.verify
        capability: comms.consent.verify
        input: "[vault query, pure] { subjectType, subjectRef, subjectRevisionHash, signerDid, statementKey }"
        output: "{ result: valid|stale|revoked|conflicted|missing, consentId?, aliasIds[], signedAtClaim?, firstSeenAt?, clockSuspect?, keyFreshness: fresh|stale|unknown, conflictReason?: decline|revoked_after_commit|peer_reported }"
        errors: [VALIDATION_FAILED]
      - name: comms.consent.list_for_subject
        capability: comms.consent.read
        input: "[vault query] { subjectType, subjectRef, limit ≤ 100 }"
        output: "{ items: ConsentStatement[] including aliases }"
        errors: [NOT_FOUND]
    events_produced:
      - {type: comms.consent.signed, privacy: P2, payload: "{ consentId, signerDid, subjectType, subjectRef, subjectRevision, subjectRevisionHash, statementKey, statementLocale, kind, revokes? }"}
      - {type: comms.consent.revoked, privacy: P2, payload: "{ revocationId, revokedIds[], signerDid, subjectType, subjectRef, subjectRevisionHash, statementKey, afterCommit, origin: local|federated }"}
      - {type: comms.consent.received, privacy: P2, payload: "{ consentId, signerDid, subjectType, subjectRef, subjectRevision, subjectRevisionHash, statementKey, kind, aliasOf?, firstSeenAt, provenance }"}
    events_consumed:
      - {type: security.key.registered, effect: "add the key for ownerPrincipal to the verifier key set and re-verify quarantined statements waiting for it (reason key_missing)"}
      - {type: security.key.revoked, effect: "record revocationEffectiveFrom for keyId of ownerPrincipal; statements by that key first seen after it are rejected, statements first seen earlier stay valid"}
      - {type: identity.device_key.added, effect: "own account only: add the new own device to the local signer's device list shown on the consent detail"}
      - {type: identity.device_key.revoked, effect: "own account only: stop offering the revoked own device for signing"}
      - {type: privacy.deletion.completed, effect: "replace remaining references to the deleted principal by the payload pseudonym in consents kept as evidence (keepEvidence true); evidence copies in other vaults remain"}
    errors:
      - "COMMS_CONSENT_STATEMENT_UNKNOWN | 422 | no | statement key is not in the registry or its text hash does not match the wording for the locale"
      - "COMMS_CONSENT_SUBJECT_MISMATCH | 409 | no | subject revision hash does not match the canonical bytes of the subject"
      - "COMMS_CONSENT_STALE | 409 | no | subject has a newer revision than the one being signed"
      - "COMMS_CONSENT_SIGNATURE_INVALID | 422 | no | signature does not verify under classrup/consent/v1 or the signing key is not active for the signer at first-seen time"
      - "COMMS_CONSENT_NOT_REVOCABLE | 409 | no | consent is already revoked or the owning module has committed the subject"
    example: |
      vault command comms.consent.sign
      { "subjectType": "mutiny_cycle", "subjectRef": "0192f3a4-5b6c-7d8e-9f01-23456789abcd", "subjectRevision": 3,
        "subjectRevisionHash": "sha256-n4bQgYhMfWWaL-qgxVrQFaO_TxsrC4Is0V1sFbDwCgg",
        "statementKey": "consent.mutiny.cycle.commit.v1", "statementLocale": "en",
        "statementTextHash": "2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae",
        "kind": "consent", "readConfirmed": true }
      -> { "consentId": "sha256-OnvT4jYKPSnupDb8-35ExzXRF8QtHBg1QgtrmULdTxs", "signedAtClaim": "2026-11-04T10:00:00.000Z", "firstSeenAt": "2026-11-04T10:00:00.000Z", "revision": 1 }
      signed bytes = "classrup/consent/v1" 0x00 keyIdDigest(32 bytes) 0x00 JCS(signed fields)
      vault query comms.consent.verify  { "subjectType": "mutiny_cycle", "subjectRef": "…", "subjectRevisionHash": "sha256-n4bQ…", "signerDid": "did:key:z6Mk…", "statementKey": "consent.mutiny.cycle.commit.v1" }
      -> { "result": "valid", "consentId": "sha256-OnvT…", "aliasIds": [], "keyFreshness": "fresh" }
  authorization_capabilities:
    requirements:
      - Vault policy lets only the unlocked local principal sign or revoke, and only as a party of the subject; the private key never leaves the device or the platform key store.
      - Inbound statements are accepted only when signed by a key that F16.S02.M02 reports active for the signer at first-seen time and the signer holds the role required by the statement key in the subject; others are quarantined with a reason.
      - Verify and list are local reads with no network access; relays hold no consent data except as opaque encrypted envelopes and cannot create or alter a consent.
    capabilities:
      - "comms.consent.sign | local principal | vault policy; party of the subject with the role required by the statement key (ConsentSubjectPort.partyRole); readConfirmed true"
      - "comms.consent.revoke | local principal | the targeted consents are signed by the local principal; subject not committed (ConsentSubjectPort.isCommitted false)"
      - "comms.consent.accept | local principal | internal; invoked by the transport layer; statement verified before storage"
      - "comms.consent.verify | local principal | any local module; pure read"
      - "comms.consent.read | local principal | party of the subject"
  failure_recovery_idempotency:
    requirements:
      - Signing is idempotent on the content address, so signing the same payload again returns the stored statement unchanged.
      - Inbound acceptance is idempotent on cid and order-insensitive with subject, key and wording arrival.
      - There is no distributed lock; conflicting statements are stored side by side, flagged conflicted, and handled by explicit renegotiation in the owning module.
      - Duplicate resolution is deterministic - every vault keeps the lowest cid of a dedupe tuple and stores the others as aliases, and a revocation that targets the tuple revokes every matching cid - so references and revocations resolve the same way in every vault.
    idempotency: "Statement id is the cid, so duplicates collapse; the dedupe key (signerDid, subjectRef, subjectRevisionHash, statementKey, kind) is evaluated over non-revoked records only, so a re-consent after revocation is a new valid record; signing the same payload with a different signedAtClaim inside the dedupe key returns the stored record; inbound duplicates keep the lowest cid as record and the others as aliases."
    concurrency: "Each command runs in one IndexedDB transaction; revoke uses expectedRevision on the consent row; a consent and a revocation racing from two devices of one signer both store, and because the revocation targets the dedupe tuple and revocation is monotonic, verify returns revoked (or conflicted after commit) in every vault regardless of arrival order."
    retries: "Delivery of the signed statement to other parties uses F11.S02.M01 on the F15.S01.M01 outbox with states prepared, transport acknowledged and peer accepted (signed acknowledgement by the counterparty vault) and its timers (CTR-IDM-001 IDM-4 backoff base 500 ms, cap 30 s, 6 attempts; unsent entries expire 7 days after creation, transport_acknowledged entries 30 days after the relay receipt)."
    offline: "Signing, revoking and verifying work fully offline; the UI shows signed on this device until the peer acknowledgement arrives and never claims the counterparty has seen it."
    partial_failure: "If the process stops between signing and storing, nothing is stored and no event is emitted; if delivery fails the record stays and the outbox entry shows failed or expired with resend; quarantined inbound statements never produce a valid state until verification passes."
  privacy_retention_abuse:
    requirements:
      - Consents are P2 evidence; they contain DIDs, hashes and wording keys, never the subject content, so sending them reveals only that a key holder agreed to a hash.
      - Retention is RET-EVIDENCE (2 years after last related activity) and deletion of a vault does not delete copies held by counterparties, which the UI states before signing.
      - Pseudonymity is not anonymity because the signer DID is linkable across statements, and the sign sheet says so.
      - "Privacy duties (N6): fields are classified per F10.S02.M02, ExportSectionPort, DeletionPort and RetentionPurgePort are registered, and on principal deletion kept consents are pseudonymized (signerDid replaced by the deletion pseudonym) instead of erased, unless the user chose not to keep evidence."
    data:
      - "ConsentStatement: P2, visible to parties of the subject and the signer."
      - "Statement key registry and wording texts: P0, shipped with the app and versioned per locale."
    retention:
      - "Consent statements: RET-EVIDENCE; legal hold per F10.S01.M02 prevents purge; pseudonymized, not erased, on the signer's own account deletion with keepEvidence."
      - "Quarantined inbound statements: erased after 7 days."
    threats:
      - "T01 | Replay of a consent on a modified subject | signature covers the exact ID-3 cid of the revision; a changed subject has a different hash so verify returns stale"
      - "T02 | Cross-protocol signature reuse | F16.S02.M03 envelope with context classrup/consent/v1 and the signer key-ID digest inside the signed bytes; login and other signatures use different registered contexts"
      - "T03 | Forged consent by non-party | role check through ConsentSubjectPort.partyRole and key status check through F16.S02.M02; failure quarantines"
      - "T04 | Backdated signing time to win an ordering dispute | signedAtClaim is only a claim; ordering between consent and revocation is never decided by it and relay receipt time is evidence of the relay clock only"
      - "T05 | Coerced or accidental signature | explicit read confirmation, wording displayed with the exact revision, revocation available until commit, and the UI explains that consent is not delivery or payment"
      - "T06 | Compromised device signs consents, possibly backdated | validity uses first-seen time recorded by the verifier, never signedAtClaim; statements first seen after revocationEffectiveFrom are rejected; consents first seen before revocation stay valid, which is disclosed"
      - "T07 | Signer equivocation - different statements to different parties | owning modules echo every received consent statement to all participants before commit; each vault then holds consent and decline and verify returns conflicted"
      - "T08 | Duplicate divergence - vaults keep different duplicates so a revocation misses | lowest-cid rule in every vault and revocations that target the dedupe tuple"
    abuse_controls:
      - "Receiver caps of 20 records per signer and subject and 200 quarantined statements per vault bound spam and DoS; the 60 signatures per hour limit in the signer vault is a UX guard."
      - "Inbound statements from DIDs the local principal blocked are dropped silently; others from unknown signers wait in quarantine."
  observability_performance:
    requirements:
      - The PWA keeps local diagnostics only (OBS-7) with counters for signed, accepted, quarantined and rejected statements, and no statement content is logged.
      - Signing including canonicalization meets a vault budget of p95 ≤ 100 ms and verification p95 ≤ 20 ms on a mid-range phone.
      - Verification of 1 000 stored statements completes within 5 s.
    metrics:
      - "classrup_comms_consents_total{outcome=signed|accepted|quarantined|rejected|revoked|aliased} (local diagnostics)"
      - "classrup_comms_consent_verify_ms (histogram, local diagnostics)"
    logs:
      - "local info consent.signed {consentId, subjectType} — no wording and no subject content."
      - "local warn consent.rejected {code, subjectType}."
    budgets:
      - "sign p95 ≤ 100 ms; verify p95 ≤ 20 ms; accept p95 ≤ 50 ms."
      - "Batch verification of 1 000 statements ≤ 5 s."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Contract tests verify signed statements, command inputs and outputs and events against the schema registry, using fixed known-answer vectors for JCS and Ed25519 under the classrup/consent/v1 envelope.
      - Owning modules reuse a shared conformance suite that exercises sign and verify against their own ConsentSubjectPort.
      - Screens meet CTR-UX-001 (WCAG 2.2 AA, 44 px targets, explicit async states, polite announcements) and the a11y items listed for this module.
    fixtures: "Vaults P1, P2, P3 with Ed25519 device keys from fixed seeds (P1 with two devices), mutiny cycle subject at revisions 1..3 with a stub ConsentSubjectPort, statement key registry with consent.mutiny.cycle.commit.v1 and consent.comms.meetup.agree.v1 in en and de, fixed clock 2026-11-04T10:00:00Z, RFC 8785 test vectors, published KAT input bytes."
    tests:
      - "T01 | unit | 01.R01,01.R02,02.R01 | sign consent for cycle revision 3 and recompute the bytes independently as classrup/consent/v1, zero byte, key-ID digest, zero byte, JCS of the signed field set | signature equals the regenerated known-answer vector, the published input bytes match, and the statement verifies; payload has exactly the listed fields"
      - "T02 | unit | 02.R02,02.R03 | each rule V01 to V10 violated in turn | documented error code returned and nothing stored as valid"
      - "T03 | property | 01.R03,03.R01 | random sequences of sign, revoke, accept, subject revisions | revoked never returns to valid; id equals cid; verify result depends only on stored statements"
      - "T04 | unit | 01.R02,07.R01 | cross-protocol attempt using a login challenge signature as a consent and a consent signature as a login proof | both rejected by the F16.S02.M03 context check"
      - "T05 | integration | 03.R02,03.R03 | consent arrives before subject; later subject arrives; and a decline plus consent by one signer | first becomes valid after subject; second returns verify conflicted and neither wins by claimed time"
      - "T06 | contract | 04.R01,04.R02,04.R03,09.R02 | each command and query executes | outputs, statements and event payloads validate against registry schemas; verify results follow the single result table"
      - "T07 | abuse | 05.R01,05.R02,05.R03 | non-party signs; statement signed by a key F16.S02.M02 does not list for the signer; relay tries to store or alter a consent | FORBIDDEN or quarantine; relay holds only encrypted envelopes"
      - "T08 | integration | 06.R01,06.R02,06.R03 | sign twice, accept the same statement five times in shuffled order with subject arriving late | one record, one event per origin, same verify result"
      - "T09 | integration | 06.R04,01.R04 | P1 signs the same consent on both devices; P2 and P3 receive the two copies in opposite orders; P1 then revokes by dedupe tuple | P2 and P3 both keep the lowest cid with the other as alias; the revocation revokes both cids in both vaults"
      - "T10 | abuse | 07.R01,07.R02,07.R03 | clock claim 3 days off; 21st statement on one subject; inspect exported records | clockSuspect true, RATE_LIMITED, no subject content in any record"
      - "T11 | load | 08.R01,08.R02,08.R03 | sign 200 statements and verify 1 000 | budgets met"
      - "T12 | unit | 09.R01,09.R03 | traceability tool run and shared conformance suite for the bazaar, mutiny, services, rentals and meetup ConsentSubjectPorts | every PS-062 requirement maps to a passing test and every registered port passes"
      - "T13 | integration | 10.R01,10.R02,10.R03 | export, import into fresh vault, restore from backup | statements round trip byte identical with firstSeenAt from the signed manifest and re-verify; tampered file entries are rejected"
      - "T14 | a11y | 09.R04 | confirm sheet with screen reader and keyboard | wording readable, Sign disabled until confirmation, verification result announced, targets ≥ 44 px, zero serious axe issues"
      - "T15 | integration | 02.R04,03.R03 | three vaults: P2 revokes after P1's owning module committed and before P3's committed | P1 stores it and verify returns conflicted so its module freezes; P3 verify returns revoked; a local revoke on the committed subject is refused with COMMS_CONSENT_NOT_REVOCABLE"
      - "T16 | abuse | 04.R04 | P1 sends a consent to P2 and a decline to P3; the owning modules echo received statements to all participants before commit | both P2 and P3 hold both statements and verify returns conflicted in each"
      - "T17 | integration | 02.R05,10.R02 | key K of P1 revoked; a statement by K backdated before the revocation reaches P2 afterwards; P2 exports and re-imports after the revocation | the backdated statement is rejected; consents first seen before the revocation stay valid after import because firstSeenAt is restored from the manifest"
      - "T18 | integration | 04.R05,07.R04 | P1 deletes the account with keepEvidence true, then repeated with false | kept consents carry the pseudonym instead of signerDid; with false they are purged; copies in P2 unchanged"
      - "T19 | unit | 02.R06 | sign and verify for a subjectType without a registered ConsentSubjectPort; port reports isCommitted true; partyRole returns none | refused with VALIDATION_FAILED; local revoke refused; FORBIDDEN"
      - "T20 | unit | 02.R02 | inbound statement with a wording version newer than the registry, then the registry updates | quarantined with wording_unknown, then valid without being re-sent"
      - "T21 | integration | 03.R01 | P1 consents, revokes and consents again to the same revision | the second consent is a new valid record; verify returns valid"
      - "T22 | unit | 07.R03,07.R02 | render the sign sheet in en and de | text states that pseudonymity is not anonymity, that consent evidences assertion not delivery or payment, and that copies held by counterparties are not deleted with the vault"
    acceptance:
      - All tests T01 to T22 pass in CI.
      - Known-answer vectors for JCS bytes and Ed25519 signatures under classrup/consent/v1 pass on all supported browsers and Node, and the vector input bytes are published.
      - No code path orders consent against revocation or decline by claimed time.
      - The sign sheet states that consent evidences assertion, not delivery or payment, and that pseudonymity is not anonymity.
  import_export_backup_rollback:
    requirements:
      - A user's vault export contains all consent statements they signed or received with provenance and first-seen time.
      - Import re-verifies every statement against keys and subjects present in the target vault using the firstSeenAt carried in the signed export manifest, never the import time, and quarantines those that cannot be verified.
      - Schema changes follow expand and contract; the signed payload field set is frozen in v1 and any change creates classrup.comms.consent/v2 with v1 readable for 180 days.
    export: "Section comms.consents in classrup-export/v1, registered through ExportSectionPort; one JSON line per ConsentStatement (schema classrup.comms.consent/v1) including the full signed envelope, aliases, provenance and firstSeenAt covered by the signed manifest."
    import: "Each statement is re-verified with its exported firstSeenAt; existing cids are skipped; duplicates are re-resolved by the lowest-cid rule; statements failing verification are quarantined with a reason and never marked valid; statements are never re-signed."
    backup: "The vault export is the backup (IOX-6); relays hold no consent data."
    migration_rollback: "The signed payload is never migrated in place; new versions are new schemas; rollback is safe because v1 statements remain valid and unknown future kinds are stored quarantined."
