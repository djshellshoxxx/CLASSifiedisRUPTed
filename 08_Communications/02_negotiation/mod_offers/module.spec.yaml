id: F08.S02.M01
scope: MVP
summary: >-
  Structured offer and proposal cards inside conversation threads. A card is a signed reference to a record owned
  by another module (a bazaar offer, a negotiation counter, or a mutiny proposal revision) pinned to its exact
  revision hash; it is a view, never the canonical record. The sender's vault posts the card as an encrypted
  message item, the receiving vault verifies the signed reference against the referenced statement it already
  holds, renders live state derived from local events, and marks the card superseded or closed when the owning
  module reports a newer revision or a terminal state. Cards carry no money movement and no consent; accepting
  happens in the owning module and consent in F08.S02.M02.
responsibilities:
  - Own the ThreadOfferCard record (kind, reference ID, pinned revision hash, thread, poster) inside the vault.
  - Post a card into a thread as a signed statement carried by an end-to-end encrypted message of F08.S01.M01.
  - Verify inbound cards against the referenced statement and the poster's role in it; show unverifiable cards as unverified references with the reason.
  - Keep each card's displayed state in step with the owning module's local events and mark older cards superseded when a newer revision of the same reference is posted.
  - Never copy amounts, items or terms into the card beyond a display snapshot of at most 280 characters tagged as a snapshot.
non_responsibilities:
  - Creating, accepting, rejecting or expiring offers (F01.S04.M01) and counters (F01.S04.M02).
  - Creating, revising or accepting proposals and cycles (F02).
  - Signed consent on an exact revision (F08.S02.M02).
  - Message transport and encryption (F08.S01.M01) and thread membership (F08.S01.M02).
  - "Future: cards for service quotes (F03), rental reservations (F05), and auction bids hosted on a relay (F04)."
depends_on: [F08.S01.M01, F08.S01.M02, F01.S04.M01, F02.S01.M01, CTR-FED-001, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-PRV-001, CTR-IDM-001, CTR-OBS-001]
user_stories:
  - As a buyer, I can attach my offer to the conversation so the seller sees it as a card with the amount, status and an Open offer button.
  - As a seller, I see that a card is outdated when the buyer changed the offer, and I am pointed to the newest card.
  - As a cycle participant, I can post the proposal revision I am discussing and others see the exact revision it points to.
  - As a recipient, I see a clear notice when a card refers to a record my device cannot verify.
edge_cases:
  - Card references an offer revision the receiving vault has not received yet; the card shows waiting for record and retries when the statement arrives, for up to 7 days, then shows unverified.
  - Poster is not a party to the referenced offer or proposal; the card is quarantined as unverified and no state is shown.
  - Same offer posted twice into one thread; the second card supersedes the first when its revision is newer, otherwise it is ignored as a duplicate.
  - Referenced offer is accepted on another device while the card is open; the card turns closed (accepted) after the local event arrives and offers no action buttons.
  - The pinned revision hash does not match the statement the vault holds for that revision; the card shows revision mismatch and is not actionable.
  - The thread is archived; cards become read-only and keep their last verified state.
ux:
  screens:
    - "Thread card: kind label (Offer, Counter, Proposal), snapshot line marked as snapshot at posting time, live status chip, Open record button."
    - "Post card sheet: picker listing the user's open offers or proposals involved in this thread, preview, Post button."
    - "Unverified card state: explanation and a Copy reference button; no action buttons."
  states: [loading, empty, waiting-for-record, posted, superseded, closed, unverified, offline]
  a11y:
    - Each card is a landmark region with an accessible name made of kind, counterparty pseudonym and status.
    - Status changes are announced in an aria-live polite region and never conveyed by color alone.
    - The Open record button has an accessible name including the kind and is at least 44 by 44 px.
processes:
  domain_schema:
    requirements:
      - A ThreadOfferCard stores the thread, kind, referenced record ID, pinned revision hash, poster DID, a display snapshot, and a derived display state, with tenant and revision per CTR-ID-001.
      - The card is a P2 view held only in vaults; it carries a reference and a snapshot of at most 280 characters, never the canonical amounts or terms, and the owning module stays the single source of truth.
      - The pinned revision hash is the SHA-256 of the JCS bytes of the referenced statement revision and is immutable after posting.
    entities:
      - name: ThreadOfferCard
        schema: classrup.comms.offer_card/v1
        storage: device
        privacy: P2
        retention: RET-STANDARD
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope"
          - "threadId: uuidv7 — ref F08.S01.M02 Thread; must be active at posting"
          - "kind: enum — bazaar_offer | bazaar_counter | mutiny_proposal"
          - "refId: uuidv7 — record ID in the owning module (offer, negotiation or proposal)"
          - "refRevision: int — revision of the referenced record at posting"
          - "refRevisionHash: string — SHA-256 hex of JCS bytes of the referenced statement revision"
          - "posterDid: did:key — signer of the card statement, must be a party in the referenced record"
          - "snapshot?: string — display text ≤ 280 code points, plain text, labelled snapshot"
          - "displayState: enum — waiting | posted | superseded | closed | unverified"
          - "closedReason?: enum — accepted | rejected | withdrawn | expired | declined | cancelled"
          - "statementCid: string — sha256 cid of the signed card statement"
          - "postedAtClaim: timestamp — poster clock, a claim"
          - "receivedAt?: timestamp — local clock for inbound cards"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - At most one card per (threadId, refId, refRevision); a newer refRevision posted in the same thread moves older cards of the same refId to superseded.
          - displayState posted or closed implies refRevisionHash matched the locally held statement and posterDid is a party of that record.
          - A card never changes the state of the referenced record; only owning-module events change displayState.
  validation_rules:
    requirements:
      - Posting validates the thread, the poster's party role and the referenced revision before the card statement is signed.
      - Inbound cards are validated for signature, role and hash match before display state posted is assigned.
      - Every violation maps to one stable error code.
    rules:
      - "V01 | kind is in the enum and refId resolves to a record the local vault holds with a verified owning-module statement | NOT_FOUND"
      - "V02 | poster is a party of the referenced record (buyer or seller of the offer, participant of the proposal) | FORBIDDEN"
      - "V03 | refRevisionHash equals SHA-256 of the JCS bytes of the held revision refRevision | COMMS_CARD_REVISION_MISMATCH"
      - "V04 | the referenced record is not in a terminal state at posting | CONFLICT_STATE"
      - "V05 | thread is active and the poster is a participant; all parties of the record are participants of the thread | VALIDATION_FAILED"
      - "V06 | snapshot is at most 280 code points of plain text | VALIDATION_FAILED"
      - "V07 | a vault posts at most 20 cards per thread per day | RATE_LIMITED"
      - "V08 | inbound card statement signature verifies against a device key of posterDid | COMMS_CARD_SIGNATURE_INVALID"
  workflow_state_machine:
    requirements:
      - A card is created waiting or posted and moves to superseded, closed or unverified; superseded, closed and unverified are terminal for display.
      - Closing follows only verified terminal events of the owning module and never the card poster's own claim.
      - A waiting card that gets no matching record within 7 days becomes unverified and is not retried automatically.
    machines:
      - entity: ThreadOfferCard
        initial: waiting
        terminal: [superseded, closed, unverified]
        transitions:
          - "waiting -> posted | referenced statement arrives and hash, signature and role verify | emits comms.offer_card.posted for inbound cards"
          - "waiting -> unverified | 7 days without matching record or verification failure | reason stored"
          - "posted -> superseded | newer card for same refId in the thread, or owning module reports newer revision | links to newer card"
          - "posted -> closed | owning module event with terminal state (accepted, rejected, withdrawn, expired, declined, cancelled) | closedReason stored"
    timeouts:
      - "Waiting cards are re-verified when new statements arrive and expire to unverified after 7 days."
  commands_queries_events:
    requirements:
      - Posting is a vault command that produces a signed statement and delegates delivery to comms.message.send as a typed item; reading is a vault query.
      - Posting emits comms.offer_card.posted in the same IndexedDB transaction as the local card record, and inbound verification emits the same event with actor kind federated.
      - The module consumes owning-module events derived from verified statements to update card state.
    commands:
      - name: comms.offer_card.post
        capability: comms.offer_card.post
        input: "[vault command; produces signed statement classrup.comms.offer_card/v1] { threadId, kind, refId, refRevision, snapshot? }"
        output: "{ cardId, revision: 1, displayState: posted }"
        errors: [VALIDATION_FAILED, NOT_FOUND, FORBIDDEN, CONFLICT_STATE, COMMS_CARD_REVISION_MISMATCH, RATE_LIMITED]
        emits: [comms.offer_card.posted]
        idempotent: true
    queries:
      - name: comms.offer_card.list_thread
        capability: comms.offer_card.read
        input: "[vault query] { threadId, includeClosed?: boolean, limit ≤ 50 }"
        output: "{ items: ThreadOfferCard[] with live displayState }"
        errors: [NOT_FOUND]
    events_produced:
      - {type: comms.offer_card.posted, privacy: P2, payload: "{ cardId, threadId, kind, refId, refRevision, posterDid, origin: local|federated }"}
    events_consumed:
      - {type: bazaar.offer.accepted, effect: "close cards referencing the offer with reason accepted"}
      - {type: bazaar.offer.rejected, effect: "close cards referencing the offer with reason rejected"}
      - {type: bazaar.offer.withdrawn, effect: "close cards referencing the offer with reason withdrawn"}
      - {type: bazaar.offer.expired, effect: "close cards referencing the offer with reason expired"}
      - {type: bazaar.negotiation.countered, effect: "mark the offer card superseded and offer posting a counter card"}
      - {type: bazaar.negotiation.closed, effect: "close counter cards with the negotiation outcome reason"}
      - {type: mutiny.proposal.revised, effect: "mark cards for earlier revisions of the proposal superseded"}
      - {type: mutiny.proposal.accepted, effect: "close proposal cards with reason accepted"}
      - {type: mutiny.proposal.rejected, effect: "close proposal cards with reason rejected"}
      - {type: mutiny.proposal.expired, effect: "close proposal cards with reason expired"}
      - {type: comms.thread.archived, effect: "freeze cards of the thread read-only"}
    errors:
      - "COMMS_CARD_REVISION_MISMATCH | 409 | no | pinned revision hash differs from the revision held locally"
      - "COMMS_CARD_SIGNATURE_INVALID | 422 | no | inbound card statement signature or signer role is invalid; card stored unverified"
    example: |
      vault command comms.offer_card.post
      { "threadId": "0192f3a4-0000-7000-8000-0000000000aa", "kind": "bazaar_offer", "refId": "0192f3a5-1111-7000-8000-000000000001", "refRevision": 1 }
      -> { "cardId": "0192f3a6-2222-7000-8000-000000000001", "revision": 1, "displayState": "posted" }
  authorization_capabilities:
    requirements:
      - Vault policy lets only the unlocked local principal post cards, and only for records where it is a party and in threads where it participates.
      - Inbound cards are accepted only when signed by a key of a party of the referenced record; other signers lead to the unverified state.
      - Cards have no relay-side resource; relays only carry the encrypted message and hold no card data.
    capabilities:
      - "comms.offer_card.post | local principal | vault policy; party of the referenced record; participant(thread); thread active"
      - "comms.offer_card.read | local principal | participant(thread)"
  failure_recovery_idempotency:
    requirements:
      - Posting is idempotent on (threadId, refId, refRevision) so a retry returns the existing card.
      - Inbound cards are deduplicated on statement cid and reprocessed safely when the referenced statement arrives later.
      - The card record and its signed statement are written in one IndexedDB transaction; delivery follows the message sync states of F08.S01.M01.
    idempotency: "Vault command idempotent on (threadId, refId, refRevision); inbound statements deduplicated by cid in the consumer inbox (EVT-3)."
    concurrency: "expectedRevision is not needed because cards are immutable except displayState; displayState updates are monotonic (waiting to posted to superseded or closed) and applied in one transaction per event."
    retries: "Delivery retries are those of the message outbox; verification of waiting cards is retried whenever a new statement of the referenced kind is stored, for up to 7 days."
    offline: "Posting works offline and the card shows saved on this device until the carrying message is transport acknowledged; inbound verification works offline against locally held statements."
    partial_failure: "If message delivery fails the local card stays and shows prepared; if the referenced record disappears locally the card becomes unverified instead of being deleted."
  privacy_retention_abuse:
    requirements:
      - Cards are P2 and travel only inside end-to-end encrypted messages; relays never see card content or amounts.
      - Cards never include P3 data such as exact addresses and never include payment instructions.
      - Spoofed cards are contained by signature and role verification, and unverified cards expose no actions.
    data:
      - "ThreadOfferCard: P2, visible to thread participants; snapshot text limited to 280 characters."
    retention:
      - "Cards follow the thread: RET-STANDARD, purged locally with the thread."
    threats:
      - "T01 | Forged card showing a fake accepted offer | card state derives only from verified owning-module statements; card statement alone never sets closed or accepted"
      - "T02 | Card pinned to one revision but shown as the current deal | revision hash is displayed in the details sheet and superseding cards are marked; actions apply to the live record only"
      - "T03 | Phishing text inside snapshot | snapshot is plain text, links are not rendered as links, max 280 characters"
      - "T04 | Card spam in a thread | 20 cards per thread per day limit and local block"
    abuse_controls:
      - "Recipient can report a card; the report carries the card statement and referenced statement (F12.S01.M01)."
      - "Unverified cards are collapsed by default."
  observability_performance:
    requirements:
      - The PWA keeps local diagnostics only (OBS-7) with counters for posted, verified and unverified cards.
      - Posting and state updates meet the vault budget of p95 ≤ 50 ms on a mid-range phone.
      - Rendering a thread with 50 cards meets p95 ≤ 100 ms.
    metrics:
      - "classrup_comms_cards_total{outcome=posted|verified|unverified|superseded|closed} (local diagnostics)"
      - "classrup_comms_card_waiting_age_ms (gauge, local diagnostics)"
    logs:
      - "local info card.verified {cardId, kind} — no amounts."
      - "local warn card.unverified {cardId, reason}."
    budgets:
      - "post and event update p95 ≤ 50 ms; list_thread 50 cards p95 ≤ 100 ms."
      - "Verification of one inbound card including hash and signature ≤ 20 ms."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Contract tests check command input and output, the signed statement and event payload against the schema registry.
      - Role and hash verification are covered by adversarial fixtures.
    fixtures: "Vaults S (seller) and B (buyer) with thread TH, bazaar offer O revision 1 signed by B and held by both, mutiny proposal P revision 2, fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,01.R03,02.R01 | B posts a card for offer O revision 1 | card stored posted with refRevisionHash equal to SHA-256 of JCS of O revision 1 and snapshot at most 280 characters"
      - "T02 | unit | 02.R02,02.R03 | each rule V01 to V08 violated in turn | documented error code returned and nothing stored"
      - "T03 | property | 03.R01,03.R02 | random sequences of owning-module events and card posts | transitions only as declared; closed and superseded never change; closed only follows verified terminal events"
      - "T04 | integration | 03.R03 | card arrives before its referenced offer statement; statement arrives on day 3, another card never arrives for 7 days | first becomes posted, second becomes unverified"
      - "T05 | contract | 04.R01,04.R02,09.R02 | post and list executes | output, statement and event payload validate against registry schemas"
      - "T06 | integration | 04.R03 | deliver offer accepted, negotiation countered, proposal revised and thread archived events | cards become closed, superseded, superseded and frozen respectively"
      - "T07 | abuse | 05.R01,05.R02,05.R03,09.R03 | stranger posts card for B's offer; card signed by non-party; relay operator inspects stored data | quarantined unverified with no actions; relay holds no card data"
      - "T08 | integration | 06.R01,06.R02,06.R03 | post twice, replay inbound statement three times, and kill the app before message delivery | single card, one event per origin, card remains with prepared delivery state"
      - "T09 | abuse | 07.R01,07.R02,07.R03 | card with link text and address-like snapshot; 21st card in a day | links not rendered, no P3 fields accepted, RATE_LIMITED"
      - "T10 | load | 08.R01,08.R02,08.R03 | thread with 50 cards and 500 events replayed | budgets met"
      - "T11 | unit | 09.R01 | traceability tool run | every PS-063 requirement maps to a passing test"
      - "T12 | integration | 10.R01,10.R02,10.R03 | export, import into fresh vault, restore from backup | cards round trip; cards whose record is missing import as unverified"
      - "T13 | a11y | 04.R01 | thread with all card states on mobile with screen reader | regions named, status announced, zero serious axe issues"
    acceptance:
      - All tests T01 to T13 pass in CI.
      - No card ever shows accepted or closed unless a verified owning-module statement exists locally.
      - A relay database dump after test traffic contains no card or offer data.
  import_export_backup_rollback:
    requirements:
      - A user's vault export contains the cards of their threads including card statements and display state.
      - Import re-verifies card statements and references; cards whose referenced record is missing become unverified read-only history.
      - Schema changes follow expand and contract and keep v1 readable for 180 days; new card kinds are additive enum values.
    export: "Section comms.offer_cards in classrup-export/v1; one line per ThreadOfferCard (schema classrup.comms.offer_card/v1)."
    import: "Signature and hash are re-verified; existing IDs are skipped; displayState is recomputed from locally held owning-module statements."
    backup: "The vault export is the backup (IOX-6); relays hold no card data."
    migration_rollback: "Additive fields and enum values only in v1; older readers show unknown kinds as unverified references; rollback is safe because card state is recomputed on load."
