id: F08.S02.M01
scope: MVP
summary: >-
  Structured offer and proposal cards inside conversation threads. A card is a signed reference to a record owned
  by another module (a bazaar offer, a negotiation counter, or a mutiny proposal revision) pinned to the CTR-ID-001
  ID-3 cid of its exact revision; it is a view, never the canonical record. The sender's vault posts the card as an
  encrypted message item, the receiving vault verifies the signed reference against the referenced statement it
  already holds, and renders amount, items and terms only from that verified pinned revision through the owning
  module's renderer, never from text the poster wrote. Live state is derived from local owning-module events: a
  card is superseded only by a newer card that verified or by an owning-module revision event, closed by a verified
  terminal event, and frozen when the owning module reports a fork. Cards carry no money movement and no consent;
  accepting happens in the owning module and consent in F08.S02.M02.
responsibilities:
  - Own the ThreadOfferCard record (kind, reference ID, pinned revision cid, thread, poster) inside the vault.
  - Post a card into a thread as a signed statement carried by an end-to-end encrypted message of F08.S01.M01.
  - Verify inbound cards against the referenced statement and the poster's role in it; show unverifiable cards as unverified references with the reason.
  - Keep each card's displayed state in step with the owning module's local events; a newer card supersedes older cards of the same reference only after it verified, and withdrawn or forked proposals close or freeze their cards.
  - Render amounts, items and terms only from the verified pinned revision through the owning module's renderer; the poster may add a poster note of at most 280 characters that is labelled as such and never holds money or item fields.
non_responsibilities:
  - Creating, accepting, rejecting or expiring offers (F01.S04.M01) and counters (F01.S04.M02).
  - Creating, revising or accepting proposals and cycles (F02.S01.M01, F02.S01.M04 revisions).
  - Signed consent on an exact revision (F08.S02.M02).
  - Message transport and encryption (F08.S01.M01) and thread membership (F08.S01.M02).
  - Rendering of amounts and items (owning modules provide the renderer for their verified statements).
  - "Future: cards for service quotes (F03), rental reservations (F05), and auction bids hosted on a relay (F04)."
depends_on: [F08.S01.M01, F08.S01.M02, F01.S04.M01, F01.S04.M02, F02.S01.M01, F02.S01.M04, F07.S02.M02, F16.S02.M02, F11.S01.M01, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, CTR-FED-001, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-PRV-001, CTR-IDM-001, CTR-OBS-001, CTR-UX-001]
user_stories:
  - As a buyer, I can attach my offer to the conversation so the seller sees it as a card with the amount from my signed offer, its status and an Open offer button.
  - As a seller, I see that a card is outdated when the buyer changed the offer, and I am pointed to the newest card.
  - As a cycle participant, I can post the proposal revision I am discussing and others see the exact revision it points to.
  - As a recipient, I see a clear notice when a card refers to a record my device cannot verify.
  - As a recipient, I can trust that the amount on a card is the amount in the signed record, whatever the poster typed.
edge_cases:
  - Card references an offer revision the receiving vault has not received yet; the card shows waiting for record and retries when the statement arrives, for up to 7 days, then shows unverified.
  - Poster is not a party to the referenced offer or proposal; the card is quarantined as unverified and no state is shown.
  - Same offer posted twice into one thread; a later card supersedes the earlier one only when it reached posted (verified hash, signature and role) with a newer revision, or the owning module reports a newer revision; an unverifiable higher-revision card leaves the verified card posted.
  - Referenced offer is accepted on another device while the card is open; the card turns closed (accepted) after the local event arrives and offers no action buttons.
  - The pinned revision cid does not match the statement the vault holds for that revision; the card shows revision mismatch and is not actionable.
  - The thread is archived; cards become read-only and keep their last verified state.
  - The poster's note says 50 EUR while the referenced signed offer is 500 EUR; the card shows 500 EUR from the verified offer and the note only under the label poster note.
  - A mutiny proposal is withdrawn or its revision chain forks; the card closes with reason withdrawn, or freezes without actions until the owning module resolves the fork.
ux:
  screens:
    - "Thread card: kind label (Offer, Counter, Proposal), amount and items rendered from the verified pinned revision, optional poster note labelled poster note, live status chip, Open record button."
    - "Post card sheet: picker listing the user's open offers or proposals involved in this thread, preview, optional poster note, Post button."
    - "Unverified card state: explanation and a Copy reference button; no action buttons."
    - "Frozen card state: the owning module reported conflicting revisions; no actions until it is resolved there."
  states: [loading, empty, waiting-for-record, posted, superseded, closed, frozen, unverified, offline]
  a11y:
    - Each card is a landmark region with an accessible name made of kind, counterparty pseudonym and status.
    - Status changes are announced in an aria-live polite region and never conveyed by color alone.
    - The Open record button has an accessible name including the kind and is at least 44 by 44 px.
processes:
  domain_schema:
    requirements:
      - A ThreadOfferCard stores the thread, kind, referenced record ID, pinned revision cid, poster DID, an optional poster note, and a derived display state, with tenant and revision per CTR-ID-001.
      - The card is a P2 view held only in vaults; it carries a reference and an optional poster note of at most 280 characters that never holds money or item fields, amounts, items and terms are rendered in each receiving vault from the verified pinned revision through the owning module's renderer, and the owning module stays the single source of truth.
      - The pinned revision hash is the CTR-ID-001 ID-3 cid (sha256-<base64url> of the JCS bytes) of the referenced statement revision and is immutable after posting.
    entities:
      - name: ThreadOfferCard
        schema: classrup.comms.offer_card/v1
        storage: device
        privacy: P2
        retention: RET-STANDARD
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope"
          - "threadId: uuidv8 — ref F08.S01.M02 Thread; must be active at posting"
          - "kind: enum — bazaar_offer | bazaar_counter | mutiny_proposal"
          - "refId: uuidv7 — record ID in the owning module (offer, negotiation or proposal)"
          - "rootOfferId?: uuidv7 — for bazaar_offer and bazaar_counter: the root offer of the negotiation chain (F01.S04.M02 rootOfferId)"
          - "refRevision: int — revision of the referenced record at posting"
          - "refRevisionHash: string — sha256-<base64url> ID-3 cid of the JCS bytes of the referenced statement revision"
          - "posterDid: did:key — signer of the card statement, must be a party in the referenced record"
          - "posterNote?: string — ≤ 280 code points plain text, displayed only under the label poster note; never parsed or shown as amount, item or term"
          - "displayState: enum — waiting | posted | superseded | closed | frozen | unverified"
          - "closedReason?: enum — accepted | rejected | withdrawn | expired | declined | cancelled | listing_unavailable | blocked | frozen"
          - "unverifiedReason?: enum — record_missing | revision_mismatch | signature_invalid | role_mismatch | record_removed"
          - "supersededBy?: uuidv7 — newer verified card of the same reference"
          - "statementCid: string — sha256 cid of the signed card statement"
          - "postedAtClaim: timestamp — poster clock, a claim"
          - "receivedAt?: timestamp — local clock for inbound cards"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - At most one card per (threadId, refId, refRevision); a card supersedes older cards of the same refId only when it reached posted with a newer refRevision, or when the owning module reports a newer revision.
          - displayState posted or closed implies refRevisionHash matched the locally held statement and posterDid is a party of that record.
          - A card never changes the state of the referenced record; only owning-module events change displayState.
          - Rendered money, item and term fields always come from the verified referenced statement, never from the card or the poster note.
          - Field classes are annotated per F10.S02.M02 (references and DIDs P2, poster note P2 free text scanned locally).
  validation_rules:
    requirements:
      - Posting validates the thread, the poster's party role and the referenced revision before the card statement is signed.
      - Inbound cards are validated for signature, key status, role and hash match before display state posted is assigned.
      - Every violation maps to one stable error code.
    rules:
      - "V01 | kind is in the enum and refId resolves to a record the local vault holds with a verified owning-module statement (offers F01.S04.M01, counters through bazaar.negotiation.get of F01.S04.M02, proposal revisions through F02.S01.M04) | NOT_FOUND"
      - "V02 | poster is a party of the referenced record (buyer or seller of the offer or negotiation, participant of the proposal) | FORBIDDEN"
      - "V03 | refRevisionHash equals the ID-3 cid of the JCS bytes of the held revision refRevision | COMMS_CARD_REVISION_MISMATCH"
      - "V04 | the referenced record is not in a terminal state at posting | CONFLICT_STATE"
      - "V05 | thread is active and the poster is a participant; all parties of the record are participants of the thread | VALIDATION_FAILED"
      - "V06 | posterNote is at most 280 code points of plain text and is displayed only as poster note | VALIDATION_FAILED"
      - "V07 | UX guard in the poster vault: at most 20 cards per thread per day; receiving vaults keep at most 50 waiting cards per thread and poster and drop the rest silently | RATE_LIMITED"
      - "V08 | inbound card statement signature verifies against a device key of posterDid that F16.S02.M02 reports active at receipt | COMMS_CARD_SIGNATURE_INVALID"
      - "V09 | cards from DIDs the local principal blocked are dropped silently (F07.S02.M02 isBlockedEither over local data); a poster blocked by someone else sees no difference | BLOCKED_PARTY"
  workflow_state_machine:
    requirements:
      - A card posted locally starts posted and an inbound card starts waiting; cards move to superseded, closed, frozen or unverified; superseded, closed and unverified are terminal for display, and a posted card becomes unverified when its referenced record disappears or a later re-verification fails.
      - Closing follows only verified terminal events of the owning module and never the card poster's own claim.
      - A waiting card that gets no matching record within 7 days becomes unverified and is not retried automatically.
      - Supersession never follows an unverified card - only a newer card that reached posted, or an owning-module revision event, supersedes - and withdrawn proposals close their cards while forked revisions freeze them until the owning module resolves the fork.
    machines:
      - entity: ThreadOfferCard (local post)
        initial: posted
        terminal: [superseded, closed, unverified]
        transitions:
          - "posted -> superseded | a newer card for the same refId reached posted in the thread, or an owning-module revision event (bazaar.negotiation.countered, mutiny.proposal.revised) | supersededBy linked"
          - "posted -> closed | owning-module terminal event (accepted, rejected, withdrawn, expired, declined, cancelled, listing_unavailable, blocked, frozen) | closedReason stored"
          - "posted -> frozen | mutiny.revision.forked for the referenced proposal | actions removed"
          - "posted -> unverified | referenced record removed locally or a later re-verification fails | unverifiedReason stored; actions removed"
          - "frozen -> superseded | owning module resolves the fork with a newer revision | supersededBy linked"
          - "frozen -> closed | owning module closes the record | closedReason stored"
      - entity: ThreadOfferCard (inbound)
        initial: waiting
        terminal: [superseded, closed, unverified]
        transitions:
          - "waiting -> posted | referenced statement arrives and hash, signature, key status and role verify | emits comms.offer_card.posted with origin federated"
          - "waiting -> unverified | 7 days without matching record or verification failure | unverifiedReason stored"
          - "posted -> superseded | a newer card for the same refId reached posted, or an owning-module revision event | supersededBy linked"
          - "posted -> closed | owning-module terminal event | closedReason stored"
          - "posted -> frozen | mutiny.revision.forked for the referenced proposal | actions removed"
          - "posted -> unverified | referenced record removed locally or a later re-verification fails | unverifiedReason stored"
          - "frozen -> superseded | owning module resolves the fork with a newer revision | supersededBy linked"
          - "frozen -> closed | owning module closes the record | closedReason stored"
    timeouts:
      - "Waiting cards are re-verified when new statements arrive and expire to unverified after 7 days."
  commands_queries_events:
    requirements:
      - Posting is a vault command that produces a signed statement and delegates delivery to comms.message.send as a typed item; reading is a vault query.
      - Posting emits comms.offer_card.posted in the same IndexedDB transaction as the local card record, and inbound verification emits the same event with actor kind federated.
      - The module consumes owning-module events derived from verified statements to update card state, and looks up the root offer of a counter through bazaar.negotiation.get (F01.S04.M02) because the countered event does not carry it.
      - "Statements are registered with F11.S01.M01 (N2): classrup.comms.offer_card/v1 { threadId, kind, refId, refRevision, refRevisionHash, posterNote? } signed by a device key of a party of the referenced record."
      - The module registers ExportSectionPort (section comms.offer_cards), DeletionPort (plan, execute, pseudonymize) and RetentionPurgePort with F10 (N6); cards are purged with their thread and carry no evidence of their own.
    commands:
      - name: comms.offer_card.post
        capability: comms.offer_card.post
        input: "[vault command; produces signed statement classrup.comms.offer_card/v1] { threadId, kind, refId, refRevision, posterNote? }"
        output: "{ cardId, revision: 1, displayState: posted, refRevisionHash }"
        errors: [VALIDATION_FAILED, NOT_FOUND, FORBIDDEN, CONFLICT_STATE, COMMS_CARD_REVISION_MISMATCH, RATE_LIMITED]
        emits: [comms.offer_card.posted]
        idempotent: true
    queries:
      - name: comms.offer_card.list_thread
        capability: comms.offer_card.read
        input: "[vault query] { threadId, includeClosed?: boolean, limit ≤ 50 }"
        output: "{ items: ThreadOfferCard[] with live displayState and the amount, items and terms rendered from the verified referenced revision }"
        errors: [NOT_FOUND]
    events_produced:
      - {type: comms.offer_card.posted, privacy: P2, payload: "{ cardId, threadId, kind, refId, refRevision, refRevisionHash, posterDid, origin: local|federated }"}
    events_consumed:
      - {type: bazaar.offer.accepted, effect: "close cards referencing the offer with reason accepted"}
      - {type: bazaar.offer.rejected, effect: "close cards referencing the offer with reason rejected"}
      - {type: bazaar.offer.withdrawn, effect: "close cards referencing the offer with reason withdrawn"}
      - {type: bazaar.offer.expired, effect: "close cards referencing the offer with reason expired"}
      - {type: bazaar.negotiation.countered, effect: "look up rootOfferId through bazaar.negotiation.get (F01.S04.M02), mark posted cards of that root offer or earlier rounds superseded, and offer posting a counter card"}
      - {type: bazaar.negotiation.closed, effect: "map the outcome onto counter and root offer cards - accepted, rejected, withdrawn, expired, listing_unavailable and blocked close with the same reason, timeout closes with expired, frozen_discarded closes with frozen, superseded moves the card to superseded"}
      - {type: mutiny.proposal.revised, effect: "mark posted cards for earlier revisions of the proposal superseded"}
      - {type: mutiny.proposal.accepted, effect: "close proposal cards with reason accepted"}
      - {type: mutiny.proposal.rejected, effect: "close proposal cards with reason rejected"}
      - {type: mutiny.proposal.expired, effect: "close proposal cards with reason expired"}
      - {type: mutiny.proposal.withdrawn, effect: "close proposal cards with reason withdrawn"}
      - {type: mutiny.revision.forked, effect: "freeze posted cards of the forked proposal without actions until a revision event or terminal event resolves it"}
      - {type: comms.thread.archived, effect: "freeze cards of the thread read-only"}
    errors:
      - "COMMS_CARD_REVISION_MISMATCH | 409 | no | pinned revision cid differs from the revision held locally"
      - "COMMS_CARD_SIGNATURE_INVALID | 422 | no | inbound card statement signature, key status or signer role is invalid; card stored unverified"
    example: |
      vault command comms.offer_card.post
      { "threadId": "5f3a9c1e-7b2d-8e4f-9a01-23456789abcd", "kind": "bazaar_offer", "refId": "0192f3a5-1111-7000-8000-000000000001", "refRevision": 1, "posterNote": "Can pick up Saturday" }
      -> { "cardId": "0192f3a6-2222-7000-8000-000000000001", "revision": 1, "displayState": "posted", "refRevisionHash": "sha256-q0hH…" }
  authorization_capabilities:
    requirements:
      - Vault policy lets only the unlocked local principal post cards, and only for records where it is a party and in threads where it participates.
      - Inbound cards are accepted only when signed by an active key of a party of the referenced record; other signers lead to the unverified state.
      - Cards have no relay-side resource; relays only carry the encrypted message and hold no card data.
    capabilities:
      - "comms.offer_card.post | local principal | vault policy; party of the referenced record; participant(thread); thread active"
      - "comms.offer_card.read | local principal | participant(thread)"
  failure_recovery_idempotency:
    requirements:
      - Posting is idempotent on (threadId, refId, refRevision) so a retry returns the existing card.
      - Inbound cards are deduplicated on statement cid and reprocessed safely when the referenced statement arrives later.
      - The card record and its signed statement are written in one IndexedDB transaction; delivery follows the per-recipient message sync states of F08.S01.M01.
    idempotency: "Vault command idempotent on (threadId, refId, refRevision); inbound statements deduplicated by cid in the consumer inbox (EVT-3)."
    concurrency: "expectedRevision is not needed because cards are immutable except displayState; displayState updates are monotonic (waiting to posted to frozen, superseded, closed or unverified) and applied in one transaction per event; a newer card can supersede only after it reached posted."
    retries: "Delivery retries are those of the message delivery rows on the F15.S01.M01 outbox (IDM-4 backoff, 7-day expiry); verification of waiting cards is retried whenever a new statement of the referenced kind is stored, for up to 7 days."
    offline: "Posting works offline and the card shows saved on this device until the carrying message is transport acknowledged; inbound verification works offline against locally held statements."
    partial_failure: "If message delivery fails the local card stays and shows the message's failed state with resend; if the referenced record disappears locally the card becomes unverified instead of being deleted."
  privacy_retention_abuse:
    requirements:
      - Cards are P2 and travel only inside end-to-end encrypted messages; relays never see card content or amounts.
      - Cards never include P3 data such as exact addresses and never include payment instructions.
      - Spoofed cards are contained by signature, key status and role verification, unverified cards expose no actions, and every amount, item and term is rendered from the verified referenced revision, so a poster cannot show a different amount than the signed record.
      - "Privacy duties (N6): fields are classified per F10.S02.M02 and ExportSectionPort, DeletionPort and RetentionPurgePort are registered with F10."
    data:
      - "ThreadOfferCard: P2, visible to thread participants; poster note limited to 280 characters."
    retention:
      - "Cards follow the thread: RET-STANDARD, purged locally with the thread."
    threats:
      - "T01 | Forged card showing a fake accepted offer | card state derives only from verified owning-module statements; card statement alone never sets closed or accepted"
      - "T02 | Card pinned to one revision but shown as the current deal | revision cid is displayed in the details sheet and superseding cards are marked; actions apply to the live record only"
      - "T03 | Phishing text inside the poster note | note is plain text under the label poster note, links are not rendered as links, max 280 characters"
      - "T04 | Card spam in a thread | receiving vaults keep at most 50 waiting cards per thread and poster and the local block applies; the 20 per day poster limit is a UX guard"
      - "T05 | Poster shows a different amount than the signed offer | amounts and items are rendered from the verified pinned revision through the owning module's renderer; the poster note never holds money fields"
      - "T06 | Burying the real card under an unverifiable card with a higher revision | only cards that reached posted, or owning-module revision events, supersede"
    abuse_controls:
      - "Recipient can report a card; the report carries the card statement and referenced statement (F12.S01.M01)."
      - "Unverified cards are collapsed by default."
  observability_performance:
    requirements:
      - The PWA keeps local diagnostics only (OBS-7) with counters for posted, verified and unverified cards.
      - Posting and state updates meet the vault budget of p95 ≤ 50 ms on a mid-range phone.
      - Rendering a thread with 50 cards meets p95 ≤ 100 ms.
    metrics:
      - "classrup_comms_cards_total{outcome=posted|verified|unverified|superseded|closed|frozen} (local diagnostics)"
      - "classrup_comms_card_waiting_age_ms (gauge, local diagnostics)"
    logs:
      - "local info card.verified {cardId, kind} — no amounts."
      - "local warn card.unverified {cardId, reason}."
    budgets:
      - "post and event update p95 ≤ 50 ms; list_thread 50 cards including owning-module rendering p95 ≤ 100 ms."
      - "Verification of one inbound card including hash and signature ≤ 20 ms."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Contract tests check command input and output, the signed statement and event payload against the schema registry.
      - Role and hash verification are covered by adversarial fixtures.
      - Screens meet CTR-UX-001 (WCAG 2.2 AA, 44 px targets, explicit async states, polite announcements) and the a11y items listed for this module.
    fixtures: "Vaults S (seller) and B (buyer) with thread TH, bazaar offer O revision 1 (amount 500 EUR) signed by B and held by both, negotiation N rooted at O, mutiny proposal P revision 2, stranger X, fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,01.R03,02.R01 | B posts a card for offer O revision 1 with a poster note | card stored posted with refRevisionHash equal to the ID-3 cid of JCS of O revision 1; note at most 280 characters labelled poster note; amount rendered from O"
      - "T02 | unit | 02.R02,02.R03 | each rule V01 to V09 violated in turn | documented error code returned and nothing stored"
      - "T03 | property | 03.R01,03.R02 | random sequences of owning-module events and card posts | transitions only as declared; closed, superseded and unverified never change; closed only follows verified terminal events"
      - "T04 | integration | 03.R03 | card arrives before its referenced offer statement; statement arrives on day 3, another card never arrives for 7 days | first becomes posted, second becomes unverified"
      - "T05 | contract | 04.R01,04.R02,09.R02 | post and list execute | output, statement and event payload validate against registry schemas"
      - "T06 | integration | 04.R03 | deliver offer accepted, negotiation countered, negotiation closed with timeout, proposal revised and thread archived events | cards become closed, superseded, closed with expired, superseded and frozen read-only respectively"
      - "T07 | abuse | 05.R01,05.R02,05.R03,07.R01,09.R03 | X posts a card for B's offer; card signed by a non-party; relay operator inspects stored data | quarantined unverified with no actions; relay holds no card data"
      - "T08 | integration | 06.R01,06.R02,06.R03 | post twice, replay inbound statement three times, and kill the app before message delivery | single card, one event per origin, card remains with prepared delivery state"
      - "T09 | abuse | 07.R02,07.R03 | poster note with link text and an address-like string; 21st card in a day; 51 waiting cards from one poster | links not rendered, no P3 fields accepted, RATE_LIMITED as UX guard, 51st waiting card dropped"
      - "T10 | load | 08.R01,08.R02,08.R03 | thread with 50 cards and 500 events replayed | budgets met"
      - "T11 | unit | 09.R01 | traceability tool run | every PS-063 requirement maps to a passing test"
      - "T12 | integration | 10.R01,10.R02,10.R03 | export, import into fresh vault, restore from backup | cards round trip; cards whose record is missing import as unverified"
      - "T13 | a11y | 09.R04 | thread with all card states on mobile with screen reader | regions named, status announced, targets ≥ 44 px, zero serious axe issues"
      - "T14 | abuse | 01.R02,07.R03 | B posts a card for O (500 EUR) whose poster note says 50 EUR | S's vault shows 500 EUR from the verified offer and the 50 EUR text only under poster note"
      - "T15 | abuse | 03.R04 | after a verified card for O revision 1, a card for revision 2 arrives whose referenced statement never verifies | the revision 1 card stays posted; the new card ends unverified and supersedes nothing"
      - "T16 | integration | 03.R04,04.R03 | mutiny.proposal.withdrawn and mutiny.revision.forked for P | P cards close with reason withdrawn, or freeze without actions and later close or are superseded when the owning module resolves"
      - "T17 | unit | 04.R04,04.R03 | bazaar.negotiation.countered for N without rootOfferId; registry lookup for classrup.comms.offer_card/v1 | rootOfferId resolved through bazaar.negotiation.get and the O card superseded; registry entry lists signer role party of the referenced record"
      - "T18 | integration | 04.R05,07.R04 | account deletion with cards in two threads | DeletionPort plan lists the cards, execute purges them with their threads; export section comms.offer_cards present beforehand"
    acceptance:
      - All tests T01 to T18 pass in CI.
      - No card ever shows accepted or closed unless a verified owning-module statement exists locally, and no card shows an amount that differs from its verified referenced revision.
      - A relay database dump after test traffic contains no card or offer data.
  import_export_backup_rollback:
    requirements:
      - A user's vault export contains the cards of their threads including card statements and display state.
      - Import re-verifies card statements and references; cards whose referenced record is missing become unverified read-only history.
      - Schema changes follow expand and contract and keep v1 readable for 180 days; new card kinds are additive enum values.
    export: "Section comms.offer_cards in classrup-export/v1, registered through ExportSectionPort; one line per ThreadOfferCard (schema classrup.comms.offer_card/v1)."
    import: "Signature and hash are re-verified; existing IDs are skipped; displayState is recomputed from locally held owning-module statements."
    backup: "The vault export is the backup (IOX-6); relays hold no card data."
    migration_rollback: "Additive fields and enum values only in v1; older readers show unknown kinds as unverified references; rollback is safe because card state is recomputed on load."
