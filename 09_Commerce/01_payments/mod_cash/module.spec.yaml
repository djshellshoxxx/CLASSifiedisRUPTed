# F09.S01.M02 Cash payments (ADR-0015, ADR-0016). Cash claims are evidence only; no verification is claimed.
id: F09.S01.M02
scope: MVP
summary: >-
  Defines the rules that apply when a Deal obligation is paid in cash: the payee must acknowledge receipt, an optional
  bilateral receipt can be agreed, and the UI shows safety guidance for in-person cash handover. Cash terms are a small
  signed agreement between the payee and the payer stored in both vaults; default terms (acknowledgement required, no receipt)
  are in force from the moment the Deal opens, and a payee proposal replaces them only when the payer signs its acceptance.
  This module plugs into F09.S01.M01 through the MethodRulePort, which signs the in-force termsCid into every cash claim, and
  through the StatementHandlerPort, which delivers the counterparty's terms statements. The jurisdiction cash limit is read
  at evaluation time from governance.jurisdiction_profile.resolve of F18.S01.M01 as effective.cashLimits: Money[] over the
  vault's selected ProfileRefs, compared in the obligation's own currency with no FX conversion. It never verifies cash; the strongest
  state a cash claim can reach is acknowledged by the payee, and the platform never touches the money.
responsibilities:
  - Own CashTerms per Deal obligation - acknowledgement requirement (always true), optional bilateral receipt, handover guidance key and an optional public-place hint - with default terms entering as accepted when the Deal opens.
  - Implement the cash MethodRulePort - reject cash claims on obligations that do not allow cash or exceed the jurisdiction cash limit, read from governance.jurisdiction_profile.resolve of F18.S01.M01 over the vault's selected ProfileRefs as effective.cashLimits (Money[], the minimum per currency, no FX conversion), and return the termsCid of the in-force terms for F09.S01.M01 to sign into the claim.
  - Produce and verify the signed statements classrup.commerce.cash_terms/v1 (payee), classrup.commerce.cash_terms_accept/v1 (payer) and classrup.commerce.cash_terms_decline/v1 (payer), and ingest them through the StatementHandlerPort of F09.S01.M01.
  - Show safety guidance (public place, daytime, count together, counterfeit check, no home address) keyed to amount thresholds and never block on guidance alone.
  - Own the cash receipt prompt after acknowledgement when the in-force terms require receipts; F09.S02.M01 only signs and verifies the receipts.
  - Keep the label honest - claimed (unverified) then acknowledged by payee; never confirmed.
non_responsibilities:
  - The PaymentClaim state machine, acknowledge and dispute commands (F09.S01.M01).
  - Signing and verifying receipts (F09.S02.M01); this module only records that a bilateral receipt is required and prompts the parties.
  - Meetup scheduling and safe-spot suggestions (F08.S03); this module links to them by reference.
  - "Future: cash handover QR attestations and counterfeit-detection partners."
depends_on: [F09.S01.M01, F09.S02.M01, F09.S03.M03, F18.S01.M01, F07.S02.M02, F11.S01.M01, F11.S01.M03, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, CTR-COM-001, CTR-MNY-001, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-PRV-001, CTR-FED-001]
user_stories:
  - As a seller accepting cash, I require the buyer to sign a receipt, and I see a reminder to count the cash together in a public place.
  - As a buyer paying cash for a high-value item, I see safety guidance and can still proceed if I choose.
  - As either party, I see that a cash payment is only ever acknowledged by the seller and never shown as verified.
  - As a buyer, I can decline terms the seller proposed, and the terms I already agreed to stay in force.
edge_cases:
  - Payee proposes new cash terms after the payer already claimed; the existing claim keeps the termsCid it was signed with, the accepted terms stay in force, and the new terms apply only to claims made after the payer accepts them.
  - governance.jurisdiction_profile.resolve returns effective.cashLimits [1 000.00 EUR] for the selected ProfileRef and the obligation is 2 500.00 EUR; the cash method is refused for that obligation with COMMERCE_CASH_LIMIT_EXCEEDED naming the supplying ProfileRef and version.
  - The payer never answers the terms proposal; after 7 days the proposal expires and the prior accepted terms (the defaults unless the payer accepted others) stay in force.
  - The payer declines a proposal; the decline is signed, the proposal ends as declined and the prior accepted terms stay in force.
  - Handover hint contains what looks like a street address with a house number; the UI warns and the hint is rejected if it matches a home address pattern the user stored as private.
  - Statement terms arrive from a party who is not the payee of the obligation; ingest quarantines it with reason signer_not_payee.
  - Terms statements arrive from a party the receiver has blocked; they are dropped silently (N7).
  - Offline - terms are proposed locally and wait in the sync outbox; the UI shows prepared, not agreed.
  - effective.cashLimits holds only [500.00 USD] and the obligation is 5 000.00 GBP; no limit applies to the GBP obligation, because limits are compared only in the obligation's own currency and are never converted with FX rates.
  - Two selected profiles set 1 000.00 EUR and 3 000.00 EUR; resolve returns the minimum 1 000.00 EUR and that limit applies; nothing is selected and resolve falls back to the generic profile without a cash limit, so no limit applies.
ux:
  screens:
    - "Cash terms sheet: toggle Require signed receipt, public-place hint (≤ 120 chars), safety checklist; button Propose terms; the terms in force are shown above the proposal."
    - "Payer view: terms summary with Accept or Decline, and the safety guidance panel; 'Your current terms stay in force until you accept'."
    - "Cash safety card shown before claiming: meet in public, count together, check notes, never share your home address; amounts above the threshold show the stronger variant."
  states: [loading, defaults, proposed, accepted, declined, superseded, expired, pending-offline]
  a11y:
    - Toggles have visible labels and state announced politely.
    - Guidance is plain text in a collapsible region with a 44 px high header button and aria-expanded.
    - Status is conveyed by text, not color alone.
processes:
  domain_schema:
    requirements:
      - CashTerms stores dealId, obligationId, receiptRequired, handoverHint, proposer, status, the termsCid of the terms it would replace and signed statement cids per CTR-ID-001, in both parties' vaults.
      - CashTerms are P2 and retained as RET-EVIDENCE because they bound what each party agreed when the claim was made.
      - acknowledgementRequired is a constant true; the schema has no field that could mark cash as verified.
      - Exactly one CashTerms row is in force per obligation - the latest accepted one, the defaults until the payer accepts a proposal - and every cash claim signs that row's termsCid through the MethodRulePort.
    entities:
      - name: CashTerms
        schema: classrup.commerce.cash_terms/v1
        storage: device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "vaultId: uuidv7 — local vault scope (CTR-ID-001 tenant slot)"
          - "dealId: uuid — ref F09.S01.M01 Deal"
          - "obligationId: string — ref Deal.obligations; cash must be in allowedMethods"
          - "acknowledgementRequired: boolean — always true"
          - "receiptRequired: boolean — payee asks for a bilateral signed receipt (F09.S02.M01)"
          - "handoverHint?: string — ≤ 120 code points, public place suggestion only"
          - "safetyLevel: enum — standard | elevated; elevated when amount ≥ 100 000 minor units of a 2-decimal currency equivalent (scaled by decimals)"
          - "isDefault: boolean — true for the default terms created when the Deal opens (or on expiry when none exist); they carry no statement"
          - "proposerId: did — payee of the obligation"
          - "status: enum — proposed | accepted | declined | superseded | expired"
          - "termsCid: string — sha256 of the signed cash_terms statement, or of the canonical body {dealId, obligationId, defaults: v1} for default terms"
          - "replacesTermsCid?: string — termsCid of the in-force terms when the proposal was made"
          - "acceptCid?: string — cid of the payer acceptance statement"
          - "declineCid?: string — cid of the payer decline statement"
          - "expiresAt: timestamp — proposedAt + 7 days"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC, local clock"
          - "updatedAt: timestamp — RFC 3339 UTC, local clock"
        invariants:
          - At most one CashTerms with status accepted per (dealId, obligationId), and it is the terms in force.
          - acknowledgementRequired is true in every row.
          - proposerId is the payee of the obligation.
          - An accepted row becomes superseded only in the transaction in which the payer accepts a newer proposal.
  validation_rules:
    requirements:
      - Terms input is validated strictly; unknown fields are rejected with VALIDATION_FAILED.
      - The cash method rule validates allowed methods, jurisdiction limits and term acceptance before a claim is created.
      - Guidance never blocks a claim; only the listed rules do.
      - Incoming terms statements are checked by the StatementHandlerPort handler for signer role (payee for terms, payer for accept and decline), the referenced proposal and revision, and blocks, before any state change.
      - The jurisdiction cash limit is read at every check from governance.jurisdiction_profile.resolve of F18.S01.M01 with the vault's selected ProfileRefs {publisherId, code} (the query default, never a profile id) as effective.cashLimits - Money[] holding the minimum per currency across the selected profiles; the obligation amount is compared only with the entry in its own currency through F09.S03.M03, no FX conversion is made, no limit applies when no entry has that currency, and a rejection records the profileRef and version that sources names for cashLimits.
    rules:
      - "V01 | obligation exists, cash is in allowedMethods and Deal is open | COMMERCE_CASH_NOT_ALLOWED"
      - "V02 | handoverHint is at most 120 code points and plain text | VALIDATION_FAILED"
      - "V03 | actor is the obligation payee when proposing and the payer when accepting or declining | FORBIDDEN"
      - "V04 | obligation amount is at most the entry of effective.cashLimits (governance.jurisdiction_profile.resolve over the vault's selected ProfileRefs) in the obligation's currency; no FX conversion, and no limit applies when no entry has that currency | COMMERCE_CASH_LIMIT_EXCEEDED"
      - "V05 | when the in-force terms have receiptRequired true, the cash claim signs their termsCid and those terms were accepted by the payer; a proposal not yet accepted never applies to a claim | COMMERCE_CASH_TERMS_UNACCEPTED"
      - "V06 | handoverHint does not match a stored private home-address pattern | COMMERCE_CASH_HINT_PRIVATE"
      - "V07 | at most 1 proposal per obligation per hour | RATE_LIMITED"
      - "V08 | set names expectedRevision equal to the revision of the in-force terms for the obligation | CONFLICT_REVISION"
      - "V09 | accept or decline targets the latest proposal for the obligation, which is proposed and not expired | CONFLICT_STATE"
      - "V10 | an ingested cash_terms statement is signed by the obligation payee and an accept or decline by the obligation payer; statements from a blocked did are dropped silently | COMMERCE_STATEMENT_INVALID"
  workflow_state_machine:
    requirements:
      - Default terms enter directly as accepted when the Deal opens; proposals start as proposed and end as accepted, declined, superseded or expired.
      - A new proposal supersedes an earlier unaccepted proposal; accepted terms stay in force until the payer accepts a newer proposal, and claims keep the termsCid they were made under.
      - Expiry after 7 days leaves the prior accepted terms in force, and creates default accepted terms in the same transaction only when none exist.
    machines:
      - entity: CashTerms
        initial: new
        terminal: [superseded, expired, declined]
        transitions:
          - "proposed -> accepted | commerce.cash_terms.accept by payer | acceptance statement signed; in the same transaction the previously accepted terms become superseded"
          - "proposed -> superseded | commerce.cash_terms.set by payee | a newer proposal replaces this unaccepted one"
          - "accepted -> superseded | commerce.cash_terms.accept of a newer proposal by the payer | only in that acceptance transaction; existing claims keep their termsCid"
          - "proposed -> expired | expiry sweep | 7 days without acceptance; the prior accepted terms stay in force, or default accepted terms are created in the same transaction when none exist"
          - "new -> accepted | commerce.deal.opened for an obligation that allows cash, or a proposal expiry with no accepted terms | default terms (acknowledgement required, no receipt) need no acceptance and no statement; no row exists before this"
          - "new -> proposed | commerce.cash_terms.set by payee | signed cash_terms statement; expectedRevision equals the revision of the in-force terms; no row exists before this"
          - "proposed -> declined | commerce.cash_terms.decline by payer | signed decline statement; the prior accepted terms stay in force"
    timeouts:
      - "Proposal expiry sweep every 5 min and at vault unlock: proposed terms older than 7 days become expired, and default accepted terms are created in the same transaction only when the obligation has no accepted terms."
  commands_queries_events:
    requirements:
      - Terms commands are vault commands that produce the signed statements classrup.commerce.cash_terms/v1, classrup.commerce.cash_terms_accept/v1 and classrup.commerce.cash_terms_decline/v1; no relay command exists.
      - The module emits no domain events (catalog emits is empty); state is observable through queries and the Deal card.
      - The module consumes Deal, claim and deletion events to create default terms, show safety guidance, prompt cash receipts and pseudonymize retained terms.
      - Incoming terms statements are ingested through the StatementHandlerPort of F09.S01.M01 - signer role payee for cash_terms and payer for cash_terms_accept and cash_terms_decline - deduplicated by cid, idempotent, and quarantined with a reason (signer_not_payee, signer_not_payer, deal_unknown, proposal_unknown, stale_revision) or dropped silently when the signer is blocked.
      - The cash MethodRulePort returns the termsCid of the in-force terms, which F09.S01.M01 signs into the cash claim.
    commands:
      - name: commerce.cash_terms.set
        capability: commerce.cash_terms.set
        input: "[vault command, produces signed statement classrup.commerce.cash_terms/v1] { dealId, obligationId, expectedRevision (revision of the in-force terms), receiptRequired, handoverHint? }"
        output: "{ termsId, revision: 1, status: proposed, expiresAt, replacesTermsCid, peerSync }"
        errors: [VALIDATION_FAILED, NOT_FOUND, FORBIDDEN, CONFLICT_REVISION, COMMERCE_CASH_NOT_ALLOWED, COMMERCE_CASH_LIMIT_EXCEEDED, COMMERCE_CASH_HINT_PRIVATE, RATE_LIMITED]
        emits: []
        idempotent: true
      - name: commerce.cash_terms.accept
        capability: commerce.cash_terms.accept
        input: "[vault command, produces signed statement classrup.commerce.cash_terms_accept/v1] { termsId, expectedRevision }"
        output: "{ termsId, revision, status: accepted, supersededTermsId }"
        errors: [NOT_FOUND, FORBIDDEN, CONFLICT_REVISION, CONFLICT_STATE, EXPIRED]
        emits: []
        idempotent: true
      - name: commerce.cash_terms.decline
        capability: commerce.cash_terms.decline
        input: "[vault command, produces signed statement classrup.commerce.cash_terms_decline/v1] { termsId, expectedRevision }"
        output: "{ termsId, revision, status: declined, inForceTermsId }"
        errors: [NOT_FOUND, FORBIDDEN, CONFLICT_REVISION, CONFLICT_STATE, EXPIRED]
        emits: []
        idempotent: true
    queries:
      - name: commerce.cash_terms.get
        capability: commerce.cash_terms.read
        input: "{ dealId, obligationId }"
        output: "{ inForce: CashTerms, pendingProposal?: CashTerms, history: CashTerms[], guidance: { level, keys[] } }"
        errors: [NOT_FOUND]
    note: >-
      Statement registry (N2, registered in F11.S01.M01): classrup.commerce.cash_terms/v1 - obligation payee;
      classrup.commerce.cash_terms_accept/v1 - obligation payer, names the proposal termsCid; classrup.commerce.cash_terms_decline/v1
      - obligation payer, names the proposal termsCid. These types are delivered by the F09.S01.M01 ingest dispatcher to this
      module's StatementHandlerPort handler, which checks the signer role against the Deal obligation, deduplicates by cid,
      buffers a statement whose Deal or proposal is unknown for 24 h (deal_unknown, proposal_unknown), quarantines wrong signers
      (signer_not_payee, signer_not_payer) and statements naming a revision older than the in-force terms (stale_revision), and
      drops statements from blocked dids silently (F07.S02.M02 isBlockedEither). Default terms are local records with no statement.
    events_produced: []
    events_consumed:
      - {type: commerce.deal.opened, effect: "create default accepted CashTerms (acknowledgement required, no receipt) for every obligation that allows cash"}
      - {type: commerce.payment.claimed, effect: "for cash claims show the safety guidance and record which termsCid the claim signed"}
      - {type: commerce.payment.acknowledged, effect: "for cash claims whose signed termsCid names terms with receiptRequired, prompt both parties to sign receipts through F09.S02.M01; this is the only cash receipt prompt; no state change here"}
      - {type: commerce.payment.expired, effect: "close open receipt prompts for the expired cash claim"}
      - {type: commerce.deal.cancelled, effect: "expire a pending proposal of the cancelled Deal; accepted terms stay as history"}
      - {type: privacy.deletion.completed, effect: "through the DeletionPort plan, replace the deleted principal's did in retained CashTerms with the per-deletion pseudonym; signatures kept and flagged unverifiable-after-pseudonymization"}
    errors:
      - "COMMERCE_CASH_NOT_ALLOWED | 422 | no | the obligation does not allow cash or the Deal is not open"
      - "COMMERCE_CASH_LIMIT_EXCEEDED | 422 | no | obligation exceeds the effective.cashLimits entry in its currency from governance.jurisdiction_profile.resolve; details {limit: Money, profileRef, profileVersion}"
      - "COMMERCE_CASH_TERMS_UNACCEPTED | 409 | no | the claim does not name the payer-accepted terms in force"
      - "COMMERCE_CASH_HINT_PRIVATE | 422 | no | hint appears to contain a stored private address"
    example: |
      vault command commerce.cash_terms.set
      { "dealId": "5b1d0c7e-…", "obligationId": "o1", "expectedRevision": 1, "receiptRequired": true, "handoverHint": "Outside the library main entrance, daytime" }
      => { "termsId": "0192f3a8-…", "revision": 1, "status": "proposed", "expiresAt": "2026-11-11T10:00:00.000Z", "replacesTermsCid": "sha256-dflt…", "peerSync": "prepared" }
      vault command commerce.cash_terms.accept { "termsId": "0192f3a8-…", "expectedRevision": 1 }
      => { "termsId": "0192f3a8-…", "revision": 2, "status": "accepted", "supersededTermsId": "0192f3a6-…" }
  authorization_capabilities:
    requirements:
      - Under vault policy (CAP-8) only the unlocked principal changes its vault; set requires the payee role and accept and decline require the payer role as recorded in the Deal.
      - Incoming terms statements are accepted only when signed by the obligation payee (terms) or payer (accept, decline); otherwise they are quarantined.
      - No relay role has any capability over cash terms.
    capabilities:
      - "commerce.cash_terms.set | local-principal | principal is the payee of the obligation; Deal open"
      - "commerce.cash_terms.accept | local-principal | principal is the payer of the obligation; terms proposed and not expired"
      - "commerce.cash_terms.decline | local-principal | principal is the payer of the obligation; terms proposed and not expired"
      - "commerce.cash_terms.read | local-principal | principal is a party of the Deal"
  failure_recovery_idempotency:
    requirements:
      - All three commands are idempotent per CTR-IDM-001 and use expectedRevision.
      - Concurrent proposals from several tabs serialize and the later one supersedes the earlier one.
      - Statement delivery uses the sync outbox states and the UI never shows terms as agreed before peer_accepted.
    idempotency: "Vault command ID recorded for 24 h; terms, accept and decline statements dedupe by cid; default terms are created once per obligation, keyed by their deterministic termsCid."
    concurrency: "expectedRevision on set (in-force terms), accept and decline; unique partial index for one accepted terms per obligation; Web Lock commerce-cash per Deal; the superseding of accepted terms happens in the acceptance transaction only."
    retries: "Sync outbox retry 5 s, 30 s, 5 min, 1 h, then every 6 h until terms expire."
    offline: "Propose, accept and decline commit locally and show prepared; delivery resumes online; the terms in force do not change until the acceptance is committed locally."
    partial_failure: "If sending fails after local commit the terms stay proposed locally with sync state prepared; the user sees that the peer has not received them."
  privacy_retention_abuse:
    requirements:
      - Cash terms are P2 and never leave the vault except inside end-to-end encrypted envelopes to the other party.
      - The handover hint is public-place guidance only; the UI warns against sharing a home address (P3) and rejects hints that match the user's stored private address.
      - Pressure tactics are limited by the proposal rate limit and by the dispute path.
      - The module registers ExportSectionPort (section commerce.cash_terms), DeletionPort (pseudonymization of retained terms) and RetentionPurgePort (RET-EVIDENCE) with F10 (N6), annotates every CashTerms field with its F10.S02.M02 class, and consumes privacy.deletion.completed.
      - Ingest drops statements from blocked dids silently (N7) and uses the bounded quarantine of F09.S01.M01 (500 entries or 5 MiB, oldest-first eviction); once it is full, statements from dids that are party to no known Deal are dropped.
    data:
      - "CashTerms: P2 (parties); handoverHint is P2 free text; field classes annotated per F10.S02.M02."
    retention:
      - "RET-EVIDENCE (2 years after last related activity) through the RetentionPurgePort; pseudonymized on account deletion."
    threats:
      - "T01 | Counterparty pressures an unsafe private meeting for cash | guidance card, public-place hint field, safe-spot link (F08.S03), no home address prompt"
      - "T02 | Payee claims cash was never handed over after signing a receipt | signed receipts are assertions both parties hold; dispute path preserves them; platform states it cannot verify cash"
      - "T03 | Fake terms statement from a non-party | signer-role check at ingest; quarantine"
      - "T04 | Payee silently replaces terms the payer already accepted | accepted terms stay in force until the payer signs acceptance of newer terms; each claim signs its termsCid"
      - "T05 | Sybil flood of terms statements from fresh dids | shared bounded quarantine; non-party statements dropped once full"
    abuse_controls:
      - "Proposal limit of 1 per obligation per hour and 20 per day per vault; ingest limit 20 statements per hour per known party; statements from dids that are party to no known Deal share the bounded quarantine and are dropped once it is full; blocked senders dropped silently."
  observability_performance:
    requirements:
      - The PWA sends no telemetry (OBS-7); counters stay in local diagnostics.
      - Local commit meets the budgets below.
      - Guidance and limit rejections are counted locally.
    metrics:
      - "Local diagnostics: classrup_commerce_cash_terms_total{status}"
      - "Local diagnostics: classrup_commerce_cash_limit_rejections_total"
      - "Local diagnostics: classrup_commerce_cash_guidance_shown_total{level=standard|elevated}"
    logs:
      - "info cash_terms.accepted {termsId, dealId, correlationId} — no hint text, no amounts."
    budgets:
      - "set, accept and decline p95 ≤ 100 ms local commit on a mid-range phone."
      - "Terms sweep over 5 000 rows ≤ 500 ms."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement is covered by at least one automated test.
      - Contract tests validate command outputs and statement envelopes against the schema registry.
      - Honest-label behavior is checked in UI tests.
    fixtures: "Two vaults A (payer) and B (payee) with a Deal for EUR 45.00 allowing cash; a governance.jurisdiction_profile.resolve stub for the selected ProfileRef {publisherId P, code eu_de} version 3 returning effective.cashLimits [{amountMinor: 100000, currency: EUR}]; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R03,02.R01 | propose valid terms | row stored with acknowledgementRequired true, status proposed, replacesTermsCid of the defaults, signed statement created"
      - "T02 | unit | 02.R02 | each rule V01 to V10 violated in turn | documented error code and nothing stored"
      - "T03 | property | 03.R01,03.R02 | random sequences of set, accept, decline and expiry | only declared transitions succeed; at most one accepted terms per obligation at any time"
      - "T04 | integration | 03.R02,03.R03 | clock advanced 7 days on a proposal while the defaults are in force; claim made under accepted terms then a new proposal | proposal expires and the prior accepted terms stay in force; the existing claim keeps the termsCid it was signed with"
      - "T05 | contract | 04.R01,04.R02,09.R02 | execute all three commands and ingest in vault B | outputs and envelopes validate; no events emitted"
      - "T06 | integration | 04.R03,01.R02 | commerce.deal.opened delivered twice | exactly one default terms row per cash obligation"
      - "T07 | abuse | 05.R01,05.R02,05.R03 | payer proposes terms; third-party signer; relay inspects traffic | FORBIDDEN or quarantine; relay sees only ciphertext"
      - "T08 | integration | 06.R01,06.R02,06.R03 | replay of a command ID and interrupted delivery | original result; UI shows prepared until peer_accepted"
      - "T09 | abuse | 07.R01,07.R02,07.R03 | hint equal to stored private address; 2 proposals in an hour | hint rejected with COMMERCE_CASH_HINT_PRIVATE; second proposal RATE_LIMITED"
      - "T10 | unit | 08.R01,08.R02 | diagnostics and timing run | no network telemetry; budgets met"
      - "T11 | e2e | 01.R03,09.R03 | claim cash then acknowledge on second device | labels read claimed (unverified) then acknowledged by payee; never confirmed; axe zero serious issues"
      - "T12 | unit | 09.R01 | traceability tool run | every PS-067 requirement maps to a passing test"
      - "T13 | integration | 10.R01,10.R02,10.R03 | export, import to fresh vault, roll back one release | terms round-trip identical; expired proposals import as expired"
      - "T14 | integration | 03.R01 | payer declines a proposal, then tries to accept it | proposed to declined with a signed decline statement and the prior accepted terms still in force; accept refused with CONFLICT_STATE"
      - "T15 | integration | 03.R02,01.R04,04.R05 | defaults in force, payee proposes receiptRequired true, payer claims before accepting, then accepts and claims again | first claim signs the default termsCid; defaults superseded only in the acceptance transaction; second claim signs the new termsCid and triggers the receipt prompt after acknowledgement"
      - "T16 | integration | 04.R04,02.R04 | vault B ingests cash_terms signed by the payer, an accept signed by the payee, a duplicate and a valid terms statement | first two quarantined with signer_not_payee or signer_not_payer; duplicate is a no-op; the valid one applied once"
      - "T17 | unit | 02.R03 | cash claim above the elevated guidance threshold with the guidance dismissed unread | claim allowed; guidance shown but never blocks; only V01, V04 and V05 can refuse a claim"
      - "T18 | unit | 08.R03 | show standard and elevated guidance and trigger a cash limit rejection | classrup_commerce_cash_guidance_shown_total{level} and classrup_commerce_cash_limit_rejections_total increase in local diagnostics"
      - "T19 | integration | 07.R04 | export, deletion and retention purge driven by F10 | section commerce.cash_terms exported; privacy.deletion.completed pseudonymizes the principal; RetentionPurgePort purges after RET-EVIDENCE; every field carries an F10.S02.M02 class"
      - "T20 | abuse | 07.R05 | blocked payee sends a terms statement; 10 000 fresh dids send terms statements | blocked statement dropped silently; quarantine stays within 500 entries or 5 MiB and non-party statements are dropped once it is full"
      - "T21 | contract | 02.R05,02.R02 | resolve stub returns cashLimits [EUR 1 000.00, USD 500.00] with sources naming {P, eu_de} version 3; cash obligations of EUR 2 500.00, EUR 1 000.00 and GBP 5 000.00; then a fallback resolve with empty cashLimits | resolve called with the vault's selected ProfileRefs and no profile id; EUR 2 500.00 refused with COMMERCE_CASH_LIMIT_EXCEEDED and details {limit EUR 1 000.00, profileRef {P, eu_de}, profileVersion 3}; EUR 1 000.00 and GBP 5 000.00 allowed with no FX conversion; fallback allows every amount"
    acceptance:
      - All tests T01 to T21 pass in CI.
      - A cash claim can reach acknowledged but never confirmed or final, and no UI text implies verification.
      - Safety guidance is displayed for every cash claim and never blocks on its own.
      - Accepted cash terms are never replaced without the payer's signed acceptance of newer terms.
  import_export_backup_rollback:
    requirements:
      - The vault export contains the principal's cash terms with their signed statements in the section commerce.cash_terms.
      - Import verifies signatures and parties against the imported Deals and quarantines terms whose signer is not a party.
      - Schema changes follow expand/contract and keep v1 readable for 180 days.
    export: "ExportSectionPort section commerce.cash_terms in classrup-export/v1; one line per CashTerms (schema classrup.commerce.cash_terms/v1) with statement envelopes (cash_terms, cash_terms_accept, cash_terms_decline)."
    import: "Accepted, declined and superseded terms import as read-only history; proposed terms past expiry import as expired; the latest accepted terms import as in force."
    backup: "The vault export is the primary backup (IOX-6); relays hold no cash terms."
    migration_rollback: "Additive fields only in v1; rollback is safe because older readers ignore new optional fields and the new decline statement type."
