  import_export_backup_rollback:
    requirements:
      - The vault export contains the principal's crypto requests and observations with signed request statements in the section commerce.crypto.
      - Import verifies signatures and re-validates addresses; open observations restart as watching and are re-verified rather than trusted.
      - Schema changes follow expand/contract and keep v1 readable for 180 days.
    export: "Section commerce.crypto in classrup-export/v1; one line per CryptoPaymentRequest and ChainObservation (schemas classrup.commerce.crypto_request/v1, classrup.commerce.chain_observation/v1). Verifier endpoint settings and API keys are excluded."
    import: "Observations with final status import as read-only evidence marked imported-not-reverified; non-final observations import as watching; request statements are verified again and invalid ones are quarantined."
    backup: "The vault export is the primary backup (IOX-6); relays hold no requests or observations."
    migration_rollback: "Additive fields only in v1; rollback is safe because older readers ignore new optional fields. A change to a finality policy requires a new policy identifier and never rewrites stored observations."
