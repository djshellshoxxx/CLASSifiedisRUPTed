# F09.S01.M03 Crypto payments (ADR-0015, ADR-0016). CTR-COM-001 COM-5 applies: no verifier configured means claims stay claimed.
id: F09.S01.M03
scope: MVP
summary: >-
  Lets a payee ask for payment in a crypto asset by supplying their own receiving address, amount and chain, and lets each
  party's vault check a claimed transaction against the chain through a ChainVerifierPort adapter that the user configured
  (their own node, an Esplora-compatible or EVM JSON-RPC endpoint, or a user-selected relay that returns relay-signed
  observations). It tracks confirmations, applies the finality policy (Bitcoin 6 confirmations, Ethereum-family at or below
  the finalized tag), handles reorgs, and never confirms anything without a verifier. Observations are per vault: the payee's
  vault, once its own verifier reports final, has F09.S01.M01 sign a payment acknowledgement with verification source chain,
  and only that signed statement completes the Deal in both vaults. Only a transaction that matches the request (address,
  asset, amount, included after the request's chain tip) is ever shown as confirming. Verifier lookups are an explicit,
  consented, unauthenticated disclosure to the endpoint the user chose. The platform never requests, derives or stores
  private keys or seed phrases and never signs or broadcasts payments.
responsibilities:
  - Own CryptoPaymentRequest (payee address, amount, asset, chain, validity, chain tip at creation) and its signed statement classrup.commerce.crypto_request/v1.
  - Own ChainObservation per claimed transaction and run the observation loop through ChainVerifierPort adapters, in the vault, while the PWA is running or when periodic background sync fires.
  - "Apply finality (COM-5): Bitcoin 6 confirmations, Ethereum-family block number at or below the finalized tag, other chains disabled; emit commerce.payment.confirming only for matching transactions, plus confirmed, finalized, reorged and failed with its reason."
  - Verify address, amount and asset (native or token contract from F09.S03.M01) before a transaction can count; underpayment or wrong destination never confirms.
  - Implement the crypto MethodRulePort for F09.S01.M01, refuse any input that looks like a private key, seed phrase or extended private key, and hold a claim local and unsent until its txid is found on chain or attested by the payer.
  - Let the user configure verifier endpoints per chain and show which endpoint and trust level produced each observation.
  - Register the StatementHandlerPort handler for classrup.commerce.crypto_request/v1 and crypto_request_cancel/v1 (signer payee) with the F09.S01.M01 ingest dispatcher, so the payer's vault stores the payee's address.
  - Bind each request to the chain tip at creation, count only outputs included after it, and refuse an address already used by another open or claimed request in the vault.
  - Gate verifier lookups by privacy.consent.check purpose chain_lookup and send them without DID, device-key signature or relay access token, on a connection separate from mailbox traffic.
  - Keep polling inside a per-vault budget and keep final observations under a 100-block watch that raises a deep-reorg alert without regressing state.
non_responsibilities:
  - The Deal, PaymentClaim and payee acknowledgement commands (F09.S01.M01), including signing the chain acknowledgement in the payee's vault.
  - Wallet functionality, key management, address derivation, transaction construction, signing or broadcasting; the payer pays from their own wallet outside the app.
  - Currency definitions, decimals and asset descriptors (F09.S03.M01) and FX conversion (F09.S03.M02, F09.S03.M03).
  - Purpose consent records (F10.S01.M01); this module only calls privacy.consent.check.
  - "Future: Lightning invoices, Layer 2 chains, Solana or other chains configured per tenant, and multi-endpoint quorum by default (MVP supports an optional 2-of-2 quorum when two endpoints are configured)."
depends_on: [F09.S01.M01, F09.S03.M01, F09.S03.M03, F07.S02.M02, F11.S01.M01, F11.S01.M03, F10.S01.M01, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, CTR-COM-001, CTR-MNY-001, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-PRV-001, CTR-FED-001, CTR-FLG-001]
user_stories:
  - As a seller, I enter my own receiving address and the amount in BTC or USDC and send the request to the buyer, knowing the app never holds my keys.
  - As a buyer, I pay from my own wallet, paste the transaction ID, and see confirmed 2 of 6 per my verifier, then final, or a clear reorg notice.
  - As a user with no verifier configured, I still can claim payment, and I see claimed (unverified) and a prompt to set up a verifier.
  - As a buyer whose seller has no verifier yet, I see 'final per your verifier; payee has not confirmed' and know the Deal completes only when the seller's own verifier confirms it.
  - As a seller, I am told which endpoint learns my addresses before any lookup happens, and I can keep lookups on my own node.
edge_cases:
  - No ChainVerifierPort is configured for the chain; the claim stays claimed and verification.source stays self; nothing is auto-confirmed.
  - The transaction pays the right address but 4 000 sats less than requested; the observation records underpaid with receivedAmount, emits commerce.payment.failed with reason underpaid and no confirming event, the label reads 'transaction does not match request', and the payer may claim the received amount and pay the remainder in a second transaction against the same request.
  - A Bitcoin block with the transaction is orphaned at 2 confirmations; status moves to reorged, the UI shows it, and if the transaction is re-included the claim returns to pending_confirmation.
  - The verifier endpoint returns inconsistent data between polls or two configured endpoints disagree; the observation is marked disagreement, no progress is applied, and the user is warned.
  - The user pastes a 12-word seed phrase or a WIF key into the txRef or note field; the input is rejected without being stored or logged.
  - ERC-20 transfer is sent from a different token contract than the registered USDC contract; the observation records wrong_asset and never confirms.
  - The PWA stays closed for 3 days; on open the observation catches up from the chain and applies the final status, with checkedAt showing when it was last verified.
  - The payer pastes a raw 0x-prefixed 64-hex private key as the transaction ID; it has txid format, so the claim is held on the device unsigned and unsent, the verifier does not find it, and it is discarded locally after 24 h without ever reaching the payee.
  - An older transaction that paid the same address before the request existed is claimed for a new request; it is included at or below chainTipAtCreation, so it fails with reason before_request.
  - The payee tries to reuse an address that another open request in the vault still uses; the request is refused with COMMERCE_CRYPTO_ADDRESS_REUSED.
  - Only the payer configured a verifier; the payer's vault reaches final and shows 'final per your verifier; payee has not confirmed', and the Deal completes in both vaults only after the payee's own verifier reaches final and its vault signs the chain acknowledgement.
  - The inclusion block of a final Bitcoin transaction is replaced 40 blocks later; the observation stays final, a deep-reorg alert is raised and shown to both parties, and no state regresses.
  - Sixty claims are watched at once and the hourly poll budget runs out; observations closest to finality are checked first and the rest show 'verification paused - check budget reached' until the next hour.
ux:
  screens:
    - "Request payment sheet: asset and chain (BTC, ETH, USDC), amount, receiving address field with checksum feedback, 'Use a fresh address' hint and a refusal when the address is still used by another open request, validity selector, Send request."
    - "Pay screen for the payer: address and amount with QR and copy, warning 'Send exactly this amount on this chain', then field Paste transaction ID with the note 'A transaction ID is public. Never paste a key or seed phrase.'"
    - "Verification panel: status chip claimed (unverified), held on this device until the transaction is found, confirming 2 of 6 per your verifier, awaiting finalized checkpoint (EVM), confirmed, final per your verifier, final - confirmed by the payee's verifier (signed), transaction does not match request, reorged, deep-reorg alert, verification paused; shows verifier endpoint host, last checked time and trust label."
    - "Verifier settings: endpoint URL per chain (own node or direct endpoint by default; relay endpoint only as an explicit choice), optional second endpoint, test connection button, and the disclosure 'This endpoint learns which transactions and addresses you look up' with the chain_lookup consent switch."
  states: [no-verifier, claimed-unverified, held-on-device, pending, confirming-n-of-m, awaiting-finalized-checkpoint, confirmed, final-per-your-verifier, final-confirmed-by-payee, reorged, deep-reorg-alert, failed, mismatched, underpaid, endpoint-disagreement, verification-paused, offline]
  a11y:
    - Confirmation progress is text such as 'confirmed 2 of 6 per your verifier' in an aria-live polite region, not only a bar.
    - Addresses are shown in monospace groups of 4 characters with a copy button and an accessible name that includes the chain.
    - QR codes always have the address as adjacent text.
processes:
  domain_schema:
    requirements:
      - A CryptoPaymentRequest stores deal and obligation refs, payee-supplied address, chain, asset, Money amount in asset minor units, validity and status, and is signed by the payee as classrup.commerce.crypto_request/v1.
      - A ChainObservation stores the claimed txid, the verifier used, block data, confirmations, finality flag and a match result, and is kept in the vault only; observations are local evidence and not statements about the other party.
      - Both entities are P2 and retained as RET-EVIDENCE; no field ever holds a private key, seed or signing material.
      - Each request records the chain tip height (Bitcoin) or block number (EVM) that the payee's verifier reported at creation, signed into the request, and only outputs included above it, or first seen in the mempool after the request was received, count toward the request.
      - A request covers its obligation amount through one or more claims; coveredAmount sums the matched receivedAmount of final claims, and the request is settled only when coveredAmount reaches the amount.
    entities:
      - name: CryptoPaymentRequest
        schema: classrup.commerce.crypto_request/v1
        storage: device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "vaultId: uuidv7 — local vault scope (CTR-ID-001 tenant slot)"
          - "dealId: uuid — ref F09.S01.M01 Deal (UUIDv8)"
          - "obligationId: string — ref Deal.obligations; crypto must be in allowedMethods"
          - "contextRef: object — {type, id} copied from the Deal for event routing"
          - "payeeId: did — signer; supplies the address"
          - "payerId: did — recipient of the request"
          - "chainId: enum — bitcoin-mainnet | ethereum-mainnet (other chains disabled)"
          - "asset: string — registry code BTC, ETH or USDC (F09.S03.M01)"
          - "assetDescriptor: object — F09.S03.M01 descriptor {code, kind, chainId, contract, decimals, digest} signed into the request"
          - "address: string — payee receiving address; bech32 or base58check for Bitcoin, 0x plus 40 hex with EIP-55 checksum for EVM"
          - "amount: Money — CTR-MNY-001; in the asset's minor units; > 0"
          - "chainTipAtCreation?: int — Bitcoin tip height or EVM block number reported by the payee's verifier at creation; absent when no verifier was reachable, and then matching uses inclusion blocks with a timestamp at least 2 h after createdAt, labelled time-bound only"
          - "coveredAmount: Money — sum of matched receivedAmount of final claims; ≤ amount"
          - "claimIds: array — claims attached to this request, at most 10"
          - "origin: enum — local (payee vault) | peer (mirrored in the payer vault from the signed statement)"
          - "expiresAt: timestamp — createdAt + 7 days by default, range 1 h to 14 days"
          - "status: enum — open | claimed | settled | cancelled | expired"
          - "requestCid: string — sha256 of the signed request statement"
          - "peerSync: string — local_committed | prepared | transport_acknowledged | peer_accepted"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC, local clock"
        invariants:
          - address is valid for chainId and unchanged after creation; a different address needs a new request.
          - asset belongs to chainId in the registry; a token asset has a registered contract.
          - At most one open or claimed request per (dealId, obligationId).
          - In the payee vault no two open or claimed requests share an address.
          - coveredAmount never exceeds amount, and status settled implies coveredAmount equals amount.
      - name: ChainObservation
        schema: classrup.commerce.chain_observation/v1
        storage: device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "vaultId: uuidv7 — local vault scope"
          - "requestId: uuidv7 — ref CryptoPaymentRequest"
          - "claimId: uuidv7 — ref F09.S01.M01 PaymentClaim"
          - "chainId: string — chain observed"
          - "txid: string — transaction hash as supplied by the payer (64 hex for Bitcoin, 0x plus 64 hex for EVM)"
          - "status: enum — watching | pending | confirmed | final | reorged | failed | mismatched | stopped"
          - "matchResult: enum — none | match | underpaid | wrong_address | wrong_asset | before_request | reverted"
          - "receivedAmount?: Money — amount paid to the request address in asset minor units"
          - "blockHash?: string — inclusion block hash at last check"
          - "blockHeight?: int — inclusion block height at last check"
          - "confirmations: int — ≥ 0; Bitcoin tip minus height plus 1"
          - "requiredConfirmations: int — 6 for Bitcoin; for EVM the finalized tag (stored as 0 and shown as 'awaiting finalized checkpoint', never N of 0)"
          - "finalityPolicy: string — btc-6-conf | evm-finalized-tag"
          - "verifierId: string — endpoint adapter id and version, e.g. esplora@1.2 or evm-jsonrpc@1.0"
          - "verifierTrust: enum — user-node | user-endpoint | relay-signed"
          - "observerRole: enum — payer | payee; the party whose vault runs this observation"
          - "firstSeenAt?: timestamp — local clock"
          - "checkedAt: timestamp — local clock of last successful check"
          - "lastTipSeen: int — chain tip at the last per-observation check; per-transaction calls happen only when the tip moved"
          - "lastProgressAt: timestamp — local clock of the last confirmation increase"
          - "reorgCount: int — number of reorg events observed"
          - "disagreement: boolean — true when two endpoints disagreed at last check"
          - "postFinalWatchUntil?: int — block height until which a final observation is still watched (final height + 100)"
          - "deepReorgAlertAt?: timestamp — set when the inclusion block of a final observation was replaced during the watch"
          - "budgetPausedAt?: timestamp — set while the hourly poll budget defers this observation"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - status final requires matchResult match and finalityPolicy satisfied at checkedAt.
          - A claim is never driven past claimed by an observation whose verifierId is empty; with no verifier no observation exists.
          - One ChainObservation per (claimId, txid).
          - commerce.payment.confirming is emitted only while matchResult is match.
          - final is terminal; the post-final watch only sets deepReorgAlertAt.
    sql: |
      CREATE TABLE commerce_crypto_request (
        id TEXT PRIMARY KEY, vault_id TEXT NOT NULL, deal_id TEXT NOT NULL, obligation_id TEXT NOT NULL, address TEXT NOT NULL,
        chain_id TEXT NOT NULL, status TEXT NOT NULL, expires_at TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX commerce_crypto_request_open ON commerce_crypto_request(vault_id, deal_id, obligation_id)
        WHERE status IN ('open','claimed');
      CREATE UNIQUE INDEX commerce_crypto_request_address ON commerce_crypto_request(vault_id, chain_id, address)
        WHERE status IN ('open','claimed') AND json_extract(data, '$.origin') = 'local';
      CREATE TABLE commerce_chain_observation (
        id TEXT PRIMARY KEY, vault_id TEXT NOT NULL, claim_id TEXT NOT NULL, chain_id TEXT NOT NULL, txid TEXT NOT NULL,
        status TEXT NOT NULL, checked_at TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX commerce_chain_observation_tx ON commerce_chain_observation(vault_id, claim_id, txid);
  validation_rules:
    requirements:
      - Request input is validated strictly, including address format and checksum for the chain and the asset registry binding.
      - Any free-text or reference field is scanned for private key, seed phrase and extended private key patterns and rejected before storage or logging.
      - Observation results are validated by amount, destination, asset and chain before any state advances.
      - A raw 64-hex private key has the same format as a txid, so before a crypto claim is signed or sent its txid is looked up through the configured verifier and the claim stays local and unsent until it is found; with no verifier the payer must confirm 'this is a public transaction ID, never a key', and the residual risk that the lookup itself discloses a mistyped key to the chosen verifier is stated in the UI.
      - An address already used by another open or claimed request in the vault is refused, and a transaction included at or below the request's chainTipAtCreation counts as before_request and never matches.
    rules:
      - "V01 | chainId is enabled in the vault and asset belongs to that chain in the registry | COMMERCE_CRYPTO_CHAIN_DISABLED"
      - "V02 | address is valid for the chain, mainnet only, with EIP-55 checksum when mixed case | COMMERCE_CRYPTO_ADDRESS_INVALID"
      - "V03 | amount is positive and within 38 digits in the asset's minor units | VALIDATION_FAILED"
      - "V04 | txid format is valid for the chain | COMMERCE_CRYPTO_TXID_INVALID"
      - "V05 | no field contains a WIF key, xprv or xpub-private form, hex of 64 characters labelled key, or a 12/15/18/21/24-word BIP39 phrase | COMMERCE_CRYPTO_SECRET_REJECTED"
      - "V06 | actor is the obligation payee when creating or cancelling a request | FORBIDDEN"
      - "V07 | request is open, or claimed with an uncovered remainder, and not expired when a claim references it, and the claim amount is at most the uncovered remainder | COMMERCE_CRYPTO_REQUEST_NOT_OPEN"
      - "V08 | request is not claimed when cancelling | CONFLICT_STATE"
      - "V09 | the same txid is not already attached to another claim in this vault | COMMERCE_CRYPTO_TX_REUSED"
      - "V10 | at most 3 manual refreshes per observation per minute | RATE_LIMITED"
      - "V11 | the receiving address is not used by another open or claimed request in this vault | COMMERCE_CRYPTO_ADDRESS_REUSED"
      - "V12 | with a verifier configured the txid was found on chain before the claim is signed and sent; without one txidAttested is true | COMMERCE_CLAIM_METHOD_RULE"
      - "V13 | an ingested crypto_request or crypto_request_cancel is signed by the obligation payee and its address is valid for the chain | COMMERCE_STATEMENT_INVALID"
      - "V14 | the request's asset descriptor equals the local CurrencyDef (F09.S03.M01) | COMMERCE_CURRENCY_MISMATCH"
      - "V15 | verifier lookups run only when privacy.consent.check grants purpose chain_lookup for the endpoint, and carry no DID, device-key signature, relay access token or cookie | PRECONDITION_FAILED"
  workflow_state_machine:
    requirements:
      - Requests and observations follow the declared machines; any other transition is refused with CONFLICT_STATE.
      - An observation advances only on data from a configured ChainVerifierPort adapter; with none configured no observation is created and the claim stays claimed (COM-5).
      - A reorg moves a confirmed or pending observation to reorged; a reorged observation returns to pending if the transaction reappears and becomes failed after the grace period (24 h Bitcoin, 6 h EVM) or immediately for a reverted EVM transaction.
      - Observation stops when the claim reaches a terminal state, the claim expires after 14 days, or the user removes the verifier.
      - commerce.payment.confirming is emitted only for a transaction whose destination, asset and amount match the request and whose inclusion is above chainTipAtCreation; a transaction that does not match (underpaid, wrong_address, wrong_asset, before_request) or reverts moves the observation to mismatched or failed and emits commerce.payment.failed with that reason, labelled 'transaction does not match request'.
      - Every increase of confirmations on a confirmed observation emits commerce.payment.confirming with confirmations and requiredConfirmations and refreshes lastProgressAt; EVM observations show 'awaiting finalized checkpoint' instead of N of M.
      - Observations are per vault - payer and payee each run their own verifier - and in the payee's vault commerce.payment.finalized makes F09.S01.M01 sign classrup.commerce.payment_ack/v1 with verification.source chain; the payer's vault shows its own final as 'final per your verifier; payee has not confirmed' until that statement arrives.
      - final is set only when the finality policy is met and is terminal; for 100 further blocks the observation keeps a light watch, and a replaced inclusion block raises a deep-reorg alert without regressing the observation or the claim.
      - An underpaid transaction leaves the request claimable for the remainder - the payer may claim the received amount and pay the rest in another transaction - and the request is settled only when final claims cover the amount.
    machines:
      - entity: CryptoPaymentRequest
        initial: open
        terminal: [settled, cancelled, expired]
        transitions:
          - "open -> claimed | event commerce.payment.claimed with method crypto referencing this request | claim id added; claim amount at most the uncovered remainder"
          - "claimed -> claimed | another claim references this request, or a claim becomes final while coveredAmount stays below amount | claimIds and coveredAmount updated"
          - "claimed -> open | event commerce.payment.failed or commerce.payment.expired for the last non-terminal claim | request validity remains; payer may submit another transaction"
          - "claimed -> settled | event commerce.payment.finalized, or commerce.payment.acknowledged with verificationSource chain from the payee, brings coveredAmount to the amount | finality reached for the whole amount"
          - "open -> cancelled | commerce.crypto_request.cancel by payee, or event commerce.deal.cancelled | signed cancel statement for a payee cancel; refused once claimed"
          - "claimed -> cancelled | event commerce.deal.cancelled for the Deal (unilateral cancel while no claim is acknowledged or final) | observations stopped"
          - "open -> expired | expiry sweep at expiresAt | no claim attached"
      - entity: ChainObservation
        initial: watching
        terminal: [final, failed, mismatched, stopped]
        transitions:
          - "watching -> pending | verifier finds the transaction in the mempool paying the request address in the requested asset at least the claim amount | emits commerce.payment.confirming with confirmations 0"
          - "watching -> confirmed | verifier finds an included matching transaction above chainTipAtCreation | emits commerce.payment.confirming then commerce.payment.confirmed in one transaction"
          - "watching -> mismatched | verifier finds the transaction but matchResult is underpaid, wrong_address, wrong_asset or before_request | no confirming event; emits commerce.payment.failed with that reason and receivedAmount; label 'transaction does not match request'"
          - "pending -> confirmed | transaction included above chainTipAtCreation and destination, amount and asset still match | emits commerce.payment.confirmed"
          - "pending -> mismatched | at inclusion the transaction no longer matches the request (for example replaced by a transaction paying elsewhere) | emits commerce.payment.failed with that reason"
          - "pending -> failed | EVM receipt status is failed | emits commerce.payment.failed with reason reverted"
          - "confirmed -> confirmed | confirmations increased since the last check | emits commerce.payment.confirming with confirmations and requiredConfirmations; lastProgressAt refreshed"
          - "confirmed -> final | finality policy met (Bitcoin 6 confirmations, EVM block at or below finalized tag) | emits commerce.payment.finalized; postFinalWatchUntil set to final height + 100"
          - "pending -> reorged | transaction no longer found or inclusion block replaced | emits commerce.payment.reorged"
          - "confirmed -> reorged | inclusion block replaced or transaction no longer found | emits commerce.payment.reorged"
          - "reorged -> pending | transaction seen again and still matching | emits commerce.payment.confirming"
          - "reorged -> mismatched | transaction seen again but no longer matching the request | emits commerce.payment.failed with that reason"
          - "reorged -> failed | not seen again within 24 h Bitcoin or 6 h EVM, or EVM receipt status is failed | emits commerce.payment.failed with reason absent or reverted"
          - "watching -> stopped | claim terminal, claim expired or verifier removed | no event"
          - "pending -> stopped | claim terminal, claim expired or verifier removed | no event"
          - "confirmed -> stopped | claim terminal other than final, claim expired or verifier removed | no event"
          - "reorged -> stopped | claim terminal, claim expired or verifier removed | no event"
    timeouts:
      - "Polling: one chain-tip request per configured endpoint per interval (Bitcoin 60 s, EVM 24 s) while the PWA is running; per-observation calls only when the tip moved since that observation's lastTipSeen, and for EVM observations past inclusion at most every 5 min; exponential backoff to 10 min on endpoint errors; periodic background sync every 15 min where the browser allows."
      - "Poll budget: 900 endpoint calls per hour per vault (tip polls for two chains with two endpoints each use at most 420). When the budget is reached, observations closest to finality are checked first, the per-observation interval doubles up to 10 min, deferred observations set budgetPausedAt and show 'verification paused - check budget reached', and tip polls continue."
      - "Request expiry sweep every 5 min; default request validity 7 days."
      - "Reorg grace: 24 h for Bitcoin and 6 h for EVM chains before failed."
      - "Post-final watch: 100 blocks after final on tip changes within the budget; a replaced inclusion block sets deepReorgAlertAt and shows the alert to the parties without a state change."
      - "Held claims: the txid is looked up on each poll for 24 h; when found the claim is released to F09.S01.M01 for signing and sending, otherwise it is discarded locally with its txRef."
  commands_queries_events:
    requirements:
      - Request commands are vault commands that produce the signed statements classrup.commerce.crypto_request/v1 and classrup.commerce.crypto_request_cancel/v1; configure and refresh are vault-local with no statement and no relay command.
      - Observation transitions emit the catalog events into the vault outbox in the same IndexedDB transaction as the observation update; the extra event commerce.payment.failed is also emitted.
      - The module consumes the claim and Deal events to start and stop observation and never writes a PaymentClaim status directly.
      - The module registers a StatementHandlerPort handler with F09.S01.M01 for classrup.commerce.crypto_request/v1 and classrup.commerce.crypto_request_cancel/v1 (signer - obligation payee) that checks the signer role, re-validates address, chain and asset descriptor, deduplicates by cid, buffers statements whose Deal is unknown for 24 h, quarantines with reasons signer_not_payee, address_invalid, asset_mismatch or request_unknown, and drops statements from blocked dids silently.
      - Every commerce.payment.* event this module produces carries contextRef, obligationId, payerId and payeeId besides claimId and dealId, so consumers route and filter without reading the Deal (N4, N5).
      - The crypto MethodRulePort returns fail for invalid, secret-looking, reused or out-of-request input, hold(txid_lookup_pending) while a configured verifier has not found the txid, and release or discard through the F09.S01.M01 callbacks; with no verifier it fails with COMMERCE_CLAIM_METHOD_RULE unless txidAttested is true.
    commands:
      - name: commerce.crypto_request.create
        capability: commerce.crypto_request.create
        input: "[vault command, produces signed statement classrup.commerce.crypto_request/v1] { dealId, obligationId, chainId, asset, address, amount: Money, validForMs? (default 604800000, 3600000..1209600000) }; chainTipAtCreation and assetDescriptor are filled by the vault"
        output: "{ requestId, revision: 1, requestCid, expiresAt, chainTipAtCreation?, peerSync }"
        errors: [VALIDATION_FAILED, NOT_FOUND, FORBIDDEN, CONFLICT_STATE, COMMERCE_CRYPTO_CHAIN_DISABLED, COMMERCE_CRYPTO_ADDRESS_INVALID, COMMERCE_CRYPTO_ADDRESS_REUSED, COMMERCE_CRYPTO_SECRET_REJECTED]
        emits: []
        idempotent: true
      - name: commerce.crypto_request.cancel
        capability: commerce.crypto_request.cancel
        input: "[vault command, produces signed statement classrup.commerce.crypto_request_cancel/v1] { requestId, expectedRevision }"
        output: "{ requestId, revision, status: cancelled }"
        errors: [NOT_FOUND, FORBIDDEN, CONFLICT_REVISION, CONFLICT_STATE]
        emits: []
        idempotent: true
      - name: commerce.crypto_verifier.configure
        capability: commerce.crypto_verifier.configure
        input: "[vault command, local setting] { chainId, endpoints: [{kind: own-node|esplora|evm-jsonrpc|relay, url, apiKeyRef?}] (1..2), quorum?: 1|2 }; requests never carry a DID, device-key signature or relay access token"
        output: "{ chainId, endpoints, testedAt, ok, consent: granted|missing }"
        errors: [VALIDATION_FAILED, COMMERCE_CRYPTO_CHAIN_DISABLED, DEPENDENCY_UNAVAILABLE, PRECONDITION_FAILED]
        emits: []
        idempotent: true
      - name: commerce.crypto_observation.refresh
        capability: commerce.crypto_observation.refresh
        input: "[vault command, local] { claimId }"
        output: "{ observationId, status, confirmations, checkedAt, label }"
        errors: [NOT_FOUND, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, PRECONDITION_FAILED, COMMERCE_CRYPTO_NO_VERIFIER]
        emits: [commerce.payment.confirming, commerce.payment.confirmed, commerce.payment.finalized, commerce.payment.reorged, commerce.payment.failed]
        idempotent: true
    queries:
      - name: commerce.crypto_request.get
        capability: commerce.crypto_request.read
        input: "{ requestId }"
        output: "{ request: CryptoPaymentRequest, observations: ChainObservation[] }"
        errors: [NOT_FOUND]
      - name: commerce.crypto_observation.get_for_claim
        capability: commerce.crypto_request.read
        input: "{ claimId }"
        output: "{ observation: ChainObservation, label: string, deepReorgAlert?, budgetPaused? }"
        errors: [NOT_FOUND]
      - name: commerce.crypto_observation.diagnostics
        capability: commerce.crypto_request.read
        input: "{ since? }"
        output: "{ polls, disagreements, reorgs, deepReorgAlerts, mismatches, budgetUsed, budgetPaused } local diagnostics only"
        errors: []
    note: >-
      Statement registry (N2, registered in F11.S01.M01): classrup.commerce.crypto_request/v1 - obligation payee;
      classrup.commerce.crypto_request_cancel/v1 - obligation payee. Both reach this module through the F09.S01.M01 ingest
      dispatcher and the StatementHandlerPort handler registered here, which mirrors the request in the payer's vault with origin
      peer. MethodRulePort crypto rule - check(claimInput) -> fail(COMMERCE_CRYPTO_TXID_INVALID | COMMERCE_CRYPTO_SECRET_REJECTED |
      COMMERCE_CRYPTO_TX_REUSED | COMMERCE_CRYPTO_REQUEST_NOT_OPEN | COMMERCE_CLAIM_METHOD_RULE), pass({requestId, requestCid}) or
      hold(txid_lookup_pending); release(claimId) when the verifier finds the txid, discard(claimId) after 24 h. ChainVerifierPort
      {tip(chainId), tx(chainId, txid), finalized(chainId)} with adapters own-node, esplora, evm-jsonrpc and relay (relay-signed
      observations verified with F11.S01.M03). Lookups are a third-party disclosure: privacy.consent.check purpose chain_lookup
      must be granted for the endpoint, requests are unauthenticated (no DID, device-key signature, relay access token or cookie)
      and use a fetch context and connection separate from mailbox traffic. In the payee's vault the F09.S01.M01 consumer of
      commerce.payment.finalized signs classrup.commerce.payment_ack/v1 with verification.source chain.
    events_produced:
      - {type: commerce.payment.confirming, privacy: P2, payload: "{ claimId, dealId, contextRef, obligationId, payerId, payeeId, chainId, txid, confirmations, requiredConfirmations, finalityPolicy, verifierId, label }"}
      - {type: commerce.payment.confirmed, privacy: P2, payload: "{ claimId, dealId, contextRef, obligationId, payerId, payeeId, chainId, txid, confirmations, blockHeight, verifierId }"}
      - {type: commerce.payment.finalized, privacy: P2, payload: "{ claimId, dealId, contextRef, obligationId, payerId, payeeId, chainId, txid, finalityPolicy, checkedAt, verifierId, observerRole: payer|payee }"}
      - {type: commerce.payment.reorged, privacy: P2, payload: "{ claimId, dealId, contextRef, obligationId, payerId, payeeId, chainId, txid, previousBlockHash, reorgCount }"}
      - {type: commerce.payment.failed, privacy: P2, payload: "{ claimId, dealId, contextRef, obligationId, payerId, payeeId, chainId, txid, reason: absent|reverted|underpaid|wrong_address|wrong_asset|before_request, receivedAmount? }"}
    events_consumed:
      - {type: commerce.payment.claimed, effect: "for method crypto with a matching request, attach the claim to the request and create a watching ChainObservation when a verifier exists and chain_lookup consent is granted; otherwise leave the claim claimed"}
      - {type: commerce.payment.acknowledged, effect: "for a crypto claim acknowledged by the payee with verificationSource chain, add its amount to coveredAmount and settle the request when covered, also in a payer vault without its own verifier"}
      - {type: commerce.payment.expired, effect: "stop observation and reopen the request when validity remains and no other claim is pending"}
      - {type: commerce.deal.cancelled, effect: "cancel the open or claimed request of the Deal and stop observations"}
      - {type: privacy.deletion.completed, effect: "through the DeletionPort plan, replace the deleted principal's did in retained requests and observations with the per-deletion pseudonym; chain data cannot be erased and the UI says so"}
    errors:
      - "COMMERCE_CRYPTO_CHAIN_DISABLED | 422 | no | chain is not enabled or has no registered asset"
      - "COMMERCE_CRYPTO_ADDRESS_INVALID | 422 | no | address format, network or checksum is invalid"
      - "COMMERCE_CRYPTO_TXID_INVALID | 422 | no | transaction id format is invalid for the chain"
      - "COMMERCE_CRYPTO_SECRET_REJECTED | 422 | no | input looks like a private key or seed phrase and was discarded"
      - "COMMERCE_CRYPTO_REQUEST_NOT_OPEN | 409 | no | the payment request is not open, has no uncovered remainder or has expired"
      - "COMMERCE_CRYPTO_TX_REUSED | 409 | no | the transaction id is already attached to another claim"
      - "COMMERCE_CRYPTO_NO_VERIFIER | 409 | no | no chain verifier is configured; the claim stays claimed (unverified)"
      - "COMMERCE_CRYPTO_ADDRESS_REUSED | 409 | no | the receiving address is still used by another open or claimed request in this vault"
    example: |
      vault command commerce.crypto_request.create (payee vault)
      { "dealId": "5b1d0c7e-3a2f-8e41-9c0d-…", "obligationId": "o1", "chainId": "bitcoin-mainnet", "asset": "BTC",
        "address": "bc1qar0srrr7xfkvy5l643lydnw9re59gtzzwf5mdq", "amount": { "amount": "125000", "currency": "BTC" } }
      => { "requestId": "0192f3a9-…", "revision": 1, "requestCid": "sha256-1ab2…", "expiresAt": "2026-11-11T10:00:00.000Z", "chainTipAtCreation": 871204, "peerSync": "prepared" }
      payer vault: commerce.statement.ingest dispatches the request to this module's handler, which stores it with origin peer
      later in each vault: observation watching -> pending -> confirmed (2 of 6 per your verifier) -> final; each step emits commerce.payment.* with contextRef, obligationId, payerId and payeeId
  authorization_capabilities:
    requirements:
      - Under vault policy (CAP-8) only the unlocked principal mutates its vault; request creation and cancellation require the payee role in the Deal.
      - Incoming request statements are accepted only when signed by the obligation payee; otherwise they are quarantined.
      - No relay role has any capability over requests or observations; a relay-hosted verifier endpoint only returns signed observations the vault verifies.
      - Verifier requests carry no authority at all - no DID, device-key signature or relay access token - so a relay-hosted verifier cannot tie a lookup to the principal through authentication.
    capabilities:
      - "commerce.crypto_request.create | local-principal | principal is the obligation payee; crypto in allowedMethods; Deal open"
      - "commerce.crypto_request.cancel | local-principal | principal is the payee; request open"
      - "commerce.crypto_verifier.configure | local-principal | vault unlocked; HTTPS endpoint only; chain_lookup consent checked through privacy.consent.check"
      - "commerce.crypto_observation.refresh | local-principal | principal is a party of the Deal; at most 3 per minute per observation; within the poll budget"
      - "commerce.crypto_request.read | local-principal | principal is a party of the Deal"
  failure_recovery_idempotency:
    requirements:
      - Commands are idempotent per CTR-IDM-001 and observation updates are idempotent by (claimId, txid).
      - Endpoint failures never change claim status; the observation keeps its last good state and shows when it was last checked.
      - Conflicting data from two endpoints or an inconsistent single endpoint freezes progress and warns the user instead of picking a winner.
    idempotency: "Vault command ID recorded for 24 h; observation upserts keyed by (vault, claim, txid); consumed events deduplicated in the inbox; request statements deduplicated by cid in the ingest handler."
    concurrency: "expectedRevision on cancel; partial unique indexes allow one open or claimed request per obligation and one per address; observation loop holds a Web Lock commerce-chain per vault so two tabs share one tip poll and one budget."
    retries: "Endpoint calls: 3 attempts per poll with 1 s, 2 s, 4 s backoff and 8 s timeout, each attempt counted against the hourly budget; poll backoff doubles to 10 min; refresh failures return DEPENDENCY_UNAVAILABLE (retryable)."
    offline: "Requests and cancellations commit locally and queue statements. Observation pauses offline; on reconnect it catches up from the chain, so a missed 3-day window is verified at open. A crypto claim made offline with a verifier configured stays held until the txid lookup succeeds."
    partial_failure: "A failure after the verifier answered but before commit discards the answer; the next poll repeats it. A partially applied reorg cannot happen because status, confirmations and event outbox row commit in one IndexedDB transaction."
  privacy_retention_abuse:
    requirements:
      - Receiving addresses, txids and observations are P2 and never appear in public projections, logs at P2 detail or notifications; addresses are shared only inside end-to-end encrypted envelopes to the payer.
      - The module never requests, derives, stores or logs private keys, seed phrases or signatures that authorize spending; secret-looking input is rejected and discarded.
      - A user-configured verifier endpoint learns which transactions and addresses the user queries; the UI says so before the first lookup and defaults to the user's own node or a direct endpoint, with a relay endpoint only as an explicit choice.
      - Verifier lookups are an explicit third-party disclosure gated by privacy.consent.check purpose chain_lookup; requests are unauthenticated and unlinkable (no DID, device-key signature, relay access token or cookie) and use a connection separate from mailbox traffic (PRV-5).
      - Replay of an older or third-party transaction is blocked by the chain tip signed into each request and by refusing an address still used by another open or claimed request in the vault.
      - The module registers ExportSectionPort (section commerce.crypto), DeletionPort (pseudonymization of retained requests and observations) and RetentionPurgePort (RET-EVIDENCE with 90-day observation compaction) with F10 (N6), annotates every field with its F10.S02.M02 class, and consumes privacy.deletion.completed.
      - Request statements from blocked dids are dropped silently (N7, F07.S02.M02), and ingest uses the bounded quarantine of F09.S01.M01 (500 entries or 5 MiB, oldest-first eviction), dropping statements from dids that are party to no known Deal once it is full.
    data:
      - "CryptoPaymentRequest and ChainObservation: P2 (parties). Verifier endpoint URLs: P3; API keys: P4 held in the vault key store; field classes annotated per F10.S02.M02."
      - "On-chain data is public; linking a pseudonym to an address is the sensitive part, so addresses are never published and verifier lookups never carry identity."
    retention:
      - "RET-EVIDENCE (2 years after last related activity) through the RetentionPurgePort; observations may be compacted after 90 days to the final status, txid, block hash and verifier ID."
      - "On deletion: did pseudonymized in retained records; chain data cannot be erased and the UI says so."
    threats:
      - "T01 | Payee address swapped by an attacker in transit | address inside a signed statement over JCS; payer UI shows the address checksum groups and asks to compare the first and last 6 characters"
      - "T02 | Payer sends a fake txid to get a completed state | claim stays claimed until a configured verifier matches address, amount and asset; wrong or absent data never confirms"
      - "T03 | Malicious or compromised verifier endpoint reports false finality | trust label shows endpoint; optional 2-of-2 quorum; relay-signed observations are labelled; completion needs the payee's own verifier; payee can always dispute"
      - "T04 | Reorg after the goods were released | reorged state is shown; UI warns not to release goods before final; Bitcoin 6 confirmations and EVM finalized tag are defaults; deep-reorg alert during the 100-block watch"
      - "T05 | Social engineering to reveal a seed phrase | validation rejects secret patterns; copy states the app never asks for keys"
      - "T06 | Address reuse links a payee's deals or lets an old payment be replayed | fresh address hint; an address still used by an open or claimed request is refused"
      - "T07 | Payer claims an older or third-party transaction to a reused address | chainTipAtCreation signed into the request; outputs at or below it fail with before_request"
      - "T08 | A raw private key pasted as a txid would be signed and sent | claim held unsigned and unsent until the verifier finds the txid or the payer attests it is public; residual disclosure to the chosen verifier stated in the UI"
      - "T09 | A relay verifier links the principal's DID to on-chain addresses | chain_lookup consent, unauthenticated requests on a separate connection, own node or direct endpoint by default"
      - "T10 | Sybil flood of request statements from fresh dids | shared bounded quarantine; non-party statements dropped once full; blocked senders dropped silently"
    abuse_controls:
      - "Manual refresh limit of 3 per minute per observation and a poll budget of 900 endpoint calls per hour per vault, with priority to observations closest to finality."
      - "Request creation limit of 20 per day per vault; ingest limit 20 statements per hour per known party, bounded shared quarantine for unknown senders."
  observability_performance:
    requirements:
      - The PWA sends no telemetry (OBS-7); endpoint latency, errors and reorg counts are kept in local diagnostics.
      - Status updates are applied within one poll interval of the verifier reporting them.
      - Verifier disagreement and reorg counts are visible to the user.
      - Polling stays within the per-vault budget - one tip request per endpoint per interval, per-observation calls only when the tip moved - and when the budget runs out observations closest to finality go first, intervals widen and the rest show 'verification paused'; manual refresh is limited to 3 per minute per observation.
    metrics:
      - "Local diagnostics: classrup_commerce_chain_polls_total{chain,kind=tip|tx,outcome=ok|error|disagreement}"
      - "Local diagnostics: classrup_commerce_chain_reorgs_total{chain,depth=pre_final|deep}"
      - "Local diagnostics: classrup_commerce_chain_mismatches_total{reason}"
      - "Local diagnostics: classrup_commerce_chain_budget_used (gauge per hour) and classrup_commerce_chain_budget_paused (gauge)"
      - "Local diagnostics: classrup_commerce_chain_final_latency_s{chain} (histogram)"
    logs:
      - "info observation.status {claimId, from, to, chain, correlationId} — txid hash prefix only (first 8 chars), no addresses, no amounts."
      - "warn observation.deep_reorg {claimId, chain, correlationId} — no addresses."
    budgets:
      - "Observation update commit p95 ≤ 100 ms local; a poll cycle for 20 active observations ≤ 3 s excluding network."
      - "Verifier timeout 8 s per call; 3 attempts; at most 900 endpoint calls per hour per vault."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement is covered by at least one automated test.
      - Adapter behavior is tested against recorded Esplora and EVM JSON-RPC fixtures with no network access in CI.
      - Reorg, underpayment, wrong asset and no-verifier scenarios are covered deterministically.
    fixtures: "Recorded fixtures: Bitcoin tx with 0, 1, 2, 3, 5, 6 confirmations, an orphaned block and a block replaced 40 blocks after final; a transaction to the request address included before chainTipAtCreation; EVM tx pre-finalized and finalized, reverted tx, USDC transfer from correct and wrong contract; two-vault setup (payer A, payee B) with a relay double and verifier doubles that record every request; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,02.R01 | create a request with valid and invalid addresses for each chain | valid request stored and signed; invalid returns COMMERCE_CRYPTO_ADDRESS_INVALID"
      - "T02 | unit | 01.R03,02.R02,07.R02 | inputs with a WIF key, an xprv string, and a 12-word phrase in note and txRef | COMMERCE_CRYPTO_SECRET_REJECTED, nothing stored or logged"
      - "T03 | unit | 02.R03,03.R02 | no verifier configured and a crypto claim made | claim stays claimed, verification.source self, no observation, COMMERCE_CRYPTO_NO_VERIFIER on refresh"
      - "T04 | integration | 02.R03,03.R05 | underpaid, wrong address, wrong token contract and reverted transactions | matchResult recorded; no commerce.payment.confirming emitted; commerce.payment.failed with the matching reason; claim never confirmed"
      - "T05 | property | 03.R01 | random verifier answer sequences | only declared transitions occur; final is never followed by another state"
      - "T06 | integration | 03.R03 | Bitcoin block orphaned at 2 confirmations then transaction re-included; and absent for 24 h | reorged then pending then confirmed; second case ends failed"
      - "T07 | integration | 03.R02,03.R04 | Bitcoin at 5 then 6 confirmations; EVM below then at finalized tag; claim expiry at 14 days | finalized only at 6 and finalized tag; observation stopped at expiry"
      - "T08 | contract | 04.R01,04.R02,09.R02 | execute each command and run an observation to final | outputs, envelopes and events validate against registry schemas"
      - "T09 | integration | 04.R03,06.R01 | consumed events delivered twice; same command ID replayed | one request and one observation; original result returned"
      - "T10 | abuse | 05.R01,05.R02,05.R03 | request signed by the payer; third-party statement; relay inspects traffic | quarantined or FORBIDDEN; relay sees only ciphertext"
      - "T11 | chaos | 06.R02,06.R03 | endpoint timeouts, two endpoints disagreeing, endpoint returning lower height | claim status unchanged, disagreement flagged, no progress applied"
      - "T12 | integration | 07.R01 | inspect outbound endpoint requests and local logs | only txid or address lookups to the configured endpoint; no addresses or amounts in logs"
      - "T13 | abuse | 08.R04 | 4 refreshes in one minute | 4th returns RATE_LIMITED"
      - "T14 | integration | 08.R02 | app closed for 3 days with the transaction finalized meanwhile | on open the observation catches up within one poll interval and reaches final with checkedAt updated"
      - "T15 | load | 08.R01,08.R02 | 20 active observations polled for 10 minutes | commit p95 ≤ 100 ms, poll cycle ≤ 3 s, no telemetry sent"
      - "T16 | unit | 09.R01,09.R03 | traceability tool run and fixture coverage check | every PS-068 requirement maps to a passing test"
      - "T17 | integration | 10.R01,10.R02,10.R03 | export, import to fresh vault, roll back one release | requests and observations round-trip; imported open observations restart as watching"
      - "T18 | unit | 02.R04,04.R06 | with a verifier configured, claim with a 0x plus 64-hex value the verifier never finds, then with a real txid; without a verifier, claim without and with txidAttested | first held with sendHold txid_lookup_pending, never signed into a claim or sent to the payee, discarded after 24 h; real txid released and sent; without verifier refused with COMMERCE_CLAIM_METHOD_RULE until attested"
      - "T19 | integration | 03.R05,02.R03 | each matchResult underpaid, wrong_address, wrong_asset, before_request and reverted, from watching, pending and reorged | observation mismatched or failed; commerce.payment.failed carries the reason; label 'transaction does not match request'; no confirming event"
      - "T20 | integration | 03.R06 | Bitcoin confirmations 1, 2, 3 then 6; EVM transaction before and at the finalized tag | confirming emitted at each increase with confirmations and requiredConfirmations and lastProgressAt refreshed; EVM label 'awaiting finalized checkpoint', never 'N of 0'"
      - "T21 | integration | 03.R07 | vaults A and B with a verifier only in payer vault A; later B configures one | A reads 'final per your verifier; payee has not confirmed' and its request stays claimed; after B finalizes, F09.S01.M01 in B signs payment_ack with source chain and both vaults settle the request and complete the Deal"
      - "T22 | integration | 03.R08 | transaction final at 6 confirmations, inclusion block replaced 40 blocks later, then 100 blocks pass | observation stays final, deepReorgAlertAt set and shown, claim not regressed; watch ends after 100 blocks"
      - "T23 | integration | 03.R09,01.R05 | transaction underpaid by 4 000 sats, then a claim for the received amount and a second transaction for the remainder | first claim failed underpaid; the next two claims attach to the same request; request settled only when both are final"
      - "T24 | abuse | 01.R04,02.R05,07.R05 | a transaction to a reused address included before chainTipAtCreation is claimed for a new request; payee creates a second open request with an address still in use | claim fails with before_request; second request refused with COMMERCE_CRYPTO_ADDRESS_REUSED"
      - "T25 | integration | 07.R04,05.R04 | inspect every verifier request (own node, direct endpoint, relay endpoint) with chain_lookup consent granted and then withdrawn | no DID, device-key signature, relay access token or cookie; connection separate from mailbox traffic; with consent withdrawn no lookup happens and refresh returns PRECONDITION_FAILED"
      - "T26 | load | 08.R04 | 60 active observations with two endpoints per chain for one hour | at most 900 endpoint calls; observations closest to finality checked first; deferred ones show 'verification paused - check budget reached'; tip polls continue"
      - "T27 | integration | 04.R04 | payer vault ingests a crypto_request signed by the payee, one signed by the payer, one with an invalid address, one with an 18-decimal USDC descriptor, a duplicate and one from a blocked did | first stored with origin peer and its address; then signer_not_payee, address_invalid and asset_mismatch (COMMERCE_CURRENCY_MISMATCH) quarantined; duplicate no-op; blocked dropped silently"
      - "T28 | contract | 04.R05 | assert every produced event against the expectations of F09.S01.M01, F01.S01.M03, F05.S01.M02, F03.S02.M02, F02.S04.M01 and F13.S01.M03 | each commerce.payment.* event carries contextRef, obligationId, payerId and payeeId; commerce.payment.finalized carries the obligationId of the claim's Deal obligation"
      - "T29 | integration | 07.R06 | export, deletion and retention purge driven by F10 | section commerce.crypto exported without verifier settings; DeletionPort pseudonymizes the principal; RetentionPurgePort purges after RET-EVIDENCE; every field carries an F10.S02.M02 class"
      - "T30 | abuse | 07.R07 | 10 000 fresh dids send crypto_request statements to vault A; blocked payee sends one | quarantine stays within 500 entries or 5 MiB; non-party statements dropped once full; blocked statement dropped silently"
      - "T31 | unit | 08.R03 | two endpoints disagree twice and one reorg and one deep reorg occur; diagnostics opened | commerce.crypto_observation.diagnostics and the verification panel show 2 disagreements, 1 reorg and 1 deep-reorg alert"
      - "T32 | e2e | 07.R03 | open verifier settings and trigger the first lookup | disclosure 'This endpoint learns which transactions and addresses you look up' shown before the lookup; own node or direct endpoint preselected; axe zero serious issues"
    acceptance:
      - All tests T01 to T32 pass in CI.
      - With no verifier configured, no crypto claim ever leaves claimed.
      - Recognizable secret formats (WIF, xprv, BIP39 phrases) are rejected before storage or logging, and a value in txid format is never signed into a claim or sent to the payee until a verifier found it on chain or the payer attested it is a public transaction ID; the residual risk that the lookup discloses a mistyped key to the user's chosen verifier is stated in the UI.
      - final is set only when the finality policy is met; a reorg before final is always visible, and a reorg after final raises a deep-reorg alert without regressing state.
      - No transaction that does not match its request ever produces a confirming label.
      - Crypto observation status is per vault and labelled according to that vault's verifier, and crypto-driven completion converges through the payee's signed chain acknowledgement.
  import_export_backup_rollback:
    requirements:
      - The vault export contains the principal's crypto requests and observations with signed request statements in the section commerce.crypto.
      - Import verifies signatures and re-validates addresses; open observations restart as watching and are re-verified rather than trusted.
      - Schema changes follow expand/contract and keep v1 readable for 180 days.
    export: "ExportSectionPort section commerce.crypto in classrup-export/v1; one line per CryptoPaymentRequest and ChainObservation (schemas classrup.commerce.crypto_request/v1, classrup.commerce.chain_observation/v1). Verifier endpoint settings, consent and API keys are excluded."
    import: "Observations with final status import as read-only evidence marked imported-not-reverified; non-final observations import as watching; request statements are verified again and invalid ones are quarantined."
    backup: "The vault export is the primary backup (IOX-6); relays hold no requests or observations."
    migration_rollback: "Additive fields only in v1 (chainTipAtCreation, coveredAmount, origin, post-final watch fields); rollback is safe because older readers ignore new optional fields. A change to a finality policy requires a new policy identifier and never rewrites stored observations."
