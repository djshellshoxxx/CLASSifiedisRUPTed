# F09.S02.M02 Disputes (ADR-0015, ADR-0016). Shared by deals, cycles, bookings and rentals. Outcomes cannot move money.
id: F09.S02.M02
scope: MVP
summary: >-
  A shared dispute case for any context that has parties and evidence: payment claims and deals, barter cycles, service
  bookings, rental deposits and rental damage. Context modules register a DisputeContextPort resolver that returns the parties
  and the signed context cid, so every vault derives the same respondents. The parties exchange signed evidence references and
  responses directly or through their relays, with attachments as metadata-stripped MediaBlobs of at most 5 MiB sent as
  end-to-end encrypted attachments. Every party of the case may jointly choose an optional mediator; a mediator's link to the
  relay it moderates is proved only by a relay-signed directory entry, and a self-declared mediator cannot decide anything
  alone. Outcomes are signed statements - no-fault close, refund claimed, return agreed, or enforcement referral - with an
  advisory disposition consumers map. An outcome records what was decided or asserted; it never moves, freezes or releases
  money, and the platform has no power to force a party.
responsibilities:
  - Own DisputeCase mirrored in each party's vault, opened by a signed statement classrup.commerce.dispute/v1 that references the context {type, id}.
  - Collect evidence references (message cids, receipts, claims, attachment hashes) as signed statements classrup.commerce.dispute_evidence/v1, with per-party limits.
  - Support an optional mediator selected by every party of the case (opener and all respondents) through signed selection and acceptance statements, with evidence shared to the mediator only by explicit party action.
  - Record outcomes as signed statements classrup.commerce.dispute_outcome/v1, requiring acceptance by every party for refund_claimed and return_agreed and none for no_fault_close or enforcement_referral decided by an active mediator whose relay directory entry verifies.
  - Run the case clock (7 days response, 14 days evidence, 7 days proposal validity, 30 days inactivity lapse) and emit dispute events.
  - Provide the intake used by services disputes (F03.S02.M03) and by the payment-disputed prompt, without opening cases automatically.
  - Resolve contexts through the DisputeContextPort {resolve(contextRef) -> {parties[{did, role}], contextCid}} registered by F09.S01.M01 (deal, payment_claim), F02.S03.M04 (cycle), F03.S02.M03 (booking), F05.S01.M02 (rental_deposit) and F05.S02.M03 (rental_damage).
  - Route attachment evidence through F15.S02.M03 MediaBlob refs (≤ 5 MiB), stripped by F10.S02.M03 before encryption and sent as end-to-end encrypted attachments (FLOW-10 format, per-object key) through the injected AttachmentTransportPort, which the vault composition binds to the F08.S01.M01 mailbox adapter.
  - Carry an advisory, non-executable disposition in outcomes and in commerce.dispute.resolved, and publish the default mapping from outcome types for deal and payment_claim contexts.
  - Keep statements of an open case from blocked parties as evidence and allow a case against a blocked party.
non_responsibilities:
  - Moving, refunding, freezing or releasing money; a refund_claimed outcome is an advisory record and the respondent settles through a new Deal (F09.S01.M01).
  - Global bans, takedowns or suspensions; an enforcement_referral is a referral to the mediator's relay, which acts only on what it hosts under its own policy.
  - Moderation reports and appeals about content (F12), and service-specific intake forms (F03.S02.M03).
  - Deciding who the parties of a context are; the context module's DisputeContextPort resolver answers that.
  - "Future: multi-mediator panels, jury-style community review, and binding arbitration through third-party providers."
depends_on: [F09.S01.M01, F09.S02.M01, F09.S03.M01, F09.S03.M03, F07.S01.M01, F07.S02.M01, F07.S02.M02, F11.S01.M01, F11.S01.M03, F16.S02.M03, F15.S02.M03, F10.S02.M03, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, CTR-COM-001, CTR-MNY-001, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-PRV-001, CTR-FED-001]
user_stories:
  - As a buyer who paid but did not receive the item, I open a case on the deal, attach my messages and receipt, and see the seller's signed response.
  - As a seller, I respond with my own evidence and propose a no-fault close or a return.
  - As any party, I can propose a mediator from a relay that publishes a signed mediator directory, and nothing is shared with the mediator until every party has accepted and I choose to share an item.
  - As a participant in a barter cycle, I open a case referencing the cycle and the other participants returned by the cycle's resolver are respondents.
  - As someone who blocked a fraudster, I can still open a case against them, and their answers in my case are kept as evidence without notifying me.
edge_cases:
  - The respondent never answers; after 7 days the case moves to evidence with noResponseReceivedHere true, and the opener may propose an outcome that the other party can still accept later.
  - Both parties propose different outcomes at the same time; both proposals are kept as evidence, the case needs one proposal accepted by all parties, and conflicting accepted outcomes freeze the case with COMMERCE_DISPUTE_FORK.
  - The selected mediator's relay becomes unreachable; the case stays in mediation with the mediator marked unavailable after 7 days and the parties may select another or resolve between themselves.
  - An attachment larger than 5 MiB or the 21st item of a party is refused with COMMERCE_DISPUTE_EVIDENCE_LIMIT.
  - The opener withdraws after the respondent already accepted a proposal; the accepted outcome stands only if all parties' acceptances are already held, otherwise the case is withdrawn.
  - A party opens a second case on the same context while one is open; refused with COMMERCE_DISPUTE_DUPLICATE and the existing case is shown.
  - A dispute statement arrives for a context the vault does not know; it is quarantined for 24 h pending the context statement, then dropped.
  - In a 3-party cycle the opener and one respondent accept a mediator; the mediator stays proposed and sees nothing until the third participant also signs acceptance.
  - A party selects a mediator did with no relay-signed directory entry (a sock puppet presented as a relay moderator); the mediator is labelled self-declared and its no_fault_close or enforcement_referral needs every party's acceptance, refused otherwise with COMMERCE_DISPUTE_MEDIATOR_UNVERIFIED.
  - A JPEG with GPS EXIF tags is attached; F10.S02.M03 strips EXIF, XMP and GPS before encryption, so the respondent and the mediator receive the image without location data.
  - The opener has blocked the respondent; the respondent's response and evidence in the open case are stored with notifications suppressed, and the timeline says 'responses from a party you blocked are hidden'; noResponseReceivedHere stays false.
  - A context type that no module registered (for example a legacy rental type) is refused with COMMERCE_DISPUTE_CONTEXT_INVALID.
  - 10 000 fresh dids each send one dispute statement; the bounded quarantine evicts the oldest entries and then drops statements from dids that are party to no known context.
  - F03.S02.M03 retries a booking case open with the same idempotencyRef (its linkId) after a crash; the existing case is returned and no second dispute statement is signed.
  - A services.dispute.opened event arrives with origin federated, or a local one for a booking whose case already exists; neither creates a case, and the local one only prefills evidence in the opener vault.
  - The owner opens a rental_damage case against a renter they blocked after the reservation was confirmed; the open is not refused and the renter's statements in the case are stored with notifications suppressed.
ux:
  screens:
    - "Open dispute: pick reason (not_received, not_as_described, payment_not_acknowledged, no_show, damage, other), describe in up to 1 000 characters, attach evidence (images stripped of location data, at most 5 MiB each), choose respondents (prefilled from the context resolver)."
    - "Case timeline: signed statements in order of arrival with sync state per statement, evidence list, countdown to the next deadline, 'responses from a party you blocked are hidden' when applicable, clear note 'ClassRup cannot move money or force anyone'."
    - "Mediator picker: relay-signed directory entries from selected relays with their published mediation policy, validity and a plain statement of what the relay can and cannot do; a mediator without a verified entry is labelled Self-declared."
    - "Outcome screen: outcome type, optional advisory refund amount and disposition (continue, settled, cancelled, waived, favoured party), note, Accept and Reject buttons for each party, and who has accepted so far."
  states: [loading, empty, opened, awaiting-response, evidence, mediation, mediator-pending-acceptance, self-declared-mediator, outcome-proposed, resolved, withdrawn, frozen-conflict, pending-offline]
  a11y:
    - Timeline is an ordered list with each statement announced with its author and sync state.
    - Deadlines are text dates, not only countdown graphics, and changes are announced politely.
    - Accept and Reject buttons have names including the outcome type and are at least 44 by 44 px.
processes:
  domain_schema:
    requirements:
      - A DisputeCase stores contextRef {type, id}, opener, respondents, optional mediator, reason, evidence references, outcome, status, deadlines and revision, mirrored in each party's vault from signed statements.
      - Cases are P2 (parties and an explicitly accepted mediator), retained as RET-EVIDENCE, and never public or federated.
      - Outcome and money are decoupled by schema, because the outcome has no executable fields, only advisory ones - an optional advisory refund Money amount and an advisory disposition {kind, favouredDid, agreedAmount}.
      - Attachment evidence is an F15.S02.M03 MediaBlob ref (blob:sha256-<base64url>, at most 5 MiB) whose bytes were stripped of EXIF, XMP, IPTC and GPS metadata by F10.S02.M03 before encryption; the case stores only refs, hashes, sizes and captions.
      - A mediator record embeds the relay-signed directory entry {mediatorDid, relayId, policyUrl, validUntil} when one exists and its trust (relay_verified or self_declared), plus the set of parties that signed acceptance.
      - The case stores the parties [{did, role}] and contextCid returned by DisputeContextPort.resolve when it was opened, so every mirror derives the same respondents.
    entities:
      - name: DisputeCase
        schema: classrup.commerce.dispute/v1
        storage: device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuid — deterministic from sha256 of contextRef plus opener did plus openedSeq so mirrors converge"
          - "vaultId: uuidv7 — local vault scope (CTR-ID-001 tenant slot)"
          - "contextRef: object — {type: a DisputeContextPort-registered type - deal {id dealId} | payment_claim {id claimId} | cycle {id cycleId} | booking {id bookingId} | rental_deposit {id depositId, resolved by F05.S01.M02} | rental_damage {id damage claimId, resolved by F05.S02.M03}, id: uuid}; carried unchanged in every dispute statement and event"
          - "contextCid: string — cid of the signed context statement returned by DisputeContextPort.resolve"
          - "parties: array — [{did, role}] returned by DisputeContextPort.resolve; opener plus respondents, 2..20"
          - "openerId: did — party who opened"
          - "respondentIds: array — 1..19 dids"
          - "reason: enum — not_received | not_as_described | payment_not_acknowledged | no_show | damage | other"
          - "serviceScope?: object — {scope, scopeKey (1..200 chars), milestoneId?: uuid}; only for contextRef type booking, supplied by F03.S02.M03 and signed into classrup.commerce.dispute/v1"
          - "idempotencyRef?: string — caller reference (F03.S02.M03 linkId); a repeated open with the same value returns the existing case"
          - "description: string — 1..1000 code points plain text"
          - "evidence: array — up to 20 per party {id, authorId, kind: message|attachment|receipt|claim|statement|note, refCid (blob:sha256-<base64url> for attachments), sha256?, sizeBytes ≤ 5242880, stripped: boolean, caption ≤ 280, sharedWithMediator: boolean}"
          - "mediator?: object — {did, relayId, directoryEntry?: {mediatorDid, relayId, policyUrl, validUntil, relaySig}, trust: relay_verified|self_declared, acceptedBy: dids[], status: proposed|active|unavailable}"
          - "outcome?: object — {type: no_fault_close|refund_claimed|return_agreed|enforcement_referral, proposedBy: did, advisoryRefund?: Money, disposition?: {kind: continue|settled|cancelled|waived, favouredDid?, agreedAmount?: Money}, note ≤ 500, acceptedBy: dids[], rejectedBy: dids[], outcomeCid}"
          - "round: int — outcome proposal round, 1..3"
          - "noResponseReceivedHere: boolean — set when the 7-day response window passes without any respondent statement received in this vault (stored statements from blocked parties count as received)"
          - "hiddenFromBlocked: int — number of stored statements from parties this vault has blocked"
          - "status: enum — opened | evidence | mediation | outcome_proposed | resolved | withdrawn"
          - "resolution?: enum — no_fault_close | refund_claimed | return_agreed | enforcement_referral | lapsed (the FLOW-08 closed-unresolved outcome after 30 days of inactivity)"
          - "deadlines: object — {responseBy, evidenceBy, proposalBy, lapseAt} local clock"
          - "caseCid: string — sha256 of the opening statement"
          - "forkDetected: boolean — conflicting accepted outcomes seen"
          - "peerSync: object — per party sync state: local_committed | prepared | transport_acknowledged | peer_accepted"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC, local clock"
          - "updatedAt: timestamp — RFC 3339 UTC, local clock"
        invariants:
          - openerId is a party of the context and is not in respondentIds.
          - At most one non-terminal case per (contextRef, openerId).
          - resolution refund_claimed or return_agreed implies every party appears in outcome.acceptedBy.
          - No field or event of this module triggers a payment, refund, freeze or release; advisoryRefund and disposition are informational.
          - mediator.status active implies mediator.acceptedBy equals the full party set.
          - A resolution decided by a mediator alone implies mediator.trust relay_verified.
    sql: |
      CREATE TABLE commerce_dispute_case (
        id TEXT PRIMARY KEY, vault_id TEXT NOT NULL, context_type TEXT NOT NULL, context_id TEXT NOT NULL,
        opener_id TEXT NOT NULL, status TEXT NOT NULL, lapse_at TEXT NOT NULL, idempotency_ref TEXT, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX commerce_dispute_open ON commerce_dispute_case(vault_id, context_type, context_id, opener_id)
        WHERE status NOT IN ('resolved','withdrawn');
      CREATE UNIQUE INDEX commerce_dispute_idem ON commerce_dispute_case(vault_id, idempotency_ref) WHERE idempotency_ref IS NOT NULL;
  validation_rules:
    requirements:
      - Case and evidence input is validated strictly, including context resolution through the DisputeContextPort and party membership.
      - Incoming statements are verified for signature, signer role and chain position before any state change.
      - Outcome rules enforce who must accept and that outcomes carry no executable money action.
      - Context types are a registry - only types a module registered through DisputeContextPort are accepted, and an unregistered type or a context the resolver cannot resolve returns COMMERCE_DISPUTE_CONTEXT_INVALID.
      - A block never removes the right to dispute - commerce.dispute.open is never refused with BLOCKED_PARTY for any context type, including booking cases opened through the F03.S02.M03 port and rental_deposit or rental_damage cases of a reservation confirmed before the block (N7a), and serviceScope is accepted only for booking contexts.
    rules:
      - "V01 | contextRef.type is registered through DisputeContextPort and resolve(contextRef) returns parties that include the actor | COMMERCE_DISPUTE_CONTEXT_INVALID"
      - "V02 | respondents are the other parties returned by DisputeContextPort.resolve, between 1 and 19 | VALIDATION_FAILED"
      - "V03 | no non-terminal case exists for the same context and opener | COMMERCE_DISPUTE_DUPLICATE"
      - "V04 | description is 1 to 1000 code points plain text | VALIDATION_FAILED"
      - "V05 | evidence per party at most 20 items, each attachment a MediaBlob ref of at most 5 MiB, case total at most 50 MiB, caption at most 280 code points | COMMERCE_DISPUTE_EVIDENCE_LIMIT"
      - "V06 | evidence refCid resolves to a record the author holds or is an attachment hash the author supplies | VALIDATION_FAILED"
      - "V07 | mediator selection names a relayId and mediator did; the mediator becomes active only when every party of the case (opener and all respondents) has signed acceptance, and no evidence is shared before that | COMMERCE_DISPUTE_MEDIATOR_UNAVAILABLE"
      - "V08 | outcome type is one of the four types; advisoryRefund only with refund_claimed and in a registry currency | COMMERCE_DISPUTE_OUTCOME_INVALID"
      - "V09 | no_fault_close and enforcement_referral by an active, relay-verified mediator need no acceptance; refund_claimed, return_agreed and any outcome proposed by a party or a self-declared mediator need acceptance by every party | COMMERCE_DISPUTE_OUTCOME_INVALID"
      - "V10 | statement signature valid and signer authorized for the role in the case | COMMERCE_DISPUTE_STATEMENT_INVALID"
      - "V11 | outcome proposal round is at most 3 | CONFLICT_STATE"
      - "V12 | a mediator-only outcome requires a directory entry signed by the named relay's key, naming that mediator did and relayId and not past validUntil | COMMERCE_DISPUTE_MEDIATOR_UNVERIFIED"
      - "V13 | a disposition is advisory only - kind continue, settled, cancelled or waived, favouredDid one of the parties, agreedAmount in a registry currency and only with kind settled | COMMERCE_DISPUTE_OUTCOME_INVALID"
      - "V14 | attachment bytes passed F10.S02.M03 stripping before encryption and the MediaBlob digest matches the bytes | VALIDATION_FAILED"
      - "V15 | a statement from a blocked did is dropped silently only when it belongs to no open case of this vault; statements of an open case are stored with notifications suppressed, and open is allowed against a blocked party for every context type (booking, rental_deposit and rental_damage included) | BLOCKED_PARTY"
      - "V16 | serviceScope is present only with contextRef type booking and carries scope, a scopeKey of 1 to 200 characters and an optional milestoneId uuid; idempotencyRef is at most 64 characters | VALIDATION_FAILED"
  workflow_state_machine:
    requirements:
      - Cases follow the declared lifecycle; any transition not listed is refused with CONFLICT_STATE.
      - Terminal states have no exits and no state change executes any money movement.
      - Conflicting signed outcomes freeze the case for renegotiation instead of choosing a winner.
      - The case clock is evaluated locally and every deadline is shown as a date.
      - The mediator becomes active only when acceptedBy equals the full party set of the case (opener and all respondents), and a self-declared mediator may propose outcomes but every outcome it proposes needs acceptance by every party.
    machines:
      - entity: DisputeCase
        initial: opened
        terminal: [resolved, withdrawn]
        transitions:
          - "opened -> evidence | respondent response statement, or response window of 7 days elapsed | noResponseReceivedHere set when elapsed without any respondent statement received here"
          - "opened -> mediation | every party of the case (opener and all respondents) signed acceptance of the mediator | mediator status active"
          - "evidence -> mediation | every party of the case (opener and all respondents) signed acceptance of the mediator | evidence shared with the mediator only by explicit party action, per item"
          - "evidence -> outcome_proposed | any party proposes an outcome, round 1 to 3 | proposal valid for 7 days; emits commerce.dispute.outcome_proposed"
          - "mediation -> outcome_proposed | mediator or a party proposes an outcome | proposal valid for 7 days; emits commerce.dispute.outcome_proposed"
          - "mediation -> resolved | active mediator with a relay-verified directory entry decides no_fault_close or enforcement_referral | signed outcome statement; emits commerce.dispute.resolved"
          - "outcome_proposed -> resolved | every required party accepted | emits commerce.dispute.resolved; no money moves"
          - "outcome_proposed -> evidence | a party rejected or proposal expired | round incremented; case continues"
          - "opened -> withdrawn | opener withdraws | signed statement; emits commerce.dispute.withdrawn"
          - "evidence -> withdrawn | opener withdraws | signed statement; emits commerce.dispute.withdrawn"
          - "mediation -> withdrawn | opener withdraws | signed statement; emits commerce.dispute.withdrawn"
          - "outcome_proposed -> withdrawn | opener withdraws before all acceptances are held | signed statement; emits commerce.dispute.withdrawn"
          - "opened -> resolved | inactivity sweep at 30 days | resolution lapsed; emits commerce.dispute.resolved"
          - "evidence -> resolved | inactivity sweep at 30 days | resolution lapsed; emits commerce.dispute.resolved"
          - "mediation -> resolved | inactivity sweep at 30 days | resolution lapsed; emits commerce.dispute.resolved"
    timeouts:
      - "Response window 7 days from opening; evidence window 14 days from the first response; proposal validity 7 days; inactivity lapse 30 days."
      - "Sweep every 5 min in the open vault and at unlock."
      - "Statements waiting for their context are quarantined for 24 h then dropped with reason context_unknown; the quarantine holds at most 500 entries or 5 MiB with oldest-first eviction."
      - "A proposed mediator that has not been accepted by every party within 7 days returns to none; an active mediator unreachable for 7 days is marked unavailable."
  commands_queries_events:
    requirements:
      - Open, add_evidence, respond, select_mediator, accept_mediator, propose_outcome, accept_outcome, reject_outcome and withdraw are vault commands that each produce a signed statement; ingest is an internal vault command; no command is a relay command.
      - Mediator actions run in the mediator's own vault as the same commands under role-in-statement authorization; a relay only publishes relay-signed mediator directory entries under its hosting policy.
      - The module consumes payment, services-dispute and deletion events to prefill drafts and pseudonymize retained records, and never opens a case automatically; services.dispute.opened at most prefills evidence in the opener vault and is ignored when origin is federated, because the F03.S02.M03 port call is the single creation path for booking cases (N21).
      - Event payloads carry the exact contextRef, openerId, respondentIds and parties [{did, role}] (N3, N4) - commerce.dispute.opened, evidence_added, outcome_proposed, resolved and withdrawn - resolved and withdrawn also carry caseCid for reputation (F07.S03.M01), resolved also carries contextCid, acceptedBy and outcomeCid, and opened carries serviceScope for booking cases.
      - dispute_outcome/v1 and commerce.dispute.resolved carry an advisory, non-executable disposition {kind continue|settled|cancelled|waived, favouredDid?, agreedAmount?}; when it is absent each consumer applies the outcome-type mapping in its own spec, and for deal and payment_claim contexts the default mapping in the note is normative.
      - Every dispute statement type is registered with its signer role in F11.S01.M01 and reaches commerce.dispute.ingest through the F09.S01.M01 ingest dispatcher (StatementHandlerPort), with cid deduplication, quarantine reasons and the block exception for open cases.
      - commerce.dispute.open accepts optional serviceScope {scope, scopeKey, milestoneId?} for booking contexts and idempotencyRef (the F03.S02.M03 linkId), signs serviceScope into classrup.commerce.dispute/v1, carries it in commerce.dispute.opened, and returns the existing case for a repeated idempotencyRef.
    commands:
      - name: commerce.dispute.open
        capability: commerce.dispute.open
        input: "[vault command, produces signed statement classrup.commerce.dispute/v1; never refused with BLOCKED_PARTY] { contextRef: {type, id}, reason, description, respondentIds? (default: the other parties from DisputeContextPort.resolve), evidence?, serviceScope?: {scope, scopeKey, milestoneId?} (booking only), idempotencyRef? (repeat returns the existing case) }"
        output: "{ caseId, revision: 1, caseCid, parties, deadlines, peerSync }"
        errors: [VALIDATION_FAILED, COMMERCE_DISPUTE_CONTEXT_INVALID, COMMERCE_DISPUTE_DUPLICATE, COMMERCE_DISPUTE_EVIDENCE_LIMIT]
        emits: [commerce.dispute.opened]
        idempotent: true
      - name: commerce.dispute.add_evidence
        capability: commerce.dispute.add_evidence
        input: "[vault command, produces signed statement classrup.commerce.dispute_evidence/v1; attachments are stripped by F10.S02.M03, stored as F15.S02.M03 MediaBlobs and sent as encrypted attachments through the AttachmentTransportPort] { caseId, expectedRevision, kind, refCid, sha256?, sizeBytes? (≤ 5242880), caption? }"
        output: "{ caseId, revision, evidenceId, peerSync }"
        errors: [NOT_FOUND, FORBIDDEN, CONFLICT_REVISION, CONFLICT_STATE, COMMERCE_DISPUTE_EVIDENCE_LIMIT, VALIDATION_FAILED]
        emits: [commerce.dispute.evidence_added]
        idempotent: true
      - name: commerce.dispute.respond
        capability: commerce.dispute.respond
        input: "[vault command, produces signed statement classrup.commerce.dispute_response/v1] { caseId, expectedRevision, response: accept_facts|contest|partial, description }"
        output: "{ caseId, revision, status }"
        errors: [NOT_FOUND, FORBIDDEN, CONFLICT_REVISION, CONFLICT_STATE, VALIDATION_FAILED]
        emits: []
        idempotent: true
      - name: commerce.dispute.select_mediator
        capability: commerce.dispute.select_mediator
        input: "[vault command, produces signed statement classrup.commerce.dispute_mediator/v1; the selection counts as the selector's acceptance] { caseId, expectedRevision, mediatorDid, relayId, directoryEntry? }"
        output: "{ caseId, revision, mediatorStatus, trust: relay_verified|self_declared, acceptedBy }"
        errors: [NOT_FOUND, FORBIDDEN, CONFLICT_REVISION, CONFLICT_STATE, COMMERCE_DISPUTE_MEDIATOR_UNAVAILABLE]
        emits: []
        idempotent: true
      - name: commerce.dispute.accept_mediator
        capability: commerce.dispute.accept_mediator
        input: "[vault command, produces signed statement classrup.commerce.dispute_mediator_accept/v1] { caseId, expectedRevision }"
        output: "{ caseId, revision, status, acceptedBy, mediatorStatus }"
        errors: [NOT_FOUND, FORBIDDEN, CONFLICT_REVISION, CONFLICT_STATE]
        emits: []
        idempotent: true
      - name: commerce.dispute.propose_outcome
        capability: commerce.dispute.propose_outcome
        input: "[vault command, produces signed statement classrup.commerce.dispute_outcome/v1] { caseId, expectedRevision, type, advisoryRefund?: Money, disposition?: {kind, favouredDid?, agreedAmount?}, note? }"
        output: "{ caseId, revision, status, round, proposalBy, requiresAcceptanceBy[] }"
        errors: [NOT_FOUND, FORBIDDEN, CONFLICT_REVISION, CONFLICT_STATE, COMMERCE_DISPUTE_OUTCOME_INVALID, COMMERCE_DISPUTE_MEDIATOR_UNVERIFIED]
        emits: [commerce.dispute.outcome_proposed, commerce.dispute.resolved]
        idempotent: true
      - name: commerce.dispute.accept_outcome
        capability: commerce.dispute.accept_outcome
        input: "[vault command, produces signed statement classrup.commerce.dispute_outcome_accept/v1] { caseId, expectedRevision, accept: boolean }"
        output: "{ caseId, revision, status, resolution? }"
        errors: [NOT_FOUND, FORBIDDEN, CONFLICT_REVISION, CONFLICT_STATE, COMMERCE_DISPUTE_FORK]
        emits: [commerce.dispute.resolved]
        idempotent: true
      - name: commerce.dispute.withdraw
        capability: commerce.dispute.withdraw
        input: "[vault command, produces signed statement classrup.commerce.dispute_withdraw/v1] { caseId, expectedRevision }"
        output: "{ caseId, revision, status: withdrawn }"
        errors: [NOT_FOUND, FORBIDDEN, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [commerce.dispute.withdrawn]
        idempotent: true
      - name: commerce.dispute.ingest
        capability: commerce.dispute.ingest
        input: "[vault command, internal; dispatched by F09.S01.M01 commerce.statement.ingest] { envelope: any commerce.dispute statement }"
        output: "{ outcome: applied|stored_blocked|buffered|quarantined|duplicate|dropped, reason? }"
        errors: [VALIDATION_FAILED, COMMERCE_DISPUTE_STATEMENT_INVALID, COMMERCE_DISPUTE_FORK, COMMERCE_DISPUTE_CONTEXT_INVALID, COMMERCE_DISPUTE_MEDIATOR_UNVERIFIED, UNSUPPORTED_SCHEMA_VERSION]
        emits: [commerce.dispute.opened, commerce.dispute.evidence_added, commerce.dispute.outcome_proposed, commerce.dispute.resolved, commerce.dispute.withdrawn]
        idempotent: true
    queries:
      - name: commerce.dispute.get
        capability: commerce.dispute.read
        input: "{ caseId }"
        output: "{ case: DisputeCase, statements: [{cid, type, signer, receivedAt, syncState, fromBlockedParty}] }"
        errors: [NOT_FOUND]
      - name: commerce.dispute.list_mine
        capability: commerce.dispute.read
        input: "{ status?: open|resolved|withdrawn|all, cursor?, limit ≤ 50 }"
        output: "{ items: DisputeCase[], nextCursor? }"
        errors: []
      - name: commerce.dispute.list_mediators
        capability: commerce.dispute.mediator_list
        input: "{ relayId }"
        output: "{ items: [{mediatorDid, relayId, displayName, languages[], policyUrl, validUntil, relaySig}] } relay-signed directory entries published by the relay under its hosting policy"
        errors: [DEPENDENCY_UNAVAILABLE]
    note: >-
      Statement registry (N2, registered in F11.S01.M01): classrup.commerce.dispute/v1 - opener, a party returned by
      DisputeContextPort.resolve; classrup.commerce.dispute_evidence/v1 - the authoring party (or the active mediator for a
      mediator note); classrup.commerce.dispute_response/v1 - a respondent; classrup.commerce.dispute_mediator/v1 - a party;
      classrup.commerce.dispute_mediator_accept/v1 - each party; classrup.commerce.dispute_outcome/v1 - a party or the active
      mediator; classrup.commerce.dispute_outcome_accept/v1 - each party; classrup.commerce.dispute_withdraw/v1 - the opener. All
      reach commerce.dispute.ingest through the F09.S01.M01 dispatcher (StatementHandlerPort). Ports - DisputeContextPort
      {types[], resolve(contextRef) -> {parties[{did, role}], contextCid} | unknown}, registered by F09.S01.M01 (deal, payment_claim),
      F02.S03.M04 (cycle), F03.S02.M03 (booking), F05.S01.M02 (rental_deposit) and F05.S02.M03 (rental_damage);
      AttachmentTransportPort {send(blobRef, recipients[], perObjectKey)} bound by the vault composition to the F08.S01.M01 mailbox
      adapter, so this module has no static dependency on the messaging feature. Mediator
      directory entry - {mediatorDid, relayId, policyUrl, validUntil} signed by the relay key (FED-2, F11.S01.M03) and verified by
      each vault against the key of that relay. Default disposition mapping for deal and payment_claim contexts, used when an
      outcome carries no disposition - no_fault_close -> continue; refund_claimed -> settled with agreedAmount = advisoryRefund
      (refund through a new Deal); return_agreed -> cancelled (parties sign a mutual deal_cancel); enforcement_referral ->
      continue; lapsed -> continue. Resolution lapsed is the FLOW-08 closed-unresolved outcome (unresolved after 30 days of
      inactivity); no separate closed_unresolved value exists. Every disposition is advisory and non-executable; consumers of other
      context types apply the mapping in their own specs. Booking cases are created only through the F03.S02.M03 port call with
      contextRef {booking, bookingId}, serviceScope and idempotencyRef (N21).
    events_produced:
      - {type: commerce.dispute.opened, privacy: P2, payload: "{ caseId, caseCid, contextRef, contextCid, openerId, respondentIds, parties[{did, role}], reason, serviceScope?: {scope, scopeKey, milestoneId?}, idempotencyRef? }"}
      - {type: commerce.dispute.evidence_added, privacy: P2, payload: "{ caseId, contextRef, evidenceId, authorId, kind, openerId, respondentIds, parties[{did, role}] }"}
      - {type: commerce.dispute.resolved, privacy: P2, payload: "{ caseId, caseCid, contextRef, contextCid, openerId, respondentIds, parties[{did, role}], resolution (lapsed = FLOW-08 closed-unresolved), outcomeType?, advisoryRefund?, disposition?: {kind, favouredDid?, agreedAmount?}, acceptedBy[] (parties that accepted the outcome), outcomeCid? (cid of the accepted dispute_outcome/v1; absent for lapsed) }"}
      - {type: commerce.dispute.outcome_proposed, privacy: P2, payload: "{ caseId, contextRef, openerId, respondentIds, parties[{did, role}], outcomeType, disposition?, proposedBy, round, proposalBy }"}
      - {type: commerce.dispute.withdrawn, privacy: P2, payload: "{ caseId, caseCid, contextRef, openerId, respondentIds, parties[{did, role}] }"}
    events_consumed:
      - {type: commerce.payment.disputed, effect: "create a prefilled draft case for the claim's payer and prompt them; never opens a case automatically"}
      - {type: services.dispute.opened, effect: "never creates a case; for origin local and a case already created by the F03.S02.M03 port call, at most prefill milestone evidence references in the opener vault; events with origin federated are ignored"}
      - {type: privacy.deletion.completed, effect: "through the DeletionPort plan, replace the deleted principal's did in retained cases with the per-deletion pseudonym; signatures kept and flagged unverifiable-after-pseudonymization; the deleted user's own evidence blobs crypto-shredded"}
    errors:
      - "COMMERCE_DISPUTE_CONTEXT_INVALID | 422 | no | context type is not registered, the context does not resolve, or the actor is not a party"
      - "COMMERCE_DISPUTE_DUPLICATE | 409 | no | an open case already exists for this context and opener"
      - "COMMERCE_DISPUTE_EVIDENCE_LIMIT | 413 | no | evidence count or size exceeds the limits"
      - "COMMERCE_DISPUTE_MEDIATOR_UNAVAILABLE | 409 | no | mediator is not yet accepted by every party of the case or is unreachable"
      - "COMMERCE_DISPUTE_OUTCOME_INVALID | 422 | no | outcome type, acceptance rule, disposition or advisory refund is invalid"
      - "COMMERCE_DISPUTE_FORK | 409 | no | conflicting accepted outcomes; case is frozen for renegotiation"
      - "COMMERCE_DISPUTE_STATEMENT_INVALID | 422 | no | signature, signer role or envelope is invalid; statement is quarantined"
      - "COMMERCE_DISPUTE_MEDIATOR_UNVERIFIED | 409 | no | mediator has no valid relay-signed directory entry; mediator-only outcomes are not allowed"
    example: |
      vault command commerce.dispute.open
      { "contextRef": { "type": "deal", "id": "5b1d0c7e-3a2f-8e41-9c0d-…" }, "reason": "not_received",
        "description": "Paid cash at the agreed spot but the bike was never handed over." }
      => { "caseId": "0192f3ab-…", "revision": 1, "caseCid": "sha256-5a10…", "parties": [ { "did": "did:key:z6MkBuyer…", "role": "payer" },
           { "did": "did:key:z6MkSeller…", "role": "payee" } ], "deadlines": { "responseBy": "2026-11-11T10:00:00.000Z" }, "peerSync": "prepared" }
      later: commerce.dispute.propose_outcome { "type": "refund_claimed", "advisoryRefund": { "amount": "4500", "currency": "EUR" },
        "disposition": { "kind": "settled", "favouredDid": "did:key:z6MkBuyer…", "agreedAmount": { "amount": "4500", "currency": "EUR" } } }
      => every party accepts; resolution refund_claimed; no payment is created, the respondent opens a new Deal if they agree to refund
  authorization_capabilities:
    requirements:
      - Under vault policy (CAP-8) only the unlocked principal acts in its vault; party-only commands check membership in the case, and mediator commands check that the mediator did was accepted by every party of the case in signed statements.
      - Incoming statements are accepted only when signed by a party or the accepted mediator for that statement type; otherwise they are quarantined.
      - Relay policy only governs the mediator directory a relay publishes; relay moderators have no authority over a case unless every party of the case selected them, and then only the power to sign statements.
      - A mediator's link to the relay it claims to moderate is proved only by a directory entry signed by that relay's key and verified by each vault; a self-declared mediator cannot decide a mediator-only outcome.
    capabilities:
      - "commerce.dispute.open | local-principal | principal is a party returned by DisputeContextPort.resolve; vault unlocked; allowed against a blocked party"
      - "commerce.dispute.add_evidence | local-principal | principal is a party of the case; case not terminal"
      - "commerce.dispute.respond | local-principal | principal is a respondent of the case"
      - "commerce.dispute.select_mediator | local-principal | principal is a party of the case; no active mediator"
      - "commerce.dispute.accept_mediator | local-principal | principal is a party of the case (opener or respondent) that has not yet signed acceptance of the proposed mediator"
      - "commerce.dispute.propose_outcome | local-principal | principal is a party, or the mediator accepted by every party with mediator status active"
      - "commerce.dispute.accept_outcome | local-principal | principal is a party of the case and a proposal is pending"
      - "commerce.dispute.withdraw | local-principal | principal is the opener"
      - "commerce.dispute.ingest | local-principal | internal ingest pipeline; signer authorized for the statement type"
      - "commerce.dispute.read | local-principal | principal is a party of the case or the active mediator for the evidence items shared with it"
      - "commerce.dispute.mediator_list | anonymous, relay-device-key | relay policy row mediation_directory enabled; read-only; entries signed by the relay key"
  failure_recovery_idempotency:
    requirements:
      - Commands are idempotent per CTR-IDM-001 using vault command IDs and expectedRevision on mutations.
      - Statement delivery uses the sync outbox states and the UI shows only the state reached.
      - Forked or conflicting signed outcomes are detected, frozen and surfaced; there is no last-writer-wins.
      - Statements of an open case from a party this vault blocked are stored as evidence with notifications suppressed and are never dropped, the timeline says 'responses from a party you blocked are hidden', and the response window flag is noResponseReceivedHere, which such stored statements clear.
    idempotency: "Vault command ID recorded for 24 h; statements deduplicated by cid; caseId is deterministic so repeated opens converge; an open carrying an idempotencyRef already stored in this vault returns that case without signing a new statement."
    concurrency: "expectedRevision on every mutation; unique partial index for one open case per context and opener; Web Lock commerce-dispute per case; across vaults conflicts are detected by statement chain and acceptance sets and freeze the case."
    retries: "Sync outbox retry 5 s, 30 s, 5 min, 1 h, then every 6 h until the case is terminal plus 7 days."
    offline: "All commands commit locally and show pending; evidence attachments are sent through the AttachmentTransportPort (F08.S01.M01 mailbox adapter) when online; deadlines still run on the local clock."
    partial_failure: "Statement and local state commit in one IndexedDB transaction. If an attachment upload fails the statement stays prepared and the evidence item shows upload pending; the case is never partially opened. If metadata stripping fails the attachment is refused and nothing is sent."
  privacy_retention_abuse:
    requirements:
      - Cases and evidence are P2, travel only as end-to-end encrypted envelopes to parties and, after every party accepts, to the mediator; relays see ciphertext and routing metadata only.
      - Evidence shared with a mediator is shared per item by explicit party action, and the UI says the mediator's relay operator cannot read it but the mediator can keep a copy.
      - Dispute abuse such as harassment, evidence flooding and mediator shopping is limited by quotas, duplicate rules and mutual mediator acceptance.
      - The module registers ExportSectionPort (section commerce.disputes), DeletionPort (pseudonymization and crypto-shredding of the deleted user's own evidence) and RetentionPurgePort (RET-EVIDENCE) with F10 (N6), annotates every field with its F10.S02.M02 class, and consumes privacy.deletion.completed.
      - Attachment evidence follows N9 and FLOW-10 - MediaBlob of at most 5 MiB, EXIF, XMP, IPTC and GPS stripped by F10.S02.M03 before encryption, per-object key - so no exact (L4) location reaches the respondent or the mediator through image metadata.
      - Ingest uses the bounded quarantine of F09.S01.M01 (500 entries or 5 MiB, oldest-first eviction) and, once it is full, drops statements from dids that are party to no known context.
    data:
      - "DisputeCase and evidence references: P2; field classes annotated per F10.S02.M02. Evidence attachments are encrypted MediaBlobs with per-object keys held by parties."
      - "Evidence may contain third parties' personal data; the UI warns before attaching and excludes P3 data such as exact addresses unless the user adds it deliberately; image location metadata is always stripped."
    retention:
      - "RET-EVIDENCE (2 years after last related activity, jurisdiction override via F18) through the RetentionPurgePort."
      - "On deletion: did pseudonymized in retained records; the deleted user's own evidence blobs are crypto-shredded at completion unless a legal hold applies in this vault (F10.S01.M02); counterparties' copies cannot be recalled."
    threats:
      - "T01 | Harassment by repeated disputes | one open case per context and opener, 5 new cases per day per vault, local block of the sender"
      - "T02 | Evidence flooding or oversized evidence | 20 items per party, 5 MiB each, 50 MiB per case; excess refused"
      - "T03 | Forged statement from a non-party | signature and role check; quarantine"
      - "T04 | Mediator leaks or keeps evidence | mediator chosen by every party, per-item sharing, UI states the mediator can retain copies; pseudonymity is not anonymity"
      - "T05 | Mediator relay pressures a party | outcomes are statements with no power over money; refusing an outcome has no automatic consequence beyond what that relay hosts under its published policy"
      - "T06 | Conflicting outcomes from forked vaults | detection and freeze with COMMERCE_DISPUTE_FORK; renegotiation or a new case"
      - "T07 | Photo evidence discloses an exact location through GPS EXIF tags | F10.S02.M03 strips metadata before encryption; unstripped attachments refused"
      - "T08 | A party installs a sock-puppet 'relay moderator' who then decides alone | relay-signed directory entry verified against the relay key; self-declared mediators need every party's acceptance for every outcome"
      - "T09 | A fraudster's block or a victim's block suppresses dispute evidence | statements of an open case are stored despite blocks; open allowed against a blocked party; noResponseReceivedHere instead of a silence claim"
      - "T10 | Sybil flood of dispute statements from fresh dids | shared bounded quarantine; non-party statements dropped once full"
    abuse_controls:
      - "New cases limited to 5 per day per vault and 20 evidence statements per hour; ingest limit 20 statements per hour per known party; unknown senders share the bounded quarantine of F09.S01.M01."
      - "Relays may rate-limit mediator directory reads to 60 per hour per device key."
  observability_performance:
    requirements:
      - The PWA sends no telemetry (OBS-7); case counters, deadlines and errors stay in local diagnostics.
      - Relays that publish a mediator directory follow CTR-OBS-001 for that endpoint.
      - Local commit and ingest meet the stated budgets.
    metrics:
      - "Local diagnostics: classrup_commerce_disputes_total{status}"
      - "Local diagnostics: classrup_commerce_dispute_deadline_overdue (gauge)"
      - "Local diagnostics: classrup_commerce_dispute_statements_total{outcome=applied|stored_blocked|quarantined|dropped}"
      - "Relay only: classrup_commerce_mediator_directory_requests_total"
    logs:
      - "info dispute.status {caseId, from, to, correlationId} — no descriptions, notes or evidence content."
    budgets:
      - "open, propose, accept p95 ≤ 120 ms local commit; evidence statement commit p95 ≤ 100 ms excluding metadata stripping and blob upload."
      - "Case timeline render for 200 statements ≤ 200 ms; sweep over 1 000 cases ≤ 500 ms."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement is covered by at least one automated test.
      - Contract tests validate command outputs, statements and event payloads against the schema registry.
      - Mediation and fork scenarios are covered by deterministic multi-vault integration tests.
    fixtures: "In-memory vaults A (opener), B and C (respondents) and M (mediator) with a test relay double that signs directory entries; a Deal context with an acknowledged cash claim; a 3-party cycle context; DisputeContextPort stubs for every registered type; a JPEG with GPS EXIF tags; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,02.R01 | open a case on a deal | case stored with deadlines and parties from DisputeContextPort, signed statement created, caseId deterministic"
      - "T02 | unit | 01.R03,02.R03 | inspect schema and propose refund_claimed with advisoryRefund and a settled disposition | no executable field exists; advisory refund and disposition stored; no payment API called"
      - "T03 | unit | 02.R02,02.R03 | rules V01 to V15 violated in turn | documented error code and nothing stored"
      - "T04 | property | 03.R01,03.R02 | random command sequences | only declared transitions succeed; terminal states have no exits"
      - "T05 | integration | 03.R04 | clock advanced 7, 14 and 30 days at the corresponding states | noResponseReceivedHere set, proposal expires back to evidence, case lapses with resolution lapsed"
      - "T06 | integration | 03.R03,06.R03 | two conflicting accepted outcomes delivered to vault B | case frozen with COMMERCE_DISPUTE_FORK, both retained, no auto-resolution"
      - "T07 | contract | 04.R01,04.R02,09.R02 | execute each command and ingest in the other vaults | outputs, envelopes and events validate against registry schemas"
      - "T08 | integration | 04.R03,02.R01 | commerce.payment.disputed delivered | draft prefilled, no case opened automatically"
      - "T09 | integration | 04.R02,05.R01,07.R02 | every party selects and accepts relay-verified mediator M; A shares two of five evidence items; M proposes no_fault_close | M receives only the two shared items; case resolved without acceptance"
      - "T10 | abuse | 05.R01,05.R02,05.R03 | non-party signer, mediator not accepted by every party, relay moderator without selection | quarantined or FORBIDDEN; relay sees only ciphertext"
      - "T11 | integration | 06.R01,06.R02 | replay of command ID; delivery interrupted at each sync state | original result; UI shows only the highest reached sync state"
      - "T12 | abuse | 07.R03,07.R01 | 6 cases in one day; 21 evidence statements in an hour; a 6 MiB attachment | 6th case, 21st statement and oversized item refused or rate limited"
      - "T13 | integration | 01.R02 | principal deletion completes during an open case | did pseudonymized, signatures flagged, the deleted user's evidence blobs crypto-shredded, counterparty copy untouched"
      - "T14 | load | 08.R01,08.R02,08.R03 | 1 000 cases and a 200-statement timeline | commit p95 ≤ 120 ms, render ≤ 200 ms, sweep ≤ 500 ms, no telemetry"
      - "T15 | e2e | 03.R04,09.R03 | opener and respondent complete a return_agreed outcome on two devices | both screens show resolved with the no-money-movement note; axe zero serious issues"
      - "T16 | unit | 09.R01 | traceability tool run | every PS-070 requirement maps to a passing test"
      - "T17 | integration | 10.R01,10.R02,10.R03 | export, import into fresh vault with one forged statement, roll back one release | valid cases round-trip, forged statement quarantined, open cases import with sync state reset"
      - "T18 | integration | 03.R05,01.R05 | 3-party cycle case; A selects mediator M and B accepts; then C accepts | M stays proposed and receives nothing after A and B; becomes active only when acceptedBy equals {A, B, C}"
      - "T19 | abuse | 05.R04,01.R05 | B selects a mediator did with no directory entry, then one with an entry signed by a different relay key, and that mediator proposes no_fault_close | both labelled self_declared; the mediator-only outcome is refused with COMMERCE_DISPUTE_MEDIATOR_UNVERIFIED; the same outcome resolves only after every party accepts"
      - "T20 | abuse | 07.R05,01.R04 | A attaches a JPEG with GPS EXIF tags and shares it with active mediator M | B and M receive a MediaBlob of at most 5 MiB with no EXIF, XMP or GPS data; an attachment whose stripping failed is refused"
      - "T21 | integration | 06.R04 | A has blocked B; A opens a case against B; B responds and adds evidence | open allowed; B's statements stored with notifications suppressed; timeline says 'responses from a party you blocked are hidden'; noResponseReceivedHere stays false"
      - "T22 | contract | 04.R04 | assert every produced event against the expectations of F07.S03.M01, F13.S01.M03, F09.S01.M01, F02.S03.M04, F03.S02.M03, F05.S01.M02 and F05.S02.M03 | each event carries the exact contextRef, openerId, respondentIds and parties; resolved and withdrawn carry caseCid; resolved carries contextCid, acceptedBy and outcomeCid"
      - "T23 | contract | 04.R05,01.R03 | resolve one case per consumer context type with and without a disposition | resolved payload carries the advisory disposition when present; for deal and payment_claim the default mapping applies when absent; no consumer command that moves money is invoked"
      - "T24 | unit | 02.R04,01.R06 | open cases for each registered type and for an unregistered type | registered types store parties and contextCid from their resolver; unregistered returns COMMERCE_DISPUTE_CONTEXT_INVALID"
      - "T25 | integration | 07.R04 | export, deletion and retention purge driven by F10 | section commerce.disputes exported; DeletionPort pseudonymizes and crypto-shreds the deleted user's own evidence; RetentionPurgePort purges after RET-EVIDENCE; every field carries an F10.S02.M02 class"
      - "T26 | abuse | 07.R06 | 10 000 fresh dids each send one dispute statement | quarantine stays within 500 entries or 5 MiB, oldest evicted first, non-party statements dropped once full; parties' statements still applied"
      - "T27 | integration | 04.R06 | dispute, evidence and outcome statements delivered through F09.S01.M01 commerce.statement.ingest, plus duplicates and a statement signed by a non-party | dispatched to commerce.dispute.ingest and applied once; duplicates no-op; non-party quarantined with COMMERCE_DISPUTE_STATEMENT_INVALID"
      - "T28 | integration | 04.R07,02.R05 | F03.S02.M03 port opens a booking case with serviceScope {scope, scopeKey, milestoneId} and idempotencyRef L1 against a counterparty the opener blocked, then retries with L1; a deal case carrying serviceScope; owner opens rental_deposit and rental_damage cases against a renter blocked after confirmation | booking case opened, serviceScope signed into dispute/v1 and carried in commerce.dispute.opened; the retry returns the same caseId with no new statement; the deal case returns VALIDATION_FAILED; no open is refused with BLOCKED_PARTY"
      - "T29 | integration | 04.R03 | deliver services.dispute.opened with origin federated, and with origin local for a booking with and without a case created through the port | no case is created in any case; the local event for an existing case only prefills milestone evidence in the opener vault; the federated event is ignored"
      - "T30 | contract | 04.R04,03.R04 | a case resolved by accepted return_agreed and a case lapsed after 30 days | resolved payload carries caseCid, contextCid, the exact contextRef, parties, acceptedBy and outcomeCid for the first; the second carries resolution lapsed, documented as the FLOW-08 closed-unresolved outcome, with no outcomeCid"
    acceptance:
      - All tests T01 to T30 pass in CI.
      - No dispute state, event or outcome invokes any payment, refund, freeze or release operation.
      - A mediator sees only evidence the parties chose to share and only after every party of the case accepted the mediator.
      - Conflicting accepted outcomes always freeze the case.
      - A self-declared mediator can never close a case without every party's acceptance.
      - Statements in an open case are never dropped because of a block, and no image evidence carries location metadata.
  import_export_backup_rollback:
    requirements:
      - The vault export contains the principal's cases with all signed statements and evidence references in the section commerce.disputes, and evidence blobs the user holds in the export blob list.
      - Import re-verifies every statement and quarantines those whose signer is not a party or the accepted mediator.
      - Schema changes follow expand/contract and keep v1 readable for 180 days.
    export: "ExportSectionPort section commerce.disputes in classrup-export/v1; one line per DisputeCase and per statement (schema classrup.commerce.dispute/v1) with evidence MediaBlob refs; the other parties' evidence is included only as the principal's own received copies."
    import: "Terminal cases import as read-only evidence; open cases import as open with sync state reset to local_committed and deadlines recomputed from the original signed times as claims; mediator directory entries are re-verified."
    backup: "The vault export is the primary backup (IOX-6); relays hold only ciphertext of statements in transit."
    migration_rollback: "Additive fields only in v1 (parties, contextCid, disposition, mediator trust); respondentSilent is read as noResponseReceivedHere; signed statement bytes are never rewritten by a migration; rollback is safe because older readers ignore new optional fields."
