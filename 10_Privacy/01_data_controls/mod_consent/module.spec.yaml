# F10.S01.M01 Privacy consent (ADR-0015, ADR-0016). Consents live in the user's vault; relays receive only signed consent statements.
id: F10.S01.M01
scope: MVP
summary: >-
  Purpose-based, revocable consent kept in the user's vault. Six purposes exist: publishing to federation, notifications by
  email, notifications by Web Push, optional analytics sharing, precise location sharing, and chain lookups that disclose
  addresses and transaction IDs to a user-chosen crypto verifier endpoint. Every purpose is off by default. A grant records
  the exact policy text version and its SHA-256 hash that the user saw. Other modules call a local check before processing
  for a purpose and refuse with PRIVACY_CONSENT_REQUIRED when it is not granted. Federation, email and push consents are each
  scoped to one user-selected relay named by its canonical relayId (F15.S02.M01), and chain lookup consents to one verifier
  endpoint origin. Exactly one
  relay-facing artifact exists per purpose: for federation_publish the vault signs classrup.privacy.consent_statement/v1 for that
  relay, which accepts and acknowledges it through the relay command privacy.consent.relay_register; for email and push the
  relay-facing artifact is the F13.S02.M03 channel consent statement, which carries this module's consent ID and purpose. A
  location_precise grant only enables the feature; every precise share is still a separate action in F06.S02.M02. Withdrawal
  always succeeds locally and, for federation, queues a signed withdrawal that names the grant it revokes; copies already
  fetched by others cannot be recalled and the UI says so.
responsibilities:
  - Own PrivacyConsent records (append-only history per purpose and scope) with policy id, version and hash.
  - Provide privacy.consent.check, the single local decision function other modules call before processing for a purpose.
  - Produce the relay-facing statements for federation_publish only, classrup.privacy.consent_statement/v1 and classrup.privacy.consent_withdrawal/v1, signed by the principal and addressed to the named relay; notify_email and notify_push rely on the F13.S02.M03 classrup.notify.channel_consent/v1 statement, which references the consent ID and purpose.
  - Lapse consents whose policy hash has a material change, requiring a fresh informed grant, and queue the same signed withdrawal as an explicit withdrawal.
  - Withdraw consent immediately and locally on user request, on an F13 unsubscribe or settings opt-out for the same purpose and relay, and in this module's DeletionPort step when a deletion executes.
  - Serve the relay command privacy.consent.relay_register, which verifies a consent or withdrawal statement and returns a relay-signed acknowledgement, and the in-process relay query privacy.consent.relay_check that relay federation calls before indexing or forwarding an author's records.
  - Meet the N6 duties for its own data, namely ExportSectionPort section privacy.consents, a DeletionPort step and a RetentionPurgePort kind, with every field classified by F10.S02.M02.
  - Define PRIVACY_CONSENT_REQUIRED, the single error code every consumer returns when a purpose check is not granted, and the in-process guard privacy.consent.require that returns it.
  - Bind privacy.consent.check as the ConsentCheckPort in the kernel port registry at vault composition (inverted registration), so modules this module depends on, F07.S01.M01 among them, consult consent without a depends_on edge that would close a cycle.
non_responsibilities:
  - Per-channel notification preferences, quiet hours, unsubscribe tokens and the relay-facing statement for notify_email and notify_push (F13.S02.M03), which read consent from this module.
  - Precise location storage and sharing mechanics (F06.S02.M02); a location_precise grant only enables the feature, and every L4 share still needs an explicit per-counterparty action with a TTL of at most 24 h there.
  - Relay-side enforcement of federation scope by the relay federation modules (F11.S02.M01 calls privacy.consent.relay_check) and of notification channels (F13.S02.M03).
  - Chain verifier configuration and the unauthenticated lookups themselves (F09.S01.M03); a chain_lookup grant only permits lookups to the one endpoint origin it names.
  - The canonical relayId format, defined by F15.S02.M01; this module only validates and stores it.
  - "Future: age-based consent rules and guardian consent; MVP assumes users meet the minimum age of the community and records no age."
depends_on: [F07.S01.M01, F11.S01.M01, F15.S01.M01, F15.S02.M01, F16.S02.M02, F12.S03.M03, F10.S02.M02, F10.S01.M02, F10.S01.M03, F10.S01.M04, CTR-PRV-001, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-FED-001, CTR-OBS-001, CTR-FLG-001]
user_stories:
  - As a user, I decide separately whether my listings may be published to federated relays, whether I get email or push notifications, and whether I share precise location, and everything is off until I say yes.
  - As a user, I can see the exact policy text version I agreed to and withdraw with one tap.
  - As a user, I am told honestly that withdrawing stops future processing but cannot recall copies others already fetched.
edge_cases:
  - Policy text changes materially after a grant; the consent lapses, processing stops until the user re-grants with the new hash, and for federation the same signed withdrawal as an explicit withdrawal is queued for the relay.
  - The user grants federation consent for relay A, then withdraws; the signed withdrawal is queued for relay A while offline and shows prepared until relay A returns its signed acknowledgement (peer_accepted).
  - A grant is attempted with an outdated policy hash from a cached screen; it is refused with PRIVACY_POLICY_STALE.
  - An unsubscribe link in an email from relay A withdraws the F13 email channel; on the next sync with relay A the vault receives notify.channel.opted_out with via unsubscribe_link and withdraws the notify_email consent for relay A with source unsubscribe. An opted_out with via expired, account_deletion, privacy_withdrawal or relay_policy leaves the purpose consent unchanged.
  - Two tabs grant and withdraw the same purpose at the same moment; the later revision wins locally in order of the vault transaction and both entries stay in history.
  - Deletion is requested; consents stay unchanged during the 14-day grace because cancelling must restore normal operation (publishing is refused meanwhile by privacy.deletion.assert_not_pending of F10.S01.M04); at execution this module's DeletionPort step withdraws every consent with source deletion and signs the federation withdrawals before the keys are destroyed.
  - Import from an older export carries consents with an unknown policy hash; they import as lapsed.
  - A relay receives a replayed grant whose cid already has a withdrawal, a grant addressed to another relay, or a statement signed by a revoked key; privacy.consent.relay_register refuses each with PRIVACY_CONSENT_STATEMENT_INVALID.
  - A burst of 100 withdrawals in one hour from unsubscribes across several relays all succeed locally; the outgoing withdrawal statements are coalesced per relay in the sync outbox and none is dropped.
  - A grant names a relay by hostname such as relay.example.org instead of its canonical relayId; it is refused with VALIDATION_FAILED, and a relay whose genesis key changed (new identity) has a different relayId and needs a new grant.
  - The user grants chain_lookup for https://esplora.example.net and later switches the verifier to another endpoint; check for the new origin returns granted false with reason scope, F09.S01.M03 refuses the lookup with PRIVACY_CONSENT_REQUIRED and the settings sheet asks for a grant for the new origin.
ux:
  screens:
    - "Privacy settings: one row per purpose with plain-language description, current state, the relay it applies to (federation, email, push) shown by relay name and identity fingerprint, the verifier endpoint origin for chain lookups, policy version and Read the text link, and a switch."
    - "Grant sheet: shows the policy text for the purpose, the relay or endpoint it applies to, what cannot be undone ('copies already fetched by others cannot be recalled'), for precise location the sentence 'Turning this on shares nothing; each share is a separate choice', for chain lookups the sentence 'This endpoint learns which transactions and addresses you look up', and a Grant button."
    - "History: list of grants and withdrawals with dates and policy versions."
  states: [loading, off-default, granted, withdrawn, lapsed-needs-regrant, pending-offline, error]
  a11y:
    - Each switch has a visible label and a description linked with aria-describedby, and state changes are announced politely.
    - The policy text is readable at 200 percent zoom and reachable by keyboard in a dialog with focus trap and Escape to close.
    - Switch targets are at least 44 by 44 px.
processes:
  domain_schema:
    requirements:
      - A PrivacyConsent stores purpose, scope (relay, verifier endpoint and record kinds), policy id, version and SHA-256 hash, locale of the text shown, grant and withdrawal times, status and source; federation_publish, notify_email and notify_push are scoped to exactly one relay named by its canonical self-certifying relayId (F15.S02.M01, 'relay:' plus 26 lowercase base32 characters of the genesis key hash, never a hostname), and chain_lookup is scoped to exactly one HTTPS verifier endpoint origin.
      - The history is append-only; a new grant creates a new row and supersedes the previous one rather than editing it.
      - Consents are P3 in the vault and retained as RET-EVIDENCE (2 years after withdrawal) as proof of what was agreed; the vault entity schema classrup.privacy.consent/v1 never leaves the vault except in the user's own export.
      - "The relay-facing statements have their own schemas with explicit field allowlists, registered with signer role in the F11.S01.M01 statement registry (N2): classrup.privacy.consent_statement/v1 with payload exactly {consentId, purpose, relayId, recordKinds, policyId, policyVersion, policyHash, grantedAt} and classrup.privacy.consent_withdrawal/v1 with payload exactly {consentId, targetCid, purpose, relayId, withdrawnAt, reason}; the did appears only as the envelope author, with per-author seq and prev (CTR-FED-001)."
    entities:
      - name: PrivacyConsent
        schema: classrup.privacy.consent/v1
        storage: device
        privacy: P3
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "vaultId: uuidv7 — local vault scope (CTR-ID-001 tenant slot)"
          - "purpose: enum — federation_publish | notify_email | notify_push | analytics_share | location_precise | chain_lookup"
          - "scope: object — {relayId?: string, endpoint?: string, recordKinds?: string[] up to 20}; relayId is the canonical relayId of F15.S02.M01 and required for federation_publish, notify_email and notify_push; endpoint is an HTTPS origin (scheme, host, optional port; no path, query or credentials) and required for chain_lookup"
          - "policyId: string — e.g. privacy.federation.v3"
          - "policyVersion: int — ≥ 1"
          - "policyHash: string — sha256 hex of the canonical policy text shown"
          - "locale: string — BCP 47 locale of the text shown"
          - "status: enum — granted | withdrawn | superseded | lapsed"
          - "source: enum — ui | unsubscribe | deletion | import"
          - "grantedAt: timestamp — RFC 3339 UTC, local clock"
          - "withdrawnAt?: timestamp — RFC 3339 UTC, local clock"
          - "statementCid?: string — cid of the signed classrup.privacy.consent_statement/v1; federation_publish only"
          - "withdrawalCid?: string — cid of the signed classrup.privacy.consent_withdrawal/v1 whose targetCid is statementCid"
          - "peerSync?: string — local_committed | prepared | transport_acknowledged | peer_accepted"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - At most one row with status granted per (purpose, scope key), where the scope key is scope.relayId for relay-scoped purposes, scope.endpoint for chain_lookup and empty otherwise.
          - No purpose is granted by default; absence of a row means not granted.
          - policyHash equals the hash of the bundled policy text of policyId at policyVersion when the row is created.
          - statementCid and withdrawalCid are set only for federation_publish; notify_email and notify_push are linked from F13.S02.M03 ChannelConsent by consent ID, and analytics_share, location_precise and chain_lookup produce no statement.
          - scope.relayId, when present, matches the canonical relayId pattern of F15.S02.M01; a hostname is never stored as a relayId.
    sql: |
      CREATE TABLE privacy_consent (
        id TEXT PRIMARY KEY, vault_id TEXT NOT NULL, purpose TEXT NOT NULL, scope_key TEXT, status TEXT NOT NULL,
        policy_hash TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      -- scope_key: canonical relayId (federation_publish, notify_email, notify_push), endpoint origin (chain_lookup) or NULL
      CREATE UNIQUE INDEX privacy_consent_active ON privacy_consent(vault_id, purpose, ifnull(scope_key,'')) WHERE status = 'granted';
  validation_rules:
    requirements:
      - Grant input is validated strictly, including purpose, scope and policy hash.
      - A grant is accepted only for the currently bundled policy version of the purpose.
      - Defaults are enforced in code, so processing is allowed only when a granted, non-lapsed consent exists.
      - Withdrawal always succeeds locally whatever its source (user, unsubscribe, deletion step or lapse) and is never refused for rate reasons; only the outgoing withdrawal statements are coalesced in the sync outbox.
      - A relay accepts a consent or withdrawal statement only after verifying signer key and role, audience, field allowlist, chain position and that the grant was not already withdrawn.
      - Scope identifiers are validated in canonical form only, a relayId per F15.S02.M01 and a chain_lookup endpoint as a bare HTTPS origin, and a consumer whose check is not granted refuses with PRIVACY_CONSENT_REQUIRED.
    rules:
      - "V01 | purpose is one of the six defined purposes | VALIDATION_FAILED"
      - "V02 | relayId is present for federation_publish, notify_email and notify_push, is a canonical relayId ('relay:' plus 26 lowercase RFC 4648 base32 characters, F15.S02.M01) and refers to a relay the user selected | VALIDATION_FAILED"
      - "V03 | policyHash equals the hash of the current bundled policy text for the purpose | PRIVACY_POLICY_STALE"
      - "V04 | the purpose is available in this build and not disabled by a feature flag (CTR-FLG-001) | FEATURE_DISABLED"
      - "V05 | the user command withdraw targets a granted consent | CONFLICT_STATE"
      - "V06 | scope.recordKinds has at most 20 entries from the known record kinds | VALIDATION_FAILED"
      - "V07 | at most 30 grant operations per hour per vault through RateLimitPort (F12.S03.M03); withdrawals are never counted or refused | RATE_LIMITED"
      - "V08 | relay_register - the envelope signature verifies over JCS bytes with a registered, non-revoked device key of the author did (F16.S02.M02), the signer role is principal per F11.S01.M01 roleFor, and the payload has exactly the allowlisted fields | PRIVACY_CONSENT_STATEMENT_INVALID"
      - "V09 | relay_register - payload relayId equals the receiving relay, seq and prev extend the author's chain at this relay, and a grant whose cid already has a recorded withdrawal is refused | PRIVACY_CONSENT_STATEMENT_INVALID"
      - "V10 | relay_register - a withdrawal names in targetCid a grant of the same author, purpose and relay; an unknown targetCid is recorded so that grant is refused if it arrives later | PRIVACY_CONSENT_STATEMENT_INVALID"
      - "V11 | endpoint is present for chain_lookup and absent for every other purpose, and is an https origin without path, query, fragment or user info | VALIDATION_FAILED"
      - "V12 | privacy.consent.require and every consumer refuse processing for a purpose unless privacy.consent.check returns granted true for that purpose and scope (relayId, endpoint or recordKind); any check error counts as not granted | PRIVACY_CONSENT_REQUIRED"
  workflow_state_machine:
    requirements:
      - A consent is granted until it is withdrawn, superseded by a newer grant or lapsed by a material policy change.
      - Withdrawal takes effect in the same local transaction and is final for that row; consent again means a new grant.
      - Lapse is evaluated at unlock and daily against the bundled policy versions, and a lapse of a federation consent queues the same signed withdrawal statement as an explicit withdrawal.
    machines:
      - entity: PrivacyConsent
        initial: granted
        terminal: [withdrawn, superseded, lapsed]
        transitions:
          - "granted -> withdrawn | privacy.consent.withdraw; notify.channel.opted_out with via unsubscribe_link or settings for the same purpose and relay; or this module's DeletionPort step at deletion execution | emits privacy.consent.withdrawn; for federation_publish queues classrup.privacy.consent_withdrawal/v1 whose targetCid is the grant cid"
          - "granted -> superseded | privacy.consent.grant with newer policy version for the same purpose and scope | no event for the superseded row; the new row emits privacy.consent.granted and, for federation_publish, a new statement whose prev is the previous statement"
          - "granted -> lapsed | policy sweep finds a material change in policy hash | emits privacy.consent.withdrawn with reason policy_changed and, for federation_publish, queues the same signed withdrawal statement as withdraw"
    timeouts:
      - "Policy sweep at vault unlock and every 24 h while open."
      - "Outgoing withdrawal statements to one relay are coalesced within 5 s into one sync outbox batch."
  commands_queries_events:
    requirements:
      - Grant and withdraw are vault commands; for federation_publish they also produce classrup.privacy.consent_statement/v1 and classrup.privacy.consent_withdrawal/v1; check and list are vault queries; privacy.consent.relay_register is the relay command that accepts and acknowledges those statements, and privacy.consent.relay_check is an in-process relay query.
      - Grant and withdraw emit events into the vault outbox in the same IndexedDB transaction as the state change.
      - Other modules must call privacy.consent.check (or the guard privacy.consent.require) before processing for a purpose, treat any failure as not granted and refuse with PRIVACY_CONSENT_REQUIRED, the one consent-missing code defined here.
      - Each statement declares signer role and audience for the N2 registry; both are signed by the principal and addressed to one named relay, sealed to that relay's published key because they are P2 for that relay only (PRV-5), and notify_email and notify_push produce no statement here because the F13.S02.M03 channel consent carries consentId and purpose.
      - The privacy ports of this module are defined in the note, including the DeletionPort step that withdraws every consent and signs the federation withdrawals before F07.S01.M01 destroys the keys.
      - privacy.consent.check is bound as ConsentCheckPort in the kernel port registry at vault composition, so modules that this module depends on (F07.S01.M01 checks federation_publish before a handle claim) call it through the port with the same inputs, outputs and fail-closed behavior, and chain_lookup is matched by purpose plus the exact endpoint origin.
    commands:
      - name: privacy.consent.grant
        capability: privacy.consent.grant
        input: "[vault command; produces signed statement classrup.privacy.consent_statement/v1 for federation_publish only] { purpose, scope?: {relayId?, recordKinds?}, policyId, policyVersion, policyHash, locale }"
        output: "{ consentId, revision: 1, status: granted, statementCid?, peerSync? }"
        errors: [VALIDATION_FAILED, PRIVACY_POLICY_STALE, FEATURE_DISABLED, RATE_LIMITED]
        emits: [privacy.consent.granted]
        idempotent: true
      - name: privacy.consent.withdraw
        capability: privacy.consent.withdraw
        input: "[vault command; produces signed statement classrup.privacy.consent_withdrawal/v1 for federation_publish] { consentId, expectedRevision }"
        output: "{ consentId, revision, status: withdrawn, withdrawalCid?, peerSync? }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [privacy.consent.withdrawn]
        idempotent: true
      - name: privacy.consent.relay_register
        capability: privacy.consent.relay_register
        input: "[relay command; request signed by a device key of the author] { statement: sealed classrup.privacy.consent_statement/v1 or classrup.privacy.consent_withdrawal/v1 envelope }"
        output: "{ cid, status: registered|withdrawn|duplicate, relayReceivedAt, relayAckSig (relay signature over the statement cid, evidence for peer_accepted) }"
        errors: [VALIDATION_FAILED, PRIVACY_CONSENT_STATEMENT_INVALID, RATE_LIMITED, FEATURE_DISABLED]
        emits: []
        idempotent: true
    queries:
      - name: privacy.consent.check
        capability: privacy.consent.check
        input: "[vault in-process query; also bound as ConsentCheckPort.check] { purpose, relayId?, endpoint?, recordKind? }"
        output: "{ granted: boolean, consentId?, policyVersion?, reason?: none|withdrawn|lapsed|scope }"
        errors: []
      - name: privacy.consent.require
        capability: privacy.consent.check
        input: "[vault in-process guard query] { purpose, relayId?, endpoint?, recordKind? }"
        output: "{ ok: true, consentId, policyVersion } or the error PRIVACY_CONSENT_REQUIRED with params {purpose, relayId?, endpoint?, reason}"
        errors: [PRIVACY_CONSENT_REQUIRED, VALIDATION_FAILED]
      - name: privacy.consent.list_mine
        capability: privacy.consent.read
        input: "{ purpose?, status?, cursor?, limit ≤ 100 }"
        output: "{ items: PrivacyConsent[], nextCursor? }"
        errors: []
      - name: privacy.consent.relay_check
        capability: privacy.consent.relay_check
        input: "[relay in-process query] { authorDid, recordKind? }"
        output: "{ granted: boolean, grantCid?, policyVersion? }"
        errors: []
    note: >-
      Statements (N2, registered with F11.S01.M01 roleFor). classrup.privacy.consent_statement/v1 - signer role principal,
      that is a registered, non-revoked device key of the did that owns vaultId, which is the envelope author; audience the
      relay named in payload relayId, sealed to that relay's published key; payload exactly {consentId, purpose:
      federation_publish, relayId, recordKinds, policyId, policyVersion, policyHash, grantedAt}; per-author seq and prev.
      classrup.privacy.consent_withdrawal/v1 - same signer role and audience; payload exactly {consentId, targetCid (cid of
      the grant it revokes), purpose, relayId, withdrawnAt, reason: user|unsubscribe|account_deletion|policy_changed}.
      notify_email and notify_push send no F10 statement; F13.S02.M03 classrup.notify.channel_consent/v1 references consentId
      and purpose, and its 365-day channel expiry asks the user to reconfirm the channel only, while the purpose consent here
      has no time expiry. analytics_share, location_precise and chain_lookup are local gates without a statement;
      chain_lookup (F09.S01.M03 verifier lookups, a third-party disclosure of addresses and txids) is scoped to one HTTPS
      endpoint origin and matched by purpose plus that exact origin. relayId everywhere in this module, including the
      statements, check inputs and the notify.channel.opted_out match, is the canonical self-certifying relayId of
      F15.S02.M01 ('relay:' plus 26 lowercase base32 characters of the SHA-256 of the relay genesis key), never a hostname.
      Consent-missing refusal - consumers return PRIVACY_CONSENT_REQUIRED with params {purpose, relayId?, endpoint?, reason}
      whenever check returns granted false or fails; privacy.consent.require is the in-process guard that does this for
      them. ConsentCheckPort - the vault composition root registers privacy.consent.check in the kernel port registry as
      ConsentCheckPort {check(input) -> output of privacy.consent.check}, which F07.S01.M01 and any other module this module
      depends on consume without a depends_on edge (inverted registration). Relay side - the relay
      keeps verified statements per (author did, relayId) and answers privacy.consent.relay_check for its federation
      handlers. Privacy ports (N6) - ExportSectionPort section privacy.consents with schemas classrup.privacy.consent/v1,
      classrup.privacy.consent_statement/v1 and classrup.privacy.consent_withdrawal/v1; DeletionPort plan {willDelete:
      consent rows when keepEvidence is false, willPseudonymize: none because rows carry vaultId, not the did, blockers: none}
      and step sign (withdraw every granted consent with source deletion and sign the federation withdrawals) which runs
      before the F07.S01.M01 destroy_keys step; RetentionPurgePort kind privacy.consent, class RET-EVIDENCE, anchorField
      withdrawnAt. Every field is classified with F10.S02.M02.
    events_produced:
      - {type: privacy.consent.granted, privacy: P3, payload: "{ consentId, purpose, scope, policyId, policyVersion }"}
      - {type: privacy.consent.withdrawn, privacy: P3, payload: "{ consentId, purpose, scope, reason: user|unsubscribe|account_deletion|policy_changed }"}
    events_consumed:
      - {type: notify.channel.opted_out, effect: "only when via is unsubscribe_link or settings - withdraw the granted consent whose purpose matches the channel (email to notify_email, push to notify_push) and whose scope.relayId equals relayId, with source unsubscribe or ui; via expired, account_deletion, privacy_withdrawal or relay_policy is ignored, and an already withdrawn consent is a no-op"}
    errors:
      - "PRIVACY_POLICY_STALE | 409 | no | the policy hash does not match the current policy text; reload and read the new text"
      - "PRIVACY_CONSENT_STATEMENT_INVALID | 422 | no | a consent or withdrawal statement failed the signer, audience, allowlist, chain or replay checks at the relay"
      - "PRIVACY_CONSENT_REQUIRED | 412 | no | the purpose consent for this relay, endpoint or record kind is not granted (missing, withdrawn, lapsed or out of scope); ask the user to grant it and retry"
    example: |
      vault command privacy.consent.grant
      { "purpose": "federation_publish", "scope": { "relayId": "relay:3fz7hq2wkmpd5ra6t4ncxb7ygu" }, "policyId": "privacy.federation.v3",
        "policyVersion": 3, "policyHash": "9c1185a5c5e9fc54612808977ee8f548b2258d31…", "locale": "en" }
      => { "consentId": "0192f3b0-…", "revision": 1, "status": "granted", "statementCid": "sha256-e01c…", "peerSync": "prepared" }
      relay command privacy.consent.relay_register { "statement": <sealed classrup.privacy.consent_statement/v1> }
      => { "cid": "sha256-e01c…", "status": "registered", "relayReceivedAt": "2026-11-04T10:00:02.120Z", "relayAckSig": "…" }   vault peerSync -> peer_accepted
      query privacy.consent.check { "purpose": "federation_publish", "relayId": "relay:3fz7hq2wkmpd5ra6t4ncxb7ygu" } => { "granted": true, "policyVersion": 3 }
      query privacy.consent.require { "purpose": "chain_lookup", "endpoint": "https://esplora.example.net" }
      => PRIVACY_CONSENT_REQUIRED { "params": { "purpose": "chain_lookup", "endpoint": "https://esplora.example.net", "reason": "none" } }
  authorization_capabilities:
    requirements:
      - Under vault policy (CAP-8) only the unlocked local principal grants, withdraws or reads its own consents.
      - privacy.consent.check is callable by other modules in the same vault in-process; it never reveals consent state to other principals.
      - Relays authorize receipt of consent statements under their own relay policy through privacy.consent.relay_register, accept only statements signed by the principal and addressed to themselves, and cannot grant or alter consent.
    capabilities:
      - "privacy.consent.grant | local-principal | vault unlocked; current policy hash supplied"
      - "privacy.consent.withdraw | local-principal | vault unlocked; consent granted"
      - "privacy.consent.check | local-principal | in-process call from a module of the unlocked vault, directly, through privacy.consent.require or through the ConsentCheckPort bound in the kernel port registry"
      - "privacy.consent.read | local-principal | vault unlocked"
      - "privacy.consent.relay_register | signed-statement | request and statement signed by a registered, non-revoked device key of the author did; grants limited to 20 per hour per did, withdrawals always accepted"
      - "privacy.consent.relay_check | relay-system | in-process call from relay federation handlers (F11.S02.M01) on the same relay"
  failure_recovery_idempotency:
    requirements:
      - Commands are idempotent per CTR-IDM-001 using vault command IDs and expectedRevision on withdrawal.
      - Withdrawal commits locally first and never fails for rate or connectivity reasons; relay delivery of the signed withdrawal retries until peer_accepted (the relay-signed acknowledgement of privacy.consent.relay_register) or the relay is removed.
      - The check function fails closed, so any error means not granted.
    idempotency: "Vault command ID recorded for 24 h; grant of the same purpose, scope and policy hash while already granted returns the existing consent; relay_register dedupes by statement cid and returns the stored acknowledgement."
    concurrency: "Partial unique index allows one granted row per purpose and relay; Web Lock privacy-consent serializes tabs; check reads a consistent snapshot."
    retries: "Signed statements retry 5 s, 30 s, 5 min, 1 h, then every 6 h up to 30 days through the sync outbox (F15.S01.M01); withdrawals for one relay are coalesced into one batch per send; peer_accepted is reached only with the relay-signed acknowledgement."
    offline: "Grant and withdrawal work offline and apply locally at once; relay statements wait in the sync outbox and the UI shows prepared."
    partial_failure: "If the relay never receives the withdrawal, local processing for the purpose has already stopped; the UI shows the relay may still hold copies and offers export of the statement."
  privacy_retention_abuse:
    requirements:
      - Consent records are P3 and never leave the vault except as the signed federation statements to the named relay and the user's own export.
      - Consent is never pre-ticked, bundled or inferred, and each purpose is a separate decision with its own text.
      - The UI states the limits of withdrawal, namely that future processing stops, copies already fetched by other vaults and relays cannot be recalled.
    data:
      - "PrivacyConsent: P3 in the vault. classrup.privacy.consent_statement/v1 and classrup.privacy.consent_withdrawal/v1: P2 for the named relay only, fields exactly as listed in the note, did only as envelope author, sealed to that relay. Relay copy of verified statements: kept while the grant is active and RET-EVIDENCE after withdrawal."
      - "chain_lookup consents: P3 in the vault like every other consent; the endpoint origin is never sent anywhere by this module, and the lookups the grant permits are made by F09.S01.M03 without DID, signature or relay access token."
    retention:
      - "RET-EVIDENCE (2 years after withdrawal) as proof of consent; deletable earlier on account deletion; relay legal holds (F10.S01.M02) apply only to the signed consent statements that relay holds, never to vault records."
    threats:
      - "T01 | Dark pattern obtains consent by default | all purposes off by default, no pre-ticked controls, separate text per purpose, tested by a UI test"
      - "T02 | Module processes without checking consent | single check function, lint rule requiring a check call in code paths tagged with a purpose, integration tests per consumer"
      - "T03 | Relay keeps indexing after withdrawal | signed withdrawal statement naming the grant cid, relay federation consults privacy.consent.relay_check, relay obligation to honour tombstones (PRV-6), UI states copies cannot be recalled"
      - "T04 | Consent replay, forgery or cross-relay reuse toward a relay | statements signed over JCS with Ed25519 by a registered, non-revoked key, audience relayId bound in the payload, per-author seq and prev, relays dedupe by cid and refuse a grant whose cid already has a withdrawal (V08 to V10)"
      - "T05 | Withdrawal blocked during an unsubscribe or deletion burst | withdrawal is never rate limited and always commits locally; outgoing statements are coalesced per relay instead of limited"
      - "T06 | Two notification consent mechanisms disagree | one relay-facing artifact per purpose: F13 channel consent for notify_email and notify_push, the F10 statement for federation_publish"
      - "T07 | A chain verifier learns the user's addresses and txids without an informed choice, or a consent for one endpoint is reused for another | chain_lookup is off by default, scoped to one exact HTTPS origin, checked fail closed before every lookup, and refused with PRIVACY_CONSENT_REQUIRED for any other origin"
      - "T08 | A consent for one relay is applied to another relay that reuses its hostname | relay scopes use the canonical self-certifying relayId of F15.S02.M01, so a new relay identity behind the same hostname has a different relayId and is not granted"
    abuse_controls:
      - "Grants limited to 30 per hour per vault; withdrawals are never limited; a relay accepts at most 20 grant statements per hour per did and always accepts withdrawals, which arrive coalesced per relay."
  observability_performance:
    requirements:
      - The PWA sends no telemetry (OBS-7); consent counts and check latency stay in local diagnostics.
      - The check function meets a low latency budget with an in-memory cache invalidated on change.
      - Lapse and withdrawal propagation are observable locally.
    metrics:
      - "Local diagnostics: classrup_privacy_consent_changes_total{purpose,action=granted|withdrawn|lapsed}"
      - "Local diagnostics: classrup_privacy_consent_check_ms (histogram)"
      - "Relay only: classrup_privacy_consent_statements_total{kind=grant|withdrawal,outcome=registered|duplicate|rejected}"
    logs:
      - "info consent.changed {consentId, purpose, action, correlationId} — no relay URLs and no policy text."
    budgets:
      - "check p99 ≤ 2 ms with cache; grant and withdraw p95 ≤ 100 ms local commit."
      - "Withdrawal reaches every in-vault consumer within 1 s of commit."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement is covered by at least one automated test.
      - Contract tests validate command outputs, statements and event payloads against the schema registry.
      - Default-off behavior is covered by a test that enumerates every purpose on a fresh vault.
    fixtures: "Fresh vault; bundled policies for six purposes with fixed hashes; relay double with canonical relayId relay:3fz7hq2wkmpd5ra6t4ncxb7ygu and a key registry; verifier endpoints https://esplora.example.net and https://node.example.org; F07.S01.M01, F09.S01.M03, F13.S02.M03 and F06.S02.M02 doubles; kernel port registry double; network capture double; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,02.R01 | grant federation_publish, notify_email and notify_push for a canonical relayId and chain_lookup for an endpoint origin with the current hash; grant notify_email without relayId; grant notify_push with relayId relay.example.org | rows stored granted with scope.relayId or scope.endpoint; the federation grant has a signed statement; missing relayId and the hostname both return VALIDATION_FAILED"
      - "T02 | unit | 01.R02,03.R01 | grant, regrant with new version, withdraw | history keeps three rows with statuses superseded, then withdrawn; none edited"
      - "T03 | unit | 02.R02,02.R03,02.R06 | rules V01 to V07, V11 and V12 violated in turn | documented error code and nothing stored"
      - "T04 | unit | 02.R03 | fresh vault, check every one of the six purposes | all return granted false"
      - "T05 | property | 03.R01,03.R02 | random grant and withdraw sequences | at most one granted row per purpose and relay; withdrawn rows never return to granted"
      - "T06 | integration | 03.R03 | change policy hash with materialChange for a federation consent | consent lapses at unlock, privacy.consent.withdrawn emitted with reason policy_changed, check returns false, and a withdrawal statement naming the grant cid is queued for the relay"
      - "T07 | contract | 04.R01,04.R02,09.R02 | execute each command and query, including relay_register and relay_check on a relay double | outputs, statements and events validate against registry schemas; events are in the same transaction as the state change"
      - "T08 | integration | 04.R03,02.R03 | consumer without consent tries processing; error injected into check | processing blocked in both cases"
      - "T09 | integration | 04.R03,03.R01 | notify.channel.opted_out delivered with via unsubscribe_link, settings, expired, account_deletion, privacy_withdrawal and relay_policy, for a matching and a non-matching relay | withdrawn only for unsubscribe_link (source unsubscribe) and settings (source ui) on the matching purpose and relay; every other case ignored; an already withdrawn consent and a replay are no-ops"
      - "T10 | abuse | 05.R01,05.R02,05.R03 | another module of a different vault tries to read; relay tries to alter | no access; statements from non-owner rejected"
      - "T11 | integration | 06.R01,06.R02,06.R03 | replay command ID; relay offline during withdrawal | original result; local processing stops at once; UI shows prepared"
      - "T12 | abuse | 07.R02,07.R03 | 31 grants in an hour; UI inspection of the grant sheet | 31st grant RATE_LIMITED; no pre-ticked control; limits of withdrawal stated"
      - "T13 | load | 08.R01,08.R02,08.R03 | 10 000 checks and 100 changes | check p99 ≤ 2 ms, propagation ≤ 1 s, no telemetry sent"
      - "T14 | a11y | 07.R02 | privacy settings and grant sheet | axe zero serious issues; keyboard-only completion; switches announced"
      - "T15 | unit | 09.R01,09.R03 | traceability tool run | every PS-076 requirement maps to a passing test"
      - "T16 | integration | 10.R01,10.R02,10.R03 | export, import with unknown policy hash, roll back one release | history round-trips; unknown hash imports as lapsed"
      - "T17 | contract | 01.R03,01.R04,07.R01 | capture every byte leaving the vault through network and relay doubles during grant, withdraw, lapse, deletion step and export | the only consent data leaving the vault are consent_statement and consent_withdrawal envelopes whose payload has exactly the allowlisted fields with the did only as envelope author, plus the user's export; no PrivacyConsent row leaves the vault"
      - "T18 | unit | 02.R04 | 100 withdrawals within one hour from UI, unsubscribe events and the deletion step across 5 relays | every withdrawal commits locally; none returns RATE_LIMITED; outgoing statements are coalesced to one batch per relay and none is dropped"
      - "T19 | abuse | 02.R05,04.R04 | relay_register with a replayed grant after its withdrawal, a grant addressed to another relay, a statement signed by a revoked key, a withdrawal naming another author's grant, an extra payload field, and a withdrawal that arrives before its grant | each refused with PRIVACY_CONSENT_STATEMENT_INVALID and the late grant refused; a valid statement is registered and its relay-signed acknowledgement moves the vault to peer_accepted"
      - "T20 | integration | 04.R04,01.R01 | cross-module contract with F13.S02.M03 and F06.S02.M02 doubles: grant notify_email for relay A, F13 opt-in, F13 channel expiry after 365 days; grant location_precise | the channel consent carries consentId and purpose; no F10 statement is sent for notify_*; channel expiry leaves the F10 consent granted; the location_precise grant shares nothing until an explicit per-share action"
      - "T21 | integration | 04.R05 | deletion DeletionPort plan and execute, retention purge port and export section with stub registries; cancel during grace | plan lists consent rows; cancel leaves every consent unchanged and queues no relay statement; execute withdraws all with source deletion and signs the federation withdrawals before the destroy_keys step; purge removes rows 2 years after withdrawal; section privacy.consents exported"
      - "T22 | integration | 04.R06,04.R03,02.R06 | vault composition with the kernel port registry double; F07.S01.M01 double calls ConsentCheckPort for federation_publish before a handle claim with and without a grant; F09.S01.M03 double calls privacy.consent.require for chain_lookup on a granted origin, another origin and with check failing; F06.S02.M02 double asks for location_precise without a grant | ConsentCheckPort answers exactly like privacy.consent.check; no depends_on edge from F07.S01.M01 is needed; the granted origin passes; the other origin, the failing check and the missing location consent return PRIVACY_CONSENT_REQUIRED with params purpose, endpoint or relayId and reason"
      - "T23 | integration | 01.R01,04.R04 | notify.channel.opted_out with via unsubscribe_link for the canonical relayId of the granted notify_email consent and for a hostname of the same relay | the canonical relayId withdraws the consent; the hostname matches nothing and the consent stays granted"
    acceptance:
      - All tests T01 to T23 pass in CI.
      - On a fresh vault every purpose reports not granted and no consumer processes for any purpose.
      - Withdrawal stops in-vault processing within 1 second, is never refused, and the UI states that copies cannot be recalled.
      - Exactly one relay-facing statement exists per relay-scoped purpose, and relays refuse replayed, cross-relay or revoked-key statements.
  import_export_backup_rollback:
    requirements:
      - The vault export contains the full consent history in the section privacy.consents.
      - Import re-evaluates each consent against the bundled policy hashes and lapses any whose hash is unknown or outdated.
      - Schema changes follow expand/contract and keep v1 readable for 180 days.
    export: "Section privacy.consents in classrup-export/v1; one line per PrivacyConsent (schema classrup.privacy.consent/v1) plus the signed statements (classrup.privacy.consent_statement/v1 and classrup.privacy.consent_withdrawal/v1)."
    import: "Granted consents import as lapsed unless the policy hash equals the current bundled hash; no import ever grants a consent that the user did not hold at export time, and imported statements are never re-sent to relays."
    backup: "The vault export is the primary backup (IOX-6); relays hold only the signed consent statements they received."
    migration_rollback: "Additive fields only in v1; rollback is safe because older readers ignore unknown optional fields; the default-off rule is never relaxed by a migration."
