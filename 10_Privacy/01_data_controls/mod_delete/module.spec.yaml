# F10.S01.M04 Account and data deletion (ADR-0015, ADR-0016). Deletion operates on the user's vault and sends signed tombstones to relays.
id: F10.S01.M04
scope: MVP
summary: >-
  The user can delete their identity and data. A request starts a 14-day grace period that the user can cancel. At the end of
  grace (deferred up to 30 more days while committed trades, deals or rentals are still open) the vault executes deletion: it
  sends signed tombstones to every relay that holds the user's public projections, tells counterparties of open commitments,
  replaces the user's identifier in retained evidence with a per-deletion pseudonym, crypto-shreds encrypted blobs by deleting
  their per-object keys, purges content, and finally destroys the device keys. The UI states plainly that copies already fetched
  by other vaults or relays cannot be recalled, that exported files and the user's own backups stay with the user, and that
  evidence is pseudonymized, not anonymized.
responsibilities:
  - Own DeletionRequest with its states, grace and deferral deadlines, per-module step progress and per-relay delivery state.
  - Orchestrate deletion across modules through the DeletionPort registry (plan, execute, pseudonymize), idempotently and resumably.
  - Produce signed statements classrup.privacy.deletion_request/v1 for relays and classrup.privacy.deletion_notice/v1 for counterparties of open commitments, and federation tombstones per CTR-FED-001 FED-4 for published records.
  - Pseudonymize the principal in retained RET-EVIDENCE records with a per-deletion pseudonym and destroy the pseudonymization salt at completion.
  - Crypto-shred encrypted blobs and keys, keep tombstones (ID, type, deletedAt) for 180 days, and keep a deletion ledger so restores never resurrect deleted data.
  - Handle relay-side application of a signed deletion request as a relay command, respecting relay legal holds.
non_responsibilities:
  - Retention sweeps and legal holds (F10.S01.M02), export (F10.S01.M03) and consent (F10.S01.M01).
  - Federation transport and peer tombstone application (F11); this module only produces signed tombstones and tracks delivery.
  - Recalling copies held by other vaults, relays, exported files or the user's own backups; the UI states this limit.
  - "Future: delegated deletion by a recovery contact and automatic deletion after prolonged inactivity."
depends_on: [F10.S01.M01, F10.S01.M02, F10.S01.M03, F07.S01.M01, F16.S02.M02, CTR-PRV-001, CTR-FED-001, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-IOX-001, CTR-OBS-001]
user_stories:
  - As a user, I can request deletion, see exactly what will happen and when, export my data first, and cancel during the 14 days.
  - As a user with an open swap, I see that deletion is deferred until it is finished or at most 30 more days, and my counterparties are told fairly.
  - As a user, I get an honest summary at the end: what was deleted, what was pseudonymized and kept, and what I cannot recall.
  - As a relay operator, I receive a signed deletion request and tombstones and remove what I hold unless a legal hold applies.
edge_cases:
  - The user cancels on day 13; the request is cancelled, consents withdrawn at request time stay withdrawn, and nothing was sent to relays.
  - A committed barter cycle is still open at day 14; deletion is deferred, the user is shown the blocking items, and after 30 more days it proceeds and counterparties receive a deletion notice so they can open recovery or disputes.
  - A relay is offline at execution; the signed tombstones wait in the sync outbox, completion is reached locally, and the summary lists that relay as prepared, not peer accepted.
  - The vault is restored from an old export after deletion completed; the restore flow reads the deletion ledger and refuses to restore deleted principals without an explicit user override that re-creates a new identity.
  - The PWA is closed mid-execution; execution resumes from the persisted step state at next open and every step is idempotent.
  - Another tab tries to publish a listing during grace; publishing is refused with PRIVACY_DELETION_PENDING.
  - A relay holds the user's data under a legal hold; it keeps that data sealed and out of public serving, and the user is told only that some relay copies may be retained under legal obligation.
ux:
  screens:
    - "Delete account screen: what will be deleted, what will be pseudonymized and kept (evidence for up to 2 years), what cannot be recalled, export-first link, checkbox Also remove my evidence copies in this vault, typed confirmation of the pseudonym, fresh unlock required."
    - "Pending deletion banner on every screen with days left, Cancel deletion button, and blocking commitments list when deferred."
    - "Completion summary: counts per module, relays by delivery state (prepared, relay received, peer accepted), pseudonym assigned to retained evidence, and the cannot-recall notice."
  states: [idle, needs-unlock, pending-grace, deferred, executing, completed, failed-retrying, cancelled]
  a11y:
    - The destructive confirmation requires typing text and has a clear cancel path; its warning is text, not only color.
    - The banner is a labelled region with a polite live update of days left.
    - Buttons are at least 44 by 44 px with distinct accessible names such as Cancel deletion and Request deletion.
processes:
  domain_schema:
    requirements:
      - A DeletionRequest stores the principal did, status, request time, grace end (14 days), deferral limit, evidence option, per-module step states, per-relay delivery states and the completion summary.
      - The pseudonymization salt exists only inside the request until completion and is then destroyed, so the pseudonym cannot be recomputed from the did afterwards.
      - A tombstone ledger entry (ID, type, deletedAt) is kept for 180 days after completion; the request record itself is P3 and retained as RET-EVIDENCE as proof of the deletion request.
    entities:
      - name: DeletionRequest
        schema: classrup.privacy.deletion_request/v1
        storage: device
        privacy: P3
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "vaultId: uuidv7 — local vault scope (CTR-ID-001 tenant slot)"
          - "did: did — principal being deleted"
          - "status: enum — pending_grace | deferred | executing | failed | completed | cancelled"
          - "requestedAt: timestamp — local clock"
          - "graceEndsAt: timestamp — requestedAt + 14 days"
          - "deferredUntil?: timestamp — at most graceEndsAt + 30 days"
          - "keepEvidence: boolean — default true; false also purges the user's own evidence copies in the vault"
          - "salt?: string — 256-bit random value; present only until completion, then destroyed"
          - "pseudonym?: string — del- plus 16 base32 characters of HMAC-SHA256(salt, did); set at execution"
          - "steps: array — up to 64 {moduleId, step: tombstone|pseudonymize|shred|purge, state: pending|done|failed, attempts: int ≤ 8}"
          - "blockers: array — open commitments {kind, ref} found at the last check, up to 50"
          - "relays: array — up to 20 {relayId, statementCid, syncState: prepared|transport_acknowledged|peer_accepted}"
          - "tombstoneCount: int — ≥ 0"
          - "completedAt?: timestamp — local clock"
          - "ledgerUntil?: timestamp — completedAt + 180 days"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - At most one request in pending_grace, deferred, executing or failed status per vault.
          - graceEndsAt equals requestedAt plus 14 days exactly and cannot be shortened.
          - salt is absent whenever status is completed or cancelled.
          - status executing is never cancelled; cancel is allowed only in pending_grace and deferred.
    sql: |
      CREATE TABLE privacy_deletion_request (
        id TEXT PRIMARY KEY, vault_id TEXT NOT NULL, status TEXT NOT NULL, grace_ends_at TEXT NOT NULL,
        revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX privacy_deletion_active ON privacy_deletion_request(vault_id)
        WHERE status IN ('pending_grace','deferred','executing','failed');
  validation_rules:
    requirements:
      - Requests are validated for fresh unlock, typed confirmation and the single-active-request rule.
      - Execution validates that grace has ended, that deferral limits are respected and that every registered module has a plan.
      - Incoming relay deletion statements are verified for signature by a registered key of the did and for freshness.
    rules:
      - "V01 | vault unlocked within the last 5 minutes | UNAUTHENTICATED"
      - "V02 | typed confirmation equals the principal's pseudonym | VALIDATION_FAILED"
      - "V03 | no other deletion request is active in this vault | PRECONDITION_FAILED"
      - "V04 | cancel only while pending_grace or deferred | CONFLICT_STATE"
      - "V05 | execution starts only at or after graceEndsAt | PRIVACY_DELETION_GRACE_ACTIVE"
      - "V06 | deferral lasts at most 30 days beyond graceEndsAt | PRIVACY_DELETION_DEFERRAL_LIMIT"
      - "V07 | every registered DeletionPort module returns a plan before executing | PRIVACY_DELETION_PLAN_MISSING"
      - "V08 | relay statement signature valid over JCS bytes, signer is a registered key of the did, signedAt within 24 h | PRIVACY_DELETION_STATEMENT_INVALID"
      - "V09 | publishing and new commitments refused while a request is active | PRIVACY_DELETION_PENDING"
  workflow_state_machine:
    requirements:
      - Deletion requests follow the declared machine; the point of no return is the transition to executing and the UI says so before the request.
      - Open commitments defer execution for at most 30 days and never silently extend further.
      - Execution is a resumable sequence of idempotent steps ending with destruction of device keys as the last step.
    machines:
      - entity: DeletionRequest
        initial: pending_grace
        terminal: [completed, cancelled]
        transitions:
          - "pending_grace -> cancelled | privacy.deletion.cancel by the principal | consents withdrawn at request stay withdrawn; salt destroyed"
          - "pending_grace -> executing | grace ended and no blocking commitments | execution plan loaded"
          - "pending_grace -> deferred | grace ended and blocking commitments exist | deferredUntil = graceEndsAt + 30 days; blockers listed"
          - "deferred -> cancelled | privacy.deletion.cancel by the principal | salt destroyed"
          - "deferred -> executing | blockers cleared or deferral limit reached | counterparties of remaining commitments receive a deletion notice"
          - "executing -> completed | all steps done and device keys destroyed | emits privacy.deletion.completed; salt destroyed; ledger entry written"
          - "executing -> failed | a step reaches 8 failed attempts | emits nothing; user and diagnostics show the failing module"
          - "failed -> executing | retry by sweep every 6 h or by the user | steps resume"
    timeouts:
      - "Grace 14 days; deferral at most 30 days; step retry up to 8 attempts with backoff 1 s, 5 s, 30 s, 5 min, then every 6 h."
      - "Tombstone ledger kept 180 days after completion; blockers re-evaluated at unlock and every 6 h while deferred."
  commands_queries_events:
    requirements:
      - Request and cancel are vault commands; execution is driven by an internal sweep and is not a user command; the relay command privacy.deletion.relay_apply serves operators' relays that receive the signed deletion statement.
      - Execution produces signed statements classrup.privacy.deletion_request/v1 (to relays), classrup.privacy.deletion_notice/v1 (to counterparties) and classrup.federation.tombstone/v1 (per published record).
      - The module consumes commitment-closing events to end deferral and never accepts a request to shorten the grace period.
    commands:
      - name: privacy.deletion.request
        capability: privacy.deletion.request
        input: "[vault command, local; statements are produced at execution] { confirmText, keepEvidence?: boolean (default true) }"
        output: "{ requestId, status: pending_grace, graceEndsAt, summaryPlan }"
        errors: [UNAUTHENTICATED, VALIDATION_FAILED, PRECONDITION_FAILED]
        emits: [privacy.deletion.requested]
        idempotent: true
      - name: privacy.deletion.cancel
        capability: privacy.deletion.cancel
        input: "[vault command, local] { requestId, expectedRevision }"
        output: "{ requestId, revision, status: cancelled }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: []
        idempotent: true
      - name: privacy.deletion.relay_apply
        capability: privacy.deletion.relay_apply
        input: "[relay command] signed statement classrup.privacy.deletion_request/v1 { did, requestId, signedAt, tombstones?: cid[] up to 100 per batch }"
        output: "{ accepted: boolean, purgedCount, heldCount }"
        errors: [VALIDATION_FAILED, PRIVACY_DELETION_STATEMENT_INVALID, RATE_LIMITED]
        emits: []
        idempotent: true
    queries:
      - name: privacy.deletion.get
        capability: privacy.deletion.read
        input: "{ requestId? }"
        output: "{ request: DeletionRequest, blockers[], relayStates[] }"
        errors: [NOT_FOUND]
      - name: privacy.deletion.preview
        capability: privacy.deletion.read
        input: "no parameters (empty object)"
        output: "{ perModule: [{moduleId, willDelete, willPseudonymize, cannotRecall}], relays: string[] }"
        errors: []
    events_produced:
      - {type: privacy.deletion.requested, privacy: P3, payload: "{ requestId, graceEndsAt, keepEvidence }"}
      - {type: privacy.deletion.completed, privacy: P1, payload: "{ requestId, pseudonym, tombstoneCount, completedAt }"}
    events_consumed:
      - {type: mutiny.cycle.completed, effect: "re-evaluate blockers of a deferred request; execute when none remain"}
      - {type: mutiny.cycle.cancelled, effect: "re-evaluate blockers of a deferred request"}
      - {type: commerce.deal.completed, effect: "re-evaluate blockers of a deferred request"}
      - {type: commerce.dispute.resolved, effect: "re-evaluate blockers of a deferred request"}
      - {type: rentals.rental.closed, effect: "re-evaluate blockers of a deferred request"}
    errors:
      - "PRIVACY_DELETION_STATEMENT_INVALID | 422 | no | relay deletion statement has an invalid signature, signer or freshness"
      - "PRIVACY_DELETION_PENDING | 409 | no | a deletion request is active; publishing and new commitments are refused"
      - "PRIVACY_DELETION_GRACE_ACTIVE | 409 | no | the 14-day grace period has not ended"
      - "PRIVACY_DELETION_DEFERRAL_LIMIT | 409 | no | deferral cannot exceed 30 days beyond the grace period"
      - "PRIVACY_DELETION_PLAN_MISSING | 500 | no | a registered module has no deletion plan; build and CI must fail for this"
    example: |
      vault command privacy.deletion.request { "confirmText": "quiet-otter-42", "keepEvidence": true }
      => { "requestId": "0192f3e0-…", "status": "pending_grace", "graceEndsAt": "2026-11-18T10:00:00.000Z",
           "summaryPlan": { "pseudonymize": ["commerce.deals", "commerce.receipts"], "delete": ["bazaar.listings", "comms.messages"], "relays": ["relay.example.org"] } }
      day 14: executing -> tombstones queued (prepared) -> pseudonymize -> crypto-shred -> keys destroyed -> completed, pseudonym del-7q3k9m2x4t8w5r1c
  authorization_capabilities:
    requirements:
      - Under vault policy (CAP-8) only the unlocked principal requests or cancels deletion of its own vault, with a fresh unlock within 5 minutes; deletion rights survive suspension on any relay (CAP-5, CAP-9).
      - Relays accept privacy.deletion.relay_apply only for statements signed by a registered key of the deleted did; relay operators cannot start deletion of a user's vault.
      - Operators can view relay-side deletion counts but not subjects' vault contents.
    capabilities:
      - "privacy.deletion.request | local-principal | vault unlocked within 5 minutes; no active request"
      - "privacy.deletion.cancel | local-principal | request pending_grace or deferred"
      - "privacy.deletion.relay_apply | relay-device-key | statement signed by a registered key of the did; relay rate limit 60 batches per hour per did"
      - "privacy.deletion.read | local-principal | vault unlocked"
  failure_recovery_idempotency:
    requirements:
      - Request and cancel are idempotent per CTR-IDM-001 using vault command IDs and expectedRevision.
      - Every execution step is idempotent and its state is persisted, so a crash or closed tab resumes where it stopped.
      - A failure never leaves a half-deleted principal unannounced; failed state is visible and retried every 6 hours.
    idempotency: "Vault command ID recorded for 24 h; steps keyed by (requestId, moduleId, step); relay_apply keyed by (did, requestId, batch hash) and safe to replay."
    concurrency: "Partial unique index allows one active request per vault; Web Lock privacy-delete during execution; other tabs show read-only mode and refuse new publishing with PRIVACY_DELETION_PENDING."
    retries: "Steps retry up to 8 times with 1 s, 5 s, 30 s and 5 min backoff then every 6 h; relay statements retry 5 s, 30 s, 5 min, 1 h, then every 6 h for 30 days."
    offline: "Request and cancel work offline; execution proceeds locally offline and queues relay statements; completion shows relays as prepared until acknowledged."
    partial_failure: "Order of steps is tombstones queued, pseudonymize evidence, crypto-shred blobs, purge content, destroy keys last. If a step fails, earlier steps stay done and the request is failed and retried; keys are destroyed only when every earlier step is done."
  privacy_retention_abuse:
    requirements:
      - Deletion removes content and shreds keys; evidence classes under RET-EVIDENCE are pseudonymized and kept until their retention ends unless the user chooses to purge their own evidence copies; pseudonymized is not anonymized.
      - The UI and completion summary state that copies fetched by other vaults and relays, exported files and user backups cannot be recalled, and that relay legal holds may retain relay-held copies sealed.
      - Abusive or coerced deletion is limited by the fresh unlock, typed confirmation, 14-day grace with banners, and cancellation.
    data:
      - "DeletionRequest: P3. Salt: P4, destroyed at completion. Pseudonym: P1 identifier shown in retained evidence."
      - "Tombstone ledger entries: ID, type, deletedAt only, kept 180 days."
    retention:
      - "Deleted content purged at execution; retained evidence per RET-EVIDENCE (2 years after last related activity) in pseudonymized form; ledger 180 days; DeletionRequest record RET-EVIDENCE."
      - "Crypto-shredding removes keys for encrypted blobs; relays that hold ciphertext keep unreadable bytes until their retention sweep."
    threats:
      - "T01 | Attacker with a briefly unlocked device deletes the account | fresh unlock within 5 minutes, typed pseudonym confirmation, 14-day grace with persistent banner and local notification, cancellation allowed"
      - "T02 | Pseudonymized evidence re-identified through the salt | salt destroyed at completion; honest notice that behavioral linkage in evidence may still identify the person"
      - "T03 | Deleted data resurrected from backup or old export | deletion ledger consulted by the restore flow; backups of the user's own export are outside platform control and the UI says so"
      - "T04 | Relay ignores tombstones | signed tombstones are verifiable evidence; per-relay delivery state shown; clients can drop that relay"
      - "T05 | Counterparty harmed by sudden deletion mid-trade | deferral up to 30 days for open commitments and a signed deletion notice so counterparties can use recovery or disputes"
    abuse_controls:
      - "One request at a time; relay_apply limited to 60 batches per hour per did; tombstone batches limited to 100 envelopes (FED-5)."
  observability_performance:
    requirements:
      - The PWA sends no telemetry (OBS-7); step states, durations and failures stay in local diagnostics that the user can export, and relays measure relay_apply per CTR-OBS-001.
      - Execution completes within the budget for typical vaults and never blocks the UI thread over 50 ms.
      - Failed steps are surfaced with the module name.
    metrics:
      - "Local diagnostics: classrup_privacy_deletion_requests_total{status}"
      - "Local diagnostics: classrup_privacy_deletion_step_duration_ms{step} (histogram)"
      - "Relay only: classrup_privacy_deletion_relay_apply_total{outcome=accepted|held|rejected}"
    logs:
      - "info deletion.status {requestId, from, to, correlationId} — no content, no did in plain form beyond the pseudonym after completion."
    budgets:
      - "Execution for 10 000 records and 200 MB of encrypted blobs completes in ≤ 120 s on a mid-range phone."
      - "relay_apply of a 100-tombstone batch p95 ≤ 500 ms."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement is covered by at least one automated test.
      - Execution is tested with a controllable clock and stub DeletionPorts for every module including failing ones.
      - The no-resurrection property is tested by restoring an old export after completion.
    fixtures: "Seeded vault with listings, messages, deals, receipts, an open committed cycle and two relays (one offline); stub DeletionPorts; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,02.R01,02.R02 | request deletion with wrong then right confirmation text and stale unlock | right text with fresh unlock creates pending_grace; others return documented errors"
      - "T02 | unit | 01.R03,02.R03,03.R01 | cancel at day 13; try to cancel while executing | cancelled with salt destroyed; executing refuses with CONFLICT_STATE"
      - "T03 | unit | 02.R03,03.R02 | commitments open at day 14, then clear at day 20, then limit reached | deferred then executing; at day 44 execution proceeds with notices sent"
      - "T04 | integration | 03.R03,06.R02,06.R03 | kill the app after each step and reopen | execution resumes from persisted state; keys destroyed only after all earlier steps done"
      - "T05 | property | 03.R01 | random event and time sequences | only declared transitions succeed; completed and cancelled have no exits"
      - "T06 | contract | 04.R01,04.R02,04.R03,09.R02 | execute request and execution; ingest relay_apply on a relay double | statements, tombstones and events validate against registry schemas"
      - "T07 | integration | 04.R02,07.R01 | complete deletion with keepEvidence true then false | true keeps pseudonymized evidence and deletes content; false also purges own evidence copies; pseudonym stable across modules"
      - "T08 | abuse | 05.R01,05.R02,05.R03 | relay_apply with a statement signed by another did; operator tries to start deletion; suspended on a relay | rejected or FORBIDDEN; deletion by owner still allowed"
      - "T09 | integration | 06.R01 | replay same command ID; offline execution with an offline relay | original result; completion with relay shown prepared"
      - "T10 | integration | 07.R01,07.R02 | after completion inspect storage and UI summary | content gone, salt destroyed, pseudonym recorded, cannot-recall notice and relay-hold notice displayed"
      - "T11 | chaos | 07.R03,06.R03 | restore an old export after completion | restore flow refuses the deleted principal via the ledger unless the user overrides with a new identity"
      - "T12 | abuse | 07.R03,02.R03 | publish a listing and create a deal during grace | PRIVACY_DELETION_PENDING"
      - "T13 | load | 08.R01,08.R02,08.R03 | 10 000 records and 200 MB blobs; 100-tombstone relay batch | ≤ 120 s; relay p95 ≤ 500 ms; main-thread block ≤ 50 ms; no telemetry sent"
      - "T14 | unit | 09.R01,09.R03 | traceability tool run and CI check for modules without DeletionPort | every PS-077 requirement maps to a passing test; build fails for a module without a plan"
      - "T15 | e2e | 01.R02,07.R02 | user flow on two devices with banner, cancel and final summary | banner and summary shown with limits; axe zero serious issues"
      - "T16 | integration | 10.R01,10.R02,10.R03 | export before deletion, import into fresh vault, roll back one release | export contains the request metadata only; ledger survives rollback"
    acceptance:
      - All tests T01 to T16 pass in CI.
      - After completion no module retains content or recoverable keys for the principal, and retained evidence carries only the pseudonym.
      - The grace period of 14 days cannot be shortened by any API.
      - The completion summary always states what cannot be recalled.
  import_export_backup_rollback:
    requirements:
      - The vault export includes DeletionRequest metadata in the section privacy.deletion and the user is prompted to export before the grace period ends.
      - A restore or import consults the tombstone and deletion ledger before committing and never resurrects a completed deletion without the user's explicit override that creates a new identity.
      - Schema changes follow expand/contract and keep v1 readable for 180 days; the ledger format is stable for at least 180 days.
    export: "Section privacy.deletion in classrup-export/v1: the active DeletionRequest metadata without salt (schema classrup.privacy.deletion_request/v1). After completion no export is possible because the vault no longer exists."
    import: "A bundle whose did appears in the deletion ledger is refused with a clear message; override creates a new did and imports content as a new principal."
    backup: "User-held exports and encrypted backups are outside platform control and are not erased; the UI says so. Relay backups follow CTR-IOX-001 IOX-3 and after a restore the relay replays its deletion ledger before serving."
    migration_rollback: "Additive fields only; rollback is safe because the ledger is append-only and older readers ignore unknown fields."
