      Commitment predicates (subject key and conflict test used by F11.S01.M02 and F11.S02.M03; owning modules confirm their entries): classrup.federation.move/v1 conflicts when two verified moves of one subject are open with different toRelay; classrup.comms.consent/v1 (F08.S02.M02) conflicts when one signer signs the same subjectType, subjectRef and statementKey over different subjectRevisionHash values, which covers two acceptances of one offer and two consents on one proposal; classrup.bazaar.reservation/v1 (F01.S03.M01) conflicts when one signer reserves overlapping items of the same listing to different holders with overlapping unexpired windows; classrup.commerce.deal/v1 (F09.S01.M01) conflicts when one signer signs two different obligation digests for one dealId. Registered ext members: stream, signerKey, audience, recipients [{did, mailboxId}], supersedes, crit (critical-extension list, F11.S01.M03 V08); unknown non-critical ext members are preserved byte-exact within the 4 KiB ext cap and never added by buildDraft.
  validation_rules:
    requirements:
      - Outbound mapping is default-deny, so a new local field is never exported until it is added to an allowlist and reviewed.
      - Inbound payload validation uses the same allowlist and location rules and rejects unknown fields and any location finer than L2 instead of ignoring or trimming them.
      - Every rejection returns a stable code that the calling module surfaces without echoing field values.
      - Location precision is enforced on both paths through F06.S02.M01 assertPublicCell; outbound cells are snapped to L2 before the check (PRV-1) and inbound payloads with a cell longer than 5 characters or with coordinate members are rejected.
      - Outbound portable drafts carry no timestamp finer than the UTC hour, checked with F10.S02.M03 assertCoarseTime over the draft's declared timestamp members and createdAt after publicTime has floored them.
    rules:
      - "V01 | envelope type is registered in the statement-type registry; receivers quarantine unregistered types | FEDERATION_SIGNER_ROLE_INVALID"
      - "V02 | audience public portable types only: source record has federation opt-in true for this record at draft time and again when F11.S01.M02 signs; participant and control statements need no federation opt-in | FEDERATION_NOT_OPTED_IN"
      - "V03 | every outbound field is on the allowlist for the type and classified P0 | FEDERATION_EXPORT_FORBIDDEN_FIELD"
      - "V04 | outbound: the location cell is snapped to its containing L2 cell (length ≤ 5) and passes F06.S02.M01 assertPublicCell; a latitude or longitude member anywhere in payload or ext refuses the export | FEDERATION_EXPORT_FORBIDDEN_FIELD"
      - "V05 | media references are content hashes of metadata-stripped images; no image reports GPS tags | FEDERATION_EXPORT_FORBIDDEN_FIELD"
      - "V06 | inbound payload has no members outside the allowlist, members have the declared types and strings are ≤ 10000 code points | FEDERATION_PAYLOAD_INVALID"
      - "V07 | inbound payload does not exceed 65536 bytes | PAYLOAD_TOO_LARGE"
      - "V08 | audience public portable types only: the type is one of the five portable allowlist types (listing, profile, service offering, rental offering, rental busy blocks) and its version major is supported | UNSUPPORTED_SCHEMA_VERSION"
      - "V09 | inbound location: the type's location cell member (listing regionCell, offering serviceAreaCell, rental offering pickupAreaCell, profile region.geohash) has length ≤ 5 and passes F06.S02.M01 assertPublicCell, and no latitude or longitude member is present | FEDERATION_PAYLOAD_INVALID"
      - "V10 | role resolution keeps key classes apart: relay roles resolve only through relay-key resolvers (keys pinned in F11.S03.M01, or the self-certifying key history of F15.S02.M01 for relay_identity roles, in both cases equal to the relay a named-relay role names) and user roles only through the injected portable-document resolver (F07.S02.M01); a key of the other class never matches | FEDERATION_SIGNER_ROLE_INVALID"
      - "V11 | control types validate against their per-type payload schema in the registry; participant statements carry a ciphertext payload {alg, ciphertext, recipientsKeyIds} of at most 12288 bytes, checked for shape and size only | FEDERATION_PAYLOAD_INVALID"
      - "V12 | outbound portable drafts: every declared timestamp member and createdAt equals its F10.S02.M03 publicTime value (busy-block ends raised to the next full hour) and the draft passes assertCoarseTime for those members; a draft that still fails is refused and nothing is published | FEDERATION_EXPORT_FORBIDDEN_FIELD"
      - "V13 | delegated and relay operator roles: the author is listed with the row's role in the publisher's latest verified authority list returned by the delegations resolver (policy_decision: anchored no later than decidedAt and first listed at least 14 d before the proposal relay receipt) and never equals payload.publisherId, or is in operatorKeys of the named relay's latest verified tenant_config returned by the operatorKeys resolver (transparency_report: never the author of the embedded draft); a missing resolver, list or tenant_config resolves no role | FEDERATION_SIGNER_ROLE_INVALID"
  workflow_state_machine:
    requirements:
      - The mapper is stateless and the draft/mirror conversion is a pure function of its inputs.
      - The only sequencing rule is that a draft must be signed and stored through the F11.S01.M02 publish path (StatementPublisherPort) before it is visible to any peer.
      - No lifecycle is stored here, so there is no state machine.
    machines: []
    timeouts: []
    note: "Stateless mapper; record lifecycle states belong to F11.S01.M02 (FederatedRecord) and the source modules."
  commands_queries_events:
    requirements:
      - The module exposes TypeScript functions only and no network commands or queries.
      - Functions return Result<T, AppError> and never include rejected field values in error params.
      - The module emits no events; draft building is a local pure step.
      - F11's own statement types and their signer roles are listed in the registry table of the domain schema (N2); other modules contribute entries for their own types, and every entry has an audience, signer role, role resolution, payload schema and maximum age.
      - The compiled registry is exported as machine-readable data (statement-registry.json) with one row per type {type, owner, audience, signerRole, roleResolution, payloadSchema, subjectKey?, version?, commitment?, maxAge, acknowledger, privacyClass, aliasOf?}, from which F17.S01.M03 generates one contract row per entry plus a wrong-role negative case.
      - roleFor(type, context) implements the F16.S01.M01 RoleResolverPort and is bound by the vault composition root; this module never calls authorizeStatement and stores no decision.
    commands: []
    queries: []
    note: "API: buildDraft(record, now) -> UnsignedDraft (no seq or prev; F11.S01.M02 allocates them; createdAt and every declared payload timestamp floored with F10.S02.M03 publicTime); previewDraft(record) -> {fields[], excluded[]}; toMirrorView(verifiedEnvelope) -> MirrorView {type, cid, author, recordKey, version?, remote: true, readOnly: true, fields} where fields are the allowlisted payload members (for classrup.bazaar.listing/v1 including listingRevision, expiresAt, inStock, variants, acceptedCurrencies, mailboxHints and giveaway closesAt); allowlistFor(type) -> string[]; validateInbound(envelope) -> Result<void> (V06, V07, V09, V11); entryFor(type) (alias registryEntry) -> {type, owner, audience, signerRole, roleResolution, payloadSchema, subjectKey?, version?, commitment?, maxAge, acknowledger, privacyClass, aliasOf?} or none; exportRegistry() -> rows of entryFor for every registered type (statement-registry.json); roleFor(type, context) -> RoleRule, the F16.S01.M01 RoleResolverPort implementation with resolvers {portableDoc, pinnedRelayKey, relayKeyHistory, subscriptions, delegations, operatorKeys} bound at composition (delegations.listed(publisherId, key) -> {role, firstListedReceiptAt, anchoredAt, listVersion} or none, registered by F18.S02.M01; operatorKeys.of(relayId) -> did:key[] or none, registered by F15.S04.M03), used by F16.S01.M01 authorizeStatement for F11.S01.M02 V14 and V15; subjectKeyOf(type, payload) -> string or none; conflictsWith(a, b) -> boolean (commitment predicate); maxAgeOf(type) -> ms or none. StatementPublisherPort { publish({type, audience, payload, recipients[{did, mailboxId}]}) -> {cid, seq, chainKey}; issueTombstone({targetCid?, targetRecordKey?, reason}) -> {tombstoneCid} } is implemented by F11.S01.M02. Participant-audience statements are encrypted by their source modules and only shape-checked, never mapped, here."
    events_produced: []
    events_consumed: []
    errors:
      - "FEDERATION_NOT_OPTED_IN | 403 | no | the owner has not enabled federation for this public record"
      - "FEDERATION_EXPORT_FORBIDDEN_FIELD | 422 | no | the record contains a field or precision that must not be exported"
      - "FEDERATION_PAYLOAD_INVALID | 422 | no | inbound payload has unknown members, wrong types, a location finer than L2 or coordinates, or exceeds string limits"
      - "FEDERATION_SIGNER_ROLE_INVALID | 422 | no | the type is unregistered or the signer key does not hold the role the type requires; the statement is quarantined"
    example: |
      buildDraft({ type: "classrup.bazaar.listing/v1", listingId: "0192f3a4-...", title: "Road bike", geohash: "u33dbcx", publishedAt: "2026-11-04T10:37:21.410Z", federate: true }, now = 2026-11-04T10:37:22Z)
      -> { v: 1, type: "classrup.bazaar.listing/v1", author: "did:key:z6MkRoot...", createdAt: "2026-11-04T10:00:00.000Z", payload: { listingId: "0192f3a4-...", title: "Road bike", regionCell: "u33db", listingRevision: 3, publishedAt: "2026-11-04T10:00:00.000Z" }, ext: { stream: "pub", audience: "public" } }
      entryFor("classrup.bazaar.offer_decision/v1") -> { owner: "F01.S04.M01", audience: "participants", signerRole: "listing author", roleResolution: "principal", acknowledger: "counterparty", privacyClass: "P2", maxAge: null }
      roleFor("classrup.federation.peer_accept/v1", { author: "did:key:z6MkUserDevice..." }, resolvers) -> { ok: false, code: "FEDERATION_SIGNER_ROLE_INVALID" }  // user key cannot hold a relay role
  authorization_capabilities:
    requirements:
      - The library performs no authorization; callers (listing publication, profile settings, delivery) decide who may federate which record.
      - The opt-in flag is read from the source record at draft time and re-checked by F11.S01.M02 publish inside the signing transaction; an opt-in revoked after drafting refuses the publish with FEDERATION_NOT_OPTED_IN, and one revoked after signing cancels still-prepared deliveries through F11.S02.M01.
      - Mirror views contain only P0 data and may be shown to anonymous readers when the tenant has public browse enabled.
    capabilities: []
  failure_recovery_idempotency:
    requirements:
      - Draft building is deterministic for identical record and clock, so retries cannot create divergent drafts.
      - A failed draft leaves no state; the caller retries after fixing the record.
      - This module never allocates seq or prev; F11.S01.M02 publish allocates them in the transaction that stores the envelope, so a lost response never skips or duplicates a sequence number.
    idempotency: "buildDraft is a pure function; identical inputs give identical drafts (same payload and canonical bytes)."
    concurrency: "No shared state. Two concurrent publishes of drafts by the same device are serialized by F11.S01.M02, which allocates seq n+1 and n+2 under its unique (author, signerKey, stream, seq) index."
    retries: "Callers retry after fixing the record; no automatic retry inside the library."
    offline: "Runs fully offline on-device; drafts are signed and stored locally by F11.S01.M02 and queued in the F15.S01.M01 outbox when the device key is available."
    partial_failure: "A draft either validates entirely or returns an error; there is no partially mapped payload."
  privacy_retention_abuse:
    requirements:
      - Only owner-opted-in P0 data at maximum precision L2 can leave the vault as a public projection; every other field is refused or the export refused.
      - Exact home address (P3), contact details and anything P1-P4 can never appear in a draft; tests assert this on every release.
      - Pseudonymity is not anonymity, so the consent preview states that all records of one did:key are linkable and that deletion propagates by tombstone but cannot recall copies.
    data:
      - "Drafts: P0 only, transient, not stored by this module."
      - "Mirror views: P0 copies of remote content; stored by F11.S01.M02."
      - "Registry: static P0 configuration."
    retention:
      - "No retention in this module; stored mirrors follow F11.S01.M02 (RET-STANDARD with tombstone stubs kept at least as long as the target type's maxAge)."
    threats:
      - "T01 | New local field silently leaking into federation | default-deny allowlist; CI test fails if a record type has a field without a classification annotation"
      - "T02 | Location refinement attack (geohash 7 or coordinates in payload or ext) | V04 snaps outbound cells to L2 and refuses coordinates anywhere in payload or ext; V09 rejects finer inbound cells; assertPublicCell on both paths; outbound drafts carry only registered ext members"
      - "T03 | Metadata leakage through images (EXIF GPS, device serial) | V05 only references stripped media hashes; relay rejects GPS tags per PRV-4"
      - "T04 | Remote payload with executable or HTML content | inbound strings are plain text; mirror view escapes at render; links shown as text"
      - "T05 | Signer-role confusion: a relay key used as a user author, or a user key presented for a relay role | V10 resolves relay and user roles through separate resolvers; tests per registry entry include relay-key-as-author and user-key-as-relay negatives (T16, T19)"
      - "T06 | Activity-pattern inference from exact public timestamps | publicTime floors every public payload timestamp and createdAt to the UTC hour (V12, F10.S02.M03); order inside the hour comes from version members and per-chain seq only"
      - "T07 | Governance capture: a publisher decides its own proposal, adds a decider key just before deciding, or one operator compiles and reviews its own transparency report | delegated roles need an authority-list entry first listed at least 14 d before the proposal relay receipt and an author different from the publisher; the reviewer must be another operator key than the draft's compiler (V13)"
    abuse_controls:
      - "Per-author publish rate cap 60 statements/hour enforced by F11.S01.M02 through F12.S03.M03 rate limits."
      - "Inbound payloads over 65536 bytes are rejected before parsing members."
  observability_performance:
    requirements:
      - Mapping outcomes are counted per rejection code without recording field values.
      - Building one draft takes under 1 ms p95 for a typical 4 KiB listing.
      - Allowlist and registry coverage is reported as a build artifact on every CI run.
    metrics:
      - "classrup_federation_draft_total{outcome=ok|not_opted_in|forbidden_field|invalid}"
      - "classrup_federation_inbound_payload_total{outcome=ok|invalid|too_large|precision}"
      - "classrup_federation_role_resolution_total{outcome=ok|unregistered|role_invalid}"
    logs:
      - "info federation.draft.refused {type, code, correlationId} — never field values or record contents."
    budgets:
      - "buildDraft p95 ≤ 1 ms for records ≤ 4 KiB; ≤ 10 ms for 65536 byte payloads."
      - "roleFor p95 ≤ 0.2 ms excluding resolver lookups; allowlist and registry coverage check completes in ≤ 5 s in CI."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - A privacy test suite enumerates every field of every source record type and proves non-allowlisted fields never appear in a draft.
      - Round-trip tests prove that a draft payload maps back to an equal mirror view.
    fixtures: "Listing, profile and offering fixtures with P0..P3 fields populated including a home address, exact lat/lon, geohash 7 and a GPS-tagged image; a pinned relay key R and a user principal U with device key D in a portable-document stub; shared golden envelopes from F11.S01.M03; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,02.R01,09.R02 | build drafts for the three record types | payload members equal the allowlist subset; classification annotations present; drafts carry no seq or prev"
      - "T02 | property | 01.R03,02.R01,07.R01 | random records with random extra fields and outbound geohash lengths 1-12 | no draft contains a non-allowlisted member; geohash length ≤ 5 and equal to the prefix of the source cell (snapped); assertPublicCell called once per draft"
      - "T03 | unit | 02.R04,07.R02 | outbound record with geohash 7 only; with exact lat/lon; with homeAddress and email | geohash 7 is snapped to its 5-character L2 cell with level L2 (export succeeds); lat/lon, homeAddress and email each refuse the export with FEDERATION_EXPORT_FORBIDDEN_FIELD"
      - "T04 | unit | 02.R03,02.R01 | record with opt-in false | FEDERATION_NOT_OPTED_IN; error params contain no field values"
      - "T05 | unit | 02.R02,02.R03 | inbound payload with extra member, 65537 bytes, unknown type version listing/v2 | FEDERATION_PAYLOAD_INVALID, PAYLOAD_TOO_LARGE (and not PAYLOAD_INVALID), UNSUPPORTED_SCHEMA_VERSION"
      - "T06 | unit | 01.R02,02.R01 | image referenced with GPS tag present | FEDERATION_EXPORT_FORBIDDEN_FIELD"
      - "T07 | contract | 03.R01,03.R02,04.R01,04.R02 | exercise each exported function | signatures and Result shapes match the schema registry; error params contain no values; toMirrorView refuses envelopes that F11.S01.M02 has not stored"
      - "T08 | unit | 03.R03,04.R03,05.R01 | inspect module for event emission, stored lifecycle state and authorization calls | none present"
      - "T09 | integration | 03.R02,05.R03,09.R03 | draft then F11.S01.M02 publish then receive in a second vault then toMirrorView | mirror view equals source P0 fields, labelled remote, readable anonymously, no private fields"
      - "T10 | unit | 06.R01,06.R02,06.R03 | identical inputs twice; failing draft; two concurrent publishes of drafts from one device | identical drafts; failure leaves no state; F11.S01.M02 assigns seq n+1 and n+2 and no caller-supplied seq exists in the API"
      - "T11 | a11y | 07.R03 | open consent preview with screen reader and keyboard only | every field and the linkability notice are announced, controls ≥ 44 px"
      - "T12 | abuse | 02.R02,07.R03 | inbound payload with script tag and long link text | stored as plain text and rendered escaped"
      - "T13 | load | 08.R02,08.R01 | 10 000 draft builds of 4 KiB records | p95 ≤ 1 ms, counters exported"
      - "T14 | unit | 08.R03,09.R01 | coverage and traceability tools run | allowlist and registry report produced; every PS-083 requirement maps to a passing test"
      - "T16 | unit | 01.R04,04.R04 | roleFor for every registry row (three portable types and every F11 type) with the correct signer and with a wrong signer of the same key class | correct signer resolves its role; wrong signer yields a rule that makes F11.S01.M02 quarantine; every row has audience, role, resolution, schema and maxAge"
      - "T15 | unit | 10.R01,10.R02,10.R03 | upgrade allowlist v1 to v1 plus optional field; read older drafts; downgrade | older mirror views still validate; rollback keeps v1 behavior and rejects newer members"
      - "T17 | integration | 05.R02 | opt-in revoked between buildDraft and F11.S01.M02 publish; opt-in revoked after publish while deliveries are prepared | first refused with FEDERATION_NOT_OPTED_IN and nothing signed; second cancels the prepared deliveries and queues a tombstone for delivered copies"
      - "T18 | unit | 07.R02,09.R02 | release privacy suite over every source record type with P1-P4 fields, home address and contact details | none appears in any draft"
      - "T19 | unit | 01.R05,01.R06 | listing signed by pinned relay key R as author; peer_accept signed by user device key D; type classrup.federation.unknown/v1 | each quarantined with FEDERATION_SIGNER_ROLE_INVALID; V01 runs and fails independently of V08"
      - "T20 | property | 02.R02,02.R04 | inbound payloads with geohash lengths 6-12 and with latitude or longitude members | every one rejected with FEDERATION_PAYLOAD_INVALID; assertPublicCell invoked on the inbound path"
      - "T21 | contract | 01.R07 | producer stubs (listing publication, profile, offering, peer, blocklist, migration) call StatementPublisherPort.publish and issueTombstone | every call reaches the F11.S01.M02 implementation, which allocates seq; no producer signs through another path"
      - "T22 | unit | 01.R06,02.R03 | tombstone, ack, peer_offer and move payloads, and a participants ciphertext payload of 12288 and 12289 bytes | per-type schemas checked; portable allowlist (V08) and opt-in (V02) never applied to them; 12289 bytes rejected with FEDERATION_PAYLOAD_INVALID"
      - "T23 | unit | 01.R08,02.R05 | listing published at 10:47:12.345 with expiresAt 2026-12-04T10:47:12.345Z; busy block 10:20-11:40; two listing revisions inside one hour; a draft with an undeclared fine timestamp member | createdAt and publishedAt 10:00:00.000Z, expiresAt 2026-12-04T10:00:00.000Z; busy block 10:00-12:00; assertCoarseTime passes; revisions ordered by listingRevision and seq; the undeclared member refused with FEDERATION_EXPORT_FORBIDDEN_FIELD"
      - "T24 | unit | 01.R09,04.R05 | entryFor and exportRegistry over every F11 and contributed row | every row has owner, audience, signerRole, roleResolution, payloadSchema, maxAge, acknowledger and privacyClass; participants rows give counterparty and P2, relay-audience rows destination_relay and P1, public rows none and P0 unless the row overrides; aliases carry aliasOf; the export validates against its JSON schema"
      - "T25 | contract | 01.R10,04.R06 | F16.S01.M01 authorizeStatement stub with RoleResolverPort bound to roleFor at composition; module import scan | authorizeStatement receives the role only from roleFor; this module never calls authorizeStatement and F16.S01.M01 has no import of it"
      - "T26 | unit | 01.R02,02.R01 | build drafts for a listing with every kind subset and variants, a service offering with credential evidence, a rental offering and a busy-blocks summary | payload keys equal the closed key sets of the note; offering keeps providerTimeZone, seq, prev and publishedAt and drops evidenceAttachmentId; maxBudget only when budgetVisible; busy blocks carry intervals and unit counts only"
