  import_export_backup_rollback:
    requirements:
      - The library stores nothing, so user export and import of federated content is handled by F11.S01.M02 and F11.S03.M03.
      - Allowlists and registry rows are versioned data; adding a field is a schema minor change and removing one is a major change with a 180-day dual-read period.
      - Rollback to a previous release must never widen an allowlist or relax a registry role, so a downgrade fails closed.
    export: "Allowlist tables and the compiled statement-type registry are exported as build artifacts (allowlists.json, statement-registry.json with one row per type including owner, audience, signerRole, roleResolution, payloadSchema, maxAge, acknowledger and privacyClass) with each release for audit and test generation (F17.S01.M03); no user data."
    import: "No user data is imported by this module; inbound payload validation uses the allowlist and registry bundled with the running release."
    backup: "Nothing to back up; allowlists and the registry are versioned in source control with the schema registry."
    migration_rollback: "Expand/contract: new optional fields are added to the allowlist in a release before any producer uses them; rollback restores the earlier narrower allowlist, which rejects newer payload members as FEDERATION_PAYLOAD_INVALID, and unknown newer statement types are quarantined."
