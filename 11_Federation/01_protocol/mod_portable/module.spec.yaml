id: F11.S01.M01
scope: MVP
summary: >-
  Library that maps locally owned P0 records (listings, public profiles, service offerings, rental offerings and
  rental busy blocks) to unsigned federation envelope drafts and maps verified inbound envelope payloads back to
  read-only mirror views. Every timestamp of a public draft, including the envelope createdAt, is floored to the UTC
  hour with F10.S02.M03 publicTime, and readers order records by version member or per-chain seq, never by time.
  Each portable record type has a field allowlist; anything not on the allowlist and anything above class P0 is
  refused, and location is snapped to its L2 cell (geohash 5) and checked with F06.S02.M01 assertPublicCell on the
  way out and on the way in. Signing, seq allocation and storage are done by F11.S01.M02 through the
  StatementPublisherPort declared here. It runs in the user's browser vault (ADR-0016) and in relays for validating
  inbound public projections. It also holds the statement-type registry (N2): for every envelope type the audience,
  the signer role a receiver must verify, how that role is resolved (user roles only through the author's portable
  identity document, delegated governance roles additionally through the publisher's verified authority list, relay
  roles only through pinned or self-certifying relay keys), the payload schema, the optional
  subject key and commitment predicate, the maximum age, the acknowledger and the privacy class. Its roleFor is the
  implementation of the F16.S01.M01 RoleResolverPort that the vault composition root injects into authorizeStatement.
responsibilities:
  - Define versioned field allowlists for classrup.bazaar.listing/v1, classrup.identity.profile/v1, classrup.services.offering/v1, classrup.rentals.offering/v1 and classrup.rentals.busy_blocks/v1 payloads, taking each closed key set from the record's owning module (F01.S01.M03, F07.S02.M01, F03.S01.M01, F05.S01.M01).
  - Build an unsigned envelope draft (v, type, author, createdAt, payload, ext) from a local record, with every payload timestamp and the envelope createdAt floored to the UTC hour by F10.S02.M03 publicTime; seq and prev are allocated by F11.S01.M02 publish in the transaction that stores the signed envelope.
  - Reject export of portable public records whose owner has not enabled federation for that record (opt-in flag from F01.S01.M03 or profile setting) and of any field classified above P0; participant statements need no federation opt-in.
  - Maintain the statement-type registry mapping each envelope type to {audience, signerRole, roleResolution, payloadSchema, subjectKey?, version?, commitment?, maxAge, acknowledger, privacyClass}, expose entryFor(type), roleFor(type, context) (the F16.S01.M01 RoleResolverPort implementation), subjectKeyOf(type, payload) and maxAgeOf(type), and export the compiled registry as machine-readable data.
  - Validate inbound payloads against the same allowlist and location rules and map them to a mirror view that the UI marks as remote and read-only and that exposes every allowlisted member readers need (for listings the author, listingRevision, expiresAt, inStock, variants, acceptedCurrencies, mailboxHints and the giveaway closesAt).
  - Own the payload, opt-in and signer-role error codes (FEDERATION_PAYLOAD_INVALID, FEDERATION_NOT_OPTED_IN, FEDERATION_EXPORT_FORBIDDEN_FIELD, FEDERATION_SIGNER_ROLE_INVALID) referenced by other F11 modules through depends_on (N1).
non_responsibilities:
  - Signing and verification (F11.S01.M03 mod_signatures).
  - Persisting, deduplicating or ordering envelopes and allocating seq and prev (F11.S01.M02 mod_records, F11.S02.M02 mod_dedup).
  - Choosing which peers receive a record (F11.S02.M01 mod_delivery and F11.S03.M01 mod_trust).
  - Geohash encoding and the L2 cell check itself (F06.S02.M01 assertPublicCell).
  - "Resolving keys: user roles are resolved by an injected portable-document resolver (F07.S02.M01), relay roles by injected relay-key resolvers (pinned keys in F11.S03.M01, relay key history of F15.S02.M01), delegated governance roles by the delegations resolver over verified authority lists (registered by F18.S02.M01) and relay operator context roles by the operatorKeys resolver over the relay's latest verified tenant_config (registered by F15.S04.M03), all bound at composition by inverted registration so this library has no dependency cycle."
  - Deciding whether an incoming statement is acted on (F16.S01.M01 authorizeStatement, called by F11.S01.M02); this module only supplies roleFor through the RoleResolverPort bound at vault composition.
  - "Future: ActivityPub Note/Offer and AT Protocol lexicon mappings (documented in F11.S03.M03, not implemented)."
  - "Future: federating reviews, offers, proposals or any P1-P4 data relay to relay; participant statements travel only as sealed mailbox envelopes and are never mapped here."
depends_on: [F06.S02.M01, F10.S02.M02, F10.S02.M03, F16.S01.M01, CTR-FED-001, CTR-PRV-001, CTR-ERR-001, CTR-SCH-001, CTR-TST-001, CTR-ID-001]
user_stories:
  - As a seller, I can opt one listing in to federation and see exactly which fields will be shared before confirming.
  - As a service provider, I can federate my public offering with a coarse region only, never my address.
  - As a remote reader, I see a mirrored listing labelled with the relay it came from and a notice that it cannot be edited here.
  - As a vault, I can tell for any received statement type which role must have signed it and whether that role is a user role or a relay role, and I quarantine anything I cannot resolve.
  - As a test generator (F17.S01.M03), I can read the compiled registry as data and produce one contract row and one wrong-role negative case per statement type.
edge_cases:
  - Listing contains a photo with GPS EXIF still present; export is refused with FEDERATION_EXPORT_FORBIDDEN_FIELD and nothing is drafted.
  - Listing location is stored at geohash 7; the draft carries the containing L2 cell (the first 5 characters), records locationLevel L2 and passes assertPublicCell; a record that carries latitude and longitude members is refused with FEDERATION_EXPORT_FORBIDDEN_FIELD.
  - Inbound payload carries an extra field "homeAddress"; the whole payload is rejected rather than silently trimmed.
  - Inbound listing payload carries regionCell "u33dbc" (length 6); rejected with FEDERATION_PAYLOAD_INVALID and never mirrored into a public index.
  - Seller revokes opt-in after drafting but before F11.S01.M02 signs; publish refuses with FEDERATION_NOT_OPTED_IN and nothing is signed.
  - Payload exceeds 65536 bytes after serialization; rejected with PAYLOAD_TOO_LARGE only.
  - Record type version unknown (classrup.bazaar.listing/v2); rejected with UNSUPPORTED_SCHEMA_VERSION.
  - A listing statement whose author is a pinned relay key, or a peer_accept signed by a user device key; roleFor finds no matching key class and the receiver quarantines it with FEDERATION_SIGNER_ROLE_INVALID.
  - Statement type classrup.federation.unknown/v1 is not registered; receivers quarantine it with FEDERATION_SIGNER_ROLE_INVALID rather than storing it as accepted.
  - A listing is published at 10:47:12.345 with expiresAt 2026-12-04T10:47:12.345Z; the draft carries createdAt and publishedAt 10:00:00.000Z and expiresAt 2026-12-04T10:00:00.000Z, and two drafts inside the same hour are ordered by listingRevision and seq only.
  - A rental busy block runs 10:20 to 11:40; the busy-blocks draft carries 10:00 to 12:00 (start floored, end raised to the next full hour) so a published busy interval never shrinks.
  - A service offering carries a credential with evidenceAttachmentId; the projection omits the member and keeps label, issuer and year, while providerTimeZone, the projection seq, prev and publishedAt are exported.
  - A vault receives classrup.bazaar.negotiation_accept/v1; the registry resolves it as an alias of classrup.comms.consent/v1 and verifies it with the consent entry's role, schema and predicate.
  - A classrup.governance.policy_decision/v1 is signed by a key that the publisher's authority list first named as decider 10 days before the proposal's relay receipt, or by the publisher's own key, or arrives in a vault where no delegations resolver is registered; roleFor resolves no delegated role and the receiving path quarantines it with FEDERATION_SIGNER_ROLE_INVALID.
  - A classrup.governance.transparency_report/v1 is signed by the operator key that also compiled the embedded transparency_draft/v1, or by a key missing from operatorKeys of the relay's latest verified tenant_config; roleFor resolves no reviewer role and the report is quarantined with FEDERATION_SIGNER_ROLE_INVALID.
  - A peer relay offers a classrup.governance.policy_comment/v1 (audience community) on POST /fed/v1/inbox; F11.S01.M02 V10 refuses it because only audience public envelopes travel relay to relay, and the comment stays readable only to members of its hosting relay.
ux:
  notes: "Headless library. The consent preview screen that shows the allowlisted fields is owned by F10.S01.M01 and F01.S01.M03 and calls previewDraft(record) from this module."
processes:
  domain_schema:
    requirements:
      - The module owns no stored entity; it defines allowlist tables, the statement-type registry and draft value types keyed by envelope type string.
      - Allowed payload fields per type are listed in code and in the schema registry and each is annotated P0 by F10.S02.M02; a field without an annotation is not exportable.
      - Location is carried only as a geohash string of length ≤ 5 plus locationLevel L1 or L2, never coordinates; finer cells are snapped to their containing L2 cell before the F06.S02.M01 assertPublicCell check.
      - The statement-type registry is static versioned data that names, for every registered envelope type, the audience, the signer role a receiving vault must verify before acting on the statement, how that role is resolved, the payload schema, the optional subject key and commitment predicate used by F11.S02.M03, and the maximum age used by F11.S01.M02 V08.
      - Relay roles resolve only through relay keys pinned in F11.S03.M01 or, for relay_identity roles, through the self-certifying relay key history of F15.S02.M01, and user roles only through the author principal's portable identity document (F07.S02.M01), so a relay key never satisfies a user role and a user key never satisfies a relay role.
      - Unregistered types, and registered types whose role cannot be resolved, are quarantined by receivers with FEDERATION_SIGNER_ROLE_INVALID; the registry check (V01) is separate from the portable-allowlist check (V08), which applies only to audience public portable types.
      - The StatementPublisherPort (publish and issueTombstone) is declared here and implemented by F11.S01.M02, so every producer (F01, F03, F07, F11.S03.*) signs through the single F11.S01.M02 path that allocates seq and prev, without a dependency cycle.
      - Every timestamp member of a public portable payload and the envelope createdAt are floored to the UTC hour with F10.S02.M03 publicTime (busy-block interval ends are raised to the next full hour so a busy interval never shrinks), and an author's records are ordered by the registry version member or the per-chain seq, never by time.
      - Every registry entry also names its acknowledger (counterparty, destination_relay or none) and the privacy class F10.S02.M02 registers for its payload schema, both read through entryFor(type) by the F15.S01.M01 sync outbox, and the compiled registry is exported as machine-readable data with one row per type.
      - roleFor(type, context) is the implementation of the F16.S01.M01 RoleResolverPort; the vault composition root injects it into F16.S01.M01 authorizeStatement, so F16.S01.M01 needs no dependency on this module and F11.S01.M02 calls only authorizeStatement.
      - Audience community addresses a statement to one hosting relay that serves it only to that relay's authenticated members; it is never indexed publicly, never sent relay to relay and never routed by F11.S02.M01, its owner module sends it to the hosting relay as a relay command, and its registry defaults are acknowledger destination_relay and privacy class P1.
      - Delegated roles resolve only through the injected delegations resolver over the publisher's verified authority lists (registered by F18.S02.M01) and relay operator context roles only through the injected operatorKeys resolver over the relay's latest verified tenant_config (registered by F15.S04.M03), both by inverted registration at composition without a depends_on edge, and a missing resolver, list or tenant_config resolves no role so the statement is quarantined with FEDERATION_SIGNER_ROLE_INVALID.
    entities: []
    note: |
      Pure mapping library; allowlists and the registry are static data versioned with the schema registry and nothing is persisted here.
      Statement-type registry (F11 types, the five portable types and the entries other modules contributed per N2, compiled into one registry at build time and exported as statement-registry.json). Each entry is {type, owner, audience, signerRole, roleResolution, payloadSchema, subjectKey?, version?, commitment?, maxAge, acknowledger, privacyClass, aliasOf?}.
      Role resolution kinds: "principal" means the envelope author is a principal did:key and ext.signerKey is a device key active in that principal's latest verified portable document (F07.S02.M01 key_status at receiver time); "relay" means the author is a relay did:key pinned in F11.S03.M01 (current key, or previous key inside the 7-day rotation overlap); "relay_identity" means a key in the self-certifying key history of the relayId (F15.S02.M01: relayId derived from the genesis key, every rotation signed by the previous key), active or retired and not revoked at receipt; "named relay" means a relay or relay_identity key that also equals the relay or key the statement's context names (payload relayId, the hostKeyId of verified auction terms, the relay where a consent was registered); "subscription" means the publisher key (principal or relay) of an advisory feed the vault subscribed to. Context roles (party, participant, giver, opener, mediator) are evaluated by roleFor from the context the caller supplies (subject record, terms, head revision) on top of the key resolution. "delegated" (delegated by publisher authority_list) means principal resolution of the author plus a delegation returned by the injected delegations resolver: the author is listed with the role the row names in the latest verified classrup.governance.authority_list/v1 of payload.publisherId, under the row's anchoring condition, and the author differs from payload.publisherId; the delegations resolver is registered by F18.S02.M01 at vault composition (inverted registration, because F18.S02.M01 depends on this module). The context role "relay operator" means principal resolution of the author plus membership of the author in operatorKeys of the latest verified classrup.platform.tenant_config/v1 of the relay the statement names, read through the injected operatorKeys resolver registered by F15.S04.M03 at composition. A missing resolver, authority list or tenant_config resolves no role.
      Defaults for every entry unless its row overrides them: audience participants gives acknowledger counterparty (a recipient signs classrup.federation.ack/v1) and privacy class P2; audience relay (addressed to one named relay) gives acknowledger destination_relay (that relay signs classrup.federation.ack/v1 or the owner's named acknowledgement) and P1; audience community (addressed to one hosting relay that serves it only to its authenticated members; never indexed publicly, never sent relay to relay through /fed/v1/inbox and never routed by F11.S02.M01; the owner module sends it to the hosting relay as a relay command through the F15.S01.M01 outbox) gives acknowledger destination_relay (the hosting relay's acceptance receipt named by the owner module) and P1; audience public, relay to relay and relay-local give acknowledger none and P0 (relay-local statements are never queued). The privacy class is the class F10.S02.M02 registers for the payload schema, and the CI registry check fails on a mismatch with the default. maxAge is none unless stated (F11.S01.M02 V08 then checks only the future skew).

      F11 and portable entries:

      | Type | Audience | Signer role (resolution) | Payload schema | Subject key and version | Class | Ack | Privacy | maxAge |
      |---|---|---|---|---|---|---|---|---|
      | classrup.bazaar.listing/v1 | public | author: listing author (principal) | listing allowlist | recordKey payload.listingId; version payload.listingRevision | public_projection | none | P0 | 120 d |
      | classrup.identity.profile/v1 | public | author: profile owner, author = payload.did (principal) | profile allowlist | recordKey payload.did | public_projection | none | P0 | 400 d |
      | classrup.services.offering/v1 | public | author: provider = payload.providerId (principal) | offering allowlist | recordKey payload.offeringId; version payload.seq | public_projection | none | P0 | 400 d |
      | classrup.rentals.offering/v1 | public | author: owner = payload.ownerId (principal) | rental offering allowlist | recordKey payload.offeringId; version payload.revision | public_projection | none | P0 | 400 d |
      | classrup.rentals.busy_blocks/v1 | public | owner of the offering (principal) | busy-blocks allowlist | recordKey busy:payload.offeringId; readers keep the union of unexpired summaries | public_projection | none | P0 | 24 h |
      | classrup.federation.tombstone/v1 | audience of the target | target author: author equals the target record's author principal (principal); binding deletion; never a relay key | {target: cid or recordKey, reason} | target | control | as target | P0 | none |
      | classrup.federation.relay_removal/v1 | public | hosting relay whose index held the item (relay); advisory only | {target, relayId, reasonCode, statementOfReasons ≤ 2000 chars} | target | advisory | none | P0 | none |
      | classrup.federation.ack/v1 | participants | recipient: a principal named in ext.recipients of the acknowledged statement (principal); for an audience relay statement the addressed relay (named relay) | {ackedCid, ackedType} | ackedCid | control | none | P2 | 60 d |
      | classrup.federation.peer_offer/v1 | relay to relay | proposing relay, self-certifying key confirmed by fingerprint (relay) | {relayId, baseUrl, relayKey, direction, targetRelayId} | none | control | none | P0 | 14 d |
      | classrup.federation.peer_accept/v1 | relay to relay | accepting relay: key pinned for the offer target (relay) | {offerCid, relayId, relayKey} | none | control | none | P0 | none |
      | classrup.federation.key_rotation/v1 | public | current pinned relay key (old key) (relay) | {relayId, newKey, effectiveAt} | none | control | none | P0 | none |
      | classrup.federation.relay_identity/v1 | public | the relay key named in the payload (relay, self-certifying) | {relayId, baseUrl, relayKey, hostingPolicy} | none | control | none | P0 | 30 d |
      | classrup.federation.blocklist/v1 | public | any publisher, advisory, never applied without review (principal or relay) | {title, entries ≤ 10000} | none | advisory | none | P0 | 180 d |
      | classrup.federation.move/v1 | public | account move: device key of the subject (principal); relay move: pinned relay key (relay) | {subject, kind, fromRelay, toRelay, announcedAt} | move:subject | commitment (identity) | none | P0 | 210 d |
      | classrup.federation.move_cancel/v1 | public | device key of the subject; a veto needs a key other than the move signer (principal) | {moveCid, subject} | move:subject | control | none | P0 | 210 d |

      Allowlists (closed key sets; every member classified P0 by F10.S02.M02; every timestamp member floored with publicTime):
      - classrup.bazaar.listing/v1 (F01.S01.M03): listingId, kind, title, description, categoryId, condition?, mediaRefs, tags, locale, regionCell (length 4 or 5), subtypeRef? (service, rental, auction), listingRevision, publishedAt, expiresAt, inStock (boolean from F01.S03.M01 at signing), barterAcceptable, mailboxHints [1..3 {relayId, mailboxId}], federationOptIn, variants? [{variantId, label, attributes, price?, inStock}] (F01.S03.M02), and one kind subset: sell {askingPrice, acceptedCurrencies, paymentMethods, cryptoAssets?, negotiable, pickup, delivery, deliveryNote?}; want {categoryId, keywords, minCondition, quantityWanted, barterAcceptable, barterNote?, maxDistanceBucket?, neededBy?, maxBudget? only when the WantSpec has budgetVisible true}; giveaway {selectionMode, queueLimit, closesAt?}. Never minOffer, pickupNote, quantities, holds, status, closeReason, drafts, offers or any P1 to P4 field.
      - classrup.identity.profile/v1: the profile allowlist of F07.S02.M01.
      - classrup.services.offering/v1 (F03.S01.M01): offeringId, providerId, listingId, skillCodes, rateType, rate, minBillableMinutes, serviceAreaCell (L2), providerTimeZone, remoteCapable, credentials [{label, issuer, year?, attestation}] (evidenceAttachmentId and every other evidence reference excluded), seq and prev (the offering's own projection sequence, separate from the envelope chain seq and prev), publishedAt.
      - classrup.rentals.offering/v1 (F05.S01.M01): offeringId, ownerId, listingId, rates, quantity, durations, buffers, leadTimeMinutes, horizonDays, timeZone, blackoutDates, lateFee, cancellationPolicy, declaredValue, checklistTemplate labels only, pickupAreaCell (L2), revision.
      - classrup.rentals.busy_blocks/v1 (F05.S01.M01): offeringId, fromUtc, toUtc (≤ 365 days apart), intervals [{start, end, unitsBusy}] (≤ 500, no identities); interval starts floored and ends raised to the full hour.

