id: F11.S01.M01
scope: MVP
summary: >-
  Library that maps locally owned P0 records (listings, public profiles, service offerings) to unsigned
  federation envelope drafts and maps verified inbound envelope payloads back to read-only mirror views.
  Each portable record type has a field allowlist; anything not on the allowlist and anything above class P0 is
  refused, and location is snapped to its L2 cell (geohash 5) and checked with F06.S02.M01 assertPublicCell on the
  way out and on the way in. Signing, seq allocation and storage are done by F11.S01.M02 through the
  StatementPublisherPort declared here. It runs in the user's browser vault (ADR-0016) and in relays for validating
  inbound public projections. It also holds the statement-type registry (N2): for every envelope type the audience,
  the signer role a receiver must verify, how that role is resolved (user roles only through the author's portable
  identity document, relay roles only through pinned relay keys), the payload schema, the optional subject key and
  commitment predicate, and the maximum age.
responsibilities:
  - Define versioned field allowlists for classrup.bazaar.listing/v1, classrup.identity.profile/v1 and classrup.services.offering/v1 payloads.
  - Build an unsigned envelope draft (v, type, author, createdAt, payload, ext) from a local record; seq and prev are allocated by F11.S01.M02 publish in the transaction that stores the signed envelope.
  - Reject export of portable public records whose owner has not enabled federation for that record (opt-in flag from F01.S01.M03 or profile setting) and of any field classified above P0; participant statements need no federation opt-in.
  - Maintain the statement-type registry mapping each envelope type to {audience, signerRole, roleResolution, payloadSchema, subjectKey?, commitment?, maxAge} and expose roleFor(type, context), subjectKeyOf(type, payload) and maxAgeOf(type).
  - Validate inbound payloads against the same allowlist and location rules and map them to a mirror view that the UI marks as remote and read-only.
  - Own the payload, opt-in and signer-role error codes (FEDERATION_PAYLOAD_INVALID, FEDERATION_NOT_OPTED_IN, FEDERATION_EXPORT_FORBIDDEN_FIELD, FEDERATION_SIGNER_ROLE_INVALID) referenced by other F11 modules through depends_on (N1).
non_responsibilities:
  - Signing and verification (F11.S01.M03 mod_signatures).
  - Persisting, deduplicating or ordering envelopes and allocating seq and prev (F11.S01.M02 mod_records, F11.S02.M02 mod_dedup).
  - Choosing which peers receive a record (F11.S02.M01 mod_delivery and F11.S03.M01 mod_trust).
  - Geohash encoding and the L2 cell check itself (F06.S02.M01 assertPublicCell).
  - Resolving keys: user roles are resolved by an injected portable-document resolver (F07.S02.M01) and relay roles by an injected pinned-key resolver (F11.S03.M01), both bound at composition so this library has no dependency cycle.
  - "Future: ActivityPub Note/Offer and AT Protocol lexicon mappings (documented in F11.S03.M03, not implemented)."
  - "Future: federating reviews, offers, proposals or any P1-P4 data relay to relay; participant statements travel only as sealed mailbox envelopes and are never mapped here."
depends_on: [F06.S02.M01, F10.S02.M02, CTR-FED-001, CTR-PRV-001, CTR-ERR-001, CTR-SCH-001, CTR-TST-001, CTR-ID-001]
user_stories:
  - As a seller, I can opt one listing in to federation and see exactly which fields will be shared before confirming.
  - As a service provider, I can federate my public offering with a coarse region only, never my address.
  - As a remote reader, I see a mirrored listing labelled with the relay it came from and a notice that it cannot be edited here.
  - As a vault, I can tell for any received statement type which role must have signed it and whether that role is a user role or a relay role, and I quarantine anything I cannot resolve.
edge_cases:
  - Listing contains a photo with GPS EXIF still present; export is refused with FEDERATION_EXPORT_FORBIDDEN_FIELD and nothing is drafted.
  - Listing location is stored at geohash 7; the draft carries the containing L2 cell (the first 5 characters), records locationLevel L2 and passes assertPublicCell; a record that carries latitude and longitude members is refused with FEDERATION_EXPORT_FORBIDDEN_FIELD.
  - Inbound payload carries an extra field "homeAddress"; the whole payload is rejected rather than silently trimmed.
  - Inbound payload carries region.geohash "u33dbc" (length 6); rejected with FEDERATION_PAYLOAD_INVALID and never mirrored into a public index.
  - Seller revokes opt-in after drafting but before F11.S01.M02 signs; publish refuses with FEDERATION_NOT_OPTED_IN and nothing is signed.
  - Payload exceeds 65536 bytes after serialization; rejected with PAYLOAD_TOO_LARGE only.
  - Record type version unknown (classrup.bazaar.listing/v2); rejected with UNSUPPORTED_SCHEMA_VERSION.
  - A listing statement whose author is a pinned relay key, or a peer_accept signed by a user device key; roleFor finds no matching key class and the receiver quarantines it with FEDERATION_SIGNER_ROLE_INVALID.
  - Statement type classrup.federation.unknown/v1 is not registered; receivers quarantine it with FEDERATION_SIGNER_ROLE_INVALID rather than storing it as accepted.
ux:
  notes: "Headless library. The consent preview screen that shows the allowlisted fields is owned by F10.S01.M01 and F01.S01.M03 and calls previewDraft(record) from this module."
processes:
  domain_schema:
    requirements:
      - The module owns no stored entity; it defines allowlist tables, the statement-type registry and draft value types keyed by envelope type string.
      - Allowed payload fields per type are listed in code and in the schema registry and each is annotated P0 by F10.S02.M02; a field without an annotation is not exportable.
      - Location is carried only as a geohash string of length ≤ 5 plus locationLevel L1 or L2, never coordinates; finer cells are snapped to their containing L2 cell before the F06.S02.M01 assertPublicCell check.
      - The statement-type registry is static versioned data that names, for every registered envelope type, the audience, the signer role a receiving vault must verify before acting on the statement, how that role is resolved, the payload schema, the optional subject key and commitment predicate used by F11.S02.M03, and the maximum age used by F11.S01.M02 V08.
      - Relay roles resolve only through relay keys pinned in F11.S03.M01 and user roles only through the author principal's portable identity document (F07.S02.M01), so a relay key never satisfies a user role and a user key never satisfies a relay role.
      - Unregistered types, and registered types whose role cannot be resolved, are quarantined by receivers with FEDERATION_SIGNER_ROLE_INVALID; the registry check (V01) is separate from the portable-allowlist check (V08), which applies only to audience public portable types.
      - The StatementPublisherPort (publish and issueTombstone) is declared here and implemented by F11.S01.M02, so every producer (F01, F03, F07, F11.S03.*) signs through the single F11.S01.M02 path that allocates seq and prev, without a dependency cycle.
    entities: []
    note: |
      Pure mapping library; allowlists and the registry are static data versioned with the schema registry and nothing is persisted here.
      Statement-type registry (F11 types and the three portable types; other modules contribute entries for their own types per N2, compiled into the same registry at build time). Role resolution: "principal" means the envelope author is a principal did:key and ext.signerKey is a device key active in that principal's latest verified portable document (F07.S02.M01 key_status at receiver time); "relay" means the author is a relay did:key pinned in F11.S03.M01 (current key, or previous key inside the 7-day rotation overlap).

      | Type | Audience | Signer role (resolution) | Payload schema | Subject key | Class | maxAge |
      |---|---|---|---|---|---|---|
      | classrup.bazaar.listing/v1 | public | listing author (principal) | listing allowlist | recordKey payload.id | public_projection | 120 d |
      | classrup.identity.profile/v1 | public | profile owner, author = payload.did (principal) | profile allowlist | recordKey payload.did | public_projection | 400 d |
      | classrup.services.offering/v1 | public | provider (principal) | offering allowlist | recordKey payload.offeringId | public_projection | 400 d |
      | classrup.federation.tombstone/v1 | audience of the target | target author: author equals the target record's author principal (principal); binding deletion | {target: cid or recordKey, reason} | target | control | none |
      | classrup.federation.relay_removal/v1 | public | hosting relay whose index held the item (relay); advisory only | {target, relayId, reasonCode, statementOfReasons ≤ 2000 chars} | target | advisory | none |
      | classrup.federation.ack/v1 | participants | recipient: a principal named in ext.recipients of the acknowledged statement (principal) | {ackedCid, ackedType} | ackedCid | control | 60 d |
      | classrup.federation.peer_offer/v1 | relay to relay | proposing relay, self-certifying key confirmed by fingerprint (relay) | {relayId, baseUrl, relayKey, direction, targetRelayId} | none | control | 14 d |
      | classrup.federation.peer_accept/v1 | relay to relay | accepting relay: key pinned for the offer target (relay) | {offerCid, relayId, relayKey} | none | control | none |
      | classrup.federation.key_rotation/v1 | public | current pinned relay key (old key) (relay) | {relayId, newKey, effectiveAt} | none | control | none |
      | classrup.federation.relay_identity/v1 | public | the relay key named in the payload (relay, self-certifying) | {relayId, baseUrl, relayKey, hostingPolicy} | none | control | 30 d |
      | classrup.federation.blocklist/v1 | public | any publisher, advisory, never applied without review (principal or relay) | {title, entries ≤ 10000} | none | advisory | 180 d |
      | classrup.federation.move/v1 | public | account move: device key of the subject (principal); relay move: pinned relay key (relay) | {subject, kind, fromRelay, toRelay, announcedAt} | move:subject | commitment (identity) | 210 d |
      | classrup.federation.move_cancel/v1 | public | device key of the subject; a veto needs a key other than the move signer (principal) | {moveCid, subject} | move:subject | control | 210 d |

      Commitment predicates (subject key and conflict test used by F11.S01.M02 and F11.S02.M03; owning modules confirm their entries): classrup.federation.move/v1 conflicts when two verified moves of one subject are open with different toRelay; classrup.comms.consent/v1 (F08.S02.M02) conflicts when one signer signs the same subjectType, subjectRef and statementKey over different subjectRevisionHash values, which covers two acceptances of one offer and two consents on one proposal; classrup.bazaar.reservation/v1 (F01.S03.M01) conflicts when one signer reserves overlapping items of the same listing to different holders with overlapping unexpired windows; classrup.commerce.deal/v1 (F09.S01.M01) conflicts when one signer signs two different obligation digests for one dealId. Registered ext members: stream, signerKey, audience, recipients [{did, mailboxId}], supersedes.
  validation_rules:
    requirements:
      - Outbound mapping is default-deny, so a new local field is never exported until it is added to an allowlist and reviewed.
      - Inbound payload validation uses the same allowlist and location rules and rejects unknown fields and any location finer than L2 instead of ignoring or trimming them.
      - Every rejection returns a stable code that the calling module surfaces without echoing field values.
      - Location precision is enforced on both paths through F06.S02.M01 assertPublicCell; outbound cells are snapped to L2 before the check (PRV-1) and inbound payloads with a cell longer than 5 characters or with coordinate members are rejected.
    rules:
      - "V01 | envelope type is registered in the statement-type registry; receivers quarantine unregistered types | FEDERATION_SIGNER_ROLE_INVALID"
      - "V02 | audience public portable types only: source record has federation opt-in true for this record at draft time and again when F11.S01.M02 signs; participant and control statements need no federation opt-in | FEDERATION_NOT_OPTED_IN"
      - "V03 | every outbound field is on the allowlist for the type and classified P0 | FEDERATION_EXPORT_FORBIDDEN_FIELD"
      - "V04 | outbound: the location cell is snapped to its containing L2 cell (length ≤ 5) and passes F06.S02.M01 assertPublicCell; a latitude or longitude member anywhere in payload or ext refuses the export | FEDERATION_EXPORT_FORBIDDEN_FIELD"
      - "V05 | media references are content hashes of metadata-stripped images; no image reports GPS tags | FEDERATION_EXPORT_FORBIDDEN_FIELD"
      - "V06 | inbound payload has no members outside the allowlist, members have the declared types and strings are ≤ 10000 code points | FEDERATION_PAYLOAD_INVALID"
      - "V07 | inbound payload does not exceed 65536 bytes | PAYLOAD_TOO_LARGE"
      - "V08 | audience public portable types only: the type is one of the three portable allowlist types and its version major is supported | UNSUPPORTED_SCHEMA_VERSION"
      - "V09 | inbound location: region.geohash length ≤ 5 and passes F06.S02.M01 assertPublicCell, and no latitude or longitude member is present | FEDERATION_PAYLOAD_INVALID"
      - "V10 | role resolution keeps key classes apart: relay roles resolve only through the injected pinned-key resolver (F11.S03.M01) and user roles only through the injected portable-document resolver (F07.S02.M01); a key of the other class never matches | FEDERATION_SIGNER_ROLE_INVALID"
      - "V11 | control types validate against their per-type payload schema in the registry; participant statements carry a ciphertext payload {alg, ciphertext, recipientsKeyIds} of at most 12288 bytes, checked for shape and size only | FEDERATION_PAYLOAD_INVALID"
  workflow_state_machine:
    requirements:
      - The mapper is stateless and the draft/mirror conversion is a pure function of its inputs.
      - The only sequencing rule is that a draft must be signed and stored through the F11.S01.M02 publish path (StatementPublisherPort) before it is visible to any peer.
      - No lifecycle is stored here, so there is no state machine.
    machines: []
    timeouts: []
    note: "Stateless mapper; record lifecycle states belong to F11.S01.M02 (FederatedRecord) and the source modules."
  commands_queries_events:
    requirements:
      - The module exposes TypeScript functions only and no network commands or queries.
      - Functions return Result<T, AppError> and never include rejected field values in error params.
      - The module emits no events; draft building is a local pure step.
      - F11's own statement types and their signer roles are listed in the registry table of the domain schema (N2); other modules contribute entries for their own types, and every entry has an audience, signer role, role resolution, payload schema and maximum age.
    commands: []
    queries: []
    note: "API: buildDraft(record, now) -> UnsignedDraft (no seq or prev; F11.S01.M02 allocates them); previewDraft(record) -> {fields[], excluded[]}; toMirrorView(verifiedEnvelope) -> MirrorView; allowlistFor(type) -> string[]; validateInbound(envelope) -> Result<void> (V06, V07, V09, V11); registryEntry(type) -> {audience, signerRole, roleResolution, payloadSchema, subjectKey?, commitment?, maxAge} or none; roleFor(type, context, resolvers{portableDoc, pinnedRelayKey}) -> RoleRule used by F11.S01.M02 V14; subjectKeyOf(type, payload) -> string or none; conflictsWith(a, b) -> boolean (commitment predicate); maxAgeOf(type) -> ms or none. StatementPublisherPort { publish({type, audience, payload, recipients[{did, mailboxId}]}) -> {cid, seq, chainKey}; issueTombstone({targetCid?, targetRecordKey?, reason}) -> {tombstoneCid} } is implemented by F11.S01.M02. Participant-audience statements are encrypted by their source modules and only shape-checked, never mapped, here."
    events_produced: []
    events_consumed: []
    errors:
      - "FEDERATION_NOT_OPTED_IN | 403 | no | the owner has not enabled federation for this public record"
      - "FEDERATION_EXPORT_FORBIDDEN_FIELD | 422 | no | the record contains a field or precision that must not be exported"
      - "FEDERATION_PAYLOAD_INVALID | 422 | no | inbound payload has unknown members, wrong types, a location finer than L2 or coordinates, or exceeds string limits"
      - "FEDERATION_SIGNER_ROLE_INVALID | 422 | no | the type is unregistered or the signer key does not hold the role the type requires; the statement is quarantined"
    example: |
      buildDraft({ type: "classrup.bazaar.listing/v1", id: "0192f3a4-...", title: "Road bike", geohash: "u33dbcx", federate: true }, now)
      -> { v: 1, type: "classrup.bazaar.listing/v1", author: "did:key:z6MkRoot...", createdAt: "2026-11-04T10:00:00.000Z", payload: { id: "0192f3a4-...", title: "Road bike", region: { geohash: "u33db", level: "L2" } }, ext: { stream: "pub", audience: "public" } }
      roleFor("classrup.federation.peer_accept/v1", { author: "did:key:z6MkUserDevice..." }, resolvers) -> { ok: false, code: "FEDERATION_SIGNER_ROLE_INVALID" }  // user key cannot hold a relay role
  authorization_capabilities:
    requirements:
      - The library performs no authorization; callers (listing publication, profile settings, delivery) decide who may federate which record.
      - The opt-in flag is read from the source record at draft time and re-checked by F11.S01.M02 publish inside the signing transaction; an opt-in revoked after drafting refuses the publish with FEDERATION_NOT_OPTED_IN, and one revoked after signing cancels still-prepared deliveries through F11.S02.M01.
      - Mirror views contain only P0 data and may be shown to anonymous readers when the tenant has public browse enabled.
    capabilities: []
  failure_recovery_idempotency:
    requirements:
      - Draft building is deterministic for identical record and clock, so retries cannot create divergent drafts.
      - A failed draft leaves no state; the caller retries after fixing the record.
      - This module never allocates seq or prev; F11.S01.M02 publish allocates them in the transaction that stores the envelope, so a lost response never skips or duplicates a sequence number.
    idempotency: "buildDraft is a pure function; identical inputs give identical drafts (same payload and canonical bytes)."
    concurrency: "No shared state. Two concurrent publishes of drafts by the same device are serialized by F11.S01.M02, which allocates seq n+1 and n+2 under its unique (author, signerKey, stream, seq) index."
    retries: "Callers retry after fixing the record; no automatic retry inside the library."
    offline: "Runs fully offline on-device; drafts are signed and stored locally by F11.S01.M02 and queued in the F15.S01.M01 outbox when the device key is available."
    partial_failure: "A draft either validates entirely or returns an error; there is no partially mapped payload."
  privacy_retention_abuse:
    requirements:
      - Only owner-opted-in P0 data at maximum precision L2 can leave the vault as a public projection; every other field is refused or the export refused.
      - Exact home address (P3), contact details and anything P1-P4 can never appear in a draft; tests assert this on every release.
      - Pseudonymity is not anonymity, so the consent preview states that all records of one did:key are linkable and that deletion propagates by tombstone but cannot recall copies.
    data:
      - "Drafts: P0 only, transient, not stored by this module."
      - "Mirror views: P0 copies of remote content; stored by F11.S01.M02."
      - "Registry: static P0 configuration."
    retention:
      - "No retention in this module; stored mirrors follow F11.S01.M02 (RET-STANDARD with tombstone stubs kept at least as long as the target type's maxAge)."
    threats:
      - "T01 | New local field silently leaking into federation | default-deny allowlist; CI test fails if a record type has a field without a classification annotation"
      - "T02 | Location refinement attack (geohash 7 or coordinates in payload or ext) | V04 snaps outbound cells to L2 and refuses coordinates; V09 rejects finer inbound cells; assertPublicCell on both paths; ext members limited to the registered keys"
      - "T03 | Metadata leakage through images (EXIF GPS, device serial) | V05 only references stripped media hashes; relay rejects GPS tags per PRV-4"
      - "T04 | Remote payload with executable or HTML content | inbound strings are plain text; mirror view escapes at render; links shown as text"
      - "T05 | Signer-role confusion: a relay key used as a user author, or a user key presented for a relay role | V10 resolves relay and user roles through separate resolvers; tests per registry entry include relay-key-as-author and user-key-as-relay negatives (T16, T19)"
    abuse_controls:
      - "Per-author publish rate cap 60 statements/hour enforced by F11.S01.M02 through F12.S03.M03 rate limits."
      - "Inbound payloads over 65536 bytes are rejected before parsing members."
  observability_performance:
    requirements:
      - Mapping outcomes are counted per rejection code without recording field values.
      - Building one draft takes under 1 ms p95 for a typical 4 KiB listing.
      - Allowlist and registry coverage is reported as a build artifact on every CI run.
    metrics:
      - "classrup_federation_draft_total{outcome=ok|not_opted_in|forbidden_field|invalid}"
      - "classrup_federation_inbound_payload_total{outcome=ok|invalid|too_large|precision}"
      - "classrup_federation_role_resolution_total{outcome=ok|unregistered|role_invalid}"
    logs:
      - "info federation.draft.refused {type, code, correlationId} — never field values or record contents."
    budgets:
      - "buildDraft p95 ≤ 1 ms for records ≤ 4 KiB; ≤ 10 ms for 65536 byte payloads."
      - "roleFor p95 ≤ 0.2 ms excluding resolver lookups; allowlist and registry coverage check completes in ≤ 5 s in CI."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - A privacy test suite enumerates every field of every source record type and proves non-allowlisted fields never appear in a draft.
      - Round-trip tests prove that a draft payload maps back to an equal mirror view.
    fixtures: "Listing, profile and offering fixtures with P0..P3 fields populated including a home address, exact lat/lon, geohash 7 and a GPS-tagged image; a pinned relay key R and a user principal U with device key D in a portable-document stub; shared golden envelopes from F11.S01.M03; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,02.R01,09.R02 | build drafts for the three record types | payload members equal the allowlist subset; classification annotations present; drafts carry no seq or prev"
      - "T02 | property | 01.R03,02.R01,07.R01 | random records with random extra fields and outbound geohash lengths 1-12 | no draft contains a non-allowlisted member; geohash length ≤ 5 and equal to the prefix of the source cell (snapped); assertPublicCell called once per draft"
      - "T03 | unit | 02.R04,07.R02 | outbound record with geohash 7 only; with exact lat/lon; with homeAddress and email | geohash 7 is snapped to its 5-character L2 cell with level L2 (export succeeds); lat/lon, homeAddress and email each refuse the export with FEDERATION_EXPORT_FORBIDDEN_FIELD"
      - "T04 | unit | 02.R03,02.R01 | record with opt-in false | FEDERATION_NOT_OPTED_IN; error params contain no field values"
      - "T05 | unit | 02.R02,02.R03 | inbound payload with extra member, 65537 bytes, unknown type version listing/v2 | FEDERATION_PAYLOAD_INVALID, PAYLOAD_TOO_LARGE (and not PAYLOAD_INVALID), UNSUPPORTED_SCHEMA_VERSION"
      - "T06 | unit | 01.R02,02.R01 | image referenced with GPS tag present | FEDERATION_EXPORT_FORBIDDEN_FIELD"
      - "T07 | contract | 03.R01,03.R02,04.R01,04.R02 | exercise each exported function | signatures and Result shapes match the schema registry; error params contain no values; toMirrorView refuses envelopes that F11.S01.M02 has not stored"
      - "T08 | unit | 03.R03,04.R03,05.R01 | inspect module for event emission, stored lifecycle state and authorization calls | none present"
      - "T09 | integration | 03.R02,05.R03,09.R03 | draft then F11.S01.M02 publish then receive in a second vault then toMirrorView | mirror view equals source P0 fields, labelled remote, readable anonymously, no private fields"
      - "T10 | unit | 06.R01,06.R02,06.R03 | identical inputs twice; failing draft; two concurrent publishes of drafts from one device | identical drafts; failure leaves no state; F11.S01.M02 assigns seq n+1 and n+2 and no caller-supplied seq exists in the API"
      - "T11 | a11y | 07.R03 | open consent preview with screen reader and keyboard only | every field and the linkability notice are announced, controls ≥ 44 px"
      - "T12 | abuse | 02.R02,07.R03 | inbound payload with script tag and long link text | stored as plain text and rendered escaped"
      - "T13 | load | 08.R02,08.R01 | 10 000 draft builds of 4 KiB records | p95 ≤ 1 ms, counters exported"
      - "T14 | unit | 08.R03,09.R01 | coverage and traceability tools run | allowlist and registry report produced; every PS-083 requirement maps to a passing test"
      - "T16 | unit | 01.R04,04.R04 | roleFor for every registry row (three portable types and every F11 type) with the correct signer and with a wrong signer of the same key class | correct signer resolves its role; wrong signer yields a rule that makes F11.S01.M02 quarantine; every row has audience, role, resolution, schema and maxAge"
      - "T15 | unit | 10.R01,10.R02,10.R03 | upgrade allowlist v1 to v1 plus optional field; read older drafts; downgrade | older mirror views still validate; rollback keeps v1 behavior and rejects newer members"
      - "T17 | integration | 05.R02 | opt-in revoked between buildDraft and F11.S01.M02 publish; opt-in revoked after publish while deliveries are prepared | first refused with FEDERATION_NOT_OPTED_IN and nothing signed; second cancels the prepared deliveries and queues a tombstone for delivered copies"
      - "T18 | unit | 07.R02,09.R02 | release privacy suite over every source record type with P1-P4 fields, home address and contact details | none appears in any draft"
      - "T19 | unit | 01.R05,01.R06 | listing signed by pinned relay key R as author; peer_accept signed by user device key D; type classrup.federation.unknown/v1 | each quarantined with FEDERATION_SIGNER_ROLE_INVALID; V01 runs and fails independently of V08"
      - "T20 | property | 02.R02,02.R04 | inbound payloads with geohash lengths 6-12 and with latitude or longitude members | every one rejected with FEDERATION_PAYLOAD_INVALID; assertPublicCell invoked on the inbound path"
      - "T21 | contract | 01.R07 | producer stubs (listing publication, profile, offering, peer, blocklist, migration) call StatementPublisherPort.publish and issueTombstone | every call reaches the F11.S01.M02 implementation, which allocates seq; no producer signs through another path"
      - "T22 | unit | 01.R06,02.R03 | tombstone, ack, peer_offer and move payloads, and a participants ciphertext payload of 12288 and 12289 bytes | per-type schemas checked; portable allowlist (V08) and opt-in (V02) never applied to them; 12289 bytes rejected with FEDERATION_PAYLOAD_INVALID"
    acceptance:
      - All tests T01–T22 pass in CI, including the signer-role tests T16 and T19.
      - No P1-P4 field, exact coordinate or home address appears in any draft, and no inbound cell finer than L2 is accepted (privacy suite on fixtures).
      - A public record whose owner has not opted in can never produce a signed statement.
  import_export_backup_rollback:
    requirements:
      - The library stores nothing, so user export and import of federated content is handled by F11.S01.M02 and F11.S03.M03.
      - Allowlists and registry rows are versioned data; adding a field is a schema minor change and removing one is a major change with a 180-day dual-read period.
      - Rollback to a previous release must never widen an allowlist or relax a registry role, so a downgrade fails closed.
    export: "Allowlist tables and the statement-type registry are exported as build artifacts (allowlists.json, statement-registry.json) with each release for audit; no user data."
    import: "No user data is imported by this module; inbound payload validation uses the allowlist and registry bundled with the running release."
    backup: "Nothing to back up; allowlists and the registry are versioned in source control with the schema registry."
    migration_rollback: "Expand/contract: new optional fields are added to the allowlist in a release before any producer uses them; rollback restores the earlier narrower allowlist, which rejects newer payload members as FEDERATION_PAYLOAD_INVALID, and unknown newer statement types are quarantined."
