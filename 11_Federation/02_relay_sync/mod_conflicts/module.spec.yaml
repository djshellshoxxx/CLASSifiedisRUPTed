    acceptance:
      - All tests T01–T24 pass in CI.
      - No commitment (consent, money, inventory, identity) conflict is ever resolved by keep, last-writer-wins, timeout or a unilateral supersede.
      - Forged role-less statements cannot freeze a trade, and is_frozen fails closed (abuse and integration tests).
  import_export_backup_rollback:
    requirements:
      - A vault export contains conflict records with candidate cids and decisions; the candidate envelopes themselves are exported by F11.S01.M02.
      - Import re-verifies every candidate signature and keeps open conflicts open, restoring their freeze before any domain action is allowed.
      - Schema changes follow expand/contract and v1 stays readable for 180 days.
    export: "Section federation.conflicts in classrup-export/v1 through the ExportSectionPort, one line per ConflictRecord (schema classrup.federation.conflict/v1)."
    import: "Candidates are re-verified; conflicts whose candidates fail verification import as resolved with decision drop_all and a warning in the import report; open conflicts re-emit federation.conflict.detected and is_frozen answers true for their subjects immediately."
    backup: "Vault export is the primary backup (IOX-6); relay conflicts are covered by relay SQLite backup (CTR-IOX-001 IOX-3)."
    migration_rollback: "Additive fields only in v1 (chainKey, requiredSigners, fromListedRelay are new optional members); rollback to the previous release is safe because new optional fields are ignored and open conflicts stay open."
