id: F11.S03.M03
scope: MVP
summary: >-
  Moves a principal's home relay, and optionally a relay's address, without losing local records or history.
  The principal signs a move statement (classrup.federation.move/v1) with a registered device key. The did:key
  stays the same, so the author chain (seq/prev) continues on the new relay. The old relay serves a redirect for
  180 days, and receivers rebind the author's origin relay only after verifying the statement. A 24 h veto
  window lets another registered device key cancel a move made with a stolen key. The user's vault export is
  coupled to the new relay import. ActivityPub and AT Protocol bridges are documented mappings only (Future).
responsibilities:
  - Own MigrationRecord for account moves (principal changes home relay) and relay moves (operator changes base URL with the same relay key).
  - Build, sign and send the move statement, copy the principal's public records and tombstones to the new relay through F11.S02.M01, and publish the updated home relay in the portable identity document (F07.S02.M01).
  - Enforce a 24 h veto window, a cool-down of one move per 30 days and a 180-day redirect on the old relay.
  - Verify inbound move statements from other principals and relays and emit federation.account.moved only for statements that verify and become effective.
  - Provide the redirect lookup GET /fed/v1/moved?author=did on relays and document the ActivityPub and AT Protocol mappings as Future work.
non_responsibilities:
  - Key generation, device key registration and recovery (F07 identity).
  - Record verification and storage on the new relay (F11.S01.M02).
  - Delivery retries and queues (F11.S02.M01).
  - Vault export format (CTR-IOX-001 and F10 export modules); this module only triggers and verifies the coupling.
  - "Future: ActivityPub Move activity and alsoKnownAs, AT Protocol did:plc migration and handle rebinding; MVP documents the field mapping in docs/federation/bridges.md and implements none of it."
  - "Future: migration of private mailbox contents between relays; MVP leaves mailboxes to expire and the vault re-subscribes."
depends_on: [F11.S01.M02, F11.S01.M03, F11.S02.M01, F11.S03.M01, F07.S02.M01, F10.S01.M04, CTR-FED-001, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-OBS-001, CTR-IOX-001, CTR-PRV-001]
user_stories:
  - As a user, I can move to another relay, see each step (copy records, announce, wait 24 h, redirect) and keep every record I own on my device throughout.
  - As a user whose phone was stolen, I can veto a move from a second registered device during the 24 h window.
  - As a reader, I am sent to the author's new relay when I open an old link, and I see that the author moved.
  - As a relay operator, I can announce a new base URL for my relay so peers update without re-peering when the key is unchanged.
edge_cases:
  - Move statement signed by a device key that was revoked before effectiveAt; rejected with FEDERATION_MOVE_SIGNER_INVALID.
  - Second move requested 10 days after the first; refused with FEDERATION_MOVE_COOLDOWN.
  - Veto from a second device key arrives 23 h 59 min after announcement; move cancelled; veto arriving after 24 h is ignored.
  - New relay unreachable or refuses the account; migration stays announced, redirect is not activated, and the user can cancel.
  - Two move statements for the same did with different targets; both go to conflict review (F11.S02.M03) and no redirect is activated.
  - Relay move statement signed by a different key than the pinned relay key; ignored with FEDERATION_KEY_MISMATCH and peer suspended by F11.S03.M01.
  - The user deletes the account during a pending move; the move is cancelled and tombstones are sent to both relays.
  - Move whose effectiveAt claims a time more than 7 days in the future; refused as VALIDATION_FAILED since timestamps are claims.
ux:
  screens:
    - "Move wizard: choose new relay (relay chooser), review what moves (public records count, tombstones), what stays on device, and the 24 h veto notice."
    - "Migration progress: steps copy records, announce, veto window countdown, redirect active, with delivery states per step (not claiming more than reached)."
    - "Veto prompt on other devices: 'This account is being moved to relay X. Cancel the move?' with the time remaining."
    - "Moved banner on mirrored content: 'This author moved to relay X' with a link."
  states: [loading, empty, prepared, copying, announced, veto-window, effective, cancelled, closed, failed]
  a11y:
    - Wizard steps use a labelled ordered list with the current step marked aria-current and each step's status given in text.
    - The veto countdown is available as text and announced at 12 h, 1 h and 10 min through aria-live polite, not by colour or animation alone.
    - Cancel and confirm buttons are ≥ 44×44 px and confirm dialogs trap and restore focus.
processes:
  domain_schema:
    requirements:
      - A MigrationRecord stores kind, subject, from and to relay, the move statement cid, effective time, redirect end, status, copy progress and direction (own or observed) with tenant and revision per CTR-ID-001.
      - The move statement is a public signed statement and carries only did, relay ids, base URLs and times; it never contains record contents or contact details.
      - The redirect period is 180 days, equal to the tombstone retention, so a moved author cannot be resurrected on the old relay by replay.
    entities:
      - name: MigrationRecord
        schema: classrup.federation.migration/v1
        storage: relay+device
        privacy: P0
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope (vault id in the browser vault)"
          - "kind: enum — account | relay"
          - "direction: enum — own | observed"
          - "subject: string — did:key of the principal for account moves, relay id for relay moves"
          - "fromRelay: string — relay id or base URL before the move"
          - "toRelay: string — relay id or base URL after the move"
          - "moveCid?: string — cid of the signed classrup.federation.move/v1 statement"
          - "announcedAt?: timestamp — local clock when the statement was signed"
          - "effectiveAt?: timestamp — announcedAt + 24 h veto window, claim of the signer for observed moves"
          - "redirectUntil?: timestamp — effectiveAt + 180 days"
          - "copyProgress: json — {records: int, tombstones: int, delivered: int, failed: int}"
          - "vetoedBy?: string — did of the device key that cancelled during the window"
          - "status: enum — prepared | announced | effective | cancelled | closed"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - At most one non-terminal own account MigrationRecord per principal.
          - status effective implies moveCid verified, effectiveAt ≤ now and no veto was recorded before effectiveAt.
          - The subject did never changes in an account move; only the home relay changes.
          - A new own account move requires the previous effective move to be at least 30 days old.
    sql: |
      CREATE TABLE fed_migration (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, kind TEXT NOT NULL, direction TEXT NOT NULL, subject TEXT NOT NULL,
        status TEXT NOT NULL, effective_at TEXT, redirect_until TEXT, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX fed_migration_open ON fed_migration(tenant_id, subject)
        WHERE direction = 'own' AND status IN ('prepared','announced');
      CREATE INDEX fed_migration_redirect ON fed_migration(subject, status, redirect_until);
  validation_rules:
    requirements:
      - A move is valid only when signed by a registered device key of the subject and when all timing and cool-down rules hold.
      - Observed moves from others are verified exactly like own moves and ignored otherwise.
      - Every violation maps to one stable error code with a localized message key.
    rules:
      - "V01 | move statement signature verifies and signer is a device key listed in the subject's portable document valid at announcedAt (F07.S02.M01) | FEDERATION_MOVE_SIGNER_INVALID"
      - "V02 | last effective move of the subject is ≥ 30 days old | FEDERATION_MOVE_COOLDOWN"
      - "V03 | toRelay is an active selected relay or peer with confirmed fingerprint (F11.S03.M01) and differs from fromRelay | FEDERATION_MOVE_TARGET_INVALID"
      - "V04 | effectiveAt is announcedAt + 24 h (±0) and announcedAt is not more than 7 days in the future of the receiver clock | VALIDATION_FAILED"
      - "V05 | relay move statement is signed by the pinned relay key and the new base URL passes F11.S03.M01 V01 | FEDERATION_KEY_MISMATCH"
      - "V06 | veto statement is signed by a registered device key other than the signer, received before effectiveAt | FEDERATION_MOVE_VETO_INVALID"
      - "V07 | copy step completed for ≥ 99 percent of public records, with every failure listed, before announce | PRECONDITION_FAILED"
  workflow_state_machine:
    requirements:
      - A move advances prepared, announced and effective and may be cancelled only before it becomes effective.
      - The redirect and the rebinding of the author's origin relay start only at effective, never at announce.
      - Closed and cancelled are terminal; a later move creates a new record.
    machines:
      - entity: MigrationRecord
        initial: prepared
        terminal: [cancelled, closed]
        transitions:
          - "prepared -> announced | federation.migration.announce signed with a registered device key, copy step ≥ 99 percent | produces classrup.federation.move/v1 and queues it to old relay, new relay and peers"
          - "prepared -> cancelled | federation.migration.cancel or account deletion requested | no statement"
          - "announced -> effective | 24 h veto window elapsed with no valid veto | emits federation.account.moved; old relay starts redirect for 180 days"
          - "announced -> cancelled | valid veto from another registered device key, or cancel by the signer | produces classrup.federation.move_cancel/v1"
          - "effective -> closed | redirectUntil reached | old relay removes redirect"
    timeouts:
      - "Veto window 24 h from announcedAt; sweep every 5 min promotes announced records whose effectiveAt ≤ now."
      - "Redirect expiry sweep daily closes effective records with redirectUntil ≤ now."
      - "Prepared records idle for 14 days are cancelled."
  commands_queries_events:
    requirements:
      - The module exposes prepare, copy, announce, cancel and receive commands plus status and redirect queries with the signatures below.
      - Each command states whether it is vault-local, produces a signed statement or is a relay command, and emits its events in the same transaction.
      - Only a verified, effective move emits federation.account.moved, and observers act on it only after their own verification.
    commands:
      - name: federation.migration.prepare
        capability: federation.migration.prepare
        input: "[vault-local command] { kind: account|relay, toRelay: relayId or baseUrl }"
        output: "{ migrationId, status: prepared, publicRecords, tombstones }"
        errors: [FEDERATION_MOVE_COOLDOWN, FEDERATION_MOVE_TARGET_INVALID, CONFLICT_STATE, FEATURE_DISABLED]
        emits: []
        idempotent: true
      - name: federation.migration.copy
        capability: federation.migration.copy
        input: "[vault-local command; uses sync outbox of F11.S02.M01] { migrationId, expectedRevision }"
        output: "{ migrationId, revision, copyProgress }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, DEPENDENCY_UNAVAILABLE]
        emits: []
        idempotent: true
      - name: federation.migration.announce
        capability: federation.migration.announce
        input: "[vault-local command; produces signed statement classrup.federation.move/v1] { migrationId, expectedRevision }"
        output: "{ migrationId, revision, moveCid, effectiveAt }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, PRECONDITION_FAILED, FEDERATION_MOVE_SIGNER_INVALID, FEDERATION_MOVE_COOLDOWN]
        emits: []
        idempotent: true
      - name: federation.migration.cancel
        capability: federation.migration.cancel
        input: "[vault-local command; produces signed statement classrup.federation.move_cancel/v1 when announced] { migrationId, expectedRevision }"
        output: "{ migrationId, revision, status: cancelled }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, FEDERATION_MOVE_VETO_INVALID]
        emits: []
        idempotent: true
      - name: federation.migration.receive_move
        capability: federation.migration.receive
        input: "[vault-local or relay command; consumes statements classrup.federation.move/v1, move_cancel/v1] { statement: Envelope }"
        output: "{ migrationId, status, effectiveAt }"
        errors: [FED_SIGNATURE_INVALID, FEDERATION_MOVE_SIGNER_INVALID, FEDERATION_MOVE_VETO_INVALID, FEDERATION_KEY_MISMATCH, VALIDATION_FAILED]
        emits: [federation.account.moved]
        idempotent: true
    queries:
      - name: federation.migration.get
        capability: federation.migration.read
        input: "{ migrationId? } or current for the principal"
        output: "{ migration: MigrationRecord }"
        errors: [NOT_FOUND]
      - name: federation.migration.redirect
        capability: federation.migration.read_public
        input: "{ author: did:key } over GET /fed/v1/moved"
        output: "{ moved: boolean, toRelay?, moveCid?, until? }"
        errors: []
    events_produced:
      - {type: federation.account.moved, privacy: P0, payload: "{ subject, kind, fromRelay, toRelay, moveCid, effectiveAt, redirectUntil }"}
    events_consumed:
      - {type: identity.portable_doc.published, effect: "mark the home-relay update step done when the document lists the new relay and the signer key"}
      - {type: identity.device_key.revoked, effect: "cancel an announced move signed by the revoked key within its veto window"}
      - {type: federation.delivery.failed, effect: "increase copyProgress.failed for the migration's copy entries"}
      - {type: federation.conflict.detected, effect: "hold the redirect of an observed move whose author has two conflicting move statements"}
      - {type: privacy.deletion.requested, effect: "cancel the open own migration and send tombstones to both relays"}
    errors:
      - "FEDERATION_MOVE_SIGNER_INVALID | 403 | no | signer is not a registered device key of the subject at the signing time"
      - "FEDERATION_MOVE_COOLDOWN | 409 | no | the subject moved less than 30 days ago"
      - "FEDERATION_MOVE_TARGET_INVALID | 422 | no | target relay is not a confirmed active relay or equals the current relay"
      - "FEDERATION_MOVE_VETO_INVALID | 403 | no | veto not signed by another registered device key or outside the veto window"
      - "FED_SIGNATURE_INVALID | 400 | no | move statement signature check failed"
      - "FEDERATION_KEY_MISMATCH | 409 | no | relay move not signed by the pinned relay key"
    example: |
      federation.migration.prepare { kind: "account", toRelay: "relay:new.example" }
      -> { migrationId: "0192f3f0-...", status: "prepared", publicRecords: 42, tombstones: 3 }
      federation.migration.announce { migrationId: "0192f3f0-...", expectedRevision: 2 }
      -> { migrationId: "0192f3f0-...", revision: 3, moveCid: "sha256-Mv...", effectiveAt: "2026-11-05T10:00:00.000Z" }
      GET /fed/v1/moved?author=did:key:z6Mk...  (after effectiveAt)
      -> { "moved": true, "toRelay": "relay:new.example", "moveCid": "sha256-Mv...", "until": "2027-05-04T10:00:00.000Z" }
  authorization_capabilities:
    requirements:
      - Only the unlocked local principal can prepare, copy, announce or cancel an own move, and only with a device key listed in its portable document.
      - Any registered device key of the principal other than the signer may veto during the window.
      - The redirect lookup is public, and observed moves are accepted by any vault or relay only after verification.
    capabilities:
      - "federation.migration.prepare | local principal, operator | vault policy: unlocked vault owner for account moves; relay policy: operator of this relay for relay moves"
      - "federation.migration.copy | local principal | vault policy: migration belongs to the vault"
      - "federation.migration.announce | local principal, operator | vault policy: signer is a registered device key; relay policy: operator holding the relay key"
      - "federation.migration.cancel | local principal, operator | vault policy: any registered device key before effectiveAt"
      - "federation.migration.receive | local principal, system | vault or relay verifies the statement; no caller authority is assumed"
      - "federation.migration.read | local principal, operator | own vault or own relay"
      - "federation.migration.read_public | anonymous, local principal | relay public redirect lookup; rate limited to 60 requests/minute per IP prefix"
  failure_recovery_idempotency:
    requirements:
      - All commands are idempotent per CTR-IDM-001 and mutating commands require expectedRevision.
      - The copy step is resumable and re-sends only entries without a receipt, relying on cid dedup at the new relay.
      - A failure before effective leaves the old relay fully authoritative for delivery and the vault untouched.
    idempotency: "Idempotency-Key on all commands (24 h replay); announce replay returns the same moveCid; receive_move is idempotent by move cid."
    concurrency: "expectedRevision on state changes; unique index allows one open own migration per principal; veto and effective promotion race resolves by comparing the veto's receipt time with effectiveAt on the receiver clock, with ties going to the veto."
    retries: "Copy and statement delivery use the outbox retry rules of F11.S02.M01; this module does not retry independently."
    offline: "Prepare and cancel work offline; copy, announce and veto need connectivity and the UI shows delivery states per step without claiming completion."
    partial_failure: "If the new relay accepts some records but not all, migration stays prepared with copyProgress.failed listed and announce is refused until failures are under 1 percent or the user accepts leaving them behind explicitly."
  privacy_retention_abuse:
    requirements:
      - A move statement reveals the old and new relay of a pseudonymous did:key, which is public by design and stated in the wizard.
      - A stolen device key must not silently move an account, so a 24 h veto window and a 30-day cool-down limit the damage, and the UI says when only one device key exists and no veto is possible.
      - The move never transfers private data between relays; the vault re-establishes mailboxes and encrypted material itself.
    data:
      - "MigrationRecord and move statements: P0 (did, relay ids, times)."
      - "Copy progress counters: P0."
    retention:
      - "RET-EVIDENCE for MigrationRecord (2 years after closing); redirect data on the old relay 180 days after effectiveAt."
    threats:
      - "T01 | Stolen device key moves the account to an attacker relay | 24 h veto from another registered device key, 30-day cool-down, immediate notice on all devices, move requires a key registered ≥ 24 h"
      - "T02 | Forged move statement for a victim | signature by a key in the victim's portable document is mandatory; observers verify independently"
      - "T03 | Redirect abuse to send readers to a malicious relay | redirect only after a verified effective statement; relays are allowlisted or user-selected; readers see the target relay name"
      - "T04 | Replay of an old move statement to move an account back | move cid dedup, 30-day cool-down, seq chain position checked, tombstones kept 180 days"
      - "T05 | Metadata leak of old relay to new relay or peers | the statement carries only did and relay ids; no records or contact data are included"
      - "T06 | Relay move used to hijack peering | relay move honored only with the pinned relay key and, if the key changes, requires manual re-peering"
    abuse_controls:
      - "Move statements per did are limited to 3 per 90 days even when cancelled."
      - "Redirect lookups are rate limited to 60 per minute per IP prefix (/24 or /48)."
  observability_performance:
    requirements:
      - Moves, vetoes and failures are counted on relays and shown in local diagnostics in the vault; the PWA sends no telemetry.
      - Redirect lookup meets read budget p95 ≤ 150 ms.
      - Alerts fire on a relay when more than 5 vetoes occur in 24 h or when a copy step stays incomplete for 24 h.
    metrics:
      - "classrup_federation_migrations_total{outcome=announced|effective|cancelled|vetoed|closed}"
      - "classrup_federation_migration_copy_failed_total"
      - "classrup_federation_redirect_lookups_total{result=moved|none}"
    logs:
      - "info federation.migration.effective {migrationId, subjectPrefix(16), correlationId} — no relay credentials."
    budgets:
      - "redirect lookup p95 ≤ 150 ms; announce p95 ≤ 300 ms excluding delivery."
      - "Copy step throughput ≥ 100 envelopes per batch within the delivery budget of F11.S02.M01."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Security tests cover stolen key, forged move, replay and veto race.
      - A documentation check verifies that bridge mappings exist and are labelled Future.
    fixtures: "Principal P with device keys K1 (signer) and K2 (veto), vault V, relays R1 (old), R2 (new), observer relay R3, fake clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | integration | 01.R01,01.R02,04.R01 | prepare, copy, announce, wait 24 h | status effective, moveCid verified, account.moved emitted once, did unchanged"
      - "T02 | unit | 02.R01,02.R03 | each rule V01–V07 violated | documented code; no state change"
      - "T03 | abuse | 02.R01,07.R02 | move signed by revoked key, unlisted key and key registered 1 h earlier | FEDERATION_MOVE_SIGNER_INVALID"
      - "T04 | integration | 03.R01,03.R02,02.R02 | veto from K2 at 23 h 59 min and at 24 h 01 min | first cancels the move; second ignored; redirect inactive after cancel"
      - "T05 | property | 03.R01,03.R03 | random command sequences on one record | only declared transitions succeed; cancelled and closed never change"
      - "T06 | integration | 03.R02,04.R03 | observer R3 receives move before and after effectiveAt | rebinding of origin relay only after effective; F11.S01.M02 accepts records from R2 afterward"
      - "T07 | contract | 04.R01,04.R02,09.R02 | each command, query and event | validate against registry schemas including statements move/v1 and move_cancel/v1"
      - "T08 | abuse | 05.R01,05.R02,05.R03 | non-owner announces; veto by the signing key itself; anonymous reads redirect | FORBIDDEN or FEDERATION_MOVE_VETO_INVALID; redirect read allowed"
      - "T09 | integration | 06.R01,06.R02 | replay announce; kill app during copy then resume | same moveCid; copy resumes without duplicates"
      - "T10 | chaos | 06.R03,06.R01 | new relay accepts 95 of 100 records | announce refused with PRECONDITION_FAILED until under 1 percent failed or explicit acceptance"
      - "T11 | abuse | 07.R01,07.R02,07.R03 | inspect move statement and UI with a single device key | no private data in statement; UI states that no veto is possible"
      - "T12 | abuse | 07.R02,02.R02 | second move after 10 days; 4th move statement in 90 days | FEDERATION_MOVE_COOLDOWN; rate limit"
      - "T13 | abuse | 07.R01,03.R01 | replay of old move statement after a newer move | rejected by cid dedup and chain position; no move back"
      - "T14 | integration | 04.R03,07.R03 | relay move signed by pinned key, and by a different key | base URL updated on peers for the first; second FEDERATION_KEY_MISMATCH and peer suspended"
      - "T15 | load | 08.R01,08.R02,08.R03 | 60 redirect lookups per minute and 1000 observed moves | p95 ≤ 150 ms, rate limit enforced, metrics exported"
      - "T16 | manual | 09.R03,01.R03 | review docs/federation/bridges.md | ActivityPub and AT Protocol mappings listed and each labelled Future and not implemented"
      - "T17 | a11y | 03.R03,01.R01 | operate wizard, countdown and veto prompt by keyboard and screen reader | steps announced, countdown text milestones announced, targets ≥ 44 px"
      - "T18 | unit | 09.R01 | traceability tool run | every PS-090 requirement maps to a passing test"
      - "T19 | integration | 10.R01,10.R02,10.R03 | export vault, import into fresh vault on R2, restore backup | records round trip; imported records re-verified; move state preserved"
    acceptance:
      - All tests T01–T19 pass in CI.
      - A stolen-key move is cancelled by a second device key within the veto window (abuse test).
      - The did and every local record are unchanged by a move.
      - Bridge documents exist and are marked Future.
  import_export_backup_rollback:
    requirements:
      - A vault export carries the data needed to restart on another relay, namely public records, tombstones and the move history, and never private keys.
      - Import on a new relay is performed by sending the exported statements through the normal verified inbox path, so no special trust is created.
      - Schema changes follow expand/contract and v1 stays readable for 180 days.
    export: "Section federation.migrations in classrup-export/v1 (schema classrup.federation.migration/v1) plus the vault's own signed envelopes and tombstones from F11.S01.M02."
    import: "Own envelopes and tombstones are re-verified and queued to the selected relay; observed moves are re-verified and applied only if still within their redirect period."
    backup: "Vault export is the primary backup (IOX-6); relay data including redirects is covered by relay SQLite backup (CTR-IOX-001 IOX-3)."
    migration_rollback: "Additive fields only in v1; rollback is safe because pending moves can be cancelled and effective ones stay valid as signed statements; the redirect lookup can be disabled with the F11 flag without data loss."
