    acceptance:
      - All tests T01–T25 pass in CI.
      - A stolen-key move, including one with a backdated announcedAt, is cancelled by a second device key within the veto window (abuse tests T04 and T22).
      - The did and every local record are unchanged by a move, and no relay becomes authoritative for the principal's records.
      - Bridge documents exist and are marked Future.
  import_export_backup_rollback:
    requirements:
      - A vault export carries the data needed to restart on another relay, namely public records, tombstones and the move history, and never private keys.
      - Import on a new relay is performed by sending the exported statements through the normal verified inbox path, so no special trust is created.
      - Schema changes follow expand/contract and v1 stays readable for 180 days.
    export: "Section federation.migrations in classrup-export/v1 (schema classrup.federation.migration/v1) through the ExportSectionPort, plus the vault's own signed envelopes and tombstones from F11.S01.M02."
    import: "Own envelopes and tombstones are re-verified and queued to the selected relay; observed moves are re-verified and applied only if still within their redirect period, with windows recomputed on the importing device's clock."
    backup: "Vault export is the primary backup (IOX-6); relay data including redirects is covered by relay SQLite backup (CTR-IOX-001 IOX-3)."
    migration_rollback: "Additive fields only in v1 (signerKey, firstReceivedAt, windowSource, conflictId); rollback is safe because pending moves can be cancelled and effective ones stay valid as signed statements; the redirect lookup can be disabled with the F11 flag without data loss."
