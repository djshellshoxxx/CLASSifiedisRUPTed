id: F11.S03.M03
scope: MVP
summary: >-
  Moves a principal's user-selected home relay (the relay it lists first and delivers to), and optionally a relay's address, without losing local records or history. The
  principal signs a move statement (classrup.federation.move/v1) with a device key that its portable identity
  document lists as active; the did:key stays the same and its chains simply continue on the new relay. No relay is
  authoritative for the principal's records, so a move changes only where others fetch and deliver: the old relay
  serves a redirect for 180 days and receivers update their fetch hints after verifying the statement. A 24 h veto
  window, measured on each receiver's own clock from its first verified receipt (or from the old relay's signed
  receipt time) and never from the claimed announcement time, lets another device key cancel a move made with a
  stolen key; signer key status is checked at the receiver's time. Conflicting moves of one subject go to conflict
  review and activate nothing. The user's vault export is coupled to the new relay import. ActivityPub and AT
  Protocol bridges are documented mappings only (Future).
responsibilities:
  - Own MigrationRecord for account moves (principal changes its selected home relay) and relay moves (operator changes base URL with the same relay key).
  - Build, sign (through F11.S01.M02 publish) and send the move statement, copy the principal's public records and tombstones to the new relay through F11.S02.M01, and publish the updated relays list in the portable identity document (F07.S02.M01).
  - Enforce a 24 h veto window on each receiver's clock, a cool-down of one move per 30 days, a 24 h minimum key age and a 180-day redirect on the old relay.
  - Verify inbound move statements from other principals and relays, open a commitment conflict through F11.S02.M03 for conflicting moves, and emit federation.account.moved only for statements that verify and become effective on this receiver.
  - Provide the redirect lookup GET /fed/v1/moved?author=did on relays and document the ActivityPub and AT Protocol mappings as Future work.
  - Register the N6 privacy ports for the migration history.
non_responsibilities:
  - Key generation, device key registration, revocation and recovery (F07 identity).
  - Record verification and storage on the new relay (F11.S01.M02); acceptance there never depends on a move.
  - Delivery retries and queues (F11.S02.M01 and F15.S01.M01).
  - Conflict records and their resolution (F11.S02.M03).
  - Vault export format (CTR-IOX-001 and F10 export modules); this module only triggers and verifies the coupling.
  - "Future: ActivityPub Move activity and alsoKnownAs, AT Protocol did:plc migration and handle rebinding; MVP documents the field mapping in docs/federation/bridges.md and implements none of it."
  - "Future: migration of private mailbox contents between relays; MVP leaves mailboxes to expire and the vault re-subscribes."
depends_on: [F11.S01.M01, F11.S01.M02, F11.S01.M03, F11.S02.M01, F11.S02.M03, F11.S03.M01, F07.S02.M01, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, CTR-FED-001, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-OBS-001, CTR-IOX-001, CTR-PRV-001]
user_stories:
  - As a user, I can move to another relay, see each step (copy records, announce, wait 24 h, redirect) and keep every record I own on my device throughout.
  - As a user whose phone was stolen, I can veto a move from a second registered device during the 24 h window, even if the thief backdated the move.
  - As a reader, I am sent to the author's new relay when I open an old link, and I see that the author moved.
  - As a relay operator, I can announce a new base URL for my relay so peers update without re-peering when the key is unchanged.
edge_cases:
  - Move statement signed by a device key that the latest verified portable document marks revoked at the receiver's time; rejected with FEDERATION_MOVE_SIGNER_INVALID whatever announcedAt claims.
  - The signer key is revoked after the move was announced but before it becomes effective on this receiver; the promotion re-check cancels it and no account.moved is emitted.
  - Second move requested 10 days after the first; refused with FEDERATION_MOVE_COOLDOWN.
  - A stolen key signs a move claiming announcedAt 25 h ago; an observer holds it for a full 24 h from its own first verified receipt and a veto from K2 at 23 h still cancels it; the old relay, receiving it straight from the device, refuses it because announcedAt is more than 10 min from its clock.
  - Veto from a second device key arrives 23 h 59 min after this receiver's first receipt; move cancelled; a veto arriving after the local effective time is ignored.
  - New relay unreachable or refuses the account; migration stays prepared or announced, redirect is not activated, the old relay stays the selected delivery relay and the user can cancel.
  - Two move statements for the same did with different targets; F11.S02.M03 opens a commitment conflict for move:subject, both moves are held and no redirect is activated.
  - Relay move statement signed by a different key than the pinned relay key; dropped with FEDERATION_KEY_MISMATCH and counted only against the sender that signed the delivering request, never against the relay it names.
  - The user deletes the account during a pending move; the move is cancelled and tombstones are sent to both relays.
  - Move whose announcedAt claims a time more than 10 minutes in the receiver's future; refused as VALIDATION_FAILED since timestamps are claims.
ux:
  screens:
    - "Move wizard: choose new relay (relay chooser), review what moves (public records count, tombstones), what stays on device, and the 24 h veto notice."
    - "Migration progress: steps copy records, announce, veto window countdown, redirect active, with delivery states per step (not claiming more than reached)."
    - "Veto prompt on other devices: 'This account is being moved to relay X. Cancel the move?' with the time remaining on this device's clock."
    - "Moved banner on mirrored content: 'This author moved to relay X' with a link."
  states: [loading, empty, prepared, copying, announced, veto-window, held-conflict, effective, cancelled, closed, failed]
  a11y:
    - Wizard steps use a labelled ordered list with the current step marked aria-current and each step's status given in text.
    - The veto countdown is available as text and announced at 12 h, 1 h and 10 min through aria-live polite, not by colour or animation alone.
    - Cancel and confirm buttons are ≥ 44×44 px and confirm dialogs trap and restore focus.
processes:
  domain_schema:
    requirements:
      - A MigrationRecord stores kind, subject, from and to relay, the move statement cid, the claimed announcement time, this receiver's first verified receipt and computed effective time, redirect end, status, copy progress and direction (own or observed) with tenant and revision per CTR-ID-001.
      - The move statement is a public signed statement and carries only did, relay ids, base URLs and times; it never contains record contents or contact details.
      - The redirect period is 180 days, equal to the minimum tombstone stub retention, so a moved author cannot be resurrected on the old relay by replay.
    entities:
      - name: MigrationRecord
        schema: classrup.federation.migration/v1
        storage: relay+device
        privacy: P0
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope (vault id in the browser vault)"
          - "kind: enum — account | relay"
          - "direction: enum — own | observed"
          - "subject: string — did:key of the principal for account moves, relay id for relay moves"
          - "fromRelay: string — relay id or base URL before the move"
          - "toRelay: string — relay id or base URL after the move"
          - "moveCid?: string — cid of the signed classrup.federation.move/v1 statement"
          - "signerKey?: string — device key (account moves) or relay key (relay moves) that signed the move"
          - "announcedAt?: timestamp — claim of the signer; for own moves the local clock at signing"
          - "firstReceivedAt?: timestamp — this receiver's clock at its first verified receipt (own: announcedAt)"
          - "windowSource: enum — own_clock | first_receipt | old_relay_receipt"
          - "effectiveAt?: timestamp — on this receiver's clock: max(window start + 24 h, signer key first seen + 24 h)"
          - "redirectUntil?: timestamp — effectiveAt + 180 days"
          - "copyProgress: json — {records: int, tombstones: int, delivered: int, failed: int}"
          - "vetoedBy?: string — did of the device key that cancelled during the window"
          - "conflictId?: uuidv7 — open F11.S02.M03 conflict holding this move"
          - "status: enum — prepared | announced | effective | cancelled | closed"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - At most one non-terminal own account MigrationRecord per principal.
          - status effective implies moveCid verified, effectiveAt ≤ now on this receiver's clock, no veto recorded before effectiveAt, the signer key still active at promotion and no open conflict for the subject.
          - The subject did never changes in an account move; only the relays where it is reached change.
          - A new own account move requires the previous effective move to be at least 30 days old.
          - effectiveAt is never computed from announcedAt for an observed move.
    sql: |
      CREATE TABLE fed_migration (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, kind TEXT NOT NULL, direction TEXT NOT NULL, subject TEXT NOT NULL,
        status TEXT NOT NULL, effective_at TEXT, redirect_until TEXT, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX fed_migration_open ON fed_migration(tenant_id, subject)
        WHERE direction = 'own' AND status IN ('prepared','announced');
      CREATE INDEX fed_migration_redirect ON fed_migration(subject, status, redirect_until);
  validation_rules:
    requirements:
      - A move is valid only when signed by a device key that the subject's latest verified portable document lists as active at the receiver's time of evaluation, and when all timing, key-age and cool-down rules hold.
      - Observed moves from others are verified exactly like own moves and ignored otherwise.
      - Every violation maps to one stable error code with a localized message key.
      - The veto window is measured on each receiver's own clock from its first verified receipt (or the old relay's signed receipt time), never from the claimed announcedAt, so a backdated move is still held for a full 24 h and can be vetoed.
      - A relay move signed by a key other than the pinned relay key is dropped and counted only against the sender that signed the delivering request, never against the relay it names.
    rules:
      - "V01 | move statement signature verifies (F11.S01.M03) and the signer is a device key listed active in the subject's latest verified portable document at the receiver's time (F07.S02.M01 key_status); the check is repeated at promotion to effective and a key revoked by then invalidates the move regardless of announcedAt | FEDERATION_MOVE_SIGNER_INVALID"
      - "V02 | last effective move of the subject is ≥ 30 days old | FEDERATION_MOVE_COOLDOWN"
      - "V03 | toRelay is an active selected relay or peer with confirmed fingerprint (F11.S03.M01) and differs from fromRelay | FEDERATION_MOVE_TARGET_INVALID"
      - "V04 | a receiver that gets the move straight from the signing device (the principal's other devices, or a relay inbox from a hosted device key) requires abs(announcedAt - now) ≤ 10 min; no receiver accepts an announcedAt more than 10 min in its future; the window starts at this receiver's first verified receipt, or at the old relay's signed receipt time when one is attached, never at announcedAt | VALIDATION_FAILED"
      - "V05 | relay move statement is signed by the pinned relay key and the new base URL passes F11.S03.M01 V01; a wrong-key relay move is dropped and counted only against the delivering sender when that sender signed the request | FEDERATION_KEY_MISMATCH"
      - "V06 | veto statement (move_cancel) is signed by a device key of the subject other than the move signer and received before this receiver's effectiveAt | FEDERATION_MOVE_VETO_INVALID"
      - "V07 | copy step completed for ≥ 99 percent of public records, with every failure listed, before announce | PRECONDITION_FAILED"
      - "V08 | own announce: the signing key has been active in the principal's portable document for ≥ 24 h; receivers: effectiveAt is postponed to 24 h after this verifier first saw the signer key in a verified portable-document version (not its addedAt claim) | FEDERATION_MOVE_SIGNER_INVALID"
  workflow_state_machine:
    requirements:
      - A move advances prepared, announced and effective and may be cancelled only before it becomes effective.
      - The redirect and the switch of the author's fetch hints start only at effective, never at announce, and no acceptance rule depends on them.
      - Closed and cancelled are terminal; a later move creates a new record.
      - Conflicting move statements for one subject open a commitment conflict in F11.S02.M03 through detect, hold both moves and activate no redirect until the conflict is resolved.
    machines:
      - entity: MigrationRecord
        initial: prepared
        terminal: [cancelled, closed]
        transitions:
          - "prepared -> announced | federation.migration.announce signed with a device key active ≥ 24 h, copy step ≥ 99 percent | produces classrup.federation.move/v1 through F11.S01.M02 publish and queues it to old relay, new relay and peers"
          - "prepared -> announced | federation.migration.receive_move of a verified observed move | effectiveAt computed on this receiver's clock (V04, V08); conflicting moves call federation.conflict.detect and set conflictId"
          - "prepared -> cancelled | federation.migration.cancel or account deletion requested | no statement"
          - "announced -> effective | this receiver's effectiveAt reached with no valid veto, the signer key still active on re-check (V01) and no open conflict for the subject | emits federation.account.moved; old relay starts redirect for 180 days"
          - "announced -> cancelled | valid veto from another device key of the subject, cancel by the signer, signer key revoked before effectiveAt, or federation.conflict.resolved drop_all for the subject | produces classrup.federation.move_cancel/v1 for own moves"
          - "effective -> closed | redirectUntil reached | old relay removes redirect"
    timeouts:
      - "Veto window 24 h from this receiver's window start (own clock, first verified receipt or old relay receipt); sweep every 5 min promotes announced records whose effectiveAt ≤ now after re-checking the signer key."
      - "Redirect expiry sweep daily closes effective records with redirectUntil ≤ now."
      - "Prepared records idle for 14 days are cancelled."
  commands_queries_events:
    requirements:
      - The module exposes prepare, copy, announce, cancel and receive commands plus status and redirect queries with the signatures below.
      - Each command states whether it is vault-local, produces a signed statement or is a relay command, and emits its events in the same transaction.
      - Only a verified move that became effective on this receiver emits federation.account.moved, and observers act on it only after their own verification.
      - "Move statements and signer roles are registered with F11.S01.M01 (N2): classrup.federation.move/v1 signed by a device key of the subject (relay moves by the pinned relay key) and classrup.federation.move_cancel/v1 signed by a device key of the subject, a veto by a key other than the move signer; both are signed through F11.S01.M02 publish."
    commands:
      - name: federation.migration.prepare
        capability: federation.migration.prepare
        input: "[vault-local command] { kind: account|relay, toRelay: relayId or baseUrl }"
        output: "{ migrationId, status: prepared, publicRecords, tombstones }"
        errors: [FEDERATION_MOVE_COOLDOWN, FEDERATION_MOVE_TARGET_INVALID, CONFLICT_STATE, FEATURE_DISABLED]
        emits: []
        idempotent: true
      - name: federation.migration.copy
        capability: federation.migration.copy
        input: "[vault-local command; routes copies through F11.S02.M01 into the F15.S01.M01 sync outbox] { migrationId, expectedRevision }"
        output: "{ migrationId, revision, copyProgress }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, DEPENDENCY_UNAVAILABLE]
        emits: []
        idempotent: true
      - name: federation.migration.announce
        capability: federation.migration.announce
        input: "[vault-local command; produces signed statement classrup.federation.move/v1 through F11.S01.M02 publish] { migrationId, expectedRevision }"
        output: "{ migrationId, revision, moveCid, effectiveAt }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, PRECONDITION_FAILED, FEDERATION_MOVE_SIGNER_INVALID, FEDERATION_MOVE_COOLDOWN]
        emits: []
        idempotent: true
      - name: federation.migration.cancel
        capability: federation.migration.cancel
        input: "[vault-local command; produces signed statement classrup.federation.move_cancel/v1 when announced] { migrationId, expectedRevision }"
        output: "{ migrationId, revision, status: cancelled }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, FEDERATION_MOVE_VETO_INVALID]
        emits: []
        idempotent: true
      - name: federation.migration.receive_move
        capability: federation.migration.receive
        input: "[vault-local or relay command; consumes statements classrup.federation.move/v1 and move_cancel/v1 accepted by F11.S01.M02, with the receipt context { firstReceivedAt, source, oldRelayReceipt? }] { statement: Envelope }"
        output: "{ migrationId, status, effectiveAt, conflictId? }"
        errors: [FED_SIGNATURE_INVALID, FEDERATION_MOVE_SIGNER_INVALID, FEDERATION_MOVE_VETO_INVALID, FEDERATION_KEY_MISMATCH, VALIDATION_FAILED]
        emits: [federation.account.moved]
        idempotent: true
    queries:
      - name: federation.migration.get
        capability: federation.migration.read
        input: "{ migrationId? } or current for the principal"
        output: "{ migration: MigrationRecord }"
        errors: [NOT_FOUND]
      - name: federation.migration.redirect
        capability: federation.migration.read_public
        input: "{ author: did:key } over GET /fed/v1/moved"
        output: "{ moved: boolean, toRelay?, moveCid?, until? }"
        errors: [RATE_LIMITED]
    events_produced:
      - {type: federation.account.moved, privacy: P0, payload: "{ subject, kind, fromRelay, toRelay, moveCid, effectiveAt (this receiver's clock), redirectUntil }"}
    events_consumed:
      - {type: identity.portable_doc.published, effect: "own: mark the relays-list update step done when the document lists the new relay and the signer key; received: a newly revoked signer key cancels an announced observed move before its effectiveAt, and first sight of a key starts its 24 h key age (V08)"}
      - {type: identity.device_key.revoked, effect: "cancel an own announced move signed by the revoked key within its veto window"}
      - {type: federation.delivery.failed, effect: "increase copyProgress.failed for the migration's copy entries"}
      - {type: federation.conflict.detected, effect: "subjectRef move:<subject>: set conflictId and hold every announced move of that subject; no redirect is activated"}
      - {type: federation.conflict.resolved, effect: "subjectRef move:<subject>: drop_all cancels the held moves; superseded keeps only the move named by supersededByCid, which then follows its own window"}
      - {type: privacy.deletion.requested, effect: "cancel the open own migration and send tombstones to both relays"}
      - {type: privacy.deletion.completed, effect: "pseudonymize the deleted principal's DID in retained own MigrationRecords (RET-EVIDENCE) (N6)"}
    errors:
      - "FEDERATION_MOVE_SIGNER_INVALID | 403 | no | signer is not a device key active in the subject's portable document at the receiver's time, or the key is younger than 24 h"
      - "FEDERATION_MOVE_COOLDOWN | 409 | no | the subject moved less than 30 days ago"
      - "FEDERATION_MOVE_TARGET_INVALID | 422 | no | target relay is not a confirmed active relay or equals the current relay"
      - "FEDERATION_MOVE_VETO_INVALID | 403 | no | veto not signed by another device key of the subject or outside this receiver's veto window"
    example: |
      federation.migration.prepare { kind: "account", toRelay: "relay:new.example" }
      -> { migrationId: "0192f3f0-...", status: "prepared", publicRecords: 42, tombstones: 3 }
      federation.migration.announce { migrationId: "0192f3f0-...", expectedRevision: 2 }
      -> { migrationId: "0192f3f0-...", revision: 3, moveCid: "sha256-Mv...", effectiveAt: "2026-11-05T10:00:00.000Z" }
      observer: federation.migration.receive_move { statement } (announcedAt claims 2026-11-03T09:00Z, first receipt 2026-11-04T10:00Z) -> { status: "announced", effectiveAt: "2026-11-05T10:00:00.000Z" }
      GET /fed/v1/moved?author=did:key:z6Mk...  (after effectiveAt)
      -> { "moved": true, "toRelay": "relay:new.example", "moveCid": "sha256-Mv...", "until": "2027-05-04T10:00:00.000Z" }
  authorization_capabilities:
    requirements:
      - Only the unlocked local principal can prepare, copy, announce or cancel an own move, and only with a device key listed active in its portable document.
      - Any device key of the principal other than the signer may veto during the window.
      - The redirect lookup is public, and observed moves are accepted by any vault or relay only after verification.
    capabilities:
      - "federation.migration.prepare | local principal, operator | vault policy: unlocked vault owner for account moves; relay policy: operator of this relay for relay moves"
      - "federation.migration.copy | local principal | vault policy: migration belongs to the vault"
      - "federation.migration.announce | local principal, operator | vault policy: signer is a device key active ≥ 24 h; relay policy: operator holding the relay key"
      - "federation.migration.cancel | local principal, operator | vault policy: any device key of the principal before effectiveAt"
      - "federation.migration.receive | local principal, system | vault or relay verifies the statement; no caller authority is assumed"
      - "federation.migration.read | local principal, operator | own vault or own relay"
      - "federation.migration.read_public | anonymous, local principal | relay public redirect lookup; rate limited to 60 requests/minute per IP prefix"
  failure_recovery_idempotency:
    requirements:
      - All commands are idempotent per CTR-IDM-001 and mutating commands require expectedRevision.
      - The copy step is resumable and re-sends only entries without a receipt, relying on cid dedup at the new relay.
      - A failure before effective leaves the old relay as the user's selected delivery relay and the vault untouched; no relay is authoritative for the principal's records.
    idempotency: "Idempotency-Key on all commands (24 h replay); announce replay returns the same moveCid; receive_move is idempotent by move cid and keeps the first firstReceivedAt."
    concurrency: "expectedRevision on state changes; unique index allows one open own migration per principal; a veto and the effective promotion race on this receiver's clock, comparing the veto's local receipt time with effectiveAt, with ties going to the veto."
    retries: "Copy and statement delivery use the outbox retry rules of F11.S02.M01 and F15.S01.M01; this module does not retry independently."
    offline: "Prepare and cancel work offline; copy, announce and veto need connectivity and the UI shows delivery states per step without claiming completion; an offline receiver starts its window at first receipt, so being offline never shortens the veto window."
    partial_failure: "If the new relay accepts some records but not all, migration stays prepared with copyProgress.failed listed and announce is refused until failures are under 1 percent or the user accepts leaving them behind explicitly."
  privacy_retention_abuse:
    requirements:
      - A move statement reveals the old and new relay of a pseudonymous did:key, which is public by design and stated in the wizard.
      - A stolen device key must not silently move an account, so a 24 h veto window on each receiver's clock, a 24 h minimum key age and a 30-day cool-down limit the damage, and the UI says when only one device key exists and no veto is possible.
      - The move never transfers private data between relays; the vault re-establishes mailboxes and encrypted material itself.
      - The module registers the N6 ports (ExportSectionPort for the migration history, DeletionPort, RetentionPurgePort for RET-EVIDENCE records), classifies fields with F10.S02.M02 and pseudonymizes retained records on privacy.deletion.completed.
    data:
      - "MigrationRecord and move statements: P0 (did, relay ids, times)."
      - "Copy progress counters: P0."
    retention:
      - "RET-EVIDENCE for MigrationRecord (2 years after closing); redirect data on the old relay 180 days after effectiveAt."
    threats:
      - "T01 | Stolen device key moves the account to an attacker relay | 24 h veto from another device key measured on each receiver's clock, 30-day cool-down, immediate notice on all devices, key age ≥ 24 h (V08), key status re-checked at promotion"
      - "T02 | Forged move statement for a victim | signature by a key active in the victim's portable document is mandatory; observers verify independently"
      - "T03 | Redirect abuse to send readers to a malicious relay | redirect only after a verified effective statement; relays are allowlisted or user-selected; readers see the target relay name"
      - "T04 | Replay of an old move statement to move an account back | move cid dedup, 30-day cool-down, 3 moves per 90 days, tombstone stubs kept at least 180 days"
      - "T05 | Metadata leak of old relay to new relay or peers | the statement carries only did and relay ids; no records or contact data are included"
      - "T06 | Relay move used to hijack peering, or a forged relay move used to get an honest peer suspended | relay move honored only with the pinned relay key; a wrong-key move is dropped and counted only against the sender that signed the delivering request; a key change requires manual re-peering"
      - "T07 | Backdated announcedAt used to skip the veto window | window starts at each receiver's first verified receipt or the old relay's signed receipt; direct receivers refuse announcedAt more than 10 min off (V04)"
    abuse_controls:
      - "Move statements per did are limited to 3 per 90 days even when cancelled."
      - "Redirect lookups are rate limited to 60 per minute per IP prefix (/24 or /48)."
  observability_performance:
    requirements:
      - Moves, vetoes and failures are counted on relays and shown in local diagnostics in the vault; the PWA sends no telemetry.
      - Redirect lookup meets read budget p95 ≤ 150 ms.
      - Alerts fire on a relay when more than 5 vetoes occur in 24 h or when a copy step stays incomplete for 24 h.
    metrics:
      - "classrup_federation_migrations_total{outcome=announced|effective|cancelled|vetoed|closed|held}"
      - "classrup_federation_migration_copy_failed_total"
      - "classrup_federation_redirect_lookups_total{result=moved|none}"
    logs:
      - "info federation.migration.effective {migrationId, subjectPrefix(16), correlationId} — no relay credentials."
    budgets:
      - "redirect lookup p95 ≤ 150 ms; announce p95 ≤ 300 ms excluding delivery."
      - "Copy step throughput ≥ 100 envelopes per batch within the delivery budget of F11.S02.M01."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Security tests cover stolen key, backdated announcement, forged move, replay and veto race.
      - A documentation check verifies that bridge mappings exist and are labelled Future.
    fixtures: "Principal P with device keys K1 (signer, first seen 3 days ago) and K2 (veto), vault V, relays R1 (old), R2 (new), observer relay R3 and observer vault V3, sender relay S, fake clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | integration | 01.R01,01.R02,04.R01 | prepare, copy, announce, wait 24 h | status effective, moveCid verified, account.moved emitted once, did unchanged, statement holds only did, relay ids and times"
      - "T02 | unit | 02.R03 | each rule V01–V08 violated | documented code; no state change"
      - "T03 | abuse | 02.R01,07.R02 | own announce signed by a revoked key, by an unlisted key and by a key added 1 h earlier | FEDERATION_MOVE_SIGNER_INVALID for each"
      - "T04 | integration | 03.R01,03.R02 | veto from K2 at 23 h 59 min and at 24 h 01 min after this receiver's first receipt | first cancels the move; second ignored; redirect inactive after cancel"
      - "T05 | property | 03.R01,03.R03 | random command sequences on one record | only declared transitions succeed; cancelled and closed never change"
      - "T06 | integration | 03.R02,04.R03 | observer R3 receives a move before and after its local effectiveAt | fetch hints and redirect switch only after effective; F11.S01.M02 accepts P's records from R2 both before and after, on signature alone"
      - "T07 | contract | 04.R01,04.R02,04.R04,09.R02 | each command, query and event | validate against registry schemas including statements move/v1 and move_cancel/v1 and their signer roles"
