id: F11.S03.M01
scope: MVP
summary: >-
  Keeps the explicit, opt-in list of relays a vault or relay exchanges signed statements with. A peer is
  active only after both sides opted in through signed peer-offer and peer-accept statements; there is no
  auto-discovery. Each peer has a pinned relay key (did:key), a trust level, per-peer quotas and a health
  score that falls on invalid signatures, forks and abuse and suspends the peer automatically below 40. In a
  vault the same list holds the user-selected relays. Relay-to-relay federation is behind a flag that is off
  by default; trust here is operational (rate and acceptance), never a claim that a peer's users are honest.
responsibilities:
  - Own Peer records (relay id, did:key relay key, base URL, kind, direction, trust level, quotas, health score, status, opt-in flags for both sides).
  - Run the opt-in handshake with signed classrup.federation.peer_offer/v1 and classrup.federation.peer_accept/v1 statements; activate only when both are verified and the operator or user confirmed the key fingerprint.
  - Resolve a request key id to an active peer and enforce quotas (default 6000 envelopes/hour, 10 batches/minute, 2 GiB stored per peer) for F11.S01.M02 and F11.S02.M01.
  - Maintain the health score from rejection, fork and delivery-failure events and suspend automatically below 40 or on 20 invalid signatures in 10 minutes.
  - Support key rotation through a rotation statement signed by the old key with a 7-day overlap, and refuse unexpected key changes with FEDERATION_KEY_MISMATCH.
non_responsibilities:
  - Verifying envelopes and requests cryptographically (F11.S01.M03) and storing records (F11.S01.M02).
  - Content-level blocking by author, cid or hash (F11.S03.M02).
  - Delivery queues and retries (F11.S02.M01).
  - Reputation of individual users (F07 identity).
  - "Future: peer discovery directories, transitive trust and relay reputation feeds; MVP is manual allowlist only."
depends_on: [F11.S01.M03, F15.S04.M02, F07.S02.M01, CTR-FED-001, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-FLG-001, CTR-OBS-001, CTR-IOX-001, CTR-PRV-001]
user_stories:
  - As a user, I can choose a relay, see its key fingerprint and policy, confirm it, and remove it later without losing any local record.
  - As a relay operator, I can propose peering to another relay, compare fingerprints out of band, and see the peering go active only when the other operator accepts.
  - As a relay operator, I can see a peer's health score and quotas and suspend it with a reason.
edge_cases:
  - Peer presents a different key than the pinned one without a rotation statement; requests rejected with FEDERATION_KEY_MISMATCH and the peer is suspended with reason key_mismatch.
  - Both operators propose to each other at the same time; the two proposals merge into one Peer in proposed state and activation needs one accept.
  - Base URL resolves to a private IP address or redirects to http; refused with FEDERATION_PEER_URL_INVALID on every request, including after DNS changes.
  - Proposal not accepted within 14 days; the Peer becomes expired and a new proposal is required.
  - Health score reaches 39 during a batch; the current batch finishes and the peer is suspended before the next request.
  - Operator lowers a quota below current usage; existing records stay, new envelopes are refused with FEDERATION_QUOTA_EXCEEDED until usage falls.
  - Flag F11 is off; peers stay in the table dormant and their health score is frozen.
ux:
  screens:
    - "Relay chooser (vault): list of relays with name, policy summary, key fingerprint in 8 groups of 4 characters, 'Use this relay' and 'Remove'."
    - "Peer list (relay operator): status, direction, trust level, health score bar with number, quota use, last activity, suspend and reinstate actions."
    - "Add peer wizard: base URL, fetch identity statement, compare fingerprint, send proposal, waiting for acceptance."
  states: [loading, empty, proposed, active, suspended, removed, expired, flag-off]
  a11y:
    - Fingerprints are shown as monospace groups with a copy button and are read by screen readers group by group.
    - Health score is shown as text and number, not colour alone, and status changes are announced via aria-live polite.
    - Suspend, reinstate and remove buttons are ≥ 44×44 px and confirm in a focus-trapping dialog that names the peer.
processes:
  domain_schema:
    requirements:
      - A Peer stores identity (relay id and did:key), URL, kind, opt-in flags for both sides, trust level, quotas, health score and status with tenant and revision per CTR-ID-001.
      - Peer records are relay-local or vault-local operational data classed P1 and are never federated or exported to other users.
      - The pinned key history keeps the current and the previous key for 7 days so rotation can overlap without accepting arbitrary keys.
    entities:
      - name: Peer
        schema: classrup.federation.peer/v1
        storage: relay+device
        privacy: P1
        retention: RET-AUDIT
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope (vault id in the browser vault)"
          - "relayId: string — stable relay identifier, unique per tenant"
          - "kind: enum — peer_relay | selected_relay"
          - "baseUrl: string — https origin on port 443, ≤ 200 chars"
          - "relayKey: string — did:key of the relay signing key (Ed25519)"
          - "previousKey?: string — prior did:key valid until previousKeyUntil"
          - "previousKeyUntil?: timestamp — rotation overlap end, rotatedAt + 7 days"
          - "localOptIn: boolean — this side opted in"
          - "remoteOptIn: boolean — verified peer_accept or peer_offer statement from the other side"
          - "direction: enum — inbound | outbound | both"
          - "trustLevel: enum — observer | standard | trusted"
          - "quotaEnvelopesPerHour: int — 600 observer, 6000 standard, 18000 trusted by default; range 100..60000"
          - "quotaBatchesPerMinute: int — default 10, range 1..60"
          - "quotaStoredBytes: int — default 2147483648, range 104857600..21474836480"
          - "healthScore: int — 0..100, starts at 80"
          - "status: enum — proposed | active | suspended | removed | expired"
          - "suspendReason?: enum — operator | health | key_mismatch | equivocation | compromise"
          - "offerStatementCid?: string — cid of the signed peer_offer or peer_accept statement"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - status active implies localOptIn and remoteOptIn are both true and a key fingerprint confirmation was recorded.
          - relayId is unique per tenant and relayKey changes only through a verified rotation statement.
          - healthScore stays between 0 and 100 and status active implies healthScore ≥ 40.
          - trustLevel observer never receives pushes of non-public data and inbound quota 600 envelopes/hour by default.
    sql: |
      CREATE TABLE fed_peer (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, relay_id TEXT NOT NULL, kind TEXT NOT NULL, base_url TEXT NOT NULL,
        relay_key TEXT NOT NULL, status TEXT NOT NULL, health_score INTEGER NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX fed_peer_relay ON fed_peer(tenant_id, relay_id);
      CREATE INDEX fed_peer_key ON fed_peer(relay_key);
  validation_rules:
    requirements:
      - Peer input is validated strictly; unknown fields are rejected and URLs are checked on every connection, not only at creation.
      - Activation needs verified statements from both sides and a recorded fingerprint confirmation.
      - Every violation maps to one stable error code with a localized message key.
    rules:
      - "V01 | baseUrl is https on port 443, host resolves to public addresses only (no loopback, link-local or private ranges), no redirects to other hosts | FEDERATION_PEER_URL_INVALID"
      - "V02 | relayKey is a did:key Ed25519 and the identity statement from baseUrl is signed by that key | FEDERATION_KEY_MISMATCH"
      - "V03 | at most 200 peers per tenant and relayId not already present | FEDERATION_PEER_LIMIT"
      - "V04 | peer_accept statement is signed by the pinned relayKey and references the offer cid | FED_SIGNATURE_INVALID"
      - "V05 | fingerprintConfirmed is true before activation | PRECONDITION_FAILED"
      - "V06 | quota values within the documented ranges | VALIDATION_FAILED"
      - "V07 | rotation statement signed by the current key with newKey and effective time within 7 days | FEDERATION_KEY_MISMATCH"
  workflow_state_machine:
    requirements:
      - A peer activates only when both sides opted in, and suspension or removal takes effect on the next request.
      - Suspended peers keep their pinned key and history and can be reinstated by an explicit action, never automatically.
      - Removed and expired are terminal; peering again creates a new Peer record.
    machines:
      - entity: Peer
        initial: proposed
        terminal: [removed, expired]
        transitions:
          - "proposed -> active | federation.peer.accept verified, both opt-in flags true, fingerprint confirmed | emits federation.peer.added"
          - "proposed -> expired | 14 days without remote acceptance | no event"
          - "proposed -> removed | federation.peer.remove | no event"
          - "active -> suspended | federation.peer.suspend, health below 40, key mismatch, equivocation or compromise | emits federation.peer.suspended"
          - "suspended -> active | federation.peer.reinstate by operator or user with fresh fingerprint check | emits federation.peer.reinstated"
          - "active -> removed | federation.peer.remove | emits federation.peer.removed"
          - "suspended -> removed | federation.peer.remove | emits federation.peer.removed"
    timeouts:
      - "Proposal expiry sweep every 1 h moves proposed peers older than 14 days to expired."
      - "Health recovery job every 10 min adds 1 point per 100 clean envelopes since the last run, up to 100."
      - "Key rotation overlap ends 7 days after rotation; the previous key is then removed."
  commands_queries_events:
    requirements:
      - The module exposes propose, accept, suspend, reinstate, remove and update commands plus list, get and resolve queries.
      - Each command states whether it is vault-local, produces a signed statement, or is a relay command, and emits its events in the same local transaction.
      - The module consumes rejection, fork and delivery failure events to maintain health scores and the flag event to pause peering.
    commands:
      - name: federation.peer.propose
        capability: federation.peer.propose
        input: "[vault-local or relay-local command; produces signed statement classrup.federation.peer_offer/v1] { baseUrl, kind, direction, trustLevel? default standard }"
        output: "{ peerId, status: proposed, offerStatementCid, fingerprint }"
        errors: [FEDERATION_PEER_URL_INVALID, FEDERATION_KEY_MISMATCH, FEDERATION_PEER_LIMIT, VALIDATION_FAILED, FEATURE_DISABLED]
        emits: []
        idempotent: true
      - name: federation.peer.accept
        capability: federation.peer.accept
        input: "[vault-local or relay-local command; consumes and produces peer_accept statements classrup.federation.peer_accept/v1] { peerId, expectedRevision, fingerprintConfirmed: true }"
        output: "{ peerId, revision, status: active }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, FED_SIGNATURE_INVALID, PRECONDITION_FAILED, FEATURE_DISABLED]
        emits: [federation.peer.added]
        idempotent: true
      - name: federation.peer.suspend
        capability: federation.peer.suspend
        input: "[vault-local or relay-local command] { peerId, expectedRevision, reason: operator|health|key_mismatch|equivocation|compromise }"
        output: "{ peerId, revision, status: suspended }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [federation.peer.suspended]
        idempotent: true
      - name: federation.peer.reinstate
        capability: federation.peer.reinstate
        input: "[vault-local or relay-local command] { peerId, expectedRevision, fingerprintConfirmed: true }"
        output: "{ peerId, revision, status: active }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, PRECONDITION_FAILED]
        emits: [federation.peer.reinstated]
        idempotent: true
      - name: federation.peer.remove
        capability: federation.peer.remove
        input: "[vault-local or relay-local command] { peerId, expectedRevision }"
        output: "{ peerId, revision, status: removed }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [federation.peer.removed]
        idempotent: true
      - name: federation.peer.update
        capability: federation.peer.update
        input: "[vault-local or relay-local command; key rotation consumes a statement classrup.federation.key_rotation/v1] { peerId, expectedRevision, trustLevel?, quotas?, rotation?: Envelope }"
        output: "{ peerId, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, VALIDATION_FAILED, FEDERATION_KEY_MISMATCH]
        emits: []
        idempotent: true
    queries:
      - name: federation.peer.list
        capability: federation.peer.read
        input: "{ status?, kind?, cursor?, limit ≤ 50 }"
        output: "{ items: Peer[], nextCursor? }"
        errors: []
      - name: federation.peer.get
        capability: federation.peer.read
        input: "{ peerId }"
        output: "{ peer: Peer, quotaUse: { envelopesLastHour, batchesLastMinute, storedBytes } }"
        errors: [NOT_FOUND]
      - name: federation.peer.resolve_key
        capability: federation.peer.resolve
        input: "{ keyId }"
        output: "{ peerId, relayId, status, trustLevel, quotaRemaining } or none"
        errors: [FEDERATION_PEER_NOT_ALLOWED]
    events_produced:
      - {type: federation.peer.added, privacy: P1, payload: "{ peerId, relayId, kind, direction, trustLevel }"}
      - {type: federation.peer.suspended, privacy: P1, payload: "{ peerId, relayId, reason }"}
      - {type: federation.peer.reinstated, privacy: P1, payload: "{ peerId, relayId }"}
      - {type: federation.peer.removed, privacy: P1, payload: "{ peerId, relayId }"}
    events_consumed:
      - {type: federation.record.rejected, effect: "lower the sending peer's health score by 5 per FED_SIGNATURE_INVALID (max 25 per hour), 2 per other code (max 10 per hour)"}
      - {type: federation.conflict.detected, effect: "lower health by 20 for each peer that delivered a candidate and suspend with reason equivocation when two forks occur within 24 h"}
      - {type: federation.delivery.failed, effect: "lower health by 1 per failed entry to the peer (max 10 per hour)"}
      - {type: platform.flag.changed, effect: "when F11 turns off, freeze health scores and mark peer_relay peers dormant; selected_relay peers are unaffected"}
    errors:
      - "FEDERATION_PEER_URL_INVALID | 422 | no | base URL is not https on 443, resolves to a non-public address or redirects"
      - "FEDERATION_KEY_MISMATCH | 409 | no | peer key differs from the pinned key without a valid rotation statement"
      - "FEDERATION_PEER_LIMIT | 409 | no | 200 peers per tenant reached or relay id already present"
      - "FED_SIGNATURE_INVALID | 400 | no | peer statement signature check failed"
      - "FEDERATION_PEER_NOT_ALLOWED | 403 | no | key id does not resolve to an active peer"
    example: |
      federation.peer.propose { baseUrl: "https://relay.example", kind: "peer_relay", direction: "both" }
      -> { peerId: "0192f3d0-...", status: "proposed", offerStatementCid: "sha256-Zk...", fingerprint: "7F3A 91C2 0B5D E418 ..." }
      federation.peer.accept { peerId: "0192f3d0-...", expectedRevision: 1, fingerprintConfirmed: true }
      -> { peerId: "0192f3d0-...", revision: 2, status: "active" }   emits federation.peer.added
  authorization_capabilities:
    requirements:
      - In a vault only the unlocked local principal manages the selected-relay list.
      - On a relay only that relay's operator manages peers, and every change is written to the relay audit log.
      - resolve_key is internal to F11.S01.M02 and F11.S02.M01 code paths and not exposed to external requests.
    capabilities:
      - "federation.peer.propose | local principal, operator | vault policy: unlocked vault owner for selected_relay; relay policy: operator role of this relay for peer_relay, with audit entry"
      - "federation.peer.accept | local principal, operator | same as propose; requires fingerprintConfirmed"
      - "federation.peer.suspend | local principal, operator, system | system only for automatic health or equivocation suspension"
      - "federation.peer.reinstate | local principal, operator | same as propose"
      - "federation.peer.remove | local principal, operator | same as propose"
      - "federation.peer.update | local principal, operator | same as propose"
      - "federation.peer.read | local principal, operator | own vault or own relay only"
      - "federation.peer.resolve | system | internal call from the verified inbox pipeline"
  failure_recovery_idempotency:
    requirements:
      - All commands are idempotent per CTR-IDM-001 and mutating commands require expectedRevision.
      - Quota counters are updated in the same transaction as the acceptance they count, so a crash cannot grant free capacity.
      - If peer data cannot be read, requests fail closed with DEPENDENCY_UNAVAILABLE rather than accepting traffic.
    idempotency: "Idempotency-Key on every command (24 h replay); propose with the same baseUrl and key returns the existing proposed Peer."
    concurrency: "expectedRevision on state changes; unique index on (tenant, relayId); health score updates use atomic increments clamped to 0..100; simultaneous proposals merge."
    retries: "Fetching the peer identity statement retries 3 times with backoff 1 s, 5 s, 30 s; other commands are local and not retried."
    offline: "A vault can edit its relay list offline; activation needs a live identity fetch so it stays proposed until the relay answers."
    partial_failure: "If the identity fetch succeeds but the proposal statement cannot be delivered, the Peer stays proposed and the UI offers retry; no half-active peer exists."
  privacy_retention_abuse:
    requirements:
      - Peer records contain no user data; they hold relay identity, quotas and health only.
      - A user's chosen relays are P1 vault data and are not shared with other users or relays, and the user is told which metadata a relay can observe (mailbox ID, size, time, IP).
      - Pseudonymity is not anonymity, so the relay chooser states that a relay sees the IP address of connecting devices and the did:key of each author.
    data:
      - "Peer: P1; relay id, URL, key, quotas, health."
      - "Audit log entries for peer changes: RET-AUDIT."
    retention:
      - "Peers RET-AUDIT (1 year after removal); suspended and removed peers keep keys and reasons for the audit period."
    threats:
      - "T01 | Malicious peer floods or forges provenance | explicit allowlist, per-peer quotas, health score auto-suspend, origin binding in F11.S01.M02"
      - "T02 | Peer key substitution (man in the middle at first contact) | fingerprint confirmation out of band before activation; key pinned; rotation only via statement signed by the old key"
      - "T03 | SSRF through base URL (private IPs, redirects, DNS rebinding) | V01 checked on every connection; no redirects; resolved addresses validated at connect time"
      - "T04 | Equivocating or replaying relay | health -20 per fork, suspension on second fork within 24 h, replay handled by cid dedup"
      - "T05 | Rogue operator adds themselves as peer to harvest public data | peer needs both sides' opt-in; only public P0 owner-opted-in data is ever pushed; audit log of every peer change"
    abuse_controls:
      - "At most 200 peers per tenant; at most 10 proposals per hour."
      - "Quota breach returns FEDERATION_QUOTA_EXCEEDED with retryAfterMs and reduces health by 2 per 10 breaches."
  observability_performance:
    requirements:
      - Peer status counts, health scores and quota use are exported on relays; the PWA keeps the same information in local diagnostics only.
      - resolve_key and quota check add at most 2 ms p95 to inbox handling.
      - Alerts fire on any automatic suspension and on health below 60 for an active peer.
    metrics:
      - "classrup_federation_peers{status}"
      - "classrup_federation_peer_health_score{peer} (gauge, cardinality ≤ 200)"
      - "classrup_federation_peer_quota_rejections_total"
      - "classrup_federation_peer_suspensions_total{reason}"
    logs:
      - "warn federation.peer.suspended {peerId, relayId, reason, correlationId} — no keys beyond did prefix (16 chars)."
    budgets:
      - "resolve_key p95 ≤ 2 ms with an in-memory cache refreshed on change; writes p95 ≤ 300 ms."
      - "Health event processing keeps up with 500 events/s."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Security tests cover SSRF, key substitution, health-based suspension and opt-in on both sides.
      - Contract tests validate commands, statements, events and the Peer record against registry schemas.
    fixtures: "Relays A and B with fixed key seeds, vault V with selected relay A, fake clock 2026-11-04T10:00:00Z, DNS stub returning public and private addresses."
    tests:
      - "T01 | integration | 01.R01,01.R02,04.R02 | A proposes to B; B accepts with fingerprint confirmed | both Peer rows active with both opt-in flags; federation.peer.added emitted"
      - "T02 | unit | 02.R01,02.R03 | each rule V01–V07 violated | documented error code and no Peer created or changed"
      - "T03 | abuse | 02.R01,07.R03 | base URL with private IP, http scheme, redirect and DNS rebinding after creation | FEDERATION_PEER_URL_INVALID on each request"
      - "T04 | abuse | 02.R02,07.R03 | peer presents different key with and without rotation statement | mismatch refused and suspended; valid rotation accepted for 7 day overlap"
      - "T05 | property | 03.R01,03.R02,03.R03 | random command sequences on one Peer | only declared transitions succeed; removed and expired never change; active requires both opt-ins"
      - "T06 | integration | 03.R01,06.R02 | proposal not accepted for 14 days | status expired by sweep"
      - "T07 | integration | 04.R03,07.R01 | 6 invalid-signature rejections, then a fork event | health drops by 25 cap then 20; suspension below 40 and federation.peer.suspended emitted"
      - "T08 | contract | 04.R01,04.R02,09.R03 | each command, query and event | validate against registry schemas; statements validate against classrup.federation.peer_offer/v1 and peer_accept/v1"
      - "T09 | abuse | 05.R01,05.R02,05.R03 | non-operator manages peers on relay; external call to resolve_key; other vault reads relay list | FORBIDDEN or FEDERATION_PEER_NOT_ALLOWED or NOT_FOUND; operator change logged"
      - "T10 | integration | 06.R01,06.R03 | replay propose and accept with same Idempotency-Key; identity fetch ok but delivery fails | original responses replayed; Peer remains proposed"
      - "T11 | chaos | 06.R02,06.R03 | kill process between quota counter update and record acceptance; peer store unavailable | counter and acceptance commit together; DEPENDENCY_UNAVAILABLE fail closed"
      - "T12 | abuse | 07.R01,07.R02 | inspect peer rows, logs and relay chooser UI | no user data in peer rows; chooser states IP and did:key visibility"
      - "T13 | abuse | 07.R03,07.R01 | 11 proposals in an hour; quota breach 10 times | rate limit on the 11th; health reduced by 2 per 10 breaches"
      - "T14 | load | 08.R01,08.R02,08.R03 | 500 health events per second and 10 000 resolve_key calls | resolve_key p95 ≤ 2 ms, gauges exported"
      - "T15 | a11y | 01.R03,03.R02 | operate relay chooser by keyboard and screen reader | fingerprint read in groups, targets ≥ 44 px, status announced"
      - "T16 | unit | 09.R01,09.R02 | traceability tool run and flag-off scenario | every PS-091 requirement maps to a passing test; flag off freezes health and keeps selected relays working"
      - "T17 | integration | 10.R01,10.R02,10.R03 | export peers, import into fresh relay, restore backup | peers import as proposed or suspended and require re-confirmation; no active peer is created by import"
    acceptance:
      - All tests T01–T17 pass in CI.
      - No peer becomes active without both sides' signed opt-in and a recorded fingerprint confirmation.
      - SSRF and key substitution tests pass.
  import_export_backup_rollback:
    requirements:
      - A vault export contains the user's selected relays without secrets; an operator export contains peers with keys and quotas.
      - Imported peers never become active automatically; they import as proposed or suspended and need fresh opt-in confirmation.
      - Schema changes follow expand/contract and v1 stays readable for 180 days.
    export: "Section federation.peers in classrup-export/v1, one line per Peer (schema classrup.federation.peer/v1), without health history."
    import: "Active and suspended peers import as suspended with reason operator until a human reinstates them after re-checking the fingerprint; proposed peers import as proposed."
    backup: "Vault export is the primary backup (IOX-6); relay peers are covered by relay SQLite backup (CTR-IOX-001 IOX-3)."
    migration_rollback: "Additive fields only in v1; rollback is safe because unknown optional fields are ignored and pinned keys are unchanged."
