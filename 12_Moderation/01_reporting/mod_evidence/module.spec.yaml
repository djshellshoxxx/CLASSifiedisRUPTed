id: F12.S01.M02
scope: MVP
summary: >-
  Captures an immutable, hashed snapshot of content as a vault or relay held it at report time, so that
  moderation, appeals and legal holds judge what was actually shown even if the author later edits or
  deletes it. The snapshot embeds the author's signed envelope (CTR-FED-001) and its content id, so it is
  evidence of what the author's key signed and of what this store held; it is not proof of real-world identity
  or of delivery. Bodies are encrypted with per-object keys and hashed with SHA-256, and every read is written
  to an append-only access log. The same code runs in the reporter's vault and on a relay that received a report.
responsibilities:
  - Own the EvidenceSnapshot and EvidenceAccess records in the store that captured them (vault or relay), never synced between stores except inside a report or case bundle.
  - Canonicalize content (RFC 8785 JCS), compute SHA-256, and keep the author's signed envelope bytes with the snapshot; verify hash and author signature on demand and before every export.
  - Encrypt snapshot bodies with a per-snapshot random 256-bit key (XChaCha20-Poly1305) so deletion at retention end is cryptographic shredding.
  - Record every read in an append-only access log (who, why, when) and expose it to the store owner, and to the content author for snapshots of their own content held by a relay.
  - Honour legal holds and retention (RET-EVIDENCE) for snapshot bodies.
non_responsibilities:
  - Deciding whether content violates policy (F12.S02.M01 and F12.S02.M03).
  - Reports and reporter protection (F12.S01.M01).
  - Retention sweeps and legal hold approval (F10.S01.M02); this module reacts to their events.
  - Dispute evidence uploaded by deal parties (F09.S02.M02).
  - "Future: third-party timestamping (RFC 3161) of snapshot hashes; zero-knowledge disclosure of end-to-end messages."
depends_on: [F16.S01.M01, F16.S02.M03, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-PRV-001, CTR-FED-001, CTR-OBS-001]
user_stories:
  - As a moderator of a relay, I open a case and see exactly what the reporter's signed copy looked like, with a verified hash and author-signature badge.
  - As a member whose content was actioned by a relay, I can view the snapshot of my own content that the decision relied on, when I appeal.
  - As a relay operator, I can see who accessed a snapshot and why, and export that log for an audit.
edge_cases:
  - Content is edited right after being reported; the snapshot keeps the earlier signed revision and a later capture of the new revision is a separate record linked by targetId.
  - The target is an end-to-end encrypted message; the reporter's vault holds the plaintext, so the snapshot records it as a reporter disclosure with the sender's signature if the message was signed; without a sender signature it is labelled 'reporter claim' and carries less weight.
  - Snapshot body exceeds 256 KiB or has more than 5 media items; capture truncates nothing and returns PAYLOAD_TOO_LARGE so a report is never filed on partial evidence.
  - Stored body no longer matches its hash (corruption or tampering); verification fails, the snapshot is marked integrity_failed, a local or operator alert fires, and decisions citing it are flagged.
  - Author signature does not verify (forged or altered copy); capture is refused with MODERATION_EVIDENCE_SIGNATURE_INVALID so nobody is accused on an unsigned copy.
  - Legal hold placed on the author's records; retention purge skips the snapshot until the hold is released.
  - Two captures of identical content in the same minute; each gets its own snapshot record that shares contentHash, and the body is stored once.
ux:
  notes: "Headless service with two views: the moderator case screen embeds a snapshot viewer (sanitized text, media thumbnails, hash badge 'verified' or 'integrity failed', author-signature badge, capture time labelled with the store clock), and the subject's appeal screen shows the same viewer without reporter data."
  screens:
    - "Snapshot viewer: read-only rendering of captured content, hash value (first 12 hex characters with copy action), captured-at, target revision, verification status, author-signature status."
    - "Access log table (store owner and relay operator only): accessor pseudonym, purpose, timestamp, export action."
  states: [loading, verified, integrity-failed, purged, forbidden]
  a11y:
    - Hash and signature badges convey status by text and icon, not by color alone.
    - Media thumbnails carry alt text from the captured alt field or the label 'image without description'.
    - Viewer content is reachable by keyboard and announces load result in an aria-live polite region.
processes:
  domain_schema:
    requirements:
      - An EvidenceSnapshot stores target reference, target revision, the author's signed envelope, canonical content, SHA-256 content hash, capture reason, encryption key reference and integrity state, with tenant and revision per CTR-ID-001.
      - Snapshot bodies are P3 and retained under RET-EVIDENCE; each body is encrypted with a per-object key and destroyed by deleting that key at retention end.
      - Snapshots are immutable; only integrity and legal-hold fields change and every change is recorded in the access log.
    entities:
      - name: EvidenceSnapshot
        schema: classrup.moderation.evidencesnapshot/v1
        storage: relay+device
        privacy: P3
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — store scope (vault scope or relay hosting scope)"
          - "targetType: enum — listing | message | profile | review | bid | offer | attachment | cycle_proposal"
          - "targetId: uuidv7 — captured content identity"
          - "targetCid: string — content id (sha256-…) of the author's signed envelope"
          - "targetRevision: int — revision of the target when captured"
          - "authorKey: did:key — signer of the captured envelope"
          - "authorSignatureStatus: enum — valid | invalid | absent_reporter_claim"
          - "captureReason: enum — report | automated_detection | appeal_review | legal_request"
          - "contentHash: string — hex SHA-256 over JCS bytes of the canonical content object, 64 chars"
          - "bodyRef: string — id of encrypted blob; body ≤ 256 KiB canonical JSON"
          - "mediaHashes: string[] — hex SHA-256 of up to 5 media items, each ≤ 2 MiB, copies kept in encrypted blobs"
          - "keyId: uuidv7 — per-object key id; deleting the key shreds body and media"
          - "capturedAt: timestamp — RFC 3339 UTC, the capturing store's clock (a claim for other parties)"
          - "integrity: enum — verified | integrity_failed | purged"
          - "legalHold: boolean — true while an F10.S01.M02 hold covers the owner"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - contentHash equals SHA-256 of the canonical JCS bytes of the decrypted body whenever integrity is verified.
          - Body and media of a snapshot never change after capture; a new capture creates a new record.
          - integrity purged implies the key is destroyed and legalHold is false.
      - name: EvidenceAccess
        schema: classrup.moderation.evidenceaccess/v1
        storage: relay+device
        privacy: P3
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — store scope"
          - "snapshotId: uuidv7 — ref EvidenceSnapshot"
          - "accessorId: string — local principal or relay moderator key"
          - "action: enum — read | verify | export | capture | purge"
          - "purpose: enum — case_review | appeal_review | subject_view | audit | legal_request | system"
          - "caseId?: uuidv7 — case or appeal context when applicable"
          - "occurredAt: timestamp — RFC 3339 UTC, store clock"
        invariants:
          - EvidenceAccess rows are append-only; no update or delete is exposed by any command.
          - Every read of a snapshot body creates exactly one EvidenceAccess row in the same transaction as the read.
    sql: |
      CREATE TABLE moderation_evidence_snapshot (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, target_type TEXT NOT NULL, target_id TEXT NOT NULL,
        target_cid TEXT NOT NULL, target_revision INTEGER NOT NULL, author_key TEXT NOT NULL, content_hash TEXT NOT NULL,
        integrity TEXT NOT NULL, legal_hold INTEGER NOT NULL DEFAULT 0, captured_at TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE INDEX moderation_evidence_target ON moderation_evidence_snapshot(tenant_id, target_type, target_id);
      CREATE INDEX moderation_evidence_author ON moderation_evidence_snapshot(tenant_id, author_key);
      CREATE TABLE moderation_evidence_access (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, snapshot_id TEXT NOT NULL, accessor_id TEXT NOT NULL,
        action TEXT NOT NULL, purpose TEXT NOT NULL, case_id TEXT, occurred_at TEXT NOT NULL);
      CREATE TRIGGER moderation_evidence_access_no_update BEFORE UPDATE ON moderation_evidence_access
        BEGIN SELECT RAISE(ABORT, 'append-only'); END;
  validation_rules:
    requirements:
      - Capture input is validated strictly and the caller must hold the target with a verifiable author signature, except for a labelled reporter claim.
      - Size limits are enforced before any storage so evidence is never truncated.
      - Verification and read requests are validated against the accessor's purpose and case context.
    rules:
      - "V01 | targetType is in the allowed list and targetId is a uuidv7 | VALIDATION_FAILED"
      - "V02 | the store holds the target envelope for targetCid and targetRevision | MODERATION_EVIDENCE_SOURCE_MISSING"
      - "V03 | canonical body is at most 262144 bytes and at most 5 media items of at most 2097152 bytes each | PAYLOAD_TOO_LARGE"
      - "V04 | the author signature over the envelope verifies against authorKey, or the capture is explicitly a labelled reporter claim | MODERATION_EVIDENCE_SIGNATURE_INVALID"
      - "V05 | relay read purpose case_review or appeal_review carries a caseId the moderator is assigned to | FORBIDDEN"
      - "V06 | snapshot integrity is not purged | EXPIRED"
  workflow_state_machine:
    requirements:
      - Snapshot integrity follows the declared lifecycle and any other transition is refused with CONFLICT_STATE.
      - A failed hash verification moves a snapshot to integrity_failed, which is final, and raises an alert to the store owner.
      - Purge happens only when retention has ended and no legal hold applies; purge destroys the key and then the blobs.
    machines:
      - entity: EvidenceSnapshot
        initial: verified
        terminal: [integrity_failed, purged]
        transitions:
          - "verified -> integrity_failed | verification recomputes a different hash or the AEAD tag fails | alert metric or vault notice; decisions citing it flagged"
          - "verified -> purged | retention sweep after RET-EVIDENCE end with legalHold false | key destroyed, blobs deleted, access rows kept as stubs"
    timeouts:
      - "Integrity re-verification sweep verifies 1% of snapshots per day (full coverage every 100 days) plus every snapshot before export; relay sweep runs at 03:30 UTC and the vault sweep runs on idle after app start."
  commands_queries_events:
    requirements:
      - Capture and verify are vault or relay local commands that produce no signed statement; snapshots travel inside signed report or case bundles only.
      - Capture emits moderation.evidence.captured in the same transaction as the snapshot and its access row.
      - The module consumes legal hold and retention events to protect or destroy snapshots.
    commands:
      - name: moderation.evidence.capture
        mode: "vault-local or relay-local (same code in both stores); produces no statement"
        capability: moderation.evidence.capture
        input: "{ targetType, targetId, targetRevision?, captureReason, caseId?, reporterClaim?: boolean }"
        output: "{ snapshotId, contentHash, authorSignatureStatus, capturedAt, revision: 1 }"
        errors: [VALIDATION_FAILED, MODERATION_EVIDENCE_SOURCE_MISSING, MODERATION_EVIDENCE_SIGNATURE_INVALID, PAYLOAD_TOO_LARGE, FORBIDDEN]
        emits: [moderation.evidence.captured]
        idempotent: true
      - name: moderation.evidence.verify
        mode: "vault-local or relay-local"
        capability: moderation.evidence.verify
        input: "{ snapshotId }"
        output: "{ snapshotId, integrity, recomputedHash, authorSignatureStatus }"
        errors: [NOT_FOUND, EXPIRED]
        emits: []
        idempotent: true
    queries:
      - name: moderation.evidence.read
        capability: moderation.evidence.read_as_reviewer
        input: "{ snapshotId, caseId }"
        output: "{ snapshot: { id, targetType, targetId, targetRevision, content, mediaRefs[], contentHash, authorSignatureStatus, capturedAt, integrity } }"
        errors: [NOT_FOUND, FORBIDDEN, EXPIRED]
      - name: moderation.evidence.read_own
        capability: moderation.evidence.read_as_subject
        input: "{ snapshotId, appealId }"
        output: "{ snapshot: same as read, reporter data omitted }"
        errors: [NOT_FOUND, EXPIRED]
      - name: moderation.evidence.list_access
        capability: moderation.evidence.read_access_log
        input: "{ snapshotId, cursor?, limit ≤ 100 }"
        output: "{ items: EvidenceAccess[], nextCursor? }"
        errors: [NOT_FOUND]
    events_produced:
      - {type: moderation.evidence.captured, privacy: P3, payload: "{ snapshotId, targetType, targetId, targetCid, targetRevision, contentHash, captureReason }"}
    events_consumed:
      - {type: privacy.legal_hold.placed, effect: "set legalHold=true on snapshots of the held author and skip them in purge sweeps"}
      - {type: privacy.legal_hold.released, effect: "set legalHold=false so the next retention sweep may purge expired snapshots"}
      - {type: privacy.retention.purged, effect: "purge snapshots whose RET-EVIDENCE period ended for the purged scope, destroying their keys"}
    errors:
      - "MODERATION_EVIDENCE_SOURCE_MISSING | 409 | no | the store does not hold the target envelope or the requested revision"
      - "MODERATION_EVIDENCE_SIGNATURE_INVALID | 422 | no | author signature over the captured envelope does not verify"
    example: |
      vault command moderation.evidence.capture (local, Idempotency-Key 0192f3b0-0000-7000-8000-000000000b01)
      { "targetType": "listing", "targetId": "0192f3a4-5b6c-7d8e-9f01-23456789abcd", "targetRevision": 3, "captureReason": "report" }
      -> { "snapshotId": "0192f3b0-2222-7000-8000-000000000002", "contentHash": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", "authorSignatureStatus": "valid", "capturedAt": "2026-11-04T10:00:00.120Z", "revision": 1 }
  authorization_capabilities:
    requirements:
      - "Vault policy: only the unlocked local principal captures, verifies and reads snapshots in its vault, and the author-signature check is part of capture."
      - "Relay policy: relay moderators read relay-held snapshots only for an assigned case or appeal, operators read the access log, and content authors read snapshots of their own content tied to an appeal."
      - Every read, verify, export and purge writes an access row and a refused read writes none.
    capabilities:
      - "moderation.evidence.capture | local principal, moderator | vault unlocked, or relay moderator on an assigned case; target envelope held; author signature check applied"
      - "moderation.evidence.verify | local principal, moderator, operator | any snapshot in the store the actor controls"
      - "moderation.evidence.read_as_reviewer | moderator | relay: assigned to the case or appeal referencing the snapshot; vault: local principal; access row written"
      - "moderation.evidence.read_as_subject | member | snapshot.authorKey = actor and an appeal exists on that relay for the decision citing the snapshot"
      - "moderation.evidence.read_access_log | operator, member | operator any snapshot on the relay; vault owner for own vault; authors only for snapshots of their own content"
  failure_recovery_idempotency:
    requirements:
      - Capture is idempotent per CTR-IDM-001 and reuses the stored blob when the contentHash already exists in the store.
      - Capture, blob write, key creation, access row and outbox event commit in one transaction or not at all.
      - Purge is two-step and crash-safe, recording key destruction before blob deletion, and the sweep resumes after a crash or tab close.
    idempotency: "Local Idempotency-Key required on capture; replay within 24 h returns the stored response; verify is naturally idempotent."
    concurrency: "Blob dedup uses a unique (tenant_id, content_hash) blob row; concurrent captures of identical content create separate snapshot rows referencing one blob; purge and read serialize on snapshot revision (IndexedDB readwrite transaction in the vault, BEGIN IMMEDIATE on the relay)."
    retries: "Callers retry DEPENDENCY_UNAVAILABLE from the blob store with CTR-IDM-001 backoff; MODERATION_EVIDENCE_SOURCE_MISSING, signature and size errors are not retried."
    offline: "Capture works fully offline in the vault because it only needs locally held signed envelopes; a relay copy exists only after the report statement is delivered."
    partial_failure: "If the blob write fails, the transaction aborts and the caller receives DEPENDENCY_UNAVAILABLE; no orphan snapshot rows exist; orphan blobs older than 24 h without a row are removed by the sweep."
  privacy_retention_abuse:
    requirements:
      - Snapshot bodies and media are P3, encrypted per object, and leave a store only inside a sealed report or case bundle addressed to a relay moderation key, or in the owner's own export.
      - Retention is RET-EVIDENCE with legal-hold override, and destruction is cryptographic shredding by key deletion; copies already sent to a relay or fetched by others cannot be recalled and the UI says so.
      - Every access is logged and neither moderators nor vault apps expose a way to edit or delete access rows.
    data:
      - "EvidenceSnapshot: P3 (vault owner; moderators of the relay that received it for the case; author for appeal view)."
      - "EvidenceAccess: P3 (store owner and relay operators)."
      - "Per-object keys: P4, wrapped by the vault key (vault) or the relay data key from F16.S01.M02 (relay)."
    retention:
      - "Snapshots: RET-EVIDENCE (2 years after last related activity) unless a legal hold applies."
      - "Access rows: RET-EVIDENCE; after purge they are reduced to stubs without content references for 180 days."
    threats:
      - "T01 | Relay moderator browses snapshots out of curiosity | relay read requires assigned case; each read logged; operator weekly access report; more than 50 reads per moderator per day alerts"
      - "T02 | Tampering with stored evidence to justify a decision | content hash plus per-object AEAD tag; author signature over the original envelope; sweep verification; decisions store the hash they relied on"
      - "T03 | Forged evidence fabricated by a reporter | capture requires a valid author signature over the envelope; unsigned captures are labelled reporter claim and cannot alone support removal"
      - "T04 | Snapshot used to leak third-party private data | body limited to what the target's privacy class exposes to the reporter; P3 fields of others are never captured"
      - "T05 | Stolen device or relay disk exposes evidence | bodies encrypted with per-object keys wrapped by the vault key or relay data key; key rotation in F16.S02.M01"
    abuse_controls:
      - "Capture is rate limited by F12.S03.M03 at 60 per hour per key on a relay; relay evidence quota 5 GiB per tenant with operator alert at 80%; vault warns at 500 MiB of evidence."
      - "Dedup of identical bodies limits storage growth from repeated reports."
  observability_performance:
    requirements:
      - Relay capture, verify and read durations and outcomes are measured per CTR-OBS-001 without content in logs, and the vault keeps only local diagnostics (OBS-7).
      - Capture meets p95 ≤ 300 ms on a relay and ≤ 150 ms in a vault for bodies up to 256 KiB, with media copied asynchronously within 30 s.
      - Integrity failures and unusual access volume are alerting metrics on the relay and local notices in the vault.
    metrics:
      - "classrup_moderation_evidence_captures_total{outcome=ok|too_large|signature_invalid|missing} (relay)"
      - "classrup_moderation_evidence_integrity_failures_total (relay)"
      - "classrup_moderation_evidence_reads_total{purpose} (relay)"
      - "classrup_moderation_evidence_bytes (relay gauge per tenant)"
    logs:
      - "relay info evidence.captured {snapshotId, targetType, bytes, correlationId} — no content."
      - "relay error evidence.integrity_failed {snapshotId, correlationId}; vault writes the same to local diagnostics."
    budgets:
      - "relay capture p95 ≤ 300 ms and vault capture p95 ≤ 150 ms for ≤ 256 KiB; read p95 ≤ 150 ms; verify of one snapshot ≤ 50 ms."
      - "Sweep verifies 10 000 snapshots in ≤ 120 s on a relay."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Hash stability, canonicalization and signature checks are covered by property tests with known vectors.
      - Access logging and non-disclosure are covered by abuse tests.
    fixtures: "Vault of reporter R and relay X, author S with signed listing L (cid sha256-aa…, revision 3), moderators M1 and M2 assigned to case C, fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,02.R01 | capture signed listing revision 3 in a vault | snapshot stored with canonical body, SHA-256 equal to independent recomputation, signature status valid"
      - "T02 | property | 01.R03,03.R01 | random content objects with key order permuted | contentHash identical; mutated body fails verification"
      - "T03 | unit | 02.R02,02.R03 | each rule V02–V06 violated in turn | documented error code and no row stored; forged author signature refused"
      - "T04 | integration | 01.R02,03.R03,04.R03 | retention end with and without legal hold | key destroyed and blobs deleted only without hold"
      - "T05 | integration | 03.R02 | corrupt stored blob byte then verify | integrity_failed, alert raised, status final"
      - "T06 | contract | 04.R01,04.R02,09.R02 | each command and query | outputs and captured event validate against registry schemas; no statement is produced by capture"
      - "T07 | abuse | 05.R01,05.R02,07.R03 | member without case reads relay snapshot; unassigned moderator reads; assigned moderator reads | FORBIDDEN, FORBIDDEN, success with exactly one access row; refused reads write none"
      - "T08 | abuse | 05.R03,07.R01 | author reads access log of own snapshot and another's; attempt to UPDATE or DELETE an access row | own allowed, other NOT_FOUND; mutation aborts"
      - "T09 | integration | 06.R01 | same Idempotency-Key replayed; two captures of identical content | original response replayed; one blob and two snapshot rows"
      - "T10 | chaos | 06.R02,06.R03 | blob store fails mid-capture; tab closed between key destruction and blob deletion | no orphan row; purge resumes and completes"
      - "T11 | abuse | 07.R02 | author deletes own record after report | snapshot retained until RET-EVIDENCE end; UI states that copies cannot be recalled"
      - "T12 | load | 08.R01,08.R02,08.R03 | 50 captures per second for 5 minutes on a relay with 256 KiB bodies; vault capture on Moto G profile | relay p95 ≤ 300 ms, vault p95 ≤ 150 ms, metrics exported, sweep of 10 000 snapshots ≤ 120 s"
      - "T13 | unit | 09.R01,09.R03 | traceability tool run | every PS-093 requirement maps to a passing test"
      - "T14 | integration | 10.R01,10.R02,10.R03 | export evidence bundle for a case, import into fresh store, restore backup | hashes verify after round trip; import without keys marks bodies unreadable"
    acceptance:
      - All tests T01–T14 pass in CI.
      - Every read of a snapshot body produces exactly one access row (property and abuse tests).
      - A modified snapshot body, media or author signature is always detected by verification.
  import_export_backup_rollback:
    requirements:
      - Evidence export is limited to the owner's own vault export, case bundles sent to a relay moderation key, and legal-hold exports approved under F10.S01.M02.
      - Import verifies every content hash and author signature and refuses bodies whose hash does not match.
      - Schema changes follow expand/contract and keep v1 readable for 180 days.
    export: "Section moderation.evidence in classrup-export/v1: snapshot metadata, decrypted body and media (it is the owner's own data), access log rows; relay case bundles are sealed to the moderation key."
    import: "Bundles import as read-only evidence; each body hash and author signature is recomputed; mismatches are rejected with VALIDATION_FAILED; keys are re-wrapped under the target store key."
    backup: "Vault export is the primary backup (IOX-6); relay SQLite and blob backups (CTR-IOX-001 IOX-3) hold only evidence received in reports; restore re-runs the integrity sweep."
    migration_rollback: "Additive fields only in v1; rollback is safe because older readers ignore new optional fields; relay migrations re-create the access log trigger on down scripts."
