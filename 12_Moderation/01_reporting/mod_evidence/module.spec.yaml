id: F12.S01.M02
scope: MVP
summary: >-
  Captures an immutable, hashed snapshot of content as a vault or relay held it at report time, so that
  moderation, appeals and legal holds judge what was actually shown even if the author later edits or
  deletes it. The snapshot embeds the author's signed envelope (CTR-FED-001) and its content id, so it is
  evidence of what the author's key signed and of what this store held; it is not proof of real-world identity
  or of delivery. Public content is captured in full; private (P2) content such as an end-to-end message is
  captured as metadata only unless the reporter approves a redacted participant disclosure. Bodies and copied
  private media are stored as encrypted evidence blobs with their own keys and reference counts, public media is
  referenced by content address, and every read is written to an append-only access log. The same code runs in
  the reporter's vault and on a relay that received a report.
responsibilities:
  - Own the EvidenceSnapshot and EvidenceAccess records in the store that captured them (vault or relay), never synced between stores except inside a report or case bundle.
  - Canonicalize content (RFC 8785 JCS), compute SHA-256, and keep the author's signed envelope bytes with the snapshot; verify hash and author signature on demand and before every export.
  - Store bodies and copied P2 media in encrypted evidence blobs (XChaCha20-Poly1305, one random 256-bit key per blob) with reference counts, so purge is cryptographic shredding once no active snapshot references a blob; reference P0 media by blob:sha256 (N9).
  - Produce the metadata-only capture for P2 targets and the redacted participant-disclosure preview (rules redact/1) that the reporter must approve before plaintext leaves the vault.
  - Record every read in an append-only access log (who, why, when) and expose it to the store owner and operators, and a redacted view to the content author.
  - Honour relay legal holds (re-checked through privacy.legal_hold.check) and retention (RET-EVIDENCE) through the RetentionPurgePort registered with F10.S01.M02.
non_responsibilities:
  - Deciding whether content violates policy (F12.S02.M01 and F12.S02.M03).
  - Reports, report statements and reporter protection (F12.S01.M01).
  - Retention sweeps and legal hold approval (F10.S01.M02); this module registers its purge port and re-checks holds.
  - Public media storage and metadata stripping (F15.S02.M03 MediaBlob, F10.S02.M03).
  - Dispute evidence uploaded by deal parties (F09.S02.M02).
  - "Future: third-party timestamping (RFC 3161) of snapshot hashes; zero-knowledge disclosure of end-to-end messages."
depends_on: [F15.S02.M03, F16.S01.M01, F16.S02.M03, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-PRV-001, CTR-FED-001, CTR-OBS-001]
user_stories:
  - As a moderator of a relay, I open a case and see exactly what the reporter's signed copy looked like, with a hash badge and author-signature badge.
  - As a member whose content was actioned by a relay, I can view the snapshot of my own content that the decision relied on, when I appeal.
  - As a relay operator, I can see who accessed a snapshot and why, and export that log for an audit.
  - As a member reporting a private message, I see a redacted preview of exactly what would be disclosed and decide whether to send it.
edge_cases:
  - Content is edited right after being reported; the snapshot keeps the earlier signed revision and a later capture of the new revision is a separate record linked by targetId.
  - The target is an end-to-end encrypted message; by default the snapshot holds only metadata (content id, sender key, sender signature); a disclosure of the plaintext needs an approved redacted preview, and an unsigned message can only be a labelled 'reporter claim' that carries less weight.
  - A reported message disclosure removed nothing in its redact/1 preview; the snapshot keeps the message key K with the disclosed text, and verification recomputes the signed key commitment and decrypts the signed ciphertext to the same text; a K that fails either check is refused with MODERATION_EVIDENCE_COMMITMENT_MISMATCH.
  - A listing has 10 photos of 5 MiB each; its public photos are referenced by blob:sha256 without copying, so the listing stays reportable.
  - Snapshot body exceeds 256 KiB or has more than 10 media items; capture truncates nothing and returns PAYLOAD_TOO_LARGE so a report is never filed on partial evidence.
  - Stored body no longer matches its hash (corruption or tampering); verification fails, the integrity flag becomes failed, a local or operator alert fires, decisions citing it are flagged, and the snapshot is still shredded at retention end.
  - Author signature does not verify (forged or altered copy); capture is refused with MODERATION_EVIDENCE_SIGNATURE_INVALID so nobody is accused on an unsigned copy.
  - Legal hold placed on the author's records on a relay; the purge port skips the snapshot until privacy.legal_hold.check reports no hold.
  - Two captures of identical content; each gets its own snapshot record and both reference one evidence blob whose reference count is 2.
ux:
  notes: "Headless service with three views: the moderator case screen embeds a snapshot viewer (sanitized text, media thumbnails, hash badge 'hash matches' or 'integrity failed', author-signature badge, disclosure label, capture time labelled with the store clock), the subject's appeal screen shows the same viewer without reporter data, and the reporter's disclosure preview shows the redacted copy before approval."
  screens:
    - "Snapshot viewer: read-only rendering of captured content, hash value (first 12 hex characters with copy action), captured-at, target revision, integrity status, author-signature status, disclosure label (public, metadata only, participant disclosure, reporter claim)."
    - "Disclosure preview (reporter vault): redacted copy with each redaction highlighted and counted by rule, 'Approve and send this copy' and 'Send metadata only' buttons, and the note that the person may infer who reported."
    - "Access log table (store owner and relay operator): accessor pseudonym, role, purpose, timestamp, export action; the content author sees purpose, role and time only."
  states: [loading, hash-matches, integrity-failed, purged, forbidden, metadata-only, disclosure-preview]
  a11y:
    - Hash, signature and disclosure badges convey status by text and icon, not by color alone.
    - Media thumbnails carry alt text from the captured alt field or the label 'image without description'.
    - Viewer and preview content are reachable by keyboard and announce load result and redaction count in an aria-live polite region.
processes:
  domain_schema:
    requirements:
      - An EvidenceSnapshot stores target reference, target revision, the author's signed envelope, canonical content, SHA-256 content hash, capture reason, disclosure mode, blob references and integrity state, with tenant and revision per CTR-ID-001.
      - Snapshot bodies are P2 between the store owner and the moderators of the relay that received them and retained under RET-EVIDENCE; each body and copied media item lives in an encrypted evidence blob with its own key, destroyed by deleting that key once no active snapshot references the blob.
      - Snapshots are immutable; only the integrity flag, lifecycle and legal-hold fields change and every change is recorded in the access log.
      - Evidence blobs are declared in this module's store (EvidenceBlob rows with blob id, SHA-256, size, key id and reference count) and P0 media is referenced by blob:sha256 from F15.S02.M03 MediaBlob (N9) instead of being copied.
      - "A message snapshot records the F08.S01.M01 messageCid as targetCid and the sender-signed envelope without wrapped keys (nonce, ciphertext, key commitment, signature) as its metadata, and keeps the message key K inside its encrypted body only for an approved participant disclosure whose redact/1 preview removed nothing, with commitmentStatus verified once K has been checked."
    entities:
      - name: EvidenceSnapshot
        schema: classrup.moderation.evidencesnapshot/v1
        storage: relay+device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — store scope (vault scope or relay hosting scope)"
          - "targetType: enum — listing | auction | message | profile | review | bid | offer | attachment | cycle_proposal"
          - "targetId: uuidv7 — captured content identity"
          - "targetCid: string — content id (sha256-…) of the author's signed envelope; for targetType message the F08.S01.M01 messageCid"
          - "targetRevision: int — revision of the target when captured"
          - "authorKey: did:key — signer of the captured envelope"
          - "authorSignatureStatus: enum — valid | invalid | absent_reporter_claim"
          - "captureReason: enum — report | automated_detection | appeal_review | legal_request"
          - "disclosure: enum — public_target | metadata_only | participant_disclosure | reporter_claim"
          - "disclosureState?: enum — previewed | export_prepared (P2 targets only)"
          - "redactionRulesVersion?: string — redact/1 when a disclosure preview ran"
          - "redactions?: object[] — { rule, count } applied by the preview"
          - "messageKey?: bytes — 32-byte per-message key K of F08.S01.M01, only for targetType message with disclosure participant_disclosure and every redaction count 0; stored inside the encrypted body blob, never in an event, log, index or access row"
          - "commitmentStatus?: enum — verified | not_checkable (message snapshots: verified when K recomputes the signed key commitment and decrypts the signed ciphertext to exactly the disclosed plaintext; not_checkable for metadata_only, reporter_claim and redacted disclosures)"
          - "contentHash: string — hex SHA-256 over JCS bytes of the stored canonical object (full body, metadata object or redacted disclosure), 64 chars"
          - "bodyBlobId: uuidv7 — EvidenceBlob holding the encrypted canonical object, ≤ 256 KiB"
          - "mediaRefs: object[] — up to 10 { ref: blob:sha256-… of a P0 MediaBlob (F15.S02.M03) or evidenceBlobId of a copied P2 item, sha256, bytes ≤ 5 MiB, alt? }"
          - "capturedAt: timestamp — RFC 3339 UTC, the capturing store's clock (a claim for other parties)"
          - "integrity: enum — verified | failed"
          - "lifecycle: enum — active | purged"
          - "legalHold: boolean — relay-only cache of privacy.legal_hold.check for authorKey and targetCid; always false in a vault"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - contentHash equals SHA-256 of the canonical JCS bytes of the decrypted body whenever integrity is verified and lifecycle is active.
          - Body and media of a snapshot never change after capture; a new capture creates a new record.
          - lifecycle purged implies the snapshot holds no blob references and legalHold is false; an EvidenceBlob key is destroyed only when the blob's reference count is 0, so a snapshot under hold keeps its blob readable.
          - disclosure participant_disclosure implies disclosureState export_prepared; a P2 target is never stored with disclosure public_target.
          - messageKey is present only when targetType is message, disclosure is participant_disclosure, every redaction count is 0 and commitmentStatus is verified.
      - name: EvidenceAccess
        schema: classrup.moderation.evidenceaccess/v1
        storage: relay+device
        privacy: P2
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — store scope"
          - "snapshotId: uuidv7 — ref EvidenceSnapshot"
          - "accessorId: string — local principal or relay moderator key; redacted in the content author's view"
          - "accessorRole: enum — local_principal | reporter | moderator | operator | subject | system"
          - "action: enum — read | verify | export | capture | purge"
          - "purpose: enum — case_review | appeal_review | subject_view | audit | legal_request | system"
          - "caseId?: uuidv7 — case or appeal context when applicable"
          - "occurredAt: timestamp — RFC 3339 UTC, store clock"
        invariants:
          - EvidenceAccess rows are append-only; no update or delete is exposed by any command.
          - Every read, verify, export and purge of a snapshot creates exactly one EvidenceAccess row in the same transaction.
    note: "EvidenceBlob (store-local table, not a catalog entity): id uuidv7, tenantId, sha256 of the plaintext, bytes, keyId of the per-blob key wrapped by the vault key or the relay data key (F16.S01.M02), refCount ≥ 0, createdAt. A blob is shared only between snapshots of identical bytes in the same store; P0 public media is never copied here."
    sql: |
      CREATE TABLE moderation_evidence_snapshot (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, target_type TEXT NOT NULL, target_id TEXT NOT NULL,
        target_cid TEXT NOT NULL, target_revision INTEGER NOT NULL, author_key TEXT NOT NULL, content_hash TEXT NOT NULL,
        disclosure TEXT NOT NULL, integrity TEXT NOT NULL, lifecycle TEXT NOT NULL, legal_hold INTEGER NOT NULL DEFAULT 0,
        captured_at TEXT NOT NULL, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE INDEX moderation_evidence_target ON moderation_evidence_snapshot(tenant_id, target_type, target_id);
      CREATE INDEX moderation_evidence_author ON moderation_evidence_snapshot(tenant_id, author_key);
      CREATE TABLE moderation_evidence_blob (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, sha256 TEXT NOT NULL, bytes INTEGER NOT NULL, key_id TEXT,
        ref_count INTEGER NOT NULL CHECK (ref_count >= 0), created_at TEXT NOT NULL);
      CREATE UNIQUE INDEX moderation_evidence_blob_hash ON moderation_evidence_blob(tenant_id, sha256);
      CREATE TABLE moderation_evidence_access (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, snapshot_id TEXT NOT NULL, accessor_id TEXT NOT NULL,
        accessor_role TEXT NOT NULL, action TEXT NOT NULL, purpose TEXT NOT NULL, case_id TEXT, occurred_at TEXT NOT NULL);
      CREATE TRIGGER moderation_evidence_access_no_update BEFORE UPDATE ON moderation_evidence_access
        BEGIN SELECT RAISE(ABORT, 'append-only'); END;
  validation_rules:
    requirements:
      - Capture input is validated strictly and the caller must hold the target with a verifiable author signature, except for a labelled reporter claim on an unsigned message.
      - Size limits are enforced before any storage so evidence is never truncated, and they are at least the listing limits (10 media items of 5 MiB each).
      - Verification and read requests are validated against the accessor's purpose and case context.
      - A P2 target is captured metadata_only unless the reporter runs the disclosure preview, whose rules redact/1 remove L3/L4 location shares, geohash cells longer than 5 characters, email addresses, phone numbers and attachments before approval.
      - A message key K is accepted only for an unredacted message disclosure and only when HMAC-SHA256(K, 'classrup.comms.msg.commit.v1' || messageId) equals the signed key commitment and the XChaCha20-Poly1305 decryption of the signed ciphertext (additional data thread ID, message ID, sender device ID), unpadded, equals the disclosed plaintext; a redacted disclosure never carries K because K and the ciphertext would reveal what was redacted.
    rules:
      - "V01 | targetType is in the allowed list and targetId is a uuidv7 | VALIDATION_FAILED"
      - "V02 | the store holds the target envelope for targetCid and targetRevision | MODERATION_EVIDENCE_SOURCE_MISSING"
      - "V03 | canonical body is at most 262144 bytes and media are at most 10 items of at most 5242880 bytes each; P0 media are referenced by blob:sha256 and only P2 media are copied | PAYLOAD_TOO_LARGE"
      - "V04 | the author signature over the envelope verifies against authorKey, or the capture is an explicitly labelled reporter claim on targetType message | MODERATION_EVIDENCE_SIGNATURE_INVALID"
      - "V05 | relay read purpose case_review or appeal_review carries a caseId the moderator is assigned to | FORBIDDEN"
      - "V06 | snapshot lifecycle is not purged | EXPIRED"
      - "V07 | approve_disclosure carries the digest of the latest preview of this snapshot and redact/1 completed on it | PRECONDITION_FAILED"
      - "V08 | a P2 target (message, offer, cycle_proposal) is stored with disclosure metadata_only or reporter_claim unless a disclosure reached export_prepared | VALIDATION_FAILED"
      - "V09 | a messageKey (approve_disclosure in the vault, ingest_bundle on the relay) comes with an unredacted message disclosure, recomputes the signed key commitment and decrypts the signed ciphertext to exactly the disclosed plaintext | MODERATION_EVIDENCE_COMMITMENT_MISMATCH"
    notes: "Rules redact/1 (deterministic, versioned): location share objects of level L3 or L4 are removed; geohash strings longer than 5 characters are truncated to 5; email addresses (local@domain.tld) become '[email]'; phone numbers (7 or more digits with optional +, spaces, dots or dashes) become '[phone]'; attachments are dropped and replaced by '[attachment n of m]'. Each rule reports its count in redactions."
  workflow_state_machine:
    requirements:
      - Snapshot lifecycle, integrity and disclosure follow the declared machines and any other transition is refused with CONFLICT_STATE.
      - A failed hash verification sets integrity to failed, which never returns to verified, raises an alert to the store owner, and does not exempt the snapshot from retention-end purge.
      - Purge happens only when retention has ended and no legal hold applies; it removes the snapshot's blob references and destroys a blob's key, then the blob, only when no remaining snapshot references it.
      - Disclosure of a P2 target moves from metadata_only through a local redacted preview to export prepared only by an explicit reporter approval of that exact preview.
    machines:
      - entity: EvidenceSnapshot
        initial: active
        terminal: [purged]
        transitions:
          - "active -> purged | RetentionPurgePort.purge from the F10.S01.M02 sweep after RET-EVIDENCE end, with privacy.legal_hold.check false for authorKey and targetCid (relay) | blob references removed; key destroyed then blob deleted for every blob whose refCount reaches 0; access rows reduced to stubs; applies whatever the integrity flag"
          - "active -> purged | DeletionPort for the owner's own deletion with keepEvidence false (vault only) | same shredding rules; snapshots of other authors' content kept as evidence are pseudonymized instead"
      - entity: EvidenceIntegrity
        initial: verified
        terminal: [failed]
        transitions:
          - "verified -> failed | verification recomputes a different hash or an AEAD tag fails | alert metric or vault notice; decisions citing it flagged; lifecycle unchanged"
      - entity: EvidenceDisclosure
        initial: metadata_only
        terminal: [export_prepared]
        transitions:
          - "metadata_only -> previewed | moderation.evidence.prepare_disclosure by the reporter | redact/1 preview built locally with redaction counts and a preview digest; nothing leaves the vault"
          - "previewed -> previewed | prepare_disclosure again with extra manual redactions | new preview digest replaces the old one"
          - "previewed -> metadata_only | reporter discards the preview or 24 h pass | preview bytes deleted"
          - "previewed -> export_prepared | moderation.evidence.approve_disclosure with the latest preview digest | disclosed bytes fixed; disclosure participant_disclosure; ready to seal for the relay"
    note: "Public targets start and stay public_target and reporter claims stay reporter_claim; only P2 targets use the disclosure machine."
    timeouts:
      - "Integrity re-verification sweep verifies 1% of active snapshots per day (full coverage every 100 days) plus every snapshot before export; relay sweep runs at 03:30 UTC and the vault sweep runs on idle after app start."
      - "Disclosure previews not approved within 24 h are discarded."
  commands_queries_events:
    requirements:
      - Capture and verify are vault or relay local commands that produce no signed statement; snapshots travel inside signed report or case bundles only.
      - Capture emits moderation.evidence.captured in the same transaction as the snapshot and its access row.
      - The module re-checks legal holds through privacy.legal_hold.check when hold events arrive and before every purge, consumes privacy.deletion.completed, and is purged only through the RetentionPurgePort it registers with F10.S01.M02, never by a purge-completed event.
      - Relay intake of a report or appeal bundle stores the evidence it carries as relay snapshots after re-verifying hashes and author signatures, and resolves referenced P0 media by blob:sha256.
    commands:
      - name: moderation.evidence.capture
        mode: "vault-local or relay-local (same code in both stores); produces no statement"
        capability: moderation.evidence.capture
        input: "{ targetType, targetId, targetRevision?, captureReason, caseId?, reporterClaim?: boolean }"
        output: "{ snapshotId, contentHash, authorSignatureStatus, disclosure, capturedAt, revision: 1 }"
        errors: [VALIDATION_FAILED, MODERATION_EVIDENCE_SOURCE_MISSING, MODERATION_EVIDENCE_SIGNATURE_INVALID, PAYLOAD_TOO_LARGE, FORBIDDEN]
        emits: [moderation.evidence.captured]
        idempotent: true
      - name: moderation.evidence.ingest_bundle
        mode: "relay-local, in-process from moderation.report.receive (F12.S01.M01) and moderation.appeal.receive (F12.S01.M03); produces no statement"
        capability: moderation.evidence.ingest_bundle
        input: "{ sourceRef: reportId | appealId, snapshot: { canonicalObject, authorEnvelope, disclosure, mediaRefs[], messageKey? } }"
        output: "{ snapshotId, contentHash, integrity, commitmentStatus?, missingMedia[] }"
        errors: [VALIDATION_FAILED, MODERATION_EVIDENCE_SIGNATURE_INVALID, MODERATION_EVIDENCE_COMMITMENT_MISMATCH, PAYLOAD_TOO_LARGE, DEPENDENCY_UNAVAILABLE]
        emits: [moderation.evidence.captured]
        idempotent: true
      - name: moderation.evidence.verify
        mode: "vault-local or relay-local"
        capability: moderation.evidence.verify
        input: "{ snapshotId }"
        output: "{ snapshotId, integrity, recomputedHash, authorSignatureStatus }"
        errors: [NOT_FOUND, EXPIRED]
        emits: []
        idempotent: true
      - name: moderation.evidence.prepare_disclosure
        mode: "vault-local; builds the redacted preview, nothing leaves the vault"
        capability: moderation.evidence.disclose
        input: "{ snapshotId, manualRedactions?: string[] }"
        output: "{ snapshotId, previewDigest, redactedObject, redactions: { rule, count }[], rulesVersion: redact/1 }"
        errors: [NOT_FOUND, CONFLICT_STATE, VALIDATION_FAILED]
        emits: []
        idempotent: true
      - name: moderation.evidence.approve_disclosure
        mode: "vault-local; reaches export prepared for the approved preview"
        capability: moderation.evidence.disclose
        input: "{ snapshotId, previewDigest, messageKey? (K read from F08.S01.M01 by the F12.S01.M01 report sheet, only when the preview removed nothing) }"
        output: "{ snapshotId, disclosure: participant_disclosure, contentHash, messageKeyEligible: boolean, commitmentStatus? }"
        errors: [NOT_FOUND, CONFLICT_STATE, PRECONDITION_FAILED, MODERATION_EVIDENCE_COMMITMENT_MISMATCH]
        emits: []
        idempotent: true
    queries:
      - name: moderation.evidence.read
        capability: moderation.evidence.read_as_reviewer
        input: "{ snapshotId, caseId }"
        output: "{ snapshot: { id, targetType, targetId, targetRevision, content, mediaRefs[], contentHash, authorSignatureStatus, disclosure, capturedAt, integrity } }"
        errors: [NOT_FOUND, FORBIDDEN, EXPIRED]
      - name: moderation.evidence.read_own
        capability: moderation.evidence.read_as_subject
        input: "{ snapshotId, appealId }"
        output: "{ snapshot: same as read, reporter data omitted }"
        errors: [NOT_FOUND, EXPIRED]
      - name: moderation.evidence.list_access
        capability: moderation.evidence.read_access_log
        input: "{ snapshotId, cursor?, limit ≤ 100 }"
        output: "{ items: EvidenceAccess[] for operators and the store owner; for the content author only { purpose, accessorRole, occurredAt } with accessorId redacted and rows of accessorRole reporter excluded, nextCursor? }"
        errors: [NOT_FOUND]
    events_produced:
      - {type: moderation.evidence.captured, privacy: P2, payload: "{ snapshotId, targetType, targetId, targetCid, targetRevision, contentHash, captureReason, disclosure }"}
    events_consumed:
      - {type: privacy.legal_hold.placed, effect: "relay only: the payload names no subject, so call privacy.legal_hold.check for authorKey (kind author) and targetCid (kind record) of active snapshots and set legalHold on the held ones; purge re-checks regardless of the flag"}
      - {type: privacy.legal_hold.released, effect: "relay only: re-check privacy.legal_hold.check for snapshots with legalHold true and clear the flag where no hold remains, so the next RetentionPurgePort run may purge them"}
      - {type: privacy.deletion.completed, effect: "vault: purge snapshots and blobs captured by the deleted principal unless the request kept evidence, in which case accessorId and the capturing principal are replaced by the payload pseudonym; authorKey of other people's content is unchanged"}
    errors:
      - "MODERATION_EVIDENCE_SOURCE_MISSING | 409 | no | the store does not hold the target envelope or the requested revision"
      - "MODERATION_EVIDENCE_SIGNATURE_INVALID | 422 | no | author signature over the captured envelope does not verify"
      - "MODERATION_EVIDENCE_COMMITMENT_MISMATCH | 422 | no | the message key does not match the signed key commitment or does not decrypt the signed ciphertext to the disclosed plaintext, or came with a redacted disclosure"
    note: >-
      No signed statements are produced here (N2); snapshots travel inside classrup.moderation.report/v1 (F12.S01.M01) and
      classrup.moderation.appeal/v1 (F12.S01.M03) bodies sealed to the relay moderation key. Media follow N9: P0 media are
      referenced by blob:sha256 of F15.S02.M03 MediaBlob, P2 media are copied into encrypted evidence blobs and sent as sealed
      attachments referenced by sha256. Privacy ports (N6): ExportSectionPort (section moderation.evidence), DeletionPort
      (purge or pseudonymize as above) and RetentionPurgePort (RET-EVIDENCE, hold re-check per snapshot) are registered with
      F10.S01.M03, F10.S01.M04 and F10.S01.M02.
    example: |
      vault command moderation.evidence.capture (local, Idempotency-Key 0192f3b0-0000-7000-8000-000000000b01)
      { "targetType": "listing", "targetId": "0192f3a4-5b6c-7d8e-9f01-23456789abcd", "targetRevision": 3, "captureReason": "report" }
      -> { "snapshotId": "0192f3b0-2222-7000-8000-000000000002", "contentHash": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", "authorSignatureStatus": "valid", "disclosure": "public_target", "capturedAt": "2026-11-04T10:00:00.120Z", "revision": 1 }
      vault command moderation.evidence.prepare_disclosure { "snapshotId": "0192f3b0-2223-7000-8000-000000000003" }
      -> { "previewDigest": "7a51…", "redactions": [ { "rule": "phone", "count": 1 }, { "rule": "geohash_gt5", "count": 1 } ], "rulesVersion": "redact/1" }
  authorization_capabilities:
    requirements:
      - "Vault policy: only the unlocked local principal captures, verifies, previews, approves disclosures and reads snapshots in its vault, and the author-signature check is part of capture."
      - "Relay policy: relay moderators read relay-held snapshots only for an assigned case or appeal, operators read the access log, and content authors read snapshots of their own content tied to an appeal and a redacted access log."
      - Every read, verify, export and purge writes an access row and a refused read writes none.
    capabilities:
      - "moderation.evidence.capture | local principal, moderator | vault unlocked, or relay moderator on an assigned case; target envelope held; author signature check applied"
      - "moderation.evidence.ingest_bundle | operator | in-process relay call from report and appeal intake; not routable over HTTP"
      - "moderation.evidence.verify | local principal, moderator, operator | any snapshot in the store the actor controls"
      - "moderation.evidence.disclose | local principal | vault unlocked; the local principal captured the snapshot; target is P2"
      - "moderation.evidence.read_as_reviewer | moderator | relay: assigned to the case or appeal referencing the snapshot; vault: local principal; access row written"
      - "moderation.evidence.read_as_subject | member | snapshot.authorKey = actor and an appeal exists on that relay for the decision citing the snapshot; stays allowed while the key is suspended or restricted on the relay"
      - "moderation.evidence.read_access_log | operator, member | operator any snapshot on the relay; vault owner for own vault; authors only the redacted view for snapshots of their own content"
  failure_recovery_idempotency:
    requirements:
      - Capture is idempotent per CTR-IDM-001 and reuses the stored evidence blob, incrementing its reference count, when identical bytes already exist in the store.
      - Capture, blob write or reference increment, access row and outbox event commit in one transaction or not at all.
      - Purge is two-step and crash-safe, recording the reference decrement and any key destruction before blob deletion, and the sweep resumes after a crash or tab close.
    idempotency: "Local Idempotency-Key required on capture; replay within 24 h returns the stored response; ingest_bundle is idempotent on (sourceRef, contentHash); verify is naturally idempotent; the RetentionPurgePort is idempotent per snapshot id."
    concurrency: "EvidenceBlob rows are unique per (tenant_id, sha256); capture and purge of snapshots that share a blob update refCount in the same transaction as the snapshot row (IndexedDB readwrite transaction in the vault, BEGIN IMMEDIATE on the relay), so a concurrent capture can never resurrect a blob whose key is being destroyed."
    retries: "Callers retry DEPENDENCY_UNAVAILABLE from the blob store or the media store with CTR-IDM-001 backoff; MODERATION_EVIDENCE_SOURCE_MISSING, signature and size errors are not retried."
    offline: "Capture and disclosure previews work fully offline in the vault because they only need locally held signed envelopes; a relay copy exists only after the report statement is delivered."
    partial_failure: "If the blob write fails, the transaction aborts and the caller receives DEPENDENCY_UNAVAILABLE; no orphan snapshot rows exist; blobs with refCount 0 and no key destruction record older than 24 h are shredded by the sweep. Privacy ports (N6): ExportSectionPort, DeletionPort and RetentionPurgePort resume from their last committed snapshot id."
  privacy_retention_abuse:
    requirements:
      - Snapshot bodies and media are P2 between the store owner and the moderators of the relay that received them, encrypted per blob, and leave a store only inside a sealed report or case bundle addressed to a relay moderation key, or in the owner's own export.
      - Retention is RET-EVIDENCE with legal-hold override on relays, and destruction is cryptographic shredding of a blob key once no active snapshot references it; copies already sent to a relay or fetched by others cannot be recalled and the UI says so.
      - Every access is logged and neither moderators nor vault apps expose a way to edit or delete access rows.
      - "A report on a P2 target gives the relay only metadata by default; plaintext leaves the vault only as a participant disclosure the reporter approved after a redact/1 preview reached export prepared, the single exception to ADR-0016 §3 and PRV-5 this module relies on."
      - The content author's view of the access log shows only purpose, accessor role and time, with accessor keys redacted and reporter-side rows excluded.
      - The module meets N6 by registering ExportSectionPort, DeletionPort and RetentionPurgePort with F10, classifying snapshot and access fields per F10.S02.M02, and consuming privacy.deletion.completed.
    data:
      - "EvidenceSnapshot: P2 (vault owner; moderators of the relay that received it for the case; author for appeal view)."
      - "EvidenceAccess: P2 (store owner and relay operators; author sees the redacted view only)."
      - "Per-blob keys: P4, wrapped by the vault key (vault) or the relay data key from F16.S01.M02 (relay)."
      - "Message key K of an unredacted message disclosure: P2 inside the encrypted body blob, readable only by the moderators of the receiving relay for the case."
    retention:
      - "Snapshots: RET-EVIDENCE (2 years after last related activity) through the RetentionPurgePort unless a relay legal hold applies; failed-integrity snapshots are purged on the same schedule."
      - "Access rows: RET-EVIDENCE; after purge they are reduced to stubs without content references for 180 days."
    threats:
      - "T01 | Relay moderator browses snapshots out of curiosity | relay read requires assigned case; each read logged; operator weekly access report; more than 50 reads per moderator per day alerts"
      - "T02 | Tampering with stored evidence to justify a decision | content hash plus per-blob AEAD tag; author signature over the original envelope; sweep verification; decisions store the hash they relied on"
      - "T03 | Forged evidence fabricated by a reporter | capture requires a valid author signature over the envelope; unsigned captures are labelled reporter claim and cannot alone support removal"
      - "T04 | Snapshot used to leak third-party private data | P2 targets are metadata_only by default; a disclosure is sent only after the reporter approves a redact/1 preview (L3/L4 location shares, geohash cells longer than 5 characters, emails, phone numbers and attachments removed); abuse test T19"
      - "T05 | Stolen device or relay disk exposes evidence | blobs encrypted with per-blob keys wrapped by the vault key or relay data key; key rotation in F16.S02.M01"
      - "T06 | Moderator identity learned from the access log during an appeal | author view redacts accessor keys and excludes reporter-side rows"
      - "T07 | Seller evades reporting by adding photos | media limits cover the listing maximum (10 items of 5 MiB) and P0 media are referenced, not copied"
    abuse_controls:
      - "Capture and ingest are rate limited by F12.S03.M03 at 60 per hour per key on a relay; relay evidence quota 5 GiB per tenant with operator alert at 80%; vault warns at 500 MiB of evidence."
      - "Identical bodies share one evidence blob with a reference count, which limits storage growth from repeated reports without weakening shredding."
  observability_performance:
    requirements:
      - Relay capture, verify and read durations and outcomes are measured per CTR-OBS-001 without content in logs, and the vault keeps only local diagnostics (OBS-7).
      - Capture meets p95 ≤ 300 ms on a relay and ≤ 150 ms in a vault for bodies up to 256 KiB, with media copied asynchronously within 30 s.
      - Integrity failures and unusual access volume are alerting metrics on the relay and local notices in the vault.
    metrics:
      - "classrup_moderation_evidence_captures_total{outcome=ok|too_large|signature_invalid|missing} (relay)"
      - "classrup_moderation_evidence_integrity_failures_total (relay)"
      - "classrup_moderation_evidence_reads_total{purpose} (relay)"
      - "classrup_moderation_evidence_blobs_shredded_total (relay)"
      - "classrup_moderation_evidence_bytes (relay gauge per tenant)"
    logs:
      - "relay info evidence.captured {snapshotId, targetType, disclosure, bytes, correlationId} — no content."
      - "relay error evidence.integrity_failed {snapshotId, correlationId}; vault writes the same to local diagnostics."
    budgets:
      - "relay capture p95 ≤ 300 ms and vault capture p95 ≤ 150 ms for ≤ 256 KiB; read p95 ≤ 150 ms; verify of one snapshot ≤ 50 ms; disclosure preview ≤ 100 ms for 64 KiB of text."
      - "Sweep verifies 10 000 snapshots in ≤ 120 s on a relay."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Hash stability, canonicalization and signature checks are covered by property tests with known vectors.
      - Access logging and non-disclosure are covered by abuse tests.
    fixtures: "Vault of reporter R and relay X, author S with signed listing L (cid sha256-aa…, revision 3, 10 P0 photos of 5 MiB) and end-to-end message M with an L3 location share, a geohash u4pruydqqvj, an email, a phone number and one attachment, moderators M1 and M2 assigned to case C, injectable clock starting 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,02.R01 | capture signed listing revision 3 in a vault | snapshot stored with canonical body, SHA-256 equal to independent recomputation, signature status valid, disclosure public_target"
      - "T02 | property | 01.R03,03.R01,09.R02 | random content objects with key order permuted and known vectors; random sequences of verify, purge and disclosure steps | contentHash identical; mutated body fails verification; only declared transitions succeed; fields other than integrity, lifecycle and legalHold never change"
      - "T03 | unit | 02.R02,02.R03 | each rule V02–V08 violated in turn | documented error code and no row stored; forged author signature refused"
      - "T04 | integration | 01.R02,03.R03,04.R03 | RetentionPurgePort run at RET-EVIDENCE end with and without a relay legal hold | privacy.legal_hold.check called per snapshot; key destroyed and blob deleted only without hold; no purge happens on a privacy.retention.purged event"
      - "T05 | integration | 03.R02 | corrupt a stored blob byte, verify, then reach retention end | integrity failed, alert raised, never returns to verified; the failed snapshot is purged and its blob shredded at retention end"
      - "T06 | contract | 04.R01,04.R02 | each command and query | outputs and captured event validate against registry schemas; capture produces no statement"
      - "T07 | abuse | 05.R01,05.R02,07.R03,09.R03 | member without case reads relay snapshot; unassigned moderator reads; assigned moderator reads | FORBIDDEN, FORBIDDEN, success with exactly one access row; refused reads write none"
      - "T08 | abuse | 05.R02,07.R05,09.R03 | author reads access log of own snapshot and of another's; attempt to UPDATE or DELETE an access row | own shows purpose, role and time only, accessor redacted, reporter rows excluded; other NOT_FOUND; mutation aborts"
      - "T09 | integration | 06.R01,01.R04 | same Idempotency-Key replayed; two captures of identical content | original response replayed; one EvidenceBlob with refCount 2 and two snapshot rows"
      - "T10 | chaos | 06.R02,06.R03 | blob store fails mid-capture; tab closed between key destruction and blob deletion | no orphan row; purge resumes and completes"
      - "T11 | abuse | 07.R02 | author deletes own record after report | snapshot retained until RET-EVIDENCE end; UI states that copies cannot be recalled"
      - "T12 | load | 08.R01,08.R02,08.R03 | 50 captures per second for 5 minutes on a relay with 256 KiB bodies; vault capture on Moto G profile | relay p95 ≤ 300 ms, vault p95 ≤ 150 ms, metrics exported, sweep of 10 000 snapshots ≤ 120 s"
      - "T13 | unit | 09.R01 | traceability tool run | every PS-093 requirement maps to a passing test"
      - "T14 | integration | 10.R01,10.R02,10.R03 | export evidence bundle for a case, import into fresh store, restore backup | hashes verify after round trip; import without keys marks bodies unreadable"
      - "T15 | abuse | 05.R03,07.R03 | verify, export and purge one snapshot each | exactly one access row per action with action verify, export and purge"
      - "T16 | integration | 01.R04,03.R03,07.R02 | two snapshots share one blob, one under relay legal hold, both past retention | unheld snapshot purged and refCount drops to 1; blob key survives; after hold release and the next run the blob key is destroyed and the blob deleted"
      - "T17 | integration | 02.R02,04.R04 | report listing L with 10 photos of 5 MiB and a message with 2 P2 photos; relay ingests both bundles | listing reportable with 10 blob:sha256 references and no copies; P2 photos copied into evidence blobs; relay re-verifies hashes and resolves P0 media by reference"
      - "T18 | unit | 02.R04,03.R04 | disclosure preview of message M; approve with a stale digest; approve with the latest digest | each item redacted by its redact/1 rule and counted; PRECONDITION_FAILED; export_prepared with disclosure participant_disclosure"
      - "T19 | abuse | 07.R01,07.R04 | report message M without disclosure and inspect the relay copy and moderator view | relay holds only targetCid, sender key, sender signature and reason; no plaintext; label 'metadata only' shown"
      - "T20 | integration | 07.R06 | ExportSectionPort run, then privacy.deletion.completed in the vault with keepEvidence true and false | export section moderation.evidence produced; evidence purged or pseudonymized as documented"
      - "T21 | integration | 04.R03 | privacy.legal_hold.placed then released on a relay | snapshots of the held author flagged after privacy.legal_hold.check; flag cleared on release; purge only afterwards"
      - "T22 | abuse | 07.R01,07.R04 | F12 privacy suite after captures, ingests, disclosures and purges in a vault and on a relay: scan federation payloads, public projections, relay and vault logs, events and notification payloads | no snapshot body, media reference of a P2 item, accessorId or redacted value appears in any of them; events carry only ids, hashes and enums"
      - "T23 | unit | 01.R05,02.R05 | approve an unredacted disclosure of message M with its K, with a wrong K, and a redacted disclosure with K; relay ingests the first bundle and a bundle whose disclosed text was altered | first stored with messageKey and commitmentStatus verified; MODERATION_EVIDENCE_COMMITMENT_MISMATCH for the wrong K, the redacted disclosure and the altered text; metadata of every message snapshot holds messageCid and the signed envelope without wrapped keys"
    acceptance:
      - All tests T01–T23 pass in CI.
      - Every read, verify, export and purge of a snapshot produces exactly one access row (property and abuse tests).
      - A modified snapshot body, media or author signature is always detected by verification, and no P2 plaintext reaches a relay without an approved disclosure.
  import_export_backup_rollback:
    requirements:
      - Evidence export is limited to the owner's own vault export, case bundles sent to a relay moderation key, and legal-hold exports approved under F10.S01.M02.
      - Import verifies every content hash and author signature and refuses bodies whose hash does not match.
      - Schema changes follow expand/contract and keep v1 readable for 180 days.
    export: "Section moderation.evidence in classrup-export/v1 through ExportSectionPort: snapshot metadata, decrypted body and copied media (the owner's own data), P0 media as blob:sha256 references, access log rows; relay case bundles are sealed to the moderation key."
    import: "Bundles import as read-only evidence; each body hash and author signature is recomputed; mismatches are rejected with VALIDATION_FAILED; blobs are re-encrypted under new per-blob keys of the target store and reference counts rebuilt."
    backup: "Vault export is the primary backup (IOX-6); relay SQLite and blob backups (CTR-IOX-001 IOX-3) hold only evidence received in reports; restore re-runs the integrity sweep and recomputes reference counts."
    migration_rollback: "v1 moves from per-snapshot keys to per-blob keys by an expand step that creates EvidenceBlob rows with refCount 1 per existing snapshot; rollback is safe because older readers ignore new optional fields; relay migrations re-create the access log trigger on down scripts."
