id: F12.S02.M03
scope: MVP
summary: >-
  A relay's community and hosting policy as versioned rules with stable IDs (for example POL-FRAUD-001).
  Moderator actions, statements of reasons and appeals cite rule ID and version, and only a version in force at
  the decision time can be cited. A relay operator drafts, publishes and retires rules; each version declares its
  change type (initial adoption, restrictive or non-restrictive), restrictive changes need 14 days' notice, and each
  published version is signed by the relay as a public policy statement that vaults can fetch, pin and compare, so
  users can see what a relay enforces before they choose it. Rules describe what the relay hosts and indexes; they
  are not law and not a global standard. Prohibited goods rules are owned by F18.S01.M02 and are referenced here by
  (publisherId, ruleKey), optionally pinned to one version by ruleId. Approved community decisions about platform
  policy (F18.S02.M01, targetType platform_policy) arrive on the relay as drafts for operator review and are never
  published by themselves.
responsibilities:
  - "Own the PolicyRule record: stable rule ID, immutable versions, change type, locale texts, severity and allowed action ladder."
  - Provide a seed set of 12 rule families that a relay can adopt, edit or replace before publishing, adopted as initial versions with a stated effective date.
  - Publish each rule version as a relay-signed statement (classrup.moderation.policy/v1) and an index of current versions with their derived in-force state.
  - Answer in-process whether a cited rule version was in force at a decision time (moderation.policyrule.check_citable) for F12.S02.M01 and F12.S01.M03.
  - Keep retired and superseded versions readable forever so old statements of reasons remain understandable.
  - Cross-reference prohibited-goods rules from F18.S01.M02 by (publisherId, ruleKey), with an optional ruleId naming one exact version, without copying their content.
  - Turn relay-scope governance.policy_proposal.decided events of targetType platform_policy with outcome approved into draft PolicyRule versions for operator review, built from the carried proposedChange, and discard the unpublished drafts of a proposal whose outcome becomes conflicted.
non_responsibilities:
  - Applying rules to content (F12.S02.M01) and detecting violations (F12.S02.M02).
  - Prohibited goods rule sets and jurisdiction logic (F18.S01.M02, F18.S01.M01).
  - Community decision-making on policy changes (F18.S02.M01); this module records the published result.
  - Relay signing key registry and rotation history (F16.S02.M02).
  - "Future: per-community rule overlays; machine-readable rule tests; translations beyond the operator's locales."
depends_on: [F18.S01.M02, F18.S02.M01, F16.S02.M02, F16.S01.M01, F16.S02.M03, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-FED-001, CTR-PRV-001, CTR-OBS-001]
user_stories:
  - As a prospective member, I can read a relay's rules and their change history before I choose it.
  - As a relay operator, I publish a revised rule with a changelog and an effective date at least 14 days ahead for restrictive changes, and a new relay can adopt its first rule set with a stated effective date.
  - As a moderator, I pick a rule from a list with its full text and allowed actions when I decide a case, and only versions in force are offered.
edge_cases:
  - A rule is edited after actions cited it; editing creates a new version and old actions keep citing the older version, which stays readable.
  - Two operators publish different edits of one rule at once; the second returns CONFLICT_REVISION.
  - A restrictive rule is published with an effective date less than 14 days away; refused with MODERATION_POLICY_NOTICE_TOO_SHORT except for rules marked imminent_harm.
  - A fresh relay adopts the 12 seed families before its first in-force policy; they are initial versions and take effect at their stated effective date, which may be the publication time.
  - An operator labels a version non_restrictive although it adds an allowed action; refused with VALIDATION_FAILED because non_restrictive requires a subset of the previous allowed actions and no higher severity.
  - A moderator cites version 2 of a rule that is published but scheduled for next week; check_citable reports scheduled and the citation is refused by F12.S02.M01.
  - A rule text exists only in English but the user's locale is German; the vault shows the English text labelled with its language.
  - A rule references a prohibited-goods rule (publisherId, ruleKey) that the relay's applied F18.S01.M02 pack later retires; the reference shows 'retired', the rule is flagged for operator review and check_citable refuses it for new actions.
  - Relay signing key rotates; older rule statements stay verifiable through the key registry history in F16.S02.M02.
  - An approved platform_policy decision reaches the relay twice through relay_upload (scope relay) and once as a vault-scope copy; one draft per (decisionCid, ruleId) is created from the carried proposedChange, the vault copy is ignored, and nothing is published until an operator publishes the draft.
  - A decision later becomes conflicted (equivocation detected by F18.S02.M01); the unpublished drafts built from it are discarded with reason governance_conflicted, and a version already published from it stays immutable and is flagged for operator review.
  - A decided event whose changeDigest does not equal sha256-JCS(proposedChange), or that carries only proposedChangeCid while the proposal statement stored on this relay does not match it, creates no draft and is logged.
  - A v1 rule row holds a plain F18 rule version id as prohibitedRuleRef; the expand step resolves it to (publisherId, ruleKey, ruleId) and flags the rule for review when the id cannot be resolved.
ux:
  screens:
    - "Public policy page: rule list grouped by family, each with ID, current version, change type, effective date, in-force state, short and full text, changelog."
    - "Operator rule editor: locale tabs, severity, allowed action ladder, change type (initial only before the first in-force policy), effective date, changelog, preview of how it appears in a statement of reasons."
    - "Moderator rule picker: searchable list of versions in force now, showing ID, one-line summary and allowed actions."
  states: [loading, draft, scheduled, in-force, superseded, retired, error]
  a11y:
    - Policy page is a semantic heading hierarchy with a skip link to each family.
    - Version history is a list with dates in text form, not color-coded only.
    - Editor fields have labels, error messages linked by aria-describedby, and 44 by 44 px controls.
processes:
  domain_schema:
    requirements:
      - A PolicyRule version stores rule ID, version, family, severity, allowed actions, change type, locale texts, effective and retirement times and the relay signature content id, with tenant and revision per CTR-ID-001.
      - Published rule versions are P0, immutable and retained under RET-EVIDENCE because moderation decisions cite them.
      - Rule IDs follow POL-<FAMILY>-<NNN>, are never reused and version numbers increase by one.
      - Each version has a derived in-force state (scheduled, in_force, superseded) computed from effectiveAt, later versions and retirement, and at most one version of a rule ID is in force at any time.
      - A prohibited-goods reference is the F18.S01.M02 identity (publisherId, ruleKey) with an optional ruleId for one exact version, a version drafted from a governance decision keeps its governanceRef, and review flags and reference status derived from governance events live in a store-local review table beside the immutable version rows.
    entities:
      - name: PolicyRule
        schema: classrup.moderation.policyrule/v1
        storage: relay+device
        privacy: P0
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key of this version row"
          - "tenantId: uuidv7 — relay hosting scope"
          - "ruleId: string — stable ID matching POL-[A-Z]+-[0-9]{3}"
          - "version: int — starts at 1, increments by 1 per published change"
          - "family: enum — spam | fraud | prohibited_goods | harassment | hate | sexual_content | violence | privacy | impersonation | counterfeit | minor_safety | platform_manipulation"
          - "severity: enum — low | medium | high | imminent_harm"
          - "allowedActions: string[] — subset of warn, remove_from_index, restrict_feature, suspend_relay_access"
          - "changeType: enum — initial | restrictive | non_restrictive"
          - "texts: object — locale to { title ≤ 120 code points, summary ≤ 400, body ≤ 4000 }"
          - "prohibitedRuleRef?: object — { publisherId: did:key, ruleKey: [a-z0-9_]{3,40}, ruleId?: uuidv7 } F18.S01.M02 reference when family is prohibited_goods; cross-module identity is (publisherId, ruleKey) and ruleId pins one exact version"
          - "governanceRef?: object — { proposalId, publisherId, proposalStatementCid, decisionCid, changeDigest } when the draft was built from an approved F18.S02.M01 decision; kept unchanged on publication"
          - "changelog: string — 10..1000 code points"
          - "publishedAt?: timestamp — RFC 3339 UTC, relay clock at publication"
          - "effectiveAt: timestamp — RFC 3339 UTC; at least 14 days after publication when changeType is restrictive"
          - "inForce: enum — scheduled | in_force | superseded (derived, published versions only)"
          - "retiredAt?: timestamp — RFC 3339 UTC"
          - "status: enum — draft | published | retired"
          - "statementCid?: string — content id of the relay-signed policy statement"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - (tenantId, ruleId, version) is unique and a published version is never modified.
          - At most one version of a ruleId is in force at any time; a version is in force from its effectiveAt until a later version of the same ruleId reaches its effectiveAt or the rule is retired.
          - imminent_harm rules are the only restrictive ones allowed an effective date earlier than 14 days after publication.
          - changeType initial exists only for versions published before the relay's first in-force policy version; non_restrictive requires a previous version whose allowedActions include the new ones, with no higher severity and the same family.
          - prohibitedRuleRef.ruleId, when present, names a version of the same (publisherId, ruleKey); review flags and reference status are never written into a version row.
    sql: |
      CREATE TABLE moderation_policy_rule (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, rule_id TEXT NOT NULL, version INTEGER NOT NULL, family TEXT NOT NULL,
        change_type TEXT NOT NULL, status TEXT NOT NULL, published_at TEXT, effective_at TEXT NOT NULL, retired_at TEXT,
        revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX moderation_policy_version ON moderation_policy_rule(tenant_id, rule_id, version);
      CREATE INDEX moderation_policy_effective ON moderation_policy_rule(tenant_id, rule_id, effective_at);
      CREATE TRIGGER moderation_policy_published_immutable BEFORE UPDATE ON moderation_policy_rule
        WHEN OLD.status = 'published' AND NEW.status = 'published' BEGIN SELECT RAISE(ABORT, 'immutable'); END;
      CREATE TABLE moderation_policy_review (
        tenant_id TEXT NOT NULL, rule_id TEXT NOT NULL, version INTEGER NOT NULL, flag TEXT NOT NULL,
        prohibited_ref_status TEXT, source_event_id TEXT NOT NULL, flagged_at TEXT NOT NULL,
        PRIMARY KEY (tenant_id, rule_id, version, flag));
      CREATE TABLE moderation_policy_governance_draft (
        tenant_id TEXT NOT NULL, decision_cid TEXT NOT NULL, rule_id TEXT NOT NULL, policy_rule_id TEXT NOT NULL,
        PRIMARY KEY (tenant_id, decision_cid, rule_id));
    note: "Store-local tables (P1, relay-internal, operators only, retained with the rule versions they refer to): moderation_policy_review holds review flags (prohibited_rule_changed, governance_conflicted) and the derived prohibitedRefStatus (active | retired) per version; moderation_policy_governance_draft dedupes governance drafts per (decisionCid, ruleId)."
  validation_rules:
    requirements:
      - Rule input is validated strictly, including ID format, text sizes and allowed action vocabulary.
      - Publication checks the notice period for restrictive changes only, the changelog and that the rule is the next version, and initial adoption on a new relay takes effect at its stated effective date.
      - Every violation maps to one stable error code.
      - A change is classified initial, restrictive or non_restrictive by testable rules, and a declared class that the rules contradict is refused.
      - A governance decision becomes a draft only when it is relay-scope, approved, about platform_policy, published by this relay's operator and its content digest matches, and every draft built from it passes the same rule checks as an operator draft.
    rules:
      - "V01 | ruleId matches POL-[A-Z]+-[0-9]{3}, family is in the enum and no unknown fields are present | VALIDATION_FAILED"
      - "V02 | title ≤ 120, summary ≤ 400, body ≤ 4000 code points in at least one locale | VALIDATION_FAILED"
      - "V03 | allowedActions is a non-empty subset of the four relay action kinds | VALIDATION_FAILED"
      - "V04 | changeType restrictive requires effectiveAt ≥ publication + 14 days unless severity is imminent_harm | MODERATION_POLICY_NOTICE_TOO_SHORT"
      - "V05 | version equals current published version + 1 and expectedRevision matches | CONFLICT_REVISION"
      - "V06 | family prohibited_goods requires prohibitedRuleRef { publisherId, ruleKey, ruleId? } whose (publisherId, ruleKey) has an active version in the relay's applied F18.S01.M02 pack (governance.prohibited_rule.get), and ruleId, when present, names a version of that key | VALIDATION_FAILED"
      - "V07 | a retired ruleId cannot be republished with the same ID | MODERATION_POLICY_RETIRED"
      - "V08 | changeType non_restrictive requires a previous version with the same family whose allowedActions include the new ones and whose severity is not lower; version 1 of a rule on a relay that already has an in-force policy is restrictive | VALIDATION_FAILED"
      - "V09 | changeType initial only while the relay has no in-force policy version yet, with effectiveAt stated and not before publication | VALIDATION_FAILED"
      - "V10 | check_citable input names ruleId, version and a decision time not in the future | VALIDATION_FAILED"
      - "V11 | a governance.policy_proposal.decided event is drafted only with scope relay, targetType platform_policy, outcome approved, publisherId an operator key of this relay, changeDigest equal to sha256-JCS(proposedChange) (or of the stored proposal statement's proposedChange when only proposedChangeCid is carried), every targetRef matching POL-[A-Z]+-[0-9]{3} and every proposedChange entry passing V01–V03, V06, V08 and V09 | VALIDATION_FAILED"
  workflow_state_machine:
    requirements:
      - Rule versions follow the declared lifecycle and any other transition is refused with CONFLICT_STATE.
      - Publishing a version supersedes the previous in-force version at effectiveAt, and the previous stays readable.
      - Retiring a rule prevents new citations and leaves all existing citations valid.
      - The in-force state of a published version moves from scheduled to in_force at effectiveAt and to superseded when a later version takes effect or the rule is retired, and only an in_force version is citable for a decision at that time.
      - A governance-built draft starts in state draft with governanceRef and is published only by an operator through moderation.policyrule.publish; a conflicted outcome discards the proposal's unpublished drafts and flags a version already published from it without changing that version.
    machines:
      - entity: PolicyRule
        initial: draft
        terminal: [retired]
        transitions:
          - "draft -> published | moderation.policyrule.publish by operator | statement signed; inForce scheduled or in_force by effectiveAt; emits moderation.policy.published"
          - "published -> retired | moderation.policyrule.retire by operator | retiredAt set; inForce superseded; later versions of the ID are refused"
          - "draft -> retired | moderation.policyrule.retire by operator, or a relay-scope governance.policy_proposal.decided with outcome conflicted for the proposal the draft was built from | draft discarded without publication (reason governance_conflicted for the latter)"
      - entity: PolicyRuleInForce
        initial: scheduled
        terminal: [superseded]
        transitions:
          - "scheduled -> in_force | in-force index refresh at effectiveAt | the previous in_force version of the ruleId becomes superseded in the same write"
          - "in_force -> superseded | a later version of the ruleId reaches its effectiveAt, or the rule is retired | stays readable; not citable for later decision times"
          - "scheduled -> superseded | the rule is retired before effectiveAt | never citable"
    timeouts:
      - "Scheduled versions become in force at effectiveAt; a check every 60 s refreshes the in-force index."
      - "Discarded drafts are deleted 30 days after discard."
  commands_queries_events:
    requirements:
      - Every command is a relay command; publish also produces a signed policy statement that vaults can fetch.
      - Publish emits moderation.policy.published in the same transaction as the version row and the statement.
      - The module consumes relay-scope governance events to create drafts and flag rules for operator review, and never publishes, retires or changes a published version by itself.
      - moderation.policyrule.check_citable answers in-process whether ruleId@version was in force at a given decision time, and F12.S02.M01 and F12.S01.M03 cite only versions it confirms.
      - "governance.policy_proposal.decided is consumed in relay runtime only with scope relay (a decision this relay stored through F18.S02.M01 relay_upload) and targetType platform_policy: outcome approved creates one draft version per targetRef from proposedChange[targetRef], the canonical platform_policy change record { family, severity, allowedActions, changeType, texts, prohibitedRuleRef?, changelog?, effectiveAt }, with governanceRef { proposalId, publisherId, proposalStatementCid, decisionCid, changeDigest } and without a second lookup (only a payload carrying proposedChangeCid instead reads the proposal statement proposalStatementCid stored on this relay); rejected creates nothing; conflicted discards the proposal's unpublished drafts and flags versions already published from it; vault-scope events are ignored."
      - "governance.prohibited_rule.changed is consumed in relay runtime only with scope relay (the relay's applied pack, emitted by F18.S01.M02 relay_upload): versions whose prohibitedRuleRef has the event's (publisherId, ruleKey) get prohibitedRefStatus retired on change retired or emergency_expired and a review flag, a version pinned to a ruleId that is no longer the active version is flagged, check_citable reports citable false for a version whose reference is retired, and vault-scope events are ignored."
    commands:
      - name: moderation.policyrule.draft
        mode: "relay command"
        capability: moderation.policyrule.draft
        input: "{ ruleId?, family, severity, allowedActions, changeType, texts, prohibitedRuleRef?: { publisherId, ruleKey, ruleId? }, changelog, effectiveAt }"
        output: "{ policyRuleId, ruleId, version, revision: 1 }"
        errors: [VALIDATION_FAILED, CONFLICT_REVISION, MODERATION_POLICY_RETIRED]
        emits: []
        idempotent: true
      - name: moderation.policyrule.publish
        mode: "relay command; produces statement classrup.moderation.policy/v1 signed by the relay key"
        capability: moderation.policyrule.publish
        input: "{ policyRuleId, expectedRevision }"
        output: "{ policyRuleId, ruleId, version, changeType, effectiveAt, inForce, statementCid, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, MODERATION_POLICY_NOTICE_TOO_SHORT, VALIDATION_FAILED]
        emits: [moderation.policy.published]
        idempotent: true
      - name: moderation.policyrule.retire
        mode: "relay command; produces retirement note in classrup.moderation.policy/v1 index"
        capability: moderation.policyrule.retire
        input: "{ policyRuleId, expectedRevision, reason }"
        output: "{ policyRuleId, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: []
        idempotent: true
    queries:
      - name: moderation.policyrule.list_public
        capability: moderation.policyrule.read_public
        input: "{ family?, asOf?, locale?, cursor?, limit ≤ 100 }"
        output: "{ items: PolicyRule[] in force at asOf, nextCursor? }"
        errors: []
      - name: moderation.policyrule.get_version
        capability: moderation.policyrule.read_public
        input: "{ ruleId, version }"
        output: "{ rule: PolicyRule, statementCid }"
        errors: [NOT_FOUND]
      - name: moderation.policyrule.check_citable
        capability: moderation.policyrule.check_citable
        input: "{ refs: ruleId@version[] (1..5), decisionAt }"
        output: "{ items: { ref, citable: boolean, inForce: scheduled|in_force|superseded|retired|unknown, allowedActions, prohibitedRefStatus?: active|retired }[] } — citable is false when prohibitedRefStatus is retired"
        errors: [VALIDATION_FAILED]
    events_produced:
      - {type: moderation.policy.published, privacy: P0, payload: "{ ruleId, version, family, severity, changeType, effectiveAt, statementCid, changelog }"}
    events_consumed:
      - {type: governance.policy_proposal.decided, effect: "relay runtime, scope relay and targetType platform_policy only (vault-scope copies and other target types are ignored): reads outcome approved|rejected|conflicted, proposalId, publisherId, targetRefs, proposedChange (or proposedChangeCid), changeDigest, proposalStatementCid, decisionCid and changelogEntry; approved after V11 creates one draft per targetRef with governanceRef, deduped on (decisionCid, ruleId), changelog defaulting to changelogEntry; rejected creates nothing; conflicted discards that proposal's unpublished drafts (reason governance_conflicted) and flags versions already published from it; never publishes"}
      - {type: governance.prohibited_rule.changed, effect: "relay runtime, scope relay only (vault-scope copies are ignored): match versions whose prohibitedRuleRef has the payload's (publisherId, ruleKey); change retired or emergency_expired sets prohibitedRefStatus retired and flag prohibited_rule_changed; change activated with a ruleId other than a pinned prohibitedRuleRef.ruleId flags the version; dedupe on (consumer, eventId); never changes a version row"}
    errors:
      - "MODERATION_POLICY_NOTICE_TOO_SHORT | 422 | no | restrictive rule changes need an effective date at least 14 days after publication"
      - "MODERATION_POLICY_RETIRED | 409 | no | a retired rule ID cannot be reused"
    note: "Statement registry (N2, F11.S01.M01): classrup.moderation.policy/v1 (signer role: the relay key registered in F16.S02.M02). check_citable is an in-process relay call and is not routable over HTTP. For F18.S02.M01 targetType platform_policy, a targetRef is an F12 ruleId (POL-<FAMILY>-<NNN>) and proposedChange[ruleId] is the canonical change record { family, severity, allowedActions, changeType, texts, prohibitedRuleRef?, changelog?, effectiveAt }, the moderation.policyrule.draft input without ruleId; a new ruleId starts at version 1. Prohibited-goods references use the F18.S01.M02 identity (publisherId, ruleKey) with optional ruleId."
    example: |
      POST https://relay.example/api/v1/cmd/moderation.policyrule.publish   (relay command, operator token)
      Idempotency-Key: 0192f3d0-0000-7000-8000-000000000e01
      { "policyRuleId": "0192f3d0-6666-7000-8000-000000000006", "expectedRevision": 1 }
      -> 200 { "policyRuleId": "0192f3d0-6666-7000-8000-000000000006", "ruleId": "POL-FRAUD-001", "version": 2, "changeType": "restrictive", "effectiveAt": "2026-11-18T10:00:00Z", "inForce": "scheduled", "statementCid": "sha256-dd56…", "revision": 2 }
      in-process moderation.policyrule.check_citable { "refs": ["POL-FRAUD-001@2"], "decisionAt": "2026-11-05T09:00:00Z" } -> { "items": [ { "ref": "POL-FRAUD-001@2", "citable": false, "inForce": "scheduled" } ] }
  authorization_capabilities:
    requirements:
      - "Relay policy: only relay operators draft, publish and retire rules; moderators and members read published rules; the public read capability needs no session."
      - "Vault policy: a vault stores a policy statement only if signed by the relay key it fetched it from and pins the statement it showed the user."
      - Policy reads are cacheable for 5 minutes and never reveal drafts.
    capabilities:
      - "moderation.policyrule.draft | operator | relay role operator"
      - "moderation.policyrule.publish | operator | relay role operator; rule is a draft; change-type and notice-period rules satisfied"
      - "moderation.policyrule.retire | operator | relay role operator"
      - "moderation.policyrule.read_public | anonymous, member, moderator | published versions only"
      - "moderation.policyrule.check_citable | moderator, operator | in-process relay call by F12.S02.M01 and F12.S01.M03; not routable over HTTP"
  failure_recovery_idempotency:
    requirements:
      - Commands are idempotent per CTR-IDM-001 and mutations require expectedRevision.
      - Publication writes the version row, signature and event in one transaction.
      - Concurrent edits to the same rule serialize on version uniqueness.
    idempotency: "Idempotency-Key required; replay returns the stored response for 24 h; publish replay returns the same statementCid; governance drafts dedupe on (decisionCid, ruleId) and governance events on (consumer, eventId)."
    concurrency: "Unique (tenant, ruleId, version) index and expectedRevision; two drafts of the same next version conflict at publish with CONFLICT_REVISION; the in-force refresh updates the outgoing and incoming version in one write."
    retries: "Callers retry DEPENDENCY_UNAVAILABLE only; signing failure aborts publication."
    offline: "Operators need the relay online; vaults read cached policy statements offline and show their fetch date."
    partial_failure: "If the signing key is unavailable the transaction aborts and the draft stays draft; no unsigned published rule exists."
  privacy_retention_abuse:
    requirements:
      - Rules and statements are P0 public data and contain no personal data; drafts are visible to operators only.
      - Published versions are retained under RET-EVIDENCE and never deleted while any action cites them.
      - Policy tampering is prevented by signatures, immutability and audit of every operator action.
    data:
      - "PolicyRule published versions: P0."
      - "Drafts: P1 relay-internal, operators only."
    retention:
      - "Published and retired versions: RET-EVIDENCE (kept at least 2 years after the last action citing them)."
      - "Discarded drafts: deleted after 30 days."
    threats:
      - "T01 | Operator rewrites rules retroactively to justify past actions | published versions are immutable and signed; actions store ruleId with version and statement CID"
      - "T02 | Surprise restrictive rules | 14-day notice for restrictive changes; change type checked by V08; changelog required; vault shows 'changed since you joined'"
      - "T03 | Forged policy statement served by an impostor relay | vault verifies the relay signature and the relay key from the F16.S02.M02 registry"
      - "T04 | Rule text used to smuggle active content | texts are plain text with inert links, length capped"
      - "T05 | Moderator cites a scheduled rule to bypass the notice period | check_citable allows only versions in force at the decision time"
      - "T06 | Operator labels a restrictive change non_restrictive to skip notice | V08 derives the class from allowed actions, severity and family"
      - "T07 | A forged, foreign or equivocated governance decision injects a rule | only relay-scope decisions that F18.S02.M01 relay_upload verified for this relay's operator are drafted (V11), digests are checked, conflicted outcomes discard drafts, and drafts never publish by themselves"
    abuse_controls:
      - "Operator publish rate limited to 20 rule versions per 24 h (F12.S03.M03 window_counter class policy.publish); all operator actions audit-logged (F16.S01.M01)."
  observability_performance:
    requirements:
      - Publish and read latency and outcomes are measured per CTR-OBS-001.
      - Public reads meet the read budget (p95 ≤ 150 ms) and are cache friendly.
      - In-force index freshness is observable.
    metrics:
      - "classrup_moderation_policy_versions_total{outcome=published|retired,changeType}"
      - "classrup_moderation_policy_in_force (gauge: number of rules in force)"
      - "classrup_moderation_policy_index_age_ms (gauge)"
      - "classrup_moderation_policy_governance_events_total{outcome=drafted|ignored|discarded|flagged}"
    logs:
      - "relay info policy.published {ruleId, version, changeType, correlationId}."
    budgets:
      - "list_public p95 ≤ 150 ms for 100 rules; publish p95 ≤ 300 ms; check_citable p95 ≤ 2 ms in-process."
      - "In-force index refresh ≤ 1 s after effectiveAt."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Contract tests check commands, statements and events against the schema registry.
      - Version immutability is covered by property tests.
    fixtures: "Relay X with operator O, seed rules POL-FRAUD-001 v1 and POL-SPAM-001 v1 in force, fresh relay Z without policy, fixed clock 2026-11-04T10:00:00Z with an injectable clock."
    tests:
      - "T01 | unit | 01.R01,01.R03,02.R01 | draft and publish a valid rule; draft with an unknown field | version row stored with changeType, version = previous + 1, ID matches pattern; VALIDATION_FAILED"
      - "T02 | unit | 02.R02,02.R03 | each rule V02–V10 violated | documented error code and nothing stored"
