    acceptance:
      - All tests T01–T19 pass in CI.
      - Published rule versions are immutable and every action's citation resolves to the exact text in force at decision time.
      - Seed set of 12 rule families is available for adoption in a fresh relay, and restrictive changes always give 14 days' notice.
  import_export_backup_rollback:
    requirements:
      - Policy export contains all versions with statements and is portable between relays as a starting template, not as authority.
      - Import verifies statement signatures when keeping them as history, and templates import as drafts under the new relay's keys.
      - Schema changes follow expand/contract and keep v1 readable for 180 days.
      - The expand step turns a v1 prohibitedRuleRef string (an F18 rule version id) into { publisherId, ruleKey, ruleId } through governance.prohibited_rule.get { ruleId }, and a reference that cannot be resolved is flagged for operator review instead of guessed.
    export: "Section moderation.policy in the relay configuration export: all versions, change types, texts, statements and changelogs; users can download the current policy as JSON from the public page."
    import: "Importing another relay's policy creates drafts only, with changelog 'adopted from <relay>' and changeType initial when the importing relay has no in-force policy, otherwise restrictive; original signatures are kept as provenance but never as this relay's statements."
    backup: "Covered by relay SQLite backup (CTR-IOX-001 IOX-3); restoring re-verifies all statement signatures and recomputes inForce."
    migration_rollback: "Additive fields only in v1 (changeType defaults to restrictive for existing versions after the first, initial for version 1 rows published before the first in-force policy; publishedAt; inForce derived; governanceRef); prohibitedRuleRef changes from the rule version id string to the object { publisherId, ruleKey, ruleId } by an expand step that resolves the stored id with governance.prohibited_rule.get and flags unresolved rows for review, and readers keep the string readable for 180 days; rollback is safe because older readers ignore new optional fields, read prohibitedRuleRef.ruleId, and unknown families display as 'other'."
