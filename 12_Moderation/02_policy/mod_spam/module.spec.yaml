id: F12.S02.M02
scope: MVP
summary: >-
  Deterministic spam heuristics exposed as the in-process query moderation.spam.evaluate (N19) and run in three
  modes: in the author's vault on a draft before it is signed (author_presign, used by F01.S01.M03 publish), on a
  relay through the index-intake hook when a signed public projection arrives for indexing (relay_intake), and in a
  user's vault as a local filter over incoming listings (vault_filter). Heuristics are duplicate content hash,
  near-duplicate simhash, link density, posting velocity counted by the store's own receipt time, backdated claims
  and new-key limits from the store's own first observation of a key. Results are explainable signals with a score
  from 0 to 100, never automatic bans. The only automatic effect is a short velocity throttle on the relay's own
  intake, which expires within 1 hour and is labelled automated. Local use only labels or folds content for that
  user, and the author's pre-sign check only asks the author to confirm.
responsibilities:
  - Evaluate submitted text and metadata with fixed, versioned heuristics and return a score, matched heuristic names, measured values, thresholds and a degraded flag.
  - Expose moderation.spam.evaluate in-process for author_presign (F01.S01.M03, N19), relay_intake (relay index-intake hook) and vault_filter; it is a registered vault and relay query on the command bus (capability moderation.spam.evaluate), and the SpamEvaluator port is only its implementation.
  - Emit moderation.spam.detected with the subject did:key, score, heuristics and an optional recommended throttle, from relay intake and from the vault filter, never from an author's pre-sign check.
  - Maintain derived, rebuildable fingerprint and key-observation indexes (normalized SHA-256, 64-bit simhash, store receipt time, first-seen time) keyed by a store-salted key hash, with a 30-day window.
  - "Keep the heuristic set deterministic: same input and same state give the same output, with the rule version and thresholds recorded in every result."
non_responsibilities:
  - Banning, removing or suspending anything (F12.S02.M01 decides from signals; relays throttle only through F12.S03.M03).
  - Signal storage and decay (F12.S03.M02) and risk levels (F12.S03.M01).
  - Prohibited goods detection (F18.S01.M02).
  - Deciding whether a draft is published (F01.S01.M03 holds it for owner confirmation).
  - "Future: language-specific classifiers; image perceptual hashing; shared fingerprint feeds between relays."
depends_on: [F12.S03.M03, F16.S01.M01, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-PRV-001, CTR-OBS-001]
user_stories:
  - As a relay operator, I see why a submission was flagged (for example 'identical text posted 4 times in 10 minutes') and can tune thresholds for my relay.
  - As a member, I can fold likely spam in my own feed without any relay deciding for me.
  - As a new member posting my first listings, I am not blocked by heuristics that only apply above stated limits, and my own device tells me before signing if my listing looks like spam.
edge_cases:
  - A legitimate seller posts 12 near-identical listings for variants of one product; duplicate score rises but the result is a signal and a throttle of at most 1 hour, not removal.
  - Text in a script without spaces (for example Chinese); word-based link density uses character counts so the ratio stays defined and never divides by zero.
  - "Normalization collisions: two different texts normalize to the same hash; the result records both content ids so moderators see the difference."
  - A spammer backdates createdAt by 25 hours on 20 fresh statements; velocity counts every first-seen content id by the store's receipt time, so velocity still triggers and backdated_claim is added.
  - Replayed old statements are excluded by content id dedupe, never by their claimed timestamp; the device or relay clock is the only time used for windows.
  - Fingerprint index lost after restart; it is rebuilt from the index within 5 minutes and duplicate checks run in degraded mode (exact hash only) meanwhile.
  - Many different new keys posting the same text in 24 h; coordinated flag is raised with the number of distinct keys but no key is penalized beyond signals.
  - The author's own pre-sign check scores a draft 70; F01.S01.M03 holds the draft for confirmation; no event is emitted and no fingerprint is stored for an unsigned draft.
ux:
  notes: "Headless library. Visible surfaces are the relay moderator case view (heuristic names and values for flagged submissions), the author's publish confirmation (shown by F01.S01.M03 from the pre-sign result) and an optional local feed filter setting 'Fold likely spam' (off by default) showing a 'Folded: likely spam, show' row."
  screens:
    - "Relay moderator case view: spam panel listing heuristic, threshold, measured value and score contribution."
    - "Settings > Safety: toggle 'Fold likely spam in my feed' with a short explanation and list of recently folded items."
  states: [off, on, folded-item, shown-anyway, degraded]
  a11y:
    - "Folded rows are announced as 'Folded: likely spam' with an accessible button to show the item."
    - Toggle has a visible label and is operable by keyboard.
    - Scores are conveyed as text, not color alone.
processes:
  domain_schema:
    note: "Owns no catalog entities. Derived per-store indexes, never exported and rebuilt from the relay index or the vault: fingerprints (tenant, subject key hash, normalized sha256, simhash64, targetCid, receivedAt, claimedCreatedAt?) kept 30 days (RET-SHORT), and key observations (tenant, subject key hash, firstSeenAt, lastSeenAt) kept 30 days after lastSeenAt (RET-SHORT). The key hash is HMAC-SHA-256 with a store-local salt, so indexes of two stores cannot be joined."
    entities: []
    requirements:
      - The module owns no persistent entities; all inputs are signed projections or local records and results are events carrying the evidence values.
      - The derived fingerprint index stores only hashes and counters, never text, and expires entries after 30 days.
      - Every result records the heuristic set version and thresholds used so decisions can be reproduced.
      - Fingerprint and key-observation rows key the subject by a store-salted hash; the subject did:key appears only in the query input and in the store-local P2 event, never in an index row or a log.
  validation_rules:
    requirements:
      - Inputs are validated for size and encoding before evaluation, and oversized input is rejected rather than truncated.
      - Thresholds are configuration with hard minimum and maximum values so an operator cannot disable all heuristics.
      - Evaluation never throws on hostile text and always returns a bounded result.
    rules:
      - "V01 | text is valid UTF-8 and at most 20000 code points after NFKC normalization | PAYLOAD_TOO_LARGE"
      - "V02 | thresholds are within allowed ranges (duplicate window 1..30 days, link density 0.05..0.50, velocity 3..100 per 10 minutes, new-key window 1..14 days) | VALIDATION_FAILED"
      - "V03 | the caller supplies mode, the subject did:key and the store's receipt time; a claimed createdAt is optional and only feeds backdated_claim | VALIDATION_FAILED"
      - "V04 | mode author_presign is accepted only in the local principal's vault for the principal's own key, and relay_intake only from the relay index-intake hook | FORBIDDEN"
  workflow_state_machine:
    note: "Stateless evaluation; no entity lifecycle. Throttle windows are owned by F12.S03.M03."
    machines: []
    requirements:
      - Evaluation is a pure function of input, fingerprint index snapshot and configured thresholds, and has no lifecycle.
      - A throttle recommendation expires after at most 1 hour and is renewed only by new evidence.
      - A degraded mode with exact-hash checks only is used while the index rebuilds, and results record degraded true.
      - Velocity counts every first-seen content id by the store's receipt time regardless of its claimed createdAt, and a gap of more than 24 h between claimed createdAt and receipt time adds the backdated_claim heuristic instead of excluding the statement.
    timeouts:
      - "Fingerprint index entries expire after 30 days and key observations 30 days after lastSeenAt; an hourly sweep removes expired entries."
  commands_queries_events:
    note: "No commands. One in-process query, moderation.spam.evaluate, used by F01.S01.M03 before signing (author_presign), by the relay index-intake hook before a projection is indexed (relay_intake) and by the vault feed filter (vault_filter); it is never routable over HTTP."
    commands: []
    requirements:
      - The SpamEvaluator port evaluate(input) is exposed in-process as the query moderation.spam.evaluate, returning score, heuristics, throttle?, rulesVersion and degraded, with no side effects except the fingerprint and key-observation indexes and, for relay_intake and vault_filter, the event.
      - moderation.spam.detected is emitted only when score ≥ 50 in relay_intake or vault_filter mode, never for an author's pre-sign check, with throttle only when the velocity heuristic matched.
      - The relay index-intake hook passes the projection text before indexing, and the store's own first observation of a key (identity.session.started on a relay, federation.record.accepted in a vault) starts the new-key window; identity.account.created is never used for other keys.
      - moderation.spam.detected carries the subject did:key (a pseudonymous public key, P2, never leaving the store per EVT-8) so F12.S02.M01, F12.S03.M02 and F12.S03.M03 act on the same key, and hashing is used only inside the indexes and logs.
      - In author_presign mode the query reads the author's own local publication history, writes nothing and emits nothing, and its output contract is the one F01.S01.M03 tests against (N19).
      - "The mode enum of moderation.spam.detected (relay_intake, vault_filter) is a stable v1 vocabulary bound by the F18.S02.M02 transparency dimension spam_detected (relay_intake only, throttled when a throttle is present) and its contract test T22; author_presign never appears in the event, and adding, renaming or removing a mode is a breaking change that needs a new major event schema (CTR-SCH-001 SCH-3) coordinated with F18.S02.M02."
    queries:
      - name: moderation.spam.evaluate
        capability: moderation.spam.evaluate
        input: "{ mode: author_presign|relay_intake|vault_filter, subjectKey: did:key, targetType (listing_publication for the F01.S01.M03 author_presign call, the projection type otherwise), targetId?, targetCid?, text, links?: string[], receivedAt (store clock), claimedCreatedAt? }"
        output: "{ score: 0..100, heuristics: { name, value, threshold, points }[], throttle?: { capabilityClass, ttlMs ≤ 3600000 }, rulesVersion, degraded: boolean }"
        errors: [VALIDATION_FAILED, PAYLOAD_TOO_LARGE, FORBIDDEN]
    events_produced:
      - {type: moderation.spam.detected, privacy: P2, payload: "{ subjectKey: did:key, mode: relay_intake|vault_filter, targetType, targetId, targetCid, score, heuristics: string[], throttle?: { capabilityClass, ttlMs }, rulesVersion, degraded } — store-local (EVT-8): relay-local on a relay, vault-local in a vault; never federated or sent to notification channels"}
    events_consumed:
      - {type: identity.session.started, effect: "relay, kind relay_token: record the first observation of did in the key-observation index when absent, starting the new-key window on this relay"}
      - {type: federation.record.accepted, effect: "vault: record the first observation of the author key and, for listing records of other authors, read the accepted projection and run vault_filter mode for the local fold setting; relay: record the first observation of the author key"}
    errors: []
    example: |
      query moderation.spam.evaluate (relay index-intake hook, in-process)
      { "mode": "relay_intake", "subjectKey": "did:key:z6MkPosterExample", "targetType": "listing", "targetCid": "sha256-aa01…", "receivedAt": "2026-11-04T10:00:00Z", "claimedCreatedAt": "2026-11-03T09:00:00Z", "text": "BUY NOW http://a.example http://b.example …" }
      -> { "score": 72, "heuristics": [ { "name": "link_density", "value": 0.31, "threshold": 0.2, "points": 30 }, { "name": "duplicate_exact", "value": 3, "threshold": 2, "points": 32 }, { "name": "backdated_claim", "value": 25, "threshold": 24, "points": 10 } ], "throttle": null, "rulesVersion": "spam/1.2", "degraded": false }
      event moderation.spam.detected { "subjectKey": "did:key:z6MkPosterExample", "mode": "relay_intake", "score": 72, "heuristics": ["link_density", "duplicate_exact", "backdated_claim"], "rulesVersion": "spam/1.2", "degraded": false }
  authorization_capabilities:
    note: "Heuristic configuration is changed through relay operator configuration owned by F15.S04.M02; thresholds are read by this module."
    requirements:
      - The evaluator is reachable only in-process through the query moderation.spam.evaluate, which is not routable over HTTP, so it has no member-facing capability.
      - Configuration changes to thresholds require the relay operator role and are written to the audit log of F16.S01.M01.
      - Results visible to a member are limited to their own folded items in their own vault.
    capabilities:
      - "moderation.spam.evaluate | local principal, operator | in-process only: the unlocked local principal's vault for author_presign on its own key and vault_filter, or the relay index-intake hook for relay_intake; not routable over HTTP"
  failure_recovery_idempotency:
    requirements:
      - Evaluation is idempotent for the same input and index snapshot, and events are deduplicated on (targetCid, rulesVersion).
      - Index updates and the detection event commit in one store transaction.
      - Index loss degrades to exact-hash mode and recovers automatically without operator action.
    idempotency: "Event dedupe key (targetCid, rulesVersion); repeated evaluation of the same projection updates no counters twice because the index records targetCid; author_presign writes nothing."
    concurrency: "Index writes use upsert on (tenant, keyHash, targetCid); velocity counters use the F12.S03.M03 atomic increment; parallel evaluations of one projection are safe."
    retries: "Event delivery follows CTR-EVT-001 retry rules; evaluation itself is not retried."
    offline: "author_presign and the vault filter work fully offline over locally held records; relay-side heuristics need no vault."
    partial_failure: "If the signal store is unavailable the event still fires from the outbox later; if the index is unavailable evaluation returns degraded true rather than failing intake or publication."
  privacy_retention_abuse:
    requirements:
      - Only hashes, counters and heuristic names are stored; text is processed in memory and never logged.
      - Fingerprint entries are RET-SHORT (30 days) and keyed by a salted key hash so they cannot be joined across relays.
      - Heuristic gaming and false positives are limited by explainable results, no automatic bans and operator-tunable bounded thresholds.
    data:
      - "Fingerprint and key-observation indexes: P2 derived hashes, per store."
      - "moderation.spam.detected: P2 with the subject did:key, store-local, consumed by F12.S03.M02, F12.S02.M01 and F12.S03.M03 only."
      - "Pre-sign results: returned to the author's own vault only, never stored or sent."
    retention:
      - "Fingerprints: 30 days (RET-SHORT); key observations 30 days after last observation (RET-SHORT)."
      - "Events: per signal retention in F12.S03.M02."
    threats:
      - "T01 | Spammer evades exact-hash checks by small edits | simhash with Hamming distance ≤ 3 on 64-bit hashes catches near duplicates"
      - "T02 | Attacker triggers throttles against a competitor by posting from lookalike keys | throttle applies only to the posting key's own intake and expires in 1 hour; no signal is attributed to other keys"
      - "T03 | Heuristics used to censor legitimate sellers of many similar items | results are signals with visible evidence, throttles are short, removal needs a human or a published deterministic rule"
      - "T04 | Regex or hash complexity attacks with hostile text | input capped at 20000 code points; linear-time heuristics only; evaluation timeout 50 ms"
      - "T05 | Backdated createdAt to escape velocity | velocity uses store receipt time for every first-seen content id; backdating adds backdated_claim"
      - "T06 | Joining spam indexes across relays to track a key | per-store salts; the did:key appears only in store-local events"
    abuse_controls:
      - "Velocity throttle maximum 1 hour; renewable only with fresh evidence."
      - "Operator thresholds are clamped to allowed ranges (V02)."
  observability_performance:
    requirements:
      - Evaluation outcomes and timing are measured per CTR-OBS-001 on relays and kept as local diagnostics in the vault.
      - Evaluation meets p95 ≤ 20 ms for 20000 code points on a relay and ≤ 50 ms on a Moto G-class device.
      - Degraded mode and index size are observable.
    metrics:
      - "classrup_moderation_spam_evaluations_total{mode,outcome=clean|detected|degraded}"
      - "classrup_moderation_spam_score_bucket (histogram 0..100)"
      - "classrup_moderation_spam_index_entries (gauge)"
    logs:
      - "relay info spam.detected {targetCid, score, heuristics, correlationId} — no text, no raw keys."
    budgets:
      - "evaluate p95 ≤ 20 ms (relay) and ≤ 50 ms (Moto G profile) for 20000 code points."
      - "Index rebuild of 100 000 entries completes in ≤ 5 minutes."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Heuristics are covered by deterministic fixtures with expected scores.
      - Event payloads are validated against the schema registry.
    fixtures: "Corpus of 200 labelled texts (100 clean, 100 spam) in 6 scripts, fixed clock 2026-11-04T10:00:00Z, index snapshots with 0, 1 and 4 prior duplicates, relay X and vault V with an injectable clock."
    tests:
      - "T01 | unit | 02.R01,02.R02 | oversized text; out-of-range thresholds; operator config that would disable every heuristic | PAYLOAD_TOO_LARGE without truncation; VALIDATION_FAILED; values clamped to minimums so heuristics stay active"
      - "T02 | unit | 03.R01 | duplicate window and simhash distance 3 and 4 on fixed snapshots | distance 3 flagged duplicate_near, distance 4 not"
      - "T03 | property | 01.R01,01.R03,02.R03,03.R01,06.R01 | random and hostile texts evaluated twice with the same index snapshot | identical output including rulesVersion and thresholds; no exceptions; score within 0..100; bounded runtime"
      - "T04 | unit | 04.R02 | link density on zero-length and unspaced scripts; score 49 and 50 in relay_intake; score 90 in author_presign | no division by zero; event only at ≥ 50 in relay_intake; no event for author_presign"
      - "T05 | contract | 04.R01,09.R02,09.R03 | evaluate output and moderation.spam.detected; corpus fixtures | validate against registry schemas; fixtures produce their expected scores"
      - "T06 | integration | 04.R03,06.R01 | relay index-intake hook with projection text; identity.session.started delivered twice; federation.record.accepted for a listing in a vault with fold on | evaluated before indexing; first observation recorded once; vault filter folds the listing; no identity.account.created consumer exists"
      - "T07 | abuse | 05.R01,05.R02,05.R03 | HTTP request to moderation.spam.evaluate; author_presign for another key; non-operator changes thresholds; member reads another vault's folded items | no route; FORBIDDEN; FORBIDDEN; only own folded items"
      - "T08 | chaos | 06.R02,06.R03,03.R03 | index lost mid-run; signal store down; crash between index write and event | degraded true with exact-hash mode; recovery within 5 minutes; index row and event both present or both absent; events delivered later"
      - "T09 | abuse | 07.R01 | hostile regex-like text of 20000 code points | evaluation under 50 ms; no text in logs or index rows"
      - "T10 | integration | 03.R02 | throttle recommended then 61 minutes pass | throttle expired; no persistent penalty from this module"
      - "T11 | load | 08.R01,08.R02,08.R03 | 200 evaluations per second for 5 minutes at 20000 code points; rebuild 100 000 entries; degraded episode | p95 ≤ 20 ms relay, rebuild ≤ 5 minutes, degraded and index metrics exported"
      - "T12 | unit | 09.R01 | traceability tool run | every PS-097 requirement maps to a passing test"
      - "T13 | integration | 10.R01,10.R02 | export, import and backup restore; import of out-of-range thresholds | index absent from export and rebuilt after restore; configuration round-trips; out-of-range values rejected"
      - "T14 | integration | 10.R03 | rulesVersion spam/1.3 in shadow mode for 7 days next to spam/1.2 | both versions score every input; only spam/1.2 emits events; comparison metrics exported; rollback by configuration; spam/1.2 results stay readable"
      - "T15 | abuse | 03.R04 | 20 fresh statements with createdAt −25 h received within 10 minutes; one replayed content id | velocity triggers on receipt time and backdated_claim is added; the replay is not counted twice"
      - "T16 | contract | 04.R04 | spam.detected with throttle at score 85 delivered to F12.S03.M03, F12.S03.M02 and F12.S02.M01 contract fixtures | the posting key's write bucket gets penalty 0.25, a spam_detected signal is recorded for subjectKey and a case is opened for the same subjectKey"
      - "T17 | contract | 04.R05 | F01.S01.M03 contract fixture evaluates a draft in author_presign mode before signing | output has score, heuristics, rulesVersion and degraded; no event and no index row written"
      - "T18 | unit | 01.R02,01.R04,07.R02 | inspect index rows after evaluations on relays X and Y; injected clock 31 days later | only hashes and counters; key hashes differ between X and Y; entries expired"
      - "T19 | abuse | 07.R03 | legitimate seller posts 12 variant listings in an hour | signal and at most a 1 hour throttle; no removal or suspension"
      - "T20 | contract | 04.R06 | compare the mode enum and throttle field of the moderation.spam.detected schema with the F18.S02.M02 spam_detected dimension fixture; author_presign evaluation; a schema fixture that adds a mode within v1 | identical values (relay_intake, vault_filter) and throttle optional; no event for author_presign; the added mode fails the contract check"
    acceptance:
      - All tests T01–T20 pass in CI.
      - On the labelled corpus, recall ≥ 80% and false-positive rate ≤ 2% at score threshold 50.
      - No heuristic result ever causes removal, suspension or ban without a human or published rule in F12.S02.M01.
  import_export_backup_rollback:
    requirements:
      - The fingerprint index is derived data and is excluded from user exports and from backups.
      - Operator threshold configuration is exported with relay configuration and validated on import against allowed ranges.
      - Heuristic changes are versioned in rulesVersion and old versions stay readable for audit for 180 days.
    export: "No user data is exported; relay configuration export contains thresholds and rulesVersion."
    import: "Thresholds import only within allowed ranges; out-of-range values are rejected with VALIDATION_FAILED."
    backup: "Indexes excluded from backup (rebuilt); configuration covered by relay backup (CTR-IOX-001 IOX-3)."
    migration_rollback: "A new rulesVersion runs in shadow mode for 7 days comparing scores before activation; rollback restores the previous version by configuration without data migration."
