    acceptance:
      - All tests T01–T21 pass in CI.
      - No signal row is ever modified before expiry, and no counterparty action removes signals from another person's vault.
      - Decayed totals match the closed-form formula within 1e-9 in property tests.
  import_export_backup_rollback:
    requirements:
      - A user's vault export includes the signals recorded in their vault; relay signals about a subject are exported only to relay operators under legal hold.
      - Imported signals are marked with source import, capped at weight 20 per source and never inflate decay.
      - Schema changes follow expand/contract and keep v1 readable for 180 days.
    export: "Section moderation.signals in classrup-export/v1 (vault only, ExportSectionPort): one line per unexpired signal including sourceKey and reason text for manual ones."
    import: "Signals import with sourceModule import and weight clamped to ±20; duplicates by (kind, sourceEventId) are skipped; expired ones are dropped; signals about the importing principal are dropped."
    backup: "Vault export is the backup; relay SQLite backup (CTR-IOX-001 IOX-3) covers relay signals."
    migration_rollback: "Additive fields only in v1 (sourceKey, kinds refund_agreed, report_dismissed, damage_agreed and proximity_pattern); the mapping table moves from signals/2 to signals/3 for new events only (rentals.damage.resolved replaces rentals.damage.claimed, whose stored damage_claimed rows are read as damage_agreed until they expire; no-show contradictions; host-policy actions skipped; module table); rollback is safe because older readers ignore new optional fields and unknown kinds count as manual_concern with weight 0."
