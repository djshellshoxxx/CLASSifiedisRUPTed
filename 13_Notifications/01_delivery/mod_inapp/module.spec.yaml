id: F13.S01.M03
scope: MVP
summary: >-
  The in-app notification inbox. It runs in the user's vault while the app is open: local domain events derived
  from the user's own commands and from verified signed statements of other parties are mapped by a routing table
  to content-free Notifications (category, template key, reference), deduplicated and collapsed, filtered by the
  in-app column of the preference matrix, and shown with read state. Texts are rendered on the device from the
  template key and local data. Security notifications are always on. Nothing here needs a relay; push and email
  are separate channels fed by relays.
responsibilities:
  - Own the Notification record (category, template key, reference, collapse key, count, read state) in the vault.
  - Own the routing table that maps domain events to category, template key, recipient rule, urgency class and collapse key, listed in events_consumed below.
  - Deduplicate by event ID, collapse repeated alerts with the same template and collapse key within 10 minutes, and cap the inbox at 500 items.
  - Respect the in-app preference column of F13.S02.M04 for every category except security.
  - Provide mark-read, mark-all-read, list and unread-count operations and emit notify.notification.created and notify.notification.read for the gate and badge consumers.
non_responsibilities:
  - Deciding whether an alert leaves the device as OS alert, push or email (F13.S02.M01).
  - Preferences, consent and schedules (F13.S02.M04, F13.S02.M03, F13.S02.M02).
  - Message content; the inbox shows only templates and references and the thread screens show content.
  - Mute per thread (F08.S01.M02) beyond reading it as an input to the routing rule for comms.message.received.
  - "Future: server-synchronized read state across devices, rich actions inside notifications, a discovery category for saved-search matches."
depends_on: [F13.S02.M04, F08.S01.M01, F08.S01.M02, F08.S03.M03, CTR-FED-001, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-PRV-001, CTR-IDM-001, CTR-OBS-001]
user_stories:
  - As a seller, I see in my inbox that a buyer made an offer and tapping opens that offer.
  - As a member, I see one collapsed entry for ten new messages in one thread instead of ten entries.
  - As a member, I always see security notices, for example a new device key was added.
  - As a member, I can mark everything as read in one tap and the badge goes to zero.
edge_cases:
  - Event is delivered twice (at-least-once); the second delivery is skipped because the event ID is already in the consumer inbox.
  - A verified statement from a blocked user arrives; no notification is created.
  - A thread is muted; message alerts for that thread are created silently marked muted and never cause OS alerts, push or email.
  - The inbox reaches 500 items; the oldest read items are removed first, then the oldest unread non-security items; security items are removed last and only after 30 days.
  - Event concerns an actor other than the local principal (for example another participant's offer on a listing not owned); no notification is created because the recipient rule fails.
  - The user's own action produces an event (they accepted the offer); no notification is created for the actor.
  - Preference for a category is off for in-app; the notification is not created but a hidden counter increments for diagnostics, except security which ignores the preference.
  - App starts after being closed for a week; events derived from statements received during fetch are routed in order and collapsed, and notifications older than 30 days are never created.
ux:
  screens:
    - "Inbox: list newest first grouped by day, each item with category icon and label, rendered title and short line from the template, count badge when collapsed, unread dot, tap opens the referenced screen."
    - "Badge on the app icon and nav item showing unread count capped at 99+."
    - "Empty state: No notifications yet with a link to notification settings."
  states: [loading, empty, unread, all-read, muted-item, offline, ref-unavailable]
  a11y:
    - Inbox is a list; each item has an accessible name composed of category, title and time, and unread state is text not only a dot.
    - Mark all read is a button with a live region announcement of the new count.
    - Items are reachable by keyboard, with targets of at least 44 by 44 px.
processes:
  domain_schema:
    requirements:
      - A Notification stores the recipient DID, category, template key, a content-free reference (type and opaque ID), collapse key, collapsed count, urgency class, read state, source event ID and times, with tenant and revision per CTR-ID-001.
      - Notifications are P2 vault records that never contain message text, names or amounts; titles and lines are rendered at display time from the template key and data the vault already holds, and retention is RET-SHORT with a cap of 500 items.
      - Urgency class is normal or urgent where urgent is allowed only for the security category.
    entities:
      - name: Notification
        schema: classrup.notify.notification/v1
        storage: device
        privacy: P2
        retention: RET-SHORT
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — tenant scope"
          - "userDid: did:key — recipient, always the local principal"
          - "category: enum — offers | cycles | messages | auctions | bookings | moderation | security"
          - "templateKey: string — notify.tpl.<category>.<name>, ≤ 80 characters"
          - "ref?: object — { type: enum listing|offer|proposal|cycle|thread|auction|booking|rental|deal|case|account, id: uuidv7 }"
          - "collapseKey?: string — ≤ 64 characters from a-z A-Z 0-9 - _ ."
          - "count: int — 1..9999, number of collapsed events"
          - "urgency: enum — normal | urgent"
          - "muted: boolean — true when the thread or category is muted so no OS alert is allowed"
          - "sourceEventIds: array — last 20 source event IDs for dedupe, each uuidv7"
          - "status: enum — unread | read"
          - "createdAt: timestamp — local clock, RFC 3339 UTC"
          - "updatedAt: timestamp — local clock, bumped on collapse"
          - "readAt?: timestamp — local clock"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - At most one unread Notification per (userDid, templateKey, collapseKey) created within a 10-minute collapse window.
          - urgency urgent implies category security.
          - No field holds free text; ref.type and template key come from fixed registries.
  validation_rules:
    requirements:
      - Routing validates event shape, recipient rule and registry membership before a notification is created.
      - Read operations validate ownership and revision.
      - Every violation maps to one stable error code.
    rules:
      - "V01 | event type has a routing table row and the payload contains the fields the row needs | VALIDATION_FAILED"
      - "V02 | the recipient rule selects the local principal and the actor of the event is not the local principal | NOT_FOUND"
      - "V03 | templateKey and ref.type are in the registries | VALIDATION_FAILED"
      - "V04 | urgency urgent only for category security | VALIDATION_FAILED"
      - "V05 | the sender or actor is not blocked in the local block list | BLOCKED_PARTY"
      - "V06 | source event ID not yet seen in the consumer inbox | CONFLICT_STATE"
      - "V07 | mark_read expectedRevision matches and notification belongs to the local principal | CONFLICT_REVISION"
      - "V08 | event time is not older than 30 days at creation | EXPIRED"
  workflow_state_machine:
    requirements:
      - A Notification starts unread and becomes read; collapsing keeps it unread and increments count, and a read notification is never reopened except by a new collapse window starting a new row.
      - Deletion by cap or retention is not a state; rows are physically removed with a local tombstone count.
      - Read is terminal for the row, and new matching events after the collapse window create a new unread row.
    machines:
      - entity: Notification
        initial: unread
        terminal: [read]
        transitions:
          - "unread -> unread | matching event within 10 minutes with the same collapse key | count + 1, updatedAt bumped; emits notify.notification.created with collapsed true"
          - "unread -> read | notify.notification.mark_read, mark_all_read, or opening the referenced screen | readAt set; emits notify.notification.read"
    timeouts:
      - "Collapse window 10 minutes from createdAt of the unread row."
      - "Rows older than 30 days are removed by a daily local sweep (security rows 30 days as well; counts kept)."
  commands_queries_events:
    requirements:
      - Creation is a vault-internal command invoked by the routing consumers; mark-read and mark-all-read are vault commands; list and unread-count are vault queries.
      - Creation and read emit their events in the same IndexedDB transaction as the row change (CTR-EVT-001 EVT-8).
      - The routing table below is the complete set of routed events; every listed event exists in the module catalog emits.
    commands:
      - name: notify.notification.create
        capability: notify.notification.create
        input: "[vault internal command called by the routing consumers] { sourceEventId, category, templateKey, ref?, collapseKey?, urgency?, muted? }"
        output: "{ notificationId, created: boolean, collapsed: boolean, count }"
        errors: [VALIDATION_FAILED, NOT_FOUND, BLOCKED_PARTY, CONFLICT_STATE, EXPIRED]
        emits: [notify.notification.created]
        idempotent: true
      - name: notify.notification.mark_read
        capability: notify.notification.mark_read
        input: "[vault command] { notificationId, expectedRevision }"
        output: "{ notificationId, status: read, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [notify.notification.read]
        idempotent: true
      - name: notify.notification.mark_all_read
        capability: notify.notification.mark_read
        input: "[vault command] { category?, beforeTimestamp }"
        output: "{ marked, unreadCount }"
        errors: [VALIDATION_FAILED]
        emits: [notify.notification.read]
        idempotent: true
    queries:
      - name: notify.notification.list_mine
        capability: notify.notification.read_own
        input: "[vault query] { status?: unread|all, category?, cursor?, limit ≤ 50 }"
        output: "{ items: Notification[], nextCursor? }"
        errors: []
      - name: notify.notification.unread_count
        capability: notify.notification.read_own
        input: "[vault query] {}"
        output: "{ total, byCategory: { offers, cycles, messages, auctions, bookings, moderation, security } }"
        errors: []
    events_produced:
      - {type: notify.notification.created, privacy: P2, payload: "{ notificationId, category, templateKey, ref?, urgency, collapsed, count, muted }"}
      - {type: notify.notification.read, privacy: P2, payload: "{ notificationId, category, readAt }"}
    events_consumed:
      - {type: bazaar.offer.made, effect: "category offers; template notify.tpl.offers.made; recipient the seller; collapse key offerListingId"}
      - {type: bazaar.offer.accepted, effect: "category offers; template notify.tpl.offers.accepted; recipient the buyer; collapse key offerId"}
      - {type: bazaar.offer.rejected, effect: "category offers; template notify.tpl.offers.rejected; recipient the buyer; collapse key offerId"}
      - {type: bazaar.offer.expired, effect: "category offers; template notify.tpl.offers.expired; recipient buyer and seller; collapse key offerId"}
      - {type: bazaar.negotiation.countered, effect: "category offers; template notify.tpl.offers.countered; recipient the other party; collapse key negotiationId"}
      - {type: commerce.deal.opened, effect: "category offers; template notify.tpl.offers.deal_opened; recipient the counterparty; collapse key dealId"}
      - {type: commerce.payment.claimed, effect: "category offers; template notify.tpl.offers.payment_claimed; recipient the payee; collapse key dealId"}
      - {type: commerce.payment.acknowledged, effect: "category offers; template notify.tpl.offers.payment_acknowledged; recipient the payer; collapse key dealId"}
      - {type: commerce.payment.disputed, effect: "category offers; template notify.tpl.offers.payment_disputed; recipient the other party; collapse key dealId"}
      - {type: comms.message.received, effect: "category messages; template notify.tpl.messages.new; recipient the local principal; collapse key threadId; muted true when the thread is muted"}
      - {type: mutiny.cycle.proposed, effect: "category cycles; template notify.tpl.cycles.proposed; recipient each participant except the proposer; collapse key cycleId"}
