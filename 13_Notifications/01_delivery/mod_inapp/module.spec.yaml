id: F13.S01.M03
scope: MVP
summary: >-
  The in-app notification inbox. It runs in the user's vault while the app is open or while the service worker
  processes a wake-up: local domain events derived from the user's own commands and from verified signed statements of
  other parties are mapped by a routing table to content-free Notifications (category, template key, reference),
  filtered through the block list of F07.S02.M02, deduplicated and collapsed, filtered by the in-app column of the
  preference matrix, and shown with read state. Every routing decision, with or without an inbox row, is handed to
  the vault gate through NotificationDispatchPort, so push and email follow their own matrix columns. Texts are
  rendered on the device from the template key and local data. Security notifications are always on and are raised
  for changes made on the user's other devices. Nothing here needs a relay.
responsibilities:
  - Own the Notification record (category, template key, reference, collapse key, count, muted flag, actor class, read state) and the vault-local known-actor index used for flood budgets.
  - Own the routing table that maps domain events to category, template key, recipient rule over producer payload fields, filters, urgency class and collapse key, listed in events_consumed below.
  - Drop events from blocked DIDs silently through F07.S02.M02 filterBlocked and isBlockedEither (N7) before any row or dispatch decision.
  - Deduplicate by event ID, collapse repeated alerts with the same template and collapse key within 10 minutes, cap the inbox at 500 items and apply per-actor and new-actor flood budgets.
  - Respect the in-app preference column of F13.S02.M04 for every category except security, and hand every routing decision to NotificationDispatchPort (declared here, implemented by F13.S02.M01) for OS alert, push and email decisions.
  - Provide mark-read, mark-all-read, list and unread-count operations and emit notify.notification.created and notify.notification.read for the gate and badge consumers.
non_responsibilities:
  - Deciding whether an alert leaves the device as OS alert, push or email, quiet hours and sealing (F13.S02.M01).
  - Preferences, consent and schedules (F13.S02.M04, F13.S02.M03, F13.S02.M02).
  - Message content; the inbox shows only templates and references and the thread screens show content.
  - Mute per thread (F08.S01.M02) beyond reading it as an input to the routing rule for comms.message.received.
  - Block list storage (F07.S02.M02); this module only calls its filter functions.
  - "Future: synchronized read state across the user's devices, rich actions inside notifications, a discovery category for saved-search matches."
depends_on: [F13.S02.M04, F07.S02.M02, F08.S01.M01, F08.S01.M02, F08.S03.M03, F12.S03.M03, F10.S01.M02, F10.S01.M03, F10.S01.M04, F10.S02.M02, CTR-FED-001, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-PRV-001, CTR-IDM-001, CTR-OBS-001, CTR-FLG-001]
user_stories:
  - As a seller, I see in my inbox that a buyer made an offer and tapping opens that offer.
  - As a member, I see one collapsed entry for ten new messages in one thread instead of ten entries.
  - As a member, I always see security notices, for example a new device key was added from my other phone.
  - As a party to a deal, booking or rental, I am told when it completes.
  - As a member, I can mark everything as read in one tap and the badge goes to zero.
edge_cases:
  - Event is delivered twice (at-least-once); the second delivery is acknowledged as a duplicate skip because the event ID is already in the consumer inbox, and it is never retried.
  - A verified statement from a blocked user arrives; no notification and no dispatch decision is created, silently (N7).
  - A thread is muted; message rows for that thread are created marked muted and never cause OS alerts, email or vault-originated push; a content-free wake push for the mailbox arrival may still reach the device, where the service worker shows no alert once the vault has routed the message, and shows only the generic activity alert while the vault is locked, which the settings disclose.
  - The inbox reaches 500 items; read rows are removed first, then rows from unknown actors, then the oldest unread non-security rows from known counterparties; security rows are removed last and only after 30 days.
  - Event concerns another participant only (for example another buyer's offer on a listing not owned); it is skipped with outcome not_recipient.
  - The user's own action produces an event (they accepted the offer); no row is created for the actor, and the counterparty is recorded in the known-actor index.
  - The user links a new device key on device B; device A derives identity.device_key.added from the verified device-link statement signed on device B and creates an urgent security row, while device B itself shows none.
  - Vault locks on idle timeout, or keys rotate on schedule; identity.session.revoked with reason idle, locked, absolute, rotated, limit or erased is skipped with outcome filtered.
  - Preference for a category is off for in-app; no row is created but the decision still reaches NotificationDispatchPort so push and email follow their own columns; security ignores the in-app preference.
  - 600 freshly created DIDs each send one offer; after 20 rows in the offers category in one day the rest collapse into one row N new from new members, and every pre-existing unread row survives.
  - App starts after being closed for a week; events derived from statements received during fetch are routed in order and collapsed, and notifications older than 30 days are skipped with outcome expired.
ux:
  screens:
    - "Inbox: list newest first grouped by day, each item with category icon and label, rendered title and short line from the template, count badge when collapsed, unread dot, tap opens the referenced screen."
    - "Badge on the app icon and nav item showing unread count capped at 99+."
    - "Empty state: No notifications yet with a link to notification settings."
  states: [loading, empty, unread, all-read, muted-item, offline, ref-unavailable]
  a11y:
    - Inbox is a list; each item has an accessible name composed of category, title and time, and unread state is text not only a dot.
    - Mark all read is a button with a live region announcement of the new count.
    - Items are reachable by keyboard, with targets of at least 44 by 44 px.
processes:
  domain_schema:
    requirements:
      - A Notification stores the recipient DID, category, template key, a content-free reference (type and opaque ID taken from the producer payload), collapse key, collapsed count, urgency class, muted flag, actor class (known or unknown), arrival path, read state, source event IDs and times, with tenant and revision per CTR-ID-001.
      - Notifications are P2 vault records that never contain message text, names or amounts; titles and lines are rendered at display time from the template key and data the vault already holds, and retention is RET-SHORT with a cap of 500 items.
      - Urgency class is normal or urgent where urgent is allowed only for the security category and only for the fixed urgent templates device_added, device_revoked and recovery_completed.
      - A vault-local known-actor index (salted SHA-256 hashes of DIDs with first interaction time, at most 5 000 entries, RET-STANDARD) records counterparties of the local principal's own actions and of opened notifications, so flood budgets and eviction can tell known counterparties from new actors.
    entities:
      - name: Notification
        schema: classrup.notify.notification/v1
        storage: device
        privacy: P2
        retention: RET-SHORT
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — local vault scope"
          - "userDid: did:key — recipient, always the local principal"
          - "category: enum — offers | cycles | messages | auctions | bookings | moderation | security"
          - "templateKey: string — notify.tpl.<category>.<name>, ≤ 80 characters"
          - "ref?: object — { type: enum listing|offer|negotiation|proposal|cycle|thread|auction|quote|booking|rental|deal|meetup|case|appeal|export, id: string ≤ 64 characters from the producer payload }"
          - "collapseKey?: string — ≤ 64 characters from a-z A-Z 0-9 - _ . taken from the producer payload field named by the routing row"
          - "count: int — 1..9999, number of collapsed events"
          - "urgency: enum — normal | urgent"
          - "muted: boolean — true when the thread or category is muted so no OS alert, email or vault-originated push is allowed"
          - "actorClass: enum — known | unknown | system"
          - "arrival: enum — mailbox | direct | local — how the source statement reached the vault"
          - "sourceEventIds: array — last 20 source event IDs for dedupe, each uuidv7"
          - "status: enum — unread | read"
          - "createdAt: timestamp — local clock, RFC 3339 UTC"
          - "updatedAt: timestamp — local clock, bumped on collapse"
          - "readAt?: timestamp — local clock"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - At most one unread Notification per (userDid, templateKey, collapseKey) created within a 10-minute collapse window.
          - urgency urgent implies category security and one of the three fixed urgent templates.
          - No field holds free text; ref.type and template key come from fixed registries.
  validation_rules:
    requirements:
      - Routing validates event shape against the producer payload fields named by the routing row and registry membership before a notification is created; malformed input fails with VALIDATION_FAILED.
      - Everyday non-delivery outcomes - not a recipient, own action, blocked sender, duplicate, expired, filtered and category off - are successful skips returning created false with a skipped reason, counted in diagnostics and never retried or dead-lettered (CTR-EVT-001 EVT-3).
      - Every violation maps to one stable error code.
      - Security rows are exempt from the actor exclusion and are skipped only when the event was raised by a command on this device, so changes made by another device of the same principal always alert this device.
    rules:
      - "V01 | the event type has a routing row and the payload contains every field the row names (recipient, reference, collapse key and filter fields) under the producer's field names | VALIDATION_FAILED"
      - "V02 | recipient fields are did:key values; when the recipient rule does not select the local principal, or for non-security rows the actor is the local principal, the event is skipped with outcome not_recipient (success, no error) | VALIDATION_FAILED"
      - "V03 | templateKey and ref.type are in the registries | VALIDATION_FAILED"
      - "V04 | urgency urgent only for the three fixed security templates | VALIDATION_FAILED"
      - "V05 | the actor or sender DID is a did:key; when F07.S02.M02 isBlockedEither reports a block the event is dropped silently with outcome blocked (N7) | VALIDATION_FAILED"
      - "V06 | a source event ID already in the consumer inbox is acknowledged and skipped with outcome duplicate (EVT-3); the same event ID with a different payload hash | IDEMPOTENCY_KEY_REUSED"
      - "V07 | mark_read expectedRevision matches and the notification belongs to the local principal | CONFLICT_REVISION"
      - "V08 | an event older than 30 days is skipped with outcome expired; an occurredAt more than 5 minutes in the future | ID_TIMESTAMP_SKEW"
      - "V09 | row filters are evaluated on producer fields - identity.session.revoked only with reason user_revoked, device_revoked, recovery or passphrase_changed; federation.account.moved only with kind account and subject equal to the local principal; auctions.auction.closed only when outcome is not unsold; bazaar.offer.withdrawn only with reason buyer_withdrew - and non-matching events are skipped with outcome filtered | VALIDATION_FAILED"
  workflow_state_machine:
    requirements:
      - A Notification starts unread and becomes read; collapsing keeps it unread and increments count, and a read notification is never reopened except by a new collapse window starting a new row.
      - Deletion by cap or retention is not a state; rows are physically removed with a local tombstone count.
      - Read is terminal for the row, and new matching events after the collapse window create a new unread row.
    machines:
      - entity: Notification
        initial: unread
        terminal: [read]
        transitions:
          - "unread -> unread | matching event within 10 minutes with the same collapse key | count + 1, updatedAt bumped; emits notify.notification.created with collapsed true"
          - "unread -> read | notify.notification.mark_read, mark_all_read, or opening the referenced screen | readAt set; actor added to the known-actor index; emits notify.notification.read"
    timeouts:
      - "Collapse window 10 minutes from createdAt of the unread row."
      - "Rows older than 30 days are removed by a daily local sweep (security rows 30 days as well; counts kept)."
  commands_queries_events:
    requirements:
      - Creation is a vault-internal command invoked by the routing consumers, which also hand every routing decision to NotificationDispatchPort.route (declared here, implemented by F13.S02.M01) whether or not an inbox row is created; mark-read and mark-all-read are vault commands; list and unread-count are vault queries.
      - Creation and read emit their events in the same IndexedDB transaction as the row change (CTR-EVT-001 EVT-8).
      - The routing table below lists every routed event with category, template, recipient rule over producer payload fields, filters and collapse key, and every listed event exists in the module catalog emits.
      - The routing table includes the N3 completion events commerce.deal.completed, mutiny.cycle.completed, services.booking.completed and rentals.rental.closed, bazaar.offer.withdrawn for the seller, and the vault-local notify.email.bounced as a security notice.
      - The module registers ExportSectionPort (section notify.notifications), DeletionPort (purge step) and RetentionPurgePort (kind notify.notification) with F10 (N6), classifies every field with F10.S02.M02, drops events from blocked DIDs silently through F07.S02.M02 (N7), and keeps its flood budgets in RateLimitPort of F12.S03.M03 in vault-local mode (N18).
    commands:
      - name: notify.notification.create
        capability: notify.notification.create
        input: "[vault internal command called by the routing consumers] { sourceEventId, payloadHash, category, templateKey, ref?, collapseKey?, urgency?, muted?, actorDid?, arrival, raisedOnThisDevice }"
        output: "{ notificationId?, created: boolean, collapsed: boolean, count?, skipped?: not_recipient|blocked|duplicate|expired|filtered|category_off|flood_collapsed }"
        errors: [VALIDATION_FAILED, IDEMPOTENCY_KEY_REUSED, ID_TIMESTAMP_SKEW]
        emits: [notify.notification.created]
        idempotent: true
      - name: notify.notification.mark_read
        capability: notify.notification.mark_read
        input: "[vault command] { notificationId, expectedRevision }"
        output: "{ notificationId, status: read, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: [notify.notification.read]
        idempotent: true
      - name: notify.notification.mark_all_read
        capability: notify.notification.mark_read
        input: "[vault command] { category?, beforeTimestamp }"
        output: "{ marked, unreadCount }"
        errors: [VALIDATION_FAILED]
        emits: [notify.notification.read]
        idempotent: true
    queries:
      - name: notify.notification.list_mine
        capability: notify.notification.read_own
        input: "[vault query] { status?: unread|all, category?, cursor?, limit ≤ 50 }"
        output: "{ items: Notification[], nextCursor? }"
        errors: []
      - name: notify.notification.unread_count
        capability: notify.notification.read_own
        input: "[vault query] {}"
        output: "{ total, byCategory: { offers, cycles, messages, auctions, bookings, moderation, security } }"
        errors: []
    note: >-
      Execution site (ADR-0016): vault only, including the service worker when a push wakes the vault. Ports.
      NotificationDispatchPort.route(decision) is declared here and implemented by F13.S02.M01 at vault composition (no
      depends_on edge, so no cycle); decision = {sourceEventId, notificationId?, category, templateKey, ref?,
      collapseKey?, urgency, muted, arrival, collapsed, actorClass}. It is called after the row transaction commits,
      for every event that was not skipped as not_recipient, blocked, duplicate, expired or filtered, including events
      whose category is off in-app. Recipient rules read only the producer payload fields named below (N4), and the
      actor is the envelope actor or statement author. Arrival comes from provenance: mailbox for statements fetched
      from a relay mailbox, direct for file or QR exchange, local for commands on this device. Flood budgets: 50 rows
      per actor DID per day and, for actors not in the known-actor index, 20 rows per category per day, after which
      events collapse into one row notify.tpl.<category>.new_members with count. Privacy ports (N6): ExportSectionPort
      section notify.notifications with schema classrup.notify.notification/v1; DeletionPort plan {willDelete: all rows
      and the known-actor index, willPseudonymize: none, blockers: none} and step purge; RetentionPurgePort kind
      notify.notification, class RET-SHORT, anchorField createdAt. Every field is classified with F10.S02.M02.
    events_produced:
      - {type: notify.notification.created, privacy: P2, payload: "{ notificationId, category, templateKey, ref?, collapseKey?, urgency, collapsed, count, muted, arrival }"}
      - {type: notify.notification.read, privacy: P2, payload: "{ notificationId, category, collapseKey?, readAt }"}
    events_consumed:
      - {type: bazaar.offer.made, effect: "category offers; template notify.tpl.offers.made; recipient sellerId; actor buyerId; ref offer offerId; collapse key listingId"}
      - {type: bazaar.offer.accepted, effect: "category offers; template notify.tpl.offers.accepted; recipient buyerId; ref offer offerId; collapse key offerId"}
      - {type: bazaar.offer.rejected, effect: "category offers; template notify.tpl.offers.rejected; recipient buyerId; ref offer offerId; collapse key offerId"}
      - {type: bazaar.offer.expired, effect: "category offers; template notify.tpl.offers.expired; recipient buyerId and sellerId; ref offer offerId; collapse key offerId"}
      - {type: bazaar.offer.withdrawn, effect: "category offers; template notify.tpl.offers.withdrawn; recipient sellerId; filter reason buyer_withdrew; ref offer offerId; collapse key offerId"}
      - {type: bazaar.negotiation.countered, effect: "category offers; template notify.tpl.offers.countered; recipient recipientId; actor proposerId; ref negotiation negotiationId; collapse key negotiationId"}
      - {type: commerce.deal.opened, effect: "category offers; template notify.tpl.offers.deal_opened; recipient each did in parties[] except the actor; ref deal dealId; collapse key dealId"}
      - {type: commerce.payment.claimed, effect: "category offers; template notify.tpl.offers.payment_claimed; recipient payeeId; actor payerId; ref deal dealId; collapse key dealId"}
      - {type: commerce.payment.acknowledged, effect: "category offers; template notify.tpl.offers.payment_acknowledged; recipient payerId; actor payeeId; ref deal dealId; collapse key dealId"}
      - {type: commerce.payment.disputed, effect: "category offers; template notify.tpl.offers.payment_disputed; recipient whichever of payerId and payeeId is not the actor; ref deal dealId; collapse key dealId"}
      - {type: commerce.deal.completed, effect: "category offers; template notify.tpl.offers.deal_completed; recipient each did in parties[] except the actor; ref deal dealId; collapse key contextId"}
      - {type: comms.message.received, effect: "category messages; template notify.tpl.messages.new; recipient the local principal (mailbox owner); actor senderDid; ref thread threadId; collapse key threadId; muted true when the F08.S01.M02 thread query reports the thread muted"}
      - {type: mutiny.cycle.proposed, effect: "category cycles; template notify.tpl.cycles.proposed; recipient each did in parties[] except coordinatorId; ref cycle cycleId; collapse key cycleId"}
      - {type: mutiny.cycle.committed, effect: "category cycles; template notify.tpl.cycles.committed; recipient each did in parties[]; ref cycle cycleId; collapse key cycleId"}
      - {type: mutiny.cycle.declined, effect: "category cycles; template notify.tpl.cycles.declined; recipient each of participantIds except participantId (the decliner); ref cycle cycleId; collapse key cycleId"}
      - {type: mutiny.cycle.participant_dropped, effect: "category cycles; template notify.tpl.cycles.participant_dropped; recipient each of remainingParticipantIds; ref cycle cycleId; collapse key cycleId"}
      - {type: mutiny.cycle.cancelled, effect: "category cycles; template notify.tpl.cycles.cancelled; recipient each of participantIds; ref cycle cycleId; collapse key cycleId"}
      - {type: mutiny.cycle.completed, effect: "category cycles; template notify.tpl.cycles.completed; recipient each did in parties[]; ref cycle cycleId; collapse key contextId"}
      - {type: mutiny.recovery.opened, effect: "category cycles; template notify.tpl.cycles.recovery_opened; recipient each of participantIds; ref cycle cycleId; collapse key cycleId"}
      - {type: mutiny.proposal.revised, effect: "category cycles; template notify.tpl.cycles.proposal_revised; recipient each did in parties[] except authorId; ref type from subjectType with id subjectId; collapse key subjectId"}
      - {type: auctions.bid.outbid, effect: "category auctions; template notify.tpl.auctions.outbid; recipient outbidderId; ref auction auctionId; collapse key auctionId"}
      - {type: auctions.auction.won, effect: "category auctions; template notify.tpl.auctions.won; recipient winnerId when present in this vault's copy; ref auction auctionId; collapse key auctionId"}
      - {type: auctions.auction.unsold, effect: "category auctions; template notify.tpl.auctions.unsold; recipient sellerId; ref auction auctionId; collapse key auctionId"}
      - {type: auctions.auction.closed, effect: "category auctions; template notify.tpl.auctions.closed; recipient sellerId; filter outcome is not unsold (unsold auctions are announced once by auctions.auction.unsold); ref auction auctionId; collapse key auctionId"}
      - {type: auctions.result.voided, effect: "category auctions; template notify.tpl.auctions.voided; recipient each did in parties[] (the vault-derived copy lists the local principal); ref auction auctionId; collapse key auctionId"}
      - {type: services.quote.issued, effect: "category bookings; template notify.tpl.bookings.quote_issued; recipient clientId; actor providerId; ref quote quoteId; collapse key quoteId"}
      - {type: services.quote.accepted, effect: "category bookings; template notify.tpl.bookings.quote_accepted; recipient providerId; actor clientId; ref quote quoteId; collapse key quoteId"}
      - {type: services.booking.confirmed, effect: "category bookings; template notify.tpl.bookings.confirmed; recipient clientId and providerId except the actor; ref booking bookingId; collapse key bookingId"}
      - {type: services.booking.cancelled, effect: "category bookings; template notify.tpl.bookings.cancelled; recipient whichever of clientId and providerId is not cancelledBy; ref booking bookingId; collapse key bookingId"}
      - {type: services.booking.completed, effect: "category bookings; template notify.tpl.bookings.completed; recipient each did in parties[] except the actor; ref booking bookingId; collapse key contextId"}
      - {type: services.milestone.submitted, effect: "category bookings; template notify.tpl.bookings.milestone_submitted; recipient clientId; ref booking bookingId; collapse key bookingId"}
      - {type: services.milestone.approved, effect: "category bookings; template notify.tpl.bookings.milestone_approved; recipient providerId; ref booking bookingId; collapse key bookingId"}
      - {type: services.dispute.opened, effect: "category bookings; template notify.tpl.bookings.dispute_opened; recipient counterpartyId; actor openerId; ref booking bookingId; collapse key bookingId"}
      - {type: rentals.reservation.requested, effect: "category bookings; template notify.tpl.bookings.rental_requested; recipient ownerId; actor renterId; ref rental reservationId; collapse key reservationId"}
      - {type: rentals.reservation.confirmed, effect: "category bookings; template notify.tpl.bookings.rental_confirmed; recipient renterId; actor ownerId; ref rental reservationId; collapse key reservationId"}
      - {type: rentals.reservation.cancelled, effect: "category bookings; template notify.tpl.bookings.rental_cancelled; recipient whichever of ownerId and renterId is not cancelledBy; ref rental reservationId; collapse key reservationId"}
      - {type: rentals.rental.overdue, effect: "category bookings; template notify.tpl.bookings.rental_overdue; recipient ownerId and renterId; ref rental reservationId; collapse key reservationId"}
      - {type: rentals.damage.claimed, effect: "category bookings; template notify.tpl.bookings.damage_claimed; recipient renterId; actor ownerId; ref rental reservationId; collapse key reservationId"}
      - {type: rentals.rental.closed, effect: "category bookings; template notify.tpl.bookings.rental_closed; recipient each did in parties[] (owner and renter) except the actor; ref rental reservationId; collapse key contextId"}
      - {type: comms.meetup.proposed, effect: "category bookings; template notify.tpl.bookings.meetup_proposed; recipient each of partyDids except proposerDid; ref meetup meetupId; collapse key meetupId"}
      - {type: comms.meetup.agreed, effect: "category bookings; template notify.tpl.bookings.meetup_agreed; recipient each of partyDids except the actor; ref meetup meetupId; collapse key meetupId"}
      - {type: comms.meetup.cancelled, effect: "category bookings; template notify.tpl.bookings.meetup_cancelled; recipient each of partyDids except cancelledByDid; ref meetup meetupId; collapse key meetupId"}
      - {type: comms.meetup.no_show, effect: "category bookings; template notify.tpl.bookings.meetup_no_show_claim; recipient targetDid; actor reportedByDid; ref meetup meetupId; collapse key meetupId"}
      - {type: moderation.action.applied, effect: "category moderation; template notify.tpl.moderation.action_applied; recipient the local principal on the vault copy derived from the verified statement (origin vault only); ref case caseId; collapse key actionId"}
      - {type: moderation.appeal.decided, effect: "category moderation; template notify.tpl.moderation.appeal_decided; recipient the local principal on the vault copy derived from the verified decision; ref appeal appealId; collapse key appealId"}
      - {type: identity.device_key.added, effect: "category security; template notify.tpl.security.device_added; urgency urgent; recipient the local principal (did); skipped only when raised by a command on this device; collapse key deviceKeyId"}
      - {type: identity.device_key.revoked, effect: "category security; template notify.tpl.security.device_revoked; urgency urgent; recipient the local principal (did); skipped only when raised on this device; collapse key deviceKeyId"}
      - {type: identity.session.revoked, effect: "category security; template notify.tpl.security.session_revoked; urgency normal; recipient the local principal (did); filter reason in user_revoked, device_revoked, recovery, passphrase_changed and user_revoked only when raised on another device; locked, idle, absolute, rotated, limit and erased are skipped; collapse key sessionId"}
      - {type: identity.recovery.completed, effect: "category security; template notify.tpl.security.recovery_completed; urgency urgent; recipient the local principal (did); collapse key kitId"}
      - {type: identity.recovery.kit_created, effect: "category security; template notify.tpl.security.recovery_kit_created; urgency normal; recipient the local principal (did); skipped only when raised on this device; collapse key kitId"}
      - {type: federation.account.moved, effect: "category security; template notify.tpl.security.account_moved; urgency normal; filter kind account and subject equal to the local principal DID (moves of other principals and relay moves are skipped); collapse key moveCid"}
      - {type: privacy.export.ready, effect: "category security; template notify.tpl.security.export_ready; urgency normal; recipient the local principal; ref export jobId; collapse key jobId"}
      - {type: notify.email.bounced, effect: "vault-local event only (origin vault); category security; template notify.tpl.security.email_stopped; urgency normal; recipient the local principal; collapse key emailAddressId"}
      - {type: notify.preference.changed, effect: "apply the in-app column to newly routed events and remove unread items of categories now off, except security"}
      - {type: identity.block.added, effect: "hide unread rows whose actor is blockedDid and stop further rows from it (N7); rows are not shown again if the block is removed"}
      - {type: privacy.deletion.completed, effect: "notification only; confirm that the DeletionPort purge step removed every row and the known-actor index; nothing is signed"}
    errors: []
    example: |
      vault event bazaar.offer.made (derived from a verified signed offer statement fetched from a mailbox) -> isBlockedEither(buyerId, local) false -> routing row
      notify.notification.create { "sourceEventId": "0192f3b7-0000-7000-8000-000000000001", "payloadHash": "sha256-…", "category": "offers", "templateKey": "notify.tpl.offers.made", "ref": { "type": "offer", "id": "0192f3a5-1111-7000-8000-000000000001" }, "collapseKey": "0192f3a4-2222-7000-8000-000000000001", "actorDid": "did:key:z6MkBuyer…", "arrival": "mailbox", "raisedOnThisDevice": false }
      -> { "notificationId": "0192f3b7-1111-7000-8000-000000000001", "created": true, "collapsed": false, "count": 1 }
      -> NotificationDispatchPort.route({ …, "arrival": "mailbox", "collapsed": false, "muted": false })
      same event delivered again -> { "created": false, "collapsed": false, "skipped": "duplicate" }   (acknowledged, no retry)
      vault command notify.notification.mark_read { "notificationId": "0192f3b7-1111-7000-8000-000000000001", "expectedRevision": 1 }
      -> { "notificationId": "0192f3b7-1111-7000-8000-000000000001", "status": "read", "revision": 2 }
  authorization_capabilities:
    requirements:
      - Vault policy lets only the local principal read and mark its own notifications; routing consumers act as the vault itself.
      - Notifications are created only from events of statements already verified by their owning modules (signed by an authorized key for the role), never from raw relay data.
      - No relay or other user can read or create inbox rows.
    capabilities:
      - "notify.notification.create | local principal | vault internal; invoked by routing consumers; event derived from locally verified data; recipient rule selects the local principal"
      - "notify.notification.mark_read | local principal | notification.userDid is the local principal"
      - "notify.notification.read_own | local principal | notification.userDid is the local principal"
  failure_recovery_idempotency:
    requirements:
      - Routing consumers are idempotent on event ID through the consumer inbox (CTR-EVT-001 EVT-3), so redelivery never creates duplicates and a duplicate is acknowledged as a skip.
      - Collapse and creation happen in one IndexedDB transaction so counts are exact under concurrent events.
      - If rendering a template fails the row is still created with a generic fallback text, so no alert is lost.
      - Only malformed input fails and is retried up to 8 times before the local dead letter; skips never retry, never dead-letter and appear only as diagnostics counters.
    idempotency: "Create is idempotent on sourceEventId through the inbox table and returns created false with skipped duplicate on a repeat; a repeat with a different payload hash fails IDEMPOTENCY_KEY_REUSED; mark_read is idempotent on notificationId and returns the stored read state; the dispatch port is called once per committed decision."
    concurrency: "expectedRevision on mark_read; creation and collapse in one IndexedDB transaction with a compare on the open row; tabs and the service worker share the same IndexedDB, so a Web Lock serializes the consumer per vault."
    retries: "Event consumers retry only errors (malformed input or storage failure) up to 8 times with backoff, then dead-letter locally (EVT-6 adapted); skips are acknowledged at once; the user can retry dead letters from diagnostics."
    offline: "Everything works offline because the inbox is local; notifications are created as soon as events are derived, including during sync catch-up after being offline."
    partial_failure: "If one routing row fails others continue; a failed event stays in the dead letter list with a diagnostics entry and does not block the inbox; a failing dispatch port call never rolls back the row."
  privacy_retention_abuse:
    requirements:
      - Notifications are vault-local, content-free and P2; they never leave the device except as the separate content-free alerts decided by the gate, and references and collapse keys reach only the vault gate, which seals them before anything is sent to a relay.
      - Retention is 30 days with a cap of 500 items, and security rows are the last to be dropped by the cap.
      - Notification spam from hostile peers is limited by blocking, collapsing, a per-actor cap of 50 rows per day and an aggregate budget of 20 rows per day per category for actors with no prior interaction, beyond which events collapse into one row reading N new from new members.
      - Eviction under the 500-item cap removes read rows first, then rows from unknown actors, then the oldest unread non-security rows from known counterparties, and security rows last, so a Sybil flood never evicts pre-existing unread rows from known counterparties.
    data:
      - "Notification: P2, vault only; contains template key and reference but no content."
      - "Known-actor index: P2, vault only, salted hashes of DIDs."
    retention:
      - "Rows: RET-SHORT (30 days) and at most 500; counters of removed rows kept in diagnostics."
      - "Known-actor index: RET-STANDARD, at most 5 000 entries, oldest removed first."
    threats:
      - "T01 | Peer floods the inbox with offers or messages | blocking, collapse within 10 minutes, cap of 500, per-actor cap of 50 rows per day, hidden counter instead of rows beyond the cap"
      - "T02 | Forged event creates a fake security notification | notifications are created only from events derived from verified statements; security templates only from identity, privacy and notify events"
      - "T03 | Notification text leaks content on lock screen | OS alerts come from F13.S02.M01 with generic text from the template; in-app titles never contain amounts or names unless the user enabled previews (default off)"
      - "T04 | Urgent class abused | urgent only for the three fixed security templates"
      - "T05 | Sybil actors with free did:key identities fill the inbox and evict real items | aggregate budget of 20 rows per day per category for unknown actors with collapse into one row, unknown-actor rows evicted before unread rows of known counterparties"
      - "T06 | Account takeover on another device goes unnoticed because the actor is the same DID | security rows skip only events raised on this device; device_key.added from another device is urgent"
    abuse_controls:
      - "Per-actor cap of 50 rows per day and new-actor budget of 20 rows per day per category through RateLimitPort in vault-local mode (F12.S03.M03), plus the local block list (F07.S02.M02)."
      - "Users can mute categories and threads; the user can report a source from the notification screen."
  observability_performance:
    requirements:
      - The PWA keeps local diagnostics only (OBS-7) with counters for created, collapsed, skipped by reason, dropped and read notifications.
      - Routing one event and creating a row meets p95 ≤ 30 ms and inbox list of 50 items p95 ≤ 100 ms on a mid-range phone.
      - Catch-up routing of 1 000 events after being offline completes within 5 s.
    metrics:
      - "classrup_notify_inbox_created_total{category} (local diagnostics)"
      - "classrup_notify_inbox_skipped_total{reason} (local diagnostics)"
      - "classrup_notify_inbox_unread (gauge, local diagnostics)"
      - "classrup_notify_routing_dead_letter_total (local diagnostics)"
    logs:
      - "local info notification.created {category, templateKey} — no ref IDs in exported diagnostics."
    budgets:
      - "create p95 ≤ 30 ms; list_mine 50 items p95 ≤ 100 ms; unread_count p95 ≤ 20 ms."
      - "Routing 1 000 events ≤ 5 s on a mid-range phone."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - A routing table test asserts every routed event type exists in the catalog emits, every field each row names exists in the producer payload in the schema registry, and the security and auction filters are present.
      - Contract tests check commands, queries and event payloads against the schema registry.
      - The screens listed under ux meet the listed a11y items, verified by an axe scan with zero serious issues and a keyboard and screen-reader walk-through.
    fixtures: "Vault U as seller of listing L and buyer elsewhere, devices A and B of U, routing table of 53 routed events, blocked user X, muted thread M, 600 fresh DIDs, F07.S02.M02 block double, NotificationDispatchPort spy, fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,01.R03 | route bazaar.offer.made to seller U | Notification stored with category offers, template notify.tpl.offers.made, ref offer, collapse key listingId, no text fields"
      - "T02 | unit | 02.R01,02.R03 | each rule V01 to V09 with malformed input in turn | VALIDATION_FAILED, IDEMPOTENCY_KEY_REUSED or ID_TIMESTAMP_SKEW as documented and nothing stored"
      - "T03 | property | 03.R01,03.R02,03.R03 | random sequences of events within and beyond 10-minute windows, reads and sweeps | count equals collapsed events; read never reopens; new window creates new row"
      - "T04 | contract | 04.R01,04.R02,09.R03 | create, mark_read, mark_all_read, list, unread_count execute | outputs and event payloads validate against registry schemas; created carries collapseKey; the dispatch port receives one decision per non-skipped event, also for in-app off"
      - "T05 | contract | 04.R03,04.R04,09.R02 | iterate the routing table against modules.yaml and the schema registry | every routed type is in the catalog emits; every recipient, ref, collapse and filter field exists in the producer payload; completion, offer withdrawal and email_stopped rows present; urgent only on 3 security templates"
      - "T06 | integration | 02.R02,06.R01,06.R04 | deliver each event type twice, shuffled; deliver an own-action event, an expired event and a filtered event | exactly one row per rule; duplicates and other skips return created false with the reason, are acknowledged once and never retried or dead-lettered"
      - "T07 | abuse | 05.R01,05.R02,05.R03 | event from blocked X; event with unverified statement; foreign actor tries to create or read rows | no row and no dispatch decision for X; no external access"
      - "T08 | integration | 06.R02,06.R03 | 100 concurrent offer events for one listing; template render failure | one collapsed row count 100; fallback text on render failure"
      - "T09 | integration | 02.R02,04.R01 | muted thread message; category with in-app off; security category with an in-app disable attempt | muted flag set and the decision carries muted; no row for the off category but a decision reaches the dispatch port; security row always created"
      - "T10 | abuse | 07.R01,07.R02,07.R03 | 51st event from one actor in a day; 501st row; inspect exported diagnostics and the dispatch port arguments | hidden counter increments, cap removes read rows first, no content in exports, refs and collapse keys reach only the in-vault port"
      - "T11 | load | 08.R01,08.R02,08.R03 | 1 000 events catch-up and list of 50 items | budgets met; skip counters by reason present"
      - "T12 | unit | 09.R01 | traceability tool run | every PS-103 requirement maps to a passing test"
      - "T13 | integration | 10.R01,10.R02,10.R03 | export, import into fresh vault, restore from backup | rows round trip; imported rows older than 30 days dropped; unread counts equal; no alert triggered by import"
      - "T14 | a11y | 09.R04 | inbox with screen reader and keyboard | list semantics, unread state in text, mark all read announced, zero serious axe issues"
      - "T15 | integration | 02.R04 | device B signs a device_link that A receives as a verified statement; the same change raised on A itself; session revoked with reasons idle, rotated and device_revoked; account moved for another principal and for the local principal | urgent security row on A for B's change and none for A's own command; only device_revoked routed; only the local principal's account move routed"
      - "T16 | abuse | 07.R03,07.R04,01.R04 | 600 fresh DIDs each send one offer while U has 30 unread rows from known counterparties and the inbox is near the cap | after 20 rows the rest collapse into one new_members row; every pre-existing unread row from known counterparties survives; unknown-actor rows evicted first"
      - "T17 | integration | 04.R05 | DeletionPort plan and purge, export section and retention purge with F10 registry doubles; block added for an actor with unread rows | purge removes rows and the known-actor index; section notify.notifications exported; rows purged after 30 days; blocked actor's unread rows hidden"
      - "T18 | unit | 04.R04,02.R01 | auctions.auction.unsold followed by auctions.auction.closed with outcome unsold; commerce.deal.completed; notify.email.bounced (origin vault) | exactly one auction row; deal completion row for the other party; email_stopped security row"
    acceptance:
      - All tests T01 to T18 pass in CI.
      - Every routed event exists in the catalog, every routing field exists in its producer payload, and the inbox never stores text content.
      - Security notifications are created regardless of the in-app preference and for changes made on the user's other devices.
      - Duplicate event delivery never creates a second row and never retries.
  import_export_backup_rollback:
    requirements:
      - A user's vault export contains unread notifications and the last 30 days of read ones as references and template keys only.
      - Import drops rows older than 30 days and rows whose reference type is unknown, keeps counts, and never regenerates alerts for imported rows.
      - Schema changes follow expand and contract; new templates and routing rows are additive and unknown templates render a generic fallback.
    export: "Section notify.notifications in classrup-export/v1 through ExportSectionPort; one line per Notification (schema classrup.notify.notification/v1); the known-actor index is not exported."
    import: "Rows validated against registries; existing IDs skipped; no OS alert, push or email is triggered by import and the dispatch port is not called."
    backup: "The vault export is the backup (IOX-6); relays hold no inbox data."
    migration_rollback: "Additive routing rows and templates only; rollback is safe because older apps render unknown templates with the generic fallback and ignore unknown categories."
