      - {type: auctions.bid.outbid, effect: "category auctions; template notify.tpl.auctions.outbid; recipient the outbid bidder; collapse key auctionId"}
      - {type: auctions.auction.won, effect: "category auctions; template notify.tpl.auctions.won; recipient the winner; collapse key auctionId"}
      - {type: auctions.auction.unsold, effect: "category auctions; template notify.tpl.auctions.unsold; recipient the seller; collapse key auctionId"}
      - {type: auctions.auction.closed, effect: "category auctions; template notify.tpl.auctions.closed; recipient the seller; collapse key auctionId"}
