      - {type: moderation.appeal.decided, effect: "category moderation; template notify.tpl.moderation.appeal_decided; recipient the appellant; collapse key appealId"}
      - {type: identity.device_key.added, effect: "category security; template notify.tpl.security.device_added; urgency urgent; recipient the local principal; collapse key keyId"}
      - {type: identity.device_key.revoked, effect: "category security; template notify.tpl.security.device_revoked; urgency urgent; recipient the local principal; collapse key keyId"}
      - {type: identity.session.revoked, effect: "category security; template notify.tpl.security.session_revoked; urgency normal; recipient the local principal; collapse key sessionId"}
      - {type: identity.recovery.completed, effect: "category security; template notify.tpl.security.recovery_completed; urgency urgent; recipient the local principal; collapse key recoveryId"}
      - {type: identity.recovery.kit_created, effect: "category security; template notify.tpl.security.recovery_kit_created; urgency normal; recipient the local principal; collapse key recoveryKitId"}
      - {type: federation.account.moved, effect: "category security; template notify.tpl.security.account_moved; urgency normal; recipient the local principal; collapse key moveId"}
      - {type: privacy.export.ready, effect: "category security; template notify.tpl.security.export_ready; urgency normal; recipient the local principal; collapse key exportId"}
      - {type: notify.preference.changed, effect: "apply the in-app column to newly routed events and remove unread items of categories now off, except security"}
    errors: []
    example: |
      vault event bazaar.offer.made (derived from a verified signed offer statement) -> routing row
      notify.notification.create { "sourceEventId": "0192f3b7-0000-7000-8000-000000000001", "category": "offers", "templateKey": "notify.tpl.offers.made", "ref": { "type": "offer", "id": "0192f3a5-1111-7000-8000-000000000001" }, "collapseKey": "listing-0192f3a4" }
      -> { "notificationId": "0192f3b7-1111-7000-8000-000000000001", "created": true, "collapsed": false, "count": 1 }
      vault command notify.notification.mark_read { "notificationId": "0192f3b7-1111-7000-8000-000000000001", "expectedRevision": 1 }
      -> { "notificationId": "0192f3b7-1111-7000-8000-000000000001", "status": "read", "revision": 2 }
  authorization_capabilities:
    requirements:
      - Vault policy lets only the local principal read and mark its own notifications; routing consumers act as the vault itself.
      - Notifications are created only from events of statements already verified by their owning modules (signed by an authorized key for the role), never from raw relay data.
      - No relay or other user can read or create inbox rows.
    capabilities:
      - "notify.notification.create | local principal | vault internal; invoked by routing consumers; event derived from locally verified data; recipient rule selects the local principal"
      - "notify.notification.mark_read | local principal | notification.userDid is the local principal"
      - "notify.notification.read_own | local principal | notification.userDid is the local principal"
  failure_recovery_idempotency:
    requirements:
      - Routing consumers are idempotent on event ID through the consumer inbox (CTR-EVT-001 EVT-3), so redelivery never creates duplicates.
      - Collapse and creation happen in one IndexedDB transaction so counts are exact under concurrent events.
      - If rendering a template fails the row is still created with a generic fallback text, so no alert is lost.
    idempotency: "Create is idempotent on sourceEventId through the inbox table; mark_read is idempotent on notificationId and returns the stored read state."
    concurrency: "expectedRevision on mark_read; creation and collapse in one IndexedDB transaction with a compare on the open row; two tabs share the same IndexedDB so Web Locks serialize the consumer per vault."
    retries: "Event consumers retry up to 8 times with backoff then dead-letter locally (EVT-6 adapted); the user can retry from diagnostics."
    offline: "Everything works offline because the inbox is local; notifications are created as soon as events are derived, including during sync catch-up after being offline."
    partial_failure: "If one routing row fails others continue; a failed event stays in the dead letter list with a diagnostics entry and does not block the inbox."
  privacy_retention_abuse:
    requirements:
      - Notifications are vault-local, content-free and P2; they never leave the device except as the separate content-free push or email alerts decided by the gate.
      - Retention is 30 days with a cap of 500 items, and security rows are the last to be dropped by the cap.
      - Notification spam from hostile peers is limited by blocking, by collapsing, and by per-source caps.
    data:
      - "Notification: P2, vault only; contains template key and reference but no content."
    retention:
      - "Rows: RET-SHORT (30 days) and at most 500; counters of removed rows kept in diagnostics."
    threats:
      - "T01 | Peer floods the inbox with offers or messages | blocking, collapse within 10 minutes, cap of 500, per-source cap of 50 rows per day, hidden counter instead of rows beyond the cap"
      - "T02 | Forged event creates a fake security notification | notifications are created only from events derived from verified statements; security templates only from local identity events"
      - "T03 | Notification text leaks content on lock screen | OS alerts come from F13.S02.M01 with generic text from the template; in-app titles never contain amounts or names unless the user enabled previews (default off)"
      - "T04 | Urgent class abused | urgent only for security templates in a fixed list of 3 templates"
    abuse_controls:
      - "Per-source cap of 50 rows per day per actor DID and local block list."
      - "Users can mute categories and threads; the user can report a source from the notification screen."
  observability_performance:
    requirements:
      - The PWA keeps local diagnostics only (OBS-7) with counters for created, collapsed, dropped and read notifications.
      - Routing one event and creating a row meets p95 ≤ 30 ms and inbox list of 50 items p95 ≤ 100 ms on a mid-range phone.
      - Catch-up routing of 1 000 events after being offline completes within 5 s.
    metrics:
      - "classrup_notify_inbox_created_total{category} (local diagnostics)"
      - "classrup_notify_inbox_collapsed_total (local diagnostics)"
      - "classrup_notify_inbox_unread (gauge, local diagnostics)"
      - "classrup_notify_routing_dead_letter_total (local diagnostics)"
    logs:
      - "local info notification.created {category, templateKey} — no ref IDs in exported diagnostics."
    budgets:
      - "create p95 ≤ 30 ms; list_mine 50 items p95 ≤ 100 ms; unread_count p95 ≤ 20 ms."
      - "Routing 1 000 events ≤ 5 s on a mid-range phone."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - A routing table test asserts every routed event type exists in the catalog emits and has category, template, recipient rule and collapse key.
      - Contract tests check commands, queries and event payloads against the schema registry.
    fixtures: "Vault U as seller of listing L and buyer elsewhere, routing table of 49 events, blocked user X, muted thread M, fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,01.R03,02.R01 | route bazaar.offer.made to seller U | Notification stored with category offers, template notify.tpl.offers.made, ref offer, no text fields"
      - "T02 | unit | 02.R02,02.R03 | each rule V01 to V08 violated in turn | documented error code returned and nothing stored"
      - "T03 | property | 03.R01,03.R02,03.R03 | random sequences of events within and beyond 10-minute windows, reads and sweeps | count equals collapsed events; read never reopens; new window creates new row"
      - "T04 | contract | 04.R01,04.R02,09.R02 | create, mark_read, mark_all_read, list, unread_count execute | outputs and event payloads validate against registry schemas"
      - "T05 | contract | 04.R03,09.R03 | iterate the routing table | every routed type is in modules.yaml emits, has recipient rule and collapse key, urgent only on 3 security templates"
      - "T06 | integration | 04.R03,06.R01 | deliver each event type twice, shuffled | exactly one row per rule, duplicates skipped"
      - "T07 | abuse | 05.R01,05.R02,05.R03 | event from blocked X; event with unverified statement; foreign actor tries to create or read rows | no row; no external access"
      - "T08 | integration | 06.R02,06.R03 | 100 concurrent offer events for one listing; template render failure | one collapsed row count 100; fallback text on render failure"
      - "T09 | integration | 06.R03,02.R03 | muted thread message; category with in-app off; security category with in-app preference attempt to disable | muted flag set, no row for off category except counters, security row always created"
      - "T10 | abuse | 07.R01,07.R02,07.R03 | 51st event from one actor in a day; 501st row; inspect exported diagnostics | hidden counter increments, cap removes read rows first, no content in exports"
      - "T11 | load | 08.R01,08.R02,08.R03 | 1 000 events catch-up and list of 50 items | budgets met"
      - "T12 | unit | 09.R01 | traceability tool run | every PS-103 requirement maps to a passing test"
      - "T13 | integration | 10.R01,10.R02,10.R03 | export, import into fresh vault, restore from backup | rows round trip; imported rows older than 30 days dropped; unread counts equal"
      - "T14 | a11y | 04.R01 | inbox with screen reader and keyboard | list semantics, unread state in text, mark all read announced, zero serious axe issues"
    acceptance:
      - All tests T01 to T14 pass in CI.
      - Every routed event exists in the catalog and the inbox never stores text content.
      - Security notifications are created regardless of the in-app preference.
      - Duplicate event delivery never creates a second row.
  import_export_backup_rollback:
    requirements:
      - A user's vault export contains unread notifications and the last 30 days of read ones as references and template keys only.
      - Import drops rows older than 30 days and rows whose reference type is unknown, keeps counts, and never regenerates alerts for imported rows.
      - Schema changes follow expand and contract; new templates and routing rows are additive and unknown templates render a generic fallback.
    export: "Section notify.notifications in classrup-export/v1; one line per Notification (schema classrup.notify.notification/v1)."
    import: "Rows validated against registries; existing IDs skipped; no OS alert, push or email is triggered by import."
    backup: "The vault export is the backup (IOX-6); relays hold no inbox data."
    migration_rollback: "Additive routing rows and templates only; rollback is safe because older apps render unknown templates with the generic fallback and ignore unknown categories."
