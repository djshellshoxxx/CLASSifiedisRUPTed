  import_export_backup_rollback:
    requirements:
      - A user's vault export contains their schedule including the tzdata version.
      - Import validates the time zone against the target build's tzdata and refuses unknown zones, asking the user to choose another.
      - Schema changes follow expand and contract; new window fields are additive and old windows keep their meaning.
    export: "Section notify.quiet_hours in classrup-export/v1 through ExportSectionPort; one line per QuietHoursSchedule (schema classrup.notify.quiet_hours/v1); relay copies are not exported."
    import: "Time zone and windows re-validated; unknown zones are rejected and the schedule imports disabled; the imported vault starts a new mirror chain for its own device key and mirrors only after user confirmation."
    backup: "The vault export is the backup (IOX-6); relay copies are operational data covered by relay SQLite backup (IOX-3, IOX-7) and are deleted on restore when no consent of the user remains registered."
    migration_rollback: "Additive fields only in v1; a tzdata release changes results only for future instants and is recorded; rollback to an older build keeps the stored tzdataVersion and re-evaluates with the older data and its canonical-zone table."
