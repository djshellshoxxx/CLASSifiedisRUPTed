# F15.S01.M03 PWA install (ADR-0015 format, ADR-0016 local-first). Keep IDs stable once published.
id: F15.S01.M03
scope: MVP
summary: >-
  The installable PWA is the product (ADR-0016): after install the vault, drafting, local search and export work
  with no server. This module owns the web app manifest, the install prompt experience, and the update-available
  flow in which a waiting service worker is activated only after the user consents. Install is also the moment
  to ask the browser for persistent storage and to explain that data lives on this device, so the user knows to
  export. Nothing here contacts a server, collects analytics or depends on a relay.
responsibilities:
  - Generate and validate the manifest (vite-plugin-pwa 2.0.0, Vite 8.3.5) with id, name, short_name, start_url, scope, display standalone, icons 192, 512 and maskable 512, theme and background colors, shortcuts (at most 4) and lang.
  - Capture beforeinstallprompt and show a custom install card only after the user has completed a meaningful action, with dismissal back-off (30 days, then never after 3 dismissals); show Add to Home Screen instructions on iOS Safari.
  - Run the update-available flow with registerType prompt, hourly and on-foreground update checks, a banner with Update now and Later, and SKIP_WAITING only after consent and a safe point (no unsaved draft, outbox idle).
  - After install or first successful unlock, request persistent storage through F15.S01.M01 and show a short explanation that data stays on this device and should be exported regularly.
non_responsibilities:
  - Service worker routing and cache versioning (F15.S01.M02 mod_cache).
  - Vault storage status panel and sync outbox (F15.S01.M01 mod_offline).
  - Static host configuration and headers (deployment docs; ADR-0016 allows any static host).
  - "Future: push notification permission prompt flow (owned by the notify feature); Future: store listing for app stores via Trusted Web Activity."
depends_on: [F15.S01.M01, F15.S01.M02, CTR-UX-001, CTR-OBS-001, CTR-PRV-001]
user_stories:
  - As a member, I can install ClassRup to my home screen and open it with no connection, with my vault intact.
  - As a member, I am told clearly when a new version is ready and I choose when to restart; my open drafts are never lost.
  - As an iPhone user, I get step-by-step instructions to add the app to my Home Screen because the browser has no install button for web apps.
edge_cases:
  - The browser never fires beforeinstallprompt (iOS, Firefox desktop, already installed); the card is replaced by manual instructions or hidden when display-mode standalone is detected.
  - The user dismisses the install card three times; it never appears again, but Install remains available in Settings.
  - An update is waiting while a form has unsaved text or the outbox has an entry in sending; the Update now button first saves the draft to the vault and waits up to 10 s for the sending entry, otherwise offers Later.
  - Two tabs are open and one accepts the update; the other tab shows "Updated in another tab, reload" after controllerchange instead of reloading mid-edit.
  - The manifest or icons fail the build checks (missing 512 icon, start_url outside scope); the build fails with a stable code instead of shipping a non-installable app.
  - The user declines persistent storage or the browser denies it; the app continues, shows the non-persistent warning in the storage panel and increases the export reminder frequency to every 7 days.
ux:
  screens:
    - "Install card: dismissible card on the home screen with title 'Install ClassRup', one sentence 'Works offline and keeps your data on this device', buttons Install and Not now."
    - "iOS instructions sheet: three steps with Share icon, Add to Home Screen and Add, with illustrations that have text alternatives."
    - "Update banner: 'A new version is ready' with Update now and Later, shown above the bottom navigation and not covering form fields."
    - "Settings > App: install state, version (buildId), Check for updates, and the persistent storage explanation."
  states: [not-installable, installable, ios-instructions, installed, update-available, updating, update-deferred, updated-elsewhere]
  a11y:
    - Install card and update banner use role=region with aria-label and announce through aria-live polite; they never trap focus.
    - Buttons are at least 44x44 px, labelled by text, and Later/Not now are reachable by keyboard before the page content flow continues.
    - iOS instruction images have alt text and the steps are real ordered list text.
processes:
  domain_schema:
    requirements:
      - The module owns no persisted entity; install state, dismissal counters and update deferral are per-device preferences stored in localStorage under the key classrup.install.v1.
      - The manifest is a build artifact validated against fixed field rules; its id is stable forever so reinstalls keep the same app identity.
      - Preferences contain no personal data and are safe to lose; the module renders correctly when storage is unavailable.
    entities: []
    note: "Configuration and UI module: no domain entities. Device preferences classrup.install.v1 { dismissals:int, lastDismissedAt:timestamp, deferredUntil:timestamp, installedAt?:timestamp } live in localStorage, are P0, and are not part of the vault export."
  validation_rules:
    requirements:
      - The build fails if the manifest violates installability rules, so a broken app is never published.
      - The install prompt is shown only when its gating rules hold, so it never interrupts first-time use.
      - Update activation is allowed only at a safe point.
    rules:
      - "V01 | manifest has id '/', name ≤ 45 chars, short_name ≤ 12 chars, start_url inside scope, display standalone | PLATFORM_INSTALL_MANIFEST_INVALID"
      - "V02 | icons include 192x192 and 512x512 PNG plus a 512x512 maskable icon, each ≤ 100 KiB | PLATFORM_INSTALL_MANIFEST_INVALID"
      - "V03 | shortcuts ≤ 4, each with name, url inside scope and icon | PLATFORM_INSTALL_MANIFEST_INVALID"
      - "V04 | install card gate: session count ≥ 2 and at least 1 completed action, not installed, dismissals < 3 and lastDismissedAt older than 30 days | PLATFORM_INSTALL_NOT_ELIGIBLE"
      - "V05 | update activation requires no unsaved draft, outbox entry in sending absent or finished within 10 s | PLATFORM_UPDATE_NOT_SAFE"
      - "V06 | SKIP_WAITING is sent only after an explicit user action in the same session | FORBIDDEN"
  workflow_state_machine:
    requirements:
      - Install and update each follow explicit states and the UI shows only the state reached.
      - A waiting worker is activated only after consent; there is no automatic skipWaiting.
      - Deferral is time-boxed so the user is asked again after 24 hours but never forced.
    machines:
      - entity: UpdateAttempt
        initial: update_available
        terminal: [activated, superseded]
        transitions:
          - "update_available -> updating | user taps Update now and V05 passes | draft saved, SKIP_WAITING posted"
          - "update_available -> deferred | user taps Later | deferredUntil = now + 86400000 ms"
          - "deferred -> update_available | deferredUntil reached or app restarted | banner shown again"
          - "updating -> activated | controllerchange received | page reloaded once"
          - "updating -> update_available | V05 fails or activation does not complete within 10000 ms | message states why and offers retry"
          - "update_available -> superseded | a newer waiting worker replaces this one | banner now refers to the newer build"
          - "deferred -> superseded | a newer waiting worker replaces this one | banner now refers to the newer build"
    timeouts:
      - "Update check on app start, on visibilitychange to visible and every 3600000 ms."
      - "Deferral lasts 86400000 ms; install card back-off 2592000000 ms (30 days)."
      - "Activation wait after SKIP_WAITING is 10000 ms."
  commands_queries_events:
    requirements:
      - The module has no relay commands, queries or events; its interface is UI components, the manifest and a small local API (install(), applyUpdate(), getInstallState()).
      - Nothing in the module calls a relay or any network origin other than the app's own static files.
      - Local state is exposed to other modules only through getInstallState(), a pure read.
    commands: []
    queries: []
    note: "UI and build module: no vault commands, statements or relay commands. Local API: install() calls the deferred beforeinstallprompt; applyUpdate() runs the V05 checks then posts SKIP_WAITING to the waiting worker (F15.S01.M02); getInstallState() returns { installed, installable, platform, updateAvailable, buildId }."
    events_produced: []
    events_consumed: []
    errors:
      - "PLATFORM_INSTALL_MANIFEST_INVALID | 422 | no | build-time failure, manifest violates installability rules"
      - "PLATFORM_INSTALL_NOT_ELIGIBLE | 409 | no | install card gating rules not satisfied"
      - "PLATFORM_UPDATE_NOT_SAFE | 409 | yes | unsaved draft or sending outbox entry blocks activation; retry after saving"
    example: |
      manifest.webmanifest
      { "id": "/", "name": "ClassRup", "short_name": "ClassRup", "start_url": "/?source=pwa", "scope": "/",
        "display": "standalone", "theme_color": "#0b5d5b", "background_color": "#ffffff", "lang": "en",
        "icons": [ {"src":"/icons/192.png","sizes":"192x192","type":"image/png"}, {"src":"/icons/512.png","sizes":"512x512","type":"image/png"},
                   {"src":"/icons/maskable-512.png","sizes":"512x512","type":"image/png","purpose":"maskable"} ],
        "shortcuts": [ {"name":"New listing","url":"/new"}, {"name":"My trades","url":"/trades"} ] }
      update: waiting worker -> banner 'A new version is ready' -> user taps Update now -> draft saved -> SKIP_WAITING -> controllerchange -> reload
  authorization_capabilities:
    requirements:
      - The module performs only local UI actions by the person holding the device and defines no relay capabilities.
      - Installing or updating changes code, never vault data, and requires an explicit user gesture.
      - No relay or remote party can trigger install or update; the update source is only the app's own origin, which the user chose by opening it.
    capabilities: []
  failure_recovery_idempotency:
    requirements:
      - Repeated install() or applyUpdate() calls are safe and have the effect of one call.
      - A failed activation leaves the previous version running and the banner available.
      - Everything works with no connectivity; update checks simply fail silently and retry at the next trigger.
    idempotency: "install() uses the single deferred prompt event and clears it after use; applyUpdate() posts SKIP_WAITING at most once per waiting worker. Preferences writes are last-value."
    concurrency: "Several tabs use BroadcastChannel classrup-install to share dismissal and update state; the first tab to accept performs the update and others show the updated-elsewhere state."
    retries: "Update checks retry at the next trigger (hourly, foreground); there is no tight retry loop. A stuck activation after 10 s returns to update_available."
    offline: "Install card and update banner logic work offline; an update is only detected when the static host is reachable. The installed app never needs the network to start."
    partial_failure: "If the reload after controllerchange is interrupted, the next start runs the new worker with the new shell; state in the vault is not affected. If the manifest is cached stale, the browser refreshes it on its own schedule and no data is lost."
  privacy_retention_abuse:
    requirements:
      - The module collects no analytics and sends nothing to any server (CTR-OBS-001 OBS-7); install and update counters remain on the device.
      - The persistent-storage explanation says that data lives on this device, that clearing site data or browser eviction can delete it, and that export is the backup.
      - The install prompt must not nag or dark-pattern the user.
    data:
      - "classrup.install.v1 in localStorage: P0 counters and timestamps."
      - "Manifest and icons: P0 public static files."
    retention:
      - "Preferences kept until site data is cleared; reset when the user chooses Reset app settings."
    threats:
      - "T01 | Malicious update from a compromised static host | assets are content-hashed, the worker only updates from its own origin, users can keep the current version with Later, release builds are reproducible and checksums published for self-hosters"
      - "T02 | Phishing clone of the install card or fake update banner | banner is rendered by the app shell only, never from remote content; no external links or scripts in the component"
      - "T03 | Repeated install prompts used as a nuisance | gating V04 and the 3-dismissal cap"
    abuse_controls:
      - "Install card is capped at once per session and 3 lifetime dismissals; update banner at most once per 24 h after Later."
      - "No remote content is rendered by the install or update components."
  observability_performance:
    requirements:
      - Install and update outcomes are counted locally and viewable in the diagnostics panel; no telemetry is sent.
      - The install card and update banner must not worsen CLS (≤ 0.1) or INP (≤ 200 ms) per CTR-OBS-001 OBS-5.
      - The module adds at most 6 KiB gzip to the initial bundle.
    metrics:
      - "local counters install_prompt_shown, install_accepted, install_dismissed, update_prompted, update_accepted, update_deferred (never transmitted)"
    logs:
      - "Local diagnostic log lines install.state {state} and update.state {state}; exportable by the user, never uploaded."
    budgets:
      - "Initial bundle contribution ≤ 6 KiB gzip; banner render ≤ 16 ms; layout reserves space so CLS contribution is 0."
      - "Update now to reloaded app ≤ 3 s on a Moto G-class device with warm cache."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Manifest and gating logic are unit tested; the install and update flows are tested end to end in Chromium, WebKit and Firefox where each supports them.
      - A Lighthouse installability check runs in CI on the built app.
    fixtures: "Built PWA builds A and B served by a static server; Playwright with beforeinstallprompt simulation; localStorage seeded with counters; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,02.R01 | manifest validated with each defect (missing 512 icon, long short_name, start_url outside scope, 5 shortcuts) | each defect fails with PLATFORM_INSTALL_MANIFEST_INVALID; the valid manifest passes"
      - "T02 | unit | 01.R03,02.R02 | install gate with sessions 1 and 2, actions 0 and 1, dismissals 0 to 3, lastDismissedAt 10 d and 31 d | card shown only when all V04 conditions hold; otherwise PLATFORM_INSTALL_NOT_ELIGIBLE"
      - "T03 | property | 03.R01,03.R03 | random sequences of waiting-worker, Later, Update now and timer events | only declared transitions occur; deferral always 24 h"
      - "T04 | e2e | 03.R02,02.R03,06.R01 | build B deployed while A is open with an unsaved draft | banner appears; Update now saves the draft first then activates; reload shows B with draft restored; no update without a click"
      - "T05 | e2e | 03.R02,06.R02 | activation does not complete within 10 s (simulated) | state returns to update_available with explanation; A still works"
      - "T06 | unit | 04.R01,04.R03 | getInstallState across installed, installable, ios and unsupported platforms | returns the documented shape and performs no network call"
      - "T07 | abuse | 04.R02,07.R01 | record all network requests during install and update flows | only same-origin static GETs; no analytics or relay requests"
      - "T08 | abuse | 05.R01,05.R02,05.R03 | page attempts to post SKIP_WAITING without user gesture and a foreign origin tries to message the worker | rejected with FORBIDDEN; version unchanged"
      - "T09 | e2e | 06.R03,01.R03 | open the installed app offline with localStorage blocked | app starts, card hidden, no exception, update check fails silently"
      - "T10 | e2e | 07.R02 | install on a browser that grants and one that denies persist() | explanation text shown in both; denial shows the warning and 7-day export reminder"
      - "T11 | a11y | 07.R03,08.R02 | install card, iOS sheet and update banner scanned with axe | zero serious issues; targets ≥ 44 px; CLS contribution 0"
      - "T12 | load | 08.R01,08.R03 | Lighthouse CI installability and bundle check | installable, module ≤ 6 KiB gzip, LCP ≤ 2.5 s, INP ≤ 200 ms"
      - "T13 | unit | 09.R01 | traceability tool run | every PS-115 requirement maps to a passing test"
      - "T14 | e2e | 09.R02,09.R03 | full flow suite on Chromium, WebKit, Firefox | passes on each engine for the flows each supports; Lighthouse installable"
      - "T15 | integration | 10.R01,10.R02,10.R03 | roll back to build A and reset app settings | A installs and runs, preferences cleared on reset, vault untouched, export bundle contains no install state"
    acceptance:
      - All tests T01-T15 pass in CI.
      - The built app is installable (Lighthouse) and starts offline after install with the vault intact.
      - A new version never replaces the running one without a user click and never loses a draft.
      - No network request other than same-origin static assets occurs during install and update flows.
  import_export_backup_rollback:
    requirements:
      - Install state and dismissal counters are device preferences and are excluded from the vault export.
      - Reinstalling the app on the same origin keeps the vault in IndexedDB; uninstalling or clearing site data deletes it, which the install explanation states before the first export reminder.
      - Rolling back to an earlier build is a static redeploy and needs no data migration in this module.
    export: "No section in classrup-export/v1; install preferences are not user data. The Settings > App page links to Export vault (F10.S01.M03)."
    import: "Not applicable."
    backup: "Not backed up. The vault export is the user's backup (CTR-IOX-001 IOX-6); the explanation text shown at install recommends exporting at least every 30 days."
    migration_rollback: "classrup.install.v1 carries a version field; unknown versions are ignored and replaced with defaults. Manifest id is never changed so that rollback or re-release keeps the installed app identity."
