    acceptance:
      - All tests T01–T31 pass in CI on Node 22 and the isomorphic scan finds no node-scheme import in the core.
      - No failure path leaves records, outbox events or idempotency records behind (T11, T25).
      - A duplicate submission never executes twice within 24 h (T10, T12).
  import_export_backup_rollback:
    requirements:
      - IdempotencyRecord rows are operational data excluded from the user export (IOX-1); rows restored from an older backup are ignored once expired.
      - Error codes, the problem shape and the event envelope are versioned contracts; changes within v1 are additive and removed codes are never reused.
      - HTTP routes are versioned under /api/v1; unknown versions or paths return NOT_FOUND so N-1 clients fail explicitly during a rollback.
    export: "No export section: idempotency records and relay access tokens are operational and expire; the vault export (F10.S01.M03) excludes them."
    import: "Nothing is imported; a restored vault starts without idempotency records and replays therefore re-execute only commands whose original result was never committed."
    backup: "Relay tables are covered by the SQLite online backup (F15.S03.M02); vault data by the user's export (IOX-6)."
    migration_rollback: "IdempotencyRecord v1 is additive-only; a rollback to N-1 keeps reading the table because kernel schema migrations are forward-only and additive (F15.S02.M03)."
