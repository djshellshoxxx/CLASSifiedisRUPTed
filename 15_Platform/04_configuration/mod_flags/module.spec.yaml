    acceptance:
      - All tests T01-T21 pass in CI.
      - The dependency rule is never violated in stored or evaluated state for vault or relay scope.
      - A disabled module returns FEATURE_DISABLED, stops its consumers and keeps its data, and stays disabled when settings cannot be read.
      - No remote party can change a vault's flags, a vault's flags are never transmitted, and only a tenant operator or admin can set or reset relay flags.
  import_export_backup_rollback:
    requirements:
      - The vault export includes vault-scope FlagSetting records as the section platform.flags, so a restored vault keeps its configuration (CTR-IOX-001 IOX-1, IOX-6).
      - Relay-scope settings are part of the relay database and its backups (IOX-3, IOX-7), and an operator may export them as relay configuration.
      - Import validates keys against the registry and the dependency rule; violating or unknown entries are skipped and reported in the dry-run.
    export: "Section platform.flags in classrup-export/v1, one line per vault-scope FlagSetting (schema classrup.platform.flag_setting/v1, classified P3); relay operators can run relay flags export --tenant <id> for relay scope."
    import: "Import applies entries in dependency order with tenantId replaced by the importing vault's vaultId; entries for unknown or FUTURE modules and entries that would violate FLG-2 are skipped and listed in the dry-run report, never partially applied."
    backup: "Vault scope: the vault export is the backup. Relay scope: relay SQLite backup (CTR-IOX-001 IOX-3)."
    migration_rollback: "Additive fields only in v1; rollback is safe because new optional fields are ignored by older readers; unknown keys from a newer registry evaluate off and are preserved. Vault rows written with the former constant tenantId are rewritten to the vaultId by a one-time data migration through F15.S02.M03."
