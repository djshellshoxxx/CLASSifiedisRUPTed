# F15.S04.M03 Tenants (ADR-0015 format, ADR-0016 local-first). Keep IDs stable once published.
id: F15.S04.M03
scope: MVP
summary: >-
  A tenant is relay-local configuration: a community hosted by one relay, with its allowed currencies,
  jurisdiction profile (a ProfileRef of F18.S01.M01), default locale and limits. A relay may host several tenants, and a single-community relay
  has one fixed tenant created at bootstrap (CTR-ID-001 ID-6). Operators and admins are not stored here: the single
  source of operator and admin roles is the F16.S01.M01 RoleAssignment, scoped tenant:<id> for tenant operators,
  and bootstrap creates the tenant together with its first operator and admin assignments in one transaction.
  Every configuration revision is published as a relay-signed statement (classrup.platform.tenant_config/v1) that
  vaults store and compare and whose operatorKeys F18.S02.M02 receivers use to verify transparency compiler and reviewer keys, status and limits are enforced by named modules through TenantPort, and "suspended"
  means suspended on that relay (CTR-CAP-001 CAP-9). The vault has no relay tenant record: its ID-6 tenant slot is
  the per-vault UUIDv7 vaultId created at vault initialisation and kept in the vault's LocalSettings, together with
  local preferences (default locale, preferred currencies, motion and money display preferences, local limits) that
  stay on the device; the one exception is a copy of defaultLocale in the consented F13.S01.M02 email registration.
responsibilities:
  - Own the Tenant record on a relay with slug, display name, status, allowed currencies (1..20), jurisdiction profile reference (ProfileRef {publisherId?, code} of F18.S01.M01, default code generic), default locale and limits, with revision-based concurrency; operator keys are a derived read of F16.S01.M01 RoleAssignment records of scope tenant:<id>.
  - Bootstrap the first tenant from the relay CLI with filesystem access (relay tenant bootstrap --slug <slug> --operator <did:key> [--admin <did:key>] [--break-glass --reason <text>]), creating the tenant and its first operator and admin assignments through F16 RoleBootstrapPort.bootstrap({ adminKey?, operatorKeys, tenantId, breakGlassReason?, osUser }) in the same transaction, and allow a relay admin to create further tenants on a multi-community relay (up to 50 per relay) without granting any admin role; admin grants after bootstrap go only through security.roleassignment.propose and approve of F16.S01.M01.
  - Publish every configuration revision as a relay-signed classrup.platform.tenant_config/v1 statement (signed through the RelaySignerPort of F15.S02.M01) returned by platform.tenant.get, carrying the jurisdictionProfile ProfileRef and the derived operatorKeys, so vaults can store, verify and compare what the relay told them and F18.S02.M02 receivers can verify transparency compiler and reviewer keys against the signed operator list.
  - Register TenantPort with the F15.S02.M02 bus (writes to a suspended or archived tenant answer PLATFORM_TENANT_SUSPENDED) and with the relay process, and serve limits(tenantId) to the module that enforces each limit - maxIndexedListingsPerPublisher and allowedCurrencies the relay index and publish intake (F06.S01.M01, F11.S01.M02), maxUploadBytes the media upload route (F15.S02.M01 into F15.S02.M03), maxMailboxBytesPerRecipient and maxEnvelopeBytes the mailbox (F08.S01.M01), maxCycleLength relay matching (F02.S02.M03), and the relay discovery settings anonymousAllowed, anonymousMinRadiusKm, anonymousCenterLevel and maxDepth relay proximity queries (F06.S02.M03).
  - Own the vault-local LocalSettings record holding the vaultId (the ID-6 tenantId of every vault record), local preferences (including the optional a11yMotion and moneyDisplay display preferences that the PWA shell passes to F14.S01.M01 setMotionPreference and F14.S02.M02 formatMoney) and local limits (maxOutboxEntries enforced by F15.S01.M01, maxLocalAttachmentBytes by the vault blob store), stored only in the user's vault and included in the user's export.
  - Emit platform.tenant.created, platform.tenant.configured (with the full configuration snapshot, also at creation and on operator changes) and platform.tenant.status_changed, so consumers react without reading the tenant.
  - Register the F10 privacy ports for LocalSettings (N6) by inverted port registration, because F10.S01.M04 already depends on F15.S01.M01, which depends on this module.
  - Register the vault operatorKeys resolver with F11.S01.M01 at composition (inverted registration, no depends_on edge), answering operatorKeys(relayId) from the latest verified tenant_config the vault holds for that relay, so F11.S01.M01 roleFor resolves the relay operator context role of F18.S02.M02 transparency drafts and reports only from relay-signed operator lists.
non_responsibilities:
  - Registering currencies and validating that a code is a registered asset (F09.S03.M01 CurrencyDef); refusing records in a currency the tenant does not allow is done by the relay index and publish intake (F06.S01.M01, F11.S01.M02) through TenantPort.
  - Resolving jurisdiction profiles to retention and legal rules (F18.S01.M01); this module stores only the ProfileRef {publisherId?, code} and validates its format, F18.S01.M01 resolves a reference without publisherId (pinned profiles publisher of F18.S02.M01, then the bundled project publisher), so the default code generic resolves to the bundled generic profile of F18.S01.M01, and F18.S01.M01 falls back to that generic profile when the reference is unknown.
  - Message catalogs and locale negotiation (F14.S02.M01 falls back to en for an unsupported default locale).
  - Role assignment records and authorization decisions (F16.S01.M01 RoleAssignment is the single source of operator and admin roles; this module calls it through RoleBootstrapPort and security.roleassignment.assign and revoke with role operator at scope tenant:<id>, stores no operator list, and never grants an admin role outside bootstrap, because admin grants are security.roleassignment.propose and approve with a signed approval from a second admin).
  - Applying the display preferences (F14.S01.M01 motion, F14.S02.M02 money formatting) and email registration (F13.S01.M02 notify.email.add, which carries its own consented copy of defaultLocale).
  - Rate policy (F12.S03.M03 RatePolicy owns request rates; the tenant record has no rate limit).
  - Flag values (F15.S04.M02) and relay process configuration (F15.S02.M01).
  - Verifying transparency report and draft signatures and the compiler and reviewer separation (F18.S02.M02 with F11.S01.M01 roleFor); this module only publishes the signed operatorKeys and answers the operatorKeys resolver.
  - "Future: per-tenant branding and custom domains; Future: signed tenant directory shared between federated relays."
depends_on: [F15.S02.M03, F15.S02.M01, F15.S04.M01, F16.S01.M01, F10.S02.M02, CTR-ID-001, CTR-IDM-001, CTR-ERR-001, CTR-EVT-001, CTR-CAP-001, CTR-MNY-001, CTR-PRV-001, CTR-IOX-001, CTR-OBS-001, CTR-SCH-001, CTR-FED-001]
user_stories:
  - As a relay operator, I can start a relay for my town, name the community, choose EUR as the only currency, set the German default locale and limits, and name my own device key as the first operator and admin.
  - As a relay operator running two communities, I can configure each with different currencies and limits and suspend one without affecting the other.
  - As a member, I can set my own default language and preferred currencies on my device, and these settings are not shared with any relay.
  - As a member, I can see which currencies, jurisdiction profile, limits and operators the selected relay applies before I publish, signed by the relay, and I am told what changed since my last visit.
edge_cases:
  - Shrinking allowedCurrencies while listings in a removed currency exist; allowed, existing records keep their currency, the relay index and publish intake refuse new projections in removed currencies through TenantPort, and the change event carries the removed codes.
  - Removing the last operator assignment of a tenant; refused with PLATFORM_TENANT_LAST_OPERATOR so the community cannot become unmanageable.
  - Two operators edit settings at once; the second gets CONFLICT_REVISION with currentRevision.
  - A tenant is suspended; the bus TenantPort stage refuses member writes for it with PLATFORM_TENANT_SUSPENDED while reads and exports stay available, its operators may still configure and resume it, and other tenants and all vaults are unaffected.
  - The slug is malformed; refused with VALIDATION_FAILED; the slug is already used on this relay; refused with PLATFORM_TENANT_SLUG_TAKEN.
  - Bootstrap is run twice with the same arguments; the second run finds the existing tenant and role assignments and returns them unchanged (idempotent), a different slug on a single-tenant relay is refused.
  - A limit is set above its allowed maximum (for example maxUploadBytes 10 MiB or maxEnvelopeBytes 1 MiB); refused with VALIDATION_FAILED and the maximum (5242880, 262144) in fields.
  - An admin grants a tenant operator role directly through security.roleassignment.assign; this module consumes security.role.assigned and publishes a new signed configuration listing the new operator key.
  - Bootstrap names an admin key on a relay that already has an active admin; RoleBootstrapPort refuses with SECURITY_BOOTSTRAP_REFUSED and no tenant or assignment is created, unless the operator gives --break-glass with a reason of 20 to 500 code points, which F16.S01.M01 records with the OS user and reports as a SEV1 incident.
  - A relay admin sends platform.tenant.create over HTTP with adminKey; refused with VALIDATION_FAILED, because admin grants go only through security.roleassignment.propose and approve.
  - An operator sets anonymousMinRadiusKm 10, anonymousCenterLevel L2 or maxDepth 600; refused with VALIDATION_FAILED, because F06.S02.M03 never serves anonymous centers finer than L1, radii below 25 km or depths above 500.
  - An imported LocalSettings record carries a11yMotion fast or moneyDisplay emoji; the import keeps the other preferences and replaces each invalid value with its default (system, symbol).
  - A tenant operator tries to rotate the relay identity, run a backup or replay dead letters; refused with FORBIDDEN because those relay-wide capabilities need the relay_operator role.
  - The relay shows different configurations to different clients; each is a relay-signed statement with a revision, so a vault that sees two different statements for one revision holds proof and shows a warning.
  - The vault default locale is unsupported by the build; the app falls back to en and shows a notice, no error.
  - An operator sets jurisdictionProfile as a plain string, with code EU, with a publisherId that is not a did:key or with an extra field; refused with VALIDATION_FAILED and the field path, because the profile is stored only as ProfileRef {publisherId?, code}.
  - The tenant names code eu_de without publisherId, or a code no trusted publisher has; the reference is stored and signed as given and F18.S01.M01 resolves it (pinned profiles publisher, then the bundled project publisher) or falls back to the bundled generic profile; this module never refuses a well-formed code for being unknown.
  - A vault verifies a transparency report for a relay whose verified tenant_config it does not hold, or signed by a key removed from operatorKeys in the latest verified statement; the operatorKeys resolver answers none or a list without that key, so F11.S01.M01 roleFor resolves no relay operator role and the report is quarantined by the receiving path.
ux:
  screens:
    - "Operator console > Community: form for display name, currencies (chip input with ISO code check), jurisdiction profile (select of code with optional publisher key; default generic), default locale (select), limits table with defaults, maximums and the enforcing module, and the operators list (from F16 role assignments) with add (admin) and remove (admin)."
    - "Settings > Preferences (vault): language, preferred currencies, display options (reduce motion: follow system or reduced; money shown as symbol, code or name); clearly marked 'Stored on this device; your language is also shared with your email relay if you turn on email notifications'."
    - "Relay details sheet (client): shows the selected relay's signed community configuration (name, allowed currencies, jurisdiction profile reference, limits, operators, status), its revision and 'Changed since your last visit' with the differences."
  states: [loading, ready, saving, conflict, suspended, archived, offline-read-only, validation-error, config-equivocation]
  a11y:
    - Every field has a visible label with units (for example bytes shown as MiB) and error messages are linked with aria-describedby.
    - Currency chips are removable by keyboard with accessible names, and status changes are announced via aria-live polite.
    - Destructive actions (suspend, archive, remove operator) use a confirmation dialog with focus on the cancel action.
processes:
  domain_schema:
    requirements:
      - A Tenant stores slug, display name, status, allowed currencies, jurisdiction profile reference (ProfileRef), default locale, limits and revision with the base record fields of CTR-ID-001 (id is the tenantId); its operator keys are not stored but derived from F16.S01.M01 RoleAssignment records of scope tenant:<id>.
      - Tenant data is public hosting information (P0), including the derived operator public keys, and is retained as RET-STANDARD while the community exists.
      - LocalSettings is the vault's own preference record (P3, stored only on the device and exported with the vault) and holds the vaultId, a UUIDv7 created once at vault initialisation that is the CTR-ID-001 ID-6 tenantId of every record in that vault; the vault has no relay tenant record.
      - Every limit is capped by the platform maximums (maxUploadBytes and maxLocalAttachmentBytes ≤ 5242880 per N9, maxEnvelopeBytes ≤ 262144 per CTR-SCH-001 SCH-6) and names the module that enforces it; a limit without an enforcer is not part of the record.
      - Tenant limits hold the relay discovery settings read by F06.S02.M03 - anonymousAllowed (default true), anonymousMinRadiusKm (25, 50 or 100, default 25), anonymousCenterLevel (L1, the only public level coarse enough for anonymous callers) and maxDepth (1..500, default 500) - and they appear in every signed configuration statement.
      - LocalSettings holds the optional display preferences a11yMotion (system or reduced, default system) and moneyDisplay (symbol, code or name, default symbol), returned with their defaults by platform.local_settings.get and changed only through platform.local_settings.update.
      - The tenant jurisdictionProfile is a ProfileRef {publisherId?, code} of F18.S01.M01 - code matching ^[a-z0-9_-]{2,40}$, publisherId an optional did:key Ed25519 publisher key - with default code generic and no publisherId, which resolves to the bundled generic profile of F18.S01.M01; it appears in the Tenant, in every signed configuration statement and in the platform.tenant.created and platform.tenant.configured payloads, and this module never resolves it.
    entities:
      - name: Tenant
        schema: classrup.platform.tenant/v1
        storage: relay
        privacy: P0
        retention: RET-STANDARD
        fields:
          - "id: uuidv7 — primary key, used as tenantId everywhere on this relay"
          - "slug: string — ^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$, unique per relay"
          - "displayName: string — 1..80 characters, plain text"
          - "status: enum — active | suspended | archived"
          - "allowedCurrencies: string[] — 1..20 distinct codes matching ^[A-Z0-9]{2,12}$ (ISO 4217 alpha-3 or configured asset code); enforced by the relay index and publish intake (F06.S01.M01, F11.S01.M02)"
          - "jurisdictionProfile: ProfileRef — { publisherId?: did:key (Ed25519 publisher key), code: ^[a-z0-9_-]{2,40}$ } of F18.S01.M01, default { code: 'generic' }, which resolves to the bundled generic profile of F18.S01.M01; a reference without publisherId is resolved by F18.S01.M01 (pinned profiles publisher, then the bundled project publisher)"
          - "defaultLocale: string — BCP 47 tag matching ^[a-z]{2,3}(-[A-Z]{2})?$, default 'en'"
          - "limits: json — { maxIndexedListingsPerPublisher 1..1000 default 100 (F06.S01.M01 index write), maxUploadBytes 65536..5242880 default 5242880 (F15.S02.M01 media upload), maxMailboxBytesPerRecipient 1048576..1073741824 default 52428800 (F08.S01.M01), maxEnvelopeBytes 4096..262144 default 262144 (F08.S01.M01), maxCycleLength 3..6 default 5 (F02.S02.M03 relay matching), anonymousAllowed boolean default true, anonymousMinRadiusKm 25 | 50 | 100 default 25, anonymousCenterLevel L1 default L1, maxDepth 1..500 default 500 (the four relay discovery settings of F06.S02.M03 proximity queries) }"
          - "operatorKeys: derived string[] — did:key subjects of active F16.S01.M01 RoleAssignments with role operator and scope tenant:<id>; read through F16, never stored here; published in every classrup.platform.tenant_config/v1 statement, where F18.S02.M02 receivers verify transparency compiler and reviewer keys"
          - "suspendedReason?: string — ≤ 200 characters, shown to clients"
          - "suspendedAt?: timestamp — RFC 3339 UTC"
          - "configStatementCid: string — cid of the relay-signed classrup.platform.tenant_config/v1 statement of the current revision"
          - "revision: int — CTR-ID-001 ID-4"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - At least one active F16.S01.M01 operator RoleAssignment of scope tenant:<id> exists while status is active or suspended.
          - slug is unique per relay and immutable after creation.
          - Every limit stays within its documented minimum and maximum, and the maximums never exceed the platform caps.
          - A tenant in archived status accepts no writes and no configuration changes.
          - Every revision has exactly one relay-signed tenant_config statement, issued in the transaction that created the revision.
      - name: LocalSettings
        schema: classrup.platform.local_settings/v1
        storage: device
        privacy: P3
        retention: RET-STANDARD
        fields:
          - "id: uuidv7 — primary key, one record per vault"
          - "vaultId: uuidv7 — created once at vault initialisation; the CTR-ID-001 ID-6 tenantId of every record in this vault (the dispatch context tenantId of F15.S02.M02); immutable and never sent to a relay"
          - "defaultLocale: string — BCP 47 tag, default taken from the browser language, fallback 'en'"
          - "preferredCurrencies: string[] — 0..20 codes matching ^[A-Z0-9]{2,12}$, used for display and defaults only"
          - "localLimits: json — { maxLocalAttachmentBytes 65536..5242880 default 5242880 (vault blob store of F15.S02.M03 and F08.S01.M03), maxOutboxEntries 10..200 default 200 (F15.S01.M01) }"
          - "a11yMotion?: enum — system | reduced; default system; read by the PWA shell and passed to F14.S01.M01 setMotionPreference"
          - "moneyDisplay?: enum — symbol | code | name; default symbol; read by the PWA shell and passed to F14.S02.M02 formatMoney as the display option"
          - "knownRelayConfigs?: json — per relayId the last verified tenant_config statement { tenantId, revision, cid, statement } used to show what changed and read by the vault operatorKeys resolver"
          - "revision: int — CTR-ID-001 ID-4"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - Exactly one LocalSettings record exists per vault and the record is never sent to a relay; the only value that leaves the device is a copy of defaultLocale in the F13.S01.M02 notify.email.add registration after notify_email consent, sealed to that one user-selected email relay.
          - a11yMotion and moneyDisplay, when present, hold one of their enum values; an invalid stored or imported value is replaced with the default.
          - Local limits can only be lower than or equal to the platform maximums (never raise a relay's limits).
          - vaultId never changes after vault initialisation.
    sql: |
      CREATE TABLE platform_tenant (
        id TEXT PRIMARY KEY, slug TEXT NOT NULL, status TEXT NOT NULL CHECK (status IN ('active','suspended','archived')),
        revision INTEGER NOT NULL, config_cid TEXT NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX platform_tenant_slug ON platform_tenant(slug);
      CREATE TABLE platform_tenant_config (tenant_id TEXT NOT NULL, revision INTEGER NOT NULL, cid TEXT NOT NULL,
        statement TEXT NOT NULL, PRIMARY KEY (tenant_id, revision)) WITHOUT ROWID;
      -- vault: LocalSettings is an F15.S02.M03 record of type platform.local_settings whose tenant is its own vaultId
  validation_rules:
    requirements:
      - Tenant input is validated strictly; unknown fields are rejected with VALIDATION_FAILED and each violation lists its field path.
      - Currency, locale and profile values are validated for format here and for registry membership by their owning modules at use time.
      - Operator assignment rules protect the community from becoming unmanageable, and operators can be added only by an admin with an expiry.
      - Bootstrap passes admin keys only through RoleBootstrapPort from the local CLI, which refuses an admin key while an active relay admin exists unless a break-glass reason of 20 to 500 code points is given, and admin grants on a bootstrapped relay go only through security.roleassignment.propose and approve.
      - Discovery settings and the LocalSettings display preferences are validated against their enums and ranges, and an import replaces an invalid display preference with its default instead of failing.
    rules:
      - "V01 | slug matches ^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$ | VALIDATION_FAILED"
      - "V02 | displayName is 1..80 characters of plain text | VALIDATION_FAILED"
      - "V03 | allowedCurrencies has 1..20 distinct codes matching ^[A-Z0-9]{2,12}$ | VALIDATION_FAILED"
      - "V04 | defaultLocale matches ^[a-z]{2,3}(-[A-Z]{2})?$ and jurisdictionProfile is a ProfileRef object with only code matching ^[a-z0-9_-]{2,40}$ and an optional publisherId that is a valid did:key Ed25519 key | VALIDATION_FAILED"
      - "V05 | each limit is within its documented range, maxUploadBytes and maxLocalAttachmentBytes ≤ 5242880 and maxEnvelopeBytes ≤ 262144 | VALIDATION_FAILED"
      - "V06 | create and bootstrap name 1..10 distinct valid did:key Ed25519 operator keys; bootstrap names at most one admin key | VALIDATION_FAILED"
      - "V07 | removing an operator assignment through this module leaves at least 1 active operator assignment of scope tenant:<id> | PLATFORM_TENANT_LAST_OPERATOR"
      - "V08 | member writes to a tenant require status active (TenantPort stage of the bus); configure and assign_operator are allowed in active and suspended and refused in archived | PLATFORM_TENANT_SUSPENDED"
      - "V09 | the relay hosts at most 50 tenants | PLATFORM_TENANT_LIMIT"
      - "V10 | expectedRevision equals the stored revision | CONFLICT_REVISION"
      - "V11 | slug is not in use by another tenant on this relay | PLATFORM_TENANT_SLUG_TAKEN"
      - "V12 | an operator added through assign_operator carries expiresInMs ≤ 31536000000 (365 days), as F16.S01.M01 requires for operator roles | VALIDATION_FAILED"
      - "V13 | a LocalSettings patch never contains vaultId and localLimits stay within their ranges | VALIDATION_FAILED"
      - "V14 | limits.anonymousAllowed is boolean, anonymousMinRadiusKm is 25, 50 or 100, anonymousCenterLevel is L1 and maxDepth is 1..500 | VALIDATION_FAILED"
      - "V15 | a LocalSettings patch sets a11yMotion only to system or reduced and moneyDisplay only to symbol, code or name (an import replaces any other value with the default instead) | VALIDATION_FAILED"
      - "V16 | an adminKey or breakGlassReason reaches RoleBootstrapPort.bootstrap only from the local relay CLI; the port refuses an admin key while an active relay admin exists unless breakGlassReason has 20..500 code points | SECURITY_BOOTSTRAP_REFUSED"
      - "V17 | platform.tenant.create over HTTP by an admin carries no adminKey or breakGlassReason; admin grants use security.roleassignment.propose and approve | VALIDATION_FAILED"
  workflow_state_machine:
    requirements:
      - A tenant is created directly in active within one transaction that also creates its first operator and admin role assignments through F16 RoleBootstrapPort.bootstrap({ adminKey?, operatorKeys, tenantId, breakGlassReason?, osUser }) and its first signed configuration statement, so no partially provisioned tenant exists (a SECURITY_BOOTSTRAP_REFUSED answer rolls everything back), and any transition not listed is refused with CONFLICT_STATE.
      - Suspension is reversible; archiving is final and is allowed only from suspended to prevent accidents.
      - Status changes are written with their event and the new signed configuration statement in one transaction.
    machines:
      - entity: Tenant
        initial: active
        terminal: [archived]
        transitions:
          - "active -> suspended | platform.tenant.change_status by a tenant operator or admin with a reason | bus TenantPort refuses member writes with PLATFORM_TENANT_SUSPENDED; new signed configuration; emits platform.tenant.status_changed"
          - "suspended -> active | platform.tenant.change_status by a tenant operator or admin | new signed configuration; emits platform.tenant.status_changed"
          - "suspended -> archived | platform.tenant.change_status by admin after 30 days suspended | read-only export remains for 90 days; tenant role assignments revoked through F16; emits platform.tenant.status_changed"
    timeouts:
      - "Archiving requires the tenant to have been suspended for at least 2592000000 ms (30 days); archived tenants are purged from the relay 7776000000 ms (90 days) after archiving."
      - "Configuration cache TTL 30000 ms in TenantPort, invalidated immediately on change; clients re-fetch the signed configuration at most every 30000 ms."
  commands_queries_events:
    requirements:
      - Tenant commands are relay commands with Idempotency-Key; LocalSettings commands are vault-local; every tenant revision produces one relay-signed classrup.platform.tenant_config/v1 statement, signed through F15.S02.M01 under context classrup-tenant-config:v1 with signer role relay_identity and registered with F11.S01.M01 (N2).
      - Every tenant command emits its events in the same transaction as the state change, and platform.tenant.configured carries the full configuration snapshot (it is also emitted at creation and on operator changes), so consumers such as F10.S01.M02 never need to read the tenant.
      - The module consumes security.role.assigned and security.role.revoked for tenant-scoped roles to re-issue the configuration with the derived operator keys, and privacy.deletion.completed for LocalSettings.
      - TenantPort is registered with the F15.S02.M02 bus as a stage after authentication that returns PLATFORM_TENANT_SUSPENDED for writes to a suspended or archived tenant, and with the F15.S02.M01 relay process; it offers limits(tenantId) to the enforcers named per limit (F06.S01.M01, F06.S02.M03, F11.S01.M02, F08.S01.M01, F02.S02.M03 depend on this module; the bus, the relay process and the vault blob store receive it by inverted registration because they are upstream of it).
      - The vault keeps the last verified configuration statement per selected relay in LocalSettings.knownRelayConfigs and shows what changed; two different statements for one (tenantId, revision) are proof of equivocation and shown as a warning.
      - Every classrup.platform.tenant_config/v1 statement carries jurisdictionProfile as ProfileRef {publisherId?, code} and the derived operatorKeys; the vault registers an operatorKeys resolver with F11.S01.M01 at composition (inverted registration, no depends_on edge) that answers operatorKeys(relayId) from the verified statement in LocalSettings.knownRelayConfigs and answers none when the vault holds no verified statement for that relay, so F18.S02.M02 transparency drafts and reports resolve the relay operator role only from a relay-signed operator list.
    commands:
      - name: platform.tenant.create
        capability: platform.tenant.create
        input: "{ slug, displayName, allowedCurrencies, jurisdictionProfile?: ProfileRef { publisherId?, code } (default { code: generic }), defaultLocale?, limits?, operatorKeys (1..10), adminKey? (local CLI bootstrap only), breakGlassReason? (local CLI only, 20..500 code points) } — relay command, admin over HTTP (no adminKey) or local CLI bootstrap; first assignments created through F16 RoleBootstrapPort.bootstrap({ adminKey?, operatorKeys, tenantId, breakGlassReason?, osUser }) in the same transaction"
        output: "{ tenantId, revision: 1, status: active, configStatementCid, roleAssignmentIds }"
        errors: [FORBIDDEN, VALIDATION_FAILED, PLATFORM_TENANT_SLUG_TAKEN, PLATFORM_TENANT_LIMIT, SECURITY_BOOTSTRAP_REFUSED]
        emits: [platform.tenant.created, platform.tenant.configured]
        idempotent: true
      - name: platform.tenant.configure
        capability: platform.tenant.configure
        input: "{ tenantId, expectedRevision, patch: { displayName?, allowedCurrencies?, jurisdictionProfile?: ProfileRef { publisherId?, code }, defaultLocale?, limits? } } — relay command, tenant operator or admin"
        output: "{ tenantId, revision, changed: string[], configStatementCid }"
        errors: [FORBIDDEN, NOT_FOUND, VALIDATION_FAILED, CONFLICT_REVISION, PLATFORM_TENANT_SUSPENDED]
        emits: [platform.tenant.configured]
        idempotent: true
      - name: platform.tenant.assign_operator
        capability: platform.tenant.assign_operator
        input: "{ tenantId, expectedRevision, add?: [{ key: did:key, expiresInMs ≤ 31536000000 }], remove?: roleAssignmentId[] } — relay command, admin only; calls security.roleassignment.assign and revoke (F16.S01.M01) with role operator and scope tenant:<tenantId> in the same transaction; never grants an admin role (admin grants are security.roleassignment.propose and approve)"
        output: "{ tenantId, revision, operatorKeys (derived), roleAssignmentIds, configStatementCid }"
        errors: [FORBIDDEN, NOT_FOUND, VALIDATION_FAILED, CONFLICT_REVISION, PLATFORM_TENANT_LAST_OPERATOR, PLATFORM_TENANT_SUSPENDED]
        emits: [platform.tenant.configured]
        idempotent: true
      - name: platform.tenant.change_status
        capability: platform.tenant.change_status
        input: "{ tenantId, expectedRevision, status: active|suspended|archived, reason? } — relay command, tenant operator (suspend, resume) or admin (archive)"
        output: "{ tenantId, revision, status, configStatementCid }"
        errors: [FORBIDDEN, NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, VALIDATION_FAILED]
        emits: [platform.tenant.status_changed]
        idempotent: true
      - name: platform.local_settings.update
        capability: platform.local_settings.update
        input: "{ expectedRevision?, patch: { defaultLocale?, preferredCurrencies?, localLimits?, a11yMotion?: system|reduced, moneyDisplay?: symbol|code|name } } — vault-local command, actor is the unlocked local principal"
        output: "{ revision }"
        errors: [VALIDATION_FAILED, CONFLICT_REVISION]
        emits: []
        idempotent: true
    queries:
      - name: platform.tenant.get
        capability: platform.tenant.read_public
        input: "{ tenantId? | slug?, revision? } — relay query, public; defaults to the relay's only tenant and the current revision"
        output: "{ statement: classrup.platform.tenant_config/v1 { relayId, tenantId, slug, displayName, revision, status, suspendedReason?, allowedCurrencies, jurisdictionProfile: ProfileRef { publisherId?, code }, defaultLocale, limits, operatorKeys (derived did:key[], verified by F18.S02.M02 receivers), issuedAt, keyId, sig } }"
        errors: [NOT_FOUND]
      - name: platform.tenant.list
        capability: platform.tenant.list
        input: "{ status?, cursor?, limit ≤ 50 } — relay query, admin"
        output: "{ items: Tenant[], nextCursor? }"
        errors: [FORBIDDEN]
      - name: platform.local_settings.get
        capability: platform.local_settings.read
        input: "{ } (no input) — vault-local query"
        output: "{ vaultId, defaultLocale, preferredCurrencies, localLimits, a11yMotion (default system), moneyDisplay (default symbol), knownRelayConfigs?, revision }"
        errors: []
    events_produced:
      - {type: platform.tenant.created, privacy: P0, payload: "{ tenantId, slug, revision, allowedCurrencies, defaultLocale, jurisdictionProfile: ProfileRef { publisherId?, code }, limits, operatorKeys, configStatementCid }"}
      - {type: platform.tenant.configured, privacy: P0, payload: "{ tenantId, revision, changed: string[], status, allowedCurrencies, removedCurrencies, jurisdictionProfile: ProfileRef { publisherId?, code }, defaultLocale, limits, operatorKeys, configStatementCid } (full snapshot on every revision, including revision 1 at creation)"}
      - {type: platform.tenant.status_changed, privacy: P0, payload: "{ tenantId, from, to, reason?, revision, configStatementCid }"}
    events_consumed:
      - {type: security.role.assigned, effect: "when the assignment's scope is tenant:<id> with role operator, re-issue that tenant's signed configuration with the derived operatorKeys and emit platform.tenant.configured with changed [operatorKeys]"}
      - {type: security.role.revoked, effect: "when the revoked assignment's scope is tenant:<id> with role operator, re-issue that tenant's signed configuration and emit platform.tenant.configured with changed [operatorKeys]"}
      - {type: privacy.deletion.completed, effect: "confirm that the DeletionPort removed the deleted principal's LocalSettings (vault erase); LocalSettings hold no evidence, so nothing is pseudonymized"}
    errors:
      - "PLATFORM_TENANT_SLUG_TAKEN | 409 | no | a tenant with this slug already exists on this relay"
      - "PLATFORM_TENANT_LAST_OPERATOR | 409 | no | the change would leave the tenant with no active operator assignment"
      - "PLATFORM_TENANT_SUSPENDED | 403 | no | tenant is suspended or archived on this relay; writes are refused"
      - "PLATFORM_TENANT_LIMIT | 409 | no | the relay already hosts the maximum of 50 tenants"
    example: |
      $ relay tenant bootstrap --slug oldtown --name "Old Town Swap" --currencies EUR --locale de --operator did:key:z6MkOp... --admin did:key:z6MkAd...
      -> RoleBootstrapPort.bootstrap({ adminKey: "did:key:z6MkAd...", operatorKeys: ["did:key:z6MkOp..."], tenantId: "0192f3a4-…", osUser: "classrup" })
      -> tenant created (revision 1), RoleAssignments operator scope tenant:0192f3a4-… and admin scope relay created in the same transaction
      $ relay tenant bootstrap --slug riverside ... --admin did:key:z6MkAd2...   (an admin already exists)
      -> SECURITY_BOOTSTRAP_REFUSED; nothing created (add --break-glass --reason "<20..500 code points>" only after a confirmed admin compromise)
      vault: platform.local_settings.update { "patch": { "a11yMotion": "reduced", "moneyDisplay": "code" } } -> { "revision": 4 }
      POST /api/v1/cmd/platform.tenant.configure
      Idempotency-Key: 0192f3a4-0000-7000-8000-000000000021
      { "tenantId": "0192f3a4-5b6c-7d8e-9f01-23456789abcd", "expectedRevision": 1, "patch": { "allowedCurrencies": ["EUR", "CHF"], "limits": { "maxUploadBytes": 3145728 } } }
      200 { "tenantId": "0192f3a4-…", "revision": 2, "changed": ["allowedCurrencies", "limits"], "configStatementCid": "sha256-Tc2..." }
      event platform.tenant.configured { "tenantId": "0192f3a4-…", "revision": 2, "changed": ["allowedCurrencies","limits"], "status": "active",
        "allowedCurrencies": ["EUR","CHF"], "removedCurrencies": [], "jurisdictionProfile": { "code": "generic" }, "defaultLocale": "de", "limits": { … }, "operatorKeys": ["did:key:z6MkOp..."] }
  authorization_capabilities:
    requirements:
      - Relay policy applies; operator and admin roles are F16.S01.M01 RoleAssignment records - an operator scoped tenant:<id> manages only that tenant's configuration and status, a relay admin manages the tenant list and operator assignments, relay-wide capabilities (identity, backups, recovery, dead letters) need the distinct relay_operator role, and no role has any effect on a vault or on other relays (CTR-CAP-001 CAP-9).
      - Operators authenticate with signed requests or relay access tokens obtained by challenge-response; the relay stores no passwords and the tenant record stores no operator list of its own.
      - Vault policy applies to LocalSettings, so only the unlocked local principal reads or changes them, and no relay can read or write them.
    capabilities:
      - "platform.tenant.create | admin | relay-scope admin RoleAssignment, or local CLI with filesystem access to the relay data directory (bootstrap creates the first assignments through RoleBootstrapPort)"
      - "platform.tenant.configure | operator, admin | active F16.S01.M01 operator RoleAssignment of scope tenant:<tenantId>, or admin; tenant status active or suspended"
      - "platform.tenant.assign_operator | admin | relay-scope admin; delegates to security.roleassignment.assign and revoke with expiry ≤ 365 days; last operator cannot be removed; tenant operators cannot add operators"
      - "platform.tenant.change_status | operator, admin | tenant operator of scope tenant:<tenantId> may suspend and resume; archive needs admin and 30 days suspended"
      - "platform.tenant.read_public | anonymous, member, moderator, operator, relay_operator, admin | none; returns the relay-signed configuration statement"
      - "platform.tenant.list | admin | relay-scope admin RoleAssignment"
      - "platform.local_settings.update | local-principal | vault unlocked"
      - "platform.local_settings.read | local-principal | vault unlocked"
  failure_recovery_idempotency:
    requirements:
      - All relay commands are idempotent per CTR-IDM-001 and use expectedRevision, so concurrent operator edits never overwrite each other.
      - Bootstrap is safe to run repeatedly and never creates duplicate tenants or duplicate role assignments.
      - Vault-local settings changes work offline and have no distributed effect.
    idempotency: "Relay commands require Idempotency-Key with 24 h replay. platform.tenant.create with an existing slug and identical content returns the existing tenant and its assignments (idempotent), with different content PLATFORM_TENANT_SLUG_TAKEN. platform.local_settings.update with the same patch returns the current revision. Re-issuing a configuration statement for a revision that already has one returns the stored statement."
    concurrency: "expectedRevision on configure, assign_operator and change_status; the unique slug index serializes concurrent creates; all writes run in one BEGIN IMMEDIATE transaction together with the F16 role rows, the signed configuration statement and the outbox event row."
    retries: "Clients retry network errors and RATE_LIMITED with IDM-4 backoff; conflicts and validation errors are not retried automatically."
    offline: "Tenant commands need the relay and are not queued because they are operator decisions needing live feedback; clients keep the last verified configuration statement in LocalSettings and show it marked as possibly stale when the relay is unreachable. LocalSettings work fully offline."
    partial_failure: "If the RoleBootstrapPort, the signing or the event row fails the transaction rolls back and no tenant, assignment or change is visible. If a consumer fails on platform.tenant.configured it retries and dead-letters per CTR-EVT-001 EVT-6 without affecting the tenant record."
  privacy_retention_abuse:
    requirements:
      - Tenant configuration is public hosting information and contains no personal data beyond operator public keys, which are pseudonymous identifiers and not proof of anonymity.
      - LocalSettings are P3, stay on the device, are not telemetry and are never uploaded as a record; they can reveal a user's language, currencies and chosen relays, so they are excluded from federation and from any relay request, with one exception - a copy of defaultLocale is sent only in the F13.S01.M02 notify.email.add registration after notify_email consent, sealed to that one user-selected email relay.
      - Archived tenants are purged after 90 days and their exported configuration remains with the operator.
      - The module registers ExportSectionPort (section platform.local_settings), DeletionPort and RetentionPurgePort for F10.S01.M03, F10.S01.M04 and F10.S01.M02 through the kernel port registry (inverted dependency, because F10.S01.M04 depends on F15.S01.M01, which depends on this module), classifies every field with F10.S02.M02 and consumes privacy.deletion.completed (N6).
    data:
      - "Tenant and tenant_config statements: P0 public hosting configuration and derived operator public keys."
      - "LocalSettings: P3 preferences (defaultLocale, preferredCurrencies, a11yMotion, moneyDisplay), vaultId and known relay configurations, device only; a copy of defaultLocale leaves the device only in the consented F13.S01.M02 email registration to the one selected email relay, where F13.S01.M02 owns that copy."
    retention:
      - "Tenant: RET-STANDARD while the community exists; archived tenants purged 90 days after archiving; configuration statements kept as long as the tenant; operator audit of tenant changes 1 year (RET-AUDIT)."
      - "LocalSettings: until the vault is erased (DeletionPort)."
    threats:
      - "T01 | Rogue operator weakens limits or changes currencies to harm members | every revision is a relay-signed statement vaults store and compare before publishing, limits have hard maximums, all changes audited, members may leave"
      - "T02 | Takeover by adding a malicious operator key | operators exist only as F16.S01.M01 RoleAssignments granted by a relay admin with expiry ≤ 365 days; tenant operators cannot add operators or use relay-wide capabilities; the last operator is protected; operator keys appear in every signed configuration, so a vault sees the change"
      - "T03 | Slug squatting or lookalike community names | slug unique per relay, display name plain text only, relay identity fingerprint shown in the client next to the name"
      - "T04 | Leakage of local preferences to a relay | LocalSettings never included in any relay request or statement, except the defaultLocale copy in the F13.S01.M02 notify.email.add registration after notify_email consent, sealed to that one user-selected email relay; network test verifies both the exception and its absence without consent"
      - "T08 | Break-glass bootstrap used to seize a running relay | RoleBootstrapPort refuses an admin key while an admin exists unless a 20..500 code point reason is given from the local CLI; F16.S01.M01 records the OS user and opens a SEV1 incident; HTTP create never carries an admin key"
      - "T05 | Tenant enumeration across relays | platform.tenant.get is public by design for the relay's own communities only; no cross-relay directory in MVP"
      - "T06 | Relay shows different configurations to different clients | each revision is a relay-signed statement; two statements for one revision are kept as proof and shown as an equivocation warning"
      - "T07 | Cross-tenant escalation by an operator of another community | every tenant capability checks a RoleAssignment of scope tenant:<tenantId>; abuse tests cover T1 operators acting on T2"
    abuse_controls:
      - "Tenant creation limited to relay admins and 50 tenants per relay; configure limited to 30 changes per minute per operator."
      - "Suspension by an operator requires a reason that is shown to clients, and every status change is audit-logged with actor and capability."
  observability_performance:
    requirements:
      - Relay tenant operations are measured per CTR-OBS-001 with the tenant label limited to a hashed short id, never names.
      - Configuration reads are served from cache and meet the read budget; the vault sends no telemetry (OBS-7).
      - Event delivery lag for tenant events is observable so that consumers apply configuration promptly.
    metrics:
      - "classrup_platform_tenant_changes_total{outcome=ok|conflict|invalid|forbidden}"
      - "classrup_platform_tenant_config_read_duration_ms (relay histogram)"
      - "classrup_platform_tenant_count{status=active|suspended|archived}"
      - "classrup_platform_tenant_writes_refused_total{code=PLATFORM_TENANT_SUSPENDED}"
    logs:
      - "info tenant.configured {tenantHash, changed[], revision}; info tenant.status_changed {tenantHash, from, to} — no display names, no operator keys."
    budgets:
      - "platform.tenant.get p95 ≤ 20 ms cached and ≤ 150 ms cold (OBS-4); configure p95 ≤ 300 ms including signing."
      - "Cache TTL 30 s; consumers apply platform.tenant.configured within 2 s p95 under the dispatcher budget; the TenantPort stage adds ≤ 1 ms p95 to a command."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Contract tests check command inputs, outputs and event payloads against the schema registry for both relay and vault commands.
      - A privacy test proves LocalSettings never leave the device, except the consented defaultLocale copy in the F13.S01.M02 email registration.
    fixtures: "Relay with F16.S01.M01 role fixtures (admin A1 scope relay, relay_operator R1, operators O1 scope tenant:T1 and O2 scope tenant:T2, member M1), tenants T1 (EUR) and T2 (CHF); stub enforcers for F06.S01.M01, F08.S01.M01, F02.S02.M03 and the F15.S02.M01 media route reading TenantPort; vaults V1 and V2 with local principal L1; profile publisher key KP and an F18.S01.M01 resolve stub with the bundled generic profile; an F11.S01.M01 roleFor stub and an F18.S02.M02 receive stub with transparency drafts and reports signed by O1, O2 and non-operator key X; fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,02.R01 | create a tenant with valid input | stored with revision 1, status active, defaults applied, schema classrup.platform.tenant/v1, operatorKeys read from F16"
      - "T02 | unit | 02.R01,02.R02,02.R03 | each rule V01-V13 violated in turn | documented code returned and nothing stored; a malformed slug gets VALIDATION_FAILED and a used slug PLATFORM_TENANT_SLUG_TAKEN; fields list the offending paths"
      - "T03 | property | 03.R01,03.R02 | random sequences of status commands | only declared transitions occur; archived never changes; archive requires 30 days suspended"
      - "T04 | integration | 03.R03,04.R02,06.R03 | status change with injected event-insert failure | transaction rolled back, no status change, no new statement, no event"
      - "T05 | contract | 04.R01,04.R02,04.R03 | all commands and queries on relay and in vault | outputs and the three event payloads validate against registry schemas; only the tenant_config statement is produced"
      - "T06 | abuse | 05.R01,05.R02,05.R03 | M1 configures T1; O1 edits T2; relay tries to read LocalSettings | FORBIDDEN or NOT_FOUND; no relay path to LocalSettings"
      - "T07 | integration | 06.R01,06.R02 | replay same Idempotency-Key with same and different body; run bootstrap twice; stale expectedRevision | original response replayed; IDEMPOTENCY_KEY_REUSED; second bootstrap returns existing tenant and assignments; CONFLICT_REVISION"
      - "T08 | integration | 06.R03,05.R03 | vault offline, change language and currencies; relay offline, read tenant | LocalSettings update works; tenant shown from the stored signed statement marked stale"
      - "T09 | integration | 07.R01,07.R03 | archive tenant and advance 90 days | purged from relay; operator export exists; audit retained 1 year"
      - "T10 | abuse | 07.R02,07.R01,01.R03 | capture network traffic during LocalSettings changes (including a11yMotion and moneyDisplay), publishing, and the email opt-in with and without notify_email consent | zero requests contain currency preferences, display preferences or the vaultId; the locale appears only in the consented notify.email.add registration, sealed to that one selected email relay, and not at all without consent"
      - "T11 | abuse | 07.R01,07.R02 | O1 adds a key through assign_operator; A1 removes the last operator of T1 | FORBIDDEN and PLATFORM_TENANT_LAST_OPERATOR; the client shows the signed configuration with unchanged operators"
      - "T12 | load | 08.R02,08.R03 | 50 req/s tenant reads and 5 configure per second for 5 minutes | read p95 ≤ 20 ms cached, configure p95 ≤ 300 ms, consumers apply within 2 s"
      - "T13 | unit | 08.R01 | metrics scrape | counters per CTR-OBS-001 naming, tenant label hashed, no names"
      - "T14 | unit | 09.R01 | traceability tool run | every PS-125 requirement maps to a passing test"
      - "T15 | contract | 09.R02,09.R03,01.R03 | schema registry validation of Tenant, LocalSettings and events; privacy suite | all payloads valid; LocalSettings (with vaultId) classified P3 and absent from relay and federation payloads"
      - "T16 | a11y | 04.R01 | operator console Community form, relay details sheet and Settings > Preferences scanned with axe | zero serious issues; errors linked via aria-describedby; targets ≥ 44 px"
      - "T17 | integration | 10.R01,10.R02,10.R03,01.R03 | export vault with LocalSettings, import into fresh vault; restore relay from backup; roll back one release | LocalSettings round-trip while the fresh vault keeps its own vaultId; tenants and statements restored with same IDs; old reader ignores new optional fields"
      - "T18 | integration | 04.R02,01.R04 | shrink allowedCurrencies with existing records in a removed currency | change accepted, event carries removedCurrencies and the full snapshot, existing records untouched, the index intake stub refuses a new projection in the removed currency"
      - "T19 | abuse | 05.R01,05.R02 | tenant operator O1 calls assign_operator, security.roleassignment.assign, platform.relay_identity.rotate, platform.backup.run and platform.deadletter.replay | all FORBIDDEN; R1 (relay_operator) may run the relay-wide ones and still cannot configure T1"
      - "T20 | abuse | 05.R01,04.R04 | O1 suspends T2; T1 suspended by O1, then M1 writes to T1 and T2 | first FORBIDDEN; member writes to T1 refused by the bus TenantPort stage with PLATFORM_TENANT_SUSPENDED, writes to T2 succeed, reads and exports of T1 succeed, O1 can still configure and resume T1"
      - "T21 | contract | 04.R01,04.R05 | fetch the signed configuration for revisions 1 and 2; then a relay stub serves V1 and V2 different statements for revision 2 | statements verify under context classrup-tenant-config:v1 with the relay key; V1 stores revision 1 and shows the diff to revision 2; the conflicting statement for one revision raises the equivocation warning"
      - "T22 | contract | 01.R04,04.R04 | set maxUploadBytes 3145728, maxEnvelopeBytes 65536, maxIndexedListingsPerPublisher 2, maxCycleLength 3; then try maxUploadBytes 10485760 and maxEnvelopeBytes 1048576 | the media route refuses a 4 MiB upload, the mailbox stub a 70 KiB envelope, the index stub the third listing, the matching stub a 4-cycle; the oversized limits are refused with VALIDATION_FAILED"
      - "T23 | integration | 03.R01,06.R02 | bootstrap with a RoleBootstrapPort that fails on the admin assignment; then a successful bootstrap | no tenant and no assignment after the failure; afterwards one tenant in active with operator and admin assignments and revision 1 statement in one transaction"
      - "T24 | integration | 04.R03 | A1 grants O3 operator for T1 directly with security.roleassignment.assign, then revokes it | each change yields a new signed configuration and platform.tenant.configured with changed [operatorKeys] listing, then dropping, O3"
      - "T25 | unit | 01.R03 | initialise vaults V1 and V2, dispatch a vault command in each, try a LocalSettings patch with vaultId | each vault has one immutable UUIDv7 vaultId used as the dispatch context tenantId of its records; the two differ; the patch is refused with VALIDATION_FAILED"
      - "T26 | integration | 07.R04 | export section, deletion plan and retention purge through the F10 ports, then privacy.deletion.completed for L1 | section platform.local_settings with P3 field classes; deletion removes LocalSettings; nothing purged early; no row remains"
      - "T27 | integration | 04.R02 | create a tenant with jurisdictionProfile { code: de_eu } while a stub F10.S01.M02 consumes only platform.tenant.configured | the stub applies the ProfileRef { code: de_eu } from the revision 1 configured event without reading the tenant"
      - "T28 | contract | 01.R05,04.R04 | default discovery settings; then anonymousAllowed false, anonymousMinRadiusKm 50 and maxDepth 200; then anonymousMinRadiusKm 10, anonymousCenterLevel L2 and maxDepth 501 | the signed configuration and limits(tenantId) give true, 25, L1, 500 and then the new values to an F06.S02.M03 stub, which refuses anonymous callers, a 25 km anonymous radius and depth 201; the three invalid values are refused with VALIDATION_FAILED"
      - "T29 | unit | 01.R06,02.R05,10.R03 | get on a new vault; update with a11yMotion reduced and moneyDisplay code; update with a11yMotion fast; import a record with moneyDisplay emoji and a11yMotion reduced | defaults system and symbol; the values stored and returned; VALIDATION_FAILED for fast; the import keeps reduced and replaces emoji with symbol"
      - "T30 | integration | 02.R04,03.R01,06.R02 | bootstrap a fresh relay with --admin and --operator; bootstrap a second tenant with --admin; again with --break-glass and a 10 code point reason, then a 30 code point reason; HTTP create by admin A1 with adminKey; assign_operator by A1 | first creates tenant, operator and admin in one transaction; second SECURITY_BOOTSTRAP_REFUSED with nothing created; 10 code points refused, 30 accepted as break_glass; HTTP create VALIDATION_FAILED; assign_operator calls security.roleassignment.assign with role operator and scope tenant:<id> and grants no admin"
      - "T31 | contract | 01.R07,02.R01,04.R01 | create T1 without jurisdictionProfile, configure { code: eu_de }, then { publisherId: did:key KP, code: eu_de }; then a plain string eu_de, { code: EU }, { publisherId: notakey, code: eu_de } and { code: eu_de, version: 2 } | defaults to { code: generic } and the F18.S01.M01 resolve stub returns the bundled generic profile; both valid references are stored, signed in tenant_config and carried in platform.tenant.configured unchanged; the four invalid values are refused with VALIDATION_FAILED and their field paths"
      - "T32 | integration | 04.R06,01.R07 | V1 stores the verified tenant_config of relay R listing O1 and O2; the F18.S02.M02 receive stub checks a report compiled by O1 and reviewed by O2, one reviewed by X, and one for a relay V1 holds no statement for; A1 revokes O2, V1 re-fetches and the O1-O2 report is checked again | the resolver returns [O1, O2], roleFor accepts the first report and resolves no role for X or for the unknown relay; after the revocation the resolver returns [O1] from the new verified statement and the reviewer role of O2 is no longer resolved"
    acceptance:
      - All tests T01-T32 pass in CI.
      - A relay can bootstrap from the CLI and host several tenants with separate currencies, locales and limits, and every limit is enforced by its named module.
      - Operator changes are made only through F16 role assignments by admins, are validated, audited and visible to clients as signed configuration; the last operator can never be removed.
      - The jurisdiction profile is stored and signed only as a ProfileRef {publisherId?, code} that F18.S01.M01 resolves, and transparency receivers resolve operator keys only from the relay-signed operatorKeys through the registered resolver.
      - LocalSettings never leave the device except the consented defaultLocale copy in the F13.S01.M02 email registration, no relay tenant record exists in the vault, and every vault record carries its vault's own vaultId as tenantId.
  import_export_backup_rollback:
    requirements:
      - The vault export includes LocalSettings as the section platform.local_settings (CTR-IOX-001 IOX-1, IOX-6); tenants are relay data and are not part of any user export.
      - Relay tenant records and their signed configuration statements are covered by relay backups (IOX-3, IOX-7) and by an operator configuration export.
      - Import of LocalSettings validates the schema, clamps limits to platform maximums, replaces an invalid a11yMotion or moneyDisplay with its default and keeps the importing vault's own vaultId; operator import of tenants rejects conflicting slugs.
    export: "Vault: section platform.local_settings in classrup-export/v1 (schema classrup.platform.local_settings/v1, P3). Relay: relay tenant export --tenant <id> as JSON Lines of Tenant and its configuration statements (operator configuration export, not a user export); role assignments are exported by F16.S01.M01."
    import: "Vault: LocalSettings preferences replace the current ones after dry-run confirmation; an a11yMotion other than system or reduced becomes system and a moneyDisplay other than symbol, code or name becomes symbol; vaultId is never imported. Relay: relay tenant import creates tenants with their IDs, rejects conflicting slugs or IDs, always imports as suspended until an operator resumes, and requires the operator assignments to exist in F16 first."
    backup: "Relay tenants: relay SQLite backup (CTR-IOX-001 IOX-3). Vault settings: the vault export is the backup."
    migration_rollback: "Expand/contract: the former operatorKeys column is migrated into F16.S01.M01 RoleAssignments with scope tenant:<id> and expiry 365 days by a one-time data migration, then ignored; the former provisioning status and the requestRatePerMinutePerKey and maxRegisteredDevices limits are dropped (rate policy is F12.S03.M03); the former string jurisdictionProfile becomes ProfileRef { code: <former string> } in two steps (expand: one release reads both forms and still writes the string; contract: the next release writes only ProfileRef and re-issues each tenant's signed configuration), so a rollback by one release still reads every stored and signed configuration. Rollback to the previous release is safe because new optional fields are ignored by older readers and the expand release reads the ProfileRef form. Restore always creates a new instance (IOX-4) with tenants intact."
