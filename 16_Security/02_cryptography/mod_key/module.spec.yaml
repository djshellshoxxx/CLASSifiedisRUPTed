id: F16.S02.M01
scope: MVP
summary: >-
  Client library for the user's own keys in the browser vault. It generates Ed25519 signing keys and x25519
  agreement keys with @noble/curves 2.4.0, wraps private keys for storage in IndexedDB with a passphrase-derived
  key (scrypt N=2^17, r=8, p=1) and XChaCha20-Poly1305 from @noble/ciphers 2.4.0, unlocks them on demand, locks
  them after idle time, rotates them with signed rotation statements, and exports an encrypted backup. There is
  no server-held user secret and no central account; the private key never leaves the vault except in the user's
  own encrypted export. argon2 is not used because the available JavaScript implementations are unaudited, and
  noble-ciphers 2.x has no stated third-party audit, which is recorded as an accepted risk with mitigations.
responsibilities:
  - Generate Ed25519 and x25519 keys from the browser CSPRNG (crypto.getRandomValues) and derive the did:key principal and key fingerprint.
  - Wrap private keys with scrypt (N=131072, r=8, p=1, 16-byte random salt, 32-byte output) and XChaCha20-Poly1305 (24-byte random nonce) and store only the wrapped blob.
  - Unlock into memory on passphrase entry, lock on idle (default 15 minutes, range 1 to 60), on tab hide for 5 minutes, and on explicit lock.
  - Rotate device keys with a rotation statement signed by the old key and the new key, then revoke the old key after the overlap through the key registry (F16.S02.M02).
  - Produce a passphrase-protected key export (backup file) and import it, with the recovery kit remaining under the user's control.
non_responsibilities:
  - Signature formats and context strings (F16.S02.M03).
  - Key status and revocation lists (F16.S02.M02).
  - Recovery kit creation and account recovery flow (F07.S01.M03) and device linking (F07.S01.M01).
  - Server-side key handling; relays never receive private keys.
  - "Future: platform-protected non-extractable keys through WebCrypto or WebAuthn where Ed25519 is supported; passkey as second factor; Shamir split of recovery material."
depends_on: [CTR-ID-001, CTR-ERR-001, CTR-PRV-001, CTR-OBS-001, CTR-FED-001]
user_stories:
  - As a new user, I create a vault by choosing a passphrase and get a key without any account on a server.
  - As a user, I unlock my vault with my passphrase and it locks itself when I am away.
  - As a user, I rotate my device key if I suspect it is exposed, and my contacts see a signed statement of the change.
edge_cases:
  - Wrong passphrase; AEAD tag verification fails, the error does not reveal whether the blob or passphrase was wrong, and a local delay of 1 s doubling to 60 s applies after 3 failures without ever wiping the key.
  - Unlock takes too long on a low-end phone; the unlock runs in a Web Worker with progress and cancel, and the scrypt cost parameters stay fixed for the blob's recorded version so cost is never silently lowered.
  - Browser storage is cleared; the wrapped key is gone and recovery needs the user's backup file or recovery kit; the vault says so honestly at creation.
  - Two tabs unlock the same vault; a Web Lock named classrup-vault-unlock serializes unlock, and a lock in one tab locks the others through BroadcastChannel.
  - Passphrase change while another device is linked; the wrap is rewritten with a new salt and nonce; other devices are unaffected because each device has its own key.
  - Key rotation interrupted after the new key is generated but before the statement is delivered; the vault retains both keys, shows 'rotation pending', and resumes the delivery from the sync outbox.
  - Passphrase appears on a list of commonly used passphrases; creation is refused with SECURITY_PASSPHRASE_WEAK and explains how to choose a longer phrase.
ux:
  screens:
    - "Create vault: passphrase and confirmation with strength meter (minimum 12 code points and not on the 10 000-entry common list), explicit text about what happens if the passphrase is lost, backup file download prompt."
    - "Unlock screen: passphrase field, progress while deriving the key (scrypt takes 1 to 8 seconds on typical devices), cancel button, lockout countdown after failures."
    - "Security settings: auto-lock timeout, change passphrase, rotate key, export encrypted backup, key fingerprint display as 4-word list and QR code."
  states: [no-vault, locked, unlocking, unlocked, lockout, rotating, rotation-pending, backup-needed]
  a11y:
    - Passphrase fields use autocomplete=current-password or new-password and have visible labels and show/hide toggles with accessible names.
    - Progress during key derivation is announced politely and cancel is keyboard reachable.
    - Fingerprint is available as text and as a word list, not only a QR code.
processes:
  domain_schema:
    note: "No catalog entities. The wrapped key blob and rotation records are local vault storage of the client library, versioned as classrup.security.wrappedkey/v1 and are not synced or shared."
    entities: []
    requirements:
      - The stored wrapped key blob contains version, KDF name and parameters (N, r, p), salt, nonce, ciphertext, key ID and algorithm, all authenticated as associated data.
      - Private keys exist unwrapped only in memory while unlocked, and the library exposes sign and agree operations without exposing key bytes to application code.
      - Key IDs are the SHA-256 thumbprint of the raw public key in base64url, and the principal is the did:key encoding of the Ed25519 public key.
  validation_rules:
    requirements:
      - Passphrases are validated for minimum length and a bundled common-passphrase list before any key is created or wrapped.
      - KDF parameters read from a stored blob are validated against allowed minimums before use, so a tampered blob cannot lower the cost.
      - Every violation maps to one stable error code.
    rules:
      - "V01 | passphrase is at least 12 Unicode code points after NFKC normalization and not in the common list | SECURITY_PASSPHRASE_WEAK"
      - "V02 | blob KDF is scrypt with N ≥ 131072, r ≥ 8, p ≥ 1 and salt of 16 bytes | SECURITY_WRAPPED_KEY_INVALID"
      - "V03 | AEAD authentication succeeds with associated data (version, kdf params, key ID) | SECURITY_UNLOCK_FAILED"
      - "V04 | rotation statement is signed by both the old and the new key over the same payload | SECURITY_ROTATION_INVALID"
      - "V05 | the browser provides crypto.getRandomValues and IndexedDB; otherwise vault creation is refused | SECURITY_ENVIRONMENT_UNSUPPORTED"
      - "V06 | imported backup file has matching version and decrypts with the supplied passphrase | SECURITY_UNLOCK_FAILED"
  workflow_state_machine:
    note: "Library state is a runtime lock state of the in-memory key (locked, unlocked), not a persisted catalog entity. Persisted rotation progress is described in requirements."
    machines: []
    requirements:
      - The in-memory lock state moves locked to unlocked only after successful AEAD verification, and unlocked to locked on idle timeout, explicit lock, tab hide for 5 minutes or browser discard.
      - Rotation proceeds generate, sign, deliver and finalize, with the old key kept valid for an overlap of at most 7 days unless the user marks it compromised, in which case revocation is immediate.
      - After 3 consecutive failed unlocks the library enforces a local delay of 1 s, doubling per failure, capped at 60 s, and resets after one success.
    timeouts:
      - "Idle auto-lock default 15 minutes (range 1 to 60); hidden-tab lock after 5 minutes."
      - "Rotation overlap default 7 days, range 0 to 30."
  commands_queries_events:
    note: "Library module with no bus commands or queries and no events. API is createVault, unlock, lock, sign, agree, rotateKey, changePassphrase, exportBackup and importBackup, all vault-local and run in a Web Worker for key derivation."
    commands: []
    queries: []
    requirements:
      - createVault(passphrase) generates keys, wraps them and returns the principal and fingerprint without returning key bytes.
      - sign(context, payload) and agree(peerKey) operate on the unlocked key and fail with SECURITY_VAULT_LOCKED when locked.
      - rotateKey produces a rotation statement (classrup.security.keyrotation/v1) signed by old and new keys and hands it to the sync outbox and to F16.S02.M02 for registration.
    events_produced: []
    events_consumed: []
    errors:
      - "SECURITY_PASSPHRASE_WEAK | 422 | no | passphrase too short or on the common list"
      - "SECURITY_UNLOCK_FAILED | 401 | no | passphrase or blob authentication failed; generic on purpose"
      - "SECURITY_WRAPPED_KEY_INVALID | 422 | no | stored blob has unsafe or unknown parameters"
      - "SECURITY_VAULT_LOCKED | 403 | no | operation needs the unlocked vault"
      - "SECURITY_ROTATION_INVALID | 422 | no | rotation statement is not signed by both keys"
      - "SECURITY_ENVIRONMENT_UNSUPPORTED | 422 | no | required browser capability is missing"
    example: |
      const v = await createVault({ passphrase: "correct horse battery staple 41" });   // runs scrypt N=131072 in a Worker
      -> { principal: "did:key:z6MkExample…", fingerprint: "orbit-maple-quiet-river", blob: "wrapped (not returned)" }
      await lock(); await sign("classrup/consent/v1", bytes)  -> throws SECURITY_VAULT_LOCKED
      await rotateKey({ reason: "routine" }) -> { rotationStatementCid: "sha256-ee78…", oldKeyValidUntil: "2026-11-11T10:00:00Z" }
  authorization_capabilities:
    note: "No capabilities: the library runs inside the user's vault; its only authority is possession of the passphrase."
    capabilities: []
    requirements:
      - Only code running in the vault's origin can call the library, and sign requests from any other context are impossible.
      - The library never exposes raw private key bytes to callers, including the application code, and exposes only sign and agree.
      - Auto-lock and unlock lockouts are enforced by the library regardless of caller.
  failure_recovery_idempotency:
    requirements:
      - createVault is atomic, so the wrapped blob and public metadata are written in one IndexedDB transaction or nothing is written.
      - Unlock is repeatable and has no side effects besides in-memory state; failed attempts only advance the local backoff counter.
      - Rotation is resumable from persisted progress and never leaves the vault without a usable key.
    idempotency: "createVault refuses when a vault exists (SECURITY_VAULT_EXISTS is reported as CONFLICT_STATE); rotation steps record the new key ID so repeating a step is a no-op."
    concurrency: "Web Lock classrup-vault-unlock serializes unlock and rotation across tabs; BroadcastChannel propagates lock events; IndexedDB readwrite transactions guard blob updates."
    retries: "Rotation statement delivery goes through the sync outbox with CTR-IDM-001 backoff; unlock is retried only by the user."
    offline: "All operations work offline; only delivery of rotation statements and registry updates need a network."
    partial_failure: "If rotation fails after generation, both keys stay wrapped and valid, the UI shows rotation pending, and nothing is revoked until the statement is delivered or the user chooses immediate revocation."
  privacy_retention_abuse:
    requirements:
      - Private keys and passphrases are P4 and never leave the device except inside the user's own passphrase-encrypted export, and they are never logged or sent in telemetry (OBS-7).
      - The wrapped blob is retained until the user deletes the vault, and deletion overwrites the IndexedDB records and removes the blob.
      - Offline brute force against a stolen wrapped blob is slowed by scrypt N=2^17 (about 128 MiB per attempt) and the passphrase minimum, and the user is told the limits.
    data:
      - "Wrapped key blob: P4 ciphertext, local only."
      - "Public key, fingerprint and did:key: P0 once the user publishes them."
    retention:
      - "Wrapped blob: until the user deletes the vault."
      - "Rotation records: kept in the vault for 1 year (RET-AUDIT equivalent) for dispute evidence."
    threats:
      - "T01 | Stolen device or copied IndexedDB offers offline passphrase guessing | scrypt N=131072 r=8 p=1 about 128 MiB per guess, XChaCha20-Poly1305 authenticated blob, passphrase minimum 12 code points and common-list check; users are told a weak passphrase can still be guessed"
      - "T02 | Malicious or altered web code reads unwrapped keys | strict CSP, subresource integrity and reproducible builds (see F16.S03.M01); keys unwrapped only in a worker module; the API never returns key bytes; the residual risk of malicious code is stated"
      - "T03 | Tampered blob lowers KDF cost | parameters validated against minimums and bound as associated data; unsafe blobs rejected before derivation"
      - "T04 | Nonce reuse in XChaCha20-Poly1305 | 24-byte random nonces from the CSPRNG, fresh per wrap; unit tests assert uniqueness over 1 000 000 wraps"
      - "T05 | Supply-chain compromise or lack of audit in crypto dependencies | exact version pins @noble/curves 2.4.0 and @noble/ciphers 2.4.0 with lockfile integrity hashes; known-answer tests from RFC 8032, RFC 7748, RFC 7914 and the XChaCha20-Poly1305 specification; noble-ciphers 2.x has no stated third-party audit and argon2 is avoided as unaudited"
      - "T06 | Unlock abuse via shoulder surfing or unattended device | auto-lock 15 minutes, hidden-tab lock, explicit lock button; no biometric shortcut in MVP"
    abuse_controls:
      - "Local unlock backoff 1 s doubling to 60 s after 3 failures; never wipes keys, so an attacker cannot destroy a victim's key by failed guesses."
      - "Key export requires re-entering the passphrase and is rate limited locally to 5 per hour."
  observability_performance:
    requirements:
      - The PWA sends no telemetry; the library records local diagnostics (unlock duration, failures count, lock reason) in the vault, exportable by the user per OBS-7.
      - Unlock completes within 3 s p95 on a desktop-class device and within 8 s p95 on a Moto G-class device, running in a worker so the main thread stays responsive (INP ≤ 200 ms).
      - Sign and agree complete within 5 ms p95 desktop and 25 ms p95 Moto G.
    metrics:
      - "Local diagnostic counters: unlock_ms, unlock_failures, auto_locks, rotations (vault-local, exportable)."
    logs:
      - "local vault log key.unlocked {durationMs} and key.locked {reason}; never passphrases, keys or blobs."
    budgets:
      - "unlock p95 ≤ 3 s (desktop) and ≤ 8 s (Moto G profile); sign p95 ≤ 5 ms and ≤ 25 ms; library bundle ≤ 40 KiB gzip."
      - "Main-thread blocking during unlock ≤ 50 ms per task."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Cryptographic primitives are covered by known-answer tests from the standards and by round-trip property tests.
      - Tamper and downgrade attempts are covered by abuse tests.
    fixtures: "RFC 8032 Ed25519 vectors, RFC 7748 x25519 vectors, RFC 7914 scrypt vectors (reduced N for speed plus one full N=131072 run), XChaCha20-Poly1305 specification vectors, fixed random source for deterministic tests, Moto G CPU throttling profile."
    tests:
      - "T01 | unit | 01.R01,01.R03,02.R01,04.R01 | create vault and derive principal and thumbprint for a known seed | did:key and key ID match independent vectors"
      - "T02 | unit | 01.R01,01.R02,09.R02 | known-answer tests for Ed25519, x25519, scrypt and XChaCha20-Poly1305 | all standard vectors pass"
      - "T03 | property | 01.R02,06.R01 | random keys and passphrases wrapped and unwrapped; random bit flips in blob | round trip exact; any flip fails with SECURITY_UNLOCK_FAILED"
      - "T04 | unit | 02.R02,02.R03 | blob with N=1024; wrong version; missing salt | SECURITY_WRAPPED_KEY_INVALID before any derivation"
      - "T05 | unit | 02.R01 | passphrases of 11 code points, a common entry, and a 12-code-point unique phrase | first two rejected with SECURITY_PASSPHRASE_WEAK; third accepted"
      - "T06 | integration | 03.R01,03.R03 | idle timer, tab hidden, 3 wrong unlocks | auto-lock at 15 min, hidden lock at 5 min, delays 1 s then 2 s then 4 s capped at 60 s, no wipe"
      - "T07 | integration | 03.R02,04.R03,06.R03 | rotate key, interrupt after generation, resume | both keys valid, rotation pending shown, statement delivered later, old key revoked after overlap"
      - "T08 | unit | 04.R03 | rotation statement signed only by the new key | SECURITY_ROTATION_INVALID"
      - "T09 | abuse | 04.R02,05.R01,05.R02,07.R01 | application code requests key bytes; sign while locked; call from other origin | no API returns key bytes; SECURITY_VAULT_LOCKED; unreachable cross-origin"
      - "T10 | integration | 05.R03,06.R02 | two tabs unlock concurrently; lock in one tab | one unlock proceeds at a time; other tab locks via BroadcastChannel"
      - "T11 | chaos | 06.R01,06.R03 | IndexedDB write fails during createVault; storage cleared after creation | nothing half-written; clear message about backup and recovery kit"
      - "T12 | abuse | 07.R02,07.R03 | nonce uniqueness over 1 000 000 wraps; export without passphrase re-entry; 6 exports in an hour | no duplicate nonce; export refused; 6th rate limited locally"
      - "T13 | load | 08.R02,08.R03 | unlock under Moto G throttling; 1 000 signs | unlock p95 ≤ 8 s with main-thread tasks ≤ 50 ms; sign p95 ≤ 25 ms"
      - "T14 | unit | 08.R01,09.R01,09.R03 | traceability tool run; telemetry scan of network calls | every PS-128 requirement maps to a passing test; zero network calls from the library"
      - "T15 | integration | 10.R01,10.R02,10.R03 | export backup, import on a fresh browser profile, downgrade attempt | same principal and fingerprint; wrong passphrase fails generically; older client rejects unknown version"
    acceptance:
      - All tests T01–T15 pass in CI with the pinned noble versions and standard known-answer vectors.
      - Private key bytes are never returned by any API, logged or sent over the network (abuse and network tests).
      - Unlock meets 8 s p95 on the Moto G profile without blocking the main thread beyond 50 ms per task.
  import_export_backup_rollback:
    requirements:
      - The encrypted backup file contains the wrapped blob and public metadata only, uses the same KDF and cipher, and is the user's primary key backup alongside the recovery kit under the user's control.
      - Import decrypts with the passphrase, validates parameters and refuses unknown or downgraded versions.
      - Blob format changes follow versioned parsers, keep v1 readable for 180 days and re-wrap to the newest version only after a successful unlock.
    export: "Download classrup-key-backup.json containing the v1 wrapped blob (scrypt parameters, salt, nonce, ciphertext, key ID) and the public principal; the passphrase is never included; recovery kit handling stays in F07.S01.M03."
    import: "Importing a backup on a new device creates a vault with the same key after passphrase verification; if a vault already exists the user must choose to replace it, and the old blob is kept until the new one unlocks successfully."
    backup: "Vault export (IOX-6) includes the wrapped blob; keys are never uploaded by default; users are warned after 30 days without an export."
    migration_rollback: "Raising scrypt cost or switching ciphers adds a new blob version; unlock re-wraps after success and keeps the old blob for 7 days to allow rollback; older clients refuse unknown versions rather than guess."
