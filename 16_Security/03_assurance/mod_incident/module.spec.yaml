  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test.
      - Detection hook thresholds are covered by deterministic event-stream tests with an injected clock.
      - Notification and closure gates are covered by integration tests.
    fixtures: "Relay X, relay_operator O, admin A, tenant operator T, moderator M, peer P, jurisdiction profile stub with a 48 h breach notice, F08.S01.M01 mailbox stub, injected event streams, fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,01.R02,01.R03,02.R01 | open SEV2 key_compromise with valid input under the 48 h jurisdiction profile | Incident stored detected, severity history has one entry, notificationDueAt = detectedAt + 48 h when data classes are above P1"
      - "T02 | unit | 02.R02,02.R03 | each rule V01–V08 violated | documented error code and nothing stored; secret-like text rejected"
      - "T03 | property | 03.R01,03.R02 | random command sequences on one incident | only declared transitions succeed; closed never changes; timeline length never decreases"
      - "T04 | integration | 03.R03,08.R03 | injected clock past SEV1 15-minute acknowledgement and 60-minute containment targets | SLA breach timeline entries and metrics; status unchanged"
      - "T05 | contract | 04.R01,04.R02,04.R06,09.R02 | each command, query and event; the notice statement | validate against registry schemas; the notice is a CTR-FED-001 envelope by the relay key registered in F11.S01.M01 and sealed through the F08.S01.M01 stub"
      - "T06 | integration | 04.R03,06.R02,09.R02 | event streams - 99 vs 100 rejections in 10 minutes; 49 vs 50 rate.exceeded from 19 vs 20 prefixes; 99 vs 100 session revocations in 10 minutes; duplicates | no incident below thresholds; one incident at thresholds; duplicates dedupe"
      - "T07 | abuse | 05.R01,05.R03 | moderator M, tenant operator T and a member read incidents; the system hook actor tries triage | FORBIDDEN or NOT_FOUND; FORBIDDEN"
      - "T08 | integration | 03.R01,07.R01 | close SEV1 without postmortem or notification decision; with both | SECURITY_INCIDENT_CLOSE_BLOCKED then success"
      - "T09 | integration | 06.R01,06.R03 | same Idempotency-Key replayed; concurrent annotate; notice delivered to 40 of 50 mailboxes then close with and without closeOverrideReason | one effect; both entries stored with increasing seq; noticeDelivered 40 and noticePending 10; close blocked then allowed with the reason"
      - "T10 | abuse | 07.R03,01.R04 | 201 operator commands in an hour; UPDATE of a timeline row's text; second redaction of a redacted row; DELETE of a row while the incident exists | RATE_LIMITED; trigger aborts each change"
      - "T11 | integration | 07.R01,04.R04 | secret pasted into annotate; admin redacts an existing entry; relay_operator tries to redact | SECURITY_INCIDENT_SECRET_IN_TEXT; text NULL, redacted_hash set and an F16.S01.M01 audit entry written; FORBIDDEN"
      - "T12 | load | 08.R01,08.R02 | 50 req/s mixed open and annotate for 5 minutes; SLA sweep 10 000 incidents | p95 ≤ 300 ms; sweep ≤ 2 s"
      - "T13 | unit | 09.R01,09.R03 | traceability tool run | every PS-131 requirement maps to a passing test"
      - "T14 | integration | 10.R01,10.R02,10.R03 | export incidents, import to fresh relay, restore backup | records round-trip without redacted text; imported open incidents become triaged history with a note"
      - "T15 | integration | 03.R04 | 25 SEV3 detections in one hour; 30 SEV2 peer key compromise detections and one SEV1 in the same hour | first 20 handled normally and the other 5 appended to one detection_overflow SEV2 incident; all SEV2 and the SEV1 handled without cap"
      - "T16 | integration | 04.R03 | platform.relay_identity.rotated revoked compromised; one relay_hosted user key compromised; five within one hour; a VAPID key compromised; security.role.assigned with breakGlass; security.role.revoked with lastAdmin; three admin changes in 24 hours; two admin changes | SEV1 key_compromise relay_identity; no incident; one SEV3 key_compromise user_keys; SEV2 key_compromise; SEV1 privilege_change; SEV1 privilege_change; SEV3 privilege_change; no incident"
      - "T17 | abuse | 05.R02 | vault receives a notice signed by an unknown key; by a successor relayId named in its relay's key revocation; by the key of the relay it uses | first quarantined by F11.S01.M02; second shown as unverified until confirmed out of band and not acted on; third shown with the relay name and no local data change"
      - "T18 | integration | 07.R02 | retention sweep 2 years after closure; an incident under legal hold at that time | incident and timeline rows purged; held incident kept until privacy.legal_hold.released"
      - "T19 | contract | 04.R05,07.R01 | event payload classification and subscription scan across modules | both events P3 with no user content; no federation or notification module consumes security.incident.*"
    acceptance:
      - All tests T01–T19 pass in CI.
      - No SEV1 or SEV2 incident can be closed without a postmortem reference and a notification decision, and no detection of SEV1 or SEV2 is ever capped.
      - Detection hooks open at most one incident per category and scope and respect their thresholds, and timeline rows change only through one audited redaction.
  import_export_backup_rollback:
    requirements:
      - Operators can export incidents with timelines as JSON lines for auditors, excluding any redacted text.
      - Import is allowed only for relay migration and re-validates all text for secrets and all references.
      - Schema changes follow expand/contract and keep v1 readable for 180 days.
    export: "Section security.incidents in the relay operator export: incident rows with timeline rows (redacted rows carry only redacted_hash), severity history, notification decisions, notice counts and postmortem links."
    import: "Incidents import into a fresh relay as closed or triaged history; open automatic incidents are not re-armed; text is re-scanned and flagged entries are rejected."
    backup: "Covered by relay SQLite backup (CTR-IOX-001 IOX-3); losing a relay loses no user-owned private data (IOX-7)."
    migration_rollback: "Additive fields only in v1; the timeline moves from an embedded array to security_incident_timeline before any release, so no stored v1 record uses the old form; rollback is safe because older readers ignore new optional fields and unknown categories display as other."
