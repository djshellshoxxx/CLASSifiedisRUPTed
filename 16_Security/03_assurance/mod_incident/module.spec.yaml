id: F16.S03.M02
scope: MVP
summary: >-
  Incident records for a relay operator. Detection hooks watch security-relevant events on that relay (compromise
  of the relay's own identity key, compromise revocations of relay-owned, peer and hosted user keys, authentication
  anomalies, signature-failure spikes from a peer, mass session revocation, break-glass and last-admin events) and
  open an Incident with a severity from a fixed matrix; operators can also open one by hand. SEV1 and SEV2
  detections are never capped, and floods of lower-severity detections collapse into one overflow incident so an
  attacker cannot hide a critical one. The record keeps an append-only timeline in its own table, containment and
  resolution times, whether personal-data breach notification may be required (due time from the F18.S01.M01
  jurisdiction profile), notice delivery counts and the postmortem link. Incident records and events are relay-local
  operational data, never federated and never used to send notifications, and contain no user secrets or content.
  Vaults get only a relay-signed incident notice when the operator decides users must be told. Incident handling
  on one relay never claims authority over other relays or users' vaults.
responsibilities:
  - Own the Incident record and its lifecycle from detected to closed, with an append-only timeline of at most 500 entries stored in security_incident_timeline and changed only by one audited redaction per entry.
  - Run detection hooks as event consumers with fixed thresholds and open incidents at the matrix severity, de-duplicating repeated triggers into one open incident per category and scope, never capping SEV1 or SEV2, and sending SEV3 and SEV4 overflow to one detection_overflow incident.
  - Apply the severity matrix (SEV1 to SEV4) with acknowledgement and containment targets, and track SLA breaches.
  - Compute the breach-notification due time from the jurisdiction profile (F18.S01.M01) with a default target of 72 hours after awareness, and record notification decisions.
  - Publish a relay-signed incident notice statement (classrup.security.incident_notice/v1) sealed to affected users' mailboxes through F08.S01.M01 when the operator decides to notify, and track delivered and pending counts.
non_responsibilities:
  - Runbook procedures and containment switches (F16.S03.M03).
  - Key revocation mechanics (F16.S02.M02, F07) and moderation cases (F12.S02.M01).
  - Legal advice or regulator filings; the module records the decision and dates, operators file with authorities.
  - "Future: integration with external paging services; shared incident feeds between cooperating relays; automatic user-side key rotation advice."
depends_on: [F16.S01.M01, F16.S01.M02, F16.S02.M02, F16.S02.M03, F16.S03.M01, F18.S01.M01, F08.S01.M01, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-PRV-001, CTR-OBS-001, CTR-FED-001]
user_stories:
  - As a relay operator, I see an incident opened automatically when 100 invalid peer signatures arrive in 10 minutes, with severity, timeline and next steps.
  - As an incident commander, I record containment and resolution and see how long each took against targets.
  - As a user of an affected relay, I receive a clear signed notice saying what happened, what data classes were involved, and what I should do, without alarmist wording or false assurances.
edge_cases:
  - The same trigger fires every minute; detection de-duplicates into one open incident per (category, scope) and appends timeline entries with counts.
  - A single compromise revocation of a user key hosted on this relay opens no incident, because the key holder handles it through F07; five or more within 1 hour open one SEV3 key_compromise incident with scope user_keys, as they may indicate a malicious build or a relay breach.
  - The relay's own identity key is revoked as compromised (platform.relay_identity.rotated with change revoked); severity SEV1, and the RB-01 relay branch of F16.S03.M03 revokes with the pre-signed certificate, starts a new identity and asks users to confirm the new fingerprint out of band.
  - Incident opened as false positive; it moves to closed with reason false_positive and keeps its timeline.
  - Timeline entry accidentally contains a secret; entries are append-only, so the correction is a new entry and an admin runs security.incident.redact_entry, which sets that row's text to NULL, stores its hash once and writes an audit entry.
  - Breach notification due time passes with no decision recorded; the SLA sweep raises an alert and the incident cannot be closed until a decision (notify, not required with reason) exists.
  - Postmortem not completed by the due date; the incident closes only after the postmortem link is present for SEV1 and SEV2.
  - 25 SEV3 detections arrive within an hour; the first 20 open or update incidents normally and the other 5 are appended to a single open detection_overflow SEV2 incident; a SEV1 detection in the same hour is handled at once.
  - A notice reached 40 of 50 mailboxes; noticeDelivered 40 and noticePending 10 are recorded and closing needs a closeOverrideReason while any delivery is pending.
  - A vault receives a notice signed by a new relayId that the revocation of its relay's old key names as successor; it is shown as 'unverified until confirmed out of band' with the old relay's name and the new fingerprint, never acted on and never silently discarded.
ux:
  screens:
    - "Incident list for relay operators: severity, category, status, age, SLA badges, filters."
    - "Incident detail: summary, timeline (append-only, redacted entries shown as 'redacted' with the date and actor), severity changes with reasons, containment and resolution times, notification decision with due time and delivered and pending notice counts, postmortem link, related keys and events by ID."
    - "Notice composer: template with data classes involved (from the relay inventory of F16.S03.M03), actions for users, preview of the signed statement."
  states: [loading, empty, detected, triaged, contained, resolved, closed, sla-breached, notice-pending]
  a11y:
    - Severity and SLA status are text labels with icons, not color alone.
    - Timeline is an ordered list with timestamps in text and each entry reachable by keyboard.
    - Forms have labels and errors linked by aria-describedby; destructive actions need confirmation dialogs with focus trap.
processes:
  domain_schema:
    requirements:
      - An Incident stores category, severity with its history, status, scope, key milestone times, notification decision, notice delivery counts, postmortem link and linked reference IDs, with tenant and revision per CTR-ID-001; its timeline lives in the security_incident_timeline table.
      - Incident records are P3 relay-operational data readable by relay_operators and admins of that relay, retained under RET-EVIDENCE (2 years), and contain no secrets, tokens, keys or user content.
      - Severity follows the matrix SEV1 critical, SEV2 high, SEV3 medium and SEV4 low, and changes are recorded with reason and actor.
      - The timeline is stored in its own append-only table keyed by (incident_id, seq) whose triggers refuse every update except one redaction per row (text set to NULL and redacted_hash set) and refuse deletion while the incident exists.
    entities:
      - name: Incident
        schema: classrup.security.incident/v1
        storage: relay
        privacy: P3
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — relay hosting scope"
          - "title: string — 5..140 code points, no secrets"
          - "category: enum — key_compromise | relay_breach | data_leak | auth_anomaly | federation_abuse | privilege_change | availability | supply_chain | detection_overflow | other"
          - "severity: enum — SEV1 | SEV2 | SEV3 | SEV4"
          - "severityHistory: object[] — { severity, reason, actorKeyHash, at }, max 20"
          - "status: enum — detected | triaged | contained | resolved | closed"
          - "closeReason?: enum — resolved | false_positive | duplicate"
          - "closeOverrideReason?: string — 10..500 code points; required to close while noticePending > 0"
          - "scope: string — affected component or peer ID (for example relay_identity, user_keys, peer:<id>), no user content"
          - "affectedDataClasses: string[] — subset of P0..P4 involved, empty when none"
          - "affectedUsersEstimate?: enum — none | under_10 | under_100 | under_1000 | over_1000"
          - "commanderKeyHash?: string — relay_operator or admin in charge (HMAC actor hash of F16.S01.M01)"
          - "timeline: derived — rows of security_incident_timeline (incident_id, seq) ordered by seq, at most 500"
          - "timelineLength: int — number of timeline rows"
          - "detectedAt: timestamp — RFC 3339 UTC, relay clock"
          - "triagedAt?: timestamp — RFC 3339 UTC"
          - "containedAt?: timestamp — RFC 3339 UTC"
          - "resolvedAt?: timestamp — RFC 3339 UTC"
          - "closedAt?: timestamp — RFC 3339 UTC"
          - "notificationDecision?: enum — notify_users | not_required | pending"
          - "notificationDueAt?: timestamp — detectedAt + the breach notice period of the active F18.S01.M01 jurisdiction profile, 72 h by default"
          - "noticeStatementCid?: string — content id of the signed incident notice"
          - "noticeDelivered: int — mailboxes whose delivery reached transport_acknowledged or better, 0 when no notice"
          - "noticePending: int — mailboxes still prepared or failed, 0 when no notice"
          - "postmortemRef?: string — link or document ID of the postmortem"
          - "relatedRefs: string[] — key record IDs, event IDs, case IDs, max 50"
          - "source: enum — manual | hook"
          - "revision: int — CTR-ID-001 ID-4"
        invariants:
          - closed incidents of severity SEV1 or SEV2 have a postmortemRef and a notificationDecision other than pending.
          - timeline rows are never edited or removed; the only permitted change is one redaction per row that clears text and sets redacted_hash, and it is audit-logged.
          - Only one non-closed incident exists per (tenantId, category, scope) for automatic triggers, and at most one open detection_overflow incident exists.
          - A closed incident with noticePending above 0 has a closeOverrideReason.
    sql: |
      CREATE TABLE security_incident (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, category TEXT NOT NULL, severity TEXT NOT NULL, status TEXT NOT NULL,
        scope TEXT NOT NULL, detected_at TEXT NOT NULL, notification_due_at TEXT, closed_at TEXT, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX security_incident_open ON security_incident(tenant_id, category, scope) WHERE status != 'closed';
      CREATE INDEX security_incident_status ON security_incident(tenant_id, status, severity);
      CREATE TABLE security_incident_timeline (
        incident_id TEXT NOT NULL, seq INTEGER NOT NULL, at TEXT NOT NULL, actor_key_hash TEXT NOT NULL, kind TEXT NOT NULL,
        text TEXT, redacted_hash TEXT, PRIMARY KEY (incident_id, seq));
      CREATE TRIGGER security_incident_timeline_update BEFORE UPDATE ON security_incident_timeline
        WHEN NOT (old.redacted_hash IS NULL AND new.text IS NULL AND new.redacted_hash IS NOT NULL
          AND new.incident_id = old.incident_id AND new.seq = old.seq AND new.at = old.at
          AND new.actor_key_hash = old.actor_key_hash AND new.kind = old.kind)
        BEGIN SELECT RAISE(ABORT, 'append-only'); END;
      CREATE TRIGGER security_incident_timeline_delete BEFORE DELETE ON security_incident_timeline
        WHEN EXISTS (SELECT 1 FROM security_incident WHERE id = old.incident_id)
        BEGIN SELECT RAISE(ABORT, 'append-only'); END;
  validation_rules:
    requirements:
      - Incident input is validated strictly, and text fields are scanned for secret patterns with the library of F16.S01.M02 before storage.
      - Severity, category and status transitions are validated against the matrix and lifecycle.
      - Every violation maps to one stable error code.
    rules:
      - "V01 | title 5..140 and timeline text up to 1000 code points, and no secret-like pattern per F16.S01.M02 rules | SECURITY_INCIDENT_SECRET_IN_TEXT"
      - "V02 | category and severity are in their enums and scope is a component or peer ID | VALIDATION_FAILED"
      - "V03 | SEV1 or SEV2 incidents have a commander before moving to contained | VALIDATION_FAILED"
      - "V04 | closing SEV1 or SEV2 requires postmortemRef and a notification decision, and closing any incident with noticePending above 0 requires a closeOverrideReason | SECURITY_INCIDENT_CLOSE_BLOCKED"
      - "V05 | the incident has fewer than 500 timeline rows and fewer than 50 relatedRefs | PAYLOAD_TOO_LARGE"
      - "V06 | expectedRevision matches the incident revision | CONFLICT_REVISION"
      - "V07 | notice statement lists data classes and actions and no unverified claims such as no data was accessed unless evidence refs support it | VALIDATION_FAILED"
      - "V08 | redact_entry names an existing, not yet redacted timeline row of this incident and a reason of 10..500 code points | VALIDATION_FAILED"
  workflow_state_machine:
    requirements:
      - Incidents follow the declared lifecycle and any other transition is refused with CONFLICT_STATE.
      - A resolved incident can return to triaged when a regression is found, and closing is final.
      - SLA targets are tracked per severity and breaches are recorded as timeline entries and metrics without changing status.
      - Detection hooks never cap SEV1 or SEV2 detections, and SEV3 and SEV4 detections beyond 20 per hour per relay are appended to one open detection_overflow SEV2 incident instead of being dropped.
    machines:
      - entity: Incident
        initial: detected
        terminal: [closed]
        transitions:
          - "detected -> triaged | security.incident.triage by a relay_operator or admin | severity confirmed, commander set; emits no event"
          - "detected -> closed | security.incident.close with reason false_positive or duplicate | emits security.incident.closed"
          - "triaged -> contained | security.incident.contain by a relay_operator or admin | containedAt set, containment steps in timeline"
          - "triaged -> resolved | security.incident.resolve when no containment is needed | resolvedAt set"
          - "contained -> resolved | security.incident.resolve | resolvedAt set"
          - "resolved -> triaged | security.incident.triage regression | reason required"
          - "resolved -> closed | security.incident.close with postmortem, notification decision, and closeOverrideReason when notices are pending | emits security.incident.closed"
    timeouts:
      - "SLA sweep every 60 s: SEV1 acknowledgement 15 minutes and containment 60 minutes; SEV2 acknowledgement 1 hour and containment 4 hours; SEV3 acknowledgement 1 working day; SEV4 acknowledgement 5 working days."
      - "Notification decision due 24 hours after detection for incidents with affected data classes above P1, and notification due time from the jurisdiction profile, 72 hours after detection by default."
      - "Postmortem due 7 days after resolution for SEV1 and SEV2."
      - "Hook cap window: rolling 1 hour, 20 SEV3 or SEV4 hook detections per relay; SEV1 and SEV2 are not counted against the cap."
  commands_queries_events:
    requirements:
      - Commands are relay commands for relay-scope roles; detection hooks call open internally as actor kind system.
      - Open and close emit security.incident.opened and security.incident.closed in the same transaction as the record.
      - The module consumes security, platform, moderation, identity and federation events as detection hooks with fixed, tested thresholds.
      - security.incident.redact_entry clears one timeline row's text, stores its hash and writes an audit entry (F16.S01.M01), and nothing else can change a timeline row.
      - Incident events are P3, relay-local, never federated and never used to trigger notifications; users receive only the signed incident notice.
      - Incident notices are classrup.security.incident_notice/v1 CTR-FED-001 envelopes with author = relay did:key, registered with signer role relay in F11.S01.M01 (N2), signed through F16.S02.M03 and F11.S01.M03 and sealed to affected mailboxes through F08.S01.M01.
    note: "Statement (N2, registered in F11.S01.M01): classrup.security.incident_notice/v1 { relayId, incidentId, issuedAt, category, dataClasses[], userActions[], contact, evidenceRefs[], successorOf? } audience participants (sealed to each affected mailbox), signer role relay - the relay key the receiving vault uses; when the relay started a new identity after a key compromise, successorOf names the old relayId and vaults show the notice as unverified until the user confirms the new fingerprint out of band."
    commands:
      - name: security.incident.open
        mode: "relay command (relay_operator or admin) or internal detection hook (system)"
        capability: security.incident.open
        input: "{ title, category, severity, scope, affectedDataClasses?, source: manual|hook, relatedRefs? }"
        output: "{ incidentId, severity, status: detected, notificationDueAt, revision: 1 }"
        errors: [VALIDATION_FAILED, SECURITY_INCIDENT_SECRET_IN_TEXT, PAYLOAD_TOO_LARGE]
        emits: [security.incident.opened]
        idempotent: true
      - name: security.incident.triage
        mode: "relay command"
        capability: security.incident.triage
        input: "{ incidentId, expectedRevision, severity, commanderKeyHash?, reason }"
        output: "{ incidentId, revision, severity, status }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, VALIDATION_FAILED]
        emits: []
        idempotent: true
      - name: security.incident.annotate
        mode: "relay command; appends one row to security_incident_timeline"
        capability: security.incident.annotate
        input: "{ incidentId, expectedRevision, kind: note|containment|evidence|decision, text }"
        output: "{ incidentId, revision, entrySeq, timelineLength }"
        errors: [NOT_FOUND, CONFLICT_REVISION, SECURITY_INCIDENT_SECRET_IN_TEXT, PAYLOAD_TOO_LARGE]
        emits: []
        idempotent: true
      - name: security.incident.contain
        mode: "relay command"
        capability: security.incident.contain
        input: "{ incidentId, expectedRevision, steps }"
        output: "{ incidentId, revision, containedAt }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, VALIDATION_FAILED]
        emits: []
        idempotent: true
      - name: security.incident.resolve
        mode: "relay command"
        capability: security.incident.resolve
        input: "{ incidentId, expectedRevision, summary }"
        output: "{ incidentId, revision, resolvedAt }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: []
        idempotent: true
      - name: security.incident.notify
        mode: "relay command producing statement classrup.security.incident_notice/v1 signed by the relay key, sealed to affected mailboxes"
        capability: security.incident.notify
        input: "{ incidentId, expectedRevision, decision: notify_users|not_required, reason, noticeText?, audience? }"
        output: "{ incidentId, revision, noticeStatementCid?, noticeDelivered, noticePending }"
        errors: [NOT_FOUND, CONFLICT_REVISION, VALIDATION_FAILED]
        emits: []
        idempotent: true
      - name: security.incident.redact_entry
        mode: "relay command (admin); clears one timeline row and writes an audit entry"
        capability: security.incident.redact
        input: "{ incidentId, entrySeq, expectedRevision, reason }"
        output: "{ incidentId, entrySeq, redactedHash, revision }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, VALIDATION_FAILED]
        emits: []
        idempotent: true
      - name: security.incident.close
        mode: "relay command"
        capability: security.incident.close
        input: "{ incidentId, expectedRevision, closeReason, postmortemRef?, closeOverrideReason? }"
        output: "{ incidentId, revision, closedAt }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, SECURITY_INCIDENT_CLOSE_BLOCKED]
        emits: [security.incident.closed]
        idempotent: true
    queries:
      - name: security.incident.list
        capability: security.incident.read
        input: "{ status?, severity?, category?, cursor?, limit ≤ 50 }"
        output: "{ items: Incident (without timeline), nextCursor? }"
        errors: []
      - name: security.incident.get
        capability: security.incident.read
        input: "{ incidentId }"
        output: "{ incident: Incident with timeline rows (redacted rows without text) }"
        errors: [NOT_FOUND]
    events_produced:
      - {type: security.incident.opened, privacy: P3, payload: "{ incidentId, category, severity, scope, source, notificationDueAt } - relay-local, never federated, never used for notifications"}
      - {type: security.incident.closed, privacy: P3, payload: "{ incidentId, category, severity, closeReason, durations: { acknowledgeMs, containMs, resolveMs } } - relay-local, never federated, never used for notifications"}
    events_consumed:
      - {type: platform.relay_identity.rotated, effect: "change revoked with reason compromised or lost opens SEV1 key_compromise with scope relay_identity; rotations are recorded on an open relay_identity incident only"}
      - {type: security.key.revoked, effect: "reason compromised for relationship relay_owned or peer_relay opens SEV2 key_compromise for that key's scope; for relationship relay_hosted, five or more within 1 hour open one SEV3 key_compromise with scope user_keys and a single one opens nothing; own and counterparty keys are vault-side and ignored"}
      - {type: moderation.rate.exceeded, effect: "50 or more events for class relay.access from 20 or more distinct prefix hashes within 10 minutes opens SEV3 auth_anomaly"}
      - {type: federation.record.rejected, effect: "100 or more signature rejections from one peer within 10 minutes opens SEV3 federation_abuse for that peer scope"}
      - {type: federation.peer.suspended, effect: "append a timeline entry to the matching federation_abuse incident or open SEV4 if none exists"}
      - {type: identity.session.revoked, effect: "100 or more revocations within 10 minutes opens SEV3 auth_anomaly"}
      - {type: security.role.assigned, effect: "breakGlass true opens SEV1 privilege_change with scope relay_admin; three or more admin assignments or revocations within 24 hours open SEV3 privilege_change"}
      - {type: security.role.revoked, effect: "lastAdmin true opens SEV1 privilege_change with scope relay_admin; admin revocations count toward the 24-hour admin-change threshold"}
    errors:
      - "SECURITY_INCIDENT_SECRET_IN_TEXT | 422 | no | text contains a secret-like pattern and was not stored"
      - "SECURITY_INCIDENT_CLOSE_BLOCKED | 409 | no | SEV1 and SEV2 need a postmortem reference and a notification decision, and pending notice deliveries need an override reason, before closing"
    example: |
      detection hook (system): federation.record.rejected x100 from peer did:key:z6MkPeer… within 10 minutes
      -> security.incident.open { "title": "Signature rejection spike from peer", "category": "federation_abuse", "severity": "SEV3", "scope": "peer:z6MkPeer", "source": "hook" }
      -> { "incidentId": "0192f440-cccc-7000-8000-00000000000c", "severity": "SEV3", "status": "detected", "notificationDueAt": null, "revision": 1 }
      relay_operator: security.incident.triage { "severity": "SEV3", "commanderKeyHash": "k_3d1…", "reason": "spike persists" } -> { "status": "triaged", "revision": 2 }
      admin: security.incident.redact_entry { "incidentId": "0192f440-…", "entrySeq": 7, "expectedRevision": 5, "reason": "token pasted by mistake" } -> { "redactedHash": "sha256-9qL…", "revision": 6 }
  authorization_capabilities:
    requirements:
      - "Relay policy: relay_operators and admins of the relay (relay-scope F16.S01.M01 roles) open, triage, contain, resolve and close incidents, admins notify and redact timeline entries, moderators and tenant operators have no access, and members never read incident records."
      - "Vault policy: a vault accepts an incident notice only when signed by the key of a relay it uses, shows it with the relay name and never changes local data because of it; a notice from a successor relayId that the old relay's key revocation or restore announcement names is shown as 'unverified until confirmed out of band', never silently quarantined and never acted on."
      - Detection hooks run as actor kind system with a restricted capability to open incidents only.
    capabilities:
      - "security.incident.open | relay_operator, admin | relay-scope role; hooks run as system with open only"
      - "security.incident.triage | relay_operator, admin | relay-scope role"
      - "security.incident.annotate | relay_operator, admin | relay-scope role"
      - "security.incident.contain | relay_operator, admin | relay-scope role"
      - "security.incident.resolve | relay_operator, admin | relay-scope role"
      - "security.incident.notify | admin | relay-scope admin; notification decision recorded with reason"
      - "security.incident.redact | admin | relay-scope admin; one redaction per timeline row; reason recorded; audit entry written"
      - "security.incident.close | relay_operator, admin | relay-scope role; SEV1 and SEV2 need postmortem and notification decision; pending notices need an override reason"
      - "security.incident.read | relay_operator, admin | relay-scope role"
  failure_recovery_idempotency:
    requirements:
      - All commands are idempotent per CTR-IDM-001 and mutating commands require expectedRevision.
      - Detection hooks are idempotent through the inbox table and the open-incident unique index, so duplicate events never create a second incident.
      - A timeline append and its revision bump are one transaction and the timeline never loses entries.
    idempotency: "Idempotency-Key required on commands; hook-opened incidents dedupe on (category, scope) for open incidents; notify replays return the stored notice CID; redact_entry on an already redacted row returns the stored hash."
    concurrency: "expectedRevision on every mutation; partial unique index on open incidents; timeline append allocates seq inside BEGIN IMMEDIATE so two operators' entries both persist with increasing order."
    retries: "Event consumers retry per EVT-6; notice delivery uses the F08.S01.M01 mailbox path and sync outbox with CTR-IDM-001 backoff for 7 days."
    offline: "Operators need the relay online; users receive notices when they next sync, and the notice carries the relay-signed issue time."
    partial_failure: "If notice delivery partially fails, the incident records noticeDelivered and noticePending, the notify command can be repeated for the remaining audience, and the incident cannot be closed with noticePending above 0 unless a closeOverrideReason is recorded."
  privacy_retention_abuse:
    requirements:
      - Incident records contain IDs, counts and data classes only, never user content, tokens or keys, and text is scanned for secret patterns before storage.
      - Records and their timeline rows are retained under RET-EVIDENCE (2 years after closure), with legal hold override, and are readable only by relay_operators and admins.
      - Misuse (incident records used to profile users, forged incidents to trigger panic, concealment of breaches, flooding to bury a critical alert) is limited by content rules, hook thresholds, uncapped SEV1 and SEV2, audit logging and the mandatory notification decision.
    data:
      - "Incident and timeline rows: P3 relay operational data."
      - "Incident notice statement: P0 content addressed to affected users, free of secrets and unverified claims."
    retention:
      - "Incidents and timeline rows: RET-EVIDENCE (2 years after closure); legal hold (F10.S01.M02) keeps them until release."
      - "Timeline redactions keep a hash for integrity."
    threats:
      - "T01 | Breach concealment | notification decision mandatory before closing SEV1 and SEV2, due times tracked from the jurisdiction profile, decisions and reasons stored and exportable to auditors"
      - "T02 | Secrets or personal data pasted into timeline | pattern scan on every text, operator guidance, admin redaction command replacing text with a hash under a single-redaction trigger"
      - "T03 | Forged or flooded detection events cause alert fatigue or bury a critical alert | thresholds on rolling windows, de-duplication per category and scope, system-only hook capability, sources are the relay's own verified events, SEV1 and SEV2 never capped, overflow collected in one SEV2 incident"
      - "T04 | Incident notice used for phishing | notices are relay-signed statements shown with relay name inside the app only; they never contain links requesting credentials; email variants are not used in MVP; successor-relay notices are marked unverified until confirmed out of band"
      - "T05 | Rewriting incident history | timeline rows append-only with database triggers, severity history retained, operator actions audit-logged (F16.S01.M01), closed incidents immutable"
    abuse_controls:
      - "Operator commands limited to 200 per hour per key; SEV3 and SEV4 hook detections capped at 20 per hour per relay with overflow into one detection_overflow incident; SEV1 and SEV2 never capped."
      - "Notice sends limited to 1 per incident per audience per 24 hours unless the operator records a reason."
  observability_performance:
    requirements:
      - Incident counts, durations and SLA breaches are measured per CTR-OBS-001 with labels limited to category and severity.
      - Open and annotate meet the write budget (p95 ≤ 300 ms) at 50 req/s.
      - SLA sweep lag is observable and alerting.
    metrics:
      - "classrup_security_incidents_total{category,severity,outcome=opened|closed}"
      - "classrup_security_incident_ack_ms{severity} (histogram)"
