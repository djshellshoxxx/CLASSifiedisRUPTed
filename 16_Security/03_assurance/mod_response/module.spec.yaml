id: F16.S03.M03
scope: MVP
summary: >-
  Incident response runbooks kept under docs/security/response, written for a relay operator and for users who
  hold their own keys, and the two relay-local containment switches. Runbooks cover key compromise (a user's device
  key through the F07 identity flow; a relay's identity key revoked by the compromised key itself naming its successor
  while the key file is readable, otherwise through its pre-signed revocation certificate, and a new identity), relay breach with a user notice whose data inventory is generated from the module specs, personal data
  leak notification, the relay-wide read-only switch, the federation kill switch that stops only relay-to-relay
  traffic, compromise of the static distributor or release signing key, and the blameless postmortem template. Each
  runbook has trigger, roles, numbered steps with time targets, verification and communication text. The switches
  are set with security.containment.set by a relay_operator or admin of that relay (or from the host when the
  database is down), take effect only on that relay, and never reach other relays or users' vaults. Procedures are
  practiced in drills and checked by a documentation linter. No claim of external audit or certification is made.
responsibilities:
  - Maintain seven runbooks (RB-01 key compromise, RB-02 relay breach, RB-03 data leak notification, RB-04 read-only switch, RB-05 federation kill switch, RB-06 distributor or release key compromise, RB-07 postmortem) and the incident communication templates.
  - Keep each runbook structured as trigger, severity mapping to F16.S03.M02, roles, steps with time targets, verification checks, rollback and communication.
  - Define and own the containment switch contracts that other modules honor (read-only sentinel, federation kill sentinel), the command security.containment.set, their exemptions by exact command ID and their propagation targets.
  - Generate the relay data inventory used by the RB-02 notice from the module specs and run documentation lint in CI (structure, links, referenced capabilities, error codes, modules and inventory exist and match), and require a tabletop drill at least every 6 months and before the first public launch.
non_responsibilities:
  - Incident records and detection hooks (F16.S03.M02) and the threat register (F16.S03.M01).
  - Implementing the read-only check (F15.S02.M02 command bus) and the federation gating (F11.S01.M02 inbox and F11.S02.M01 delivery); this module specifies the contract they follow.
  - Relay identity revocation and new identities (F15.S02.M01), device key revocation and rotation (F07.S01.M01, F16.S02.M01) and role bootstrap (F16.S01.M01), which runbooks call.
  - Legal advice and regulator filings; runbooks provide checklists and templates for the operator.
  - "Future: automated runbook execution from the incident record; status page integration; user-side one-tap key revocation broadcast."
depends_on: [F16.S03.M02, F16.S03.M01, F16.S02.M02, F16.S01.M01, F11.S03.M01, F15.S02.M01, CTR-CAP-001, CTR-FLG-001, CTR-ERR-001, CTR-PRV-001, CTR-FED-001, CTR-OBS-001]
user_stories:
  - As a relay operator who suspects the relay identity key leaked, I follow RB-01 and revoke it with the key itself while its key file is still readable, so the revocation names the successor relayId, or with the pre-signed certificate when it is not, start a new identity within the time targets, and users see the signed notice from the new relay marked unverified until they confirm its fingerprint through a second channel.
  - As a member of a relay whose key file was lost with the key, I see the new relay's restore announcement name the old relay although the certificate revocation names no successor, and I still confirm the new fingerprint out of band before my vault uses it.
  - As a relay operator under attack, I switch the relay to read-only in under 5 minutes and everything users already hold on their devices stays usable.
  - As an operator after a data leak, I follow RB-03 to decide and record notification within the due times and send a plain notice to affected users that lists exactly the data classes the relay held.
edge_cases:
  - The only admin's identity is suspected compromised; RB-01 uses the break-glass step relay roles bootstrap --break-glass (security.roleassignment.bootstrap, F16.S01.M01) from the host, then revokes the compromised admin, and the SEV1 incident cannot be closed until two admins exist.
  - The relay database is unavailable so roles cannot be checked; classrup-relay containment read-only on --local writes the sentinel with host filesystem access, records the OS user and reason, and the audit entry is appended at the next start.
  - Federation kill switch applied while outbound deliveries are in flight; in-flight batches finish or abort within 60 seconds and queued deliveries stay in the outbox up to 7 days, while mailboxes, consent and publishing on the relay keep working.
  - Users are offline for days; RB-03 and RB-01 notices wait in mailboxes with the relay-signed issue time, and the runbook states that offline users learn later and revocation lag exists.
  - The compromised relay key file is deleted or unreadable (fails checkSecretFile); RB-01 falls back to platform.relay_identity.revoke with useCertificate true, whose revocation carries no successorRelayId, and the operator announces the new fingerprint out of band before users reroute, because only the new identity's relay_restore announcement links the two identities.
  - Static distributor compromise is suspected but unconfirmed; RB-06 prescribes a safe default of pausing update activation by publishing a signed hold statement and advising users not to update, without declaring a breach prematurely.
  - A runbook references a capability, command or error code that was renamed; the documentation linter fails the CI job with the runbook ID and the missing reference.
  - The relay restarts while read-only is active; the sentinel file survives the restart and the relay comes up read-only; an environment value RELAY_CONTAINMENT_READ_ONLY=1 left set re-applies the switch at start and startup warns about it.
  - A new module stores push subscriptions on relays but the RB-02 template inventory does not list them; the linter fails with SECURITY_RUNBOOK_INVENTORY_MISMATCH.
ux:
  notes: "Documentation and tooling module plus one relay command. Outputs are markdown runbooks RB-01 to RB-07, templates (internal timeline, user notice, postmortem), the generated relay data inventory, and a CI lint report. Operator-visible surfaces in the product are the relay admin 'Containment' screen (two switches with status and last change) and the signed notice displayed to users."
  screens:
    - "Relay admin containment screen: read-only mode toggle with reason field, federation kill switch toggle with reason field, current status with since-time and who changed it (or the OS user for host changes), propagation check result."
    - "User notice display: relay name, signed statement, what happened, data classes involved, what the user should do, issue time from the relay clock, and 'unverified until confirmed out of band' for a successor relay."
  states: [normal, read-only, federation-killed, both, propagating]
  a11y:
    - Toggles have text labels stating the effect and a confirmation dialog with focus trap and buttons of at least 44 by 44 px.
    - Status banners are announced in an aria-live assertive region once on change.
    - Runbooks are plain markdown with headings, numbered steps and tables with headers.
processes:
  domain_schema:
    note: "No catalog entities. Runbooks, templates and the generated relay data inventory are versioned documents. Containment switch state is held as relay-local sentinel files under <RELAY_DATA_DIR>/containment/ (read_only, federation_off, log.jsonl for host changes) read by the relay process, not as an entity; it is neither a CTR-FLG-001 flag nor database state."
    entities: []
    requirements:
      - Each runbook has ID RB-NN, title, trigger conditions, severity mapping, roles, numbered steps each with an owner role and a time target, verification checks, rollback, communication text and last drill date.
      - The read-only contract is the sentinel file <RELAY_DATA_DIR>/containment/read_only, read every second by the relay process without the database (the environment value RELAY_CONTAINMENT_READ_ONLY=1 is read only at start and creates the sentinel), and the federation kill contract is the relay-scope sentinel <RELAY_DATA_DIR>/containment/federation_off that gates only relay-to-relay traffic; it is not a CTR-FLG-001 flag, so the FLG-2 dependency rule and FLG-3 module disabling do not apply.
      - Notice templates contain relay name, plain description, the data classes the breached relay actually held (from the generated relay inventory), user actions, contact route and the relay-signed time, and never include speculation or claims that no data was accessed without evidence.
      - The read-only exemption list is fixed in code by exact command ID - security.containment.set, identity.login_challenge.issue, identity.session.start, identity.session.revoke, security.roleassignment.revoke, security.roleassignment.bootstrap, security.keyrecord.revoke, security.keyrecord.record_revocation, security.keyrecord.ingest_list, platform.relay_identity.revoke, identity.portable_doc.publish (only documents that newly revoke keys), federation.peer.suspend and every security.incident command - and queries are never blocked.
  validation_rules:
    requirements:
      - The documentation linter validates runbook structure, step time targets and references to capabilities, commands, error codes and modules.
      - Switch commands validate reason text and the relay-scope role before applying, and never accept empty reasons.
      - Every violation maps to one stable lint or runtime error code.
      - The linter compares the RB-02 notice inventory with the relay storage declarations of the module specs and the relay secret manifest, so a notice can never understate what a relay held.
    rules:
      - "V01 | each runbook has trigger, roles, numbered steps with time targets, verification, rollback and communication sections | SECURITY_RUNBOOK_INCOMPLETE"
      - "V02 | every capability, command, error code and module referenced in a runbook exists in the specs and catalog | SECURITY_RUNBOOK_DANGLING_REFERENCE"
      - "V03 | read-only and federation switch changes carry a reason of 10..500 code points | VALIDATION_FAILED"
      - "V04 | the last tabletop drill date is within 6 months of the release date | SECURITY_RUNBOOK_DRILL_STALE"
      - "V05 | runbooks and templates contain no claim of external audit, certification or guaranteed security | SECURITY_RUNBOOK_FORBIDDEN_CLAIM"
      - "V06 | a mutating relay command arrives while the read-only sentinel exists and its command ID is not on the exemption list | SECURITY_READ_ONLY_MODE"
      - "V07 | security.containment.set is signed by an active device key of a principal holding a relay-scope relay_operator or admin role on this relay, or comes from the host CLI with --local while the database is unavailable | FORBIDDEN"
      - "V08 | the RB-02 notice inventory equals the generated inventory of entities with storage relay or relay+device and their privacy classes, plus the relay secrets of the F16.S01.M02 manifest and the F15.S02.M01 key file | SECURITY_RUNBOOK_INVENTORY_MISMATCH"
      - "V09 | every notice template fills relay name, description, data classes, user actions, contact route and relay-signed time | SECURITY_RUNBOOK_INCOMPLETE"
  workflow_state_machine:
    note: "No entity lifecycle. Runbook procedures are the workflows and are specified in the requirements below as numbered, time-targeted steps."
    machines: []
    requirements:
      - "RB-01 key compromise. User device key - from another device or the root device the user runs identity.device_key.revoke (F07.S01.M01; the key itself or the root key revoke at once, another device key starts a 7-day pending period), then rotates with the F16.S02.M01 device rotation, and the new root-signed identity document carries the revocation to contacts as they sync; consents received in the clamped claimed-compromise window are labelled, and a lost root key goes through recovery (F07.S01.M03). Relay identity key - within 15 minutes of confirmation run platform.relay_identity.revoke (relay identity revoke --reason compromised) from the relay CLI; while the compromised key file is still readable and passes checkSecretFile, revoke with that live key (useCertificate absent), so the CLI first writes the pending successor genesis key and the revocation signed by the compromised key itself names successorRelayId; only when the key file is missing or unreadable revoke with the pre-signed revocation certificate (useCertificate true), which predates any successor and carries no successorRelayId, so the link then rests on the new identity's classrup.platform.relay_restore/v1 announcement naming predecessorRelayId plus the out-of-band fingerprint check; then run relay identity init --new-identity, which activates that successor (or a fresh genesis key on the certificate path) as a new relayId whose first statements are the restore announcement and the incident notice naming the old relayId, re-sign the active role statements and the tenant configuration with the new key, within 60 minutes confirm the new fingerprint through at least two out-of-band channels on either path, and within 24 hours review the audit log chain for the exposure window; the compromised key signs only its own revocation, never a rotation. Relay-owned VAPID keys - security.keyrecord.revoke and register a new one."
      - "RB-02 relay breach. Within 15 minutes open a SEV1 or SEV2 incident (F16.S03.M02), within 30 minutes apply the read-only switch (RB-04), preserve disk and logs as read-only copies, rotate all relay secrets (F16.S01.M02) and follow RB-01 for the relay identity key within 4 hours, rebuild from a clean image and restore data from the last verified backup within 24 hours, then verify audit chain anchors; users are told that vault data was never on the relay, and the notice lists each data class this relay held according to the generated inventory - for example public projections and media (P0), role and key records (P1), bids and results of hosted auctions, push subscriptions, email addresses, mailbox ciphertext with routing metadata and moderation reports and cases (P2), audit, incident and rate records (P3), session token hashes and login challenges (P4) - plus the relay secrets."
      - "RB-03 data leak notification. Within 24 hours determine data classes and the approximate number of affected users from the audit log and relay storage; record the notification decision in the incident; where personal-data breach notification may apply, prepare the regulator notice within the jurisdiction due time (default target 72 hours after awareness, F18.S01.M01) and send the signed user notice through mailboxes within 24 hours of the decision; the notice lists data classes, actions (rotate keys if keys could be affected, treat reports and metadata as exposed) and a contact route."
      - "RB-04 relay-wide read-only switch. Run classrup-relay containment read-only on --reason (security.containment.set by a relay_operator or admin, or --local from the host when the database is down); within 5 seconds the command bus rejects non-exempt mutating relay commands with SECURITY_READ_ONLY_MODE and Retry-After 300, using the exemption list by exact command ID; vault outboxes keep statements prepared and the UI shows the relay as read-only; to lift, run containment read-only off, verify with the readiness check and drain outboxes at a rate of at most 50 statements per second per key."
      - "RB-05 federation kill switch. Run classrup-relay containment federation off --reason; within 60 seconds POST /fed/v1/inbox requests signed by peer relay keys receive FEATURE_DISABLED with params.reason federation_killed, F11.S02.M01 outbound delivery to peers pauses, in-flight batches abort or finish, and queued deliveries remain in the outbox up to 7 days; requests from vaults hosted on this relay, mailboxes, consent and publishing keep working because only relay-to-relay traffic is gated and no feature flag changes; peers may also be suspended one by one (federation.peer.suspend, F11.S03.M01); to restore, turn it on, verify peer signatures on the first 100 inbound envelopes and re-enable peers one at a time."
      - "RB-06 distributor or release key compromise. Publish a hold statement signed by the release key under context classrup/release-hold/v1 (F16.S02.M03) if that key is still trusted, otherwise a relay-signed incident notice as advice only, instructing users not to activate updates; compare served bundle hashes with the signed release manifest; rotate the release signing key held offline, publish the new key fingerprint through at least three independent channels, release a rebuilt version with published reproducible hashes, and tell users how to verify the build hash shown in the app; users who updated during the window are advised to rotate their device key."
      - "RB-07 postmortem. Blameless, due 7 days after resolution for SEV1 and SEV2: timeline, impact, detection, what went well and badly, root causes, contributing factors, action items each with owner and due date within 30 days, and threat register updates (F16.S03.M01); the summary is published to affected users in plain language."
    timeouts:
      - "Relay identity key revocation within 15 minutes of confirmation; read-only propagation within 5 seconds; federation kill within 60 seconds; sentinels are polled every second."
      - "Tabletop drill at least every 6 months and before first public launch."
  commands_queries_events:
    note: "Operators use security.containment.set through the relay CLI and existing commands (F16.S03.M02, F16.S02.M02, F16.S01.M01, F15.S02.M01, F07.S01.M01); the lint is pnpm security:runbooks:check and the inventory is pnpm security:runbooks:inventory."
    requirements:
      - "The relay CLI exposes classrup-relay containment read-only on|off --reason and classrup-relay containment federation on|off --reason, which call security.containment.set with a request signed by the operator's device key, or with --local write the sentinel directly when the database is unavailable; both write an audit entry (F16.S01.M01), the local path at the next start."
      - The command bus honors the read-only sentinel by returning SECURITY_READ_ONLY_MODE for non-exempt mutating commands (implemented by F15.S02.M02), and the federation sentinel is honored by the F11.S01.M02 inbox for peer relay requests and by F11.S02.M01 outbound delivery.
      - The linter pnpm security:runbooks:check validates structure, references, drill dates, forbidden claims, template fields and the RB-02 inventory, and exits non-zero on any error.
      - security.containment.get_status reports both switches with since-time, actor and the last propagation check.
    commands:
      - name: security.containment.set
        mode: "relay command signed (RFC 9421, tag classrup/relay-request/v1) by a device key of a relay_operator or admin, sent by the relay CLI; host --local fallback writes the sentinel without the bus while the database is unavailable"
        capability: security.containment.set
        input: "{ switch: read_only|federation, state: on|off, reason (10..500 code points) }"
        output: "{ switch, state, changed: boolean, since, auditSeq, propagationMs }"
        errors: [VALIDATION_FAILED, FORBIDDEN, RATE_LIMITED]
        emits: []
        idempotent: true
    queries:
      - name: security.containment.get_status
        capability: security.containment.read
        input: "{ includeHistory?: boolean (last 20 changes) }"
        output: "{ readOnly: { state, since, changedBy, viaHost }, federation: { state, since, changedBy, viaHost }, lastPropagationCheck: { switch, ms, at } }"
        errors: []
    events_produced: []
    events_consumed: []
    errors:
      - "SECURITY_READ_ONLY_MODE | 503 | yes | the relay is in read-only mode; retry after the Retry-After interval"
      - "SECURITY_RUNBOOK_INCOMPLETE | 422 | no | a runbook or template lacks a required section or field"
      - "SECURITY_RUNBOOK_DANGLING_REFERENCE | 422 | no | a runbook references a missing capability, command, error code or module"
      - "SECURITY_RUNBOOK_DRILL_STALE | 422 | no | last drill older than 6 months"
      - "SECURITY_RUNBOOK_FORBIDDEN_CLAIM | 422 | no | a document claims audit, certification or guaranteed security"
      - "SECURITY_RUNBOOK_INVENTORY_MISMATCH | 422 | no | the RB-02 notice inventory differs from the relay storage declared in the module specs"
    example: |
      $ classrup-relay containment read-only on --reason "suspected relay breach, incident 0192f440" --key ~/.classrup/operator-device.key
      -> security.containment.set accepted (relay_operator R1); sentinel written; bus rejecting non-exempt writes after 2.1 s; audit entry seq 5120
      POST /api/v1/cmd/bazaar.listing.publish  -> 503 { "code": "SECURITY_READ_ONLY_MODE", "retryable": true, "retryAfterMs": 300000 }
      POST /api/v1/cmd/identity.session.revoke -> 200 (exempt)
      $ classrup-relay containment federation off --reason "peer flood, incident 0192f441" --local   (database down)
      -> sentinel written by OS user classrup; audit entry queued for next start
      $ pnpm security:runbooks:check
      runbooks: 7; incomplete: 0; dangling references: 0; inventory: matches (38 relay-stored entities); last drill: 2026-10-20; exit 0
  authorization_capabilities:
    note: "Containment switches are relay commands of relay_operators and admins of that relay; the host-only --local path exists only for a relay whose database is unavailable and is audited at the next start with the OS user."
    requirements:
      - Only relay_operators and admins of the relay (relay-scope F16.S01.M01 roles) apply the read-only and federation switches through signed requests, the host-only --local path is limited to a relay whose database is unavailable and records the OS user, and every change is written to the audit log with the reason.
      - Documentation edits require two maintainer approvals like the threat register.
      - Users cannot trigger containment of a relay; they can only report issues through incident channels and revoke their own keys.
    capabilities:
      - "security.containment.set | relay_operator, admin | relay-scope role on this relay; request signed by an active device key; reason required; at most 10 changes per hour per key; host --local only while the database is unavailable"
      - "security.containment.read | relay_operator, admin | relay-scope role on this relay"
  failure_recovery_idempotency:
    requirements:
      - Switches are idempotent, setting an already-set switch changes nothing and logs a no-op.
      - The read-only sentinel works without the database and survives restarts until removed.
      - Runbook steps are written so each can be repeated safely, and verification checks identify partial completion.
    idempotency: "Applying read-only on or federation off twice leaves the same state; the command reports changed false and still records an audit note."
    concurrency: "Concurrent security.containment.set calls are serialized by the bus transaction that writes the sentinel and the audit entry; the last change wins, the audit log records both and the status screen shows the final state."
    retries: "Propagation checks poll every 1 second up to 60 seconds; operators repeat the CLI if propagation fails."
    offline: "Vault outboxes hold prepared statements during read-only or federation-off periods up to 7 days and then ask the user to resend or export."
    partial_failure: "If the database is down, the --local path writes the sentinel directly and records the change in containment/log.jsonl, from which the audit entries are appended at the next start; RB-05 can additionally block peer requests in the reverse proxy configuration documented in the runbook."
  privacy_retention_abuse:
    requirements:
      - Runbooks and templates are public documents containing no secrets, keys, personal data or exploit details of open issues.
      - Notice statements and incident timelines follow F16.S03.M02 retention; drill records are kept 2 years.
      - Containment switches are protected from misuse (denial of service by a rogue admin) through the relay-scope role check on signed requests, two-person admin grants, rate limits, audit entries and visible status to users.
    data:
      - "Runbooks, templates and the generated relay inventory: P0 public documents."
      - "Drill records: P1 internal, no personal data."
      - "Containment log of host changes: P1 relay-local, OS user and reason only."
    retention:
      - "Runbooks: indefinite in repository history."
      - "Drill records: 2 years, then removed by the documentation retention job."
      - "Containment log of host changes: until its entries are appended to the audit log, then RET-AUDIT there."
    threats:
      - "T01 | Rogue or compromised admin toggles read-only to disrupt the relay | switches need a relay-scope role checked on a signed request, admin grants need a signed second approval (F16.S01.M01), changes are rate limited, every toggle is audited and visible to users in the app, other admins can lift it"
      - "T02 | Incident notice abused for phishing | notices are relay-signed statements shown inside the app with relay name, contain no credential requests and no external links in MVP; a successor relay's notice is unverified until confirmed out of band"
      - "T03 | Over-reassuring or false statements in notices | templates require evidence references for any statement that data was not accessed, forbid guarantees, and must list every data class the relay held (V08)"
      - "T04 | Containment fails silently | propagation checks are part of each switch procedure and the status screen shows verified-since time"
      - "T05 | Runbooks drift from the system | linter checks references and the inventory in CI and drills every 6 months test the real procedures"
      - "T06 | Federation kill switch breaks unrelated services on the relay | it gates only relay-to-relay traffic, is not a feature flag and turns no module off; mailbox and consent tests run while it is on"
    abuse_controls:
      - "Switch changes limited to 10 per hour per key with reason required (bus rate limit, F12.S03.M03)."
      - "Read-only exemptions list is fixed in code by command ID and reviewed in the threat model."
  observability_performance:
    requirements:
      - Read-only and federation switch states, change counts and propagation times are metrics on the relay per CTR-OBS-001.
      - Read-only takes effect within 5 seconds and federation kill within 60 seconds, measured by the propagation check.
      - Drill age and lint results are reported in the release gate.
    metrics:
      - "classrup_security_read_only (gauge 0 or 1)"
      - "classrup_security_federation_enabled (gauge 0 or 1)"
      - "classrup_security_containment_change_total{switch,state,via=command|host}"
      - "classrup_security_containment_propagation_ms{switch} (histogram)"
    logs:
      - "relay warn containment.changed {switch, state, via, reasonLength, correlationId} — reason text stays in the audit entry."
    budgets:
      - "read-only propagation ≤ 5 s; federation kill ≤ 60 s; rejection overhead ≤ 0.1 ms per request; sentinel poll ≤ 0.05 ms."
      - "Linter and inventory generation runtime ≤ 30 s on the repository."
  contract_and_acceptance_tests:
    requirements:
      - Every requirement of this module is covered by at least one automated test or a recorded drill.
      - Switch contracts are covered by integration tests against the relay with fixture modules.
      - The linter has fixtures for each error code.
    fixtures: "Relay fixture with command bus stub, F16.S01.M01 role fixtures (relay_operator R1, admin A1, tenant operator T1, member U), peer relay P, hosted vault V, outbox with 1 000 queued statements, runbook and template fixtures (valid and one per error), module spec fixtures for the inventory, fixed clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,02.R01,02.R03,04.R03,09.R03 | lint the seven runbooks and each broken fixture | valid passes; each broken fixture yields its SECURITY_RUNBOOK_* code with runbook ID"
      - "T02 | unit | 02.R02,05.R01 | security.containment.set with empty reason, a 5-character reason, member U's key and tenant operator T1's key | VALIDATION_FAILED, VALIDATION_FAILED, FORBIDDEN, FORBIDDEN"
      - "T03 | integration | 01.R02,01.R04,03.R04,04.R02,09.R02 | set read-only; submit listing publish, offer make, identity.session.revoke, security.keyrecord.revoke, security.incident.open, security.roleassignment.revoke, platform.relay_identity.revoke, federation.peer.suspend and several queries | non-exempt commands return SECURITY_READ_ONLY_MODE within 5 s with retryAfterMs 300000; every exempt command ID succeeds; queries unaffected"
      - "T04 | integration | 03.R05,06.R01,09.R02 | federation off then on twice; a request from peer P and one from hosted vault V to /fed/v1/inbox; a mailbox put and a consent statement during the kill | P gets FEATURE_DISABLED with reason federation_killed within 60 s; V's request accepted; outbound to peers paused; mailbox delivery and consent keep working; repeated toggles are no-ops with audit notes; no module flag changes"
      - "T05 | chaos | 06.R02,06.R03 | database down while applying read-only with --local; restart with the sentinel present; restart with RELAY_CONTAINMENT_READ_ONLY=1 after lifting | sentinel works without the database and the OS user is recorded, the audit entry is appended at the next start; read-only still active after restart; the environment value re-applies it at start with a warning"
      - "T06 | integration | 03.R01 | simulate relay identity key compromise with RB-01 on a staging relay with the key file readable, then again with the key file deleted | first run: the revocation is signed by the compromised key and names successorRelayId equal to the relayId that --new-identity activates; second run: the revocation uses the pre-signed certificate (useCertificate true) and has no successorRelayId; both runs: the new identity's restore announcement and notice name the old relayId, role statements are re-signed by the new key, no rotation is signed by the compromised key, the vault shows the new relay as unverified until the fingerprint is confirmed, durations within targets"
      - "T07 | manual | 03.R02,03.R03,03.R06,03.R07 | tabletop drill of RB-02, RB-03, RB-06 and RB-07 with two maintainers before each release | drill record with date, participants, gaps and action items; last drill date updated"
      - "T08 | abuse | 05.R01,05.R02,05.R03,07.R03 | member invokes containment; relay_operator toggles 11 times in an hour; single admin grants admin to self; documentation change approved only by its author | FORBIDDEN; 11th RATE_LIMITED; FORBIDDEN; merge blocked"
      - "T09 | abuse | 07.R01,01.R03 | notice text claiming no data was accessed without an evidence reference; document with 'externally audited'; runbook containing a token-like string | rejected by template validation; SECURITY_RUNBOOK_FORBIDDEN_CLAIM; F16.S01.M02 secret scan fails"
      - "T10 | integration | 03.R04,06.R01 | outbox of 1 000 statements during read-only then lift | statements stay prepared; drained at 50 per second per key; none lost or duplicated"
      - "T11 | load | 08.R01,08.R02,08.R03 | 1 000 requests per second during toggle on a staging relay | propagation ≤ 5 s; overhead ≤ 0.1 ms; gauges correct"
      - "T12 | unit | 09.R01 | traceability tool run | every PS-132 requirement maps to a passing test or a recorded drill"
      - "T13 | integration | 10.R01,10.R02,10.R03 | export runbooks and templates, import into fork, schema bump; restore a relay backup taken while read-only | linter results identical; old version parsed for 180 days; restored relay stays read-only"
      - "T14 | unit | 08.R03 | drill record dated 7 months ago | SECURITY_RUNBOOK_DRILL_STALE and gate failed"
      - "T15 | integration | 04.R01,04.R04,07.R03 | CLI containment read-only on signed with R1's device key; get_status | sentinel written; audit entry with reason and actor; rate limit counted; status shows since-time, actor and propagation result"
      - "T16 | unit | 02.R04,03.R02,01.R03 | RB-02 template inventory against the generated inventory; template without push subscriptions; template without contact route | match; SECURITY_RUNBOOK_INVENTORY_MISMATCH; SECURITY_RUNBOOK_INCOMPLETE"
      - "T17 | integration | 07.R02 | documentation retention job with drill records 2 years and 1 day old and 1 year old | the older is removed; the younger kept"
    acceptance:
      - All automated tests pass in CI and a drill record dated within 6 months exists for the release.
      - Read-only mode takes effect within 5 seconds and federation kill within 60 seconds in the staging test, and the kill switch leaves mailboxes and consent working.
      - Runbooks contain no dangling references, no claim of audit or certification, and an RB-02 inventory that matches the module specs.
  import_export_backup_rollback:
    requirements:
      - Runbooks and templates are exportable as markdown and JSON from the repository, and the relay containment status is part of the operator configuration export.
      - A fork importing runbooks must pass the same linter before use.
      - Runbook format changes are versioned, with the linter reading the previous version for 180 days.
    export: "pnpm security:runbooks:export writes RB-01 to RB-07, templates, the generated inventory and drill records as markdown and JSON; relay configuration export includes containment switch status with last change time."
    import: "pnpm security:runbooks:check --input dir validates an external runbook set; nothing is applied automatically."
    backup: "Documents are covered by repository history; containment sentinel files are part of the relay data directory backup (CTR-IOX-001 IOX-3) and are deliberately restored in their last state so a restored relay does not silently lift containment."
    migration_rollback: "Runbook schema is versioned in front matter; rollback is a revert of the pull request; the sentinel contract is stable across releases and unknown future switches default to off."
