id: F17.S03.M01
scope: MVP
summary: 'GitHub Actions workflows for ClassRup using only first-party actions (actions/checkout, actions/setup-node, actions/cache, actions/upload-artifact, actions/download-artifact). One fast Linux gate runs on every push and pull request: install from a cached pnpm 10.28.0 store on Node 22, spec:check, typecheck, unit, property (200 runs), integration (multi-vault with optional relay), PWA build once, then e2e smoke against the built artifact with no relay configured. A nightly schedule runs long property (10 000 runs), load, chaos and the browser matrix. Workflows run with read-only permissions and no secrets on pull requests.'
responsibilities:
- 'Provide .github/workflows/ci.yml: triggers push and pull_request, concurrency group ci-${{ github.workflow }}-${{ github.ref }} with cancel-in-progress true, permissions contents: read, timeout 15 min, runs-on ubuntu-24.04.'
- Skip documentation-only changes with paths-ignore for docs, markdown and planning files, except that changes to any module.spec.yaml, planning/modules.yaml, planning/contracts or tools/specgen still run the spec:check job.
- Build the PWA once in a build job (pnpm build:pwa), upload it with actions/upload-artifact (retention 7 days) and have the e2e job download and reuse that artifact instead of rebuilding.
- Provide .github/workflows/nightly.yml on cron 0 2 * * * running long property (10 000 runs), load (standard), chaos (30 seeds), compatibility matrix and the offline suite, uploading reports with 30-day retention.
- 'Use actions/checkout with fetch-depth 1 and cache the pnpm store with actions/setup-node cache: pnpm or actions/cache keyed by hashFiles of pnpm-lock.yaml.'
non_responsibilities:
- The content of the release gates (F17.S03.M02), which is invoked from the release workflow here.
- The tests themselves (F17.S01 and F17.S02).
- Deployment and hosting of relays (F15.S03); the PWA is static and relays are self-hosted.
- 'Future: self-hosted runners, macOS and Windows runners and required-reviewer deployment environments.'
depends_on:
- CTR-TST-001
- CTR-OBS-001
- F17.S01.M01
- F17.S03.M02
- F16.S01.M02
user_stories:
- As a developer, I push a commit and get a pass or fail from the fast gate within 10 minutes with the failing job and log linked.
- As a documentation writer, a pull request that only changes prose does not consume the test pipeline, yet a spec YAML change still runs spec:check.
- As a maintainer, I find the nightly long-run reports as artifacts every morning.
edge_cases:
- Two pushes to the same branch arrive within a minute; the older run is cancelled by the concurrency group so only the newest finishes.
- A pull request from a fork must not receive secrets; workflows need none and use read-only permissions, with no pull_request_target usage.
- The pnpm cache misses after a lockfile change; install takes longer but still succeeds, and the cache is saved under the new key.
- A docs-only pull request is skipped, but branch protection requires the check; a lightweight always-run job named gate-summary passes when jobs were skipped by paths filter.
- The build artifact upload fails; the e2e job fails explicitly with QUALITY_CI_ARTIFACT_MISSING instead of rebuilding silently.
- 'A third-party action is added to a workflow; the workflow lint rejects any uses: outside the actions/ organization with QUALITY_CI_ACTION_FORBIDDEN.'
ux:
  notes: Headless. Results appear as GitHub check runs and a job summary with timings, coverage and links to artifacts.
processes:
  domain_schema:
    requirements:
    - The module owns no persisted entities; its files are workflow YAML under .github/workflows and a lint script tools/ci-lint.
    - 'Workflow artifacts are named pwa-dist, reports-fast and reports-nightly with defined retention: 7, 14 and 30 days.'
    - 'Environment pins are declared once as env at workflow level: NODE_VERSION 22, PNPM_VERSION 10.28.0, with actions pinned to a full commit SHA or an exact major tag.'
    entities: []
    note: 'Tooling module: owns no persisted entities. Its outputs are test configuration, source files under the code path and CI artifacts (JSON/JUnit/LCOV reports) that are regenerated on every run and never stored by the relay.'
  validation_rules:
    requirements:
    - 'The workflow lint rejects: any uses: outside actions/*, missing permissions block, permissions broader than contents: read (except documented artifact write), pull_request_target triggers, missing concurrency cancel-in-progress, and missing timeout-minutes.'
    - The fast gate must contain jobs in order install, spec-check, typecheck, test (unit, property, integration), build-pwa and e2e-smoke, where each depends on install.
    - Branch protection requires the single check gate-summary, which fails if any required job failed or was cancelled.
    rules:
    - 'V01 | Every uses: references an action in the actions/ organization | QUALITY_CI_ACTION_FORBIDDEN'
    - 'V02 | Workflow has permissions contents: read, concurrency with cancel-in-progress true and timeout-minutes | QUALITY_CI_WORKFLOW_INVALID'
    - V03 | e2e job downloads the pwa-dist artifact and never runs the build | QUALITY_CI_ARTIFACT_MISSING
    - V04 | Docs-only change skips test jobs and a change to a module.spec.yaml runs spec-check | QUALITY_CI_PATH_FILTER_WRONG
    - V05 | Fast gate p95 duration is at most 10 min on a warm cache | QUALITY_CI_GATE_TOO_SLOW
  workflow_state_machine:
    requirements:
    - A workflow run moves through queued, in progress, then success, failure or cancelled; cancelled by newer push is a normal outcome.
    - The nightly workflow opens or updates one issue labelled nightly-failure when a long run fails and closes it when the next run passes.
    - 'Job dependency graph: install, then parallel spec-check, typecheck, unit-property-integration and build-pwa, then e2e-smoke after build-pwa, then gate-summary.'
    machines: []
    note: 'Tooling module: no domain entity has a lifecycle. Runs are stateless processes that exit 0 (pass) or non-zero (fail).'
    timeouts: []
  commands_queries_events:
    requirements:
    - 'The module exposes workflow triggers: push, pull_request (opened, synchronize, reopened), workflow_dispatch and schedule for nightly.'
    - Reusable scripts are pnpm ci:fast and pnpm ci:nightly so that developers can reproduce a gate locally; the YAML only calls these scripts.
    - The release workflow calls pnpm gates:release from F17.S03.M02 and fails on a non-zero exit.
    commands: []
    queries: []
    events_produced: []
    events_consumed: []
    errors:
    - QUALITY_CI_ACTION_FORBIDDEN | 422 | no | workflow uses a non first-party action (lint exit 3)
    - QUALITY_CI_WORKFLOW_INVALID | 422 | no | workflow lacks permissions, concurrency or timeout (lint exit 3)
    - QUALITY_CI_ARTIFACT_MISSING | 422 | no | pwa-dist artifact missing in e2e job (job fails)
    - QUALITY_CI_PATH_FILTER_WRONG | 422 | no | path filter does not match the documented rule (lint exit 3)
    - QUALITY_CI_GATE_TOO_SLOW | 422 | no | fast gate p95 exceeded 10 min (reported, exit 1 in the weekly check)
    note: 'Tooling module: exposes no relay commands or queries and emits no domain events; the interface is the pnpm scripts and CLI exit codes listed in the example.'
    example: |-
      $ pnpm ci:fast
        install 41 s (cache hit) | spec:check 0 errors | typecheck 38 s | unit/property/integration 3 min 12 s | build-pwa 74 s
        e2e-smoke (pwa-dist, no relay) 82 s  | gate-summary OK  total 7 min 4 s
      $ node tools/ci-lint .github/workflows
        nightly.yml OK  ci.yml OK
  authorization_capabilities:
    requirements:
    - 'Workflows run with permissions contents: read and no secrets on pull requests; nightly creates issues with issues: write on that job only.'
    - No workflow uses long-lived credentials or deploys; the PWA is static and relays are operated by their hosts.
    - Secret scanning (F16.S01.M02) runs in the fast gate on the diff and fails on a finding.
    capabilities: []
    notes: 'No runtime capabilities of its own: this module runs only in developer shells and CI jobs. Under ADR-0016 (CTR-CAP-001 CAP-8) the tests exercise two layers: vault policy (local principal mutates only its records; incoming signed statements accepted only from a key authorized for the role, else quarantined) and relay policy (relay-signed requests or relay access tokens). Tests never ship in the PWA or relay bundles.'
  failure_recovery_idempotency:
    requirements:
    - Re-running a failed job is safe because every job is a pure function of the commit; artifacts are overwritten by name.
    - Cache and artifact steps use continue-on-error false for artifacts and true for cache restore, so cache outages slow the build but do not fail it.
    - Infrastructure failures (runner lost, cache service error) are retried once automatically by re-run; assertion failures are never retried.
    idempotency: Jobs are pure functions of the commit; re-runs produce the same result and overwrite artifacts of the same name.
    concurrency: concurrency group ci-<workflow>-<ref> with cancel-in-progress true for the gate; nightly uses a separate group without cancellation.
    retries: Only infrastructure failures (runner loss, cache service) are re-run once; test failures are never retried at job level.
    offline: CI has network access to the registry only through pnpm install; tests themselves run with network egress denied by the test guards.
    partial_failure: If any job fails the gate-summary fails and artifacts of earlier jobs remain available for debugging; a skipped job counts as success only when skipped by the path filter.
  privacy_retention_abuse:
    requirements:
    - Fork pull requests run with read-only tokens and no secrets; logs are scanned for token patterns by the secrets step before upload.
    - Artifacts contain test reports and the static build only, with no user data (the PWA sends no telemetry per OBS-7).
    - 'Retention: PWA artifact 7 days, fast reports 14 days, nightly reports 30 days.'
    data:
    - Source code, lockfile hashes, test reports.
    - No user data and no secrets in artifacts.
    retention:
    - pwa-dist 7 days; fast reports 14 days; nightly reports 30 days; check run history per GitHub defaults.
    threats:
    - 'T01 | Malicious pull request exfiltrates secrets | no secrets on pull requests, contents: read, no pull_request_target, first-party actions only pinned to a SHA or exact tag'
    - T02 | Supply-chain action compromise | only actions/* allowed; lint enforces; pnpm install uses --frozen-lockfile and lockfile hash cache key
    - T03 | Cache poisoning across branches | cache keys contain the lockfile hash and runner OS; caches from forks are not restored into protected branches
    abuse_controls:
    - Resource abuse by pull request spam is bounded by concurrency cancel-in-progress and a 15 min timeout.
    - Workflow edits require code-owner review of .github/.
  observability_performance:
    requirements:
    - The fast gate completes in at most 10 min p95 on ubuntu-24.04 (2 vCPU) with a warm cache; install at most 60 s warm; PWA build at most 90 s.
    - Each workflow writes a job summary with per-job durations and the cache hit ratio; a cache hit ratio under 80 percent over 20 runs is flagged.
    - Initial JS size of the built PWA is reported (budget 150 KiB gzip) and fails the build job when exceeded.
    metrics:
    - classrup_quality_ci_duration_ms{job}
    - classrup_quality_ci_cache_hit_ratio
    - classrup_quality_ci_runs_total{outcome}
    logs:
    - Job summary lines with job, duration, outcome; secrets masked by GitHub; no payloads.
    budgets:
    - Fast gate at most 10 min p95; install warm at most 60 s; PWA build at most 90 s; e2e smoke at most 90 s.
    - Nightly workflow at most 60 min total.
  contract_and_acceptance_tests:
    requirements:
    - Every requirement of this module is covered by at least one automated test using the mapping in section 09.
    - The workflow lint is unit-tested with good and bad workflow fixtures, and dry-run in CI on every change to .github.
    - A canary pull request fixture proves that docs-only changes skip tests and spec YAML changes run spec:check.
    fixtures: Workflow fixtures under tools/ci-lint/fixtures (good.yml and 8 bad variants), a changed-files fixture list for path filter checks, a recorded timing set of 20 runs.
    tests:
    - T01 | unit | 01.R01,01.R02,01.R03 | lint good workflow fixtures and check artifact names, retention and env pins | all accepted; names and pins verified
    - 'T02 | unit | 02.R01 | lint 8 bad fixtures: third-party action, missing permissions, broad permissions, pull_request_target, no concurrency, no timeout | each rejected with its code'
    - T03 | unit | 02.R02,03.R03,04.R01 | parse ci.yml job graph and triggers | install precedes all; e2e-smoke needs build-pwa; triggers include push, pull_request, workflow_dispatch, schedule for nightly
    - T04 | integration | 02.R03,03.R01 | simulate run with one failed and one skipped-by-filter job | gate-summary fails for failure and passes for path-filter skip
    - T05 | integration | 03.R02,06.R02 | nightly failure then success | one nightly-failure issue opened, updated, then closed
    - T06 | unit | 04.R02,04.R03 | read package scripts and release workflow | ci:fast, ci:nightly exist; release calls gates:release and propagates exit code
    - T07 | abuse | 05.R01,05.R02,05.R03 | scan workflows for secrets, deploy steps and credentials; plant a secret in the diff | no secrets or deploys; planted secret fails the secrets step
    - T08 | integration | 06.R01,06.R03 | re-run a job; simulate cache outage and runner loss | same result; cache outage slows but passes; infrastructure failure re-run once
    - T09 | abuse | 07.R01,07.R02,07.R03 | review fork run logs and artifact contents; check retention config | tokens masked; no user data; retention 7, 14, 30 days
    - T10 | load | 08.R01,08.R02 | timings of 20 recorded fast-gate runs | p95 at most 10 min; cache hit ratio reported
    - T11 | unit | 08.R03 | build artifact exceeding 150 KiB gzip initial JS | build job fails
    - 'T12 | integration | 09.R01,09.R02,09.R03 | canary pull requests: docs-only, spec YAML change, code change | docs-only skips tests; spec change runs spec:check; code change runs everything'
    - T13 | integration | 10.R01,10.R02,10.R03 | introduce a new workflow in a branch and revert | lint validates before merge; revert restores prior behavior
    acceptance:
    - The fast gate runs install, spec:check, typecheck, unit, property, integration, a single PWA build and e2e smoke without a relay, and finishes in at most 10 min p95.
    - A docs-only pull request skips the test jobs while a spec YAML change still runs spec:check.
    - Only first-party actions are used and no pull request workflow has secrets or write permissions.
    - The nightly workflow runs long property, load, chaos and compatibility jobs and publishes reports.
  import_export_backup_rollback:
    requirements:
    - Workflow files and the lint script are the only exports; there is no user data.
    - A new workflow is introduced by pull request and validated by the lint before merge; branch protection settings are documented in the repository settings file.
    - Rollback is a git revert of the workflow change; in-flight runs finish with their previous definition.
    export: Workflow YAML in git; run reports as CI artifacts.
    backup: Repository hosting provides history; no module-specific backup.
    migration_rollback: Revert the workflow commit; branch protection continues to require gate-summary.
    import: 'Not applicable: workflows import no data; actions and dependencies come only from the lockfile and first-party actions.'
