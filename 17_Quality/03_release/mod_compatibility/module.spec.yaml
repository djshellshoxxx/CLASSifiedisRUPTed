id: F17.S03.M03
scope: MVP
summary: Compatibility tests that keep older data and clients working. Schema N-1 tests check that the current code reads records, signed statements and export bundles written by the previous release (CTR-SCH-001) and that vault IndexedDB migrations upgrade N-1 vaults without loss; signed envelopes from older releases still verify. API versioning checks protect relay endpoints. A browser support matrix runs smoke journeys on the last 2 versions of Chrome, Firefox and Safari, with iOS 16.4 or later required for Web Push.
responsibilities:
- 'Maintain fixtures of the previous release (N-1): vault snapshots, exported bundles, signed statements and relay API recordings; test that the current release reads them and that a vault upgraded from N-1 round-trips exactly.'
- Check that newer statements with unknown optional fields are accepted by N-1 readers and that unknown major schema versions are refused with UNSUPPORTED_SCHEMA_VERSION.
- 'Define and run the browser support matrix: last 2 stable versions of Chrome, Firefox and Safari (desktop and mobile), plus iOS Safari 16.4 or later for installed PWAs using Web Push; Playwright covers Chromium (pinned), Firefox and WebKit builds in the nightly job.'
- 'Check relay API versioning: /api/v1 paths unchanged, additive-only changes within a major, deprecation headers present, and generated OpenAPI diff against the previous release shows no breaking change.'
non_responsibilities:
- Implementing migrations (F15.S02.M03 and each module).
- General e2e journeys on the pinned Chromium (F17.S01.M04).
- Policy of schema evolution (CTR-SCH-001).
- 'Future: automated testing on real iOS devices and on N-2 releases.'
depends_on:
- CTR-SCH-001
- CTR-ERR-001
- CTR-FED-001
- CTR-IOX-001
- CTR-TST-001
- CTR-OBS-001
- F17.S01.M01
- F15.S02.M03
user_stories:
- As a user with an older vault, I upgrade the app and all my records, drafts and signed statements are still there and valid.
- As a relay operator, I upgrade to a new release without breaking clients on the previous minor version.
- As a product owner, I see a support matrix report telling me which browsers pass smoke journeys.
edge_cases:
- A record written by N-1 lacks a field added in N; the reader supplies the documented default and the record validates.
- A signed statement from N-1 uses an older canonical form; verification still succeeds because signature covers its original JCS bytes.
- The vault upgrade is interrupted midway (tab closed); the next start resumes or rolls back and no record is lost or duplicated.
- Safari lacks a feature (for example Web Push outside installed PWAs); the app degrades with a visible message rather than failing.
- A relay returns an unknown additive field; clients ignore it.
- An export from the newer release is imported into N-1; unknown major versions are refused clearly rather than partially imported.
ux:
  notes: Headless. Outputs are a compatibility report (reports/compat.json and compat.md) and a browser matrix table of pass, fail and unsupported per journey.
processes:
  domain_schema:
    requirements:
    - The module owns no persisted entities; N-1 fixtures live in tests/compat/fixtures/<version>/ and are regenerated by a script at each release.
    - Each fixture set contains a vault snapshot, an export bundle (CTR-IOX-001), signed statements (CTR-FED-001) and relay API recordings with the producing version recorded.
    - Fixtures are synthetic and contain generated keys that are never used elsewhere.
    entities: []
    note: 'Tooling module: owns no persisted entities. Its outputs are test configuration, source files under the code path and CI artifacts (JSON/JUnit/LCOV reports) that are regenerated on every run and never stored by the relay.'
  validation_rules:
    requirements:
    - The current release must read every N-1 fixture and, after upgrade, every record validates against its current schema and every N-1 signature still verifies.
    - 'Schemas follow expand and contract: removed required fields or changed meanings of a field fail the schema diff check with QUALITY_COMPAT_BREAKING_CHANGE.'
    - Unknown optional fields are ignored by readers and unknown major versions are refused with UNSUPPORTED_SCHEMA_VERSION.
    rules:
    - V01 | Current release reads all N-1 fixtures and upgraded records validate against current schemas | QUALITY_COMPAT_N1_READ_FAILED
    - V02 | Schema diff against the previous tag shows no removed or retyped fields within a major version | QUALITY_COMPAT_BREAKING_CHANGE
    - V03 | N-1 signed statements still verify after upgrade | QUALITY_COMPAT_SIGNATURE_BROKEN
    - V04 | Vault upgrade interrupted at any step loses and duplicates zero records | QUALITY_COMPAT_UPGRADE_UNSAFE
    - V05 | Every browser matrix cell passes smoke or is documented as unsupported | QUALITY_COMPAT_BROWSER_FAILED
    - V06 | Relay OpenAPI diff has no removed paths, removed fields or retyped fields | QUALITY_COMPAT_API_BREAKING
  workflow_state_machine:
    requirements:
    - Vault upgrade runs through states N-1, upgrading and N; interruption in upgrading must resume or roll back on next start with zero lost or duplicated records.
    - Browser matrix cells move through queued, running and pass, fail or unsupported; a cell marked unsupported needs an entry in the support policy.
    - A release is blocked when any cell for last-2 Chrome, Firefox or Safari fails its smoke journey.
    machines: []
    note: 'Tooling module: no domain entity has a lifecycle. Runs are stateless processes that exit 0 (pass) or non-zero (fail).'
    timeouts: []
  commands_queries_events:
    requirements:
    - The module exposes pnpm test:compat (N-1 data and API), pnpm test:compat:browsers (matrix, nightly) and pnpm compat:schema-diff.
    - 'Exit codes: 0 pass, 1 compatibility failure, 2 matrix cell failure, 3 configuration failure.'
    - The OpenAPI diff compares the generated relay spec of the previous release tag with the working tree and fails on removed paths, removed fields or changed types.
    commands: []
    queries: []
    events_produced: []
    events_consumed: []
    errors:
    - QUALITY_COMPAT_N1_READ_FAILED | 422 | no | current release cannot read an N-1 fixture (exit 1)
    - QUALITY_COMPAT_BREAKING_CHANGE | 422 | no | schema change breaks N-1 compatibility (exit 1)
    - QUALITY_COMPAT_SIGNATURE_BROKEN | 422 | no | N-1 signature no longer verifies (exit 1)
    - QUALITY_COMPAT_UPGRADE_UNSAFE | 422 | no | vault upgrade lost or duplicated records (exit 1)
    - QUALITY_COMPAT_BROWSER_FAILED | 422 | no | a browser matrix cell failed (exit 2)
    - QUALITY_COMPAT_API_BREAKING | 422 | no | relay API diff shows a breaking change (exit 1)
    note: 'Tooling module: exposes no relay commands or queries and emits no domain events; the interface is the pnpm scripts and CLI exit codes listed in the example.'
    example: |-
      $ pnpm test:compat
        fixtures 0.2.x -> 0.3.0: 842 records upgraded, 842 valid, 311 signatures verified  OK
        schema diff: 1 additive field (mutiny.proposal.note)  OK
        openapi diff: 0 breaking  OK
      $ pnpm test:compat:browsers
        chrome 150,149 OK | firefox 142,141 OK | safari 26,18 OK | ios-safari 16.4 push feature-detect OK
  authorization_capabilities:
    requirements:
    - Compat tests run as unit and integration tests with no relay credentials; relay API recordings are replayed against the in-process relay with relay access tokens from fixtures.
    - Vault upgrade tests use locally generated keys; no secret leaves the test process.
    - Statements from N-1 signed by a key authorized in N-1 remain accepted when the role mapping is unchanged (CTR-CAP-001 CAP-8).
    capabilities: []
    notes: 'No runtime capabilities of its own: this module runs only in developer shells and CI jobs. Under ADR-0016 (CTR-CAP-001 CAP-8) the tests exercise two layers: vault policy (local principal mutates only its records; incoming signed statements accepted only from a key authorized for the role, else quarantined) and relay policy (relay-signed requests or relay access tokens). Tests never ship in the PWA or relay bundles.'
  failure_recovery_idempotency:
    requirements:
    - 'The vault upgrade is idempotent: running it twice leaves identical data, and an interrupted upgrade resumes without duplicating records.'
    - 'Rollback of the app to N-1 after upgrade is tested for additive-only changes: N-1 code reads N vault data, ignoring unknown optional fields.'
    - The matrix runner retries a cell once for infrastructure failure only.
    idempotency: The vault upgrade is idempotent and the compat suite re-creates vaults from fixtures on each run, so re-runs are safe.
    concurrency: Browser matrix cells run in parallel (max 6 workers) with isolated profiles; N-1 tests are sequential per fixture set.
    retries: A matrix cell is retried once for infrastructure failures (browser download, runner loss), never for assertion failures.
    offline: N-1 data and schema tests run fully offline; the browser matrix needs the nightly runner to have the browser builds cached.
    partial_failure: If one cell or fixture set fails, all others still run and the report lists every failure.
  privacy_retention_abuse:
    requirements:
    - Fixtures and reports contain no real data; keys are synthetic.
    - Browser matrix runs use clean profiles with no extensions and no accounts.
    - Reports are retained 30 days in CI.
    data:
    - Synthetic fixtures with generated keys (P0/P1).
    - 'Reports: versions, counts, verdicts.'
    retention:
    - Fixtures kept in git for the last 2 releases plus the current; reports 30 days as artifacts.
    threats:
    - T01 | Fixture keys reused as real keys | fixture keys are generated by the script, marked test-only and rejected by the production key import path
    - T02 | Breaking change sneaks in through a migration | schema diff and N-1 read tests are release-blocking (gates module) and code-owned
    - T03 | Older client misreads a newer statement and accepts a forged field | unknown major versions refused; unknown optional fields ignored but covered by the signature so tampering is detected
    abuse_controls:
    - 'Changes to fixtures of released versions are rejected: released fixture directories are append-only.'
    - The browser matrix cannot be reduced without editing the support policy file, which is code-owned.
  observability_performance:
    requirements:
    - The runner records pass or fail per cell, durations and the browser version tested.
    - N-1 data tests finish in at most 60 s; schema and OpenAPI diff in at most 20 s; browser matrix in at most 25 min nightly.
    - Web Push check on installed iOS 16.4+ PWA is simulated through feature detection and the content-free push payload format (reference and template key only).
    metrics:
    - classrup_quality_compat_checks_total{kind,outcome}
    - classrup_quality_compat_matrix_cells{browser,outcome}
    - classrup_quality_compat_records_upgraded_total
    logs:
    - JSON line per check {ts, level, msg, module, kind, outcome, durationMs, code?} with counts only.
    budgets:
    - N-1 data tests at most 60 s; schema and OpenAPI diff at most 20 s.
    - Browser matrix at most 25 min nightly with 6 workers.
  contract_and_acceptance_tests:
    requirements:
    - Every requirement of this module is covered by at least one automated test using the mapping in section 09.
    - Planted breaking changes (field removed, type changed, required field added) must be caught by the schema diff.
    - The support matrix in documentation is compared with the matrix actually run in CI to prevent drift.
    fixtures: 'Fixture sets for N-1 (previous tag) with 842 records, 311 signed statements, one export bundle and 40 recorded API calls; browser versions: Chrome and Firefox last 2 stable, Safari last 2, iOS Safari 16.4 minimum.'
    tests:
    - T01 | integration | 01.R01,01.R02,01.R03 | load fixture manifests and inspect keys | manifest lists version, vault, bundle, statements, API recordings; keys flagged test-only
    - T02 | integration | 02.R01,06.R02 | upgrade the N-1 vault and validate all records and signatures; open N vault with N-1 code | all records valid and signatures verify; N-1 ignores unknown optional fields
    - 'T03 | unit | 02.R02,09.R02 | planted breaking changes: field removed, type changed, required field added | each fails with QUALITY_COMPAT_BREAKING_CHANGE'
    - T04 | unit | 02.R03,10.R02 | statement with unknown optional field and with unknown major version | optional ignored; major refused with UNSUPPORTED_SCHEMA_VERSION; N export into N-1 refused clearly
    - T05 | chaos | 03.R01,06.R01 | interrupt vault upgrade at each step, then restart | resumes or rolls back; zero lost and zero duplicated records; second upgrade identical
    - T06 | e2e | 03.R02,03.R03 | browser matrix smoke on Chrome, Firefox and WebKit | cells report pass; unsupported cells match the policy; a failing cell blocks with exit 2
    - T07 | unit | 04.R01,04.R02,04.R03 | run scripts; diff OpenAPI of previous tag and working tree with a removed field | documented exit codes; QUALITY_COMPAT_API_BREAKING for removed field
    - T08 | integration | 05.R01,05.R02,05.R03 | replay N-1 API recordings against in-process relay; statements with unchanged role mapping | accepted using fixture tokens; no secrets outside the process
    - T09 | unit | 06.R03 | force an infrastructure failure on one cell | retried once; assertion failure not retried
    - T10 | abuse | 07.R01,07.R02 | scan fixtures and reports for real data and profile config | synthetic only; clean profiles without extensions
    - T11 | integration | 07.R03,10.R01 | modify a released fixture directory in a branch | rejected as append-only; reports retained 30 days
    - T12 | load | 08.R01,08.R02 | run N-1 data, diff and matrix suites | 60 s, 20 s and 25 min budgets met; versions recorded
    - T13 | e2e | 08.R03 | iOS Safari 16.4 profile feature detection and content-free push payload | push capability detected; payload holds reference and template key only; fallback message shown otherwise
    - T14 | integration | 09.R01,09.R03 | traceability run and doc matrix comparison | every requirement maps to a passing test; documented matrix equals CI matrix
    - T15 | integration | 10.R03 | revert module in a branch | other suites unaffected; release gate fails closed without compat report
    acceptance:
    - The current release reads all N-1 vaults, bundles and signed statements with zero loss and all signatures verifying.
    - A planted breaking schema or API change fails the compatibility checks.
    - The last 2 versions of Chrome, Firefox and Safari pass smoke journeys and iOS Safari 16.4 or later is covered for Web Push.
    - An interrupted vault upgrade loses and duplicates no record.
  import_export_backup_rollback:
    requirements:
    - Compat reports and the support matrix table are exports; fixtures are the N-1 export bundles.
    - Importing an N export into N-1 must fail clearly (UNSUPPORTED_SCHEMA_VERSION) rather than partially; importing N-1 into N must succeed fully.
    - Rollback of this module is a git revert; fixtures for a new release are generated at the release tag before changes to schemas are merged.
    export: reports/compat.json and compat.md; N-1 export bundles act as fixtures.
    backup: Fixtures in git for last 2 releases; reports 30 days in CI.
    migration_rollback: Fixtures are generated at each release tag before schema changes merge; rollback by git revert; app rollback to N-1 is tested for additive changes.
    import: Imports N-1 export bundles (CTR-IOX-001) as fixtures; bundles of an unknown major version are refused with UNSUPPORTED_SCHEMA_VERSION.
