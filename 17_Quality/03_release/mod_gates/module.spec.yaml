id: F17.S03.M02
scope: MVP
summary: 'Release checklist automation (tools/gates). Before a release tag, one command evaluates the gates and prints a verdict with evidence: requirement-to-test traceability at 100 percent (tools/trace reads TEST-PS-NNN-PP.Tnn titles), no critical or high production vulnerabilities (pnpm audit --prod), accessibility with zero serious violations, performance budgets from the load and PWA reports, completeness of the spec report, and a changelog entry for the version. Any failed gate blocks the release.'
responsibilities:
- Implement pnpm gates:release which runs the gates traceability, audit, a11y, budgets, spec and changelog, each producing a machine-readable result in reports/gates.json.
- 'Traceability gate: tools/trace maps each requirement ID PS-NNN-PP.Rnn from module.spec.yaml to test titles in code and to passing results in the JUnit reports; any requirement without a passing test (and without a documented untested reason) fails the gate.'
- 'Audit gate: run pnpm audit --prod --audit-level=high and fail on any critical or high finding; moderate and low findings are listed but do not fail.'
- 'Budget gate: read reports/load.json (OBS-4 relay budgets), the PWA budgets (LCP 2.5 s, INP 200 ms, CLS 0.1, initial JS 150 KiB gzip; OBS-5) and the axe report with zero serious or critical issues.'
- 'Changelog gate: CHANGELOG.md contains a section for the version being released with at least one entry and a link to the release notes.'
non_responsibilities:
- Running the tests and generating reports (F17.S01, F17.S02); this module only reads their outputs.
- Deployment of relays or hosting of the PWA.
- Legal and policy review gates (F18).
- 'Future: SBOM generation and signed release provenance.'
depends_on:
- CTR-TST-001
- CTR-OBS-001
- F17.S01.M01
user_stories:
- As a release manager, I run one command and see which gate blocks the release and why.
- As a developer, I add a test titled TEST-PS-142-09.T05 and the traceability report immediately shows the requirement covered.
- As a security reviewer, I get the audit findings with severity and affected package in the report.
edge_cases:
- A requirement is listed untested with a reason in the spec; the trace gate accepts it and lists it in the report as waived.
- A test title has a typo in the ID; the trace gate reports an unknown test ID and does not count it.
- pnpm audit cannot reach the registry; the gate fails closed with QUALITY_GATE_AUDIT_UNAVAILABLE instead of passing.
- A test is present but skipped or failing in the JUnit report; it does not count as passing.
- A vulnerability is in a dev-only dependency; --prod excludes it and the report notes the scope.
- Two modules reuse the same TEST ID; the trace gate fails with QUALITY_GATE_TRACE_DUPLICATE.
ux:
  notes: Headless CLI. Output is a table of gates with PASS or FAIL, evidence links and exit code; reports/gates.json and reports/gates.md are produced for the release notes.
processes:
  domain_schema:
    requirements:
    - The module owns no persisted entities; reports/gates.json (schema classrup-gates-report/v1) records each gate verdict, evidence and timestamp.
    - The trace matrix reports/trace.json maps each requirement ID to test IDs and results, covering all modules with a module.spec.yaml.
    - Evidence references are file paths and counts; reports contain no user data.
    entities: []
    note: 'Tooling module: owns no persisted entities. Its outputs are test configuration, source files under the code path and CI artifacts (JSON/JUnit/LCOV reports) that are regenerated on every run and never stored by the relay.'
  validation_rules:
    requirements:
    - 'Traceability is 100 percent: every requirement PS-NNN-PP.Rnn is covered by at least one passing test whose title starts with TEST-PS-NNN-PP.Tnn and whose spec row lists the requirement, or has a documented untested reason (CTR-TST-001 TST-4).'
    - The audit gate fails on any critical or high production vulnerability reported by pnpm audit --prod and fails closed when the audit cannot run.
    - The a11y and budget gates fail when any report is missing, older than 24 hours, or shows a violation or exceeded budget.
    rules:
    - V01 | Every requirement has a passing test with a matching title and covers entry, or a documented untested reason | QUALITY_GATE_TRACE_GAP
    - V02 | No test ID is used twice and every test title refers to an existing requirement | QUALITY_GATE_TRACE_DUPLICATE
    - V03 | pnpm audit --prod reports zero critical and zero high findings | QUALITY_GATE_VULNERABLE
    - V04 | Audit can run and returns a result | QUALITY_GATE_AUDIT_UNAVAILABLE
    - V05 | Accessibility report shows zero serious and zero critical violations and is under 24 h old for this commit | QUALITY_GATE_A11Y
    - V06 | Load and PWA budgets from OBS-4 and OBS-5 are met in reports for this commit | QUALITY_GATE_BUDGET
    - V07 | CHANGELOG.md has a non-empty section for the release version | QUALITY_GATE_CHANGELOG
    - V08 | Waivers are unexpired and at most 14 days long | QUALITY_GATE_WAIVER_EXPIRED
  workflow_state_machine:
    requirements:
    - There is no entity lifecycle; the release process is a sequence of gates, each pass or fail, with the final verdict GO only when all pass.
    - Gates run in the order spec, traceability, audit, a11y, budgets, changelog and all run even after a failure so the report is complete.
    - A waiver is a documented entry in gates/waivers.yaml with ID, reason, owner and expiry date at most 14 days away; expired waivers fail.
    machines: []
    note: 'Tooling module: no domain entity has a lifecycle. Runs are stateless processes that exit 0 (pass) or non-zero (fail).'
    timeouts: []
  commands_queries_events:
    requirements:
    - The module exposes pnpm gates:release, pnpm gates:trace, pnpm gates:audit and pnpm gates:report.
    - 'Exit codes: 0 GO, 1 at least one gate failed, 2 evidence missing or stale, 3 configuration failure.'
    - The release workflow of F17.S03.M01 calls gates:release and attaches reports/gates.md to the release.
    commands: []
    queries: []
    events_produced: []
    events_consumed: []
    errors:
    - QUALITY_GATE_TRACE_GAP | 422 | no | requirement without a passing test (exit 1)
    - QUALITY_GATE_TRACE_DUPLICATE | 422 | no | duplicate or dangling test ID (exit 1)
    - QUALITY_GATE_VULNERABLE | 422 | no | critical or high production vulnerability (exit 1)
    - QUALITY_GATE_AUDIT_UNAVAILABLE | 503 | yes | audit could not run; gate fails closed (exit 2)
    - QUALITY_GATE_A11Y | 422 | no | serious or critical accessibility violation or stale report (exit 1)
    - QUALITY_GATE_BUDGET | 422 | no | a performance budget was exceeded or its report is stale (exit 1)
    - QUALITY_GATE_CHANGELOG | 422 | no | no changelog entry for the version (exit 1)
    - QUALITY_GATE_WAIVER_EXPIRED | 422 | no | a waiver is expired or longer than 14 days (exit 1)
    note: 'Tooling module: exposes no relay commands or queries and emits no domain events; the interface is the pnpm scripts and CLI exit codes listed in the example.'
    example: |-
      $ pnpm gates:release --version 0.3.0
        traceability  1432/1432 requirements covered (2 waived)  PASS
        audit         0 critical, 0 high, 3 moderate  PASS
        a11y          serious 0, critical 0  PASS
        budgets       relay OBS-4 PASS, PWA OBS-5 PASS
        changelog     0.3.0 present  PASS
        verdict GO  (reports/gates.json)
  authorization_capabilities:
    requirements:
    - 'Gates are read-only against the repository and run with contents: read; no token or secret is needed.'
    - Waivers require a code-owner approved commit; the gate prints the approver from git metadata.
    - Audit calls use the public registry endpoint only and send no repository content.
    capabilities: []
    notes: 'No runtime capabilities of its own: this module runs only in developer shells and CI jobs. Under ADR-0016 (CTR-CAP-001 CAP-8) the tests exercise two layers: vault policy (local principal mutates only its records; incoming signed statements accepted only from a key authorized for the role, else quarantined) and relay policy (relay-signed requests or relay access tokens). Tests never ship in the PWA or relay bundles.'
  failure_recovery_idempotency:
    requirements:
    - Gates are idempotent and side-effect free apart from writing reports; re-running yields the same verdict for the same inputs.
    - Stale evidence (older than 24 h or from a different commit SHA) is rejected so a green result from another commit cannot be reused.
    - If a gate crashes it is reported as failed with the error message and the other gates still run.
    idempotency: Gates only read inputs and write reports; re-running with the same inputs returns the same verdict.
    concurrency: Gates run in parallel where independent (audit and trace) with a join before the verdict; the report is written atomically once.
    retries: The audit call is retried 3 times with 2 s backoff for network errors, then fails closed; other gates are not retried.
    offline: The audit gate needs the registry; offline it fails closed with QUALITY_GATE_AUDIT_UNAVAILABLE. Other gates work offline from local reports.
    partial_failure: All gates always run; a crash in one is recorded as failed and does not hide results of others.
  privacy_retention_abuse:
    requirements:
    - Reports contain package names and advisory IDs from the audit and test IDs; no user data.
    - Waivers are public in the repository and carry no personal data beyond a GitHub handle.
    - Gate reports are retained with the release artifacts for 1 year.
    data:
    - Package names, advisory IDs, test IDs, requirement IDs.
    - No user data.
    retention:
    - Release reports kept with release artifacts for 1 year; CI copies 30 days.
    threats:
    - T01 | Release forced through by editing the gate or waivers | gates and waivers are code-owned, waivers expire in 14 days and are listed in the report
    - T02 | Fake test titles to satisfy traceability | gate counts only tests present in a JUnit report as passed and whose spec row lists the requirement
    - T03 | Stale green reports reused | evidence must match the commit SHA and be under 24 h old
    abuse_controls:
    - A gate may not be disabled by environment variable in the release workflow; only waivers are allowed.
    - 'The audit gate ignores nothing silently: ignored advisories need a waiver.'
  observability_performance:
    requirements:
    - The module records gate durations and the trace coverage ratio in reports/gates.json.
    - The complete gate run finishes in at most 60 s (excluding the audit network call, at most 30 s).
    - Trace coverage ratio is reported per module and in total; the release requires 1.0.
    metrics:
    - classrup_quality_gates_verdict{gate,outcome}
    - classrup_quality_trace_coverage_ratio{module}
    - classrup_quality_gates_duration_ms
    logs:
    - JSON line per gate {ts, level, msg, module, gate, outcome, durationMs, code?} with counts only.
    budgets:
    - Full gate run at most 60 s excluding audit; audit at most 30 s.
    - Trace over 148 modules and 5 000 requirements at most 10 s.
  contract_and_acceptance_tests:
    requirements:
    - Every requirement of this module is covered by at least one automated test using the mapping in section 09.
    - 'Gate logic is tested with synthetic repositories: full coverage, one missing test, one skipped test, a duplicate ID, an expired waiver.'
    - The audit gate is tested with recorded audit JSON for critical, high, moderate and unavailable cases.
    fixtures: 'Synthetic repos: full coverage, one gap, one skipped test, a duplicate ID, an expired waiver; recorded audit JSON (critical, high, moderate, unavailable); fixed commit SHA a1b2c3d.'
    tests:
    - T01 | unit | 01.R01,01.R03,06.R01 | generate gates.json on the full-coverage repo | schema valid; no user data fields; verdict GO
    - 'T02 | unit | 01.R02,02.R01,09.R02 | synthetic repos: gap, skipped test, duplicate ID | QUALITY_GATE_TRACE_GAP and QUALITY_GATE_TRACE_DUPLICATE; skipped test not counted'
    - 'T03 | unit | 02.R02,09.R03 | recorded audit JSON: critical, high, moderate, unavailable | critical and high fail; moderate passes; unavailable fails closed'
    - 'T04 | unit | 02.R03,06.R02 | a11y and load reports: missing, 25 h old, other commit SHA, with violations | each fails with its code'
    - T05 | unit | 03.R01,03.R02 | run all gates on a repo with two failures | all gates run; verdict fails; both failures listed
    - T06 | unit | 03.R03,05.R02 | waiver 15 days long, expired, valid | long and expired fail QUALITY_GATE_WAIVER_EXPIRED; valid passes and is reported as waived
    - T07 | integration | 04.R01,04.R02,04.R03 | run each script and the release workflow dry-run | documented exit codes; gates.md attached
    - T08 | abuse | 05.R01,05.R03 | attempt to disable a gate by env var and inspect network calls | gate still runs; only registry audit endpoint is called
    - T09 | integration | 06.R03 | crash one gate by injecting an exception | reported failed; others complete
    - T10 | integration | 07.R01,07.R02,07.R03 | inspect reports for data and retention config | only package, advisory, test IDs; handles only in waivers; retention 1 year
    - T11 | load | 08.R01,08.R02,08.R03 | trace 148 modules with 5 000 requirements | at most 10 s; whole run at most 60 s; coverage ratio per module printed
    - T12 | integration | 09.R01 | traceability tool run on this module | every requirement of this module maps to a passing test
    - T13 | unit | 10.R01,10.R02,10.R03 | feed unknown fields and unknown major versions; remove tools/gates in a branch | unknown fields ignored; unknown major rejected; release workflow fails closed
    - T14 | unit | 06.R01 | same inputs run twice with a different clock | identical verdict and report body
    acceptance:
    - The release gate fails when any requirement lacks a passing test and passes at 100 percent traceability.
    - A critical or high production vulnerability or an unavailable audit blocks the release.
    - Any serious accessibility violation or exceeded budget blocks the release.
    - The gate report is attached to every release and waivers expire within 14 days.
  import_export_backup_rollback:
    requirements:
    - reports/gates.json, reports/trace.json and reports/gates.md are the exports and are attached to the release.
    - Gate input formats are JUnit XML, load report v1, axe JSON and the audit JSON; unknown fields are ignored and unknown major versions are rejected.
    - Rollback is a git revert of tools/gates; the release workflow then fails closed on a missing command.
    export: reports/gates.json, reports/trace.json and reports/gates.md attached to each release.
    backup: Release artifacts retain reports for 1 year; sources in git.
    migration_rollback: Report schema versioned; revert tools/gates by git revert and the release workflow fails closed.
    import: Inputs are JUnit XML, load report v1, axe JSON and audit JSON from the current commit; other inputs are ignored and unknown major versions rejected.
