id: F18.S02.M01
scope: MVP
summary: >-
  Operator-run policy change proposals with a public comment period, a recorded decision and a changelog. A
  publisher (typically a relay operator, or the project for the bundled packs) drafts a proposal in its own
  vault, signs and publishes it as classrup.governance.policy_proposal/v1, collects signed comments from members
  through its relay, and a decider key that the publisher delegated in its signed authority list
  (classrup.governance.authority_list/v1) later signs a decision statement (classrup.governance.policy_decision/v1)
  in the decider's own vault. The comment period is anchored to the relay-signed receipt of the proposal, not to
  publisher or decider clocks. Other modules and vaults verify an approved decision against the publisher, the
  exact approved content and the activation time before applying restricted-flag, prohibited-rule or
  jurisdiction-profile changes. Contradicting signed statements from different vaults are detected and marked
  conflicted, never ordered by a claimed transaction. The module also holds the vault's trusted-publisher list and
  the pending-statement inbox used by every F18 module. This is not a vote and not a global authority: a proposal
  binds only the vaults and relays that choose to trust that publisher.
responsibilities:
  - Own PolicyProposal: draft, open for comment (default 14 days, minimum 72 hours, expedited minimum 24 hours with reason and a verified co-signature), decision pending, approved, rejected, withdrawn and conflicted.
  - Collect, ingest and display signed member comments (PolicyComment) with relay-side hiding for abuse, up to 5 comments of 2 000 code points per member per proposal, author withdrawal by tombstone and block filtering.
  - Let the decider sign and publish the decision in its own vault, bound to the proposal statement cid and the digest of the approved change; require a decider key delegated in the publisher's authority list and different from the publisher.
  - Provide verification of a decision (governance.policy_proposal.verify) for a named publisher, exact targets, the content digest actually activated and the anchored activation time, within 30 days of the decision.
  - Publish a public changelog of approved proposals and authority-list changes per publisher.
  - Own the vault's trusted-publisher list (scopes taxonomy, rules, profiles, proposals, transparency) and the pending-statement inbox, both changed only by explicit owner actions.
non_responsibilities:
  - Applying the approved change (F18.S01.M01 profiles, F18.S01.M02 rules, F18.S01.M03 categories); they verify the decision and apply it themselves.
  - Voting, reputation-weighted decisions or any claim of global legitimacy.
  - Moderation of listings or users (F12); only comment hiding on the publisher's own relay.
  - Legal review of proposals; content is configuration, not legal advice.
  - Relay receipts (F15.S02.M01), rate limits (F12.S03.M03) and the statement registry (F11.S01.M01); this module uses them.
  - "Future: delegated decider groups with threshold signatures and member polls."
depends_on: [F16.S02.M03, F11.S01.M01, F15.S02.M01, F12.S03.M03, F10.S02.M02, CTR-ID-001, CTR-EVT-001, CTR-ERR-001, CTR-CAP-001, CTR-IDM-001, CTR-PRV-001, CTR-FED-001, CTR-SCH-001, CTR-IOX-001]
user_stories:
  - As a relay operator, I propose adding a prohibited keyword set, give members two weeks to comment, and a colleague whose key I delegated publishes the decision with reasons.
  - As a member, I read open proposals of the relay I use and post a signed comment under my pseudonym, and I can withdraw it later.
  - As a user, I can see the changelog of policy decisions of the publishers I trust and verify they are signed by keys those publishers delegated.
  - As a user, I decide myself which publishers I trust, and packs from anyone else wait in a pending inbox until I apply or refuse them.
edge_cases:
  - Proposer tries to decide their own proposal; GOVERNANCE_PROPOSAL_SELF_DECISION is returned.
  - Comment period is shorter than 72 hours without the expedited flag and a verified co-signature by a co-signer; rejected with GOVERNANCE_PROPOSAL_PERIOD_INVALID.
  - A member posts a sixth comment on one proposal; GOVERNANCE_COMMENT_LIMIT is returned.
  - A comment signature is valid but the key is not registered on the publisher's relay; the relay refuses it under its policy and the member sees the reason.
  - A decision is published twice with different outcomes (equivocation); receivers keep both statements, mark the proposal conflicted for that publisher and refuse to verify either.
  - A consumer activates a change more than 30 days after the decision's anchored time, measured at the activation's relay receipt and not at the receiver's clock; verify returns valid false with reason expired. A vault that applies the same snapshot a year later does not re-verify carried-forward content.
  - Publisher vault is offline when the comment period ends; the anchored end (proposal relay receipt plus the period) still applies in every vault, and the public page labels planned times as claims.
  - The publisher withdraws while the decider, offline, signs an approval; both statements are valid, so every vault that sees both marks the proposal conflicted, verify returns conflicted and a new proposal is required.
  - A publisher backdates openedAt or a decider's clock is set forward; receivers use the relay receipt times, so a decision received 1 hour after the proposal's receipt gives period_not_elapsed.
  - 200 freshly created keys from one /24 network comment on one proposal; at most 25 are accepted under the prefix and new-key caps and the rest get RATE_LIMITED.
  - A pack arrives from a publisher the user does not trust; it waits in the pending inbox for 30 days and is discarded unless the user trusts the publisher or applies it.
ux:
  screens:
    - "Proposals list per publisher: status chips, anchored comment period end, target type; changelog tab of approved decisions and authority-list changes."
    - "Proposal detail: summary, proposed change (structured diff), comments with relay-hidden marker, decision and rationale, signature fingerprints of publisher, co-signer and decider with the text 'a different key, not proof of a different person'."
    - "Operator composer: draft, preview, period selector (72 h to 30 d), expedited switch with reason and co-signer, publish and decide actions with confirmation; authority-list editor."
    - "Trusted publishers: list with fingerprint, scopes, pinned and paused state; Trust dialog shows the fingerprint and requires confirmation; pending inbox with Apply and Refuse."
  states: [loading, empty, draft, awaiting-cosign, open-for-comment, decision-pending, approved, rejected, withdrawn, conflicted, pending-trust, offline-cached]
  a11y:
    - Status is conveyed by text and icon; the comment form has a visible label, character counter announced politely and 44x44 px submit button.
    - Diff view is a table with headers; signature fingerprints are available as text.
    - Dates use Intl.DateTimeFormat with timezone shown, and times from other parties carry the label "claim" or "relay time".
processes:
  domain_schema:
    requirements:
      - "A PolicyProposal records publisher, target type and references, a structured proposed change keyed by target reference (at most 16 KiB), summary, a comment period anchored to a relay receipt, status, decision and changelog entry."
      - "Proposals, decisions, co-signatures and authority lists are public signed statements (P0) and comments are P1 statements visible to members of the hosting relay; every receiving vault verifies them."
      - "Decisions bind the proposal statement cid and the digest of the approved change for exact targets, may activate a target only within 30 days after the decision's anchored time, and are evidence retained under RET-EVIDENCE."
      - "The module owns the vault's trusted-publisher list (TrustedPublisher with scopes taxonomy, rules, profiles, proposals and transparency) and the pending-statement inbox (PendingStatement) used by all F18 modules; both are P3 local records."
      - "A publisher's authority list (classrup.governance.authority_list/v1) names the decider and co-signer keys it delegates to, and each key's listing time is anchored to the relay receipt of the list version that first named it."
    entities:
      - name: PolicyProposal
        schema: classrup.governance.policy_proposal/v1
        storage: relay+device
        privacy: P0
        retention: RET-EVIDENCE
        fields:
          - "id: uuidv7 — primary key"
          - "tenantId: uuidv7 — fixed local-vault tenant (ID-6)"
          - "publisherId: did:key — proposer and origin; canonical owner"
          - "title: string — 3..120 code points"
          - "summary: string — 10..2000 code points, plain text"
          - "targetType: enum — jurisdiction_profile | prohibited_rule | category | platform_policy | other; platform_policy maps to an F12.S02.M03 PolicyRule"
          - "targetRefs: string[] — 1..20 target references: profile code, ruleKey, categoryId or F12 rule id"
          - "proposedChange: object — map targetRef to the canonical change record of the target type (rule content with keywordHashes for sensitive rules, profile governed fields, category restricted/status/mergedInto), <= 16 KiB JCS"
          - "changeDigest: string — sha256- over JCS(proposedChange)"
          - "changelogEntry: string — 10..1000 code points, public"
          - "commentPeriodHours: int — 72..720, default 336; 24..71 only when expedited"
          - "expedited: boolean — default false; requires expeditedReason, coSignerId and a verified co-signature"
          - "expeditedReason?: string — 10..500 code points"
          - "coSignerId?: did:key — one co-signer listed in the publisher's authority list, differs from publisherId"
          - "cosignCid?: string — cid of the verified classrup.governance.policy_cosign/v1 over proposalCid"
          - "status: enum — draft | open_for_comment | decision_pending | approved | rejected | withdrawn | conflicted"
          - "proposalCid?: string — cid of the signed proposal statement; decisions bind it"
          - "openedAt?: timestamp — publisher clock, a claim"
          - "proposalReceipt?: object — classrup.platform.relay_receipt/v1 of the proposal statement {relayId, receivedAt, cid, keyId, sig}; anchors the comment period"
          - "commentEndsAt?: timestamp — proposalReceipt.receivedAt + commentPeriodHours (relay time); before a receipt exists only plannedCommentEndsAt is shown as a claim"
          - "commentCount: int — derived, visible comments"
          - "outcome?: enum — approved | rejected"
          - "rationale?: string — 10..2000 code points"
          - "deciderId?: did:key — signer of the decision, delegated in the authority list, differs from publisherId"
          - "decisionCid?: string — cid of the verified decision statement"
          - "decisionReceipt?: object — relay receipt of the decision statement from the same relay as proposalReceipt"
          - "acknowledgedCommentCids?: string[] — <= 500 comment cids the decider lists as considered"
          - "decidedAt?: timestamp — decider clock, a claim"
          - "validUntil?: timestamp — min(decidedAt claim, decisionReceipt.receivedAt) + 30 d"
          - "withdrawalCid?: string — cid of a verified withdrawal statement"
          - "conflictCids?: string[] — cids of the contradicting statements when status is conflicted"
          - "statementCid?: string — sha256- of the latest signed statement"
          - "revision: int — CTR-ID-001 ID-4; meaningful only in the authoring vault"
          - "createdAt: timestamp — RFC 3339 UTC"
          - "updatedAt: timestamp — RFC 3339 UTC"
        invariants:
          - deciderId differs from publisherId and from coSignerId for approved and rejected outcomes, and was listed in the publisher's authority list at least 14 days before proposalReceipt.receivedAt.
          - status approved or rejected implies rationale, deciderId, decisionCid and a verified decision statement exist; conflicted implies at least two contradicting verified statements in conflictCids.
          - commentPeriodHours >= 72 unless expedited with reason and a verified co-signature; commentEndsAt = proposalReceipt.receivedAt + commentPeriodHours.
          - changeDigest equals sha256-JCS(proposedChange) and every key of proposedChange is in targetRefs.
      - name: PolicyComment
        schema: classrup.governance.policy_comment/v1
        storage: relay+device
        privacy: P1
        retention: RET-STANDARD
        fields:
          - "id: uuidv7 — primary key, generated by the commenter"
          - "tenantId: uuidv7 — fixed local-vault tenant (ID-6)"
          - "proposalId: uuidv7 — ref PolicyProposal"
          - "proposalCid: string — cid of the proposal statement commented on"
          - "authorId: did:key — signer, pseudonymous; classified P1 by F10.S02.M02"
          - "body: string — 1..2000 code points, plain text; classified P1 by F10.S02.M02"
          - "status: enum — visible | hidden | withdrawn"
          - "hiddenReasonKey?: string — i18n key, set by the relay moderator"
          - "statementCid: string — sha256- over JCS of the signed envelope"
          - "relayReceipt?: object — relay-signed acceptance receipt; evidence of that relay only"
          - "relayReceiptAt?: timestamp — relay clock, evidence of that relay only"
          - "tombstoneCid?: string — author-signed classrup.federation.tombstone/v1 when withdrawn"
          - "createdAt: timestamp — commenter clock, a claim"
        invariants:
          - At most 5 visible comments per (proposalId, authorId).
          - Comments are accepted only while relayReceiptAt is before proposalReceipt.receivedAt + commentPeriodHours on the relay that anchored the proposal.
          - A hidden comment keeps its signed statement for audit but is not displayed; a withdrawn comment keeps only its cid, status and tombstone, never its body.
    note: |
      Local records owned here (P3, device only, never transmitted; not catalog entities):
      TrustedPublisher (schema classrup.governance.trusted_publisher/v1, RET-STANDARD) - publisherDid: did:key; fingerprint: string (first 16 base32 characters of sha256 of the key); scopes: (taxonomy | rules | profiles | proposals | transparency)[] 1..5; pinned: boolean - the publisher whose taxonomy and profiles are active for new records, at most one pinned per scope; paused: boolean - new statements go to the pending inbox, applied configuration stays in force; addedVia: user_confirmation | bundled; trustedAt: timestamp. Invariants: at most 10 entries with addedVia user_confirmation plus the release-pinned project publisher (addedVia bundled); an entry is created only by governance.trusted_publisher.add from the trust dialog.
      PendingStatement (schema classrup.governance.pending_statement/v1, RET-SHORT) - id: uuidv7; statementCid; type: statement type; scope; publisherDid; envelope and optional relay receipt; reason: untrusted_publisher | paused_publisher | owner_review | decision_unavailable; ownerModule: F18 module id that applies it; receivedAt; expiresAt = receivedAt + 30 d; status: pending | applied | discarded | refused. Invariants: one pending entry per statementCid; a newer version from the same publisher and target supersedes and discards the older pending entry.
      AuthorityList mirror rows store each verified classrup.governance.authority_list/v1 {publisherId, version, entries [{key: did:key, role: decider | cosigner, firstListedReceiptAt}], createdAt claim, receipt} (P0, RET-EVIDENCE).
    sql: |
      CREATE TABLE governance_policy_proposal (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, publisher_id TEXT NOT NULL, proposal_cid TEXT, status TEXT NOT NULL,
        target_type TEXT NOT NULL, comment_ends_at TEXT, revision INTEGER NOT NULL, data TEXT NOT NULL);
      CREATE INDEX governance_policy_proposal_status ON governance_policy_proposal(tenant_id, publisher_id, status);
      CREATE UNIQUE INDEX governance_policy_proposal_cid ON governance_policy_proposal(tenant_id, proposal_cid);
      CREATE TABLE governance_policy_comment (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, proposal_id TEXT NOT NULL, author_id TEXT NOT NULL,
        status TEXT NOT NULL, data TEXT NOT NULL);
      CREATE INDEX governance_policy_comment_proposal ON governance_policy_comment(tenant_id, proposal_id, status);
      CREATE TABLE governance_authority_list (
        tenant_id TEXT NOT NULL, publisher_id TEXT NOT NULL, version INTEGER NOT NULL, statement_cid TEXT NOT NULL, data TEXT NOT NULL,
        PRIMARY KEY (tenant_id, publisher_id, version));
      CREATE TABLE governance_trusted_publisher (
        tenant_id TEXT NOT NULL, publisher_did TEXT NOT NULL, data TEXT NOT NULL, PRIMARY KEY (tenant_id, publisher_did));
      CREATE TABLE governance_pending_statement (
        id TEXT PRIMARY KEY, tenant_id TEXT NOT NULL, statement_cid TEXT NOT NULL, publisher_did TEXT NOT NULL, status TEXT NOT NULL,
        expires_at TEXT NOT NULL, data TEXT NOT NULL);
      CREATE UNIQUE INDEX governance_pending_statement_cid ON governance_pending_statement(tenant_id, statement_cid);
  validation_rules:
    requirements:
      - "Proposals are validated for length, target references, comment period and signer roles before publication."
      - "Comments and decisions are validated against the proposal state and signer keys on the relay and again in every receiving vault."
      - "Every violation maps to one stable error code."
      - "Receivers enforce the comment period from relay receipts, never from publisher or decider timestamps, and verify that the activated content equals the approved content."
    rules:
      - "V01 | title 3..120, summary 10..2000, changelogEntry 10..1000 code points, plain text | VALIDATION_FAILED"
      - "V02 | targetRefs 1..20, proposedChange <= 16 KiB JCS, keyed only by targetRefs and matching the targetType change schema, changeDigest = sha256-JCS(proposedChange) | VALIDATION_FAILED"
      - "V03 | commentPeriodHours 72..720, or 24..71 only with expedited true, expeditedReason, one coSignerId distinct from publisherId and a verified policy_cosign statement over the proposal cid | GOVERNANCE_PROPOSAL_PERIOD_INVALID"
      - "V04 | decider key differs from the proposer key and from publisherId, appears with role decider in the publisher's latest verified authority list anchored no later than decidedAt, and was first listed at least 14 days before the proposal's relay receipt | GOVERNANCE_PROPOSAL_SELF_DECISION"
      - "V05 | decide only when the decider vault's verified proposal mirror is decision_pending (anchored comment end passed) and the decision binds that proposal's statement cid | CONFLICT_STATE"
      - "V06 | comment body 1..2000 code points; author has fewer than 5 visible comments on the proposal | GOVERNANCE_COMMENT_LIMIT"
      - "V07 | comment relay receipt time is before proposal relay receipt + commentPeriodHours on the anchoring relay | EXPIRED"
      - "V08 | every statement signature verifies and the author matches the registered signer role (publisher principal, delegated decider or co-signer, comment author) | VALIDATION_FAILED"
      - "V09 | publisher has fewer than 20 proposals in draft, open_for_comment or decision_pending | GOVERNANCE_PROPOSAL_LIMIT"
      - "V10 | verify: targetRefs are a subset of the decision's targetRefs, decision publisherId equals the caller's artifact publisherId, changeDigest equals sha256-JCS of proposedChange restricted to those targetRefs, decision anchor <= asOf <= validUntil, and the decision is not in priorDecisionCids | GOVERNANCE_PROPOSAL_NOT_VALID"
      - "V11 | receiver period check: openedAt >= proposal relay receipt time - 10 min, and the decision's relay receipt from the same relay is at least proposal receipt + commentPeriodHours; a decision without a verifiable receipt cannot prove the period and verify returns period_not_elapsed | GOVERNANCE_PROPOSAL_NOT_VALID"
      - "V12 | authority list version greater than the stored version, 1..10 distinct entries with role decider or cosigner, no entry equal to publisherId, signed by the publisher principal | GOVERNANCE_AUTHORITY_LIST_INVALID"
      - "V13 | policy_cosign signed by coSignerId over the exact proposal cid, coSignerId listed with role cosigner or decider and different from publisherId and from the later deciderId | GOVERNANCE_PROPOSAL_PERIOD_INVALID"
      - "V14 | trusted_publisher.add only from the owner's trust dialog: fingerprintConfirmed equals the computed fingerprint, scopes non-empty, and at most 10 user-added publishers; sync ingestion and internal callers are refused | GOVERNANCE_TRUST_LIMIT"
      - "V15 | comment relay intake through RateLimitPort (F12.S03.M03): 10 per hour per key, 30 per 24 h per /24 (IPv4) or /48 (IPv6) prefix; keys registered on the relay less than 7 days ago at most 1 comment each and 25 per proposal (F12.S03.M04 limits check, N18) | RATE_LIMITED"
      - "V16 | a comment withdrawal is a classrup.federation.tombstone/v1 signed by the comment's author principal for the comment cid | FORBIDDEN"
  workflow_state_machine:
    requirements:
      - "PolicyProposal follows the declared machine; conflicted is terminal, and approved, rejected and withdrawn are final for their signers and change only to conflicted when a validly signed contradicting statement is verified."
      - "The comment period starts at the relay-signed receipt of the proposal statement and ends commentPeriodHours later on that relay's clock; publisher and decider timestamps are claims and are shown as such."
      - "A decision cannot be reversed; a new proposal is required to change policy again."
      - "Vaults other than the authoring vault move their mirror only on verified received statements, and a verified withdrawal plus a verified decision, or two verified decisions with different outcomes, for the same proposal cid make it conflicted in every vault that sees both."
      - "PendingStatement follows its own machine: pending items are applied when the publisher becomes trusted for the scope or the owner applies them, and are discarded after 30 days or refused by the owner."
    machines:
      - entity: PolicyProposal
        initial: draft
        terminal: [conflicted]
        transitions:
          - "draft -> open_for_comment | governance.policy_proposal.open by publisher | statement classrup.governance.policy_proposal/v1 signed and queued (prepared); expedited requires a verified policy_cosign; emits governance.policy_proposal.opened"
          - "draft -> withdrawn | discard by publisher | local only, nothing was published"
          - "open_for_comment -> decision_pending | anchored comment end passed (proposal relay receipt + commentPeriodHours) | sweep every 60 s in any open vault holding the mirror and at start; no statement"
          - "open_for_comment -> withdrawn | governance.policy_proposal.withdraw by publisher, or receive of a verified withdrawal | publisher vault queues the signed withdrawal; other vaults record withdrawalCid"
          - "open_for_comment -> approved | receive of a verified approved decision whose relay receipt passes V11 while the local sweep has not run | emits governance.policy_proposal.decided"
          - "open_for_comment -> rejected | receive of a verified rejected decision whose relay receipt passes V11 | emits governance.policy_proposal.decided"
          - "decision_pending -> approved | governance.policy_proposal.decide in the decider vault, or receive of a verified approved decision | decision statement signed or recorded; emits governance.policy_proposal.decided"
          - "decision_pending -> rejected | decide with outcome rejected, or receive of a verified rejected decision | emits governance.policy_proposal.decided"
          - "decision_pending -> withdrawn | withdraw by publisher, 60 days after the anchored comment end without a verified decision in the publisher vault, or receive of a verified withdrawal | publisher vault queues the signed withdrawal"
          - "approved -> conflicted | receive of a verified withdrawal, or of a verified decision with another outcome or changeDigest, for the same proposal cid | conflictCids recorded; verify returns conflicted; emits governance.policy_proposal.decided with outcome conflicted"
          - "rejected -> conflicted | receive of a verified withdrawal or a verified approved decision for the same proposal cid | conflictCids recorded; emits governance.policy_proposal.decided with outcome conflicted"
          - "withdrawn -> conflicted | receive of a verified decision for the same proposal cid | conflictCids recorded; emits governance.policy_proposal.decided with outcome conflicted"
      - entity: PendingStatement
        initial: pending
        terminal: [applied, discarded, refused]
        transitions:
          - "pending -> applied | governance.trusted_publisher.add or resume for the publisher and scope (reasons untrusted_publisher, paused_publisher), governance.pending_statement.apply by the owner (reason owner_review), or the cited decision becomes available (reason decision_unavailable) | the owning module's apply succeeds through PendingApplyPort; otherwise the entry stays pending with the new reason"
          - "pending -> refused | governance.pending_statement.refuse by the owner | envelope kept 30 days as refused history; nothing applied"
          - "pending -> discarded | 30 days after receivedAt, or a newer version from the same publisher and target arrives | envelope deleted"
    timeouts:
      - "open_for_comment moves to decision_pending at the anchored commentEndsAt (sweep every 60 s while a vault is open, and at start)."
      - "decision_pending becomes withdrawn in the publisher vault 60 days after the anchored comment end without a verified decision; a decision signed in parallel elsewhere then makes the proposal conflicted."
      - "An approved decision may activate a target only while asOf (the activation's anchored time) is at most validUntil = decision anchor + 30 days; it never expires for content already activated within the window."
      - "A PendingStatement is discarded 30 days after receivedAt (sweep at start and every 6 h)."
  commands_queries_events:
    requirements:
      - "Publisher commands (draft, request_cosign, open, withdraw, authority_list draft and release) run in the publisher's vault, decide runs in the decider's own vault and cosign in the co-signer's vault; every command that signs a statement takes relayIds[] and returns syncState prepared."
      - "post_comment and withdraw_comment are vault commands in the member's vault producing classrup.governance.policy_comment/v1 and an author-signed classrup.federation.tombstone/v1; accept, relay_withdraw and hide are relay commands and relay_list is a relay query on the publisher's relay; vaults ingest comments only through governance.policy_comment.receive."
      - "receive is a vault command in any vault that verifies and stores proposal, decision, withdrawal and co-sign statements from trusted publishers; verify is a pure query used by F18.S01.* and F18.S02.M02 that checks publisher, content digest, anchored period and validity at the activation time asOf."
      - "governance.policy_proposal.decided carries the approved proposedChange (or its cid when larger than 16 KiB), proposalStatementCid, decisionCid and changeDigest, so consumers such as F12.S02.M03 need no second lookup; targetType platform_policy maps to an F12 PolicyRule."
      - "Trusted publishers and pending statements change only through explicit owner commands (trusted_publisher add, remove, pause and resume; pending_statement apply and refuse); sync ingestion can never add trust, and other F18 modules hold untrusted statements through pending_statement.hold."
      - "Every statement type of this module is registered in the F11.S01.M01 statement registry with audience, signer role, role resolution and maxAge (N2), and the vault acts only on statements its receiving path accepted."
    commands:
      - name: governance.policy_proposal.draft
        capability: governance.policy_proposal.author
        input: "[vault-local, publisher] { proposalId?, expectedRevision?, title, summary, targetType, targetRefs, proposedChange, changelogEntry, commentPeriodHours?, expedited?, expeditedReason?, coSignerId? }"
        output: "{ proposalId, revision, changeDigest, status: draft }"
        errors: [VALIDATION_FAILED, NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, GOVERNANCE_PROPOSAL_PERIOD_INVALID, GOVERNANCE_PROPOSAL_LIMIT]
        emits: []
        idempotent: true
      - name: governance.policy_proposal.request_cosign
        capability: governance.policy_proposal.publish
        input: "[vault-local, publisher + statement classrup.governance.policy_proposal/v1 sealed to the co-signer's mailbox] { proposalId, expectedRevision }"
        output: "{ proposalId, revision, proposalCid, status: draft, syncState: prepared }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, GOVERNANCE_PROPOSAL_PERIOD_INVALID]
        emits: []
        idempotent: true
      - name: governance.policy_proposal.cosign
        capability: governance.policy_proposal.cosign
        input: "[vault-local, co-signer + statement classrup.governance.policy_cosign/v1] { proposalCid, relayIds[] }"
        output: "{ proposalCid, cosignCid, syncState: prepared }"
        errors: [NOT_FOUND, VALIDATION_FAILED, GOVERNANCE_PROPOSAL_SELF_DECISION, GOVERNANCE_PROPOSAL_PERIOD_INVALID]
        emits: []
        idempotent: true
      - name: governance.policy_proposal.open
        capability: governance.policy_proposal.publish
        input: "[vault-local, publisher + statement classrup.governance.policy_proposal/v1] { proposalId, expectedRevision, relayIds[] }"
        output: "{ proposalId, revision, proposalCid, plannedCommentEndsAt (claim), statementCid, syncState: prepared }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE, GOVERNANCE_PROPOSAL_PERIOD_INVALID]
        emits: [governance.policy_proposal.opened]
        idempotent: true
      - name: governance.policy_proposal.decide
        capability: governance.policy_proposal.decide
        input: "[vault-local, decider + statement classrup.governance.policy_decision/v1 { proposalId, proposalCid, publisherId, outcome, rationale, targetType, targetRefs, changeDigest, proposalReceipt, acknowledgedCommentCids, decidedAt }] { proposalCid, outcome: approved|rejected, rationale, acknowledgedCommentCids? (<= 500), relayIds[] }"
        output: "{ proposalId, status, decisionCid, statementCid, validUntil (claim until the decision receipt exists), syncState: prepared }"
        errors: [NOT_FOUND, CONFLICT_STATE, VALIDATION_FAILED, GOVERNANCE_PROPOSAL_SELF_DECISION]
        emits: [governance.policy_proposal.decided]
        idempotent: true
      - name: governance.policy_proposal.withdraw
        capability: governance.policy_proposal.publish
        input: "[vault-local, publisher + statement classrup.governance.policy_withdrawal/v1 { proposalId, proposalCid, reason }] { proposalId, expectedRevision, relayIds[] }"
        output: "{ proposalId, revision, statementCid, syncState: prepared }"
        errors: [NOT_FOUND, CONFLICT_REVISION, CONFLICT_STATE]
        emits: []
        idempotent: true
      - name: governance.policy_proposal.receive
        capability: governance.policy_proposal.receive
        input: "[vault-local, inbound statement] { envelope, receipt?, provenance } for policy_proposal, policy_decision, policy_withdrawal and policy_cosign"
        output: "{ proposalId?, accepted: boolean, status?, quarantineReason?, pendingId?, conflicted?: boolean }"
        errors: [VALIDATION_FAILED, UNSUPPORTED_SCHEMA_VERSION, GOVERNANCE_PROPOSAL_SELF_DECISION, GOVERNANCE_PROPOSAL_NOT_VALID]
        emits: [governance.policy_proposal.decided]
        idempotent: true
      - name: governance.policy_proposal.relay_upload
        capability: governance.policy_proposal.relay_publish
        input: "[relay command] { envelope } for policy_proposal, policy_decision, policy_withdrawal, policy_cosign and authority_list statements"
        output: "{ statementCid, relayReceipt: classrup.platform.relay_receipt/v1 }"
        errors: [VALIDATION_FAILED, FORBIDDEN, PAYLOAD_TOO_LARGE, RATE_LIMITED, GOVERNANCE_PROPOSAL_SELF_DECISION]
        emits: [governance.policy_proposal.decided]
        idempotent: true
      - name: governance.authority_list.draft
        capability: governance.authority_list.author
        input: "[vault-local, publisher] { entries: [{ key: did:key, role: decider|cosigner }] (1..10), expectedVersion }"
        output: "{ version, entries, status: draft }"
        errors: [VALIDATION_FAILED, CONFLICT_REVISION, GOVERNANCE_AUTHORITY_LIST_INVALID]
        emits: []
        idempotent: true
      - name: governance.authority_list.release
        capability: governance.authority_list.author
        input: "[vault-local, publisher + statement classrup.governance.authority_list/v1] { expectedVersion, relayIds[] }"
        output: "{ version, statementCid, syncState: prepared }"
        errors: [NOT_FOUND, CONFLICT_REVISION, GOVERNANCE_AUTHORITY_LIST_INVALID]
        emits: []
        idempotent: true
      - name: governance.authority_list.receive
        capability: governance.authority_list.apply
        input: "[vault-local, inbound statement] { envelope, receipt?, provenance }"
        output: "{ publisherId, version?, stored: boolean, pendingId? }"
        errors: [VALIDATION_FAILED, UNSUPPORTED_SCHEMA_VERSION, GOVERNANCE_AUTHORITY_LIST_INVALID]
        emits: []
        idempotent: true
      - name: governance.policy_comment.post
        capability: governance.policy_comment.create
        input: "[vault-local + statement classrup.governance.policy_comment/v1] { proposalCid, body, relayId }"
        output: "{ commentId, statementCid, syncState: prepared }"
        errors: [VALIDATION_FAILED, NOT_FOUND, EXPIRED, GOVERNANCE_COMMENT_LIMIT, RATE_LIMITED]
        emits: []
        idempotent: true
      - name: governance.policy_comment.withdraw
        capability: governance.policy_comment.withdraw
        input: "[vault-local, author + statement classrup.federation.tombstone/v1 { target: comment cid, reason: author_withdrawal }] { commentId, relayIds[] }"
        output: "{ commentId, status: withdrawn, tombstoneCid, syncState: prepared }"
        errors: [NOT_FOUND, CONFLICT_STATE, FORBIDDEN]
        emits: []
        idempotent: true
      - name: governance.policy_comment.receive
        capability: governance.policy_comment.receive
        input: "[vault-local, inbound statement] { envelope (policy_comment or its tombstone), receipt?, provenance }"
        output: "{ commentId?, stored: boolean, removed?: boolean }"
        errors: [VALIDATION_FAILED, UNSUPPORTED_SCHEMA_VERSION, EXPIRED]
        emits: []
        idempotent: true
      - name: governance.policy_comment.accept
        capability: governance.policy_comment.relay_accept
        input: "[relay command] { envelope }"
        output: "{ commentId, relayReceipt: classrup.platform.relay_receipt/v1 meaning accepted for hosting by this relay }"
        errors: [VALIDATION_FAILED, EXPIRED, GOVERNANCE_COMMENT_LIMIT, RATE_LIMITED, FORBIDDEN]
        emits: []
        idempotent: true
      - name: governance.policy_comment.relay_withdraw
        capability: governance.policy_comment.relay_tombstone
        input: "[relay command] { tombstoneEnvelope }"
        output: "{ commentCid, removed: true, relayReceipt }"
        errors: [VALIDATION_FAILED, NOT_FOUND, FORBIDDEN]
        emits: []
        idempotent: true
      - name: governance.policy_comment.hide
        capability: governance.policy_comment.relay_hide
        input: "[relay command] { commentId, reasonKey }"
        output: "{ commentId, status: hidden }"
        errors: [NOT_FOUND, FORBIDDEN]
        emits: []
        idempotent: true
      - name: governance.trusted_publisher.add
        capability: governance.trusted_publisher.manage
        input: "[vault-local, owner trust dialog only] { publisherDid, scopes: (taxonomy|rules|profiles|proposals|transparency)[], fingerprintConfirmed, pinned? }"
        output: "{ publisherDid, scopes, trustedAt, releasedPendingCount }"
        errors: [VALIDATION_FAILED, FORBIDDEN, GOVERNANCE_TRUST_LIMIT]
        emits: []
        idempotent: true
      - name: governance.trusted_publisher.remove
        capability: governance.trusted_publisher.manage
        input: "[vault-local, owner] { publisherDid, scopes? }"
        output: "{ publisherDid, remainingScopes }"
        errors: [NOT_FOUND, FORBIDDEN]
        emits: []
        idempotent: true
      - name: governance.trusted_publisher.pause
        capability: governance.trusted_publisher.manage
        input: "[vault-local, owner] { publisherDid }"
        output: "{ publisherDid, paused: true }"
        errors: [NOT_FOUND]
        emits: []
        idempotent: true
      - name: governance.trusted_publisher.resume
        capability: governance.trusted_publisher.manage
        input: "[vault-local, owner] { publisherDid }"
        output: "{ publisherDid, paused: false, releasedPendingCount }"
        errors: [NOT_FOUND]
        emits: []
        idempotent: true
      - name: governance.pending_statement.hold
        capability: governance.pending_statement.hold
        input: "[vault-local, internal: F18.S01.M01, F18.S01.M02, F18.S01.M03, F18.S02.M02] { envelope, receipt?, scope, publisherDid, reason, ownerModule }"
        output: "{ pendingId, expiresAt }"
        errors: [VALIDATION_FAILED, RATE_LIMITED]
        emits: []
        idempotent: true
      - name: governance.pending_statement.apply
        capability: governance.pending_statement.manage
        input: "[vault-local, owner] { pendingId }"
        output: "{ pendingId, status: applied|pending, ownerModuleResult }"
        errors: [NOT_FOUND, CONFLICT_STATE, EXPIRED]
        emits: []
        idempotent: true
      - name: governance.pending_statement.refuse
        capability: governance.pending_statement.manage
        input: "[vault-local, owner] { pendingId }"
        output: "{ pendingId, status: refused }"
        errors: [NOT_FOUND, CONFLICT_STATE]
        emits: []
        idempotent: true
    queries:
      - name: governance.policy_proposal.get
        capability: governance.policy_proposal.read
        input: "{ proposalId | proposalCid }"
        output: "{ proposal: PolicyProposal, decision?, withdrawal?, cosign? }"
        errors: [NOT_FOUND]
      - name: governance.policy_proposal.list
        capability: governance.policy_proposal.read
        input: "{ publisherId?, status?, cursor?, limit <= 50 }"
        output: "{ items: PolicyProposal[], nextCursor? }"
        errors: [VALIDATION_FAILED]
      - name: governance.policy_proposal.changelog
        capability: governance.policy_proposal.read
        input: "{ publisherId?, targetType?, cursor?, limit <= 50 }"
        output: "{ items: [{ kind: decision|authority_list, proposalId?, changelogEntry?, decidedAt?, targetType?, targetRefs?, authorityListVersion?, addedKeys?, removedKeys? }], nextCursor? }"
        errors: [VALIDATION_FAILED]
      - name: governance.policy_proposal.verify
        capability: governance.policy_proposal.verify
        input: "{ proposalId, publisherId, targetType, targetRefs, changeDigest, asOf, asOfSource: relay_receipt|publisher_claim, priorDecisionCids? }"
        output: "{ valid: boolean, reason?: not_approved|expired|target_mismatch|untrusted_publisher|conflicted|publisher_mismatch|content_mismatch|period_not_elapsed|decider_unauthorized|already_used|decision_unavailable, decisionCid?, validUntil?, asOfIsClaim: boolean }"
        errors: [NOT_FOUND, GOVERNANCE_PROPOSAL_NOT_VALID]
      - name: governance.policy_proposal.relay_get
        capability: governance.policy_proposal.relay_read
        input: "[relay query] { proposalId? | statementCid? | publisherId + kind: authority_list }"
        output: "{ items: [{ envelope, receipt }] }"
        errors: [NOT_FOUND, RATE_LIMITED]
      - name: governance.policy_comment.list
        capability: governance.policy_proposal.read
        input: "{ proposalId, cursor?, limit <= 100 }"
        output: "{ items: PolicyComment[] (visible, authors passed through filterBlocked), nextCursor? }"
        errors: [NOT_FOUND]
      - name: governance.policy_comment.relay_list
        capability: governance.policy_comment.relay_list
        input: "[relay query] { proposalCid, since?, cursor?, limit <= 100 }"
        output: "{ items: [{ envelope, receipt, status }], tombstones: [{ commentCid, tombstoneCid }], nextCursor? }"
        errors: [NOT_FOUND, UNAUTHENTICATED, RATE_LIMITED]
      - name: governance.trusted_publisher.list
        capability: governance.trusted_publisher.read
        input: "{ scope? }"
        output: "{ items: TrustedPublisher[] }"
        errors: [VALIDATION_FAILED]
      - name: governance.trusted_publisher.check
        capability: governance.trusted_publisher.read
        input: "{ publisherDid, scope }"
        output: "{ trusted: boolean, paused: boolean, pinned: boolean, fingerprint }"
        errors: [VALIDATION_FAILED]
      - name: governance.pending_statement.list
        capability: governance.pending_statement.manage
        input: "{ scope?, status?, cursor?, limit <= 50 }"
        output: "{ items: PendingStatement[] (with diff summary from the owning module), nextCursor? }"
        errors: [VALIDATION_FAILED]
    events_produced:
      - {type: governance.policy_proposal.decided, privacy: P0, payload: "{ proposalId, publisherId, deciderId, outcome: approved|rejected|conflicted, targetType, targetRefs, proposedChange? (<= 16 KiB) or proposedChangeCid, changeDigest, proposalStatementCid, decisionCid, changelogEntry, validUntil, scope: vault|relay } — vault-local in each receiving vault; relay-local (scope relay) when the hosting relay stores a verified decision through relay_upload"}
      - {type: governance.policy_proposal.opened, privacy: P0, payload: "{ proposalId, publisherId, targetType, proposalStatementCid, plannedCommentEndsAt, commentEndsAt? (anchored, once the receipt is known) }"}
    events_consumed:
      - {type: privacy.deletion.requested, effect: "reversible only (N6a): pause posting new comments and hide unsent comment drafts of the deleting principal; nothing is signed and no relay is called"}
      - {type: privacy.deletion.cancelled, effect: "undo the pause and unhide the drafts paused by privacy.deletion.requested"}
    errors:
      - "GOVERNANCE_PROPOSAL_PERIOD_INVALID | 422 | no | comment period outside 72 to 720 hours without a valid expedited justification and verified co-signature"
      - "GOVERNANCE_PROPOSAL_SELF_DECISION | 403 | no | decider or co-signer key equals the proposer key or is not delegated in the publisher's authority list early enough"
      - "GOVERNANCE_PROPOSAL_LIMIT | 409 | no | publisher already has 20 active proposals"
      - "GOVERNANCE_PROPOSAL_NOT_VALID | 412 | no | decision is missing, expired at the activation time, for other targets, publisher or content, conflicted, not anchored or from an untrusted publisher"
      - "GOVERNANCE_COMMENT_LIMIT | 409 | no | member already has 5 visible comments on this proposal"
      - "GOVERNANCE_AUTHORITY_LIST_INVALID | 422 | no | authority list version, entries or signer invalid"
      - "GOVERNANCE_TRUST_LIMIT | 409 | no | trust change not confirmed in the owner's trust dialog or the vault already trusts 10 publishers"
    note: |
      Statements and signer roles (N2, registered in F11.S01.M01; role resolution "principal" means author is the principal and ext.signerKey is active in its portable document per F07.S02.M01 key_status at first sight):
      | Type | Audience | Signer role (resolution) | maxAge |
      |---|---|---|---|
      | classrup.governance.policy_proposal/v1 | public | publisher (principal, author = payload.publisherId) | none (evidence for active configuration) |
      | classrup.governance.policy_decision/v1 | public | delegated decider (roleResolution "delegated by publisher authority_list": author is listed with role decider in the publisher's latest verified authority list anchored no later than decidedAt and first listed >= 14 d before the proposal receipt; author differs from payload.publisherId) | none |
      | classrup.governance.policy_withdrawal/v1 | public | publisher (principal) | none |
      | classrup.governance.policy_cosign/v1 | public | delegated co-signer (roleResolution "delegated by publisher authority_list", role cosigner or decider, author = proposal coSignerId, differs from publisherId) | 60 d |
      | classrup.governance.authority_list/v1 | public | publisher (principal) | none |
      | classrup.governance.policy_comment/v1 | community (members of the hosting relay) | comment author (principal) | 45 d |
      | classrup.federation.tombstone/v1 (comment withdrawal, format owned by F11.S01.M02) | audience of the target | target author (principal) | none |
      Ports provided: PendingApplyPort registry (F18.S01.M01, F18.S01.M02, F18.S01.M03 and F18.S02.M02 register apply(envelope, receipt, { ownerConfirmed }) for their statement types) and TrustPort.check(publisherDid, scope). Ports used: ReceiptPort verification (F15.S02.M01), RateLimitPort.consume (F12.S03.M03), field classification (F10.S02.M02). Injected at the vault or relay composition root and not listed in depends_on because each already reaches this module through F10.S01.M02 -> F18.S01.M01 (FLG-2 acyclic graph): KeyStatusPort of F07.S02.M01 (applied by the F11 intake path), filterBlocked of F07.S02.M02 (N7), the F10.S01.M03 ExportSectionPort, F10.S01.M04 DeletionPort and F10.S01.M02 RetentionPurgePort registries (N6, N6a), and the F12.S03.M04 limits check run by the relay bus (N18).
    example: |
      publisher vault: dispatch("governance.policy_proposal.open", { "proposalId": "0192f3b2-...", "expectedRevision": 3, "relayIds": ["relay:berlin.example"] })
      => { "proposalId": "0192f3b2-...", "revision": 4, "proposalCid": "sha256-Pr0p...", "plannedCommentEndsAt": "2026-11-18T10:00:00.000Z", "statementCid": "sha256-Pr0p...", "syncState": "prepared" }
      relay receipt for the proposal: receivedAt 2026-11-04T10:02:11Z, so the anchored commentEndsAt is 2026-11-18T10:02:11Z
      member vault: dispatch("governance.policy_comment.post", { "proposalCid": "sha256-Pr0p...", "body": "Please add an appeal path.", "relayId": "relay:berlin.example" })
      => { "commentId": "0192f3b3-...", "statementCid": "sha256-C0mm...", "syncState": "prepared" } then transport_acknowledged ("accepted for hosting by relay:berlin.example")
      decider vault: dispatch("governance.policy_proposal.decide", { "proposalCid": "sha256-Pr0p...", "outcome": "approved", "rationale": "Comments addressed in v2.", "acknowledgedCommentCids": ["sha256-C0mm..."], "relayIds": ["relay:berlin.example"] })
      => { "proposalId": "0192f3b2-...", "status": "approved", "decisionCid": "sha256-Yg1b...", "statementCid": "sha256-Yg1b...", "validUntil": "2026-12-19T10:00:00.000Z", "syncState": "prepared" }
      query governance.policy_proposal.verify { "proposalId": "0192f3b2-...", "publisherId": "did:key:z6MkP...", "targetType": "prohibited_rule", "targetRefs": ["counterfeit_goods"], "changeDigest": "sha256-Q2hn...", "asOf": "2026-11-20T08:00:00Z", "asOfSource": "relay_receipt" }
      => { "valid": true, "decisionCid": "sha256-Yg1b...", "validUntil": "2026-12-19T10:03:40.000Z", "asOfIsClaim": false }
  authorization_capabilities:
    requirements:
      - "Vault policy: authoring and publishing require the publisher key; deciding and co-signing require a key delegated in the publisher's verified authority list and different from the publisher; commenting requires any local principal; receiving verifies signer roles (CAP-8)."
      - "Relay policy (CAP-9): the publisher's relay accepts comments from registered device keys within its quota, serves comments only to holders of a valid relay access token (CAP-8, CAP-10) because they are P1, honours author tombstones and lets its own moderator hide comments; a relay role has no power over other relays or vaults."
      - "There is no global governance role; trust is per publisher and chosen by each user."
      - "A delegated decider or co-signer shows that a different key acted, not that a different person did; the UI, threat model and changelog say so."
    capabilities:
      - "governance.policy_proposal.author | owner | local principal holds the publisher key; proposal status draft"
      - "governance.policy_proposal.publish | owner | local principal is the proposal publisher; status draft, open_for_comment or decision_pending; signing key unrevoked"
      - "governance.policy_proposal.cosign | owner | local principal is the proposal's coSignerId and is listed with role cosigner or decider in the publisher's verified authority list; differs from publisherId"
      - "governance.policy_proposal.decide | owner | local principal is listed with role decider in the publisher's verified authority list at least 14 days before the proposal receipt and differs from publisherId and coSignerId; verified mirror status decision_pending"
      - "governance.policy_proposal.receive | peer | statement signed by the registered role for its type (publisher, delegated decider or co-signer); signature, key status and role verified"
      - "governance.policy_proposal.read | owner | vault unlocked; reads proposals from trusted publishers and public changelog"
      - "governance.policy_proposal.verify | system | caller is F18.S01.M01, F18.S01.M02, F18.S01.M03 or F18.S02.M02 inside the vault or relay"
      - "governance.policy_proposal.relay_publish | relay-member | relay policy: request signed by the statement author's device key; publisher is this relay's operator key or the author is delegated in that operator's verified authority list; 50 uploads per day per key"
      - "governance.policy_proposal.relay_read | relay-anonymous | relay policy: public read of proposals, decisions, co-signatures and authority lists with their receipts; 60 requests per minute per IP prefix"
      - "governance.authority_list.author | owner | local principal holds the publisher key; signing key unrevoked"
      - "governance.authority_list.apply | owner | vault unlocked; statement signed by the publisher principal"
      - "governance.policy_comment.create | owner | vault unlocked; proposal open_for_comment by the anchored period; fewer than 5 visible comments"
      - "governance.policy_comment.withdraw | owner | local principal is the comment author"
      - "governance.policy_comment.receive | owner | vault unlocked; comment authors filtered through filterBlocked and dropped silently when blocked (N7)"
      - "governance.policy_comment.relay_accept | relay-member | relay policy: request signed by a registered device key; RateLimitPort per key and per /24 or /48 prefix and the new-key cap of V15"
      - "governance.policy_comment.relay_tombstone | relay-member | relay policy: tombstone signed by the comment's author principal (FED-9)"
      - "governance.policy_comment.relay_hide | relay-moderator | relay policy: moderator of the publisher's relay; reason key required; affects only that relay"
      - "governance.policy_comment.relay_list | relay-member | relay policy: valid relay access token from challenge-response (CAP-8, CAP-10); anonymous requests refused; 60 requests per minute per key"
      - "governance.trusted_publisher.manage | owner | vault unlocked; add only from the owner's trust dialog with the confirmed fingerprint; internal callers and sync ingestion denied"
      - "governance.trusted_publisher.read | owner | vault unlocked; internal callers F18.S01.M01, F18.S01.M02, F18.S01.M03 and F18.S02.M02"
      - "governance.pending_statement.manage | owner | vault unlocked; owner action from the pending inbox"
      - "governance.pending_statement.hold | system | internal callers F18.S01.M01, F18.S01.M02, F18.S01.M03 and F18.S02.M02 on the inbound path"
  failure_recovery_idempotency:
    requirements:
      - "All commands are idempotent per CTR-IDM-001 and statements are deduplicated by cid."
      - "State change, signed statement and outbox entry commit in one IndexedDB transaction of the signing vault only; transport is retried separately and no guarantee spans two vaults."
      - "Contradicting signed statements (two decisions with different outcomes or content, or a decision and a withdrawal, for one proposal cid) are detected in any receiving vault, marked conflicted and never resolved by last writer or by timestamps."
      - "Comment delivery states follow IDM-7: the relay's signed acceptance is transport_acknowledged and labelled 'accepted for hosting by relay R', and peer_accepted is shown only when a verified decision by the publisher's delegated decider lists the comment cid in acknowledgedCommentCids."
    idempotency: "Idempotency-Key required on commands, kept 24 h; relay accept and relay_upload deduplicate by statement cid; verify and receive are naturally idempotent; trusted_publisher.add for an already trusted publisher and scope set returns the stored entry."
    concurrency: "expectedRevision applies only in the authoring vault (draft, request_cosign, open, withdraw, authority_list draft and release); decide binds the proposal statement cid instead of a revision. A decision and a withdrawal are signed in different vaults and nothing orders them (ADR-0016 §5): any vault that verifies both, in either order, marks the proposal conflicted, verify returns conflicted and the publisher must open a new proposal. Two decisions with different outcomes are handled the same way."
    retries: "Transport retries follow IDM-4 (base 500 ms, cap 30 s, 6 attempts); comment posting retries only network errors and RATE_LIMITED after retryAfterMs; a decision whose receipt cannot be fetched is retried by fetching relay_get, and verify returns decision_unavailable until then."
    offline: "Drafting, deciding, co-signing and posting a comment can be prepared offline; each signed statement stays prepared until a relay receipt exists (transport_acknowledged), and a proposal's anchored comment period starts only at that receipt."
    partial_failure: "A failed relay upload leaves the local state committed and retries; a relay refusing a comment returns a signed refusal reason and the comment stays local with state relay_rejected; a pending statement whose owner module rejects it on apply stays pending with the new reason."
  privacy_retention_abuse:
    requirements:
      - "Proposals and decisions are public signed statements; comments are visible to the relay's community and are linkable to pseudonyms; the UI says pseudonymity is not anonymity."
      - "Decisions and proposals are retained as evidence (RET-EVIDENCE); comments follow RET-STANDARD and hidden comments keep their signed statement for audit."
      - "No comment or proposal content is sent through notification channels beyond a reference and a template key."
      - "PolicyComment is user content: the module registers ExportSectionPort, DeletionPort and RetentionPurgePort, classifies comment fields through F10.S02.M02, signs comment tombstones in the DeletionPort sign step (N6a), and reacts to privacy.deletion.requested and cancelled with reversible actions only."
      - "Comment display filters blocked authors through F07.S02.M02 filterBlocked, and relay intake is rate limited per key and per network prefix with a per-proposal cap for keys registered less than 7 days ago (N7, N18)."
    data:
      - "PolicyProposal, decisions, co-signatures and authority lists: P0 signed statements."
      - "PolicyComment: P1 signed statements, pseudonymous author; authorId and body classified P1 by F10.S02.M02."
      - "TrustedPublisher and PendingStatement: P3 local records, never transmitted."
    retention:
      - "PolicyProposal, decision and authority list: RET-EVIDENCE."
      - "PolicyComment: RET-STANDARD; a withdrawn comment keeps only cid and tombstone; a hidden comment withdrawn by its author keeps only cid, hide record and reason key for 1 year (RET-AUDIT), never the body."
      - "PendingStatement: RET-SHORT, discarded 30 days after receipt."
    threats:
      - "T01 | Operator pushes a harmful rule without notice | mandatory 72 h comment period anchored to the relay receipt, expedited path needs reason and a verified co-signature, changelog public, users choose which publishers to trust"
      - "T02 | Self-approval by one operator | decider must be a different key delegated in the publisher's authority list at least 14 days before the proposal; this proves a different key, not a different person, and the UI says so"
      - "T03 | Equivocation or backdated decision | signatures over JCS, decision bound to the proposal cid, conflict detection, decidedAt is a claim and the relay receipt times decide the period"
      - "T04 | Comment flooding or harassment | 5 comments per member per proposal, 10 per hour per key, 30 per 24 h per /24 or /48 prefix, relay moderator can hide, local block filtering"
      - "T05 | Replay of an old approved decision for new targets, another publisher or other content | verify compares publisherId, targetRefs subset, the content digest, the anchored activation time and prior use"
      - "T06 | Sybil keys bypass per-key limits | per-prefix limits through RateLimitPort, at most 25 comments per proposal from keys registered less than 7 days ago (F12.S03.M04)"
      - "T07 | Backdated openedAt or forward-set decider clock creates a zero-length comment period | V11 uses relay receipts; openedAt earlier than the receipt minus 10 min is rejected"
      - "T08 | Sync ingestion or a malicious pack silently adds trust | trust changes only from the owner's trust dialog with fingerprint confirmation; ingestion can only hold statements as pending"
    abuse_controls:
      - "Publisher limit of 20 active proposals; comments rate limited by relay policy per key and per prefix."
      - "Hidden comments carry a reason key shown to the author."
      - "At most 10 user-trusted publishers per vault; at most 200 pending statements, oldest discarded first."
  observability_performance:
    requirements:
      - "No telemetry leaves the device (OBS-7); counters are local diagnostics."
      - "Relay comment acceptance follows OBS-1 to OBS-4."
      - "Verification must be fast because other modules call it before applying changes."
    metrics:
      - "classrup_governance_proposals_total{outcome} (local)"
      - "classrup_governance_comments_total{outcome} (relay and local)"
      - "classrup_governance_verify_duration_ms (local histogram)"
      - "classrup_governance_pending_statements{reason} (local gauge)"
    logs:
      - "info policy_proposal.decided {proposalId, outcome, correlationId} in local diagnostics."
      - "warn policy_proposal.conflicted {proposalId, conflictCount, correlationId}; never comment bodies."
    budgets:
      - "verify p95 <= 20 ms with cached statements; receive p95 <= 80 ms including signature verification on Moto G-class hardware."
      - "Relay comment accept p95 <= 300 ms at 50 req/s."
      - "Proposal list of 50 items p95 <= 100 ms."
  contract_and_acceptance_tests:
    requirements:
      - "Every requirement is covered by at least one automated test."
      - "Contract tests validate statements, commands and events against the registry and verify signatures."
      - "Time-based behaviour is tested with injected clocks for vault and relay separately."
    fixtures: "Publisher vault P (key KP), decider vault D (key KD listed as decider 30 days before), co-signer vault C (KC listed as cosigner), late key KL listed 3 days before the proposal, member vaults M1 and M2, third vault V, relay stub R with its own clock and receipt key, 200 generated keys from 203.0.113.0/24, clock 2026-11-04T10:00:00Z."
    tests:
      - "T01 | unit | 01.R01,02.R01,02.R02 | draft a proposal with valid and invalid fields | stored with revision 1 and changeDigest; invalid length, target or change keys give documented error"
      - "T02 | unit | 01.R02,01.R03,02.R03 | violate each rule V01-V16 | documented error code returned; no statement produced or accepted"
      - "T03 | property | 03.R01,03.R03 | random command, receive and clock sequences in authoring and mirror vaults | only declared transitions; conflicted never leaves; a decision is never reversed"
      - "T04 | integration | 03.R02,02.R03,02.R04 | comment accepted by relay clock after the publisher clock ended; publisher clock skewed by 2 days | relay receipt decides acceptance and commentEndsAt = proposal receipt + period; UI labels other times as claims"
      - "T05 | contract | 04.R01,04.R02,04.R06,09.R02 | open, request_cosign, cosign, decide, withdraw, authority_list release, post and withdraw comment, receive | statements validate against their schemas and F11.S01.M01 registry rows (audience, signer role, resolution, maxAge); every signing command returns syncState prepared and takes relayIds"
      - "T06 | integration | 04.R03,02.R03,02.R04 | verify with the exact targets, a subset, another target, publisher B citing publisher A's decision, a changed digest, asOf 31 days after the decision anchor, a prior decision cid | valid only for subset with matching publisher and digest inside the window; reasons target_mismatch, publisher_mismatch, content_mismatch, expired and already_used"
      - "T07 | abuse | 05.R01,05.R03,01.R05 | proposer decides own proposal; KL decides; an unlisted key decides; untrusted publisher decision | GOVERNANCE_PROPOSAL_SELF_DECISION or decider_unauthorized; statements quarantined"
      - "T08 | abuse | 05.R02,07.R03 | non-registered key comments; sixth comment; 11 comments in an hour; moderator hides; anonymous relay_list | relay refuses; GOVERNANCE_COMMENT_LIMIT; RATE_LIMITED; hide affects that relay only; relay_list returns UNAUTHENTICATED; notifications carry only reference and template key"
      - "T09 | integration | 06.R01,06.R02 | replay decide with the same key; crash after signing in the decider vault | one decision statement; consistent state after restart; no other vault changed"
      - "T10 | integration | 06.R03,03.R04 | two conflicting decisions delivered to a receiver | proposal marked conflicted; verify returns false with reason conflicted; decided event with outcome conflicted"
      - "T11 | chaos | 06.R04 | relay down while a comment is posted and a decision is queued; relay recovers; later decision lists the comment cid | states prepared, then transport_acknowledged labelled 'accepted for hosting by relay R' on the receipt, then peer_accepted only after the verified decision lists the cid"
      - "T12 | abuse | 07.R01,07.R02,07.R03 | scan notifications, logs and exports; assert UI strings | no comment content in notifications or logs; retention classes as specified; hidden comment kept for audit; comment form shows 'pseudonymity is not anonymity'"
      - "T13 | load | 08.R01,08.R02,08.R03 | 1 000 comments on Moto G profile, relay at 50 req/s | verify p95 <= 20 ms, receive p95 <= 80 ms, relay p95 <= 300 ms, no telemetry"
      - "T14 | unit | 09.R01,09.R03 | traceability tool run | every PS-147 requirement maps to a passing test"
      - "T15 | integration | 10.R01,10.R02,10.R03 | export, import to fresh vault, import tampered decision | proposals, decisions, authority lists and trusted publishers round-trip; tampered statement quarantined"
      - "T16 | a11y | 01.R01 | axe run on proposal detail, comment form and trust dialog | zero serious or critical issues; keyboard-only commenting works"
      - "T17 | integration | 03.R04,06.R02,06.R03 | publisher P withdraws while decider D, offline, approves; deliver both to third vault V in both orders | V marks conflicted with both cids in either order; verify returns conflicted; a new proposal is required"
      - "T18 | abuse | 02.R04,04.R03,03.R02 | proposal with openedAt backdated by 3 days; decision received 1 h after the proposal receipt; decision without a receipt | openedAt rejected (below receipt - 10 min); verify returns period_not_elapsed for both decisions"
      - "T19 | abuse | 07.R05 | 200 fresh keys from one /24 each comment on one proposal; a blocked author comments | at most 25 accepted, the rest RATE_LIMITED; the blocked author's comment is dropped silently from comment.list"
      - "T20 | integration | 07.R04,04.R02 | author withdraws a comment; DeletionPort plan and sign step for a deleting principal with 3 comments; privacy.deletion.requested then cancelled | tombstone signed; relay removes the body and returns tombstone stubs in relay_list; mirrors delete it; sign step signs 3 tombstones; posting paused then resumed"
      - "T21 | integration | 01.R04,03.R05,04.R05 | untrusted pack held; trust added from the dialog; sync ingestion calls trusted_publisher.add; another pending item expires; owner refuses one | held item applied through PendingApplyPort; ingestion call FORBIDDEN; expired item discarded after 30 days; refused item refused"
      - "T22 | unit | 01.R05,05.R04 | expedited proposal without co-signature, with a co-signature by KC, with a co-signature by an unlisted key; inspect the proposal detail UI string | GOVERNANCE_PROPOSAL_PERIOD_INVALID, accepted, rejected; UI shows 'a different key, not proof of a different person'"
      - "T23 | contract | 04.R04 | decided event delivered to an F12.S02.M03 fixture for targetType platform_policy | payload validates; fixture builds a draft PolicyRule from proposedChange without calling get"
    acceptance:
      - All tests T01-T23 pass in CI.
      - No policy change is applied by a consuming module without a verified approved decision from a delegated key different from the publisher, for that publisher, those targets and that exact content, at an anchored activation time inside the 30-day window.
      - The UI never presents a proposal decision as binding beyond the publishers a user trusts, times from other parties are labelled as claims, and contradicting statements are shown as conflicted.
  import_export_backup_rollback:
    requirements:
      - "The user export contains proposals, decisions and authority lists from trusted publishers, own comments, the trusted-publisher list, pending statements and, for publishers, their drafts and signing history."
      - "Import re-verifies every signature, role, anchored receipt and the conflict check; failing statements are quarantined."
      - "Schema changes follow expand/contract and keep v1 readable for 180 days."
    export: "Sections governance.policy_proposals, governance.policy_comments, governance.trusted_publishers and governance.pending_statements in classrup-export/v1 through ExportSectionPort, one line per record (schemas classrup.governance.policy_proposal/v1, classrup.governance.policy_comment/v1, classrup.governance.trusted_publisher/v1, classrup.governance.pending_statement/v1) plus signed statements and receipts."
    import: "Signatures, receipts and authority-list delegation re-verified; decisions keep their anchored validUntil and verify still answers for content activated inside the window; conflicting statements import flagged conflicted; trusted publishers are restored only after the owner confirms each fingerprint in the trust dialog."
    backup: "Vault export is the primary backup (IOX-6); the publisher's relay holds public copies with receipts that can be re-fetched by any vault through relay_get."
    migration_rollback: "Additive optional fields only in v1; rollback is by reinstalling the previous release; published statements stay valid because their schemas are unchanged."
