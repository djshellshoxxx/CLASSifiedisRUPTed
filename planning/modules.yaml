- {id: F01.S03.M02, ps: PS-009, path: 01_LocalBazaar/03_inventory/mod_variants, title: "Listing variants", code: packages/bazaar/src/inventory/variants, owns: [Variant], emits: [bazaar.variant.changed], resp: "Size/colour/condition variants each with own price and quantity; max 50 per listing."}
- {id: F01.S04.M01, ps: PS-011, path: 01_LocalBazaar/04_pricing/mod_offers, title: "Purchase offers", code: packages/bazaar/src/pricing/offers, owns: [Offer], emits: [bazaar.offer.made, bazaar.offer.accepted, bazaar.offer.rejected, bazaar.offer.withdrawn, bazaar.offer.expired], resp: "Buyer offers on sell listings with Money amount, expiry (default 48 h), acceptance creates inventory hold and Deal handoff to F09 settlement."}
